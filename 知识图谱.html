<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>技术栈知识图谱 · 重要程度标注</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0a0f1e;
    --line:rgba(255,255,255,.075);
    --card:rgba(255,255,255,.035);
    --card-hover:rgba(255,255,255,.062);
    --text:#e4ebf5;
    --text2:#94a3b8;
    --text3:#64748b;
    --dw:400px;
    --lvm:#F06292;
    --lvk:#FFB74D;
    --lvu:#64748b;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);
    --sar:env(safe-area-inset-right,0px);
  }
  html{-webkit-text-size-adjust:100%;}
  html,body{height:100%;overscroll-behavior:none;}
  body{
    background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    padding-left:var(--sal);padding-right:var(--sar);
  }

  /* ============ 顶栏 ============ */
  .topbar{
    flex:none;height:calc(60px + var(--sat));
    padding:var(--sat) 24px 0;
    display:flex;align-items:center;gap:16px;
    border-bottom:1px solid var(--line);
    background:rgba(10,15,30,.94);backdrop-filter:blur(12px);z-index:20;
  }
  .logo{
    width:32px;height:32px;border-radius:9px;flex:none;
    background:linear-gradient(135deg,#22d3ee,#8b5cf6);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;color:#fff;letter-spacing:-.5px;
  }
  .tabs{display:flex;gap:4px;background:rgba(255,255,255,.04);padding:3px;border-radius:10px;flex:none;}
  .tab{
    padding:6px 15px;border-radius:7px;border:none;cursor:pointer;
    font-family:inherit;font-size:12.5px;font-weight:500;
    background:transparent;color:var(--text3);transition:.18s;
    white-space:nowrap;
  }
  .tab:hover{color:var(--text2);}
  .tab.active{
    background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(139,92,246,.2));
    color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06) inset;
  }
  .spacer{flex:1;}
  .search{position:relative;}
  .search input{
    width:280px;padding:8px 32px 8px 13px;border-radius:9px;font-size:13px;outline:none;
    border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);transition:.18s;
  }
  .search input::placeholder{color:#5b6a89;}
  .search input:focus{border-color:#22d3ee;background:rgba(34,211,238,.06);}
  .search .clr{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(255,255,255,.1);color:var(--text2);font-size:12px;line-height:1;
    display:none;align-items:center;justify-content:center;padding:0;
  }
  .search.has-val .clr{display:flex;}

  /* ============ 工具栏 ============ */
  .toolbar{
    flex:none;display:flex;align-items:center;gap:14px;
    padding:9px 24px;border-bottom:1px solid var(--line);
    background:rgba(10,15,30,.6);overflow-x:auto;scrollbar-width:none;
  }
  .toolbar::-webkit-scrollbar{display:none;}
  .lf-group{display:flex;gap:4px;background:rgba(255,255,255,.035);padding:3px;border-radius:8px;flex:none;}
  .lf{
    padding:5px 12px;border-radius:6px;border:none;cursor:pointer;
    font-family:inherit;font-size:12px;background:transparent;color:var(--text3);
    transition:.16s;white-space:nowrap;
  }
  .lf:hover{color:var(--text2);}
  .lf.active{background:rgba(34,211,238,.14);color:#7dd3fc;}
  .legend{display:flex;gap:14px;align-items:center;flex:none;}
  .lg{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text3);}
  .lg i{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .lg b{color:var(--text2);font-weight:600;font-size:11.5px;}
  .lg.m i{background:var(--lvm);box-shadow:0 0 6px rgba(240,98,146,.5);}
  .lg.k i{background:var(--lvk);box-shadow:0 0 6px rgba(255,183,77,.4);}
  .lg.u i{background:var(--lvu);}

  /* ============ 域导航 ============ */
  nav.chips{
    flex:none;display:flex;gap:6px;padding:10px 24px;
    overflow-x:auto;border-bottom:1px solid var(--line);
    scrollbar-width:none;background:rgba(10,15,30,.4);
    -webkit-overflow-scrolling:touch;
  }
  nav.chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;display:flex;align-items:center;gap:6px;
    padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;
    color:var(--text2);border:1px solid var(--line);background:transparent;
    transition:.18s;white-space:nowrap;font-family:inherit;
  }
  .chip .cdot{width:6px;height:6px;border-radius:50%;background:var(--c);}
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.2);}
  .chip.active{color:var(--text);border-color:var(--c);background:var(--ca14);}

  /* ============ 工作区 ============ */
  .workspace{flex:1;display:flex;min-height:0;}
  .content{
    position:relative;flex:1;min-width:0;overflow-y:auto;
    padding:0 24px 140px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;
  }
  .content::-webkit-scrollbar{width:9px;}
  .content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:5px;border:3px solid var(--bg);}
  .content::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.18);}

  .section{padding-top:6px;}
  .sec-head{
    position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:18px 0 12px;background:var(--bg);box-shadow:0 14px 18px -12px var(--bg);
  }
  .sec-head .sdot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;}
  .sec-head h2{font-size:13.5px;font-weight:600;letter-spacing:.3px;color:#cbd7e8;}
  .sec-head .scount{font-size:11px;color:var(--text3);background:rgba(255,255,255,.05);padding:1.5px 8px;border-radius:20px;}
  .sec-head .sline{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent);}

  .grid{display:grid;gap:11px;padding-bottom:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}

  /* ============ 卡片 ============ */
  .card{
    position:relative;display:flex;flex-direction:column;
    padding:13px 15px 12px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);
    cursor:pointer;scroll-margin-top:70px;
    transition:background .18s,border-color .18s,opacity .22s,transform .18s,box-shadow .18s;
  }
  .card:hover{background:var(--card-hover);border-color:rgba(255,255,255,.18);transform:translateY(-2px);}
  .card-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .card-top .cdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;}
  .card-top h3{font-size:14px;font-weight:600;letter-spacing:.2px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* 重要程度徽章 */
  .lv-badge{
    flex:none;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;
    letter-spacing:.3px;line-height:1.4;
  }
  .lv-badge[data-lv="m"]{color:#F06292;background:rgba(240,98,146,.14);border:1px solid rgba(240,98,146,.3);}
  .lv-badge[data-lv="k"]{color:#FFB74D;background:rgba(255,183,77,.13);border:1px solid rgba(255,183,77,.28);}
  .lv-badge[data-lv="u"]{color:#94a3b8;background:rgba(148,163,184,.1);border:1px solid rgba(148,163,184,.2);}

  .card-desc{
    font-size:11.5px;line-height:1.6;color:var(--text2);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    margin-bottom:10px;
  }

  .card-points{
    display:flex;flex-direction:column;gap:4px;
    padding-top:9px;margin-bottom:10px;
    border-top:1px solid rgba(255,255,255,.055);
  }
  .pt{
    position:relative;font-size:11.5px;line-height:1.55;color:#9fb0c9;
    padding-left:14px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .pt::before{
    content:'';position:absolute;left:2px;top:6.5px;
    width:5px;height:5px;border-radius:50%;
  }
  .pt[data-lv="m"]::before{background:var(--lvm);box-shadow:0 0 5px rgba(240,98,146,.45);}
  .pt[data-lv="k"]::before{background:var(--lvk);}
  .pt[data-lv="u"]::before{background:var(--lvu);opacity:.75;}
  .pt[data-lv="m"]{color:#c9d5e5;}
  .pt[data-lv="k"]{color:#a8b8d0;}
  .pt[data-lv="u"]{color:#7c8ba3;}
  .pt-more{font-size:10.5px;color:var(--text3);padding-left:14px;}
  .pm-mob{display:none;}

  .card-foot{
    display:flex;flex-wrap:wrap;gap:5px;align-items:center;
    margin-top:auto;padding-top:9px;border-top:1px solid rgba(255,255,255,.05);
  }
  .rtag{font-size:10.5px;color:var(--text3);padding:1.5px 7px;border-radius:5px;
    background:rgba(255,255,255,.045);white-space:nowrap;}
  .rtag.more{color:#5f7194;background:transparent;}

  /* 卡片状态 */
  .card.is-dim{opacity:.15;}
  .card.is-selected{border-color:var(--c);background:var(--ca11);
    box-shadow:0 0 0 1px var(--c),0 10px 28px -12px var(--c);}
  .card.is-related{border-color:var(--ca32);background:var(--ca05);}
  .card.is-match{border-color:var(--ca55);}

  /* ============ 详情面板 ============ */
  aside.detail{
    flex:none;width:0;overflow:hidden;position:relative;
    border-left:1px solid transparent;background:#0c1226;
    transition:width .3s cubic-bezier(.4,0,.2,1),border-color .3s;
  }
  aside.detail.open{width:var(--dw);border-left-color:var(--line);}
  .detail-inner{
    width:var(--dw);height:100%;overflow-y:auto;padding:22px 24px 60px;
    -webkit-overflow-scrolling:touch;
  }
  .detail-inner::-webkit-scrollbar{width:8px;}
  .detail-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;border:2px solid #0c1226;}
  .sheet-handle{display:none;}

  .close{
    position:absolute;top:14px;right:16px;width:26px;height:26px;border-radius:7px;
    border:1px solid var(--line);background:rgba(12,18,38,.9);color:var(--text3);
    font-size:15px;cursor:pointer;display:none;align-items:center;justify-content:center;
    transition:.18s;z-index:5;padding:0;
  }
  .close:hover{color:var(--text);border-color:rgba(255,255,255,.25);}
  aside.detail.open .close{display:flex;}

  .d-cat{
    display:inline-flex;align-items:center;gap:6px;font-size:11px;
    padding:3px 10px;border-radius:20px;margin-bottom:10px;
    color:var(--c);border:1px solid var(--ca32);background:var(--ca11);
  }
  .d-cat .cdot{width:6px;height:6px;border-radius:50%;background:var(--c);}
  .d-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
  .detail-inner h2{font-size:19px;font-weight:600;letter-spacing:.2px;}
  .d-desc{font-size:12.5px;line-height:1.85;color:var(--text2);margin-bottom:20px;}

  .d-label{
    font-size:11px;color:var(--text3);letter-spacing:.6px;
    display:flex;align-items:center;gap:8px;margin-bottom:11px;
  }
  .d-label::after{content:'';flex:1;height:1px;background:var(--line);}
  .d-label b{color:var(--c);font-weight:600;font-size:11px;}

  .kp-list{display:flex;flex-direction:column;gap:7px;margin-bottom:22px;}
  .kp{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 11px;border-radius:9px;
    background:rgba(255,255,255,.028);
    border:1px solid rgba(255,255,255,.05);
    font-size:12.5px;line-height:1.62;color:#b9c7dc;
    position:relative;
  }
  .kp::before{
    content:'';position:absolute;left:0;top:10px;bottom:10px;width:2px;
    border-radius:2px;
  }
  .kp[data-lv="m"]{background:rgba(240,98,146,.045);border-color:rgba(240,98,146,.13);}
  .kp[data-lv="m"]::before{background:var(--lvm);}
  .kp[data-lv="k"]::before{background:var(--lvk);}
  .kp[data-lv="u"]::before{background:var(--lvu);opacity:.6;}
  .kp-idx{
    flex:none;width:17px;height:17px;border-radius:5px;margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;
    color:var(--c);background:var(--ca15);
    border:1px solid var(--ca32);
  }
  .kp-text{flex:1;min-width:0;}
  .kp-lv{
    flex:none;font-size:9.5px;font-weight:600;padding:1px 6px;border-radius:4px;
    margin-top:1px;letter-spacing:.3px;
  }
  .kp-lv[data-lv="m"]{color:#F06292;background:rgba(240,98,146,.13);}
  .kp-lv[data-lv="k"]{color:#FFB74D;background:rgba(255,183,77,.12);}
  .kp-lv[data-lv="u"]{color:#94a3b8;background:rgba(148,163,184,.1);}

  .d-tags{display:flex;flex-wrap:wrap;gap:7px;}
  .tag{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:8px;font-size:12.5px;cursor:pointer;
    border:1px solid var(--line);background:rgba(255,255,255,.035);color:#b9c7dc;
    transition:.16s;font-family:inherit;
  }
  .tag .cdot{width:6px;height:6px;border-radius:50%;background:var(--c);}
  .tag:hover{color:#fff;border-color:var(--ca55);background:var(--ca11);}

  .d-empty h3{font-size:13.5px;color:#b9c7dc;margin-bottom:12px;font-weight:600;}
  .d-empty ul{list-style:none;display:flex;flex-direction:column;gap:9px;}
  .d-empty li{font-size:12.5px;color:var(--text3);line-height:1.75;padding-left:16px;position:relative;}
  .d-empty li::before{content:'';position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:#22d3ee;}
  .d-empty b{color:#8fa8cf;font-weight:600;}

  .no-result{padding:70px 0;text-align:center;color:var(--text3);font-size:13px;}

  /* ============ 遮罩 / 回顶 ============ */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);
    opacity:0;pointer-events:none;transition:opacity .3s;z-index:85;display:none;
  }
  .back-top{
    position:fixed;right:16px;bottom:calc(22px + var(--sab));
    width:42px;height:42px;border-radius:50%;
    border:1px solid rgba(255,255,255,.12);background:rgba(20,28,50,.88);
    backdrop-filter:blur(10px);color:#b9c7dc;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    opacity:0;transform:translateY(10px) scale(.9);pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:70;
    box-shadow:0 6px 20px rgba(0,0,0,.4);padding:0;font-size:16px;
  }
  .back-top.show{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .back-top:active{transform:scale(.9);}

  /* ============ 平板 ============ */
  @media (max-width:1200px){
    :root{--dw:350px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));}
  }
  @media (max-width:1024px){ .search input{width:210px;} }

  /* ============ 手机 ============ */
  @media (max-width:768px){
    .topbar{
      height:auto;
      /* App 内嵌浏览器顶部额外留白，避免内容贴边 */
      padding:calc(var(--sat) + 14px) 12px 10px;
      flex-wrap:wrap;gap:8px;align-items:center;
    }
    .logo{width:28px;height:28px;border-radius:8px;font-size:12px;}
    .tabs{order:2;margin-left:0;}
    .tab{padding:5px 12px;font-size:12px;}
    .spacer{display:none;}
    .search{order:3;flex:1 0 100%;min-width:0;}
    .search input{width:100%;padding:9px 34px 9px 13px;font-size:16px;border-radius:10px;}
    .search .clr{width:24px;height:24px;font-size:13px;right:6px;}

    .toolbar{padding:8px 12px;gap:10px;}
    .lf{padding:5px 10px;font-size:11.5px;}
    .legend{gap:10px;}
    .lg{font-size:11px;}
    .lg b{font-size:11px;}

    nav.chips{padding:8px 12px;gap:6px;}
    .chip{padding:5px 10px;font-size:11.5px;}

    .content{padding:0 12px calc(96px + var(--sab));}
    .sec-head{padding:14px 0 10px;}
    .sec-head h2{font-size:13px;}
    .grid{grid-template-columns:1fr;gap:9px;padding-bottom:10px;}

    .card{padding:13px 14px 12px;border-radius:13px;scroll-margin-top:60px;}
    .card:hover{transform:none;}
    .card:active{background:var(--card-hover);transform:scale(.988);}
    .card-top{margin-bottom:6px;}
    .card-top h3{font-size:14px;}
    .lv-badge{font-size:9.5px;padding:1.5px 6px;}
    .card-desc{font-size:12px;line-height:1.6;margin-bottom:9px;}
    .card-points{gap:5px;padding-top:9px;margin-bottom:9px;}
    .pt{font-size:12px;line-height:1.58;}
    .pt-extra{display:none;}
    .pm-desk{display:none;}
    .pm-mob{display:inline;}
    .card-foot{display:none;}

    aside.detail{
      position:fixed;left:0;right:0;bottom:0;top:auto;
      width:100%;height:auto;max-height:86vh;max-height:86dvh;
      display:flex;flex-direction:column;border-left:none;
      border-top:1px solid var(--line);border-radius:20px 20px 0 0;
      box-shadow:0 -22px 60px rgba(0,0,0,.62);
      transform:translateY(100%);
      transition:transform .36s cubic-bezier(.32,.72,0,1);
      z-index:90;padding-bottom:var(--sab);overflow:hidden;will-change:transform;
    }
    aside.detail.open{width:100%;transform:translateY(0);}

    .sheet-handle{
      display:flex;justify-content:center;align-items:center;
      height:28px;flex:none;touch-action:none;cursor:grab;
    }
    .sheet-handle span{
      width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.2);transition:background .2s;
    }
    .sheet-handle:active span{background:rgba(255,255,255,.38);}

    .detail-inner{width:100%;flex:1;padding:2px 20px calc(30px + var(--sab));overscroll-behavior:contain;}
    .detail-inner h2{font-size:18px;}
    .d-desc{font-size:12.5px;line-height:1.8;margin-bottom:18px;}
    .kp{padding:10px 12px;font-size:13px;line-height:1.68;}
    .d-tags{gap:8px;}
    .tag{padding:7px 13px;font-size:13px;}
    .close{top:2px;right:12px;width:30px;height:30px;font-size:16px;}
    .overlay{display:block;}
    .overlay.show{opacity:1;pointer-events:auto;}
    body.sheet-open .content{overflow:hidden;}
    .back-top{right:14px;bottom:calc(18px + var(--sab));width:44px;height:44px;}
  }

  @media (max-width:360px){
    .card{padding:12px;}
    .pt{font-size:11.5px;}
    .detail-inner{padding-left:16px;padding-right:16px;}
  }

  @media (max-width:900px) and (orientation:landscape) and (max-height:500px){
    aside.detail{max-height:94dvh;}
    .card-points{display:none;}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="java">Java 后端</button>
    <button class="tab" data-tab="agent">Agent 开发</button>
  </div>
  <div class="spacer"></div>
  <div class="search" id="searchWrap">
    <input id="search" placeholder="搜索技术 / 知识点 / 关键词" autocomplete="off">
    <button class="clr" id="clearBtn" title="清空">✕</button>
  </div>
</header>

<div class="toolbar">
  <div class="lf-group" id="levelFilter">
    <button class="lf active" data-level="all">全部</button>
    <button class="lf" data-level="m">只看核心</button>
    <button class="lf" data-level="m,k">核心 + 重点</button>
  </div>
  <div class="legend">
    <span class="lg m"><i></i>核心 <b id="cntM">0</b></span>
    <span class="lg k"><i></i>重点 <b id="cntK">0</b></span>
    <span class="lg u"><i></i>了解 <b id="cntU">0</b></span>
  </div>
</div>

<nav class="chips" id="chips"></nav>

<div class="workspace">
  <main class="content" id="content"></main>

  /* ==========================================================

  /* ==========================================================
   * 6. 工具
   * ========================================================== */

  function hexA(hex, a){
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`;
  }

  function applyColorVars(el, color){
    el.style.setProperty('--c', color);
    el.style.setProperty('--ca05', hexA(color, .05));
    el.style.setProperty('--ca11', hexA(color, .11));
    el.style.setProperty('--ca14', hexA(color, .14));
    el.style.setProperty('--ca15', hexA(color, .15));
    el.style.setProperty('--ca32', hexA(color, .32));
    el.style.setProperty('--ca55', hexA(color, .55));
  }

  function levelAllowed(lv){
    if (state.levelFilter === 'all') return true;
    return state.levelFilter.split(',').includes(lv);
  }

  /* ==========================================================
   * 7. 切换数据源
   * ========================================================== */

  function switchTab(tab){
    currentTab = tab;
    curCats = DATA[tab].cats;
    curNodes = DATA[tab].nodes;
    curLinks = DATA[tab].links;

    // 索引重建
    nodeById = new Map();
    adj = new Map();
    Object.keys(CAT_ORDER).forEach(k => delete CAT_ORDER[k]);

    curNodes.forEach(n => {
      n.name_lc = n.name.toLowerCase();
      n.kw_lc = (n.points || []).map(p => p[0]).join(' ').toLowerCase();
      n.desc_lc = n.desc.toLowerCase();
      nodeById.set(n.id, n);
      adj.set(n.id, new Set());
    });
    curLinks.forEach(([a, b]) => {
      if (nodeById.has(a) && nodeById.has(b)) {
        adj.get(a).add(b);
        adj.get(b).add(a);
      }
    });
    Object.keys(curCats).forEach(k => { CAT_ORDER[k] = true; });

    // 更新UI
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.tab === tab);
    });

    // 重置状态
    state.selected = null;
    state.query = '';
    searchEl.value = '';
    searchWrap.classList.remove('has-val');

    updateCounters();
    buildChips();
    buildContent();
    updateVisual();
    renderDetail(null);
  }

  function updateCounters(){
    let m = 0, k = 0, u = 0;
    curNodes.forEach(n => {
      if (n.lv === 'm') m++;
      else if (n.lv === 'k') k++;
      else u++;
    });
    cntM.textContent = m;
    cntK.textContent = k;
    cntU.textContent = u;
  }

  /* ==========================================================
   * 8. 构建内容
   * ========================================================== */

  function buildChips(){
    chipsEl.innerHTML = '';
    Object.keys(curCats).forEach(key => {
      const c = curCats[key];
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.dataset.cat = key;
      applyColorVars(btn, c.color);
      btn.innerHTML = `<span class="cdot"></span>${c.name}`;
      btn.addEventListener('click', () => {
        const sec = content.querySelector(`.section[data-cat="${key}"]`);
        if (sec) content.scrollTo({ top: sec.offsetTop - 4, behavior:'smooth' });
      });
      chipsEl.appendChild(btn);
    });
    const firstKey = Object.keys(curCats)[0];
    setActiveChip(firstKey);
  }

  function setActiveChip(key){
    chipsEl.querySelectorAll('.chip').forEach(el => {
      el.classList.toggle('active', el.dataset.cat === key);
    });
  }

  function buildContent(){
    const frag = document.createDocumentFragment();

    Object.keys(curCats).forEach(catKey => {
      const cat = curCats[catKey];
      const list = curNodes.filter(n => n.cat === catKey);
      if (!list.length) return;

      const sec = document.createElement('section');
      sec.className = 'section';
      sec.dataset.cat = catKey;
      applyColorVars(sec, cat.color);

      const head = document.createElement('div');
      head.className = 'sec-head';
      head.innerHTML = `
        <span class="sdot"></span>
        <h2>${cat.name}</h2>
        <span class="scount">${list.length} 项</span>
        <span class="sline"></span>`;
      sec.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'grid';

      list.forEach(n => {
        const relIds = [...adj.get(n.id)].map(id => nodeById.get(id));
        relIds.sort((a, b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));

        const shown = relIds.slice(0, 2)
          .map(r => `<span class="rtag">${r.name}</span>`).join('');
        const more = relIds.length > 2
          ? `<span class="rtag more">+${relIds.length - 2}</span>` : '';

        // 知识点预览：显示前 3 条，但尊重级别筛选
        const allPts = n.points || [];
        const filtered = allPts.filter(p => levelAllowed(p[1]));
        const visible = filtered.slice(0, 3);
        const ptsHtml = visible.map((p, i) =>
          `<div class="pt${i === 2 ? ' pt-extra' : ''}" data-lv="${p[1]}">${p[0]}</div>`
        ).join('') + (filtered.length > 3
          ? `<div class="pt-more">
               <span class="pm-desk">还有 ${filtered.length - 3} 个知识点 · 点击查看</span>
               <span class="pm-mob">还有 ${filtered.length - 2} 个知识点 · 点击查看</span>
             </div>` : '');

        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.id = n.id;
        card.dataset.lv = n.lv;
        card.innerHTML = `
          <div class="card-top">
            <span class="cdot"></span>
            <h3>${n.name}</h3>
            <span class="lv-badge" data-lv="${n.lv}">${LV[n.lv].name}</span>
          </div>
          <p class="card-desc">${n.desc}</p>
          <div class="card-points">${ptsHtml}</div>
          <div class="card-foot">${shown}${more}</div>`;

        card.addEventListener('click', () => selectNode(n.id, false));
        grid.appendChild(card);
      });

      sec.appendChild(grid);
      frag.appendChild(sec);
    });

    content.innerHTML = '';
    content.appendChild(frag);
  }

  /* ==========================================================
   * 9. 选择 & 视觉
   * ========================================================== */

  function selectNode(id, scrollTo){
    state.selected = (state.selected === id) ? null : id;
    updateVisual();
    renderDetail(state.selected);
    if (state.selected && scrollTo){
      const el = content.querySelector(`.card[data-id="${id}"]`);
      if (el) el.scrollIntoView({
        behavior:'smooth',
        block: isMobile() ? 'start' : 'center'
      });
    }
  }

  function clearSelection(){
    state.selected = null;
    updateVisual();
    renderDetail(null);
  }

  function matchNode(n, q){
    if (!q) return true;
    return n.name_lc.includes(q)
        || n.id.includes(q)
        || n.kw_lc.includes(q)
        || n.desc_lc.includes(q);
  }

  function updateVisual(){
    const q = state.query;
    const sel = state.selected;
    const rel = sel ? adj.get(sel) : null;
    let visibleCount = 0;

    document.querySelectorAll('.card').forEach(el => {
      const id = el.dataset.id;
      const node = nodeById.get(id);
      let cls = 'card';

      // 级别筛选优先
      if (!levelAllowed(node.lv)){
        cls += ' is-dim';
      } else if (q){
        if (matchNode(node, q)){ cls += ' is-match'; visibleCount++; }
        else cls += ' is-dim';
      } else if (sel){
        if (id === sel) cls += ' is-selected';
        else if (rel.has(id)) cls += ' is-related';
        else cls += ' is-dim';
      } else {
        visibleCount++;
      }

      el.className = cls;
    });

    // 分组隐藏
    document.querySelectorAll('.section').forEach(sec => {
      const has = sec.querySelector('.card.is-match');
      const hasVisible = sec.querySelector('.card:not(.is-dim)');
      sec.style.display = ((q && !has) || (!q && !hasVisible)) ? 'none' : '';
    });

    let tip = content.querySelector('.no-result');
    if (q && visibleCount === 0){
      if (!tip){
        tip = document.createElement('div');
        tip.className = 'no-result';
        tip.textContent = '没有匹配的技术点，试试其他关键词';
        content.appendChild(tip);
      }
    } else if (tip) {
      tip.remove();
    }
  }

  /* ==========================================================
   * 10. 详情面板
   * ========================================================== */

  function openSheet(){
    if (isMobile()){
      document.body.classList.add('sheet-open');
      overlay.classList.add('show');
    }
  }
  function closeSheet(){
    document.body.classList.remove('sheet-open');
    overlay.classList.remove('show');
  }

  function renderDetail(id){
    if (!id){
      detailEl.classList.remove('open');
      closeSheet();
      detailIn.innerHTML = `
        <div class="d-empty">
          <h3>使用提示</h3>
          <ul>
            <li>技术卡片与知识点均标注<b>重要程度</b>：核心 / 重点 / 了解</li>
            <li>顶部工具栏可按级别<b>筛选</b>：只看核心 / 核心 + 重点</li>
            <li>点击卡片，展开该技术的<b>完整知识点清单</b></li>
            <li>搜索支持<b>技术名 / 关键词 / 知识点内容</b></li>
            <li>点击详情中的关联标签可<b>逐级跳转</b></li>
          </ul>
        </div>`;
      return;
    }

    const n = nodeById.get(id);
    const cat = curCats[n.cat];
    applyColorVars(detailIn, cat.color);

    const relIds = [...adj.get(id)].map(i => nodeById.get(i));
    relIds.sort((a, b) => a.cat.localeCompare(b.cat) || a.name.localeCompare(b.name));

    const points = (n.points || []).filter(p => levelAllowed(p[1]));
    // 详情里不隐藏被筛选掉的，但显示为淡化（可选：这里保持简单，只显示被允许的）
    // 为方便学习，详情显示全部知识点，但用颜色区分
    const allPoints = n.points || [];

    detailIn.innerHTML = `
      <div class="d-cat">
        <span class="cdot"></span>${cat.name}
      </div>
      <div class="d-title">
        <h2>${n.name}</h2>
        <span class="lv-badge" data-lv="${n.lv}">${LV[n.lv].name}</span>
      </div>
      <p class="d-desc">${n.desc}</p>
      <button class="tag kg-quiz-btn" data-id="${n.id}" style="margin:0 0 18px;">🔗 查看相关面试题</button>

      <div class="d-label">核心知识点 <b>${allPoints.length}</b></div>
      <div class="kp-list">
        ${allPoints.map((p, i) => `
          <div class="kp" data-lv="${p[1]}">
            <span class="kp-idx">${i + 1}</span>
            <span class="kp-text">${p[0]}</span>
            <span class="kp-lv" data-lv="${p[1]}">${LV[p[1]].name}</span>
          </div>`).join('')}
      </div>

      <div class="d-label">关联技术 <b>${relIds.length}</b></div>
      <div class="d-tags">
        ${relIds.map(r => `
          <button class="tag" data-id="${r.id}"
            style="--c:${curCats[r.cat].color};--ca11:${hexA(curCats[r.cat].color,.11)};--ca55:${hexA(curCats[r.cat].color,.55)}">
            <span class="cdot"></span>${r.name}
          </button>`).join('')}
      </div>`;

    detailIn.querySelectorAll('.tag').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selected = btn.dataset.id;
        updateVisual();
        renderDetail(state.selected);
        const el = content.querySelector(`.card[data-id="${state.selected}"]`);
        if (el) el.scrollIntoView({
          behavior:'smooth',
          block: isMobile() ? 'start' : 'center'
        });
      });
    });

    detailEl.classList.add('open');
    detailIn.scrollTop = 0;
    openSheet();

    const quizBtn = detailIn.querySelector('.kg-quiz-btn');
    if (quizBtn){
      quizBtn.addEventListener('click', () => {
        window.parent.postMessage({type:'node-locate', graphTab: currentTab, nodeId: quizBtn.dataset.id}, '*');
      });
    }
  }

  /* ==========================================================
   * 11. 搜索
   * ========================================================== */

  searchEl.addEventListener('input', () => {
    state.query = searchEl.value.trim().toLowerCase();
    searchWrap.classList.toggle('has-val', !!state.query);
    // 搜索时自动切到全部级别，避免知识点被隐藏
    if (state.query && state.levelFilter !== 'all'){
      state.levelFilter = 'all';
      levelFilterEl.querySelectorAll('.lf').forEach(b => {
        b.classList.toggle('active', b.dataset.level === 'all');
      });
      buildContent();
      // 重绑定：buildContent 已重新生成，不需要额外
    }
    updateVisual();
  });

  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Enter'){
      const hit = curNodes.find(n => levelAllowed(n.lv) && matchNode(n, state.query));
      if (hit){
        const el = content.querySelector(`.card[data-id="${hit.id}"]`);
        if (el) el.scrollIntoView({ behavior:'smooth', block:'center' });
      }
      searchEl.blur();
    }
    if (e.key === 'Escape'){
      searchEl.value = '';
      state.query = '';
      searchWrap.classList.remove('has-val');
      updateVisual();
      searchEl.blur();
    }
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    searchEl.value = '';
    state.query = '';
    searchWrap.classList.remove('has-val');
    updateVisual();
    searchEl.focus();
  });

  document.getElementById('closeBtn').addEventListener('click', clearSelection);
  overlay.addEventListener('click', clearSelection);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.activeElement !== searchEl) clearSelection();
  });

  /* ==========================================================
   * 12. Tab 切换
   * ========================================================== */

  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('.tab');
    if (!btn || btn.dataset.tab === currentTab) return;
    switchTab(btn.dataset.tab);
  });

  /* ==========================================================
   * 13. 级别筛选
   * ========================================================== */

  levelFilterEl.addEventListener('click', e => {
    const btn = e.target.closest('.lf');
    if (!btn) return;
    state.levelFilter = btn.dataset.level;
    levelFilterEl.querySelectorAll('.lf').forEach(b => {
      b.classList.toggle('active', b === btn);
    });
    buildContent();
    updateVisual();
    if (state.selected){
      // 如果选中项不再符合筛选条件，清除
      const node = nodeById.get(state.selected);
      if (node && !levelAllowed(node.lv)) clearSelection();
    }
  });

  /* ==========================================================
   * 14. 底部抽屉拖拽
   * ========================================================== */

  let dragStartY = 0, dragCurY = 0, dragging = false;

  sheetHandle.addEventListener('touchstart', e => {
    if (!isMobile()) return;
    dragging = true;
    dragStartY = dragCurY = e.touches[0].clientY;
    detailEl.style.transition = 'none';
  }, { passive:true });

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    dragCurY = e.touches[0].clientY;
    const dy = Math.max(0, dragCurY - dragStartY);
    detailEl.style.transform = `translateY(${dy}px)`;
  }, { passive:true });

  document.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const dy = dragCurY - dragStartY;
    detailEl.style.transition = 'transform .3s cubic-bezier(.32,.72,0,1)';

    if (dy > 90){
      detailEl.style.transform = 'translateY(100%)';
      setTimeout(() => {
        detailEl.style.transition = '';
        detailEl.style.transform = '';
        clearSelection();
      }, 300);
    } else {
      detailEl.style.transform = 'translateY(0)';
      setTimeout(() => {
        detailEl.style.transition = '';
        detailEl.style.transform = '';
      }, 300);
    }
  }, { passive:true });

  /* ==========================================================
   * 15. 回到顶部
   * ========================================================== */

  content.addEventListener('scroll', () => {
    backTop.classList.toggle('show', content.scrollTop > 420);
  }, { passive:true });

  backTop.addEventListener('click', () => {
    content.scrollTo({ top: 0, behavior:'smooth' });
  });

  /* ==========================================================
   * 16. 滚动同步导航
   * ========================================================== */

  let scrollTick = false;
  content.addEventListener('scroll', () => {
    if (scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(() => {
      scrollTick = false;
      const contentTop = content.getBoundingClientRect().top;
      let current = Object.keys(curCats)[0];

      Object.keys(curCats).forEach(key => {
        const sec = content.querySelector(`.section[data-cat="${key}"]`);
        if (!sec || sec.style.display === 'none') return;
        const r = sec.getBoundingClientRect();
        if (r.top - contentTop <= 80) current = key;
      });
      setActiveChip(current);
    });
  }, { passive:true });

  /* ==========================================================
   * 17. 断点变化
   * ========================================================== */

  function syncBreakpoint(){
    if (isMobile()){
      searchEl.placeholder = '搜索技术 / 知识点';
    } else {
      searchEl.placeholder = '搜索技术 / 知识点 / 关键词';
      detailEl.style.transition = '';
      detailEl.style.transform = '';
      closeSheet();
    }
  }

  if (mqMobile.addEventListener){
    mqMobile.addEventListener('change', () => { syncBreakpoint(); renderDetail(state.selected); });
  } else if (mqMobile.addListener){
    mqMobile.addListener(() => { syncBreakpoint(); renderDetail(state.selected); });
  }

  /* ==========================================================
   * 18. 启动
   * ========================================================== */

  switchTab('java');
  syncBreakpoint();

  /* ================= 面试题联动（自动注入，单向：图谱 -> 题库） ================= */
  let __kgToastEl = null;
  function showKgToast(msg){
    if(!__kgToastEl){
      __kgToastEl = document.createElement('div');
      __kgToastEl.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:rgba(20,25,40,.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:999;pointer-events:none;transition:opacity .25s;opacity:0;max-width:80vw;text-align:center;';
      document.body.appendChild(__kgToastEl);
    }
    __kgToastEl.textContent = msg;
    __kgToastEl.style.opacity = '1';
    clearTimeout(__kgToastEl.__t);
    __kgToastEl.__t = setTimeout(() => { __kgToastEl.style.opacity = '0'; }, 2200);
  }
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'kg-not-found'){
      showKgToast('该知识点在题库中暂无标注的关联题目');
    }
  });

})();
</script>
</body>
</html>
