<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大模型应用开发 · Java 高级岗位面试题刷题</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel-bg: #ffffff;
    --border: #e3e5e9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #3b5bdb;
    --primary-light: #e8ecfc;
    --code-bg: #282c34;
    --code-text: #e6e6e6;
    --table-head-bg: #f0f2f7;
    --sidebar-w: 300px;
    --topbar-h: 56px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: relative;
  }

  /* ---------- Top bar ---------- */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    z-index: 30;
  }

  #hamburger {
    display: none;
    width: 36px; height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 8px;
    align-items: center;
    justify-content: center;
  }
  #hamburger:active { background: var(--primary-light); }
  #hamburger span, #hamburger span::before, #hamburger span::after {
    content: "";
    display: block;
    width: 20px; height: 2px;
    background: var(--text);
    position: relative;
    transition: 0.2s;
  }
  #hamburger span::before { position: absolute; top: -6px; }
  #hamburger span::after { position: absolute; top: 6px; }

  #topbar-title {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #topbar-progress {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    width: var(--sidebar-w);
    height: calc(100vh - var(--topbar-h));
    overflow-y: auto;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    padding: 8px 0 24px;
    z-index: 15;
  }

  .group-block { border-bottom: 1px solid #f0f1f4; }

  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    user-select: none;
  }
  .group-header:hover { background: #fafbfc; }
  .group-header .chevron {
    flex-shrink: 0;
    width: 14px; height: 14px;
    transition: transform 0.15s;
    color: var(--text-muted);
  }
  .group-block.open .chevron { transform: rotate(90deg); }
  .group-header .gname { flex: 1; line-height: 1.4; }
  .group-header .gcount {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 10px;
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .question-list { display: none; padding: 2px 0 6px; }
  .group-block.open .question-list { display: block; }

  .question-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 30px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1.4;
  }
  .question-item:hover { background: var(--primary-light); color: var(--text); }
  .question-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }
  .question-item .qtag {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    color: inherit;
    opacity: 0.75;
  }
  .question-item .qsnippet {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 20;
  }

  /* ---------- Main content ---------- */
  #main {
    margin-top: var(--topbar-h);
    margin-left: var(--sidebar-w);
    min-height: calc(100vh - var(--topbar-h));
    display: flex;
    justify-content: center;
    padding: 28px 20px 100px;
    /* padding-bottom is recalculated in JS to exactly clear #bottom-nav + 100px */
  }

  #card {
    width: 100%;
    max-width: 760px;
  }

  #breadcrumb {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  #question-box {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 16px;
  }

  #qnum-badge {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  #qtext {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
  }

  #reveal-btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #reveal-btn:hover { background: #2f4bc4; }
  #reveal-btn.is-shown { background: #eef0f5; color: var(--text-muted); }

  #answer-box {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  #answer-box.visible { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px);} to { opacity: 1; transform: translateY(0);} }

  #answer-box .answer-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .answer-content p { line-height: 1.75; margin: 0 0 12px; font-size: 14.5px; }
  .answer-content ul, .answer-content ol { margin: 0 0 12px; padding-left: 22px; line-height: 1.75; font-size: 14.5px; }
  .answer-content li { margin-bottom: 4px; }
  .answer-content strong { color: var(--text); font-weight: 700; }
  .answer-content code {
    background: #eef0f5;
    color: #c0356c;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: "SF Mono", Consolas, Menlo, monospace;
  }
  .answer-content pre {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0 0 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .answer-content pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }
  .answer-content .table-wrap { overflow-x: auto; margin: 0 0 14px; -webkit-overflow-scrolling: touch; }
  .answer-content table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .answer-content th, .answer-content td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
    line-height: 1.5;
  }
  .answer-content th { background: var(--table-head-bg); font-weight: 700; white-space: nowrap; }
  .answer-content code { word-break: break-word; }

  /* ---------- Bottom nav ---------- */
  #bottom-nav {
    position: fixed;
    left: var(--sidebar-w);
    right: 0;
    bottom: 0;
    background: var(--panel-bg);
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    z-index: 25;
  }
  #bottom-nav .nav-inner {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 10px;
  }
  .nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn:not(:disabled):hover { border-color: var(--primary); color: var(--primary); }
  .nav-btn.next { background: var(--primary); color: #fff; border-color: var(--primary); }
  .nav-btn.next:not(:disabled):hover { background: #2f4bc4; }

  /* ---------- Mobile layout ---------- */
  @media (max-width: 768px) {
    :root { --sidebar-w: 82vw; }
    #hamburger { display: flex; }
    #sidebar {
      z-index: 21;
      max-width: 320px;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      box-shadow: 2px 0 16px rgba(0,0,0,0.12);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-backdrop.open { display: block; }
    #main { margin-left: 0; padding: 18px 14px 100px; }
    #question-box, #answer-box { padding: 16px 16px; }
    #qtext { font-size: 16px; }
    #bottom-nav { left: 0; padding: 8px 12px; }
    #topbar-title { font-size: 14px; }
  }


    .freq-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 1px 8px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
      white-space: nowrap;
    }
    .freq-badge.freq-high { background: #fdecec; color: #d64545; }
    .freq-badge.freq-mid { background: #e8ecfc; color: #3b5bdb; }
    .freq-badge.freq-low { background: #eef0f2; color: #6b7280; }
    .question-item .freq-badge { font-size: 10px; padding: 0 6px; }
    #qtext .freq-badge { font-size: 13px; }
    </style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="hamburger" aria-label="打开题目导航"><span></span></button>
    <div id="topbar-title">Java 高级岗位面试题刷题</div>
    <div id="topbar-progress"></div>
  </header>

  <div id="sidebar-backdrop"></div>

  <nav id="sidebar"></nav>

  <main id="main">
    <div id="card">
      <div id="breadcrumb"></div>
      <div id="question-box">
        <span id="qnum-badge"></span>
        <div id="qtext"></div>
      </div>
      <button id="reveal-btn">查看答案</button>
      <div id="answer-box">
        <div class="answer-label">答案</div>
        <div class="answer-content" id="answer-content"></div>
      </div>
    </div>
  </main>

  <div id="bottom-nav">
    <div class="nav-inner">
      <button class="nav-btn prev" id="prev-btn">← 上一题</button>
      <button class="nav-btn next" id="next-btn">下一题 →</button>
    </div>
  </div>
</div>


<script>
var QUIZ_DATA = {"groups": [{"name": "Java 基础与语言特性", "questions": [{"qnum": 1, "qtext": "Java 的多态是怎么实现的？重载和重写在多态机制里分别扮演什么角色？", "freq": "高频", "answerHtml": "<p>多态在 Java 里分编译期和运行期两种。编译期多态说的其实是重载（Overload），同一个类里方法名相同、参数列表不同，编译器在编译阶段就能根据实参类型确定调用哪个重载版本，本质上是静态绑定。运行期多态才是真正意义上的多态，靠的是重写（Override）加上动态绑定：子类重写父类的方法后，父类引用指向子类对象时，JVM 在运行时根据对象的实际类型去查找方法实现，而不是看引用声明的类型。</p>\n<p>底层实现依赖的是虚方法表（vtable）。每个类在加载时会生成一张方法表，普通方法调用编译成 <code>invokevirtual</code> 指令，运行时通过对象头找到实际类的方法表，再按索引定位到具体实现，这个过程叫动态分派。而 <code>private</code>、<code>static</code>、<code>final</code> 方法以及构造方法不能被重写，编译器直接用 <code>invokespecial</code> 或 <code>invokestatic</code> 静态绑定，所以不存在多态。</p>\n<pre><code>Animal a = new Dog(); // 编译期类型 Animal，运行期类型 Dog\na.speak(); // 实际调用 Dog.speak()，由 vtable 决定</code></pre>\n<p><strong>记忆点：重载看参数表在编译期定，重写看对象实际类型在运行期查表定。</strong></p>"}, {"qnum": 2, "qtext": "接口和抽象类怎么选？Java 8 之后接口能有默认方法，是不是让两者边界模糊了？", "freq": "高频", "answerHtml": "<p>设计层面两者的定位本来就不一样。抽象类表达的是\"is-a\"关系，强调的是同一血缘下的行为共享和状态复用，一个类只能继承一个抽象类，里面可以有构造方法、实例变量、非 public 的成员，适合做一个继承体系的模板骨架。接口表达的是\"has-a\"或者\"can-do\"的能力契约，一个类可以实现多个接口，传统上接口里只有常量和抽象方法，强调的是规范而不是实现。</p>\n<p>Java 8 引入默认方法（default method）和静态方法后，接口确实能带方法体了，主要目的是解决接口演化的兼容性问题——比如给 <code>Collection</code> 加 <code>stream()</code> 方法时，不用逼着所有已有实现类都改代码。但这不代表接口和抽象类边界消失了：接口依然不能有实例字段（除了 <code>public static final</code> 常量），不能有构造方法，也不支持多个默认方法冲突时的隐式二义性（必须显式重写解决冲突）。实践中的取舍原则依然清晰：需要维护状态、有共性代码逻辑用抽象类；只是定义行为规范、需要多重继承能力用接口。</p>\n<p><strong>记忆点：抽象类管\"是什么\"和共享状态，接口管\"能做什么\"，默认方法只是为了接口演化不破坏兼容性。</strong></p>"}, {"qnum": 3, "qtext": "HashMap 在 JDK 8 之后的底层结构是怎样的？扩容和链表转红黑树的具体条件是什么？", "freq": "高频", "answerHtml": "<p>JDK 8 的 HashMap 底层是数组加链表，链表长度超过阈值后转成红黑树。数组每个位置叫桶（bucket），插入时先对 key 的 hashCode 做扰动处理（高16位异或低16位），再和 <code>(容量-1)</code> 做与运算定位桶下标，这样设计是为了让哈希值的高位也能参与到低位的寻址运算里，减少哈希碰撞。发生碰撞时新节点挂到链表尾部（JDK 7 是头插法，JDK 8 改成了尾插法，避免多线程扩容时出现环形链表）。</p>\n<p>链表转红黑树有两个条件同时满足才会触发：链表长度达到 8（<code>TREEIFY_THRESHOLD</code>），并且数组容量已经达到 64（<code>MIN_TREEIFY_CAPACITY</code>）。如果容量不足 64，即使链表超过 8 也只会先扩容而不转树，因为容量小的时候扩容能更直接地缓解碰撞。树化后查找复杂度从 O(n) 降到 O(log n)，主要是防止哈希碰撞攻击导致的性能退化。扩容方面，默认负载因子 0.75，当元素个数超过 <code>容量×负载因子</code> 就触发扩容，容量翻倍，JDK 8 扩容时利用了\"扩容后的位置要么不变要么正好偏移原容量\"的规律，避免了重新计算哈希，只需按位判断迁移到原位置还是原位置+旧容量的位置。</p>\n<p><strong>记忆点：数组+链表+红黑树，树化要同时满足链表长度8和容量64两个条件。</strong></p>"}, {"qnum": 4, "qtext": "ConcurrentHashMap 在 JDK 7 和 JDK 8 里的并发实现原理有什么本质区别？", "freq": "高频", "answerHtml": "<p>JDK 7 用的是分段锁（Segment），整个数据结构被拆成默认 16 个 Segment，每个 Segment 本质是一个小号的 HashMap 并且继承了 ReentrantLock，不同 Segment 之间的读写可以并行，但同一个 Segment 内部的写操作还是要竞争同一把锁，并发度受限于 Segment 数量，而且这个数量一旦初始化就不能变。</p>\n<p>JDK 8 彻底抛弃了 Segment 分段锁，改成了数组加链表/红黑树的结构（跟 HashMap 长得很像），锁粒度细化到了桶这一级：对某个桶第一次插入用 CAS 操作（<code>compareAndSwapObject</code>），如果桶已经有节点了（发生哈希冲突）就对链表的头节点加 <code>synchronized</code> 锁，只锁这一个桶，不影响其他桶的并发写入。这样锁的粒度从\"一段\"缩小到\"一个桶\"，并发度大幅提升。此外 JDK 8 还引入了 <code>sizeCtl</code> 这个字段配合 CAS 来控制扩容状态，支持多线程协同扩容（一个线程发起扩容后，其他线程发现正在扩容会来帮忙迁移数据而不是阻塞等待），进一步提升了扩容效率。读操作全程无锁，靠 <code>volatile</code> 修饰的 <code>val</code> 和 <code>next</code> 保证可见性。</p>\n<p><strong>记忆点：JDK 7 是分段锁固定并发度，JDK 8 是 CAS + synchronized 锁桶头节点，并发度随桶数量动态变化。</strong></p>"}, {"qnum": 5, "qtext": "JDK 动态代理和 CGLIB 动态代理的实现原理有什么区别？分别适用什么场景？", "freq": "中频", "answerHtml": "<p>JDK 动态代理基于反射机制，核心是 <code>Proxy</code> 类和 <code>InvocationHandler</code> 接口。它要求目标类必须实现至少一个接口，代理类在运行时动态生成，实现和目标类相同的接口，所有方法调用都会转发到 <code>InvocationHandler.invoke()</code> 方法里去统一处理，底层原理是生成的代理类继承自 <code>Proxy</code>，方法体里通过反射调用 <code>invoke</code>。它的局限很明显：没有接口的类没法代理。</p>\n<p>CGLIB 走的是另一条路，基于 ASM 字节码框架，直接生成目标类的子类作为代理类，通过重写父类的方法来插入增强逻辑（用 <code>MethodInterceptor</code> 拦截），所以它不要求目标类实现接口,但要求类和方法不能是 <code>final</code>（子类没法重写 final 方法），而且因为要生成子类、加载新类，性能开销和内存开销都比 JDK 代理大一些，不过方法调用本身不走反射所以调用性能更好。Spring AOP 里的默认策略是：如果目标类实现了接口就优先用 JDK 动态代理，没有接口才退化到 CGLIB；也可以强制配置全部走 CGLIB。</p>\n<p><strong>记忆点：JDK 代理认接口、走反射，CGLIB 认子类、走继承，Spring AOP 优先选 JDK、无接口才退回 CGLIB。</strong></p>"}, {"qnum": 6, "qtext": "Java 的泛型是如何通过类型擦除实现的？这会带来哪些实际开发中容易踩坑的问题？", "freq": "中频", "answerHtml": "<p>Java 泛型是伪泛型，编译器在编译期做类型检查，但生成字节码时会把泛型信息擦除掉：无限定的类型参数（如 <code>&lt;T&gt;</code>）被替换成 <code>Object</code>，有上界的（如 <code>&lt;T extends Number&gt;</code>）被替换成这个上界类型；同时编译器在必要的地方插入强制类型转换代码，保证调用方使用起来是类型安全的。这意味着运行时 JVM 根本不知道 <code>List&lt;String&gt;</code> 和 <code>List&lt;Integer&gt;</code> 的区别，两者的 <code>.class</code> 对象是同一个。</p>\n<p>由此带来几个常见坑：第一，不能用 <code>instanceof</code> 判断参数化类型，<code>list instanceof List&lt;String&gt;</code> 直接编译不通过；第二，不能创建泛型数组 <code>new T[10]</code>，因为数组需要运行时确定元素类型；第三，静态上下文不能使用类的类型参数，因为类型参数是跟实例绑定的；第四，重载方法如果擦除后签名相同会冲突，比如 <code>void m(List&lt;String&gt; a)</code> 和 <code>void m(List&lt;Integer&gt; a)</code> 不能共存。反射可以绕过擦除拿到一部分信息，比如通过 <code>Method.getGenericReturnType()</code> 能拿到方法签名里声明的泛型信息（存在字节码的 <code>Signature</code> 属性里），但对象实例本身在运行时确实丢失了具体类型参数。</p>\n<pre><code>List&lt;String&gt; l1 = new ArrayList&lt;&gt;();\nList&lt;Integer&gt; l2 = new ArrayList&lt;&gt;();\nSystem.out.println(l1.getClass() == l2.getClass()); // true，擦除后都是 ArrayList</code></pre>\n<p><strong>记忆点：泛型只在编译期起作用，运行时全部擦除成原始类型或上界类型。</strong></p>"}, {"qnum": 7, "qtext": "String、StringBuilder、StringBuffer 的区别是什么？字符串常量池和 `intern()` 方法的工作机制是怎样的？", "freq": "高频", "answerHtml": "<p>String 是不可变对象，底层 JDK 9 之前是 <code>char[]</code>，JDK 9 之后改成了 <code>byte[]</code> 加 <code>coder</code> 字段做紧凑字符串（Latin-1 用一个字节，非 Latin-1 用两字节，节省内存）。每次拼接字符串都会产生新对象，所以大量拼接场景性能很差。StringBuilder 是可变的字符序列，线程不安全但性能好，适合单线程下频繁拼接；StringBuffer 功能和 StringBuilder 一样，但方法都加了 <code>synchronized</code>，线程安全但有加锁开销，现在多线程场景一般也不会靠它保证安全，用得很少。编译器对 <code>+</code> 拼接常量字符串在编译期就做了优化，直接合并成一个常量，但如果是变量拼接，<code>for</code> 循环里用 <code>+</code> 拼接实际上每次循环都在创建新的 StringBuilder 再转 String，非常低效。</p>\n<p>字符串常量池是方法区（JDK 8 后在元空间外单独维护，逻辑上仍归属堆内的一块区域）里的一块特殊区域，用来存放字面量字符串，保证相同内容的字符串字面量只存一份。<code>intern()</code> 方法会先去常量池查有没有内容相等的字符串，有就返回池中的引用，没有就把当前字符串对象（注意是对象本身，不是拷贝）放进池里再返回引用。用 <code>new String(\"abc\")</code> 创建的对象在堆里，和常量池里的 <code>\"abc\"</code> 是两个不同对象，<code>==</code> 比较为 false，调用 <code>.intern()</code> 后再比较就为 true。</p>\n<pre><code>String a = \"abc\";\nString b = new String(\"abc\");\nSystem.out.println(a == b);          // false\nSystem.out.println(a == b.intern()); // true</code></pre>\n<p><strong>记忆点：String 不可变、StringBuilder 快不安全、StringBuffer 安全慢，intern 让字符串复用常量池里的唯一对象。</strong></p>"}, {"qnum": 8, "qtext": "Checked Exception 和 Unchecked Exception 有什么本质区别？在实际项目里应该怎么设计异常体系？", "freq": "中频", "answerHtml": "<p>Java 异常体系里 <code>Throwable</code> 分两支：<code>Error</code> 表示 JVM 层面的严重问题（如 <code>OutOfMemoryError</code>、<code>StackOverflowError</code>），一般不应该也没法被业务代码捕获处理；<code>Exception</code> 才是应用层异常。<code>Exception</code> 又分受检异常（Checked）和非受检异常（Unchecked，即 <code>RuntimeException</code> 及其子类）。受检异常在编译期就强制要求调用方要么 <code>try-catch</code> 处理要么在方法签名 <code>throws</code> 声明，典型的是 <code>IOException</code>、<code>SQLException</code>，代表的是调用方能够预期、并且理论上有恢复手段的场景。非受检异常不强制处理，代表的通常是编程错误，比如 <code>NullPointerException</code>、<code>IllegalArgumentException</code>，理论上不应该靠 <code>catch</code> 来\"处理\"，而应该从代码逻辑上避免。</p>\n<p>实际项目里过度使用受检异常会导致方法签名到处 <code>throws</code>、调用链层层往上抛或者到处 <code>catch</code> 之后转换成运行时异常再往上抛，代码噪音很大，所以像 Spring 生态基本都倾向于用非受检异常，把技术性异常（如数据库异常）统一包装成 <code>DataAccessException</code> 这样的运行时异常。设计自己的业务异常体系时，通常建议：区分系统异常（不可恢复，交给全局异常处理器统一转 500）和业务异常（可预期，比如余额不足、参数校验失败，应该带错误码，让调用方能精确判断并做出响应），业务异常大多继承 <code>RuntimeException</code> 而不是 <code>Exception</code>，避免污染方法签名，同时在 Controller 层或者网关层做统一的异常处理和日志记录，避免异常信息层层丢失或者被裸吞（<code>catch</code> 后什么都不做是大忌）。</p>\n<p><strong>记忆点：受检异常编译期强制处理、代表可恢复场景，非受检异常代表编程错误，业务异常体系通常统一走运行时异常+全局处理。</strong></p>"}, {"qnum": 9, "qtext": "重写 equals() 时为什么必须同时重写 hashCode()？只重写其中一个会出什么问题？", "freq": "高频", "answerHtml": "<p>Object 默认的 equals 比较的是引用地址，hashCode 默认返回的也是跟对象身份相关的值，两者语义上是一致的。一旦业务上需要\"内容相等\"而重写了 equals，就必须遵守 hashCode 契约：如果 a.equals(b) 为 true，那么 a.hashCode() 必须等于 b.hashCode()；反过来不要求，hashCode 相等的两个对象完全可以不 equals（哈希碰撞是被允许的，只是影响查找效率）。</p>\n<p>如果只重写 equals 不重写 hashCode，最典型的坑出现在 HashMap/HashSet 里：两个内容相同的对象因为 hashCode 不同被分到了不同的桶，即使 equals 判断为 true，put 进去的\"重复\"元素也会被当成两个不同的 key 存下来，get 查询时因为定位不到正确的桶,永远查不到已存在的元素，表现就是集合里出现了逻辑重复的数据。另外 hashCode 参与计算的字段最好用不可变字段,如果用了会被后续修改的可变字段计算哈希,对象放入 HashMap 后一旦字段被改动,哈希桶位置和字段值就对不上了,同样会导致\"对象还在但找不到\"的诡异现象。</p>\n<pre><code>class Point {\n    int x, y;\n    public boolean equals(Object o) { /* 按 x,y 比较 */ }\n    // 忘记重写 hashCode，仍用 Object 默认实现\n}\nnew HashSet&lt;Point&gt;().add(new Point(1,1));\n// 再 add 一个 equals 相同的 Point(1,1)，会被当成不同元素存进去</code></pre>\n<p><strong>记忆点：equals 相等则 hashCode 必须相等，反之不必，违反契约的直接后果是哈希集合\"逻辑相等却查不到\"。</strong></p>"}, {"qnum": 10, "qtext": "`Integer a = 100, b = 100` 和 `Integer c = 200, d = 200`，`==` 比较结果为什么不一样？", "freq": "中频", "answerHtml": "<p>Java 对 Byte、Short、Integer、Long 在 -128~127 这个区间（Character 是 0~127，Boolean 是 true/false）做了缓存池，在 IntegerCache 这类内部类里预先创建好这个范围内所有的包装对象。自动装箱时如果字面量落在缓存范围内，直接复用缓存里已有的对象；超出范围才会 new 一个新对象。这么设计是因为小整数在业务里出现频率极高，用共享不可变对象代替反复创建能显著减少对象分配和 GC 压力，本质上是享元模式的应用。缓存的上界可以通过 <code>-XX:AutoBoxCacheMax</code> 或系统属性调整，下界固定在 -128 不可变。</p>\n<pre><code>Integer a = 100, b = 100;\nInteger c = 200, d = 200;\nSystem.out.println(a == b); // true，命中缓存\nSystem.out.println(c == d); // false，各自 new 的新对象</code></pre>\n<p>实际开发里这也是提醒：包装类型永远不要用 <code>==</code> 比较值，缓存范围只是个实现细节，业务上应该始终用 <code>equals()</code>。</p>\n<p><strong>记忆点：-128~127 内的包装对象是共享的，超出范围就是各自独立的新对象，比较值一律用 equals。</strong></p>"}, {"qnum": 11, "qtext": "自动拆装箱在什么场景下会引发空指针异常或性能问题？", "freq": "中频", "answerHtml": "<p>最容易踩的坑是拆箱空指针：包装类型为 null 时参与运算或者跟基本类型比较，编译器会自动插入 <code>.intValue()</code> 之类的拆箱调用，直接抛 NPE。典型场景是数据库映射出来的 <code>Integer</code> 字段为 null，写 <code>if (count &gt; 0)</code> 直接炸；更隐蔽的是三元表达式，如果两个分支类型一个是 <code>Integer</code> 一个是 <code>int</code>，编译器会统一成 <code>int</code>，即使实际走的是非 null 的分支，只要另一个分支类型需要拆箱，编译期插入的拆箱字节码也可能在运行时对 null 值触发。</p>\n<pre><code>Integer a = null;\nint b = (1 &gt; 0) ? a : 0; // 编译器统一类型为 int，对 a 拆箱，直接 NPE</code></pre>\n<p>性能上的坑主要是循环里用包装类型做累加，比如 <code>Long sum = 0L</code> 在循环里不断 <code>sum += i</code>，每次都要拆箱再装箱，产生大量临时对象增加 GC 负担，这种场景应该直接用基本类型。此外集合天然只能存对象，<code>List&lt;Integer&gt;</code> 相比 <code>int[]</code> 每个元素多了对象头等额外开销，海量数据存储场景要考虑用 Eclipse Collections、fastutil 之类支持基本类型的专用集合。</p>\n<p><strong>记忆点：拆箱空指针最容易藏在三元表达式和字段判空里，性能坑主要是循环累加用错类型。</strong></p>"}, {"qnum": 12, "qtext": "try-with-resources 是怎么保证资源释放的？多个资源的关闭顺序、异常覆盖问题是怎么处理的？", "freq": "中频", "answerHtml": "<p>try-with-resources 是编译器语法糖，任何实现了 <code>AutoCloseable</code>（或其子接口 <code>Closeable</code>）的对象都可以在 <code>try(...)</code> 括号里声明，编译后会生成等价的 <code>try-finally</code> 结构，在 finally 里显式调用 <code>close()</code>，不需要手写。多个资源用分号隔开声明时，关闭顺序和声明顺序相反（后声明的先关闭），这符合资源依赖关系——比如先开文件流再包装成 BufferedReader，关闭要先关外层包装再关底层流。</p>\n<p>异常处理上比手写 finally 更严谨的地方在于抑制异常机制：如果 try 块内部抛了异常，同时 close() 也抛了异常，只有 try 块里的异常会作为主异常继续往外抛，close() 抛出的异常不会覆盖它，而是被记录到主异常的 <code>getSuppressed()</code> 数组里，避免真正的业务异常被资源关闭失败的异常\"吞掉\"。Java 9 之后还允许把已经存在的 effectively final 变量直接放进 try() 括号复用，不必重新声明一遍。</p>\n<pre><code>try (var in = new FileInputStream(\"a.txt\"); var br = new BufferedReader(new InputStreamReader(in))) {\n    return br.readLine();\n} // 先关 br 再关 in，异常互不覆盖</code></pre>\n<p><strong>记忆点：关闭顺序与声明顺序相反，try 块异常优先，close() 异常降级为 suppressed。</strong></p>"}, {"qnum": 13, "qtext": "Optional 的设计初衷是什么？实际使用中有哪些常见的滥用方式？", "freq": "中频", "answerHtml": "<p>Optional 的初衷是显式表达\"这个方法可能没有返回值\"，取代过去用 null 表示缺失、调用方经常忘记判空的问题，本质是一个函数式风格的容器，鼓励用 <code>map/filter/orElse</code> 这类链式操作代替命令式的 if-else 判空。</p>\n<p>常见滥用有几类：一是拿到手立刻 <code>.get()</code>，完全没用上它的函数式能力,反而多了一层包装对象的开销,等于换了个马甲的空指针；二是用作类字段或者方法入参,官方设计只建议用作方法返回值类型,Optional 不实现 Serializable，做字段会增加序列化和内存负担，做参数会让调用方搞不清是传 null 还是传空 Optional；三是嵌套或者当集合用,比如 <code>Optional&lt;Optional&lt;T&gt;&gt;</code> 或者用它包一个空 List，语义上是重复的。正确用法是像流水线一样转换,最后用 orElse 给默认值,或者用 orElseThrow 抛出明确的业务异常。</p>\n<pre><code>String name = userRepo.findById(id)\n        .map(User::getName)\n        .filter(n -&gt; !n.isBlank())\n        .orElseThrow(() -&gt; new BizException(\"用户名不存在\"));</code></pre>\n<p><strong>记忆点：Optional 只建议用在方法返回值上，价值在链式转换而不是当判空开关用。</strong></p>"}, {"qnum": 14, "qtext": "什么情况下用 parallelStream 反而会让性能变差甚至出现线程安全问题？", "freq": "高频", "answerHtml": "<p>parallelStream 底层默认用的是 <code>ForkJoinPool.commonPool()</code>，线程数一般是 CPU 核心数减一。如果代码里其他地方（比如 <code>CompletableFuture</code> 的默认执行器）也在用这个公共池，多处并行任务会互相抢占，甚至出现一个任务同步等待另一个还没被调度到的任务而互相卡住的情况。</p>\n<p>具体的坑：数据量小的时候，任务拆分、线程切换、结果合并的开销比串行处理还大，一般要数据量到万级以上且单元素处理有一定计算量才值得并行；数据源类型也影响拆分效率，ArrayList、数组这种支持随机访问、能均匀二分的结构拆分效果好，LinkedList、<code>Stream.iterate</code> 生成的流几乎没法有效拆分；流里的操作必须无状态、无副作用，如果在 <code>forEach</code> 里往普通 ArrayList 塞数据或者修改外部共享变量，会直接出现线程安全问题，必须换成并发安全的收集器；有顺序依赖的操作（如 <code>findFirst</code>）在并行流下还要额外做顺序协调，收益可能被抵消。实践中不建议把普通业务代码无脑替换成 parallelStream，要经过压测验证。</p>\n<p><strong>记忆点：并行流共享 ForkJoinPool 公共池，数据量小、数据源难拆分、操作有副作用是三大踩坑点。</strong></p>"}, {"qnum": 15, "qtext": "Comparable 和 Comparator 的适用场景有什么区别？Comparator 的链式方法怎么用？", "freq": "低频", "answerHtml": "<p>Comparable 是类自身实现的接口，通过重写 <code>compareTo</code> 提供\"自然排序\"，逻辑跟对象绑定在一起，一个类通常只有一种自然排序（比如 String 按字典序）。Comparator 是外部定义的比较器，跟类本身解耦，同一个类可以有多个不同维度的 Comparator（按年龄、按姓名），不需要改动原始类代码，更适合排序规则多变，或者要排序的类是第三方类没法修改的场景。</p>\n<p>Java 8 之后 Comparator 提供了丰富的链式组合方法：<code>comparing(keyExtractor)</code> 从字段提取器生成比较器，<code>thenComparing</code> 在前一维度相等时按下一维度继续比较，<code>reversed()</code> 反转顺序，<code>nullsFirst/nullsLast</code> 处理 null 值排序位置。</p>\n<pre><code>list.sort(Comparator.comparing(User::getAge)\n        .thenComparing(User::getName)\n        .reversed());</code></pre>\n<p><strong>记忆点：Comparable 是类自带的唯一排序规则，Comparator 是外部可插拔、可组合的多维度排序方案。</strong></p>"}, {"qnum": 16, "qtext": "枚举在字节码层面是怎么实现的？为什么推荐用枚举实现单例？", "freq": "高频", "answerHtml": "<p>enum 是编译器语法糖，编译后是一个继承自 <code>java.lang.Enum</code> 的 final 类，每个枚举常量在字节码里是这个类的 <code>public static final</code> 字段，类加载时在静态代码块里被创建，只会实例化一次，天然就是单例。因为最终是普通类，枚举也能有构造方法（自动是 private，禁止外部 new）、字段、方法，甚至可以给每个常量重写方法体（编译成继承该枚举类的匿名子类）。</p>\n<p>用枚举做单例的好处：类加载过程本身由 JVM 保证只执行一次，创建过程线程安全，不用自己写双重检查加 volatile；能天然防反射攻击，反射对枚举调用 newInstance 会被 JDK 拦截直接抛异常；序列化也是安全的，普通单例类实现 Serializable 后反序列化会用反射创建新实例破坏单例（要额外重写 readResolve），而枚举的反序列化是 JDK 特殊处理的，按名称查找已有实例，不会新建对象。唯一的局限是枚举单例不能懒加载，如果构建成本很高又不一定会用到，可以配合静态内部类做懒加载。</p>\n<p><strong>记忆点：枚举常量本质是编译期生成的 static final 字段，类加载保证唯一性，还天然防反射和反序列化破坏单例。</strong></p>"}, {"qnum": 17, "qtext": "Java 的 SPI 机制原理是什么？JDBC 驱动加载是怎么用它打破双亲委派的？", "freq": "低频", "answerHtml": "<p>SPI（Service Provider Interface）是一套服务发现机制：接口的具体实现类不在编译期写死，而是运行时动态查找。实现方在 jar 包的 <code>META-INF/services/</code> 目录下建一个以接口全限定名命名的文件，内容是实现类的全限定名，使用方通过 <code>ServiceLoader.load(接口.class)</code> 加载，内部靠线程上下文类加载器扫描 classpath 下所有 jar 包里对应的配置文件，反射实例化后返回一个懒加载的迭代器。</p>\n<p>经典应用是 JDBC：<code>DriverManager</code> 由 Bootstrap 类加载器加载，但具体的 MySQL/PostgreSQL 驱动实现类在应用 classpath 下由 AppClassLoader 加载，这就出现了\"基础类要反过来调用用户类\"的问题，只能靠线程上下文类加载器完成反向委托，这也是打破双亲委派的典型场景。原生 ServiceLoader 的局限是一次性把配置文件里所有实现类都实例化，不支持按 key 精确取某一个实现，Dubbo 借鉴这套思想做了增强版 ExtensionLoader，支持按名字精确加载、依赖注入和 AOP 式包装。</p>\n<p><strong>记忆点：SPI 靠 META-INF/services 配置文件 + ServiceLoader 实现接口与实现解耦，JDBC 驱动加载是它打破双亲委派的经典案例。</strong></p>"}, {"qnum": 18, "qtext": "Java 17 的密封类（sealed class）解决了什么问题？", "freq": "低频", "answerHtml": "<p>sealed class 用来精确控制一个类或接口能被哪些类继承/实现，声明时用 <code>sealed</code> 加 <code>permits</code> 列出允许的直接子类，子类必须显式声明自己是 <code>final</code>（不能再被继承）、<code>sealed</code>（可以有自己的子类范围）或 <code>non-sealed</code>（放开限制）三者之一。</p>\n<p>它解决的核心问题是：过去接口或抽象类的实现可以被任意扩展，写 switch/if-else 处理各种子类型时永远没法让编译器检查\"是不是漏掉了某个子类\"，只能靠 default 分支兜底，新增子类时很容易忘记同步修改所有处理逻辑。sealed class 配合模式匹配 switch，能让编译器做穷尽性检查，permits 里的子类型全部覆盖到才能编译通过，不需要写 default，从语言层面堵住了\"新增子类忘记处理\"的维护性 bug，基本是对函数式语言里代数数据类型（ADT）的模拟。</p>\n<pre><code>sealed interface Shape permits Circle, Square {}\nrecord Circle(double r) implements Shape {}\nrecord Square(double side) implements Shape {}\n// switch 覆盖 Circle 和 Square 后编译器认为已穷尽，无需 default</code></pre>\n<p><strong>记忆点：sealed 把继承体系的子类范围收敛到编译期已知，换来 switch 模式匹配的穷尽性检查。</strong></p>"}, {"qnum": 19, "qtext": "record 类型解决了什么问题？和 Lombok 的 @Data 有什么本质区别？", "freq": "中频", "answerHtml": "<p>record 是 Java 16 转正的一种特殊类，专门定义不可变的值对象，只需要写出组件列表，编译器就自动生成对应的 private final 字段、同名的访问器方法（比如 <code>name()</code> 而不是 <code>getName()</code>）、包含所有字段的规范构造方法，以及基于全部字段实现的 equals/hashCode/toString。</p>\n<p>它和 Lombok 的 <code>@Data</code> 看起来功能类似，但本质不同：record 是语言层面的特性，由 javac 直接支持，不依赖注解处理器在编译期生成字节码，IDE、调试器、反射都有原生支持，不存在 Lombok 那种注解处理时机导致的兼容性问题；record 语义上强制不可变，所有字段都是 final，也不允许声明额外实例字段，而 <code>@Data</code> 默认生成的是带 setter 的可变对象；record 支持在紧凑构造方法（compact constructor）里加参数校验逻辑，不用重复写参数列表，语义上更清晰地表达\"这是一个值对象\"。record 可以实现接口、有静态方法，但不能再继承其他类，也不能声明为 abstract。</p>\n<pre><code>record Point(int x, int y) {\n    Point { // compact constructor\n        if (x &lt; 0 || y &lt; 0) throw new IllegalArgumentException(\"坐标不能为负\");\n    }\n}</code></pre>\n<p><strong>记忆点：record 是 JDK 原生支持的不可变值对象语法糖，Lombok 是注解处理器生成代码，二者实现层次完全不同。</strong></p>"}, {"qnum": 20, "qtext": "Java 14+ 的 var 局部类型推断是怎么工作的？使用时有哪些限制和注意事项？", "freq": "中频", "answerHtml": "<p>var 让编译器在编译期根据右侧表达式自动推断出局部变量的实际类型，写进字节码里的仍然是具体类型，跟其他强类型语言完全一样，var 本身不是类型，只是省略了声明处的类型书写，不会带来任何运行时的动态类型行为，这一点和 JavaScript 的 var 或者动态语言的隐式类型完全是两回事。</p>\n<p>限制上：var 只能用于有初始化表达式的局部变量、增强 for 循环的变量、传统 for 循环的变量，不能用于类的字段、方法参数、方法返回值类型；不能只声明不赋值（编译器推断不出类型）；不能赋值为 null（除非显式强转成某个类型再赋值）；不能用来声明数组时用 <code>var arr[] = ...</code> 这种老式数组语法。实际使用上的注意事项主要是可读性权衡：右侧表达式类型明显时用 var（比如 <code>var list = new ArrayList&lt;User&gt;()</code>）能减少冗余代码，但如果右侧是一个方法调用、返回类型不直观，用 var 反而会让代码可读性下降，需要跳到方法定义才能知道变量类型，团队规范上一般建议只在类型显而易见时使用。</p>\n<p><strong>记忆点：var 只是编译期类型推断的语法糖，字节码里仍是具体类型，用不用取决于是否牺牲了可读性。</strong></p>"}]}, {"name": "JVM 原理与调优", "questions": [{"qnum": 1, "qtext": "JVM 运行时数据区包括哪几块？哪些是线程私有的，哪些是线程共享的？", "freq": "高频", "answerHtml": "<p>JVM 运行时数据区可以分成线程私有和线程共享两大类。线程私有的部分包括程序计数器、虚拟机栈和本地方法栈：程序计数器记录当前线程执行到字节码的哪一行，是唯一一个不会发生 <code>OutOfMemoryError</code> 的区域；虚拟机栈存的是每次方法调用生成的栈帧，栈帧里包含局部变量表、操作数栈、动态链接和方法返回地址，栈深度超限会抛 <code>StackOverflowError</code>，栈内存不够扩展也可能抛 <code>OutOfMemoryError</code>；本地方法栈原理类似，只是服务于 native 方法。</p>\n<p>线程共享的部分是堆和方法区。堆是存放对象实例和数组的地方，也是垃圾回收的主战场，又细分为新生代（Eden + 两个 Survivor 区）和老年代；方法区存的是类的元信息、常量、静态变量、已编译的代码,JDK 8 之后方法区的实现从永久代（PermGen）改成了元空间（Metaspace），最大区别是元空间用的是本地内存（direct memory）而不是堆内存，默认情况下受物理内存限制不容易 OOM，从根源上解决了老版本因为常量池、类加载过多导致的 <code>PermGen space</code> 溢出问题。另外还有一块不完全算运行时数据区、但工程上很关键的直接内存（Direct Memory），主要是 NIO 里 <code>ByteBuffer.allocateDirect()</code> 分配的堆外内存,不受 <code>-Xmx</code> 控制，但受 <code>-XX:MaxDirectMemorySize</code> 限制，用不好一样会导致机器内存耗尽。</p>\n<p><strong>记忆点：程序计数器/虚拟机栈/本地方法栈线程私有，堆/方法区线程共享，元空间用的是本地内存不是堆内存。</strong></p>"}, {"qnum": 2, "qtext": "双亲委派模型是什么？为什么需要它？什么情况下需要打破双亲委派？", "freq": "高频", "answerHtml": "<p>双亲委派模型描述的是类加载器之间的委托关系：当一个类加载器收到加载类的请求时，不会自己先尝试加载，而是先把请求委托给父加载器,一层层往上,直到启动类加载器（Bootstrap ClassLoader）。只有当父加载器反馈自己无法完成加载（在它的加载路径下找不到这个类）时,子加载器才会自己尝试加载。JDK 里几层加载器自底向上是应用类加载器（AppClassLoader，加载 classpath 下的类）、扩展类加载器（ExtClassLoader/PlatformClassLoader）、启动类加载器（Bootstrap，加载 <code>rt.jar</code>/核心模块，用 C++ 实现,没有对应的 Java 对象)。</p>\n<p>它存在的核心价值是保证类加载的安全性和唯一性：不管应用代码里怎么自己写一个 <code>java.lang.String</code>,最终请求都会被委托到 Bootstrap 加载器,加载的还是核心库里的 <code>String</code>,避免核心类被恶意篡改或者重复定义导致类型体系混乱。但双亲委派也不是绝对的,有几个典型的打破场景：一是 SPI 机制，比如 JDBC 驱动加载,接口 <code>java.sql.Driver</code> 由 Bootstrap 加载,但具体的驱动实现类在应用的 classpath 下,只能通过线程上下文类加载器（Thread Context ClassLoader）反向加载,这就是所谓的\"基础类回调用户代码\"问题的解法；二是热部署/热替换场景（如 Tomcat 每个 Web 应用用独立的 WebAppClassLoader,实现应用之间的类隔离,自己的类优先加载而不是先委托给父加载器)；三是 OSGi、模块化框架为了实现类的热插拔和精细隔离,会设计成网状而不是树状的委托关系。</p>\n<p><strong>记忆点：双亲委派保证核心类的唯一性和安全性，SPI/热部署/OSGi 是打破双亲委派的典型场景。</strong></p>"}, {"qnum": 3, "qtext": "Java 对象什么时候会被判定为可回收？可达性分析里 GC Roots 都包括哪些？", "freq": "高频", "answerHtml": "<p>现代 JVM 判断对象是否存活用的是可达性分析算法，而不是早期的引用计数法（引用计数没法解决循环引用问题，A 引用 B、B 又引用 A,即使两者都成了垃圾,计数也永远不为零）。可达性分析的思路是从一系列称为 GC Roots 的根对象出发，沿着引用链往下遍历，凡是能够被这条链路访问到的对象都是存活对象，遍历完成后没有被访问到的对象就被判定为不可达，成为垃圾回收的候选。</p>\n<p>GC Roots 具体包括几类：虚拟机栈（栈帧的局部变量表）中引用的对象,这是最常见的一类，方法里的局部变量只要还在作用域内，它引用的对象就不会被回收；方法区中类静态属性引用的对象，比如某个类的 <code>static</code> 字段指向的对象只要类没被卸载就一直存活；方法区中常量引用的对象，比如字符串常量池里的引用；本地方法栈中 JNI 引用的对象；此外还有被 <code>synchronized</code> 持有的锁对象，以及 JVM 内部的一些引用（比如基本数据类型对应的 Class 对象、系统类加载器）。需要补充的是，即使被判定为不可达，对象也不会立即被回收，还要经过是否覆写 <code>finalize()</code> 方法的判断和两次标记过程，只有确实没有任何途径复活自己（比如在 <code>finalize()</code> 里重新建立引用）才会真正被收走，不过 <code>finalize()</code> 机制本身性能差且不可靠，已经被标记废弃，实践中不建议依赖它。</p>\n<p><strong>记忆点：可达性分析代替引用计数解决循环引用问题，GC Roots 主要是栈里的局部变量、静态变量和常量引用。</strong></p>"}, {"qnum": 4, "qtext": "CMS、G1、ZGC 这几种垃圾收集器的设计思路和适用场景有什么区别？", "freq": "高频", "answerHtml": "<p>先说 CMS（Concurrent Mark Sweep），它是老年代收集器，设计目标是尽量减少停顿时间，整个过程分初始标记（STW，标记 GC Roots 直接关联的对象）、并发标记（和用户线程一起跑，遍历整个对象图）、重新标记（STW，修正并发标记期间用户线程改动导致的标记遗漏）、并发清除四个阶段，只有初始标记和重新标记会暂停用户线程，大部分时间和业务线程并发执行。但 CMS 用的是标记清除算法，会产生内存碎片，碎片过多时会触发一次代价很高的 Full GC 做压缩整理；而且并发清除阶段用户线程还在产生新对象，可能出现\"并发失败\"（concurrent mode failure），退化成单线程的 Full GC。CMS 在 JDK 9 已经被标记为废弃。</p>\n<p>G1（Garbage First）把堆划分成若干大小相等的 Region，不再严格区分连续的新生代/老年代物理空间，而是按 Region 为单位灵活分配角色。它最大的特点是可以设定一个期望的最大停顿时间（<code>-XX:MaxGCPauseMillis</code>），每次回收优先挑选垃圾最多、回收收益最高的若干 Region（这也是\"Garbage First\"名字的由来），通过复制算法整理空间来避免碎片问题。G1 适合中大堆（4G 到几十G）、希望停顿时间可控可预测的场景，是 JDK 9 之后的默认收集器。ZGC 走得更激进，目标是把停顿时间压到毫秒级以内且和堆大小基本无关（不管堆是几十G还是几个T，停顿时间都能控制在10毫秒以下），核心技术是染色指针（Colored Pointer，把 GC 信息编码进指针的高位）和读屏障，几乎所有阶段包括对象移动、引用更新都能和用户线程并发执行，代价是需要更多的 CPU 资源做并发工作，且对指针位宽有一定要求。适用场景是超大堆、对延迟极度敏感的场景，比如金融交易系统。</p>\n<p><strong>记忆点：CMS 老年代并发标清有碎片、已废弃，G1 分 Region 按收益优先回收、停顿可控，ZGC 靠染色指针实现停顿几乎与堆大小无关。</strong></p>"}, {"qnum": 5, "qtext": "生产环境遇到 Full GC 频繁或者 OOM，你的排查思路是什么？", "freq": "中频", "answerHtml": "<p>先分清楚问题类型，Full GC 频繁和真正 OOM 是两个层次的问题,但排查手段是相通的。第一步是拿到现场数据：通过监控（如 Arthas、Prometheus + JVM exporter，或者简单的 <code>jstat -gcutil &lt;pid&gt; 1000</code> 持续观察）确认 GC 频率和每次回收后老年代的占用趋势，如果每次 Full GC 后老年代占用率不降反而持续走高，基本可以判断存在内存泄漏；如果只是 GC 频繁但每次能回收下去，更可能是新生代设置过小、大对象直接进老年代、或者业务确实有短时间的流量高峰。</p>\n<p>第二步是定位具体原因,针对 OOM 要先看异常信息里 OOM 的具体类型：<code>java.lang.OutOfMemoryError: Java heap space</code> 是堆溢出，多半是内存泄漏或者堆设置过小；<code>Metaspace</code> 溢出通常是动态生成类过多（比如大量使用 CGLIB 代理、反射调用没有缓存 Class，或者热部署没有正确卸载类加载器）；<code>unable to create new native thread</code> 是线程数超过系统限制,常见于线程池配置不当或者线程泄漏；<code>GC overhead limit exceeded</code> 是 GC 频繁但回收效果很差。定位内存泄漏最常用的手段是加上 <code>-XX:+HeapDumpOnOutOfMemoryError</code> 在 OOM 时自动生成堆转储文件，再用 MAT（Memory Analyzer Tool）分析，重点看 Dominator Tree 里占用内存最大的对象和它们的 GC Roots 引用链，常见根因包括静态集合类持续添加元素没有清理、监听器/回调没有反注册、ThreadLocal 没有及时 remove、连接池或缓存没有设置容量上限。线上紧急情况下，可以先用 <code>jmap -histo:live &lt;pid&gt;</code> 快速看一眼对象实例数量的排名，或者用 Arthas 的 <code>heapdump</code>、<code>profiler</code> 命令在不重启服务的情况下抓现场，比停机 dump 更适合线上诊断。</p>\n<p><strong>记忆点：先用 jstat/监控看趋势判断是否泄漏，再用 heap dump + MAT 定位到具体的 GC Roots 引用链。</strong></p>"}, {"qnum": 6, "qtext": "JVM 参数调优一般从哪些维度入手？举例说明一次典型的堆参数配置思路。", "freq": "中频", "answerHtml": "<p>调优通常先明确目标，是要降低延迟、提升吞吐,还是解决具体的 OOM/GC 问题，不同目标下参数取舍完全不同，所以调优前一定要先有基准数据（GC 日志、监控指标），不能拍脑袋改参数。堆内存维度先看整体大小：生产环境建议把 <code>-Xms</code> 和 <code>-Xmx</code> 设置成相同的值，避免堆动态扩容收缩带来额外的性能抖动；新生代和老年代的比例通过 <code>-XX:NewRatio</code> 或者直接用 <code>-Xmn</code> 指定新生代大小，如果业务里大量对象都是朝生夕灭的短命对象（比如典型的 Web 请求处理），适当调大新生代能让更多对象在 Minor GC 阶段就被回收,减少进入老年代的概率,从而降低 Full GC 频率；Survivor 区的比例（<code>-XX:SurvivorRatio</code>）和对象晋升老年代的年龄阈值（<code>-XX:MaxTenuringThreshold</code>）则影响对象在新生代停留的时间。</p>\n<p>垃圾收集器的选择也是重要一环，通过 <code>-XX:+UseG1GC</code> 等参数指定，配合 <code>-XX:MaxGCPauseMillis</code> 设置期望停顿时间。元空间要设置 <code>-XX:MaxMetaspaceSize</code> 上限，避免类加载异常导致元空间无限增长耗尽机器内存。还有一类容易被忽视但很关键的参数是 GC 日志相关的，比如 <code>-Xlog:gc*:file=gc.log:time,uptime:filecount=10,filesize=100m</code>（JDK 9+语法），生产环境应该常态化开启 GC 日志，作为后续问题排查和调优效果验证的依据，同时也可以加上 <code>-XX:+HeapDumpOnOutOfMemoryError</code> 兜底。举个例子，一个日均处理大量短请求的服务，如果发现 Minor GC 频繁但每次耗时很短、Full GC 很少，说明新生代设置基本合理；但如果发现大对象频繁直接晋升老年代触发 Full GC，则要考虑调大 <code>-XX:PretenureSizeThreshold</code> 的阈值或者从业务代码层面减少大对象的产生。</p>\n<p><strong>记忆点：调优先有基准数据再动参数，核心是堆分代比例、收集器选择、GC 日志常态化三件事。</strong></p>"}, {"qnum": 7, "qtext": "jstack、jmap、jstat、Arthas 这几个工具分别解决什么问题？举例说明用它们排查一次 CPU 飙高问题的过程。", "freq": "中频", "answerHtml": "<p>这几个工具定位不同：<code>jstat</code> 用来看 JVM 运行时的统计信息，最常用的是 <code>jstat -gcutil</code> 实时观察各分代内存使用率和 GC 次数/耗时，适合判断 GC 是否是性能问题的根源；<code>jmap</code> 主要用来看堆内存，<code>jmap -histo</code> 能快速列出存活对象按类型和占用大小的排名，<code>jmap -dump</code> 能生成堆转储文件供 MAT 等工具离线分析,但要注意 dump 大堆时会造成较长时间的停顿,线上慎用；<code>jstack</code> 用来抓取线程快照，能看到每个线程当前的状态（RUNNABLE、BLOCKED、WAITING）和调用栈，是排查死锁、线程阻塞、CPU 占用的关键工具。Arthas 是阿里开源的一站式诊断工具，最大的优势是可以在不重启、不侵入代码的情况下动态挂载到运行中的 Java 进程，做方法级别的调用监控（<code>watch</code>/<code>trace</code>）、耗时分析（<code>profiler</code> 生成火焰图）、甚至动态替换类的字节码热更新（<code>redefine</code>），排查效率比传统命令行工具组合高很多。</p>\n<p>一次典型的 CPU 飙高排查流程：先用 <code>top -Hp &lt;pid&gt;</code> 找到 CPU 占用最高的具体线程 ID，把它转换成十六进制（因为 <code>jstack</code> 输出里线程 ID 是十六进制的 nid），然后用 <code>jstack &lt;pid&gt;</code> 抓取线程栈，搜索对应的 nid 定位到这个线程当前执行的方法和调用栈，往往能直接看出是死循环、正则回溯爆炸还是频繁 GC 导致（如果发现是大量线程都停在 GC 相关的内部方法，那问题根源其实是 GC 而不是业务代码）。如果用 <code>jstack</code> 只能看到一个瞬时快照不容易定位到间歇性的热点方法，用 Arthas 的 <code>profiler start</code> 持续采样一段时间再生成火焰图,能更直观地看到 CPU 时间集中在哪个方法调用链上,这种情况下比反复手动 <code>jstack</code> 效率高得多。</p>\n<p><strong>记忆点：jstat 看 GC 趋势、jmap 看堆对象、jstack 看线程栈，CPU 飙高的固定套路是 top -H 定位线程再用 jstack 或火焰图定位方法。</strong></p>"}, {"qnum": 8, "qtext": "JIT 编译器是怎么工作的？C1 和 C2 编译器有什么区别？为什么说\"热点代码\"很重要？", "freq": "低频", "answerHtml": "<p>JVM 默认采用的是解释执行加即时编译（JIT）混合的方式，字节码先由解释器逐条解释执行，同时 JVM 会用计数器统计方法的调用次数和循环回边的执行次数，一旦超过设定的阈值（比如方法调用计数器默认 1500 次左右，具体和分层编译策略有关），这段代码就会被判定为\"热点代码\"，交给即时编译器编译成本地机器码，之后再执行就直接跑机器码,不用每次都解释，性能大幅提升。这个机制叫分层编译（Tiered Compilation），JDK 8 之后默认开启。</p>\n<p>分层编译里有两个编译器：C1（Client Compiler）编译速度快但优化程度较浅，做一些方法内联、去虚拟化等基础优化,适合对启动速度敏感、代码执行时间短的场景；C2（Server Compiler）编译速度慢但优化更激进，会做逃逸分析（判断对象是否只在方法内部使用，如果没有逃逸出方法或者线程，可以做栈上分配甚至标量替换,减少堆分配和 GC 压力）、循环展开、更彻底的内联等，适合长时间运行、对峰值性能要求高的服务端场景。分层编译综合了两者优势：代码先用 C1 快速编译（分为几个层级），执行更多次之后如果确实是热点再用 C2 做深度优化编译,如果编译后的代码假设被打破（比如之前内联优化时假设某个类没有被继承，后来运行时动态加载了子类），JVM 还会做\"逆优化\"（deoptimization）,退回解释执行重新收集信息。理解热点代码的意义在于：性能优化应该聚焦在被频繁调用的核心路径上，同时要给 JVM 足够的预热时间（这也是为什么很多高性能服务上线前要做\"预热\"，避免刚启动时全靠解释执行导致的响应慢）。</p>\n<p><strong>记忆点：解释执行负责启动速度，JIT 把热点代码编译成机器码换取长期运行的性能，C1 编译快优化浅、C2 编译慢优化深，分层编译两者结合。</strong></p>"}, {"qnum": 9, "qtext": "一个普通 Java 对象在堆内存里的布局是怎样的？Mark Word 里都存了哪些信息？", "freq": "高频", "answerHtml": "<p>HotSpot 里对象的内存布局分三部分：对象头、实例数据、对齐填充。对象头又分两块：Mark Word 和类型指针（Klass Pointer）。Mark Word 在 64 位 JVM 里默认占 8 字节，是一块复用存储区，内容随对象的锁状态动态变化：无锁状态下存对象的 identity hashCode（第一次调用 hashCode() 才会计算写入）和分代年龄（记录经历过几次 Minor GC）；偏向锁状态存持有锁的线程 ID；轻量级锁状态存指向线程栈中锁记录的指针；重量级锁状态存指向操作系统 monitor 的指针。类型指针指向方法区里这个对象对应的 Class 元数据，用来确定对象类型；如果是数组还会额外记录数组长度。</p>\n<p>实例数据部分按字段类型从大到小排列（long/double、int/float、short/char、byte/boolean、引用类型）做内存对齐，减少 padding 浪费，整个对象大小最终必须是 8 字节的整数倍，不足的用对齐填充补齐。实际排查内存占用问题时，可以用 JOL（Java Object Layout）工具直接打印一个对象每个字段的偏移量和整体大小，比靠经验估算靠谱得多。</p>\n<p><strong>记忆点：Mark Word 是一块随锁状态复用的存储区，无锁时存 hashCode 和分代年龄，加锁后存的是锁相关指针。</strong></p>"}, {"qnum": 10, "qtext": "什么是指针压缩（Compressed Oops）？开启后能带来多大收益？什么情况会失效？", "freq": "中频", "answerHtml": "<p>64 位 JVM 如果对象引用都用完整 64 位存储，同样的引用字段会比 32 位 JVM 多占一倍内存，直接拖累有效堆利用率和缓存命中率。指针压缩的思路是：只要堆不超过 32GB，对象引用可以用 32 位表示，因为对象按 8 字节对齐分配、地址低 3 位恒为 0，实际使用时把这 32 位值左移 3 位再加上基址偏移量还原成真实地址，相当于用 32 位表达了 35 位的寻址空间（4GB × 8 = 32GB）。</p>\n<p>这个特性由 <code>-XX:+UseCompressedOops</code> 控制，JDK 7u6 之后堆小于 32GB 时默认自动开启；对象头里的类型指针也有对应的 <code>-XX:+UseCompressedClassPointers</code>。收益上普通业务对象大多包含若干引用字段，开启后能节省 30%~40% 左右的对象内存，间接减轻 GC 压力。一旦 <code>-Xmx</code> 超过 32GB，压缩就会失效，退回完整 64 位指针，这也是很多团队宁愿把单实例堆控制在 32GB 以内、用多实例分片而不是一味加大单机堆的原因——跨过这个临界点不仅压缩收益没了，指针变大反而让有效对象存储空间不升反降。</p>\n<p><strong>记忆点：堆不超过 32GB 时用 32 位表达 35 位寻址空间，一旦超过 32GB 压缩失效，内存收益反而可能不升反降。</strong></p>"}, {"qnum": 11, "qtext": "逃逸分析是怎么判断对象作用范围的？它如何配合标量替换减少堆分配？", "freq": "高频", "answerHtml": "<p>逃逸分析是 C2 编译器在方法内联基础上做的编译期静态分析，用来判断对象的作用域有没有超出当前方法甚至当前线程。逃逸程度从低到高：对象只在方法内部使用、没有被 return 也没赋给外部字段，是\"未逃逸\"；被其他方法调用但不出线程范围，是\"方法逃逸\"；被赋值给实例变量或静态变量、可能被其他线程访问到，是\"线程逃逸\"。</p>\n<p>对未逃逸对象，JVM 理论上可以做栈上分配，让对象生命周期跟方法栈帧绑定，随方法退出自动销毁不用等 GC。但 HotSpot 并没有真正实现独立的栈上分配，而是通过标量替换间接达到类似效果：把未逃逸对象拆成它包含的若干个基本类型字段，直接在栈帧局部变量表或寄存器里分配这些标量，完全不创建对象实例，从而省掉堆分配和后续 GC 扫描。这两项优化依赖 <code>-XX:+DoEscapeAnalysis</code> 和 <code>-XX:+EliminateAllocations</code>（默认都开启），典型场景是方法内部创建的、不会返回也不会赋给外部的临时对象。要注意这只在方法被 C2 编译之后才生效，调用次数不够多、还在解释执行或 C1 阶段是享受不到的。</p>\n<p><strong>记忆点：未逃逸对象靠标量替换拆成基本类型字段直接在栈上分配，前提是方法调用次数够多、被 C2 深度编译过。</strong></p>"}, {"qnum": 12, "qtext": "TLAB 是什么？为什么要引入它？", "freq": "中频", "answerHtml": "<p>TLAB（Thread Local Allocation Buffer，线程本地分配缓冲区）是 HotSpot 在 Eden 区里给每个线程预先划出的一小块私有内存。背景是多线程环境下如果每个线程分配对象都要在共享 Eden 区申请内存，必须用 CAS 之类的同步机制保证并发安全，高并发下大量线程争抢同一个分配指针会成为明显瓶颈。</p>\n<p>TLAB 的思路是空间换时间：线程第一次分配对象或者原 TLAB 用尽时，一次性从 Eden 区划出一块专属连续内存，后续该线程分配对象只需要在自己的 TLAB 内移动指针（指针碰撞式分配），不需要跟其他线程同步，速度接近 O(1)。TLAB 默认开启（<code>-XX:+UseTLAB</code>），大小由 JVM 根据 Eden 大小、线程数、历史分配速率自适应调整。需要注意 TLAB 只占 Eden 的一小部分，仅用于加速小对象分配；分配的对象超出当前 TLAB 剩余空间就会走 Eden 公共区域的同步分配，或者对象足够大直接晋升老年代；TLAB 用尽后剩余的一点空间会填充成\"哑元对象\"，保证堆内存扫描时不会出现无法解析的空隙。</p>\n<p><strong>记忆点：TLAB 让每个线程在 Eden 里有一块专属分配区，靠指针碰撞免锁分配，用空间换并发性能。</strong></p>"}, {"qnum": 13, "qtext": "什么是安全点（Safepoint）？为什么 GC 之前必须让所有线程停在安全点？", "freq": "中频", "answerHtml": "<p>安全点是 JVM 预先设计好的一些代码位置，当 JVM 需要做一些要求所有线程状态一致的全局操作时（最典型的是 STW 垃圾回收，此外还有偏向锁撤销、JIT 去优化、线程 dump），会发起全局暂停请求，让所有用户线程都跑到最近的安全点再停下来，而不是在任意一条字节码指令处被打断。</p>\n<p>之所以需要这个机制，是因为 GC 做可达性分析和对象移动要求整个对象图的引用关系是稳定的快照，如果线程执行到一半（比如某个引用正在重新赋值的中间状态）被强行打断，GC 根本无法准确识别有效引用。JVM 在方法返回前、循环回边、方法调用前这些位置预先插入安全点检查，线程执行到这里会主动检查全局标志位。实践中容易踩的坑是\"安全点偏向\"问题：如果某个方法里有一个没有方法调用、次数在编译期可推断上界的紧凑计数循环，JIT 可能省略了循环回边的安全点检查，导致这个线程长时间到不了安全点，拖长整个应用的 STW 等待时间，这种情况可以用 <code>-Xlog:safepoint</code> 观察到耗时集中在\"到达安全点之前\"而不是安全点操作本身。</p>\n<p><strong>记忆点：安全点保证 GC 发生时所有线程的引用关系是稳定快照，紧凑计数循环省略安全点检查是常见的隐藏拖慢点。</strong></p>"}, {"qnum": 14, "qtext": "G1 的字符串去重（String Deduplication）解决了什么问题？原理和局限是什么？", "freq": "低频", "answerHtml": "<p>很多应用里存在大量内容相同但对象引用不同的字符串，比如同一个用户名、状态码在不同请求里各自被反序列化出独立对象，内容相同却各占一份内存。JDK 8u20 之后 G1 提供了字符串去重特性（<code>-XX:+UseStringDeduplication</code>，默认关闭），原理是利用并发标记阶段顺便扫描堆里存活的 String 对象，把底层的字符数组内容计算哈希后放进内部去重表，发现两个 String 底层数组内容完全相同，就让其中一个指向另一个已存在的数组，原来那份不再被引用的数组在下次 GC 时自然回收——注意去重的是字符数组，两个 String 对象本身依然是不同对象，不影响 <code>==</code> 比较结果。</p>\n<p>局限性：只对经过一定年龄（<code>-XX:StringDeduplicationAgeThreshold</code>，默认 3）考验、确实长期存活的字符串生效，避免浪费扫描成本在短命字符串上；只在 G1 下可用；和 <code>intern()</code> 是两回事，intern 是开发者主动调用的常量池去重，String Deduplication 是 GC 后台被动完成的；扫描本身有 CPU 开销，只有存在大量长期存活重复字符串（比如缓存了大量相似文本）才划算。</p>\n<p><strong>记忆点：String Deduplication 去重的是字符数组不是对象本身，只在 G1 下对长期存活的重复字符串自动生效。</strong></p>"}, {"qnum": 15, "qtext": "什么情况下一个类会被 JVM 卸载？为什么说条件非常苛刻？", "freq": "中频", "answerHtml": "<p>类的卸载发生在方法区（元空间）垃圾回收过程中，必须同时满足三个条件：该类的所有实例都已被回收，堆中不存在这个类或其任何子类的实例；加载这个类的类加载器本身也已经被回收，即这个 ClassLoader 对象在可达性分析里也成了垃圾；这个类对应的 Class 对象没有在任何地方被引用，包括不能通过反射访问到。三者必须同时成立才会真正触发卸载。</p>\n<p>这也是为什么说条件苛刻：由启动类加载器、扩展/平台类加载器加载的核心 JDK 类基本和 JVM 生命周期绑定，几乎不可能被卸载；只有自定义类加载器加载、并且这个加载器本身也不再被引用的类，才有实际被卸载的机会，常见于支持热部署的容器（比如 Tomcat 卸载一个 Web 应用时把对应的 WebAppClassLoader 连同它加载的所有类一起回收）。实践中需要关心类卸载的场景有两个：一是热更新场景下如果自定义类加载器设计不当、旧的加载器一直被某个静态集合或监听器持有（类加载器泄漏），会导致元空间持续增长最终 OOM；二是大量使用动态代理、字节码生成框架且没有做 Class 缓存,每次都用新加载器生成新类,同样会造成元空间类膨胀。</p>\n<p><strong>记忆点：类卸载要求实例、类加载器、Class 对象三者同时不可达，热部署场景下类加载器泄漏是元空间 OOM 的常见根因。</strong></p>"}, {"qnum": 16, "qtext": "-Xss 参数控制的是什么？调大或调小分别带来什么影响？", "freq": "低频", "answerHtml": "<p><code>-Xss</code> 设置的是每个线程虚拟机栈的大小（默认值因操作系统和 JVM 版本而异，64 位 Linux 上一般在 1MB 左右），这块内存是线程私有的，每次方法调用都会压入一个栈帧，方法调用嵌套或者递归越深消耗的栈空间越多，超出设定值就抛 <code>StackOverflowError</code>。</p>\n<p>调大的典型场景是业务代码里存在深度递归（比如树形结构递归遍历、拦截器链嵌套很深）导致正常逻辑就栈溢出，适当调大能缓解，但更彻底的做法是把递归改成迭代或者用显式栈模拟，避免依赖调用深度。调小的场景更多是高并发系统里的内存精细化控制：线程创建时预留的栈内存不算在 <code>-Xmx</code> 堆内，是独立的本地内存开销，如果应用需要创建大量线程（虽然更推荐用线程池控制数量），每个线程哪怕默认 1MB 栈也会累积成可观的内存占用，甚至导致本地内存耗尽抛出 <code>unable to create new native thread</code>，这时可以适当调小单线程栈大小做取舍，但一定要先摸清业务方法的实际调用深度，盲目调小容易在生产环境引发栈溢出。</p>\n<p><strong>记忆点：-Xss 调大是为了容纳深递归，调小是为了在大量线程场景下节省本地内存，两者都要基于实际调用深度做判断而不是拍脑袋。</strong></p>"}, {"qnum": 17, "qtext": "拿到一份线上 GC 日志，你会按照什么思路分析出优化结论？", "freq": "高频", "answerHtml": "<p>第一步确认基础信息：JDK 版本、用的收集器、日志格式（JDK 9 之后统一用 <code>-Xlog</code> 框架），可以先用 GCEasy、GCViewer 这类工具可视化，直观看几个核心指标的趋势：Young GC 和 Full/Mixed GC 各自的频率、每次暂停时长、GC 后老年代占用是否呈锯齿状持续走高（谷值不断抬高是内存泄漏的强烈信号），以及吞吐量（用户代码运行时间占比一般期望 95% 以上）。</p>\n<p>第二步拆解某一次具体 GC：看触发原因（Allocation Failure 最常见，表示 Eden 分配对象空间不够；也可能是 Metaspace 不足或 Humongous 对象分配失败），看回收前后各分代内存变化和各阶段耗时细分，比如 G1 日志里如果 Remark 阶段耗时异常长,通常和存活对象数量、跨代引用数量有关。第三步定位根因给方案：Young GC 频繁但每次能回收大部分对象、暂停短，基本正常；晋升到老年代的对象量持续偏高，可能是新生代设置偏小或者存在长生命周期对象持有不当,需要结合 dump 进一步定位；Full GC 频繁且耗时长、老年代占用居高不下，大概率是内存泄漏或者堆参数明显不合理，需要用 MAT 分析 dump。全程强调用趋势和多维度数据交叉验证，而不是看到一次慢 GC 就立刻改参数。</p>\n<p><strong>记忆点：先看趋势判断是泄漏还是容量问题，再拆解单次 GC 的阶段耗时，最后结合 dump 定位根因再决定调参数还是调代码。</strong></p>"}, {"qnum": 18, "qtext": "OutOfMemoryError 和内存泄漏是同一回事吗？它们之间有什么因果关系？", "freq": "中频", "answerHtml": "<p>不是一回事。OOM 是一个具体的运行时错误，表示 JVM 在某个内存区域（堆、元空间、直接内存、栈）已经没有足够空间完成一次分配请求，是\"结果\"层面的现象；内存泄漏是\"原因\"层面的问题，指本该被回收的对象因为存在不应该存在的引用链一直被 GC Roots 可达，导致无法被回收，随时间不断累积。</p>\n<p>二者关系是：内存泄漏是导致 OOM 的常见原因之一，但不是唯一原因——没有泄漏，单纯因为业务数据量大、堆参数设置偏小、或者短时间流量突刺导致瞬时对象暴增，同样会触发 OOM，这种情况加大堆或者优化算法就能解决；反过来有泄漏也不一定马上 OOM，如果泄漏速度慢、应用重启周期短，可能长期观察不到真正的 OOM，但会表现为 GC 越来越频繁、性能逐渐劣化。区分两者最实用的手段是看老年代占用率随时间的变化曲线：容量不足的问题，GC 之后老年代占用能回落到相对稳定的水位；真正的泄漏，即使做了 Full GC 老年代占用依然只涨不跌，这时候就该做 heap dump 用 MAT 分析支配树，定位是哪条引用链一直拽着对象不放（常见元凶是无边界的缓存、没有反注册的监听器、没有正确关闭的连接、没有 remove 的 ThreadLocal）。</p>\n<p><strong>记忆点：OOM 是结果，内存泄漏是原因之一；判断是否泄漏关键看 Full GC 后老年代占用能否回落到稳定水位。</strong></p>"}]}, {"name": "并发编程", "questions": [{"qnum": 1, "qtext": "Java 线程有哪几种状态，创建线程的几种方式各有什么优缺点？", "freq": "中频", "answerHtml": "<p>线程的生命周期在 Java 里对应 Thread.State 这个枚举，一共六种：NEW（刚 new 出来还没 start）、RUNNABLE（包含操作系统层面的就绪和运行中，Java 不区分这两者）、BLOCKED（等 synchronized 锁）、WAITING 和 TIMED_WAITING（调用了 wait/join/park 或者带超时版本）、TERMINATED（run 方法执行完）。要注意 BLOCKED 只对应等 monitor 锁，等 Lock 或者 wait 释放锁不算 BLOCKED，这是个容易答错的细节。</p>\n<p>创建方式常见的有四种。继承 Thread 重写 run，简单但 Java 单继承的限制导致没法再继承别的类，实际项目里很少用。实现 Runnable 接口，解耦了任务和线程本身,更符合组合优于继承。实现 Callable 配合 FutureTask，好处是任务可以有返回值、可以抛受检异常，能通过 Future.get 拿结果或者取消任务。最后是通过线程池提交任务，这是生产环境的标准做法，因为线程创建销毁本身开销不小，线程池能复用线程、控制并发数量、还能配合队列和拒绝策略做流量控制。面试官问到这里往往会追问 wait 和 sleep 的区别，核心是 wait 会释放锁而且必须在 synchronized 块里调用，sleep 不释放锁，这个可以顺带提一句。</p>\n<p><strong>记忆点：能创建线程的方式最终都要落到 Thread 上，线程池是生产环境唯一推荐的用法。</strong></p>"}, {"qnum": 2, "qtext": "synchronized 底层是怎么实现的？锁升级的过程能讲一下吗？", "freq": "高频", "answerHtml": "<p>synchronized 修饰代码块的话，编译后会在字节码里插入 monitorenter 和 monitorexit 指令，本质是去竞争对象关联的 monitor（也就是 ObjectMonitor），拿到的线程会把计数器加一，重入的时候再加，退出的时候减，减到零才真正释放；修饰方法的话则是通过方法的 ACC_SYNCHRONIZED 标志位实现，效果是等价的。</p>\n<p>锁升级说的是 JDK 6 引入的偏向锁、轻量级锁、重量级锁这套优化，目的是减少加锁的开销。刚开始如果一个对象从来没有被锁过或者锁的历史线程都是同一个，会进入偏向锁状态，也就是把对象头 Mark Word 里直接记录持有线程的 ID，之后同一个线程再进来只要比对线程 ID 就行，几乎没有额外开销。一旦出现第二个线程来竞争，偏向锁就会撤销，升级成轻量级锁，这时候用的是 CAS 在栈帧里的锁记录和对象头之间做交换，靠自旋去尝试获取，因为这时候预期锁持有时间很短，自旋比阻塞划算。如果自旋一定次数还没拿到锁，或者竞争线程数变多、自旋消耗过大，就会膨胀为重量级锁，这时候真正依赖操作系统的互斥量，没抢到的线程会被挂起进入 BLOCKED 状态，等唤醒。整个过程是单向的，只能升级不能降级（除非 JVM 在 STW 阶段重置偏向锁状态）。</p>\n<p><strong>记忆点：偏向锁省比较，轻量级锁靠自旋 CAS，重量级锁才真正阻塞线程。</strong></p>"}, {"qnum": 3, "qtext": "volatile 关键字保证了什么，不保证什么？", "freq": "高频", "answerHtml": "<p>volatile 解决的是可见性和有序性问题，不解决原子性。可见性是说一个线程修改了 volatile 变量的值，会立刻刷新到主内存，其他线程读取的时候也一定会去主内存重新加载，不会读到自己工作内存里的过期缓存值，这是靠 JMM 里定义的 happens-before 规则加上底层的内存屏障来保证的，具体到 x86 上会插入 lock 前缀的指令，既保证缓存一致性也防止重排序。有序性是说编译器和处理器不能把 volatile 变量前后的读写指令重排到跨越这个 volatile 操作，常见的场景就是双重检查锁单例，用 volatile 修饰实例变量防止对象初始化和引用赋值被重排序，导致其他线程拿到一个还没构造完的半成品对象。</p>\n<p>但是 volatile 不能保证原子性，像 i++ 这种复合操作，即使 i 是 volatile 的，也会出现读取、加一、写回三步之间被别的线程插入的情况，导致结果丢失更新，这种场景还是得用 synchronized 或者 AtomicInteger 这类 CAS 实现的原子类。实践中 volatile 比较适合用作状态标志位，比如一个 boolean 的 running 标志，一个线程改另一个线程读，没有复合操作的场景。</p>\n<p><strong>记忆点：volatile 管可见性和禁止重排序，不管原子性，复合操作照样会出问题。</strong></p>"}, {"qnum": 4, "qtext": "CAS 是怎么工作的？ABA 问题是什么，怎么解决？顺便讲讲 AQS 和 ReentrantLock 的关系。", "freq": "高频", "answerHtml": "<p>CAS 全称 compare and swap，是一条 CPU 提供的原子指令，接受三个值：内存地址、期望的旧值、要写入的新值，只有当内存里当前的值等于期望值时才会更新成新值，否则什么都不做，整个过程是硬件层面保证原子性的，Java 里通过 Unsafe 类（现在是 VarHandle）暴露出来，AtomicInteger 之类的原子类底层都是一个自旋加 CAS 的循环，失败了就重试。这样做的好处是避免了加锁带来的线程挂起唤醒的开销，属于乐观锁思路。</p>\n<p>ABA 问题是说一个值从 A 变成 B 又变回 A，另一个线程用 CAS 判断的时候只看值相不相等，看不出中间发生过变化，如果这个变化对业务有影响（比如基于值做了资源的分配和回收）就可能出错，典型的是无锁链表的场景。解决办法是引入版本号，Java 提供了 AtomicStampedReference，每次修改除了比较值还要比较一个单调递增的 stamp，本质是把\"值相等\"变成\"值和版本都相等\"。</p>\n<p>AQS 就是 AbstractQueuedSynchronizer，它内部维护一个 volatile 的 state 整数加一个 CLH 变体的双向等待队列，用模板方法模式把获取锁、释放锁的通用逻辑（排队、阻塞、唤醒）都写好了，具体怎么判断算不算拿到锁交给子类实现 tryAcquire/tryRelease。ReentrantLock 就是 AQS 的一个典型实现，它内部有个继承了 AQS 的 Sync，state 表示重入次数，加锁就是对 state 做 CAS，公平锁在 tryAcquire 里多判断一下队列里有没有排在前面的线程，非公平锁直接上来就抢。</p>\n<pre><code>// 非公平锁 tryAcquire 简化逻辑\nfinal boolean nonfairTryAcquire(int acquires) {\n    int c = getState();\n    if (c == 0) {\n        if (compareAndSetState(0, acquires)) {\n            setExclusiveOwnerThread(Thread.currentThread());\n            return true;\n        }\n    } else if (getExclusiveOwnerThread() == Thread.currentThread()) {\n        setState(c + acquires); // 重入\n        return true;\n    }\n    return false;\n}</code></pre>\n<p><strong>记忆点：CAS 是乐观锁的硬件基础，AQS 用 state+队列把加锁语义模板化，ReentrantLock 是它最经典的落地。</strong></p>"}, {"qnum": 5, "qtext": "线程池的核心参数有哪些，任务提交后的执行流程是怎样的？拒绝策略都有哪几种？", "freq": "高频", "answerHtml": "<p>ThreadPoolExecutor 的构造参数一共七个：corePoolSize 核心线程数、maximumPoolSize 最大线程数、keepAliveTime 和它的单位，控制非核心线程空闲多久被回收、workQueue 任务队列、threadFactory 用来定制线程创建（比如设置名字、是否守护线程）、还有 handler 拒绝策略。</p>\n<p>执行流程是这样的：提交任务时，如果当前线程数还没到核心线程数，直接新建线程执行，不管有没有空闲线程；如果核心线程数已经满了，任务会被放进队列排队；如果队列也满了，才会继续创建线程直到最大线程数；如果最大线程数也满了，新任务就会触发拒绝策略。这里有个常见误区，很多人以为核心线程用完了会先扩容到最大线程数再排队，其实顺序是先排队后扩容，所以队列如果设置成无界的（比如默认的 LinkedBlockingQueue 不指定容量），maximumPoolSize 这个参数基本就是摆设，永远不会触发。</p>\n<p>拒绝策略内置四种：AbortPolicy 直接抛异常，是默认策略；CallerRunsPolicy 让提交任务的线程自己去执行，起到一个反压降速的效果；DiscardPolicy 悄悄丢掉任务不抛异常；DiscardOldestPolicy 丢掉队列里最老的任务再尝试提交当前任务。生产环境一般不建议用默默丢弃的两种，容易导致问题难以排查，通常会自定义拒绝策略加日志或者降级处理。</p>\n<p>参数调优上，CPU 密集型任务线程数一般设成 CPU 核数加一，避免过多线程切换开销；IO 密集型任务由于线程经常阻塞在等待上，线程数可以设置得更大，经验公式是 CPU 核数乘以（1+平均等待时间/平均计算时间），具体还是要结合压测调整。</p>\n<p><strong>记忆点：满核心线程先进队列，队列满了才扩容到最大线程数，无界队列会让 maximumPoolSize 形同虚设。</strong></p>"}, {"qnum": 6, "qtext": "ConcurrentHashMap 和 CopyOnWriteArrayList 是怎么保证线程安全的？", "freq": "中频", "answerHtml": "<p>ConcurrentHashMap 在 JDK 7 和 JDK 8 实现差别很大。JDK 7 是分段锁思路，把整个数组切成多个 Segment，每个 Segment 继承自 ReentrantLock 自己管一段数据，不同段之间的写操作可以并行，锁粒度比直接对整个 Map 加锁小很多。JDK 8 之后放弃了分段锁，改成数组加链表加红黑树的结构，跟 HashMap 类似，但加锁粒度进一步细化到每个桶：插入的时候如果桶是空的，直接用 CAS 无锁写入；如果桶已经有元素了（发生了哈希冲突），才对这个桶的头节点加 synchronized 锁，只锁住这一个桶，不影响其他桶的并发读写，另外链表转红黑树的阈值和 HashMap 一样是 8。读操作基本不加锁，靠 volatile 保证可见性，size 统计用了类似 LongAdder 的分段计数思路减少并发写同一个计数器的争用。</p>\n<p>CopyOnWriteArrayList 走的是完全不同的思路，叫写时复制。每次执行 add、remove 这种写操作，都会先加一把 ReentrantLock，然后把底层数组整个复制一份新数组，在新数组上做修改，改完再把引用指向新数组，volatile 保证了引用切换的可见性。这样做的好处是读操作完全不用加锁，读的永远是某个时间点的快照，天然线程安全，代价是每次写都要付出数组拷贝的内存和时间开销，还有迭代器是弱一致性的，遍历过程中别的线程做了修改，迭代器感知不到，不会抛 ConcurrentModificationException。所以它只适合读远多于写、而且数据量不大的场景，比如监听器列表。</p>\n<p><strong>记忆点：ConcurrentHashMap 是细粒度加锁加 CAS，CopyOnWriteArrayList 是拿空间和拷贝开销换读的无锁化。</strong></p>"}, {"qnum": 7, "qtext": "CountDownLatch、Semaphore、CyclicBarrier 这三个协作工具怎么选，分别用在什么场景？", "freq": "中频", "answerHtml": "<p>这三个都在 java.util.concurrent 包下，靠 AQS 实现，但语义完全不一样。CountDownLatch 是一个一次性的倒计时器，构造的时候指定一个数字，调用 countDown 会把计数减一，其他线程调用 await 会一直阻塞直到计数变成零，典型场景是主线程要等多个子线程都完成初始化才能继续往下走，比如启动的时候并行加载多个配置。它的关键限制是计数到零之后没法重置，用完就废了，如果想反复用同一个屏障就不合适。</p>\n<p>CyclicBarrier 正好补上这个短板，它是让一组固定数量的线程互相等待，等所有线程都到达屏障点之后再一起放行，而且可以重复使用，构造函数还能传一个 Runnable 在最后一个线程到达时触发一次回调。典型场景是把一个大任务拆成多份并行计算，每一轮计算完都要等所有分片都算完才能进入下一轮，比如多线程分片计算再汇总的场景。</p>\n<p>Semaphore 语义不太一样，它更像是控制资源访问数量的许可证机制，构造时指定许可数量，线程调用 acquire 拿一个许可，没有许可就阻塞，用完调用 release 归还，典型场景是限制同时访问某个资源（比如数据库连接、某个下游接口）的并发线程数，起到限流的作用，跟前两者主要解决\"等待协同\"的场景不同，它解决的是\"控制并发度\"。</p>\n<p><strong>记忆点：CountDownLatch 一次性等待、CyclicBarrier 可循环互相等待、Semaphore 管的是并发访问的许可证数量。</strong></p>"}, {"qnum": 8, "qtext": "怎么排查线上出现的死锁问题？平时怎么预防死锁？", "freq": "低频", "answerHtml": "<p>死锁产生要同时满足四个条件：互斥（资源同一时间只能被一个线程占用）、请求并保持（拿着已有资源还去申请新资源）、不可剥夺（资源不能被强制抢走）、循环等待（多个线程形成一个环形的等待链）。破坏其中任意一个条件就能避免死锁，实践中最常用的是破坏循环等待，也就是约定所有线程申请多把锁的时候都按照固定的全局顺序去申请，比如按对象的 hashCode 或者业务 ID 排序后加锁，这样就不会出现 A 等 B 同时 B 等 A 的情况。</p>\n<p>排查上，线上如果怀疑死锁，第一步是用 jstack 加进程号把线程栈打出来，jstack 在检测到死锁的时候会直接在 dump 里给出一段\"Found one Java-level deadlock\"的提示，把互相等待的线程和它们各自持有、等待的锁对象都列出来，非常直观；如果是用 JConsole 或者 Arthas 这类工具，也有图形化或者命令行的死锁检测功能，Arthas 的 thread -b 命令能直接定位阻塞其他线程的那个线程。如果没有现成工具，也可以手动看 dump 里状态是 BLOCKED 的线程，看它在等哪个锁（waiting to lock 后面那个对象地址），再看这个锁被哪个线程持有（locked 那一行），顺着这条链路手动画出等待图。</p>\n<p>预防上除了统一加锁顺序，还可以尽量用带超时的 tryLock 代替无限等待的 lock，超时后主动释放已持有的资源重试，或者尽量减少锁的嵌套、缩小锁的粒度和持有时间，能不用嵌套锁就不用。</p>\n<p><strong>记忆点：死锁排查靠 jstack 找循环等待链，预防的核心手段是统一加锁顺序和用带超时的 tryLock。</strong></p>"}, {"qnum": 9, "qtext": "ThreadLocal 的实现原理是什么？为什么容易造成内存泄漏，实际项目里怎么规避？", "freq": "高频", "answerHtml": "<p>ThreadLocal 并不是把变量存在 ThreadLocal 对象自己身上，而是存在每个 Thread 对象内部持有的一个 ThreadLocalMap 里。这个 Map 的 key 是 ThreadLocal 实例本身（用弱引用包装），value 是实际存的值，所以说到底\"线程隔离\"靠的是每个线程都拿着自己的一份 Map，彼此互不干扰，取值的时候也是先拿到当前线程，再从它自己的 Map 里按 key 查。ThreadLocalMap 内部是用开放地址法实现的简化版哈希表，解决哈希冲突靠线性探测往后找空位，而不是链表。</p>\n<p>内存泄漏的根源在于 key 是弱引用但 value 是强引用。假设 ThreadLocal 变量本身失去了外部的强引用（比如方法执行完局部变量出了作用域），GC 发生时 key 会被回收变成 null，但 Entry 里的 value 仍然被 ThreadLocalMap 强引用着，如果这个线程后续一直存活（典型场景就是线程池里的线程会被反复复用，长期不销毁），这条 value 就永远没人清理，逐渐堆积就造成了内存泄漏。虽然 ThreadLocalMap 在 get/set 的时候会顺带做一些探测式清理（发现 key 为 null 的 entry 就顺手清掉），但这只是被动触发，不保证及时。实际项目里规避的办法是用完之后主动调用 remove()，尤其在线程池场景下，一定要在 finally 里清理，不能依赖 GC。</p>\n<pre><code>private static final ThreadLocal&lt;String&gt; TRACE_ID = new ThreadLocal&lt;&gt;();\ntry {\n    TRACE_ID.set(traceId);\n    // 业务逻辑\n} finally {\n    TRACE_ID.remove(); // 线程池复用线程时必须清理\n}</code></pre>\n<p><strong>记忆点：弱引用 key 加强引用 value 是泄漏的根，线程池场景下用完必须手动 remove。</strong></p>"}, {"qnum": 10, "qtext": "Future 和 CompletableFuture 有什么本质区别？CompletableFuture 常见的组合用法能举例说明吗？", "freq": "高频", "answerHtml": "<p>Future 只是描述了一个异步任务\"将来会有结果\"这件事，但它本身能力很有限：拿结果只能靠 get() 阻塞等待（或者带超时的 get），没有办法注册回调，也没办法把多个异步任务串联或者合并起来，如果想在任务完成后接着做点什么，只能自己开线程不断轮询 isDone()，写起来很别扷。</p>\n<p>CompletableFuture 是 JDK 8 引入的增强版，同时实现了 Future 和 CompletionStage 接口，核心价值是支持非阻塞的回调编排。它提供了一整套链式方法：thenApply 对结果做转换、thenAccept 消费结果没有返回值、thenCompose 把两个有依赖关系的异步任务串联起来（类似 flatMap，避免 Future 嵌套 Future）、thenCombine 把两个互相独立的异步任务的结果合并处理、exceptionally 和 handle 处理异常。还可以指定用哪个线程池执行回调（thenApplyAsync 传入自定义 Executor），避免所有回调都挤占默认的 ForkJoinPool.commonPool。</p>\n<pre><code>CompletableFuture&lt;String&gt; f1 = CompletableFuture.supplyAsync(() -&gt; queryUser());\nCompletableFuture&lt;String&gt; f2 = CompletableFuture.supplyAsync(() -&gt; queryOrder());\nCompletableFuture&lt;String&gt; result = f1.thenCombine(f2, (user, order) -&gt; user + order)\n        .exceptionally(ex -&gt; \"fallback\");</code></pre>\n<p>实际项目里最常见的用法是把几个互不依赖的下游调用（比如查用户信息和查订单信息）用 supplyAsync 并行发出去，再用 thenCombine 或者 allOf 汇总结果，比串行调用能省下不少总耗时。</p>\n<p><strong>记忆点：Future 只能被动等结果，CompletableFuture 能编排回调链，还能指定线程池隔离执行。</strong></p>"}, {"qnum": 11, "qtext": "Fork/Join 框架的原理是什么？工作窃取算法解决了什么问题？", "freq": "中频", "answerHtml": "<p>Fork/Join 是 JDK 7 引入的、专门用来处理可以递归拆分的计算密集型任务的框架，核心思想是分治：把一个大任务不断 fork 拆分成足够小的子任务，子任务并行计算，算完之后再 join 把结果合并起来，典型应用就是并行求和、并行排序，parallelStream 底层用的正是 ForkJoinPool。使用时一般继承 RecursiveTask（有返回值）或者 RecursiveAction（无返回值），在 compute 方法里判断任务规模是否小于阈值，小于就直接算，否则拆成两半分别 fork 出去再 join 等结果。</p>\n<p>它最核心的设计是工作窃取（work-stealing）算法。ForkJoinPool 里每个工作线程都维护一个自己的双端任务队列，线程正常情况下从自己队列的头部取任务执行，而当自己队列空了、没活干的时候，会去随机挑一个别的线程的队列，从尾部\"偷\"一个任务过来执行。这样设计的好处是既减少了多线程竞争同一个队列头部的锁开销（自己从头取、别人从尾偷，大概率不会碰撞），又能让先完成任务的线程主动去分担别人的负载，避免出现有的线程闲着、有的线程还在拼命拆任务的不均衡情况，整体吞吐比传统线程池搭配单一共享队列的模式更高。</p>\n<pre><code>class SumTask extends RecursiveTask&lt;Long&gt; {\n    protected Long compute() {\n        if (size &lt;= THRESHOLD) return sumDirectly();\n        SumTask left = new SumTask(...), right = new SumTask(...);\n        left.fork();\n        return right.compute() + left.join();\n    }\n}</code></pre>\n<p><strong>记忆点：分治拆任务、工作窃取解决线程负载不均衡，是 parallelStream 和大量并行计算库的底层基础。</strong></p>"}, {"qnum": 12, "qtext": "生产者消费者模型有哪几种常见实现方式，各自的特点是什么？", "freq": "中频", "answerHtml": "<p>最基础的一种是用 synchronized 配合 wait/notify 手写一个阻塞队列：生产者往队列里放数据前先判断队列是否已满，满了就 wait 释放锁进入等待，消费者取走一个元素之后要 notifyAll 唤醒可能在等待的生产者，反过来队列空的时候消费者也要 wait，被生产者放入数据后唤醒。这种写法能说明原理但生产环境基本不会手写，因为要自己处理虚假唤醒（用 while 循环重新判断条件而不是 if）等细节，容易出错。</p>\n<p>更常见的是直接用 JDK 提供的 BlockingQueue 实现，比如 ArrayBlockingQueue、LinkedBlockingQueue，内部已经把加锁、条件变量（Condition）的等待通知逻辑封装好了，生产者调用 put，队列满了自动阻塞，消费者调用 take，队列空了自动阻塞，代码量少还不容易出并发问题，日常业务代码里的异步任务缓冲、线程池的任务队列本身也是这个模型的体现。</p>\n<p>再往上一层是用消息队列（Kafka、RocketMQ）做跨进程、跨服务的生产者消费者模型，这时候不只是解决并发协调问题，还额外解决了流量削峰、系统解耦、消息持久化这些问题，代价是引入了网络和外部组件依赖，一致性和延迟的保证也更复杂。</p>\n<p>还有一种是基于 Disruptor 这类无锁环形队列实现的高性能生产者消费者模型，靠 CAS 和内存屏障代替锁，吞吐量比传统阻塞队列高出一个量级，常用于对延迟极度敏感的交易系统。</p>\n<p><strong>记忆点：手写 wait/notify 讲原理，BlockingQueue 是工程标准做法，MQ 解决跨进程场景，Disruptor 追求极致吞吐。</strong></p>"}, {"qnum": 13, "qtext": "读写锁 ReadWriteLock 解决了什么问题？什么场景下用它比普通的互斥锁更合适？", "freq": "中频", "answerHtml": "<p>普通的 ReentrantLock 是互斥锁，不管是读操作还是写操作，同一时刻都只允许一个线程拿到锁，如果业务场景是读操作远多于写操作（比如一份配置数据，大量线程频繁读取，偶尔才有一次更新），用互斥锁会让本来互不冲突的多个读操作也被迫排队，浪费了并发能力。</p>\n<p>ReadWriteLock（常用实现是 ReentrantReadWriteLock）把锁拆成读锁和写锁两把：多个线程可以同时持有读锁，读锁之间不互斥；但写锁是互斥的，一旦有线程持有写锁，其他线程无论是想读还是想写都必须等待，同时如果已经有线程持有读锁，写锁也拿不到，反过来也一样，读写互斥。这样在读多写少的场景下，大量读线程可以并发执行，只有在真正发生写操作时才退化成互斥，整体吞吐比全程互斥要高得多。它底层还是基于 AQS 实现的，state 的高 16 位记录读锁的持有数量，低 16 位记录写锁的重入次数，用同一个 int 巧妙地拆出两种状态。</p>\n<p>需要注意的坑是不支持锁升级：如果一个线程已经持有读锁，再想在读锁基础上申请写锁会导致死锁（因为要等其他线程释放读锁，而其他线程可能也在等你释放），只能先完全释放读锁再去申请写锁；但支持锁降级，持有写锁的线程可以在释放写锁之前先申请读锁，这样能保证数据在写完之后立刻可见并且不被其他写线程插入修改。</p>\n<p><strong>记忆点：读读不互斥、读写互斥、写写互斥，适合读多写少场景，不支持锁升级但支持锁降级。</strong></p>"}, {"qnum": 14, "qtext": "StampedLock 相比 ReadWriteLock 做了哪些优化？使用时要注意什么陷阱？", "freq": "低频", "answerHtml": "<p>ReentrantReadWriteLock 虽然让读操作之间不互斥，但读锁本身还是要维护状态、走 AQS 的加锁流程，在读操作占绝大多数且竞争激烈的场景下，读锁本身的 CAS 竞争和内存同步开销仍然不小。StampedLock 是 JDK 8 引入的进一步优化，它在读写锁之外新增了一种\"乐观读\"模式：tryOptimisticRead 甚至不加锁，只是返回一个版本戳（stamp），线程拿着这个戳去读数据，读完之后调用 validate(stamp) 检查这段时间内有没有发生过写操作，如果没有就说明读到的数据是一致的，直接用；如果验证失败（说明期间有写线程修改过数据），再降级成正常的悲观读锁重新读一次。因为乐观读完全不阻塞、不涉及锁竞争，在读远多于写且冲突概率不高的场景下性能比 ReadWriteLock 有明显提升。</p>\n<p>使用上有几个陷阱要注意。第一，StampedLock 不支持重入，同一个线程重复获取读锁或写锁会直接死锁，这跟 ReentrantReadWriteLock 完全不同，用之前一定要确认业务代码没有递归调用锁。第二，它不是基于 AQS 实现的，也不支持 Condition，功能上更底层更受限。第三，乐观读期间读到的数据本身没有做任何保护，如果读的过程中恰好发生了写操作，读到的可能是不一致的中间状态，必须用 validate 校验，而且如果读操作本身涉及多个字段，中间态可能读出语义上不合法的组合，用的时候要格外小心变量捕获的顺序。</p>\n<pre><code>long stamp = lock.tryOptimisticRead();\nint x = this.x, y = this.y; // 读多个字段\nif (!lock.validate(stamp)) {\n    stamp = lock.readLock();\n    try { x = this.x; y = this.y; } finally { lock.unlockRead(stamp); }\n}</code></pre>\n<p><strong>记忆点：StampedLock 用乐观读的版本戳规避锁竞争开销，代价是不可重入、不支持 Condition，用之前先确认没有递归加锁的场景。</strong></p>"}, {"qnum": 15, "qtext": "LockSupport 的 park/unpark 是怎么实现线程阻塞和唤醒的？和 wait/notify 相比有什么优势？", "freq": "中频", "answerHtml": "<p>LockSupport 是 JDK 提供的一组底层线程阻塞原语，park() 会让当前线程阻塞，unpark(thread) 会让指定的线程从阻塞中恢复，AQS 内部排队等锁的逻辑、以及很多并发工具类底层都是靠它实现线程的挂起和唤醒的。它的底层依赖每个线程对象关联的一个\"许可\"（permit），可以理解成一个只有 0 和 1 两种状态的信号量：调用 park 时，如果当前许可是 1，会立刻消耗掉这个许可直接返回，不会真正阻塞；如果许可是 0，线程才会真正被挂起等待。调用 unpark 时会把目标线程的许可置为 1，如果目标线程当前正阻塞在 park，就会被唤醒；如果目标线程还没执行到 park，许可会被\"记住\"，等它之后调用 park 时直接消耗掉这个许可立刻返回，不会永远阻塞。</p>\n<p>跟 wait/notify 相比，最大的优势是不需要先获取锁再进行等待通知，wait 必须在 synchronized 块里配合对应的锁对象调用，而 park/unpark 面向的是具体的线程对象，可以在任意地方调用，没有加锁的前提要求，也不容易遇到 notify 早于 wait 导致信号丢失的问题（因为许可会被记住），这也是它被 AQS 这类底层同步组件选用的原因——不依赖锁对象、语义更细粒度、更适合构建其他同步工具。</p>\n<p><strong>记忆点：park/unpark 靠一个二元许可实现，不要求先持有锁，且 unpark 先于 park 调用也不会丢失信号，是 AQS 排队阻塞的底层机制。</strong></p>"}, {"qnum": 16, "qtext": "线程安全的单例模式有哪几种实现方式？各自的优缺点是什么？", "freq": "高频", "answerHtml": "<p>最常见的一种是双重检查锁（DCL），在 getInstance 里先判断实例是否为空，为空才进 synchronized 块，进去之后再判断一次（防止多个线程都通过了第一次判断排队等锁），确认还是空才真正 new。这里有个容易漏掉的细节：实例变量必须用 volatile 修饰，因为对象创建不是一个原子操作，分配内存、初始化字段、赋值引用这几步可能被重排序，如果没有 volatile，另一个线程可能拿到一个引用不为空但内部字段还没初始化完的\"半成品\"对象。</p>\n<p>第二种是静态内部类持有，利用类加载机制本身的线程安全性：JVM 保证一个类的静态初始化只会执行一次且是线程安全的，把实例作为内部类的静态字段，只有外部类第一次调用 getInstance 触发内部类加载时才会真正创建实例，写法简洁又不需要显式加锁，还天然支持懒加载，是实践中比较推荐的方式。</p>\n<p>第三种是枚举单例，直接用 enum 定义只有一个枚举值，因为枚举的实例创建由 JVM 在类加载时保证线程安全和唯一性，还能天然防止反射攻击（反射没法调用枚举的构造方法创建第二个实例）和反序列化破坏单例（枚举的反序列化不会调用构造方法），是《Effective Java》推荐的写法，代价是不支持懒加载，而且如果单例本身需要传参数初始化会稍显不便。</p>\n<p>另外还有最简单粗暴的饿汉式，直接在类加载时用静态字段初始化，线程安全但牺牲了懒加载，适合初始化本身不重、能接受类加载即创建的场景。</p>\n<p><strong>记忆点：DCL 要记得 volatile 防重排序，静态内部类和枚举分别是懒加载和防攻击场景下的优选写法。</strong></p>"}, {"qnum": 17, "qtext": "Java 内存模型的三大特性——原子性、可见性、有序性分别是什么，Java 里各自靠什么机制保证？", "freq": "高频", "answerHtml": "<p>原子性说的是一个操作要么全部执行完成，要么完全不执行，不会被其他线程看到中间状态。Java 里 long 和 double 的读写在没有 volatile 修饰时理论上不保证原子性（可能被拆成两次 32 位操作，虽然主流 64 位 JVM 实际很少出现这个问题），普通的复合操作比如 i++ 本身也不是原子的。保证原子性靠的是 synchronized 加锁互斥执行，或者 CAS 配合原子类（AtomicInteger、AtomicLong 等）在硬件层面保证单次比较交换的原子性。</p>\n<p>可见性说的是一个线程对共享变量的修改，能不能及时被其他线程看到。因为每个线程有自己的工作内存（对应 CPU 缓存），修改变量默认只是先写到工作内存再择机同步回主内存，如果没有额外保证，另一个线程可能一直读到自己缓存里的旧值。保证可见性靠 volatile（写后立刻刷新到主内存、读前必须从主内存重新加载）、synchronized（解锁前必须把修改刷回主内存）、final（正确构造后其他线程能看到初始化完成的值）。</p>\n<p>有序性说的是程序执行的顺序和代码编写的顺序是否一致，编译器和处理器出于优化目的会做指令重排序，单线程内重排序不影响最终结果（保证 as-if-serial 语义），但在多线程场景下重排序可能破坏依赖关系，导致其他线程看到不合逻辑的执行顺序（比如对象引用先被赋值、构造函数却还没执行完）。保证有序性靠 volatile 插入内存屏障阻止特定重排序，以及 synchronized 通过加锁互斥间接保证临界区代码不会被重排到锁外部,更本质的保证依据是 JMM 定义的 happens-before 规则,只要两个操作之间能推导出 happens-before 关系，就能保证前者对后者可见且有序。</p>\n<p><strong>记忆点：原子性靠锁或 CAS，可见性靠 volatile/synchronized/final 刷新主内存，有序性靠内存屏障和 happens-before 规则约束重排序。</strong></p>"}, {"qnum": 18, "qtext": "Disruptor 是什么，它是怎么在不加锁的情况下实现高吞吐生产者消费者模型的？", "freq": "低频", "answerHtml": "<p>Disruptor 是 LMAX 开源的一个高性能无锁环形队列框架，最初是为金融交易系统设计的，目标是在生产者消费者模型下把延迟和吞吐做到极致，性能比传统的 BlockingQueue 高出一个数量级，核心原因是它几乎全程避免了锁和阻塞，靠 CAS 和内存屏障实现协调。</p>\n<p>底层数据结构是一个预先分配好的定长环形数组（RingBuffer），数组大小取 2 的幂方便用位运算代替取模来定位下标。生产者和消费者各自维护一个游标（Sequence）记录自己写到或者读到了哪个位置，生产者申请写入槽位时通过 CAS 竞争性地把自己的游标往前推进，多个生产者之间的竞争是通过 CAS 自旋解决而不是加锁阻塞；消费者则持续轮询检查生产者的游标是否已经超过自己的消费游标，一旦发现有新数据就消费，消费完再推进自己的游标，这个等待策略可以配置成自旋、让出 CPU 或者阻塞等不同策略权衡延迟和 CPU 占用。为了避免\"伪共享\"问题（多个不同的 Sequence 变量恰好落在同一个 CPU 缓存行里，一个核修改了自己的变量会导致其他核对应的缓存行整体失效），Disruptor 还专门给关键的 Sequence 变量做了缓存行填充（padding），确保每个游标独占一个缓存行,进一步压榨性能。</p>\n<p>它的适用场景比较特殊，主要是单一环形缓冲区、生产消费速率差异不大、对延迟极度敏感的场合，通用业务场景直接用现成的 BlockingQueue 或者消息队列往往更划算，因为 Disruptor 的编程模型和调优复杂度明显更高。</p>\n<p><strong>记忆点：环形数组加 CAS 游标代替加锁，缓存行填充解决伪共享，是延迟敏感场景下的极致优化方案。</strong></p>"}, {"qnum": 19, "qtext": "乐观锁和悲观锁分别是什么思路，实际项目里怎么判断该用哪一种？", "freq": "中频", "answerHtml": "<p>悲观锁的假设是冲突大概率会发生，所以宁可先把资源锁住，独占访问权，其他想访问的线程只能排队等待，等当前线程用完释放锁才能继续，Java 里的 synchronized、ReentrantLock，数据库里的 select ... for update 都是悲观锁思路，好处是逻辑简单可靠，坏处是持有锁期间其他线程完全被阻塞，并发度上不去，锁粒度控制不好或者持有时间过长还容易引发线程饥饿甚至死锁。</p>\n<p>乐观锁的假设正好相反，认为冲突发生的概率不高，所以不提前加锁，先假设不会有人跟自己抢，操作完之后再检查这段时间是否真的发生了冲突，如果没冲突就直接提交，如果检测到冲突就重试或者放弃。Java 里最典型的实现是 CAS，数据库层面常见的做法是给记录加一个 version 字段或者 update_time 字段，更新的时候把这个字段作为 where 条件的一部分一起提交，如果更新影响行数是 0 说明中间被别人先改过了，业务层再决定重试还是报错给用户。乐观锁的好处是没有锁本身的阻塞开销，并发度更高，但在冲突特别频繁的场景下，反复失败重试反而会比直接加锁效率更低，属于自旋消耗换取无锁化的一种取舍。</p>\n<p>实际项目里判断的标准主要看冲突概率和持有资源的时间：读多写少、单次操作耗时短的场景（比如商品库存扣减、账户余额更新这类短事务）优先用乐观锁，配合重试机制吞吐更高；而像跨多张表的复杂事务操作，或者本身冲突就非常频繁、乐观锁重试成本反而更高的场景（比如秒杀场景下同一行数据被海量并发抢），往往还是配合悲观锁或者分布式锁再加限流手段来兜底。</p>\n<p><strong>记忆点：悲观锁先占坑保证安全,乐观锁先做完再校验版本号，冲突概率低选乐观、冲突概率高或事务复杂选悲观。</strong></p>"}, {"qnum": 20, "qtext": "不可变对象在并发编程里扮演什么角色？为什么说不可变性本身就是一种并发设计模式？", "freq": "低频", "answerHtml": "<p>不可变对象指的是一个对象一旦创建完成，它的内部状态就再也不能被修改，典型的例子就是 String、Integer 这类包装类，以及自己设计的所有字段用 final 修饰、不提供任何 setter、构造完成后状态就固定下来的对象。它对并发编程的价值在于：既然状态不会变，那么天然就不存在多个线程同时修改同一个对象引发的数据竞争问题，多个线程可以自由地共享同一个不可变对象的引用，完全不需要加锁、不需要考虑可见性问题（只要正确发布，也就是构造完成后才把引用暴露出去），因为读取一个永远不会变的值不需要任何同步手段。</p>\n<p>这也是为什么可以把不可变性当成一种正式的并发设计模式来看待：与其花精力去设计复杂的锁方案保护一个可变对象的并发访问安全，不如从设计上直接消除\"状态会变\"这个前提，问题自然就不存在了，这比任何锁机制都更彻底、更没有性能损耗。实际项目里常见的应用是：用不可变的值对象（Value Object）封装配置信息、DTO、消息体，在多线程之间传递数据时优先传不可变对象而不是可变的实体；再比如做缓存的时候，缓存的对象如果是不可变的，读线程拿到引用后随便用不用担心被其他线程篡改，也不需要每次读之前加锁保护；函数式编程和 Stream API 大量鼓励不产生副作用的写法，本质上也是在借助不可变性简化并发场景下的推理难度。</p>\n<p><strong>记忆点：状态不能变就没有并发冲突的前提，用不可变对象设计核心数据结构比任何加锁方案都更彻底地解决线程安全问题。</strong></p>"}, {"qnum": 21, "qtext": "ThreadLocal 在实际项目里有哪些典型应用场景？以 traceId 全链路追踪为例说一下具体怎么落地。", "freq": "中频", "answerHtml": "<p>ThreadLocal 最核心的价值是在同一个线程的调用链路上传递上下文信息，避免把这些信息作为参数一层层往下传导致方法签名被污染。除了链路追踪，常见的场景还有：Spring 事务管理里用 ThreadLocal 保存当前线程绑定的数据库连接（同一个事务内多次操作要用同一个 Connection）；用户登录上下文的传递，在网关或者拦截器里解析出当前登录用户信息存到 ThreadLocal，后续业务代码里随时能拿到，不用每个方法都传 userId；SimpleDateFormat 这类线程不安全的工具类，通过 ThreadLocal 给每个线程一份独立实例避免并发问题。</p>\n<p>以 traceId 为例，典型做法是在网关或者第一层入口的拦截器里，判断请求头里有没有携带上游传来的 traceId，没有就生成一个全局唯一 ID（一般是 UUID 或者结合时间戳、机器标识的算法），放进 ThreadLocal，同时写入 MDC（Mapped Diagnostic Context，日志框架 logback/log4j2 提供的机制），这样后续这个线程里打的所有日志都能自动带上这个 traceId，不需要每条日志手动拼接。调用链往下传递时，如果是同步调用要在发起 RPC 或者 HTTP 调用前把 traceId 放进请求头带给下游服务；如果是跨线程（比如提交到线程池执行异步任务），因为子线程不会自动继承父线程的 ThreadLocal 值，需要手动在提交任务时把值取出来，在子线程执行的任务里重新 set 一遍，实际项目里通常会用阿里开源的 TransmittableThreadLocal（TTL）来自动处理线程池场景下的传递和恢复问题，而不是自己手写包装逻辑。整条链路最后要记得在 finally 里清理 ThreadLocal，避免线程池复用导致 traceId 串号。</p>\n<p><strong>记忆点：ThreadLocal 用于同线程上下文传递，跨线程池场景默认不会继承，生产环境一般用 TTL 解决异步传递问题。</strong></p>"}, {"qnum": 22, "qtext": "parallelStream 背后用的是哪个线程池？在生产环境使用它有什么风险，怎么规避？", "freq": "中频", "answerHtml": "<p>parallelStream 底层依赖的是 Fork/Join 框架，默认情况下所有调用 parallelStream 的地方共用同一个全局的 ForkJoinPool.commonPool()，这个公共池的大小默认是 CPU 核心数减一（保证至少留一个核给主线程），而且这个池是 JVM 级别全局共享的，不是每次调用单独创建。</p>\n<p>这就带来几个实际风险。第一，因为是全局共享，如果应用里某个地方的并行流任务恰好包含耗时很长的阻塞操作（比如里面调了一次很慢的远程接口或者数据库查询），会长时间占用公共池里为数不多的几个工作线程，导致其他完全不相关的业务代码里的 parallelStream 调用也被拖慢甚至排队等待，这种相互影响很隐蔽，排查起来比较麻烦，因为两段代码在代码层面完全没有关联。第二，公共池的大小是基于 CPU 核数算出来的，如果服务器核数比较少（比如 2 核的容器化部署环境），并行度本身就很有限，用 parallelStream 处理数据量不大的集合反而因为线程调度和任务拆分的开销超过了并行带来的收益，性能还不如直接用普通的 stream 串行处理。第三，parallelStream 内部子任务如果抛出未捕获的异常，处理起来不如普通同步代码直观。</p>\n<p>规避的办法主要是：如果确实需要在业务代码里用并行流处理耗时或者阻塞的任务，应该通过一些技巧（比如把任务包装成一个自定义 ForkJoinTask 提交到独立创建的 ForkJoinPool，而不是走默认的 commonPool）隔离出专属的线程池，不要影响公共池；对于数据量不大、或者任务本身不是 CPU 密集型的场景，优先考虑用普通线程池加 CompletableFuture 的组合方式代替 parallelStream，可控性更强；只有在纯 CPU 密集型运算、数据量足够大、能明显体现并行收益的场景才推荐直接用 parallelStream。</p>\n<p><strong>记忆点：parallelStream 默认吃全局共享的 ForkJoinPool.commonPool，混用阻塞操作会互相拖累，生产环境慎用或者自建独立池隔离。</strong></p>"}]}, {"name": "Spring 生态", "questions": [{"qnum": 1, "qtext": "Spring 容器里一个 Bean 从创建到销毁经历了哪些阶段？", "freq": "高频", "answerHtml": "<p>整个过程可以按时间顺序讲。首先容器启动时会先扫描配置类、XML 或者注解，把 Bean 的定义信息解析成 BeanDefinition 放到注册表里，这一步还没有真正创建对象。然后进入实例化阶段，Spring 会推断用哪个构造方法，通过反射（或者 CGLIB）new 出一个对象，这时候属性都还是默认值。接下来是属性填充阶段，也就是依赖注入，把 @Autowired 或者 XML 里配置的依赖设置进去。填充完之后会依次回调各种 Aware 接口，比如 BeanNameAware、BeanFactoryAware、ApplicationContextAware，让 Bean 有机会拿到自己的名字或者容器引用。</p>\n<p>再往后是初始化前置处理，所有实现了 BeanPostProcessor 的 postProcessBeforeInitialization 方法会被依次调用，然后才是真正的初始化，顺序是先执行 @PostConstruct 标注的方法，再执行实现了 InitializingBean 接口的 afterPropertiesSet，最后执行 XML 或者注解里配置的自定义 init-method。初始化完成后会调用 BeanPostProcessor 的 postProcessAfterInitialization，这一步很关键，AOP 生成代理对象就是在这里插入的，所以我们平时拿到的很多单例 Bean 其实已经是代理对象而不是原始对象了。之后 Bean 就进入正常使用阶段，容器关闭时会按顺序调用 DisposableBean 的 destroy 方法或者自定义的 destroy-method 做资源清理，比如关闭连接池。</p>\n<p><strong>记忆点：实例化、属性填充、Aware 回调、前置处理器、初始化、后置处理器（AOP 代理点）、使用、销毁，这条链要按顺序记牢。</strong></p>"}, {"qnum": 2, "qtext": "Spring 是怎么解决循环依赖的？为什么要用三级缓存而不是两级？", "freq": "高频", "answerHtml": "<p>Spring 解决的是单例场景下基于 setter 或者字段注入的循环依赖，构造器注入形成的循环依赖是无解的，因为对象都还没实例化出来，没法把一个不存在的引用注进去，这种情况 Spring 会直接抛 BeanCurrentlyInCreationException。</p>\n<p>针对可以解决的场景，Spring 用了三级缓存。第一级是 singletonObjects，存放完全初始化好的成品单例；第二级是 earlySingletonObjects，存放已经实例化但还没走完属性填充和初始化的半成品对象；第三级是 singletonFactories，存的不是对象而是一个 ObjectFactory 工厂，用来生成早期引用。整个流程是这样的：假设 A 依赖 B，B 又依赖 A，Spring 创建 A 的时候先实例化出 A 的空壳对象，把它包装成一个工厂放进三级缓存，然后开始填充 A 的属性，发现需要 B，就去创建 B，创建 B 的过程中又发现 B 依赖 A，这时候会去缓存里找 A，一级二级都还没有，就找到三级缓存里的工厂，调用这个工厂拿到 A 的早期引用，同时把这个引用挪到二级缓存并删除三级缓存里的条目，B 拿着这个 A 的早期引用完成自己的初始化，成为完整的 B 放入一级缓存，然后 A 继续拿着完整的 B 走完初始化流程，最终 A 也放入一级缓存。</p>\n<p>之所以需要三级而不是两级，核心原因是要兼容 AOP。如果一个 Bean 需要被代理，正常流程是在初始化完成后的 BeanPostProcessor 里生成代理对象，但是发生循环依赖时必须提前暴露引用，这时候如果直接暴露原始对象，后面正常流程走完又生成了一个代理对象，就会出现别的 Bean 持有原始对象、容器里最终又是代理对象的不一致问题。三级缓存里的工厂在被调用的那一刻才决定要不要提前触发 AOP 的代理逻辑，从而保证不管有没有发生循环依赖，最终暴露出去的都是同一个对象。</p>\n<p><strong>记忆点：三级缓存本质是为了在提前暴露引用的同时，兼容 AOP 代理只生成一次这个约束。</strong></p>"}, {"qnum": 3, "qtext": "Spring AOP 的动态代理是怎么实现的，JDK 动态代理和 CGLIB 有什么区别？", "freq": "中频", "answerHtml": "<p>Spring AOP 本质上是在方法调用前后插入横切逻辑，实现手段是动态代理，运行期生成一个代理对象包裹住目标对象，调用代理对象的方法时先执行通知逻辑（前置、环绕、后置、异常通知），再决定要不要调用目标对象的真实方法。</p>\n<p>JDK 动态代理要求目标类必须实现至少一个接口，Spring 会用 java.lang.reflect.Proxy 在运行时生成一个实现了同样接口的代理类，所有方法调用都会转发到 InvocationHandler 的 invoke 方法里，由它去执行通知逻辑再反射调用目标方法。CGLIB 走的是另一条路，不依赖接口，而是运行时用字节码技术动态生成目标类的一个子类，通过重写父类方法、在方法里插入拦截逻辑（MethodInterceptor）来实现代理，所以要求目标类不能是 final 的，方法也不能是 final 或者 private，否则无法被子类重写。</p>\n<p>Spring 的默认策略是，如果目标类实现了接口，优先用 JDK 动态代理；如果没有实现接口，就用 CGLIB。也可以通过配置 proxyTargetClass=true 强制所有场景都用 CGLIB，Spring Boot 2.x 之后为了保证行为一致性，默认就是全局用 CGLIB。底层执行链路上，Spring AOP 把多个 Advice 包装成一条基于 MethodInterceptor 接口的拦截器链，通过责任链模式依次调用，每个通知执行完再调用 chain.proceed 把控制权交给下一个，最终执行到目标方法。</p>\n<pre><code>// JDK 动态代理核心\nObject proxy = Proxy.newProxyInstance(loader, interfaces, (p, method, args) -&gt; {\n    before();\n    Object result = method.invoke(target, args);\n    after();\n    return result;\n});</code></pre>\n<p><strong>记忆点：有接口用 JDK 代理，没接口（或强制配置）用 CGLIB 生成子类，本质都是拦截方法调用插入通知链。</strong></p>"}, {"qnum": 4, "qtext": "Spring Boot 自动配置的原理是什么？Starter 是怎么起作用的？", "freq": "高频", "answerHtml": "<p>自动配置的入口是 @SpringBootApplication 里包含的 @EnableAutoConfiguration 注解，它通过 @Import 引入了 AutoConfigurationImportSelector，这个选择器在容器启动阶段会去加载所有候选的自动配置类。在 Spring Boot 2.7 之前，这些候选类是写在每个 jar 包 META-INF/spring.factories 文件里，按照 EnableAutoConfiguration 这个 key 罗列一批全限定类名；3.0 之后改成了 META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 文件，每行一个类名，机制类似但文件格式做了简化。</p>\n<p>拿到这一长串候选自动配置类之后，并不是全部生效，而是靠条件注解过滤，比如 @ConditionalOnClass 判断classpath 下有没有某个类存在（比如有没有引入 Redis 的客户端 jar）、@ConditionalOnMissingBean 判断容器里是不是已经有用户自定义的同类型 Bean 了（用户定义的优先，自动配置的作为兜底）、@ConditionalOnProperty 判断配置文件里有没有开启某个开关。这样一来即使自动配置类都在 classpath 上，也只有真正满足条件的那部分才会真正实例化生效，实现了\"约定优于配置、按需装配\"。</p>\n<p>Starter 本身没有什么代码逻辑，它就是一个空壳的 pom 依赖，把某个功能需要的依赖坐标（比如某个第三方客户端）和对应的自动配置模块（xxx-autoconfigure）打包在一起，遵循统一的命名规范，比如官方的是 spring-boot-starter-xxx，第三方的推荐命名成 xxx-spring-boot-starter。用户只要引入一个 Starter，就能自动拿到这个功能所需的全部依赖和默认配置，不用再手动一个个配 Bean，这也是 Spring Boot 生态里插件化组件能快速接入的原因。</p>\n<p><strong>记忆点：自动配置 = 条件注解过滤候选配置类，Starter = 依赖坐标 + 自动配置模块的打包约定。</strong></p>"}, {"qnum": 5, "qtext": "一个 HTTP 请求进来后，Spring MVC 是怎么处理并返回响应的？", "freq": "中频", "answerHtml": "<p>整个流程围绕 DispatcherServlet 这个前端控制器展开，它在 web.xml 或者 Spring Boot 内嵌容器里被注册成拦截所有请求的 Servlet。请求进来之后，DispatcherServlet 先遍历所有注册的 HandlerMapping，找到能处理这个 URL 的具体方法，也就是常说的 Handler，同时会把匹配到的拦截器（HandlerInterceptor）一起组装成一个 HandlerExecutionChain，先执行这些拦截器的 preHandle。</p>\n<p>找到 Handler 之后，DispatcherServlet 不会直接调用它，而是委托给对应的 HandlerAdapter 去执行，这一层做了适配是为了让 DispatcherServlet 不用关心 Handler 具体是普通 Controller 方法还是别的形式。HandlerAdapter 在真正调用目标方法之前，会负责把请求里的参数（路径变量、查询参数、请求体）解析并绑定到方法参数上，这里涉及到 HandlerMethodArgumentResolver 和消息转换器 HttpMessageConverter，比如遇到 @RequestBody 就会用 Jackson 之类的转换器把 JSON 反序列化成 Java 对象。方法执行完拿到返回值后，如果方法上有 @ResponseBody 或者类上有 @RestController，就直接用 HttpMessageConverter 把返回对象序列化成 JSON 写回响应体；如果是传统的返回视图名字符串，则会交给 ViewResolver 解析成具体的 View 对象，再渲染生成 HTML。最后依次执行拦截器的 postHandle 和 afterCompletion，请求处理完成。</p>\n<p><strong>记忆点：DispatcherServlet 找 Handler 交给 HandlerAdapter 执行，参数绑定和返回值处理都靠 HttpMessageConverter，视图解析只是 JSON 场景之外的另一条分支。</strong></p>"}, {"qnum": 6, "qtext": "Spring 事务的传播机制和隔离级别是怎么回事？平时项目里事务失效一般是什么原因导致的？", "freq": "高频", "answerHtml": "<p>传播机制解决的是多个带 @Transactional 的方法互相调用时，事务边界怎么划定的问题，常见的几种里，REQUIRED 是默认值，有事务就加入，没有就新建一个，绝大多数业务方法用这个就够了；REQUIRES_NEW 不管外层有没有事务都会挂起外层事务，自己开一个全新的独立事务，典型场景是日志记录这种不管主业务成不成功都要单独提交的操作；NESTED 会在当前事务里创建一个基于保存点的嵌套事务，外层回滚会带着内层一起回滚，但内层单独回滚不影响外层，适合\"部分失败可以容忍\"的场景，比如批量处理时某一条失败了想让其他条继续；此外还有 SUPPORTS、NOT_SUPPORTED、MANDATORY、NEVER 这几种相对少用，主要围绕\"有没有事务就怎么处理\"展开。</p>\n<p>隔离级别对应的是并发事务之间互相干扰的几个经典问题：READ_UNCOMMITTED 什么都不隔离，会有脏读；READ_COMMITTED 解决了脏读，但同一事务内两次读可能读到不同结果，也就是不可重复读；REPEATABLE_READ 解决了不可重复读，但理论上还可能有幻读，不过 MySQL 的 InnoDB 在 RR 级别下通过 MVCC 加间隙锁基本上也规避了幻读；SERIALIZABLE 隔离级别最高，退化成串行执行，性能最差。Spring 默认用的是底层数据库的默认隔离级别，MySQL 就是 REPEATABLE_READ。</p>\n<p>事务失效是高频的实际问题，最常见的原因是自调用：同一个类里方法 A 直接调用本类的方法 B，B 上加了 @Transactional，但因为这是通过 this 直接调用而不是走代理对象，AOP 切面根本没有生效，事务不会开启。其次是方法访问修饰符不是 public，Spring AOP 的声明式事务默认只对 public 方法生效。还有一个常见坑是异常处理不当，比如业务代码里 try-catch 把异常吞掉了没有再往外抛，或者抛出的是受检异常，而 Spring 默认只回滚 RuntimeException 和 Error，这两种情况事务都不会回滚。另外要留意数据库引擎层面，如果表用的是不支持事务的 MyISAM，再怎么加注解也没用。</p>\n<p><strong>记忆点：自调用绕过代理、非 public 方法、异常被吞或者是受检异常没配置 rollbackFor，是事务失效最常踩的三个坑。</strong></p>"}, {"qnum": 7, "qtext": "Spring Cloud 里的注册中心、网关、配置中心大概是怎么工作的？", "freq": "中频", "answerHtml": "<p>注册中心解决的是服务发现问题，以常见的 Nacos 或者 Eureka 为例，服务提供者启动后会向注册中心上报自己的地址和端口，注册中心把这些实例信息维护成一张服务名到实例列表的映射表；服务消费者不直接写死调用地址，而是定期从注册中心拉取（或者通过长轮询、推送）某个服务名对应的最新实例列表，再结合客户端负载均衡组件（比如 Ribbon 或者 Spring Cloud LoadBalancer）从中选一个实例发起调用。为了保证列表的实时性，服务实例会周期性地向注册中心发送心跳续约，注册中心如果连续几个周期收不到心跳就会把这个实例摘除，这样即使服务突然宕机也能在一定延迟内被感知到并从可用列表里剔除。</p>\n<p>网关（比如 Spring Cloud Gateway）扮演的是所有外部请求的统一入口，核心是一套路由转发机制：网关维护一批路由规则，规则里定义了什么样的请求（按路径、按 Header 等匹配)应该转发到哪个下游服务，请求进来之后会先经过一条过滤器链（Filter Chain），在转发前后可以插入鉴权、限流、日志、请求头改写这些通用逻辑，之后再把请求转发给通过负载均衡选出来的具体实例，本质上是把原来分散在各个服务里的横切关注点集中到网关这一层统一处理。</p>\n<p>配置中心（Nacos Config、Apollo、Spring Cloud Config）解决的是配置集中管理和动态刷新的问题，应用启动时从配置中心拉取自己的配置项覆盖本地默认配置，运行过程中如果配置中心的值发生变更，会通过长轮询或者消息推送的方式通知到客户端，客户端收到变更后重新拉取最新配置，并且触发 Spring 容器里配置绑定的 Bean（一般要求配合 @RefreshScope 或者类似机制）重新初始化，从而做到不重启应用就能让新配置生效。</p>\n<p><strong>记忆点：注册中心靠心跳做服务发现，网关靠路由 + 过滤器链做统一入口治理，配置中心靠长轮询/推送做动态刷新。</strong></p>"}, {"qnum": 8, "qtext": "Sentinel 和 Hystrix 在熔断限流上的实现思路有什么不同？", "freq": "低频", "answerHtml": "<p>Hystrix 是 Netflix 早期的方案，核心手段是隔离加断路器。隔离分两种，线程池隔离给每个依赖分配独立的线程池，调用别的服务的请求都丢到对应线程池里执行，即使某个依赖响应很慢也只会拖垮它自己的线程池，不会占满整个应用的资源，隔离性好但线程切换和线程池维护本身有一定开销；信号量隔离则是用计数器控制同时进入某段逻辑的并发数，不新开线程，开销小但隔离性弱，慢调用还是会占用请求线程。断路器是一个三态的状态机：正常情况下是 closed 状态请求正常放行，当失败率在滑动窗口内超过设定阈值就跳到 open 状态直接快速失败不再真正调用下游，经过一段休眠时间后进入 half-open 状态放一小部分请求探测下游是否恢复，恢复了回到 closed，没恢复就退回 open 继续等待。</p>\n<p>Sentinel 是阿里开源的方案，思路上更全面，核心概念是资源（Resource）加规则（Rule）的模型，把需要保护的接口、方法都抽象成资源，围绕资源可以配置流控规则、降级规则、系统规则、热点参数规则等多种维度。它的执行链路是责任链模式的 Slot Chain，请求经过资源时依次流过统计 Slot、流控 Slot、降级 Slot 等，每个 Slot 各司其职，底层统计用的是滑动窗口算法实时统计 QPS 和异常比例，不像 Hystrix 那样重度依赖线程池隔离，默认走的是信号量或者干脆不隔离，开销更小。</p>\n<p>相比之下 Sentinel 的优势在于功能更丰富，支持基于调用关系的限流、支持热点参数（比如某个具体商品 ID）单独限流、有开箱即用的控制台可以实时查看和动态调整规则，而 Hystrix 已经进入维护模式官方不再积极更新，新项目基本都会优先选 Sentinel 或者 Resilience4j。</p>\n<p><strong>记忆点：Hystrix 靠线程池/信号量隔离加三态断路器，Sentinel 靠滑动窗口统计加责任链式的资源规则模型，功能和性能开销上更轻量灵活。</strong></p>"}, {"qnum": 9, "qtext": "SpringApplication.run() 这一行代码背后大概做了哪些事情？", "freq": "高频", "answerHtml": "<p>调用 run 方法之前，SpringApplication 的构造阶段已经做了一些准备工作：判断当前应用类型是不是 Web 环境（根据 classpath 上有没有 Servlet 相关的类推断），加载并保存所有 ApplicationContextInitializer 和 ApplicationListener（这些是从 spring.factories 或者对应的 imports 文件里读出来的扩展点），还会推断出主启动类。</p>\n<p>真正调用 run 之后，第一步是准备环境，创建一个 SpringApplicationRunListeners 广播启动事件（ApplicationStartingEvent 等），然后构造 Environment 对象，加载各种配置来源（命令行参数、系统环境变量、application.yml、profile 对应的配置文件等）并按优先级合并起来。第二步打印 Banner（也就是启动时那个 Spring 的 ASCII 图标，可以自定义或者关闭）。第三步是创建 ApplicationContext，根据前面判断的应用类型创建对应实现（比如 AnnotationConfigServletWebServerApplicationContext），并执行前面收集到的所有 ApplicationContextInitializer 做一些初始化前的定制。第四步是核心的 refresh 阶段，也就是标准 Spring 容器刷新流程：加载 BeanDefinition、执行 BeanFactoryPostProcessor（包括触发自动配置类的解析和条件装配）、实例化所有单例 Bean、如果是 Web 应用还会在这个阶段内部创建并启动内嵌的 Tomcat/Netty 容器。最后是执行 CommandLineRunner 和 ApplicationRunner 这两类回调，让用户能在容器启动完成、Web 容器已经监听端口之后插入一段初始化逻辑（比如加载缓存预热数据），整个过程中还会不断广播不同阶段的事件（Starting、EnvironmentPrepared、ContextPrepared、Started、Ready 等）供外部监听。</p>\n<p><strong>记忆点：准备环境、创建并刷新容器（触发自动配置和内嵌容器启动）、执行 Runner 回调，全程通过事件广播暴露各阶段的扩展点。</strong></p>"}, {"qnum": 10, "qtext": "@Autowired 和 @Resource 有什么区别？项目里应该怎么选？", "freq": "高频", "answerHtml": "<p>@Autowired 是 Spring 自己提供的注解，默认按类型（byType）去容器里找匹配的 Bean 注入，如果发现同一个类型有多个实现，会再结合字段名或者参数名去匹配 Bean 的名字，如果还是匹配不到或者匹配到多个，就需要配合 @Qualifier 显式指定要注入哪一个 Bean 的名字来消除歧义；它默认要求必须能找到匹配的 Bean，找不到会直接启动失败，除非显式设置 required=false。</p>\n<p>@Resource 是 JSR-250 定义的 Java 标准注解，不是 Spring 专有的，出于兼容性考虑 Spring 也支持它。它默认按名称（byName）注入，也就是优先拿字段名或者显式指定的 name 属性去容器里找同名的 Bean，如果按名字找不到，才会退化成按类型去找。因为它是标准 JDK 注解而不是 Spring 私有的，如果项目希望减少对 Spring 框架的直接耦合，或者需要在非 Spring 容器（比如 Java EE 容器）之间保持一定的可移植性，会更倾向于用 @Resource。</p>\n<p>实际项目里选择上，如果同一类型只有一个实现，两者效果几乎没差别；如果同一接口有多个实现类，用 @Autowired 需要额外配合 @Qualifier 才能精确指定，而用 @Resource 直接指定 name 属性就能一步到位，写法上更直接。不过目前绝大多数 Spring Boot 项目里约定俗成还是用 @Autowired 配合 @Qualifier，因为它是 Spring 官方推荐且生态里绝大多数示例代码都是这个写法，两者混用不会有问题，但团队内部最好统一风格，避免代码review的时候产生不必要的争论。</p>\n<p><strong>记忆点：@Autowired 默认按类型、要配合 @Qualifier 消歧义；@Resource 默认按名称、是 JDK 标准注解，兼容性更好。</strong></p>"}, {"qnum": 11, "qtext": "Spring 里 Bean 的作用域有哪几种？singleton 和 prototype 在使用上要注意什么坑？", "freq": "中频", "answerHtml": "<p>Spring 内置的作用域主要有几种：singleton 是默认作用域，整个容器里这个 Bean 只会创建一个实例，被所有依赖它的地方共享；prototype 是每次向容器请求这个 Bean（或者作为依赖被注入）都会创建一个全新的实例；request 和 session 是 Web 环境下才有意义的作用域，request 表示每次 HTTP 请求都对应一个独立实例，请求结束实例就失效，session 表示同一个用户会话共享一个实例，会话结束才失效，此外还有更细粒度的 application（整个 ServletContext 生命周期共享）和 websocket 作用域。</p>\n<p>使用 singleton 要特别注意线程安全问题，因为容器里只有一份实例被所有请求线程共享，如果这个 Bean 内部定义了可变的成员变量（不是靠方法参数或者局部变量传递的状态），就会存在多线程并发修改同一份状态的风险，这也是为什么 Spring 官方建议 Bean 尽量设计成无状态的，所有需要变化的数据都通过方法参数传入传出,而不是存在实例字段里。</p>\n<p>prototype 的坑在于和 singleton Bean 混用时容易踩空。如果一个 singleton Bean（比如一个 Service）依赖注入了一个 prototype Bean，由于依赖注入只在 Service 被创建的那一刻发生一次，之后这个 prototype 实例就被 Service 长期持有，实际上并没有达到\"每次使用都是新实例\"的效果，这跟很多人对 prototype 的直觉理解是相反的。想真正做到每次用都拿到新实例，需要配合 ObjectFactory、@Lookup 注解的方法注入，或者用 scoped-proxy（代理模式的作用域，每次调用代理方法内部才去真正获取新实例）来解决。另外 prototype Bean 容器不会管理它的完整生命周期，销毁回调也不会自动触发，需要业务代码自己负责清理。</p>\n<p><strong>记忆点：singleton 要保证无状态或者自己加锁保证线程安全，prototype 注入进 singleton 里会退化成\"只创建一次\"，需要 @Lookup 或 scoped-proxy 才能规避。</strong></p>"}, {"qnum": 12, "qtext": "Spring 的条件装配 @Conditional 系列注解是怎么工作的？举几个常用的例子。", "freq": "中频", "answerHtml": "<p>@Conditional 是所有条件注解的基础，它接受一个实现了 Condition 接口的类作为参数，Condition 接口里的 matches 方法返回 true 或 false，决定对应的配置类或者 Bean 定义是否要生效，这个判断发生在容器解析 BeanDefinition 的阶段，早于真正实例化，本质上是给 Spring 的自动装配提供了\"按条件筛选\"的能力。</p>\n<p>Spring Boot 在这个基础上封装了一整套语义化更强的派生注解，最常用的比如 @ConditionalOnClass 判断 classpath 下是否存在指定的类（自动配置里判断有没有引入某个第三方 jar 的典型手段），@ConditionalOnMissingBean 判断容器里是否还没有指定类型的 Bean（用来实现\"用户自定义优先，框架默认配置兜底\"的效果），@ConditionalOnProperty 判断配置文件里某个属性是否等于指定值（比如根据 feature.enabled=true 决定要不要启用某个功能模块），@ConditionalOnBean 判断某个依赖的 Bean 是否已经存在于容器里，@ConditionalOnWebApplication 判断当前是不是 Web 应用环境。这些条件注解可以叠加在同一个配置类或 @Bean 方法上，多个条件是逻辑与的关系，全部满足才生效。</p>\n<p>实际业务代码里也经常自己用它，比如一个组件只在开发环境或者只在某个云厂商部署环境下需要启用，就可以自定义一个 Condition 实现（判断 Environment 里的某个 profile 或者环境变量），配合 @Conditional 挂在配置类上，做到不同环境下自动加载不同的实现，这也是插件化、多环境适配常用的设计手段。</p>\n<pre><code>@Bean\n@ConditionalOnMissingBean(DataSource.class)\npublic DataSource defaultDataSource() { ... }</code></pre>\n<p><strong>记忆点：@Conditional 在 BeanDefinition 解析阶段就决定要不要装配，Spring Boot 自动配置能\"按需生效\"全靠这一整套派生注解。</strong></p>"}, {"qnum": 13, "qtext": "Spring 的事件机制 ApplicationEvent/ApplicationListener 是怎么设计的？实际项目里用来解决什么问题？", "freq": "中频", "answerHtml": "<p>Spring 的事件机制本质是观察者模式在容器层面的实现，三个核心角色：事件本身，一般继承 ApplicationEvent（Spring 4.2 之后也支持发布任意 POJO 作为事件，不强制继承）；事件发布者，通过注入 ApplicationEventPublisher（ApplicationContext 本身就实现了这个接口）调用 publishEvent 方法把事件丢出去；事件监听者，实现 ApplicationListener&lt;T&gt; 接口或者在方法上标注 @EventListener，容器会自动把匹配事件类型的监听者注册好，事件发布之后由内部的 ApplicationEventMulticaster 负责找到所有匹配的监听者并逐一调用。</p>\n<p>它默认是同步执行的，也就是 publishEvent 这行代码会阻塞，直到所有监听者都执行完才返回，这一点经常被忽略，如果某个监听者里的逻辑比较重或者调用了外部接口，会拖慢发布事件那条主线程的整体耗时。如果想要异步处理，可以给监听方法加上 @Async（前提是开启了 @EnableAsync），让这个监听者单独在别的线程池里执行，和事件发布逻辑解耦，或者干脆把事件监听和消息队列结合起来做真正的跨进程异步。</p>\n<p>实际项目里用它主要是为了解耦：某个核心业务逻辑执行完之后，往往需要触发一堆\"旁支\"的动作，比如用户注册成功后要发欢迎邮件、要给运营系统同步一条数据、要记录审计日志，如果把这些逻辑全部写在注册方法内部，会让核心逻辑变得臃肿且和不相关的模块强耦合。改用事件机制之后，注册逻辑执行完只需要发布一个 UserRegisteredEvent，具体谁关心这个事件、关心之后要干什么，完全由各自的监听者自己决定，新增一个关注点只需要新增一个监听者，不需要改动注册的核心代码，符合开闭原则。</p>\n<pre><code>@EventListener\n@Async\npublic void onUserRegistered(UserRegisteredEvent event) {\n    mailService.sendWelcomeMail(event.getUser());\n}</code></pre>\n<p><strong>记忆点：事件机制默认同步阻塞执行，想异步要配合 @Async，核心价值是把\"主流程之后要做的旁支逻辑\"从核心业务代码里解耦出去。</strong></p>"}, {"qnum": 14, "qtext": "Spring Security 的认证和授权基础流程大概是怎样的？", "freq": "中频", "answerHtml": "<p>Spring Security 的核心是一条由多个 Filter 组成的过滤器链（FilterChainProxy），所有进入应用的请求在到达业务 Controller 之前都要先经过这条链，不同的 Filter 各自负责不同的安全关注点。认证相关最核心的是 UsernamePasswordAuthenticationFilter（表单登录场景），它会从请求里提取用户名密码，封装成一个还没认证的 Authentication 对象（UsernamePasswordAuthenticationToken），交给 AuthenticationManager 去处理。</p>\n<p>AuthenticationManager 一般是它的默认实现 ProviderManager，内部维护了一组 AuthenticationProvider，会依次尝试用它们完成认证，其中最常用的 DaoAuthenticationProvider 会调用 UserDetailsService 的 loadUserByUsername 方法从数据库或者其他存储里查出用户的真实信息（包括加密后的密码和权限列表），再用配置的 PasswordEncoder 把请求里的明文密码加密后跟数据库里存的密文比对，验证通过后返回一个已认证的 Authentication 对象，里面携带了用户的权限信息（GrantedAuthority 列表）。认证成功后，这个 Authentication 对象会被存进 SecurityContext，而 SecurityContext 又被存进 SecurityContextHolder（默认基于 ThreadLocal 实现，请求处理期间同一线程内随时可以拿到当前登录用户信息）。</p>\n<p>授权阶段发生在请求真正要访问某个资源之前，靠的是过滤器链里的 FilterSecurityInterceptor（新版本叫 AuthorizationFilter），它会结合当前请求路径对应配置的访问规则（比如某个 URL 要求必须有 ADMIN 角色）和当前用户 Authentication 里携带的权限列表，调用 AccessDecisionManager（或者新版的 AuthorizationManager）做出允许还是拒绝的判断，方法级别的权限控制（@PreAuthorize、@Secured）则是通过 AOP 在方法调用前做类似的权限校验。整个设计的核心思路是把\"认证是谁\"和\"这个人能不能做这件事\"拆成两个独立的阶段，分别由不同的组件负责。</p>\n<p><strong>记忆点：认证靠过滤器链把请求转成 Authentication 交给 AuthenticationManager 校验，授权靠 SecurityContext 里的权限信息在访问资源前做判断，两者职责分离。</strong></p>"}, {"qnum": 15, "qtext": "@Transactional 的 readOnly=true 起到什么优化作用？什么场景下应该主动加上它？", "freq": "低频", "answerHtml": "<p>readOnly=true 本质上是给这个事务打一个\"只读\"的标记，告诉底层的事务管理器和数据库这个事务里不会有写操作，从而触发几层优化。在 Spring 层面，如果使用的是 Hibernate 或者 JPA，事务标记为只读之后，框架可以跳过一些默认的\"脏检查\"逻辑，也就是不需要在事务提交时对比实体对象的当前状态和加载时的初始快照来决定要不要生成 UPDATE 语句，这在批量查询大量实体对象的场景下能省下明显的 CPU 开销。</p>\n<p>在数据库层面，如果驱动支持（比如 MySQL 的 JDBC 驱动），Spring 会把 readOnly 信息通过 Connection.setReadOnly(true) 传递下去，数
