据库或者连接池可以据此做进一步优化，比如 MySQL 在主从架构下，配合 Spring 的 AbstractRoutingDataSource 结合读写分离方案时，可以根据这个标记自动把只读事务路由到从库执行，减轻主库压力；另外部分数据库在只读事务下可以跳过一些锁的申请或者用更宽松的隔离检查，减少锁竞争。</p>\n<p>需要强调的是 readOnly 本身并不是数据库层面强制的\"防止写入\"的安全屏障，它更多是一种优化提示（hint），如果在 readOnly=true 的事务里执行了写操作，行为是不确定的，有的数据库驱动会直接抛异常，但不能把它当成权限校验来用，真正防止误写还是要靠业务逻辑本身的设计。使用场景上，只要是纯查询的方法，尤其是涉及批量查询大对象或者需要走读写分离路由到从库的场景，都应该主动标注 readOnly=true，这是一个成本很低、但能带来实际性能收益的好习惯。</p>\n<p><strong>记忆点：readOnly=true 能省掉脏检查开销、配合读写分离路由到从库，是优化提示而不是强制的写保护机制。</strong></p>"}, {"qnum": 16, "qtext": "多数据源要怎么配置？动态切换数据源一般是怎么实现的？", "freq": "中频", "answerHtml": "<p>多数据源配置的第一步是分别定义好每个数据源对应的 DataSource、SqlSessionFactory（如果用 MyBatis）以及事务管理器 PlatformTransactionManager，每套都要显式指定 Bean 的名字，因为一旦项目里有多个 DataSource，Spring Boot 的自动配置就不能再靠默认规则去猜该注入哪一个了，需要用 @Primary 标记一个作为默认数据源，避免自动装配的时候因为找到多个候选 Bean 而报错，同时要注意 Mapper 接口的扫描包和对应的 SqlSessionFactory 要正确关联起来，防止跨数据源用错了 SqlSessionFactory 导致 SQL 执行到不该执行的库上。</p>\n<p>对于固定路由的多数据源（比如按业务模块分库，模块之间边界清晰不需要频繁切换），上面这种静态配置基本就够用了；但如果需要动态切换（最典型的场景是读写分离，同一段业务代码有时候要查主库有时候要查从库），一般会实现一个继承 AbstractRoutingDataSource 的自定义路由数据源，重写它的 determineCurrentLookupKey 方法，这个方法返回一个 key，Spring 会根据这个 key 去它内部维护的一个 Map（数据源标识到真实 DataSource 的映射）里找到真正要用的数据源。key 的来源通常是存在 ThreadLocal 里的一个标识，业务代码在执行数据库操作之前，通过自定义注解（比如 @DataSource(\"slave\")）配合 AOP 切面，在方法执行前把对应的标识写进 ThreadLocal，方法执行完（或者事务提交后）在 finally 里清理，从而做到不同方法调用能路由到不同的真实数据源。</p>\n<pre><code>public class DynamicDataSource extends AbstractRoutingDataSource {\n    protected Object determineCurrentLookupKey() {\n        return DataSourceContextHolder.get(); // ThreadLocal 存的标识\n    }\n}</code></pre>\n<p>这里要特别注意事务的边界问题：数据源切换必须发生在事务开启之前，如果用了 @Transactional，Spring 在方法进入事务代理逻辑时就已经从连接池里获取了 Connection，如果 AOP 切面切换数据源标识的逻辑晚于事务开启，切换就不会生效,这也是动态数据源和声明式事务混用时最容易踩的坑，实践中一般要求切换数据源的注解和切面顺序要排在事务切面之前执行。</p>\n<p><strong>记忆点：多数据源要靠 AbstractRoutingDataSource 加 ThreadLocal 标识做动态路由,切数据源的逻辑必须发生在事务开启之前才能生效。</strong></p>"}, {"qnum": 17, "qtext": "@Async 异步方法的实现原理是什么？实际使用时要注意哪些坑？", "freq": "高频", "answerHtml": "<p>@Async 的底层实现思路跟 Spring AOP 是一致的：容器启动时如果开启了 @EnableAsync，Spring 会给所有标注了 @Async 的方法所在的 Bean 生成一个代理对象（JDK 动态代理或者 CGLIB，取决于是否有接口），调用这个方法时，代理逻辑不会在当前线程直接执行方法体，而是把这次调用包装成一个任务提交给一个 Executor 线程池，然后立刻返回给调用方（如果方法返回类型是 void 就直接返回，如果是 Future 或者 CompletableFuture 类型，会返回一个可以后续获取结果的句柄），真正的方法体是在线程池的某个工作线程里异步执行的。</p>\n<p>默认情况下，如果没有显式配置 Executor，Spring 会用 SimpleAsyncTaskExecutor，这个执行器有个很大的问题——它不是真正意义上的线程池，不会复用线程，每次调用都会新建一个线程，没有任何线程数量上限的控制，生产环境下如果异步调用频率高，很容易把服务器线程数撑爆，所以生产环境必须自己定义一个 ThreadPoolTaskExecutor 并显式指定给 @Async（比如 @Async(\"myExecutor\")），配置合理的核心线程数、队列容量和拒绝策略。</p>\n<p>其他常见的坑跟事务失效的坑很类似：自调用同样会导致 @Async 失效，因为绕过了代理对象；异步方法内部抛出的异常，如果返回类型是 void，异常会被默认的异常处理器直接吃掉打日志，调用方完全感知不到，容易导致\"业务明明失败了但看起来正常\"的假象，需要通过实现 AsyncUncaughtExceptionHandler 或者让方法返回 Future/CompletableFuture 主动捕获异常来解决；另外异步方法执行时已经脱离了原来的线程，原线程里通过 ThreadLocal 存的上下文（比如登录用户信息、事务）默认都不会带过去，需要额外处理。</p>\n<p><strong>记忆点：@Async 本质是 AOP 把方法调用转发给线程池异步执行，生产环境一定要自定义线程池，默认的 SimpleAsyncTaskExecutor 不限制线程数量非常危险。</strong></p>"}, {"qnum": 18, "qtext": "Spring Cache 抽象和 @Cacheable 注解是怎么工作的？使用时容易踩什么坑？", "freq": "中频", "answerHtml": "<p>Spring Cache 提供的是一层跟具体缓存实现无关的抽象，核心接口是 CacheManager 和 Cache，具体到底用 Redis、Caffeine 还是简单的 ConcurrentHashMap，只是替换底层的 CacheManager 实现，业务代码里的注解写法完全不用变，这也是它的主要设计价值——业务逻辑和缓存技术选型解耦。</p>\n<p>@Cacheable 标注在方法上之后，跟 @Transactional、@Async 一样是靠 AOP 生成代理实现的：方法被调用时，代理逻辑先不执行方法体，而是根据配置的 key（默认用方法参数生成，也可以用 SpEL 表达式自定义）去指定的 cache 里查有没有已经缓存的结果，有就直接返回缓存值，方法体完全不会被执行；没有命中缓存才会真正执行方法体，拿到返回值之后顺手存进缓存再返回给调用方。此外 @CachePut 是每次都执行方法体并把结果强制刷新进缓存（用于确保更新场景下缓存跟着一起更新），@CacheEvict 用来清除缓存（比如数据更新或删除后失效对应的缓存项），@Caching 可以组合多个缓存操作。</p>\n<p>常见的坑有几个：第一，自调用同样会绕开代理导致注解失效，这是 Spring AOP 系注解的通病；第二，key 的生成默认策略是把所有参数拼起来生成，如果方法有多个参数或者参数是复杂对象，默认的 key 生成规则容易产生歧义或者性能不好，最好用 SpEL 显式指定 key，比如 #userId；第三，如果缓存的返回值类型没有正确实现序列化（用 Redis 做后端存储时），运行时会抛序列化异常；第四，要留意缓存和数据库的一致性问题，@CacheEvict 一般要跟数据更新操作放在同一个事务边界内考虑，避免出现更新数据库成功但缓存清理失败（或者反过来）导致的脏数据窗口，实际项目中常见的做法是延迟双删或者结合消息队列异步保证最终一致。</p>\n<p><strong>记忆点：@Cacheable 靠 AOP 在方法执行前查缓存、未命中才真正执行方法体并写回缓存，实际使用要留意 key 生成策略和缓存与数据库的一致性问题。</strong></p>"}, {"qnum": 19, "qtext": "Spring Boot Actuator 提供的监控端点主要解决什么问题？项目里常用哪些端点？", "freq": "低频", "answerHtml": "<p>Actuator 的核心价值是给运行中的应用暴露一套标准化的运维监控接口，不需要额外开发监控代码就能拿到应用内部的健康状态、性能指标、配置信息，本质上是把应用的\"黑盒\"打开一部分给运维和监控系统看，方便做健康检查、故障排查和自动化运维决策。</p>\n<p>比较常用的端点包括：/actuator/health 返回应用整体的健康状态，默认会聚合各个组件（数据库连接、Redis、磁盘空间等）自己的健康检查结果，云平台或者容器编排系统（比如 Kubernetes 的 liveness/readiness probe）经常直接拿这个端点判断实例是否存活、是否可以接流量；/actuator/metrics 暴露 JVM 内存、GC 次数、线程数、HTTP 请求耗时分布等大量指标，通常配合 Micrometer 再对接 Prometheus 做长期存储和可视化；/actuator/env 能看到当前生效的所有配置属性来源和最终合并结果，排查配置没生效的问题时很有用；/actuator/loggers 支持在运行时动态调整某个包的日志级别，不需要重启应用就能临时把某个模块的日志调成 DEBUG 排查问题；/actuator/threaddump 和 /actuator/heapdump 可以在线上直接抓取线程栈或者堆快照，比手动登录服务器执行 jstack/jmap 更方便。</p>\n<p>使用上要注意安全问题，这些端点默认会暴露不少内部信息（比如 env 可能包含敏感的数据库密码、密钥），生产环境必须结合 Spring Security 做好访问控制，同时通过配置只暴露真正需要的端点（management.endpoints.web.exposure.include），避免把 heapdump、shutdown 这类高风险端点不加保护地暴露在公网。</p>\n<p><strong>记忆点：Actuator 把应用内部状态标准化暴露出来，health 给探活探针用、metrics 对接监控系统、loggers 支持动态调整日志级别，生产环境务必做好访问控制。</strong></p>"}, {"qnum": 20, "qtext": "Spring Boot 配置文件的加载优先级是怎样的？profile、命令行参数这些配置来源冲突时谁生效？", "freq": "中频", "answerHtml": "<p>Spring Boot 的配置加载本质上是把很多个不同来源的 PropertySource 按优先级顺序整合进同一个 Environment，取值的时候按优先级从高到低查找，只要在高优先级的来源里找到了这个 key，低优先级里同名的配置就会被覆盖、不会生效。</p>\n<p>从高到低大致的顺序是：命令行参数（比如 java -jar app.jar --server.port=8080）优先级最高，方便运维在启动时临时覆盖某个配置而不用改文件；然后是 Java 系统属性（-Dserver.port=8080）和操作系统环境变量；再往下是打包在 jar 外部、跟 jar 同级目录下的 application.yml/properties（外部配置优先于内部打包进 jar 里的配置，这也是为什么线上环境常见做法是把敏感配置放在部署目录下的外部文件里，不打进镜像）；然后才是 classpath 内部（打包进 jar 里）的 application.yml。profile 相关的配置文件（application-{profile}.yml）优先级高于不带 profile 的默认 application.yml，也就是说同一个 key，如果同时出现在 application.yml 和当前激活的 application-prod.yml 里，prod 文件里的值会覆盖默认文件。</p>\n<p>profile 本身的激活也有讲究，可以通过命令行参数 --spring.profiles.active=prod、环境变量、或者配置文件里的 spring.profiles.active 指定，多个来源同时指定的话依然遵循上面命令行优先级最高的规则。Spring Boot 2.4 之后还引入了更灵活的多文档块写法，同一个 yml 文件里可以用 --- 分隔出多个逻辑块，每块通过 spring.config.activate.on-profile 指定只在特定 profile 下生效，效果上跟拆成多个文件类似，但维护起来更集中。理解这套优先级最实际的意义是排查\"为什么改了配置文件没生效\"这类问题——大概率是被优先级更高的命令行参数、环境变量或者外部配置文件覆盖了。</p>\n<p><strong>记忆点：命令行参数 &gt; 系统属性/环境变量 &gt; 外部配置文件 &gt; 内部配置文件，同名 key 高优先级覆盖低优先级，profile 专属配置优先于默认配置。</strong></p>"}]}, {"name": "数据库与持久层", "questions": [{"qnum": 1, "qtext": "MySQL 的 InnoDB 为什么选择 B+树作为索引结构，而不是二叉树、红黑树或者哈希表？", "freq": "高频", "answerHtml": "<p>这个问题本质是在问磁盘 IO 和数据规模下什么结构最划算。先看二叉树和红黑树，它们虽然查找是 O(log n)，но每个节点只存一个键值，树的高度会随数据量线性增长，几百万数据可能要几十层，每一层对应一次磁盘 IO，代价太高。再看哈希表，等值查询是 O(1) 很快，但完全不支持范围查询和排序，<code>WHERE id &gt; 100</code> 这种条件哈希索引就废了，而业务里 range 查询、order by、group by 太常见。</p>\n<p>B+树的设计恰好针对这两个痛点。它是多叉树，每个节点(对应一个磁盘页，默认 16KB)能存下几百上千个键值，树高通常只有 3-4 层，千万级数据一次查找也就 3-4 次 IO；同时它把所有数据都放在叶子节点，非叶子节点只存索引键做导航，而且叶子节点之间用双向链表串起来，这样范围查询只要定位到起点，顺着链表扫描就行，天然支持排序和区间扫描。相比之下 B 树每个节点都存数据，同样页大小能容纳的键值数变少，树会更高，而且不支持叶子节点顺序遍历。</p>\n<p><strong>记忆点：B+树用\"矮胖\"的多叉结构把树高压到最低，还靠叶子链表把范围查询变成顺序扫描。</strong></p>"}, {"qnum": 2, "qtext": "聚簇索引和非聚簇索引有什么区别？什么是回表？覆盖索引又是怎么避免回表的？", "freq": "高频", "answerHtml": "<p>InnoDB 里聚簇索引就是主键索引，它的叶子节点直接存的是整行数据，也就是说索引和数据是放在一起的，一张表只能有一个聚簇索引。非聚簇索引（也叫二级索引）的叶子节点存的不是整行数据，而是索引列的值加上主键值，所以通过二级索引查数据，先在二级索引树里找到主键，再拿这个主键去聚簇索引里再查一次完整行，这个过程就叫\"回表\"，相当于查了两次树。</p>\n<p>回表次数多了性能就下降，这时候覆盖索引就派上用场了：如果查询需要的所有列（包括 select 的列和 where 的列）都能在这个二级索引里直接拿到，不需要再回表去查聚簇索引，就叫覆盖索引命中。比如：</p>\n<pre><code>-- idx_name_age(name, age)\nSELECT name, age FROM user WHERE name = 'Tom';  -- 覆盖索引，不回表\nSELECT * FROM user WHERE name = 'Tom';          -- 需要其他列，必须回表</code></pre>\n<p>实践中经常靠加宽联合索引（把查询用到的列都放进索引）来把随机 IO 的回表变成索引内直接返回，这是慢查询优化里性价比很高的一招。</p>\n<p><strong>记忆点：聚簇索引\"索引即数据\"，二级索引\"两次树查\"，覆盖索引\"够用就不查第二次\"。</strong></p>"}, {"qnum": 3, "qtext": "MySQL 的四种事务隔离级别分别解决什么问题？InnoDB 的 MVCC 是怎么实现可重复读的？", "freq": "高频", "answerHtml": "<p>四种隔离级别按隔离程度从低到高：读未提交会有脏读，一个事务能看到另一个事务未提交的修改；读已提交解决了脏读，但同一事务内两次查询可能读到不同结果，即不可重复读；可重复读是 MySQL 默认级别，保证同一事务内多次读取结果一致，但标准定义下理论上还可能有幻读；串行化直接用锁把并发变成串行执行，彻底杜绝并发问题但性能最差。</p>\n<p>MVCC（多版本并发控制）就是 InnoDB 用来在不加锁的情况下实现可重复读和读已提交的机制。核心是每行数据都有隐藏的版本信息（事务 ID、回滚指针），每次修改不是直接覆盖旧值，而是生成一个新版本，旧版本通过 undo log 链保留下来。事务开始时会生成一个 ReadView，记录当前活跃的事务 ID 列表，查询的时候顺着 undo log 链找到对这个事务\"可见\"的版本——原则是只能看到早于自己开始、且已经提交的事务所做的修改。读已提交是每次 SELECT 都生成新的 ReadView，所以能看到别的事务刚提交的改动；可重复读是整个事务只在第一次查询时生成一次 ReadView，之后一直复用，所以同一事务里看到的数据快照是固定的。另外 InnoDB 的可重复读还结合 Next-Key Lock 解决了大部分幻读场景，这是它比标准定义做得更好的地方。</p>\n<p><strong>记忆点：MVCC 靠\"版本链+ReadView\"实现无锁读，可重复读的关键是整个事务共用一份快照。</strong></p>"}, {"qnum": 4, "qtext": "InnoDB 的行锁、间隙锁、Next-Key Lock 和意向锁分别是做什么的？", "freq": "高频", "answerHtml": "<p>先说行锁，这是锁在具体一行数据上的，InnoDB 通过给索引记录加锁实现，注意如果查询没走索引会退化成锁全表（表锁），所以行锁生效的前提是命中索引。间隙锁锁的不是具体某一行，而是索引记录之间的\"空隙\"，目的是防止其他事务在这个区间插入新数据，从而堵住幻读——比如 <code>WHERE id BETWEEN 10 AND 20 FOR UPDATE</code>，即使这个区间目前没有数据，间隙锁也会锁住这段空间不让插入。Next-Key Lock 是行锁加间隙锁的组合，锁住一条记录本身以及它前面的间隙，这是 InnoDB 在可重复读级别下默认使用的锁算法，靠它同时防住了修改和插入两类并发问题，基本解决了幻读。</p>\n<p>意向锁则是另一个维度的东西，它是表级锁，用来快速判断表里是否已经有行锁存在，避免每次加表锁都要扫描全表的行锁情况。分意向共享锁（IS）和意向排他锁（IX），当一个事务要在某几行加行锁之前，会先在表上加对应的意向锁，这样别的事务想加表级锁时，只需要看意向锁是否冲突，不用逐行检查，是一种加锁效率的优化手段。</p>\n<p><strong>记忆点：行锁锁记录、间隙锁锁空隙、Next-Key 两者合一防幻读、意向锁是表锁与行锁之间的\"预告牌\"。</strong></p>"}, {"qnum": 5, "qtext": "拿到一条慢 SQL 之后，怎么用 EXPLAIN 分析执行计划？重点看哪些字段？", "freq": "中频", "answerHtml": "<p>拿到 SQL 先跑一遍 <code>EXPLAIN</code>，重点盯几个字段。type 是最关键的一列，反映访问类型，从好到差大致是 system/const（主键或唯一索引等值查询）、eq_ref（多表连接时用唯一索引）、ref（普通索引等值查询）、range（范围查询）、index（扫描整个索引树）、ALL（全表扫描），一般要求至少达到 range，出现 ALL 基本就是没走索引，需要重点排查。</p>\n<p>key 和 key_len 告诉你实际用了哪个索引、用了索引的多少字节，如果预期用的索引没出现在 key 里，说明索引失效了，常见原因是索引列上做了函数运算、隐式类型转换、模糊查询用了前导通配符 <code>%xxx</code>，或者联合索引没有遵守最左前缀原则。rows 是预估扫描的行数，越小越好，可以结合 filtered（过滤后剩余行的百分比）判断这个预估准不准。Extra 列信息量也很大，出现 \"Using filesort\" 说明排序没走索引，需要额外排序开销，出现 \"Using temporary\" 说明用了临时表，通常是 group by/distinct 没有对应索引，这两个都是重点优化对象；而 \"Using index\" 出现说明命中了覆盖索引，是好现象。</p>\n<p>实际排查时我一般是先看 type 和 key 判断有没有索引可用，再看 Extra 判断有没有额外的排序/临时表开销，最后结合业务场景决定是加索引、改写 SQL 还是调整表结构。</p>\n<p><strong>记忆点：type 看走法、key 看索引、Extra 看有没有排序和临时表这两个隐藏开销。</strong></p>"}, {"qnum": 6, "qtext": "线上反馈接口变慢，你会怎么一步步排查慢查询？", "freq": "中频", "answerHtml": "<p>第一步是定位问题 SQL，开启慢查询日志（<code>slow_query_log</code>），设置合理的 <code>long_query_time</code> 阈值，配合 <code>mysqldumpslow</code> 或者 pt-query-digest 把日志按执行次数和耗时汇总排序，找出真正拖慢整体的那几条 SQL，而不是凭感觉猜。也可以结合 <code>SHOW PROCESSLIST</code> 或者 <code>information_schema.processlist</code> 看当前正在跑的、卡住的查询。</p>\n<p>第二步是对定位到的 SQL 做 EXPLAIN 分析，看是索引缺失、索引失效，还是扫描行数过大、需要排序临时表。这一步经常能发现联合索引顺序不对、隐式类型转换导致索引失效之类的问题。</p>\n<p>第三步要跳出单条 SQL 本身看更大的背景：是不是这段时间数据量暴增导致原来够用的索引选择性下降了，是不是有慢事务长时间不提交占着锁导致其他查询排队等锁（这个可以查 <code>information_schema.innodb_trx</code> 和锁等待视图），是不是连接池耗尽、或者 IO/CPU 资源本身就到瓶颈了。</p>\n<p>第四步才是落地方案：加索引或者调整索引结构、拆分大事务、必要时做 SQL 改写（比如把大 IN 列表分批、把复杂子查询改成 join 或者临时表），如果是数据量级问题就要考虑分库分表或者归档历史数据。整个过程强调\"先定位、再分析、再验证\"，不要一上来就盲目加索引。</p>\n<p><strong>记忆点：慢查询排查是\"日志定位 → EXPLAIN 分析 → 排查锁与资源瓶颈 → 针对性优化\"的链路，不是拍脑袋加索引。</strong></p>"}, {"qnum": 7, "qtext": "什么时候需要分库分表？常见的分片方案有哪些坑？读写分离又是怎么落地的？", "freq": "中频", "answerHtml": "<p>一般单表数据量到几千万级、单库并发和磁盘 IO 顶不住的时候才考虑分库分表，这是有代价的架构升级，不是越早做越好。水平分表是把一张大表按某个分片键（比如用户 ID）拆到多张结构相同的表甚至多个库里，常见路由方式是取模（<code>user_id % N</code>）或者一致性哈希，取模的问题是扩容时数据要大规模迁移，一致性哈希能缓解这个问题但实现复杂一些；垂直分库分表则是按业务模块把不同的表拆到不同库，比如订单库、用户库分开，解决的是业务耦合和单库压力问题，而不是单表数据量问题。</p>\n<p>分片之后会带来几个典型的坑：一是分布式主键，不能再用单库自增 ID，得用雪花算法、号段模式这类分布式 ID 方案；二是跨分片的 join、聚合、分页变得很麻烦，通常要在应用层做二次聚合，或者靠宽表、异构索引（比如同步一份到 ES）来解决；三是分布式事务，跨库操作要么用最终一致性的方案（消息队列+补偿），要么引入 TCC/Seata 这类框架，要尽量避免强依赖分布式事务。</p>\n<p>读写分离则是另一个维度的手段，通常是先做主从复制，写操作全部走主库，读操作路由到一个或多个从库，中间用 ShardingSphere、MyCat 这类中间件，或者在代码里通过多数据源 + AOP 做路由。它解决的是读多写少场景下的读性能瓶颈，但要注意主从复制是异步的，存在延迟，写完立刻读可能读不到最新数据，对一致性要求高的场景（比如下单后立刻查订单）通常要么强制读主库，要么在从库延迟敏感的地方做特殊处理。</p>\n<p><strong>记忆点：分库分表先分垂直再分水平，核心痛点是分布式 ID 和跨库聚合；读写分离的核心风险是主从延迟。</strong></p>"}, {"qnum": 8, "qtext": "MyBatis 的一级缓存和二级缓存分别是怎么工作的？插件机制的原理是什么？", "freq": "低频", "answerHtml": "<p>一级缓存是 SqlSession 级别的，默认开启，作用域是同一个 SqlSession 内。同一个 SqlSession 里执行完全相同的查询（相同 SQL、相同参数），第二次会直接从缓存里拿结果，不再打到数据库；但只要执行了 insert/update/delete，这个 SqlSession 的一级缓存就会被清空，防止读到脏数据。因为它的生命周期跟 SqlSession 绑定，在 Spring 集成场景下，通常一个请求对应一个 SqlSession，所以一级缓存的实际收益有限，主要是同一次请求内重复查询能省一次 IO。</p>\n<p>二级缓存是 Mapper（Namespace）级别的，可以跨 SqlSession 共享，需要显式在 Mapper XML 里配置 <code>&lt;cache/&gt;</code> 才开启，底层默认基于 PerpetualCache 这种简单的 HashMap 实现，也可以接入 Redis 等分布式缓存做扩展。它的坑在于默认实现是进程内缓存，在集群多实例部署、又有其他方式（比如别的服务直接写库）绕过 MyBatis 更新数据的场景下，很容易出现缓存不一致问题，所以实际项目里二级缓存用得并不多，大部分团队更倾向自己在业务层接入 Redis 做缓存，可控性更强。</p>\n<p>插件机制则是基于 JDK 动态代理 + 责任链模式实现的。MyBatis 允许拦截四大核心对象：Executor（执行器）、StatementHandler（SQL 构建）、ParameterHandler（参数处理）、ResultSetHandler（结果映射），自定义插件实现 <code>Interceptor</code> 接口，在 <code>plugin()</code> 方法里用 <code>Plugin.wrap()</code> 给目标对象生成代理，多个插件会层层包裹，形成一条拦截链，在 <code>intercept()</code> 方法里可以在目标方法执行前后插入自己的逻辑，典型应用就是分页插件（PageHelper）、SQL 性能监控、多租户自动加条件这些场景。</p>\n<p><strong>记忆点：一级缓存是 SqlSession 私有的\"临时便签\"，二级缓存是 Mapper 共享但风险较高，插件靠动态代理层层包裹核心对象。</strong></p>"}, {"qnum": 9, "qtext": "数据库死锁是怎么产生的？线上遇到死锁该怎么排查和处理？", "freq": "高频", "answerHtml": "<p>死锁本质上是两个或多个事务互相持有对方需要的锁，又都在等对方释放，形成一个环形等待。最常见的场景是两个事务以不同顺序更新同一批行，比如事务A先锁行1再锁行2，事务B先锁行2再锁行1，谁也不让谁。InnoDB 的间隙锁（gap lock）和临键锁（next-key lock）在可重复读隔离级别下也很容易引发死锁，因为一个简单的范围更新可能会锁住比预期更大的区间。</p>\n<p>排查的话，第一步是执行 <code>SHOW ENGINE INNODB STATUS</code>，里面的 LATEST DETECTED DEADLOCK 部分会完整记录冲突的两条 SQL、涉及的锁类型和等待关系，直接能定位到具体语句。线上还可以开启 <code>innodb_print_all_deadlocks</code> 把死锁日志打到 error log 里长期保留，避免只能看最近一次。定位到之后一般从两个方向解决：一是统一多个事务里对资源的加锁顺序，比如都按主键从小到大加锁；二是缩短事务，减少锁持有时间，能拆的批量操作尽量拆小，能用乐观锁替代悲观锁的地方就不要显式加锁。</p>\n<p><strong>记忆点：死锁看 INNODB STATUS，解法是统一加锁顺序、缩短事务。</strong></p>"}, {"qnum": 10, "qtext": "乐观锁和悲观锁在数据库层面具体怎么实现，各自适合什么场景？", "freq": "高频", "answerHtml": "<p>悲观锁的思路是假设冲突一定会发生，所以先把资源锁住再操作，数据库层面对应的就是 <code>SELECT ... FOR UPDATE</code>，它会给命中的行加排他锁，其他事务想读写这行都得等锁释放。这种方式实现简单、数据一致性有保障，但并发能力差，长事务下容易造成锁等待甚至死锁，适合冲突概率高、必须串行处理的场景，比如库存扣减这种强一致要求的操作。</p>\n<p>乐观锁的思路正好相反，假设冲突很少发生，所以不加锁，而是在更新的时候做一次校验，典型做法是给表加一个 version 字段，更新语句写成：</p>\n<pre><code>UPDATE stock SET count = count - 1, version = version + 1\nWHERE id = 1 AND version = 5;</code></pre>\n<p>如果影响行数是 0，说明中间已经被别人改过，业务层就重试或者报错。也可以用时间戳或者直接对比字段值代替 version。乐观锁不占用数据库锁资源，并发性能好，但冲突高的场景下重试成本会上升，适合读多写少、冲突概率低的场景。两者选型的核心其实是冲突概率和一致性要求的权衡，冲突少用乐观锁换性能，冲突多且必须严格串行就用悲观锁换正确性。</p>\n<p><strong>记忆点：悲观锁靠数据库排他锁保证串行，乐观锁靠版本号做 CAS 式校验。</strong></p>"}, {"qnum": 11, "qtext": "count(*) 在大表上很慢，有什么优化思路？", "freq": "中频", "answerHtml": "<p>首先要弄清楚为什么慢。MyISAM 引擎会维护一个精确的行数计数器所以 count(*) 很快，但 InnoDB 因为 MVCC 的关系，不同事务看到的行数可能不一样，所以没法直接维护一个全局计数器，执行 count(*) 本质上要扫描索引（优化器会选最小的二级索引）逐行判断可见性再累加，数据量一大自然就慢。</p>\n<p>优化思路分几种情况。如果只是要一个大概的数量，不追求精确，可以用 <code>SHOW TABLE STATUS</code> 或者查 <code>information_schema.tables</code> 里的 TABLE_ROWS，这是基于统计信息的估算值，量级对但不精确，成本几乎为零。如果需要精确值又要求实时，比较常见的做法是业务层维护一个计数表，在插入删除的时候用触发器或者应用代码同步更新计数值，牺牲一点写入性能换查询性能。如果是需要按条件统计（比如某个状态下的订单数），那就要看这个条件字段有没有合适的索引，配合覆盖索引让 count 走索引扫描而不是回表。对于分析型的统计需求，更彻底的方案是引入异步统计任务或者接入 ES/ClickHouse 这类更适合聚合计算的存储，而不是死磕主库。</p>\n<p><strong>记忆点：精确实时的 count 很贵，能估算就估算，能异步统计就别同步查。</strong></p>"}, {"qnum": 12, "qtext": "深分页问题（比如 limit 100000, 10）是怎么产生的，有哪些解决方案？", "freq": "高频", "answerHtml": "<p><code>LIMIT 100000, 10</code> 这种写法看起来只取10条，但数据库其实要先扫描并丢弃前面100000条记录，再取后面10条，偏移量越大，扫描和丢弃的成本越高，这就是深分页慢的根本原因，尤其是当排序字段不是索引覆盖的情况下还要频繁回表。</p>\n<p>解决方案主要有几类。最常用的是\"游标分页\"，也叫 keyset pagination，不再用 offset，而是记录上一页最后一条记录的排序键值，下一页查询时用 <code>WHERE id &gt; 上次最后的id ORDER BY id LIMIT 10</code> 这种条件直接定位，因为走的是索引范围扫描，不管翻到多少页性能都是稳定的。缺点是不支持随意跳页，只能一页页往后翻，适合信息流、日志查询这类场景。另一种是先在索引上定位主键再回表，比如 <code>SELECT id FROM t ORDER BY id LIMIT 100000, 10</code> 先拿到这10个id（这一步是索引覆盖扫描，比全表扫快很多），再用 <code>WHERE id IN (...)</code> 去查完整数据，减少了大量的回表开销。如果业务允许，还可以直接限制用户能查看的最大页数，或者把深度翻页的场景转移到 ES 这类更适合分页检索的系统上。</p>\n<p><strong>记忆点：深分页慢在丢弃前置数据，游标分页（keyset）是根治办法。</strong></p>"}, {"qnum": 13, "qtext": "看执行计划的时候，除了 type 字段，还有哪些容易被忽视但很重要的信息？", "freq": "中频", "answerHtml": "<p>很多人看 EXPLAIN 只盯着 type 是不是 ref 或者 range，但其实 Extra 列和 possible_keys/key 的对比往往更能说明问题。Extra 里如果出现 <code>Using filesort</code>，说明排序没法用索引完成，需要额外的排序操作，数据量大时代价很高；出现 <code>Using temporary</code> 说明用到了临时表，常见于 group by 或者 distinct 没走上合适的索引，这两个组合出现基本就是性能隐患的信号。相反 <code>Using index</code> 表示这是一次覆盖索引查询，不需要回表，是比较理想的状态；而 <code>Using where</code> 只是说明存储引擎返回数据后 server 层还做了过滤，不一定是问题。</p>\n<p>possible_keys 和 key 的对比也很关键，possible_keys 列出的是优化器认为可能用得上的索引，但最终 key 才是它真正选的那个，如果 possible_keys 有值但 key 是 NULL，或者选的索引和你预期的不一样，往往说明统计信息过期、索引区分度不够，或者是隐式类型转换导致索引失效。另外 rows 和 filtered 两个字段结合起来看，rows 是预估扫描行数，filtered 是这些行里满足条件的百分比，两者相乘才是真正有效的行数，如果 filtered 很低说明索引的过滤效果差，可能需要重新设计联合索引的列顺序。</p>\n<p><strong>记忆点：type 只看到\"怎么找\"，Extra 才看得出\"有没有额外代价\"。</strong></p>"}, {"qnum": 14, "qtext": "字符集和排序规则设置不当会导致哪些常见问题？utf8mb4 和 collation 具体怎么理解？", "freq": "中频", "answerHtml": "<p>MySQL 里的 utf8 实际上是阉割版，最多只能存3字节，存不下 emoji 和部分生僻字（这些是4字节字符），所以现在建表基本都要求用 utf8mb4，这是很多历史项目\"存表情符号报错\"或者\"数据莫名其妙被截断\"问题的根源。排序规则（collation）则决定了字符怎么比较大小、怎么排序，常见的坑是同一套系统里表和表之间、列和列之间 collation 不一致，比如一个是 <code>utf8mb4_general_ci</code>，一个是 <code>utf8mb4_unicode_ci</code>，做 JOIN 或者字符串比较的时候会报 \"Illegal mix of collations\" 错误，或者更隐蔽的是索引失效——因为字符集不同，优化器没法直接用索引做等值匹配，只能全表扫描。</p>\n<p><code>_ci</code> 后缀表示大小写不敏感（case insensitive），<code>_bin</code> 表示按二进制比较，区分大小写和重音符号，如果业务需要精确匹配（比如用户名、密码相关字段），应该用 <code>_bin</code> 或者 <code>utf8mb4_0900_as_cs</code>（MySQL 8 新的规则，支持重音和大小写敏感）,不然会出现 \"abc\" 和 \"ABC\" 被当成同一个值的诡异现象。实践中的建议是整个库、表、连接层的字符集从一开始就统一成 utf8mb4，collation 全库保持一致，Java 连接串里也要显式指定 <code>useUnicode=true&amp;characterEncoding=utf8</code>，避免客户端和服务端字符集不匹配导致的乱码。</p>\n<p><strong>记忆点：utf8mb4 才是真·utf8，collation 不统一会拖垮索引和 JOIN。</strong></p>"}, {"qnum": 15, "qtext": "binlog 的三种格式 statement、row、mixed 有什么区别，各自的优缺点是什么？", "freq": "中频", "answerHtml": "<p>statement 格式记录的是实际执行的 SQL 语句本身，优点是日志体积小、可读性好，一条 <code>UPDATE t SET a=1 WHERE id&lt;100</code> 不管影响多少行都只记一条日志。但它的问题是对于一些不确定性函数（比如 <code>NOW()</code>、<code>RAND()</code>、<code>UUID()</code>）或者依赖执行上下文的语句，主库和从库重放的结果可能不一致，这是数据不一致的重要隐患来源，所以现在很少单独用。</p>\n<p>row 格式记录的不是 SQL 而是每一行数据实际的变更前后镜像，不管什么语句，最终落盘的都是确定的行级变化，完全避免了 statement 模式的不确定性问题，主从数据一致性有保障，也是现在做 CDC（比如接 Canal、Debezium 做数据同步）的基础，因为下游需要精确知道哪一行发生了什么变化。缺点是日志量会明显变大，一条批量更新10万行的语句会产生10万条记录。</p>\n<p>mixed 格式是一种折中方案，MySQL 会自动判断，大部分确定性语句用 statement 记录以节省空间，遇到可能引发不一致的语句自动切换成 row 格式。实际生产环境里，如果下游有依赖 binlog 做数据同步或者审计的需求，通常直接固定用 row 格式，虽然日志量大一些，但换来的是可预测性和下游解析的简单性。</p>\n<p><strong>记忆点：statement 省空间但不确定，row 精确但量大，mixed 是自动折中。</strong></p>"}, {"qnum": 16, "qtext": "主从复制的原理是什么？主从延迟是怎么产生的，怎么缓解？", "freq": "高频", "answerHtml": "<p>主从复制的基本流程是：主库执行完事务后把变更写入 binlog；从库有一个 IO 线程去主库拉取 binlog，写到本地的 relay log 里；从库再有一个 SQL 线程（或者并行复制的多个 worker）读取 relay log 并重放，从而让从库的数据追上主库。整个过程是异步的（半同步复制会在主库提交前等至少一个从库确认收到日志，但不等应用完成），这就意味着从库的数据天然会落后于主库一段时间。</p>\n<p>延迟的来源主要有几个。一是从库的 SQL 线程是单线程重放（老版本 MySQL 默认如此），如果主库是多线程并发写入、写入量很大，单线程的从库很容易跟不上，这是最常见的延迟原因，MySQL 5.7 之后引入了基于组提交的并行复制可以缓解。二是从库自身有大查询、锁等待或者硬件性能不如主库，导致重放变慢。三是网络延迟或者主库瞬时写入量突增造成的短暂堆积。</p>\n<p>缓解手段包括：开启并行复制（<code>slave_parallel_workers</code>）提升重放吞吐；业务层面读写分离时对强一致性要求的读请求强制走主库，或者读之前先查 <code>SHOW SLAVE STATUS</code> 里的 <code>Seconds_Behind_Master</code> 判断延迟是否在可接受范围；升级从库硬件配置甚至用和主库一样的规格；避免在从库上跑大查询占用重放线程的资源。</p>\n<p><strong>记忆点：主从延迟的锅大概率是从库单线程重放跟不上主库并发写入。</strong></p>"}, {"qnum": 17, "qtext": "HikariCP 作为连接池，核心参数有哪些，它为什么性能好？", "freq": "中频", "answerHtml": "<p>HikariCP 之所以性能突出，核心在于对字节码和数据结构做了极致优化，比如用 FastList 代替 ArrayList 减少边界检查，用字节码增强规避反射的开销，连接的获取和归还路径做到了近乎无锁化，减少了并发竞争下的性能损耗。</p>\n<p>核心参数方面，<code>maximumPoolSize</code> 是最大连接数，这个不是越大越好，要结合数据库能承受的连接数以及\"CPU核数 * 2 + 有效磁盘数\"这类经验公式估算，连接数过多反而会因为上下文切换和锁竞争拖累数据库整体吞吐。<code>minimumIdle</code> 是最小空闲连接数，官方其实建议和 maximumPoolSize 设成一样，做成固定大小的池子，避免连接频繁创建销毁的开销。<code>connectionTimeout</code> 是从池里获取连接的最长等待时间，超时会抛异常而不是无限等待，这对及时发现连接池耗尽问题很重要。<code>idleTimeout</code> 和 <code>maxLifetime</code> 分别控制空闲连接多久被回收、连接最长存活多久，<code>maxLifetime</code> 要设置得比数据库或者中间的网络设备（比如云厂商的 LB）的连接超时时间稍短，否则容易拿到一个已经被服务端悄悄关闭的死连接，导致业务报连接异常。另外还有 <code>leakDetectionThreshold</code>，用来检测连接被借出后长时间不归还的泄漏场景，排查连接池耗尽问题时很有用。</p>\n<p><strong>记忆点：HikariCP 快在无锁化设计，用好 maxLifetime 和 leakDetectionThreshold 能少踩很多坑。</strong></p>"}, {"qnum": 18, "qtext": "大表在线加字段有什么风险？gh-ost、pt-online-schema-change 这类工具是怎么解决的？", "freq": "低频", "answerHtml": "<p>MySQL 原生的 <code>ALTER TABLE ADD COLUMN</code> 在早期版本或者某些变更场景下需要重建整张表，操作期间会持有元数据锁（MDL），这会阻塞该表上所有的读写请求，对于千万级甚至更大的表，这个过程可能持续几十分钟到几小时，对线上业务几乎是灾难性的。虽然 MySQL 5.6 之后的 Online DDL 对部分操作（比如加普通字段）支持了 INPLACE 算法，不用整表重建、也不完全阻塞 DML，但仍然有并发写入的兼容性限制，而且大表操作本身对 IO 和主从复制延迟的影响还是很大。</p>\n<p>pt-online-schema-change 和 gh-ost 这类工具的核心思路都是\"影子表 + 数据迁移 + 原子切换\"：先按照新表结构创建一张同名但带前缀的空影子表，然后分批把原表的历史数据拷贝过去（控制每批的大小和拷贝速度，避免打满主库IO），拷贝过程中原表上如果有新的增删改操作，通过触发器（pt-osc 的做法）或者解析 binlog（gh-ost 的做法，不依赖触发器所以对原表侵入性更小）同步应用到影子表上，等两边数据完全追平之后，再用一次很短暂的原子 rename 把影子表切换成正式表，原表重命名后删除。整个过程业务几乎无感知，只有最后 rename 那一瞬间有极短暂的锁。gh-ost 相比 pt-osc 的优势是用 binlog 增量同步代替触发器，减少了对主库触发器机制的额外开销，也更容易做到中断后可暂停恢复。</p>\n<p><strong>记忆点：大表加字段靠\"建影子表、增量追平、原子改名\"这套思路绕开长时间锁表。</strong></p>"}]}, {"name": "缓存技术", "questions": [{"qnum": 1, "qtext": "Redis 常用的数据结构有哪些？分别对应什么典型业务场景？", "freq": "高频", "answerHtml": "<p>Redis 提供的基础类型远不止 key-value 这么简单。String 是最基础的类型，除了缓存对象（存 JSON 字符串），还常用来做计数器（<code>INCR</code> 统计接口调用次数、文章阅读量）和分布式锁（<code>SETNX</code>）。Hash 适合存对象的多个字段，比如用户信息里的昵称、头像、积分分开存成一个 hash，可以只更新某个字段而不用整体覆盖，比直接存 JSON 更省流量。List 是双向链表结构，天然适合做消息队列（<code>LPUSH</code>+<code>BRPOP</code>）或者最新动态列表（比如朋友圈最新 N 条）。</p>\n<p>Set 是无序去重集合，适合做标签系统、共同关注、抽奖去重，靠 <code>SINTER</code>/<code>SUNION</code> 可以很方便地算交集并集，比如\"两个用户共同好友\"。ZSet（有序集合）在每个元素上带一个 score 用于排序，是排行榜类需求的标配，比如实时热搜榜、游戏积分榜，靠 <code>ZRANGE</code>/<code>ZINCRBY</code> 维护起来很轻量。除了这五种基础类型，还有 Bitmap（用位图做签到打卡、活跃用户统计，省内存）、HyperLogLog（用极小内存做基数统计，比如统计 UV，允许一定误差）、Geo（基于 ZSet 实现的地理位置检索，比如附近的人）。</p>\n<p>选型的核心思路是：先看业务操作模式（要不要排序、要不要去重、要不要范围查询），再反推该用哪个数据结构，而不是所有东西都无脑存 String。</p>\n<p><strong>记忆点：String 计数与锁、Hash 存对象字段、List 做队列、ZSet 做排行榜、Bitmap/HLL 做海量统计。</strong></p>"}, {"qnum": 2, "qtext": "缓存穿透、缓存击穿、缓存雪崩分别是什么？各自怎么解决？", "freq": "高频", "answerHtml": "<p>这三个概念经常被搞混，区分的关键在于\"查的数据存不存在\"和\"是不是集中爆发\"。缓存穿透指查询一个数据库里根本不存在的数据，缓存里自然也没有，每次请求都穿透缓存直接打到数据库，如果被恶意构造大量不存在的 key 来攻击，数据库很容易被打垮。解决思路一是对空结果也缓存一个短过期时间的空值（比如缓存 <code>null</code> 加 1-2 分钟过期），二是用布隆过滤器在最前面拦截，请求进来先判断这个 key 有没有可能存在，布隆过滤器判断\"一定不存在\"的直接拒绝，只有可能存在的才继续往后查。</p>\n<p>缓存击穿指某一个访问量特别大的热点 key 突然过期，这一瞬间大量并发请求同时穿过缓存打到数据库上，虽然数据是存在的，但集中在这一个点上造成瞬时压力。解决办法通常是给热点 key 设置永不过期（后台异步更新），或者在缓存失效时用互斥锁（<code>SETNX</code>）只让一个线程去数据库加载数据、其他线程等待或者读旧值，避免所有请求同时打库。</p>\n<p>缓存雪崩指大批量 key 在同一时间集中过期，或者 Redis 实例本身宕机，导致大量请求同一时刻全部落到数据库上。解决办法一是给缓存过期时间加上随机数，让过期时间分散开，避免同时失效；二是对 Redis 本身做高可用（哨兵/Cluster），避免单点故障；三是在应用层加限流熔断（比如 Sentinel/Hystrix），数据库扛不住时保护性地拒绝一部分请求，而不是被压垮。</p>\n<p><strong>记忆点：穿透是\"查不存在的\"，击穿是\"一个热 key 过期\"，雪崩是\"一片 key 同时过期或缓存挂了\"。</strong></p>"}, {"qnum": 3, "qtext": "Redis 的 RDB 和 AOF 两种持久化方式有什么区别？生产环境怎么选？", "freq": "中频", "answerHtml": "<p>RDB 是某个时间点上整个数据集的快照，通过 <code>save</code>/<code>bgsave</code> 触发，<code>bgsave</code> 会 fork 一个子进程去做快照，利用操作系统的写时复制（copy-on-write），不阻塞主进程处理请求。它的优点是文件体积小（压缩后的二进制），恢复速度快，很适合做定期备份或者灾备迁移；缺点是两次快照之间如果宕机，这段时间的数据会全部丢失，比如每 5 分钟一次快照，最坏情况丢 5 分钟数据。</p>\n<p>AOF 是把每一条写命令追加写入日志文件，相当于操作日志。它的优点是数据安全性高，配合 <code>appendfsync always/everysec</code> 策略，最坏情况下（everysec）只丢 1 秒数据；缺点是文件体积会比 RDB 大很多，恢复时要重新执行一遍命令，速度比加载 RDB 慢。为了控制文件体积，Redis 会做 AOF 重写（<code>bgrewriteaof</code>），把历史命令压缩合并成能达到同样数据状态的最少命令集合。</p>\n<p>生产环境的常见做法是两者一起用：RDB 做定期全量备份和快速恢复的手段，AOF 做实时的数据安全保障，<code>appendfsync</code> 通常选 everysec 在性能和安全性之间取平衡。Redis 4.0 之后还支持 RDB-AOF 混合持久化，AOF 重写时用 RDB 格式存量数据打头、增量命令追加在后面，兼顾了恢复速度和数据完整性。</p>\n<p><strong>记忆点：RDB 是\"快照\"追求恢复快，AOF 是\"流水账\"追求数据全，生产环境通常两者混合用。</strong></p>"}, {"qnum": 4, "qtext": "Redis 主从复制的原理是什么？哨兵是怎么实现故障自动转移的？", "freq": "高频", "answerHtml": "<p>主从复制的过程分全量同步和增量同步两个阶段。从库第一次连接主库时会触发全量同步：主库执行 <code>bgsave</code> 生成 RDB 快照发给从库做初始数据加载，这期间主库新产生的写命令会先记录到复制缓冲区，等 RDB 传输完成后再把缓冲区里的命令一并发给从库；之后就进入增量同步阶段，主库后续的每个写命令都会异步转发给所有从库执行，保持数据同步。这里要注意的是复制是异步的，主库不会等从库确认写成功才返回客户端，所以主从之间存在一定的复制延迟。</p>\n<p>单纯主从复制解决不了主库宕机后如何自动切换的问题，这就需要哨兵（Sentinel）。哨兵本质是一组独立运行的监控进程，它们持续对主库和从库做心跳检测，判断节点是否存活。当一个哨兵发现主库无响应，会先标记为\"主观下线\"，然后跟其他哨兵通信确认，如果超过半数哨兵都认为主库下线了，就判定为\"客观下线\"，触发故障转移流程。转移时哨兵集群会用类似 Raft 的算法在多个哨兵之间选出一个 leader 来执行切换，从剩下的从库里按优先级、复制进度等条件选出一个新主库，把其他从库指向新主库，同时通知客户端新的主库地址（通常客户端通过订阅哨兵的消息或者查询哨兵拿到最新拓扑）。整个过程通常在秒级到十几秒完成，是 Redis 实现高可用的核心手段。</p>\n<p><strong>记忆点：主从复制靠\"全量 RDB + 增量命令转发\"同步数据，哨兵靠\"多数派共识\"实现主库故障的自动发现和切换。</strong></p>"}, {"qnum": 5, "qtext": "Redis Cluster 是怎么做数据分片的？相比主从+哨兵解决了什么问题？", "freq": "中频", "answerHtml": "<p>哨兵方案解决了高可用，但没解决容量和写压力的水平扩展问题——所有写操作始终集中在一个主库上，单机内存和吞吐总有上限。Redis Cluster 就是为了解决这个问题设计的分布式方案，核心思路是把整个数据空间划分成 16384 个哈希槽（slot），每个 key 通过 CRC16 算法计算后对 16384 取模，决定落在哪个槽位，集群里的每个主节点负责一部分槽位区间，比如 3 个主节点可以大致平均分到 5461 个槽左右。客户端请求某个 key 时，节点会计算这个 key 属于哪个槽，如果不归自己管，会返回一个 <code>MOVED</code> 重定向指令告诉客户端该去哪个节点，这样数据和请求都天然分散到多个节点，写压力也就分摊开了。</p>\n<p>每个负责一部分槽位的主节点通常还挂载一到多个从节点做数据冗余，原理跟普通主从复制一样，当某个主节点宕机，集群内部会通过节点间的 Gossip 协议互相探测发现故障，并在该主节点的从节点里自动选举一个提升为新主节点接管对应槽位，这个过程不需要额外部署哨兵，是 Cluster 自带的能力。</p>\n<p>需要注意的是 Cluster 对多 key 操作有限制，像 <code>MGET</code>、事务、Lua 脚本要求涉及的 key 必须落在同一个槽里，否则会报错，实践中常用 hash tag（用 <code>{}</code> 包裹 key 的一部分参与哈希计算）把相关的 key 强制分到同一个槽，来支持这类操作。</p>\n<p><strong>记忆点：Cluster 用 16384 个 slot 把数据分散到多主节点，解决的是水平扩容和写压力集中的问题，代价是多 key 操作受限。</strong></p>"}, {"qnum": 6, "qtext": "用 Redis 实现分布式锁要注意哪些细节？Redisson 是怎么做的？RedLock 又解决了什么问题？", "freq": "高频", "answerHtml": "<p>最基础的实现是 <code>SET key value NX EX seconds</code>，一条命令同时保证\"不存在才设置\"和\"设置过期时间\"的原子性，避免用 <code>SETNX</code> 加单独 <code>EXPIRE</code> 两条命令导致中间宕机死锁的问题。这里有几个常被问到的细节：一是 value 要设置成能标识当前客户端的唯一值（比如 UUID），释放锁时要先判断这个 value 是不是自己设置的再删除，用 Lua 脚本保证\"判断+删除\"的原子性，避免误删别人持有的锁；二是过期时间设长了会导致业务没执行完锁就还占着没必要的时间，设短了业务还没执行完锁就自动释放了，导致并发问题。</p>\n<p>Redisson 把这些细节都封装好了，其中最关键的是\"看门狗\"（Watchdog）机制：加锁默认给一个较短的过期时间（比如 30 秒），后台开一个线程每隔 1/3 过期时间去检查锁是否还被当前线程持有，是的话就自动续期，业务执行完释放锁时才会停止续期，这样既不用担心业务执行时间不确定导致锁提前过期，也不会出现忘记设置过期时间导致的死锁。它内部也是基于 Lua 脚本保证获取锁、续期、释放锁的原子性。</p>\n<p>RedLock 解决的是另一个层面的问题：如果只在单个 Redis 实例（或者主从架构）上加锁，主库加锁成功后还没来得及同步给从库就宕机了，故障转移后新主库上是没有这把锁的，另一个客户端就可能同时拿到锁，造成安全性问题。RedLock 的思路是部署多个（一般 5 个）相互独立的 Redis 实例，客户端依次向多数节点（比如至少 3 个）请求加锁，只有在大多数节点上都加锁成功、且总耗时小于锁的有效期时才认为加锁成功，靠多数派机制来对抗单点故障。不过 RedLock 本身在学术界也有争议（比如对系统时钟依赖的质疑），实际生产中很多团队权衡复杂度后还是选择基于 Redis Cluster/哨兵的单点锁 + 业务幂等兜底。</p>\n<p><strong>记忆点：分布式锁的关键是\"加锁、续期、解锁\"三个环节都要原子且安全，RedLock 用多数派对抗单实例故障。</strong></p>"}, {"qnum": 7, "qtext": "Redis 的过期删除策略和内存淘汰策略分别是什么？两者有什么关系？", "freq": "中频", "answerHtml": "<p>过期删除策略解决的是\"key 到期之后什么时候真正从内存里删掉\"的问题，Redis 用的是惰性删除加定期删除结合的方式。惰性删除是每次访问一个 key 时才检查它是否过期，过期就删掉并返回不存在，好处是不浪费 CPU 去主动扫描，坏处是如果一个过期 key 一直没被访问，就会一直占着内存不释放。定期删除则是 Redis 后台每隔一段时间（默认每秒 10 次）随机抽取一批设了过期时间的 key 检查，删掉其中已过期的，如果这批里过期比例较高就继续抽检下一批，用来弥补惰性删除\"漏网之鱼\"占内存的问题，同时控制每次扫描的开销避免影响主线程处理请求。</p>\n<p>内存淘汰策略解决的是另一个问题：即使有过期删除，内存还是可能被用满（比如设置了 <code>maxmemory</code> 上限），这时候要不要继续接受新写入、淘汰谁腾地方，就由淘汰策略决定。常见策略里，noeviction 是默认策略，内存满了直接拒绝写入命令并报错；allkeys-lru/volatile-lru 是在所有 key（或只在设了过期时间的 key）里淘汰最近最少使用的；allkeys-lfu/volatile-lfu 是按访问频率淘汰最不常用的，比 LRU 更能识别真正的冷数据；还有 random 系列做随机淘汰、volatile-ttl 优先淘汰剩余存活时间最短的。生产环境把 Redis 当纯缓存用时，一般选 <code>allkeys-lru</code> 或 <code>allkeys-lfu</code>；如果 Redis 里还存了一些不希望被淘汰的持久化数据，会用 volatile 系列只淘汰设了过期时间的那部分 key。</p>\n<p>两者的关系是：过期策略负责按\"时间\"清理数据，淘汰策略负责按\"空间压力\"清理数据，两套机制独立运行、互相配合，共同保证 Redis 既不会因为一堆僵尸过期 key 占满内存，也不会因为总内存超限而直接崩溃或者拒绝服务。</p>\n<p><strong>记忆点：过期策略管\"时间到了删不删\"，淘汰策略管\"内存满了删谁\"，一个按时间触发一个按空间触发。</strong></p>"}, {"qnum": 8, "qtext": "Redis 是单线程模型，为什么性能还这么高？6.0 之后引入的多线程又是解决什么问题？", "freq": "低频", "answerHtml": "<p>首先要澄清一点，Redis 说的\"单线程\"指的是网络请求处理和命令执行这条核心路径是单线程的，并不是说整个进程只有一个线程，像 RDB 的 <code>bgsave</code>、AOF 重写、异步删除大 key 这些耗时操作，早就是用子进程或后台线程去做，不占用主线程。</p>\n<p>单线程的核心路径能扛住很高的 QPS，原因有这么几个方面。首先 Redis 的大部分操作都是纯内存操作，内存的读写速度本身比磁盘快几个数量级，避免了磁盘 IO 这个最大的性能瓶颈。其次数据结构设计得很高效，像跳表、压缩列表这些结构在时间复杂度和内存占用上都做了精心优化。再者单线程避免了多线程场景下常见的锁竞争和上下文切换开销，不需要考虑加锁、死锁这些问题，每个命令的执行都是原子的，简化了并发控制逻辑。最后一点是 Redis 用了 IO 多路复用（epoll 等），单个线程就能同时监听和处理成千上万个客户端连接的读写事件，避免了为每个连接创建一个线程带来的资源消耗。</p>\n<p>不过随着高并发场景下网络 IO 本身（比如大量小命令的收发、协议解析）也逐渐成为瓶颈，Redis 6.0 引入了多线程，但要注意范围很有限：多线程只用在网络数据的读取、协议解析和结果的写回这几个环节，真正的命令执行逻辑依然是单线程串行执行的，这样既能利用多核提升网络 IO 吞吐，又不需要给命令执行加锁，保持了原子性和实现简单性。</p>\n<p><strong>记忆点：单线程快靠的是纯内存操作+高效数据结构+IO 多路复用，6.0 的多线程只优化网络收发，命令执行依然单线程。</strong></p>"}, {"qnum": 9, "qtext": "布隆过滤器的原理是什么？为什么会有误判，误判率怎么控制？", "freq": "高频", "answerHtml": "<p>布隆过滤器本质上是一个很长的位数组加上若干个哈希函数。往里面添加一个元素时，用这 k 个哈希函数分别算出 k 个位置，把这些位置都置为1；判断一个元素是否存在时，同样用这 k 个哈希函数算出对应位置，只要有任意一个位置是0，就能100%确定这个元素一定不存在；但如果所有位置都是1，也只能说\"可能存在\"，而不是一定存在，因为这些位可能是被其他不同的元素散列碰撞置位的，这就是误判（false positive）的来源。布隆过滤器的一个重要特性是它绝不会漏判（不存在的判断一定准），只会误判存在。</p>\n<p>误判率主要由三个因素决定：位数组的大小 m、哈希函数的个数 k，以及已插入的元素个数 n。位数组越大、放的元素相对越少，误判率越低；哈希函数个数也不是越多越好，存在一个最优值，大概是 <code>k = (m/n) * ln2</code>，实践中一般用现成公式或者 Guava/Redisson 提供的 API，输入预期元素数量和期望误判率，直接算出所需的位数组大小和哈希函数个数。典型应用场景是缓存穿透防护，请求先过布隆过滤器，判断为不存在的直接拦截返回，避免大量无效查询打到数据库；也常用于爬虫去重、垃圾邮件过滤这类允许小概率误判但不能漏判的场景。布隆过滤器不支持删除元素（删了一位可能影响其他元素判断），如果需要支持删除，得用计数布隆过滤器（Counting Bloom Filter）。</p>\n<p><strong>记忆点：布隆过滤器\"说没有就一定没有，说有可能是误判\"，不支持删除。</strong></p>"}, {"qnum": 10, "qtext": "本地缓存和分布式缓存各有什么优劣？多级缓存架构一般怎么设计？", "freq": "高频", "answerHtml": "<p>本地缓存（比如 Caffeine、Guava Cache）直接跑在应用进程的堆内存或者堆外内存里，读取不需要网络开销，延迟基本是纳秒到微秒级别，性能是最强的，但缺点也很明显：容量受限于单机内存，多个实例之间的数据是互相独立的，没法共享，而且集群环境下很容易出现数据不一致——A节点更新了数据，B节点的本地缓存还是旧的，需要额外做广播失效（比如通过消息队列通知各节点清缓存）才能保证一致性。</p>\n<p>分布式缓存（比如 Redis）是独立的一层服务，所有应用实例访问的是同一份数据，天然解决了一致性和容量问题，还能提供丰富的数据结构和过期策略，但代价是每次访问都有一次网络往返，延迟通常在毫秒级别，而且 Redis 本身也可能成为单点瓶颈或者故障点。</p>\n<p>实际项目里两者经常结合起来做成多级缓存：请求先查本地缓存（一级），本地没命中再查 Redis（二级），Redis 也没有才穿透到数据库，查到之后逐级回填。这样热点数据大部分请求都能被本地缓存拦截，既降低了 Redis 的压力，又保证了整体的低延迟。设计的关键点在于本地缓存要设置较短的过期时间或者较小的容量（毕竟是兜底加速，不追求命中率100%），一致性问题上通常采用\"数据变更时通过 Redis 的发布订阅或者专门的消息通道，通知所有应用节点清理各自的本地缓存\"这种方案，允许短暂的不一致但要保证最终一致。</p>\n<p><strong>记忆点：本地缓存拼速度，分布式缓存保一致，多级缓存把两者叠起来用。</strong></p>"}, {"qnum": 11, "qtext": "Redis 的事务（MULTI/EXEC）和 Lua 脚本都能保证原子性，两者有什么本质区别？", "freq": "中频", "answerHtml": "<p>MULTI/EXEC 的机制是把多条命令放进一个队列，执行 EXEC 的时候依次不间断地执行完，中间不会被其他客户端的命令插入进来，从这个角度看确实保证了\"隔离性\"。但它有几个明显的短板：第一，它不支持真正的条件判断和命令间的逻辑依赖，比如没法在事务内部根据前一条命令的返回结果决定后一条命令怎么执行，因为所有命令在 EXEC 之前只是入队，并没有真正执行；第二，如果队列里某条命令在运行时报错（比如对字符串类型执行 incr），Redis 不会回滚已经成功执行的命令，只是错误的那条不生效，这跟大家理解的\"事务要么全成功要么全失败\"是有出入的；第三，配合 WATCH 做乐观锁时，一旦被 watch 的 key 在 EXEC 前被其他客户端修改，整个事务会直接失败，需要业务自己重试。</p>\n<p>Lua 脚本则是把逻辑整体发给 Redis 服务端执行，Redis 是单线程模型，脚本执行期间不会被其他命令打断，天然保证原子性，而且脚本内部可以写完整的条件判断、循环、变量传递,能实现\"先判断再操作\"这种 MULTI/EXEC 做不到的复合逻辑，比如经典的分布式锁释放场景：</p>\n<pre><code>if redis.call(\"get\", KEYS[1]) == ARGV[1] then\n    return redis.call(\"del\", KEYS[1])\nelse\n    return 0\nend</code></pre>\n<p>这种判断值匹配再删除的操作用 MULTI/EXEC 根本没法原子地实现，只能用 Lua。所以实践中但凡涉及复杂业务逻辑的原子操作，基本都用 Lua 脚本，MULTI/EXEC 更适合简单的多命令打包场景。</p>\n<p><strong>记忆点：MULTI/EXEC 只是命令打包不支持逻辑判断，Lua 脚本才能做复合条件的原子操作。</strong></p>"}, {"qnum": 12, "qtext": "Redis Pipeline 是干什么用的，什么场景下应该用？", "freq": "中频", "answerHtml": "<p>正常情况下客户端和 Redis 交互是一问一答的模式：发一条命令，等服务端返回结果，再发下一条，如果要执行100条命令，就要有100次网络往返（RTT），当命令本身执行很快但网络延迟不小的时候，大部分时间其实都耗在了网络等待上而不是 Redis 真正处理命令上。</p>\n<p>Pipeline 的做法是把多条命令一次性打包发送给服务端，不用等每条命令的响应，Redis 服务端依次处理完这些命令后，再把所有结果一次性打包返回，这样不管是100条命令还是1000条命令，网络往返只需要一次，大幅减少了网络延迟带来的开销。需要注意的是 Pipeline 不是事务，它不保证原子性，也不保证这批命令执行期间不会有别的客户端命令穿插进来（虽然在实际的单线程执行模型下不太会被打断，但语义上跟 MULTI/EXEC 不是一回事）。</p>\n<p>典型使用场景是批量写入或者批量读取，比如把一批数据初始化写入缓存、或者一次性拉取几百个 key 的值，这种场景下用 Pipeline 代替循环调用能获得数量级的性能提升。但也要注意不能无限制地把命令都塞进一个 Pipeline，命令太多会导致内存占用飙升、单次响应包过大，实践中一般会分批，比如每次 Pipeline 打包几百到上千条命令为宜。</p>\n<p><strong>记忆点：Pipeline 用一次网络往返换多条命令的批量执行，省的是 RTT 不是 CPU。</strong></p>"}, {"qnum": 13, "qtext": "Redis 的大 key 和热 key 问题是什么，怎么识别和处理？", "freq": "高频", "answerHtml": "<p>大 key 指的是单个 key 存储的数据量特别大，比如一个 hash 里塞了几十万个字段，或者一个 string 存了几十MB的内容。大 key 的危害主要体现在几个方面：一是读写这个 key 的时候，因为 Redis 是单线程处理命令，操作这种大对象（比如对一个巨大 hash 做 HGETALL，或者删除一个大 key）会长时间阻塞其他命令，造成整个实例卡顿；二是内存分布不均衡，容易导致某个分片内存占用过高，集群里出现数据倾斜；三是主从同步和持久化时，大 key 会造成 RDB 生成、传输的瞬时压力。识别大 key 一般用 <code>redis-cli --bigkeys</code> 扫描全库统计各类型的最大 key，或者用 <code>MEMORY USAGE key</code> 单独查某个 key 的内存占用，线上还可以借助 RDB 文件离线分析工具（比如 redis-rdb-tools）做更精细的统计。处理上，能拆分的尽量拆分，比如把一个大 hash 按照字段做二次哈希拆成多个小 hash 分散到不同 key 上；要删除大 key 时用 <code>UNLINK</code> 代替 <code>DEL</code>，前者是异步在后台线程回收内存，不会阻塞主线程。</p>\n<p>热 key 指的是访问频率远高于其他 key 的那个 key，比如秒杀商品的库存 key，短时间内大量请求集中打到某一个 key 上。在集群模式下，热 key 所在的那个分片会承受远超其他节点的流量压力，可能被打满甚至雪崩。识别热 key 可以用 <code>redis-cli --hotkeys</code>（需要开启 maxmemory-policy 里的 LFU 统计），或者在客户端做请求采样统计访问频次，也可以在代理层（比如 Twemproxy、Codis）做实时监控。处理热 key 常见方案是本地缓存兜底，把热点数据缓存到应用本地内存里，用多级缓存分担压力；也可以做热 key 的多副本，把同一份数据复制成 key_1、key_2 等多份分散到不同分片，请求时随机选一个访问，从而把流量打散。</p>\n<p><strong>记忆点：大 key 卡的是单个操作耗时，热 key 卡的是某个分片的流量，前者拆分后者分散。</strong></p>"}, {"qnum": 14, "qtext": "Redis 用 RDB 或 AOF 做持久化恢复的时候，为什么还可能出现数据一致性问题？", "freq": "低频", "answerHtml": "<p>RDB 是某个时间点的全量快照，<code>bgsave</code> 通过 fork 子进程、利用操作系统的写时复制（copy-on-write）机制生成快照文件，这意味着从上一次快照生成到 Redis 宕机的这段时间内的所有写操作都不会被记录，如果两次快照间隔比较长（比如默认配置几分钟到几十分钟一次），恢复时就会丢失这段时间的数据，这是 RDB 天然的数据丢失窗口问题，不是恢复过程本身有 bug，而是快照策略决定的。</p>\n<p>AOF 相对更安全，它记录的是每一条写命令，根据 <code>appendfsync</code> 的配置（always/everysec/no）决定多久刷一次盘，<code>everysec</code> 是默认也是最常用的折中方案，每秒刷盘一次，也就意味着最坏情况下会丢失1秒内的写操作。而且 AOF 文件如果因为宕机时机不巧发生了写入中断，可能会出现文件末尾命令不完整的情况，Redis 重启加载 AOF 时如果发现文件损坏，需要用 <code>redis-check-aof --fix</code> 工具修复，修复过程本质是把不完整的最后一条命令截断丢弃，这部分数据自然也就丢了。</p>\n<p>如果同时开启 RDB 和 AOF，Redis 重启时默认优先加载 AOF（因为通常更完整），但要注意 AOF 重写（rewrite）过程中如果发生宕机，也存在重写文件和增量缓冲区数据对不齐的边界情况，需要依赖 Redis 自身的重写机制保证原子替换。生产环境上更稳妥的做法是 AOF everysec + 定期 RDB 备份 + 主从多副本 + 哨兵/集群做高可用，单纯依赖持久化文件恢复只能做到\"尽量少丢\"，没法做到强一致，真正对一致性要求高的数据不应该只依赖 Redis 单点存储。</p>\n<p><strong>记忆点：持久化恢复保证的是\"尽量少丢\"而不是\"绝对不丢\"，强一致场景不能只靠 Redis。</strong></p>"}, {"qnum": 15, "qtext": "Caffeine 本地缓存用的 W-TinyLFU 淘汰算法是什么思路，相比 LRU 有什么优势？", "freq": "低频", "answerHtml": "<p>传统 LRU（最近最少使用）的问题是只考虑了访问的\"新近性\"，容易被偶发的批量扫描操作污染——比如一次性遍历访问了大量只会用一次的数据，会把真正的热点数据挤出缓存，这就是所谓的缓存污染问题。LFU（最不经常使用）虽然考虑了访问频率，但存在\"过去很热、现在已经不热\"的数据很难被淘汰的问题，因为历史累积的频次很高，新数据很难有机会积累起足够的频次去竞争过它。</p>\n<p>W-TinyLFU 是 Caffeine 采用的算法，思路是把\"频率\"和\"新近性\"结合起来综合判断。它用一个基于 Count-Min Sketch 的近似计数结构，用很小的内存开销去统计每个 key 的访问频率（不是精确计数，允许一定误差换取空间效率），并且这个频率统计会周期性做衰减（aging），避免历史数据的频次一直居高不下、新的热点永远挤不进来。当新数据要进入缓存但空间已满时，会拿新数据的访问频率和即将被淘汰的候选数据比较，频率高的留下来，这就是 TinyLFU 的核心比较逻辑。\"W\"（Window）则是指它在主缓存区之前加了一个小的 LRU 窗口区，专门用来缓冲刚进来、还没积累访问频率但可能是新兴热点的数据，给它们一个短暂的\"试用期\"，避免被 TinyLFU 直接因为频率低而拒之门外，这样就同时兼顾了应对突发新热点和抵御一次性扫描污染的能力。综合下来 W-TinyLFU 在命中率上普遍优于传统 LRU，同时保持了较低的内存和计算开销，所以 Caffeine 的性能和命中率表现比 Guava Cache 等传统实现要好。</p>\n<p><strong>记忆点：W-TinyLFU 用小窗口应对新热点，用近似频率统计抵御扫描污染，兼顾新近性和频率两个维度。</strong></p>"}]}, {"name": "消息队列", "questions": [{"qnum": 1, "qtext": "Kafka、RocketMQ、RabbitMQ 这三种消息队列在架构设计上有什么本质区别，各自适合什么场景？", "freq": "高频", "answerHtml": "<p>这三个中间件的设计哲学其实完全不同。RabbitMQ 基于 AMQP 协议，核心是 Exchange 加 Queue 的路由模型，支持 direct、topic、fanout、headers 好几种交换机类型，路由能力非常灵活，还内置了优先级队列、延迟插件这些特性，但它是单机多线程模型加集群镜像队列的架构，吞吐量在几万 QPS 量级，更适合对路由逻辑复杂、可靠性要求高但流量不是特别夸张的业务场景，比如订单、支付这类核心交易链路。</p>\n<p>再看 Kafka，它走的是纯粹的顺序写磁盘加 Page Cache 加零拷贝这套组合拳，底层是分区加副本的日志结构，牺牲了灵活的路由能力换来了极致的吞吐，单机能轻松跑到十万甚至百万级 QPS，天生适合日志采集、埋点、大数据管道这种海量数据场景，但它对事务消息、延迟消息这些特性支持得比较弱，需要业务自己在上层做补偿。</p>\n<p>RocketMQ 是阿里在电商场景里磨出来的，架构上借鉴了 Kafka 的分区加顺序写思路，但补齐了 Kafka 缺的能力，原生支持事务消息、定时延迟消息、消息过滤、顺序消息,而且运维上不依赖 ZooKeeper（新版本用 NameServer 做轻量注册中心），吞吐量介于 RabbitMQ 和 Kafka 之间，特别适合电商交易这种既要高吞吐又要事务保证的场景。</p>\n<p><strong>记忆点：RabbitMQ 拼路由灵活、Kafka 拼吞吐量、RocketMQ 拼电商场景下的功能完备性。</strong></p>"}, {"qnum": 2, "qtext": "如何保证消息从生产者发出到最终被消费不丢失，具体在哪几个环节需要做保证？", "freq": "高频", "answerHtml": "<p>消息不丢失要分三个环节来看，生产端、broker 端、消费端,任何一个环节掉链子都会丢消息。</p>\n<p>生产端首先要用同步发送或者带回调的异步发送,并且开启 ack 确认机制。Kafka 里对应的是 acks 参数，设成 all 或者 -1 表示要等 ISR 里所有副本都写成功才算成功，同时把 retries 调大配合幂等生产者（enable.idempotence=true）防止网络抖动导致的重复或丢失；RocketMQ 则是同步发消息拿到 SEND_OK 才算真正发成功，发送失败要有重试逻辑，或者干脆走事务消息保证业务操作和发送的原子性。</p>\n<p>broker 端要看持久化和副本策略。Kafka 靠多副本加 min.insync.replicas 参数，要求至少写入几个副本才返回成功，避免 leader 挂了数据就丢了；RabbitMQ 要把队列和消息都声明成持久化（durable queue + persistent message），否则重启就没了，同时集群要做镜像队列或者仲裁队列。</p>\n<p>消费端最容易踩坑的地方是先 ack 再处理业务，一旦处理过程中挂了消息就丢了。正确做法是处理完业务逻辑、确认数据落库或者副作用完成之后，再手动提交 offset 或者发 ack，Kafka 要关掉自动提交换成手动 commit，RabbitMQ 要用手动 ack 模式。</p>\n<p><strong>记忆点：生产端要确认、broker 端要持久化多副本、消费端要先处理后确认。</strong></p>"}, {"qnum": 3, "qtext": "消费者重复消费的场景有哪些，业务上如何做到幂等消费？", "freq": "高频", "answerHtml": "<p>重复消费几乎是消息队列场景下绕不开的问题，本质原因是消息队列基本都只能保证至少一次投递，而不是精确一次。常见触发场景包括消费者处理完业务但提交 offset 之前挂了，重启后会重新拉到这条消息；还有消费者组发生 rebalance 导致分区被重新分配，正在处理中的消息可能被别的消费者重复拉到；另外生产端网络超时重试也可能导致同一条消息被发了两次。</p>\n<p>解决思路核心是让消费逻辑具备幂等性，不管收到几次同一条消息，最终效果和收到一次是一样的。最常见的做法是给每条消息带上全局唯一的业务 ID 或者消息 ID，消费之前先查一下这个 ID 是否已经处理过，比如在数据库里建一张去重表，用唯一索引约束，插入时如果主键冲突就说明已经处理过，直接跳过；也可以借助 Redis 的 setnx 做一个轻量的分布式去重锁，配合合理的过期时间。</p>\n<p>如果业务本身是幂等操作,比如更新库存用的是\"扣减到某个绝对值\"而不是\"在原值上减 N\"，或者用数据库的乐观锁配合版本号做 CAS 更新，那天然就不怕重复消费。总之核心思路就是从\"消息层面去重\"或者\"业务操作本身幂等\"两条路里选一条落地。</p>\n<p><strong>记忆点：消息队列只保证至少一次，幂等要业务自己兜底，唯一键去重是最通用的手段。</strong></p>"}, {"qnum": 4, "qtext": "消费失败之后的重试机制和死信队列是怎么设计的，业务上要注意什么？", "freq": "中频", "answerHtml": "<p>消费失败重试要分清楚是瞬时故障还是永久性错误。像网络超时、下游服务临时不可用这种瞬时问题，适合做几次重试就能恢复；但如果是消息体格式错误、业务规则明确拒绝这种问题，重试再多次也没用，就该走死信队列，不能让它无限阻塞后面的消息。</p>\n<p>RocketMQ 的设计是消费失败返回 RECONSUME_LATER，消息会重新进入重试队列，默认最多重试 16 次，重试间隔是递增的，从 10 秒一直到 2 小时，超过最大重试次数之后消息会被自动投递到 %DLQ% 开头的死信队列，业务需要专门监控这个死信队列，人工介入或者写补偿脚本处理。RabbitMQ 则需要自己搭配置，通常给业务队列设置 x-dead-letter-exchange 参数，指定死信交换机，配合 TTL 或者 basic.nack 的 requeue=false，消息失败或过期之后会被转发到死信交换机绑定的死信队列。Kafka 原生没有死信队列的概念，需要业务自己在消费逻辑里捕获异常,重试若干次之后手动把消息发到一个专门的 dead-letter topic 里,再用 offset 正常提交跳过这条消息。</p>\n<p>实际落地时要注意重试次数和退避时间要根据故障类型合理设置，避免重试风暴打垮下游；死信队列一定要有告警和消费监控，不能只进不出变成一个黑洞。</p>\n<p><strong>记忆点：瞬时错误重试、永久错误进死信，死信队列必须有人盯着。</strong></p>"}, {"qnum": 5, "qtext": "顺序消息在 Kafka 和 RocketMQ 里分别是怎么实现的，全局有序和局部有序有什么区别？", "freq": "高频", "answerHtml": "<p>先说清楚一个前提，消息队列默认是不保证全局有序的，一旦涉及多分区并发消费，顺序天然就乱了。所以工程上通常追求的是局部有序，也就是同一个业务维度的消息保证有序就够了，比如同一个订单的状态变更消息要按顺序处理，不同订单之间乱序没关系。</p>\n<p>Kafka 的顺序保证建立在分区之上，同一个分区内消息是严格按写入顺序存储和消费的，跨分区不保证顺序。所以做法是生产者发送消息时指定一个和业务强相关的 key，比如订单 ID，Kafka 的默认分区器会对 key 做 hash 取模，保证相同 key 的消息一定落到同一个分区，消费端一个分区同时只能被消费者组里一个消费者消费，这样就保证了局部有序。如果要全局有序，只能把 topic 设成一个分区，但这样就丧失了 Kafka 横向扩展的意义,只有极少数场景才这么用。</p>\n<p>RocketMQ 的思路类似，它把顺序消息叫做 MessageQueueSelector，生产者发消息时手动实现一个选择队列的逻辑,同样按业务 key 选定固定的 MessageQueue，消费端要用 MessageListenerOrderly 而不是并发消费的 Listener，保证同一个队列同一时刻只有一个线程在消费，内部还会对队列加锁防止并发消费打乱顺序。</p>\n<p><strong>记忆点：顺序消息的本质是把同一业务 key 的消息固定路由到同一个分区/队列，再单线程消费这个分区。</strong></p>"}, {"qnum": 6, "qtext": "延迟消息和定时消息一般是怎么实现的，Kafka 原生支持吗？", "freq": "中频", "answerHtml": "<p>延迟消息的核心诉求是消息发出去之后不立即被消费，而是等到指定时间点才可见。RocketMQ 对这个支持得比较原生，早期版本延迟消息只支持固定的 18 个延迟等级，从 1 秒到 2 小时不等，消息发送时指定延迟等级，broker 内部会先把消息投递到一个内部的调度主题（SCHEDULE_TOPIC_XXXX）里，用一个定时任务线程扫描,到期之后再重新投递到真实的目标 topic，新版本已经支持任意精度的延迟时间了。</p>\n<p>RabbitMQ 原生也不支持延迟消息，业界通用的两种做法，一种是用 TTL 加死信队列组合实现，给消息设置一个过期时间,消息在原队列里躺到过期，因为没有消费者正常消费它，就会被丢到绑定的死信交换机，再路由到真正处理的队列，这样等效于延迟投递；另一种是装官方提供的 rabbitmq-delayed-message-exchange 插件，交换机类型选 x-delayed-message，发消息时带上 x-delay 头指定延迟毫秒数，用起来更直观。</p>\n<p>Kafka 原生完全不支持延迟消息，业内常见做法是自己维护一个按延迟时间分桶的 topic，比如分成 5 秒、1 分钟、5 分钟几档，用一个独立的调度服务扫描这些 topic，到期后再转发到真实业务 topic，本质上是应用层模拟出 RocketMQ 的调度逻辑。</p>\n<p><strong>记忆点：RocketMQ 原生支持延迟消息，RabbitMQ 靠 TTL 加死信或插件，Kafka 完全靠业务自己搭调度层。</strong></p>"}, {"qnum": 7, "qtext": "什么是事务消息，RocketMQ 的事务消息是怎么解决本地事务和消息发送的一致性问题的？", "freq": "中频", "answerHtml": "<p>事务消息要解决的是一个经典的分布式一致性问题，业务要执行一个本地数据库操作,同时还要发一条消息通知别的系统，这两个动作要么都成功要么都失败，如果先操作数据库再发消息，数据库成功了但发消息时进程挂了，消息就丢了导致下游不知情；反过来先发消息再操作数据库，消息发出去了本地事务却失败了，下游又会拿到一条\"假消息\"。</p>\n<p>RocketMQ 的方案是引入了半消息（Half Message）的概念，分三步走。第一步生产者先发一条半消息给 broker，这条消息对消费者是不可见的；第二步 broker 收到半消息之后回调生产者本地的事务执行方法，去跑真正的本地事务，比如扣库存或者建订单；第三步根据本地事务执行的结果，生产者向 broker 发送 commit 或者 rollback，broker 收到 commit 就把半消息转正,让消费者能看到，收到 rollback 就直接删除半消息。</p>\n<p>这里最关键的兜底机制是回查，如果生产者在提交二次确认之前进程崩了，broker 迟迟收不到 commit 或 rollback，就会定期反过来回调生产者实现的一个回查接口，去问一下本地事务到底执行成功没有，业务方需要自己实现这个回查逻辑，通常是查一下本地事务表的状态,兜底保证最终结果一定会被确认，不会出现消息状态悬而未决。</p>\n<p><strong>记忆点：半消息加本地事务回调加事务状态回查，本质是用消息中间件充当了本地事务和消息投递之间的协调者。</strong></p>"}, {"qnum": 8, "qtext": "生产环境遇到消息严重积压该怎么排查和处理，Kafka 的分区和消费者组机制在这里起什么作用？", "freq": "高频", "answerHtml": "<p>排查积压第一步是先定位积压的原因，是消费能力不够，还是消费逻辑本身出了 bug 卡住了，还是下游依赖的服务变慢拖慢了整体消费速度。通常先看监控，Kafka 可以用 kafka-consumer-groups.sh 看每个分区的 LAG，也就是最新的 offset 和消费者已提交 offset 之间的差值，能直观看出是所有分区都在积压还是只有个别分区卡住了；RocketMQ 也有类似的堆积量监控。如果发现只有个别分区积压严重，大概率是某个 key 的流量倾斜导致分区不均衡，或者是消费到了某条\"毒消息\"一直处理失败卡在那不停重试。</p>\n<p>明确原因之后再对症处理。如果是整体消费能力不够，最直接的办法是通过 Kafka 的分区和消费者组机制做水平扩容，因为 Kafka 消费者组里一个分区同一时刻只能被一个消费者实例消费，所以先要保证分区数够多，再增加消费者实例数量,让消费者数接近分区数，这样才能真正把消费并行度提上去，如果消费者数量已经超过分区数,多出来的实例只会空闲，起不到加速作用；也可以在消费者内部做本地线程池,把拉取和实际业务处理解耦，拉取到消息后甩到线程池并发处理,再统一提交 offset，注意提交顺序不能乱。如果是下游服务瓶颈，可能要考虑先把消息落到本地队列或者批量异步写，缓解瞬时压力。</p>\n<p>如果积压已经很严重且业务能接受一定的延迟换取快速消化,可以考虑临时扩容分区加消费者，或者新建一个临时 topic 把积压数据快速转存分流,多个消费组并行清空，事后再评估是否需要调整分区数或者优化消费逻辑本身，比如减少单条消息处理里的同步 IO 调用。</p>\n<p><strong>记忆点：先用 LAG 定位是整体慢还是局部卡，再看是扩容并行度还是修消费逻辑，Kafka 加速的天花板就是分区数。</strong></p>"}, {"qnum": 9, "qtext": "Kafka 的 ISR 机制是怎么工作的，Leader 挂了之后新 Leader 是怎么选出来的？", "freq": "高频", "answerHtml": "<p>ISR 全称 In-Sync Replicas，就是跟 Leader 保持同步的副本集合。每个 Follower 会不停地从 Leader 拉数据，只要它在 <code>replica.lag.time.max.ms</code>（默认 30 秒）之内跟上了 Leader 的最新数据，就留在 ISR 里；一旦拉取延迟超过这个阈值，就会被踢出 ISR，哪怕它还活着。这样设计的好处是，判断一个副本是不是\"健康\"不再看消息条数差多少，而是看时间窗口内有没有持续同步，避免了机器慢一点就被误判掉线。</p>\n<p>Leader 选举这块，Kafka 集群里有一个 Controller 角色（老版本靠 ZooKeeper 选出来，KRaft 之后靠内置的元数据 quorum），它会监听所有 Broker 的存活状态。一旦发现某个 Partition 的 Leader 所在 Broker 挂了，Controller 就从这个 Partition 的 ISR 列表里挑一个副本当新 Leader，默认只会挑 ISR 内的副本，这样能保证数据不丢；如果把 <code>unclean.leader.election.enable</code> 打开，允许从 ISR 之外选，虽然可用性变高了，但可能选出数据落后的副本导致丢消息，这个参数本质就是在可用性和数据安全之间做选择。另外 <code>min.insync.replicas</code> 会和生产者的 <code>acks=all</code> 配合，规定 ISR 至少要有几个副本确认写入才算成功，这是控制持久性的关键旋钮。</p>\n<p><strong>记忆点：ISR 靠时间窗口维护，Leader 选举默认只在 ISR 内进行，unclean 选举是可用性换数据安全。</strong></p>"}, {"qnum": 10, "qtext": "要做到 Kafka 消息不丢，生产者、Broker、消费者三端分别要怎么配置？", "freq": "高频", "answerHtml": "<p>这个问题不能只回答某一端，得把整条链路串起来看，因为任何一环松了都会丢消息。生产者端要开 <code>acks=all</code>，让消息写到所有 ISR 副本才算成功，同时开 <code>enable.idempotence=true</code> 防止网络重试导致的重复发送，<code>retries</code> 设置一个较大的值并配合 <code>delivery.timeout.ms</code> 兜底，避免网络抖动直接判失败丢消息。</p>\n<p>Broker 端要保证 <code>replication.factor</code> 至少是 3，<code>min.insync.replicas</code> 至少是 2，这样即使一个副本挂了也还有冗余；同时 <code>unclean.leader.election.enable</code> 必须关掉，否则前面生产者和 Broker 的保证都可能因为选了一个落后副本当 Leader 而白费。</p>\n<p>消费者端最容易被忽视，很多人只关心生产链路，其实消费端把 <code>enable.auto.commit</code> 开着，业务逻辑还没跑完 offset 就自动提交了，一旦消费者中途挂掉，这条消息实际上就等于丢了（虽然 Kafka 里还在，但业务永远不会再处理它）。正确做法是关掉自动提交，业务处理完再手动 commit，而且要处理好 Rebalance 时机，避免分区被收回前漏提交。</p>\n<pre><code># producer\nacks=all\nenable.idempotence=true\nretries=Integer.MAX_VALUE\ndelivery.timeout.ms=120000\n\n# broker (topic 级别)\nreplication.factor=3\nmin.insync.replicas=2\nunclean.leader.election.enable=false\n\n# consumer\nenable.auto.commit=false</code></pre>\n<p><strong>记忆点：不丢消息是生产者、Broker、消费者三端配置共同作用的结果，缺一不可。</strong></p>"}, {"qnum": 11, "qtext": "Kafka 消费者的 Rebalance 是怎么触发的，会带来什么问题，怎么缓解？", "freq": "高频", "answerHtml": "<p>Rebalance 本质是消费组内分区所有权的重新分配，触发场景常见的有几种：新消费者加入组、有消费者主动离开或因为心跳超时被判定死亡、订阅的 Topic 分区数变化、还有一个很容易被忽略的场景是消费者两次 poll 之间的时间间隔超过了 <code>max.poll.interval.ms</code>，这种通常是业务处理太慢导致的\"假死\"，也会触发 Rebalance。</p>\n<p>老版本用的是 Eager 策略，也就是全量重分配：先把所有分区都收回，所有消费者停止消费，重新分配完再恢复，这段时间叫 Stop-The-World，对吞吐影响很大。而且 Rebalance 前如果 offset 没提交，恢复消费后大概率会出现重复消费。更麻烦的是如果参数没调好，比如会话超时设置太短，消费者稍微卡顿一下就被踢出组，接着又重新加入触发一次新的 Rebalance，反复震荡就是所谓的 Rebalance 风暴，整个消费组基本处于瘫痪状态。</p>\n<p>缓解手段主要是几方面：改用 <code>cooperative-sticky</code> 分配策略做增量再平衡，只挪动必须调整的分区，其它消费者不受影响；合理调大 <code>max.poll.interval.ms</code> 并配合减小 <code>max.poll.records</code> 让单次 poll 处理时间可控；对于会频繁重启的场景可以用静态成员（<code>group.instance.id</code>），让消费者重启后在会话超时内直接恢复原有分区分配而不触发 Rebalance。</p>\n<p><strong>记忆点：Rebalance 的代价是 STW + 重复消费，静态成员和增量再平衡是主要解法。</strong></p>"}, {"qnum": 12, "qtext": "RocketMQ 的 NameServer 架构和基于 ZooKeeper 的方案比，各自的取舍是什么？", "freq": "中频", "answerHtml": "<p>RocketMQ 没有像 Kafka 早期那样依赖 ZooKeeper 做元数据管理和选主，而是自己搞了一套 NameServer。NameServer 集群里每个节点都是独立的，互相之间不通信、不需要选举，Broker 会把自己的路由信息（Topic 和队列的对应关系）注册到每一个 NameServer 上，客户端发消息前从任意一台 NameServer 拉取路由表，本地缓存起来定期刷新。这套设计天然是 AP 的，好处是运维极其简单，随便挂一台 NameServer 都不影响整体服务，也没有传统意义上\"选举窗口期不可用\"的问题，代价是路由信息只能做到最终一致，比如 Broker 刚下线，短时间内还是有客户端可能拿着旧路由发消息发失败，不过消息队列场景下拓扑变化没那么频繁，重试一下就好，可以接受。</p>\n<p>用 ZooKeeper 的方案（比如 Kafka 老架构）是 CP 模型，靠多数派选举保证元数据强一致，还有 Watch 机制做变更通知，一致性更强，但代价是需要维护一套独立的 ZK 集群，选举过程中有短暂不可用窗口，运维复杂度也高出一截。可以说 RocketMQ 用业务场景的特点（消息路由不需要强一致，容忍短暂过期）换来了架构上的简单和更好的可用性，这也是后来 Kafka 自己也转向 KRaft、去掉 ZooKeeper 依赖的原因之一。</p>\n<p><strong>记忆点：NameServer 是 AP 换运维简单，ZooKeeper 方案是 CP 换强一致但更重。</strong></p>"}, {"qnum": 13, "qtext": "消息的幂等性和顺序性看起来是矛盾的，实际项目里怎么同时保证？", "freq": "中频", "answerHtml": "<p>先说为什么会冲突。顺序性要求同一批相关消息必须串行处理，出错了只能原地重试，不能跳过去处理后面的消息，否则顺序就乱了；而幂等性常见的实现思路是\"失败了没关系，反正重复处理也不会有副作用，可以异步重试甚至走死信队列兜底\"，这种做法恰恰是以牺牲顺序为代价的，因为重试或者跳过都可能导致后到的消息先落地。</p>\n<p>实际项目里不会去追求全局严格有序，而是把顺序性收窄到\"局部有序\"：按业务维度（比如订单 ID）做 Hash 分区或者选择对应的队列，保证同一个订单的消息永远落到同一个分区、同一个消费线程，不同订单之间互不影响，这样既保留了并发能力，又不需要真的全局串行。分区内部如果某条消息处理失败，只能原地重试或者阻塞，不能靠跳过来保效率。</p>\n<p>幂等性这块也要做成\"顺序感知\"的，而不是简单靠一个唯一 ID 去重完事。比较稳妥的做法是给业务实体加版本号或者状态机，消费者拿到消息后先比较版本号，只有比当前记录的版本更新才允许更新，哪怕消息因为重试机制被重复投递甚至轻微乱序到达，落地的时候也能通过版本比较过滤掉过期或重复的更新，这样幂等处理本身就不依赖消息队列层面的严格顺序保证了。</p>\n<p><strong>记忆点：不追求全局有序，追求分区内有序 + 版本号驱动的顺序感知幂等。</strong></p>"}, {"qnum": 14, "qtext": "几种主流消息队列该怎么选型，要考虑哪些因素？", "freq": "中频", "answerHtml": "<p>选型不能只看\"谁性能强\"，得看业务场景匹配度。先看吞吐和延迟这个维度，Kafka 靠批量发送和顺序写盘吞吐量最高，适合日志采集、大数据管道这种海量数据搬运的场景；RabbitMQ 单条消息延迟更低，适合对实时性要求高但吞吐没那么夸张的企业集成场景；RocketMQ 则是介于两者之间，国内电商、金融场景用得比较多。</p>\n<p>再看功能特性上的差异，RocketMQ 原生支持分布式事务消息、延迟消息、消息回溯，这些如果用 Kafka 做基本都要自己在业务层额外实现；RabbitMQ 的 Exchange 路由模型非常灵活，支持多种精细的路由规则和优先级队列，这点 Kafka 和 RocketMQ 都比较弱，Kafka 基本就是 Topic-Partition 这种简单模型。</p>\n<p>另外还要看生态和运维成本，Kafka 和大数据生态（Flink、Spark Streaming）结合最紧密，如果本来就有流式计算需求选 Kafka 顺理成章；RocketMQ 在阿里体系里打磨多年，中文社区和金融级可靠性投入比较多；ActiveMQ 现在新项目基本不会选了，主要是历史遗留系统在用。最后还要考虑团队的运维能力和已有技术栈，同样的组件如果团队没经验，再强的性能优势都可能被踩坑成本抵消。</p>\n<p><strong>记忆点：选型看吞吐延迟、原生特性（事务/延迟消息/路由）、生态适配这三个维度综合权衡。</strong></p>"}, {"qnum": 15, "qtext": "广播消费和集群消费有什么区别，分别用在什么场景？", "freq": "低频", "answerHtml": "<p>集群消费是我们默认最熟悉的模式，同一个消费组内的多个实例分摊消费一个 Topic 的所有消息，每条消息在整个组内只会被处理一次，这本质上是做负载均衡，用于常规的业务消息处理，比如订单创建后触发库存扣减、发送通知这类\"这件事只需要做一次\"的场景。</p>\n<p>广播消费则完全不一样，它不做负载均衡，Topic 下的每一条消息会被消费组里的每一个实例都各自消费一遍，等于说消息被复制了 N 份分发给 N 个实例。这种模式适合的场景是每个节点都需要独立感知同一份变化并各自处理，比如某个配置中心推送配置变更、需要每台应用服务器都各自刷新本地缓存或者本地路由表，如果用集群消费只有一个实例能收到通知，其它实例的本地状态就不会更新，这时候就必须用广播。RocketMQ 是原生支持这两种模式的，消费者可以直接指定 <code>consumeMode</code> 为 BROADCASTING 或 CLUSTERING；Kafka 没有单独的广播开关，如果想要类似效果，通常是给每个实例分配一个独立唯一的消费组 ID，这样每个实例逻辑上都是\"独立的组\"，自然就能收到全量消息，本质上是用集群消费的机制模拟出广播的效果。</p>\n<p><strong>记忆点：集群消费做负载均衡只处理一次，广播消费是全量复制给每个实例各自处理。</strong></p>"}]}, {"name": "分布式系统", "questions": [{"qnum": 1, "qtext": "CAP 理论具体讲的是什么，为什么说分布式系统只能在 CP 和 AP 之间选，BASE 理论又是怎么补充这个理论的？", "freq": "高频", "answerHtml": "<p>CAP 说的是在一个分布式系统里，一致性、可用性、分区容错性这三个特性不可能同时满足，最多只能同时保证两个。这里容易理解错的地方是，分区容错性 P 说的是网络分区必然会发生，这不是一个可以主动放弃的选项，光纤被挖断、机房断网这些都是现实存在的故障场景，所以真正可选的其实只有在网络分区发生的那一刻,系统要选择继续保证一致性还是继续保证可用性，选一致性就是 CP，宁可拒绝服务也不返回可能过期的数据，比如 ZooKeeper、etcd 这类系统；选可用性就是 AP，允许短时间内数据不一致但保证服务始终能响应，比如 Eureka、大部分的电商购物车服务。</p>\n<p>BASE 理论是对 AP 系统的一个务实补充，它承认强一致性在很多场景下代价太高不现实，转而追求基本可用（Basically Available）,系统在出故障时允许损失部分可用性但核心功能还在；软状态（Soft State）,允许系统中的数据存在中间状态，不要求时刻和其他节点保持强一致；最终一致性（Eventually Consistent）,只要给定足够的时间窗口，系统里的数据最终会收敛到一致状态。可以理解为 BASE 就是 AP 场景下工程实践的方法论,告诉你放弃强一致性之后具体要怎么设计系统去兜底。</p>\n<p><strong>记忆点：P 是必然存在的,真正的取舍是 C 和 A 二选一，BASE 是 AP 路线的落地方法论。</strong></p>"}, {"qnum": 2, "qtext": "2PC、3PC、TCC、Saga、本地消息表这几种分布式事务方案分别是怎么工作的，各自的优缺点是什么？", "freq": "高频", "answerHtml": "<p>先看 2PC 也就是两阶段提交，协调者先问所有参与者能不能提交（prepare 阶段，各自锁资源写 undo/redo 日志），所有人都说 yes 之后协调者再发 commit 指令进入第二阶段。它的问题很明显，一是同步阻塞，各参与者在等协调者指令期间资源一直被锁着；二是协调者单点故障，如果协调者在发送 commit 之后自己挂了，参与者会一直阻塞不知道该不该提交；三是网络分区下可能出现数据不一致。3PC 在 2PC 基础上加了一个 CanCommit 预询问阶段,并且引入了超时机制,参与者等不到协调者指令超时后会默认提交,一定程度缓解了阻塞问题，但本质上还是同步协议，工程上用得不多。</p>\n<p>TCC 是 Try-Confirm-Cancel 的补偿型方案，完全由业务代码实现三个阶段，Try 阶段冻结资源比如预扣库存，Confirm 阶段真正扣减，Cancel 阶段释放冻结资源，好处是不依赖数据库层面的锁,性能比 2PC 好很多，但对业务侵入性极强，每个环节都要写三份代码，而且要自己处理空补偿、悬挂、幂等这些边界问题。</p>\n<p>Saga 把一个大事务拆成一串本地事务，每一步都有对应的补偿动作，如果某一步失败就依次调用前面步骤的补偿操作做反向回滚，好处是每一步都是本地事务不用长时间锁资源，适合链路长的业务比如跨多个微服务的下单流程，缺点是没有隔离性，中间状态可能被别的事务读到,需要业务自己兜底。</p>\n<p>本地消息表是最工程化、最常见的方案，思路是业务操作和写一条消息记录放在同一个本地事务里保证原子性,然后用一个定时任务轮询这张表，把状态为待发送的消息投递出去，收到下游 ack 之后更新消息状态，这样把跨服务的分布式事务转化成了本地事务加最终一致性,配合消息队列做异步解耦，实现简单可靠，是电商场景里用得最多的方案。</p>\n<p><strong>记忆点：2PC/3PC 靠锁资源换强一致代价太高，TCC/Saga 靠业务补偿换性能，本地消息表靠最终一致性换简单可靠。</strong></p>"}, {"qnum": 3, "qtext": "常见的分布式 ID 生成方案有哪些，雪花算法的原理是什么，实际使用中会遇到什么问题？", "freq": "高频", "answerHtml": "<p>分布式 ID 常见方案大概分几类。数据库自增主键的方式简单但单机有性能瓶颈,而且多数据源场景下容易冲突，通常搭配步长设置做成号段模式来提升性能，美团 Leaf 的号段模式就是这个思路，每次从数据库批量取一段 ID 缓存在内存里发号,减少数据库访问频率；UUID 生成简单不依赖任何外部服务，但它是无序的字符串，作为数据库主键会导致 B+树频繁分裂,插入性能很差，一般只用在不需要排序、不做主键的场景；Redis 的 incr 自增也能用,但要考虑持久化和主从切换时候的 ID 重复风险。</p>\n<p>雪花算法（Snowflake）是目前用得最广泛的方案，思路是用一个 64 位的 long 类型拼出一个全局唯一且趋势递增的 ID，最高位是符号位固定为 0，接下来 41 位是毫秒级时间戳，可以用大概 69 年，然后是 10 位机器标识,通常拆成数据中心 ID 加机器 ID，最后 12 位是同一毫秒内的序列号，可以支持单机每毫秒生成 4096 个不重复 ID。它的优势是本地生成不依赖网络请求，性能极高，且 ID 大致按时间递增，对数据库索引友好。</p>\n<p>实际使用中最大的坑是时钟回拨问题，如果机器的系统时间因为 NTP 校准等原因往回跳了，会导致新生成的 ID 比之前生成过的还小，甚至可能重复。业界一般的应对办法是发号时检测到时钟回拨就抛异常拒绝服务，或者等待时钟追上来，或者预留一个专门的位标记是发生了回拨之后生成的 ID 加以区分。另外多机部署时机器 ID 的分配要保证唯一，通常借助 ZooKeeper 临时节点或者配置中心来分配,避免人工配置出错导致 ID 冲突。</p>\n<p><strong>记忆点：雪花算法核心是时间戳加机器位加序列号拼出趋势递增 ID，最大的坑是时钟回拨。</strong></p>"}, {"qnum": 4, "qtext": "Paxos 和 Raft 这两种一致性协议解决的核心问题是什么，Raft 相比 Paxos 做了哪些简化？", "freq": "中频", "answerHtml": "<p>它们要解决的核心问题是,在一个由多个节点组成、随时可能有节点宕机或者网络分区的集群里，怎么让所有节点对某个值达成一致的共识，这是分布式系统里最基础也最难的问题之一，像 ZooKeeper、etcd、大部分分布式数据库的选主和日志复制都要靠它们打底。</p>\n<p>Paxos 是最早被严格证明正确的共识算法，分成 Prepare 和 Accept 两个阶段，一个提议者要先广播一个带编号的提案去询问多数派节点能不能接受，拿到多数派响应之后才能真正发起 Accept 请求写入值，编号更高的提案可以覆盖编号更低的提案，从而保证即使有节点故障或者消息丢失,最终也只会有一个值被确定下来。Paxos 理论上非常严谨,但原始论文描述得比较抽象晦涩,尤其是多轮提案、多值 Paxos（Multi-Paxos）怎么落地工程实现,业界公认很难直接照着实现,所以历史上很少有团队能一次性把它做对。</p>\n<p>Raft 的出发点就是\"可理解性优先\"，本质上是 Multi-Paxos 的一个工程化、更容易实现的变种。它把共识过程拆成三个相对独立好理解的子问题，一是 Leader 选举，集群里同一时刻只有一个 Leader，所有写请求都必须经过它，节点之间靠心跳和随机化的选举超时时间来触发选举、避免选票瓣裂；二是日志复制，Leader 收到写请求后先写自己的日志,再并行发给 Follower，多数派确认写入后才算提交,再通知状态机应用；三是安全性约束,保证已经提交的日志不会被覆盖，比如选举时要求候选人的日志必须不落后于多数派。相比 Paxos 里角色对称、任何节点都能同时发起提案的设计，Raft 强制要求只有 Leader 才能处理写请求，这大大降低了并发提案带来的复杂度，也是它比 Paxos 更容易在工程上落地的关键原因。</p>\n<p><strong>记忆点：Paxos 理论完备但难实现,Raft 把角色收敛到唯一 Leader,拆成选举加日志复制两个好懂的子问题。</strong></p>"}, {"qnum": 5, "qtext": "常见的分布式锁实现方式有哪些，各自的优缺点和适用场景是什么？", "freq": "高频", "answerHtml": "<p>分布式锁常见的落地方式大致有三类,基于数据库、基于 Redis、基于 ZooKeeper（或 etcd）。</p>\n<p>先说基于数据库的方式，最简单的做法是建一张锁表,靠唯一索引来保证同一时刻只有一条记录能插入成功，谁插入成功谁就拿到锁，释放锁就删除这条记录；也可以用行级悲观锁 select for update。这种方式实现简单不用引入新组件，但性能差,数据库锁的粒度和并发能力都很有限，而且释放锁依赖客户端主动删除,一旦客户端挂了容易出现锁没释放的死锁问题，一般只在低并发场景应急使用。</p>\n<p>Redis 分布式锁是用得最多的方案，核心是用 SET key value NX PX 毫秒数这条原子命令，保证加锁和设置超时时间是一步完成的，避免中间态导致死锁；释放锁要用 Lua 脚本保证\"判断 value 是不是自己加的锁,是的话才删除\"这个操作的原子性，防止误删别人的锁。它的优点是性能高、实现相对简单，缺点是锁的可靠性依赖 Redis 本身的高可用,如果是主从架构,主节点写入锁之后还没同步给从节点就宕机，新选出来的主节点上这把锁就凭空消失了,可能导致两个客户端同时拿到锁。针对这个问题 Redis 官方提出了 Redlock 算法，要求向多数派的独立 Redis 节点分别加锁,多数节点成功才算加锁成功,一定程度缓解单点问题,但业界对 Redlock 在极端时钟漂移场景下的正确性也一直有争议。</p>\n<p>基于 ZooKeeper 的分布式锁是用临时顺序节点实现的，每个客户端在指定目录下创建一个临时顺序节点,判断自己是不是当前序号最小的节点,是的话就获得锁,不是的话监听前一个节点的删除事件等待被唤醒，这样避免了羊群效应。它的优点是可靠性最高,因为临时节点会在客户端断开连接时被自动删除,不会有死锁风险，还天然支持公平排队；缺点是性能不如 Redis,因为要走 ZAB 协议的多数派写入,加锁释放锁的开销更大,吞吐量有限，适合对可靠性要求极高、并发量不算特别夸张的场景，比如任务调度、选主。</p>\n<p>实际选型上,高并发、允许极小概率误判的场景选 Redis，强一致性要求高、并发不是瓶颈的场景选 ZooKeeper,低成本临时方案才考虑数据库锁。</p>\n<p><strong>记忆点：数据库锁简单但弱，Redis 锁快但要靠 Redlock 或者续期机制补可靠性，ZooKeeper 锁最可靠但吞吐较低。</strong></p>"}, {"qnum": 6, "qtext": "分布式环境下 Session 一致性问题怎么解决，几种方案各有什么取舍？", "freq": "中频", "answerHtml": "<p>问题的根源是传统单机 Session 是保存在应用服务器内存里的，一旦引入负载均衡把请求分发到多台机器,用户这次请求落在 A 机器上登录成功写入了 Session，下次请求被负载均衡分到 B 机器,B 机器内存里没有这个 Session 就会导致用户被要求重新登录。</p>\n<p>第一种方案是 Session 复制，让集群里每台机器的 Session 数据互相同步，一台机器写入 Session 后广播给所有其他机器，这种方式对业务代码完全无侵入，但集群规模一大,节点之间的同步流量会爆炸式增长，而且存在同步的时间差可能导致数据短暂不一致，现在基本很少用了。</p>\n<p>第二种是 Session 粘滞，也叫会话粘性，在负载均衡层做文章，通过用户的 IP 或者 Cookie 里的标识,保证同一个用户的请求始终被转发到固定的同一台服务器上处理,这样每台机器只需要维护自己那部分用户的 Session,不需要同步。它实现简单性能也好，但问题是一旦这台服务器宕机,挂在它上面的用户 Session 全部丢失,而且没法做到真正的负载均衡,某些机器可能因为粘性分配不均出现热点。</p>\n<p>第三种也是目前最主流的方案，把 Session 集中存储到一个外部的共享存储里，比如 Redis，应用服务器本身变成无状态的，不管请求落到哪台机器,都统一去 Redis 里查 Session 数据。这个方案扩展性最好,服务器可以随意扩缩容,也不用担心单机故障丢数据,配合合理的过期时间管理起来也很方便，代价是多引入了一次网络 IO，以及要考虑 Redis 本身的高可用问题。</p>\n<p>第四种思路是彻底抛弃服务端 Session,改用 JWT 这类无状态 token,把用户信息加签名之后放在客户端,服务端不需要存储任何会话状态,靠验证签名判断合法性,天然支持水平扩展，缺点是 token 一旦签发很难主动失效（除非搭配黑名单机制),而且如果 payload 塞太多信息会让每次请求的体积变大。</p>\n<p>实际项目里,现在绝大多数中大型系统会选择 Redis 集中存储 Session 或者干脆走 JWT 无状态方案,粘滞和复制这两种方式基本已经被淘汰了。</p>\n<p><strong>记忆点：Session 一致性问题的最终解法是把状态从应用服务器里剥离出去，要么集中存到 Redis，要么干脆用 JWT 做到彻底无状态。</strong></p>"}, {"qnum": 7, "qtext": "分布式事务里说的\"最终一致性\"具体怎么在工程上落地，如何保证消息一定会被送达且不丢失？", "freq": "中频", "answerHtml": "<p>最终一致性不是一句口号,工程上要靠一整套可靠的投递和补偿机制来兜底，核心思路是保证\"业务操作\"和\"通知动作\"的原子性，然后靠重试和对账机制来纠正中间可能出现的偏差。</p>\n<p>最常见的落地方式是前面提到的本地消息表模式，业务方在执行本地事务时，把要发送的消息以及所处的状态（待发送、已发送、已确认）在同一个数据库事务里写入一张消息表,这样保证了业务数据和消息记录要么一起成功要么一起失败,不存在中间状态丢失的问题。之后有一个独立的定时任务或者常驻线程扫描这张表,把状态为待发送的记录投递给消息队列,发送成功后更新状态为已发送。如果消息队列没有确认收到,或者下游没有回执,定时任务会按一定的退避策略反复重试投递，直到收到确认为止。</p>\n<p>光靠重试还不够,因为可能存在极端情况下消息表状态和真实发送情况不一致，所以还要有兜底的对账机制,比如每天跑一次批量任务，比对源系统和目标系统的数据差异,把遗漏的部分做补偿处理,这也是很多支付、清结算系统里\"对账系统\"存在的意义。</p>\n<p>消费端要配合做好幂等处理,因为重试机制决定了同一条消息完全可能被消费多次，前面提到的唯一键去重或者业务操作本身幂等的方案在这里同样适用。整体上最终一致性的实现思路可以总结成,本地事务保证原子写入,消息队列或者定时任务保证不断重试投递,消费端保证幂等,再加上兜底对账兜住极端情况,这一整套组合拳撑起最终一致性的承诺。</p>\n<p><strong>记忆点：最终一致性靠的不是单一技术点，而是本地事务加消息表加重试加幂等加对账这一整条链路共同兜底。</strong></p>"}, {"qnum": 8, "qtext": "什么是拜占庭将军问题，它和一般的分布式共识问题（比如 Paxos/Raft 解决的问题）有什么区别，实际工程中会遇到吗？", "freq": "低频", "answerHtml": "<p>拜占庭将军问题是分布式系统里一个更极端的容错模型,描述的场景是多个将军要通过信使协商是否同时进攻敌方城池，但将军里可能混入了叛徒,叛徒不仅会不响应,甚至会故意发送自相矛盾、错误的消息来干扰整体决策，问题的核心是在存在这种主动作恶节点的情况下，忠诚的将军们该如何仍然达成一致的行动方案。这类问题也叫拜占庭容错（BFT），要求系统能容忍节点不仅仅是宕机，还包括发送虚假信息、选择性作恶等任意行为。</p>\n<p>它和 Paxos、Raft 解决的问题有本质区别。Paxos、Raft 这类协议假设的是非拜占庭故障模型,也叫\"故障停止\"模型,节点要么正常工作,要么直接宕机不响应，但绝不会主动发送错误或者伪造的信息去欺骗别的节点，这个假设在一般企业内部的分布式系统里是成立的，因为所有节点都是自己公司部署和信任的机器，不存在恶意节点，所以只需要处理宕机、网络分区、消息延迟这些\"诚实的故障\"就够了，这也是为什么 Raft 相对容易实现。而拜占庭容错要处理的是不受信任、可能被攻破或者恶意控制的节点,证明和实现的复杂度要高得多，经典的 PBFT 算法能容忍集群中不超过三分之一的节点是拜占庭节点。</p>\n<p>实际工程中,普通企业内部的分布式系统、微服务架构、数据库集群基本用不上拜占庭容错，因为节点都在同一个信任域内,用 Raft、Paxos 这类非拜占庭协议就够了，性能也更好。拜占庭容错真正有意义的场景主要是在区块链、联盟链这类多方不完全互信的场景里,比如比特币的工作量证明机制、联盟链常用的 PBFT 共识算法，因为参与节点可能来自不同的、互不信任的组织，必须假设有节点会故意作恶。</p>\n<p><strong>记忆点：Raft/Paxos 只防节点\"失联\"，拜占庭容错还要防节点\"说谎\"，普通企业系统用不上，区块链场景才用得上。</strong></p>"}, {"qnum": 9, "qtext": "Redis 分布式锁的自动续期时间，和业务实际执行超时冲突了怎么办？", "freq": "高频", "answerHtml": "<p>用 Redisson 这类客户端加锁的时候，背后有个看门狗（Watchdog）机制，默认锁的租期是 30 秒，客户端会在租期过去大约三分之一的时候自动帮你续期，只要持锁线程还活着，锁就不会因为业务没执行完而提前过期，这解决了\"业务耗时超过锁 TTL 导致锁被误释放、别人抢到锁\"的基本问题。</p>\n<p>但这不是万能的，续期本身依赖持锁客户端的后台线程正常运行，如果这台机器发生长时间 GC 停顿、网络分区导致续期请求发不出去或者进程直接被杀掉，看门狗就失效了，锁照样会在原 TTL 到期后被释放，这时候如果原来的业务其实还没执行完，另一个客户端拿到锁开始并发执行，就会出现两边同时操作同一份数据的经典问题。所以单纯依赖续期机制在分布式环境下只能算是\"尽力而为\"，不能当成强保证。</p>\n<p>更稳妥的做法是在锁之外再加一层兜底：一种是给关键资源加乐观锁版本号或者 CAS 校验，就算真出现锁重叠，写入时也会因为版本不匹配而失败；更经典的是引入 fencing token（防护令牌），每次加锁成功都拿到一个严格递增的令牌，下游资源在真正写入前校验这个令牌必须比它见过的最大令牌更大，旧令牌的写入直接拒绝，这样即使续期失败导致锁短暂重叠，也能在资源层面挡住脏写。业务侧再配合一个执行超时监控，超过预期时长的任务主动报警熔断，而不是无限依赖续期把锁一直续下去。</p>\n<p><strong>记忆点：续期只是尽力而为，真正兜底要靠资源层的 fencing token 或版本号校验。</strong></p>"}, {"qnum": 10, "qtext": "ZooKeeper 的 ZAB 协议和 Raft 有什么异同？", "freq": "中频", "answerHtml": "<p>两者都属于基于 Leader 的日志复制型共识协议，目标都是在多数派确认后提交，做到 CP 语义下的强一致，整体流程也都能拆成\"选主\"加\"日志同步/广播\"两大阶段，思路上是同源的。</p>\n<p>不同点主要在细节设计和抽象程度上。Raft 是后出的，刻意把算法拆解成选举、日志复制、安全性三块，每一块都有清晰独立的规则，比如日志条目用 term + index 唯一标识，方便处理冲突日志的截断覆盖，也正因为设计得足够通用和好理解，后来 etcd、Consul、TiKV 这些系统都直接拿 Raft 当通用库来用。ZAB 用 epoch 概念对应 Raft 的 term，同样要求新 Leader 必须拥有多数派里最新最全的历史记录才有资格当选，广播阶段本质也是一个类似两阶段提交的过程，发提案、收到多数 ACK 才提交，思路和 Raft 的日志复制是相通的，但 ZAB 是伴随着 ZooKeeper 自身的事务日志和快照机制一起演化出来的，工程实现和 ZK 内部深度耦合，没有被单独抽象成一个可复用的协议库对外输出。</p>\n<p>另外读一致性上也有差别，ZooKeeper 默认允许客户端从任意节点做本地读，可能读到略微落后的数据，除非显式调用 sync 强制同步，而不少 Raft 实现会通过 Leader Lease 或者 Read Index 机制让普通读也能做到线性一致，这算是工程实践上的取舍差异，不是协议本质区别。</p>\n<p><strong>记忆点：思路同源（Leader+多数派日志复制），Raft 更工程化通用，ZAB 和 ZooKeeper 强耦合。</strong></p>"}, {"qnum": 11, "qtext": "熔断、降级、限流这三者在一条分布式调用链路里是怎么联动生效的？", "freq": "高频", "answerHtml": "<p>这三个东西经常被放在一起讲，但作用的层次和时机是不一样的。限流是最前置的防御，一般在网关层或者服务入口用令牌桶、漏桶这类算法卡住超出承载能力的流量，目的是从源头上不让请求量压垮系统，属于\"预防\"性质。熔断则是发生在服务调用链路内部，针对某个具体下游依赖，持续监控它的错误率或者响应时间，一旦超过阈值就把这条调用链路直接断开，后续请求快速失败而不是继续排队等待，避免线程池被这个慢下游拖垮进而拖垮整个服务，属于\"故障发生中\"的应激反应。降级则是熔断或者限流触发之后\"怎么办\"的问题，是提供一个退化但可用的响应，比如返回缓存的旧数据、返回一个默认值或者干脆跳过非核心逻辑，保证核心链路还能走通。</p>\n<p>三者联动体现在，网关限流不是把请求直接拒绝完事，很多场景会配合降级返回一个友好提示或缓存结果；熔断器打开之后，调用方要有对应的 fallback 逻辑，这个 fallback 往往就是降级策略的具体实现；反过来，当自身服务因为限流已经处于高压状态时，也可以主动降级掉非核心功能（比如推荐、日志异步化、关闭次要的旁路调用）为核心交易腾出资源，这时候需要有一个统一的配置开关（通过 Nacos 或 Apollo 这类配置中心下发），让运维在大促或者故障时能手动一键降级，而不完全依赖自动阈值判断。熔断器还有一个半开状态用来试探下游是否恢复，这也是联动闭环里容易被忽略的一环。</p>\n<p><strong>记忆点：限流管入口预防、熔断管链路中故障隔离、降级管兜底体验，三者通过统一开关联动。</strong></p>"}, {"qnum": 12, "qtext": "Seata 的 AT 模式是怎么实现分布式事务的？", "freq": "中频", "answerHtml": "<p>AT 模式最大的特点是对业务代码几乎无侵入，业务该怎么写 SQL 还怎么写。核心角色有三个：TM 负责发起和最终决定全局事务提交还是回滚，RM 是每个参与方数据库这一侧的资源管理器，TC 就是 Seata Server，负责协调各个分支事务。</p>\n<p>关键机制在 RM 这一层，它通过代理数据源拦截业务的 SQL，在真正执行 UPDATE 或 DELETE 之前，先查一次这条记录当前的值作为\"前镜像\"，SQL 执行完之后再查一次作为\"后镜像\"，把前后镜像一起写进一张 undo_log 表，并且是和业务 SQL 放在同一个本地事务里一起提交的，这就意味着本地事务是立刻提交的，不会像传统 XA 那样一直持有数据库锁等全局事务结束，并发能力因此高很多。同时 RM 会向 TC 申请这一行记录的全局锁，防止别的全局事务在这个中间状态下并发修改同一行数据。</p>\n<p>全局提交阶段，因为本地事务其实早就提交了，TC 通知各分支\"提交\"只是异步地把对应的 undo_log 记录删掉，非常轻量。如果需要全局回滚，RM 会去读 undo_log 里的前镜像，生成一条补偿 SQL 把数据反向改回去，再删掉 undo_log。这种设计本质是拿\"业务补偿\"换\"不长期持锁\"，代价是隔离性上不如真正的 XA 事务严格，中间会有一个短暂的脏写风险窗口，靠前面提到的全局锁机制来兜底防护。</p>\n<p><strong>记忆点：AT 模式靠前后镜像做补偿回滚，本地事务提前提交换取高并发，全局锁防止脏写。</strong></p>"}, {"qnum": 13, "qtext": "接口幂等性设计和分布式 ID 生成之间有什么关系？", "freq": "中频", "answerHtml": "<p>做接口幂等，常见思路是给每个逻辑请求绑定一个唯一的幂等键，处理前先检查这个键是否已经处理过，比如靠数据库唯一索引、Redis SETNX，或者直接检查业务状态机是否已经流转过。问题是这个\"唯一键\"从哪来，怎么保证它在分布式环境下既全局唯一又不依赖单点、还得扛得住高并发下的重复提交和网络重试，这其实就是分布式 ID 生成要解决的问题，两者本质上是同一件事的两个面。</p>\n<p>分布式 ID 的几种方案各有取舍：UUID 生成简单但完全无序，用作数据库主键会导致索引频繁分裂；雪花算法把时间戳、机器位、序列号拼在一起，基本有序而且不依赖外部组件，但要处理好时钟回拨的问题；号段模式（类似美团 Leaf）提前从数据库批量领取一段 ID 缓存在本地，减少每次生成都要打数据库的开销。</p>\n<p>真正容易踩坑的地方在于，幂等键必须在这次逻辑操作最开始就固定下来，而不能每次重试都重新生成一个新 ID，如果客户端每次重试请求都生成一个新的分布式 ID 当幂等键，那这个幂等机制就完全失效了。正确做法通常是客户端在第一次发起请求前就生成好这个 ID（或者服务端首次处理时生成并返回给客户端，后续重试必须带着这个 ID），这样不管请求重试多少次，落到服务端的幂等键都是同一个，才能真正拦住重复处理，比如下单场景一般是先幂等地生成订单号，所有后续重试都复用这个订单号去检查状态。</p>\n<p><strong>记忆点：幂等键和分布式 ID 是同一个问题的两面，关键是 ID 必须在操作开始时就固定而不能每次重试重新生成。</strong></p>"}, {"qnum": 14, "qtext": "一致性哈希算法的原理是什么，怎么用虚拟节点解决数据倾斜？", "freq": "高频", "answerHtml": "<p>一致性哈希把节点和数据 key 都通过哈希函数映射到一个首尾相连的环上（通常是 0 到 2^32-1），查找数据的时候从这个 key 的哈希值位置开始顺时针找，遇到的第一个节点就是它归属的节点。相比传统对节点数取模的方式，它的优势在于节点增减的时候，只有这个节点在环上相邻区间的数据需要重新分布，其它节点的数据完全不受影响，这对缓存集群扩缩容非常关键，取模方式一旦节点数变化，几乎所有 key 的归属都会变，等于缓存全部失效重建。</p>\n<p>但一致性哈希本身有个短板，如果节点数量比较少，节点在环上的哈希位置是随机分布的，很容易出现分布不均匀的情况，比如几个节点的哈希值恰好聚在环的某一小段，导致某个节点实际负责的弧长远大于其它节点，出现数据倾斜、有的节点特别热有的特别闲。</p>\n<p>解决办法是引入虚拟节点，给每个物理节点生成很多个虚拟映射（比如给节点 A 生成 \"A#1\"、\"A#2\" 一直到 \"A#150\" 这样上百个哈希值），这些虚拟节点分散地落在环的各个位置，物理节点 A 实际负责的区域就变成了这上百个虚拟节点各自小弧段的总和，从统计规律上看这样会比单一位置均匀得多。某个物理节点下线的时候，它对应的一百多个虚拟节点分布在环的各处，原本它负责的数据也会均匀地分散转移给相邻的多个物理节点，而不是集中甩给某一个邻居节点造成新的热点。另外虚拟节点数量还可以按节点实际处理能力做权重分配，能力强的节点多分配一些虚拟节点，天然实现负载的按能力分摊。</p>\n<p><strong>记忆点：一致性哈希减少节点变动的数据迁移量，虚拟节点解决少节点场景下的分布不均。</strong></p>"}, {"qnum": 15, "qtext": "分布式场景下，缓存和数据库的双写一致性一般怎么保障？", "freq": "高频", "answerHtml": "<p>先说最常见也最容易踩坑的思路，写的时候是先更新数据库、再删除缓存，而不是直接更新缓存，因为更新缓存在并发场景下容易出现旧值把新值覆盖回去的问题，删除缓存则是让下一次读的时候自然触发重新从数据库加载，出错的代价更小。但这个方式仍然有一个理论上的竞态窗口：删除缓存这一刻之后、下一次写重新查库填充缓存之前，如果正好有一个读请求进来发现缓存没有，去数据库读了一个旧值（发生在写事务提交前）填回缓存，就会导致脏数据长期滞留。对这种场景比较常见的补救是延迟双删，删一次缓存、更新数据库，睡一小段时间之后再删一次，把这个竞态窗口内可能被脏读写回的缓存再清掉。</p>\n<p>对一致性要求更高、或者不希望在业务写路径里做这些额外动作的场景，会用基于 binlog 的异步方案，比如用 Canal 订阅 MySQL 的 binlog，检测到某一行数据变更了就去精准地删除或者更新对应的缓存，这样把缓存维护完全从业务写路径里解耦出来，即使缓存删除失败了，也可以把这次失败操作丢进消息队列做重试兜底，不至于永久性地留下脏缓存。</p>\n<p>再往上如果业务对一致性极度敏感，可以给缓存条目加版本号，只允许比当前版本更新的写入生效，防止乱序写入覆盖新数据；但说到底，缓存和数据库之间要做到真正意义上的强一致，成本非常高（相当于要跨两个存储做分布式事务），实际项目里基本都是接受一个很短的最终一致窗口，再用较短的 TTL 兜底，把小概率的脏读代价控制在可接受范围内。</p>\n<p><strong>记忆点：先更新库再删缓存是主流做法，binlog 异步失效 + 消息队列重试是更稳的工程方案，强一致成本太高一般不追求。</strong></p>"}, {"qnum": 16, "qtext": "结合一个实际业务场景说说 CAP 理论在设计时是怎么取舍的？", "freq": "中频", "answerHtml": "<p>CAP 理论里分区容错 P 在真正的分布式系统里是必须接受的前提，网络分区总会发生，所以实际能选择的其实是分区发生时到底倾向 C 还是倾向 A，而且这个选择不是整个系统统一做一次，往往是按业务模块粒度分别决策的，同一个系统里不同数据完全可能做出相反的选择。</p>\n<p>拿电商秒杀的库存扣减来说，这里会明显偏向 A：大促瞬时流量极高，如果为了保证库存数字在任意时刻都精确一致，让每次扣减都走强一致的分布式锁或者数据库行锁串行处理，系统吞吐根本扛不住，请求大量超时反而会引发更大范围的雪崩。所以实践中通常是 Redis 先做预扣减、快速响应用户，实际的数据库库存扣减走异步队列慢慢消化，即便出现网络抖动导致个别节点数据短暂不一致，最坏结果也就是小范围超卖，后续用补偿库存或者退款处理掉，这是拿可用性换取用户体验和吞吐，接受一个业务上可控、财务上可承受的不一致风险。</p>\n<p>但换到账户余额、支付扣款这类数据，就必须坚决倒向 C：绝对不能出现因为网络分区导致同一个账户在两边同时被扣款或者出现双花，这种场景一般会通过按账户维度做单一写入点（同一账户的所有请求路由到固定分片的主库）或者用 Seata 这类分布式事务保证强一致，一旦网络分区发生，宁可让处于少数派一侧的写请求直接失败或排队等待，也不能放行造成资金错误，这是拿短暂的不可用换绝对的数据正确性。</p>\n<p>决策的核心逻辑是评估这块数据一旦出错的代价有多大、多难挽回，代价可控、可事后补偿的偏向 A，代价是资金损失或者不可逆的偏向 C，而不是给整个系统定死一个统一的 CAP 选择。</p>\n<p><strong>记忆点：P 是前提无法回避，真正的选择是按业务数据的出错代价，在 C 和 A 之间分模块权衡。</strong></p>"}]}, {"name": "系统设计与架构", "questions": [{"qnum": 1, "qtext": "高并发系统里限流、降级、熔断这三种手段分别解决什么问题，你会怎么组合使用？", "freq": "高频", "answerHtml": "<p>这三个手段其实是在系统不同的\"受伤阶段\"起作用的。限流是事前的自我保护，在请求还没进入核心逻辑之前就把超出系统处理能力的流量挡在外面，常见的算法有令牌桶和漏桶，令牌桶允许一定的突发流量,漏桶则是严格匀速处理，实际项目里我更常用令牌桶,因为业务上偶尔的突发流量不应该被一刀切拒绝。限流可以做在网关层、也可以做在单机的接口级别,比如用 Sentinel 或者 Guava 的 RateLimiter。</p>\n<p>熔断解决的是依赖故障的传导问题,当下游服务大量超时或者报错的时候,如果还继续傻乎乎地调用,线程池会被拖垮,进而拖垮整个调用链。熔断器会统计一个滑动窗口内的失败率,超过阈值就直接切断请求,进入半开状态之后再小流量试探恢复情况,这是借鉴电路保险丝的思路。</p>\n<p>降级则是在资源不够或者依赖不可用的时候,主动放弃一些非核心功能,保住核心链路,比如大促时把评论、推荐这些非核心模块的调用直接返回默认值或者缓存值,把资源留给下单支付。实际组合起来,一般是限流兜底防止被打垮,熔断保护调用链不被慢请求拖死,降级保证核心业务在极端情况下还能用,三者是分层防御,不是互相替代的关系。</p>\n<p><strong>记忆点：限流防打垮、熔断防拖死、降级保核心，三层递进防御。</strong></p>"}, {"qnum": 2, "qtext": "如何保证缓存和数据库之间的数据一致性？先更新缓存还是先更新数据库，为什么？", "freq": "高频", "answerHtml": "<p>这个问题的核心矛盾在于更新数据库和更新缓存不是原子操作,中间总有并发窗口。业界比较认可的方案是Cache Aside,也就是旁路缓存:读的时候先读缓存,没命中再读数据库并回填缓存;写的时候只更新数据库,然后删除缓存,而不是更新缓存。</p>\n<p>先说为什么删除而不是更新缓存,如果两个写请求并发进来,更新缓存的顺序可能和更新数据库的顺序不一致,导致缓存里留下的是旧值,而删除操作是幂等的,不存在这个顺序颠倒的问题,下次读的时候会自然从数据库拿最新值回填。</p>\n<p>再说先操作数据库还是先操作缓存,正确的做法是先更新数据库再删除缓存。如果反过来,先删缓存再更新数据库,中间有个空档期,一个并发的读请求会发现缓存为空,去数据库读到旧值又回填进缓存,导致脏数据长期存在。而先更新数据库再删缓存,虽然理论上也存在一个极小概率的并发问题,就是删除缓存失败,但可以通过消息队列异步重试删除,或者用 binlog 订阅比如 Canal 监听数据变更再去删缓存来兜底,进一步提高一致性。对于一致性要求极高的场景,还可以引入延迟双删,写完之后间隔一段时间再删一次缓存,防止读请求在删除和更新数据库之间回填了脏数据。</p>\n<p><strong>记忆点：先更新库、再删缓存，用 binlog 订阅兜底删除失败的场景。</strong></p>"}, {"qnum": 3, "qtext": "微服务应该按照什么原则拆分？拆分完之后服务治理要解决哪些问题？", "freq": "高频", "answerHtml": "<p>拆分原则我一般从业务维度出发,而不是技术维度。首先看限界上下文,也就是领域驱动设计里说的每个服务要对应一个独立完整的业务能力,比如订单、库存、支付、用户,各自有自己的领域模型,不要出现一个服务里塞了好几个不相关的业务。其次看数据的独立性,每个服务应该有自己独立的数据库,不能多个服务共享一张表,否则拆分只是形式上的,底层还是耦合在一起。再看团队边界,康威定律告诉我们系统架构会趋同于组织架构,拆分粒度最好能对应到一个小团队能独立维护的范围,方便独立开发、独立部署、独立扩容。另外还要考虑变化频率,把经常变动的模块和相对稳定的模块分开,避免一个小改动引发大范围的联调和发布。</p>\n<p>拆完之后麻烦才真正开始,这就是服务治理要解决的问题。首先是服务注册与发现,比如用 Nacos 或者 Eureka 让服务之间能动态感知彼此。其次是负载均衡和路由,配合网关做统一入口。然后是前面提到的限流熔断降级,分布式场景下故障传播更容易被放大。还有分布式事务的问题,跨服务的操作没法用本地事务保证,需要 TCC、Saga 或者可靠消息这类最终一致性方案。最后还有配置中心统一管理配置、链路追踪定位跨服务问题、以及接口版本管理和灰度发布的能力,这些都是治理体系里绕不开的部分。</p>\n<p><strong>记忆点：按业务边界拆分，治理解决的是分布式带来的新问题而不是老问题的重现。</strong></p>"}, {"qnum": 4, "qtext": "设计一个秒杀系统，你会重点关注哪些环节，如何做到既扛得住流量又不超卖？", "freq": "高频", "answerHtml": "<p>秒杀系统的核心矛盾是瞬时流量远超系统正常处理能力,而且大部分请求其实是无效的抢购请求,所以设计思路是层层过滤,让无效流量尽早在链路的前端被拦截掉,不要让它们打到数据库。</p>\n<p>最前面是接入层,做好静态资源的 CDN 缓存,详情页尽量静态化,再加上网关层限流和防刷,比如同一个用户同一个 IP 限制请求频率,还可以用验证码或者答题来延缓机器人下单。往后到应用层,通常会把商品库存提前加载到 Redis 里,用 Redis 的原子操作比如 Lua 脚本做扣减库存和判断库存是否充足这两步的原子化,避免读了库存判断有货,写的时候又超卖这种竞态问题。</p>\n<p>真正下单的请求不建议同步直接打数据库,而是让请求进入消息队列排队,后端消费者按照能承受的速率异步处理订单,写入数据库,前端给用户一个\"排队中\"的提示,通过轮询或者 WebSocket 通知最终结果,这样能有效削峰填谷。库存扣减这块我倾向于提前预扣,下单成功真正占住库存,超时未支付的订单要有过期回滚库存的机制,避免库存被无效占用。整个链路里还要考虑分布式锁或者乐观锁配合版本号来防止极端情况下的并发超卖,数据库层面加上库存不能为负的约束作为最后一道防线。</p>\n<p><strong>记忆点：流量分层过滤，库存原子扣减，异步下单削峰。</strong></p>"}, {"qnum": 5, "qtext": "设计一个短链系统，长链接怎么转换成短链接，如何保证不重复又能支持高并发跳转？", "freq": "中频", "answerHtml": "<p>短链系统看起来简单,但设计好需要考虑生成算法、存储、跳转性能三块。生成短码常见的思路有两种,一种是对长链接做哈希,比如 MD5 或者 CRC32,取一部分再做 62 进制编码得到 6 到 8 位短码,这种方式实现简单但要处理哈希碰撞,通常做法是碰撞了就加盐重新计算,或者退化成从数据库查是否已经存在相同长链接直接复用已有短码。</p>\n<p>另一种更主流的思路是发号器方案,用一个全局自增 ID,比如通过数据库自增序列、Redis 的 incr,或者更适合分布式场景的雪花算法生成唯一 ID,再把这个十进制 ID 转成 62 进制字符串作为短码,这样天然不会重复,也不用担心碰撞,缺点是需要额外维护一套发号服务,但这个服务本身可以做得很轻。生成之后短码和长链接的映射关系存到数据库,同时构建索引。</p>\n<p>跳转是这个系统里访问量最大的部分,读远多于写,所以要用多级缓存来扛,短码到长链接的映射优先查本地缓存,再查 Redis,最后才落到数据库,而且可以用 302 临时重定向而不是 301 永久重定向,这样跳转请求还是会经过短链服务,方便做统计和更换目标地址,如果对性能要求更高愿意牺牲统计能力,可以用 301 让浏览器直接缓存跳转结果减少服务端压力。另外短码要考虑过期回收和防止恶意生成短链接刷爆存储的问题,可以加上频率限制和长度动态扩展机制。</p>\n<p><strong>记忆点：发号器生成保证唯一性，多级缓存+302支撑高并发跳转。</strong></p>"}, {"qnum": 6, "qtext": "设计一个消息推送系统需要考虑哪些核心问题？如何保证消息不丢不重、并且能推送给百万级在线用户？", "freq": "中频", "answerHtml": "<p>消息推送系统我会从连接管理、消息投递、可靠性保障三个维度来考虑。连接管理上,移动端一般是设备和服务端维持一条长连接,常用 TCP 长连接配合心跳保活,服务端需要用类似 Netty 这种高性能网络框架来支撑海量连接,单机能扛的连接数是有限的,所以要做好连接的水平分片,通过网关层把用户路由到具体持有其连接的推送节点上,这就需要一个连接状态的注册中心,记录用户当前连接在哪台机器上,通常用 Redis 存这个映射关系。</p>\n<p>消息投递上,如果目标用户在线,直接通过其所在的连接节点推送;如果不在线,消息要落库或者进离线消息队列,等用户上线的时候拉取补发,这就是常说的在线推、离线拉的混合模式。对于百万级别的广播场景,比如全站公告,不能一条条查用户在哪台机器,而是要用扇出的方式,把消息广播给所有推送节点,由每个节点自己判断哪些在线用户是自己负责的再推送下去。</p>\n<p>保证不丢不重这块,不丢主要靠消息落库加 ACK 机制,客户端收到消息后要给服务端一个确认,服务端没收到确认就重推,同时给每条消息一个唯一 ID 做去重,客户端和服务端都基于这个 ID 判断是否已经处理过,防止网络重试导致的重复投递。另外还要考虑消息的优先级和限流,避免推送风暴把客户端或者服务端压垮。</p>\n<p><strong>记忆点：在线推离线拉，唯一ID+ACK保证不丢不重。</strong></p>"}, {"qnum": 7, "qtext": "什么是接口幂等性？请举例说明几种常见的幂等性设计方案，各自的适用场景是什么？", "freq": "高频", "answerHtml": "<p>幂等性指的是同一个请求不管调用一次还是重复调用多次,产生的效果都是一样的,不会因为重复提交导致数据被多次修改,这个在网络不稳定容易超时重试、或者用户手滑重复点击提交按钮的场景下特别重要。</p>\n<p>最常见的方案是唯一索引,在数据库层面对业务唯一字段建唯一约束,比如订单表对外部流水号建唯一索引,重复插入直接抛异常被拦截,这个方案简单可靠,适合插入类操作。第二种是 token 机制,客户端在提交表单前先向服务端申请一个一次性 token,提交的时候带上这个 token,服务端用 Redis 存 token 并在处理时用 delete 或者 setnx 原子操作校验并消费掉,消费过的 token 第二次用就会被拒绝,这种适合表单提交类的防重复点击场景。</p>\n<p>第三种是状态机判断,比如订单状态只能从待支付流转到已支付,如果已经是已支付状态,再来一次支付回调,更新语句里带上状态条件,比如 update order set status=已支付 where id=? and status=待支付,发现更新行数是 0 就知道是重复请求,直接返回成功而不重复处理,这个方案很适合有明确状态流转的业务。第四种是乐观锁,通过版本号或者时间戳做 CAS 更新,主要解决的是并发更新导致的覆盖问题,和防重复提交的诉求略有区别但经常搭配使用。选择哪种方案主要看业务是新增还是更新,以及是否已经有天然的唯一键或者状态字段可以复用。</p>\n<p><strong>记忆点：唯一索引防重复插入，token机制防重复提交，状态机条件更新防重复处理。</strong></p>"}, {"qnum": 8, "qtext": "系统设计中经常提到的 CAP 理论和 BASE 理论分别说的是什么？在实际微服务架构里你是怎么权衡的？", "freq": "低频", "answerHtml": "<p>CAP 理论说的是在一个分布式系统里,一致性、可用性、分区容错性这三者不可能同时满足,最多只能同时满足两个。分区容错性在实际的分布式环境下是必须要接受的,网络分区、丢包、延迟都是常态,没法回避,所以真正要权衡的其实是在分区发生的时候,系统是选择保证一致性、拒绝服务,还是选择继续提供服务、牺牲一部分一致性,这就是 CP 和 AP 的取舍。像 ZooKeeper 这种协调服务更偏 CP,保证数据强一致,分区时宁可不可用,而像 Eureka 这种注册中心更偏 AP,宁可返回稍微过期的服务列表,也要保证注册发现功能一直可用。</p>\n<p>BASE 理论是对 CAP 里牺牲强一致性之后的一个补充和落地思路,它包括基本可用、软状态、最终一致性三个部分。基本可用是说系统在出现故障时可以损失部分可用性,比如响应变慢或者降级,但核心功能不能挂;软状态允许系统里存在中间状态,不要求所有节点数据实时同步;最终一致性是说经过一段时间的同步之后,数据最终能达到一致,不要求实时一致。</p>\n<p>在实际的微服务架构里,我通常对涉及资金、库存这种强一致性要求的场景倾向于用分布式事务或者同步校验的方式保证接近 CP 的效果,而对于像用户行为记录、消息通知、数据统计这类场景,更多采用消息队列加最终一致性的 BASE 思路,用异步补偿和对账机制来兜底,这样能在保证核心业务正确性的前提下,让系统整体的吞吐和可用性最大化。</p>\n<p><strong>记忆点：CAP讲权衡的取舍，BASE讲牺牲一致性之后怎么落地。</strong></p>"}, {"qnum": 9, "qtext": "设计一个\"本地缓存 + 分布式缓存 + 数据库\"的多级缓存架构，需要重点考虑哪些一致性问题？", "freq": "高频", "answerHtml": "<p>多级缓存的核心矛盾在于，读的时候是本地缓存优先命中，写的时候数据变更要同步到所有层级，中间存在时间差，这个时间差就是不一致的来源。先说最常见的场景：数据更新时该\"更新缓存\"还是\"删除缓存\"，业界公认应该删除而不是更新，因为更新缓存在并发写场景下很容易出现旧值覆盖新值的脏写问题，而删除之后让下次读请求自己去数据库加载，天然具备最终一致性的收敛能力。再看分布式缓存和数据库之间怎么保证顺序,主流做法是\"先更新数据库，再删除缓存\"，而不是先删缓存再更新库，因为先删缓存的话，删除和更新之间如果有其他线程读到旧数据又回写进缓存，就会造成缓存和数据库永久不一致，这也是经典的\"删缓存双删\"要解决的问题，通常做法是更新完数据库后立刻删一次缓存，延迟几百毫秒再删一次，把并发读造成的脏数据窗口关掉。</p>\n<p>本地缓存这一层麻烦在于它是进程内的，天然是多副本，某个节点更新了分布式缓存，其他节点的本地缓存并不知道，这时候需要一个失效广播机制，常见方案是用消息队列或者 Redis 的发布订阅，写请求发生后广播一条失效消息，各节点订阅到之后主动清除本地缓存对应的 key。另外本地缓存一般会给一个比分布式缓存更短的 TTL，用主动过期兜底广播丢失的情况。最后还要考虑缓存穿透、击穿、雪崩这些老问题在多级架构里会被放大，比如本地缓存没命中会把压力传导到分布式缓存，分布式缓存也没命中才会打到数据库，所以每一层都要有自己的保护手段，比如空值缓存、互斥锁重建、TTL 加随机数打散。</p>\n<p><strong>记忆点：多级缓存靠\"删除+失效广播+短TTL兜底\"三件套换取最终一致性，不追求强一致。</strong></p>"}, {"qnum": 10, "qtext": "设计一个通用的 API 限流系统，网关层和应用层应该怎么配合？", "freq": "高频", "answerHtml": "<p>限流不能只在一层做，因为网关层和应用层解决的问题不一样。网关层部署在流量入口，它的限流目标是保护整个集群不被打垮，通常基于 IP、用户、接口维度做粗粒度的全局限流，算法上一般用令牌桶或者滑动窗口，因为网关是无状态水平扩展的，所以全局计数要依赖一个共享存储，比如用 Redis + Lua 脚本做原子的令牌桶实现，保证多个网关节点看到的是同一份计数。网关层限流的好处是拦截得早，恶意流量和超量请求根本不会打到后端服务，节省了内部资源。</p>\n<p>应用层限流则更关注单个服务、单个资源的保护，颗粒度可以细到某个具体接口、某个下游依赖，甚至是线程池和连接池级别的隔离，这一层常见做法是结合 Sentinel 或者 Resilience4j 这类框架，做基于 QPS、并发线程数、系统负载的自适应限流，还可以加熔断和降级联动，一旦下游异常比例升高就自动切断部分流量。两层配合的关键是限流阈值要有梯度，网关层的阈值应该比应用层集群总容量宽松一些，避免网关层过度拦截导致资源浪费，而应用层的阈值要贴近单机真实承载能力。另外限流之后一定要有友好降级，比如返回排队提示或者兜底数据，而不是直接扔一个生硬的错误码，同时限流的规则要能动态下发，不能写死在代码里，一般会接一个配置中心实时推送阈值变更。</p>\n<p><strong>记忆点：网关层管全局流量入口，应用层管单机资源隔离，规则要能动态调整。</strong></p>"}, {"qnum": 11, "qtext": "设计一个统一日志收集与检索系统，关键环节有哪些？", "freq": "中频", "answerHtml": "<p>整个链路可以按\"采集-传输-处理-存储-检索\"这条线来想。采集端一般不建议应用直接写网络请求把日志发出去，而是先落本地磁盘，再用一个轻量级的采集 agent，比如 Filebeat，去 tail 日志文件，这样即使日志系统本身出故障，应用也不会因为日志阻塞而受影响，这是很多人容易忽略的解耦点。传输环节通常会在采集端和处理端之间加一层消息队列，比如 Kafka，起到削峰填谷的作用，因为日志量往往有明显的波峰波谷，直接写入 Elasticsearch 容易在高峰期把集群写挂。</p>\n<p>处理环节要做结构化，原始日志大多是文本行，需要通过 Logstash 或者自研的日志处理服务解析成结构化字段，同时要注意统一 traceId，这样才能把一次请求在多个微服务里产生的日志串联起来做全链路排查，这个 traceId 一般是在网关层生成，通过 MDC 或者请求头透传到下游所有服务。存储环节要考虑冷热分离，最近几天的日志用 SSD 支撑高频检索，历史日志可以转存到成本更低的存储，并设置生命周期自动归档或删除。检索环节除了全文检索，还要支持按服务、按时间、按 traceId、按日志级别的组合过滤，同时要控制好索引的分片和副本数量，避免索引过多导致集群元数据压力过大。最后别忘了监控日志系统自身的健康度，比如采集延迟、队列积压、写入失败率，日志系统本身故障往往是最容易被忽视的盲区。</p>\n<p><strong>记忆点：采集要解耦、传输要削峰、traceId 要全链路透传、存储要冷热分离。</strong></p>"}, {"qnum": 12, "qtext": "设计一个支持分片上传和断点续传的大文件上传系统，需要解决哪些核心问题？", "freq": "中频", "answerHtml": "<p>第一个要解决的是文件切分和唯一标识问题，前端把大文件按固定大小切成若干分片，比如每片 5MB，同时要给整个文件算一个唯一标识，常见做法是取文件内容的 hash 或者结合文件名、大小、最后修改时间做摘要，这个标识用来判断服务端是否已经存在这个文件，也就是常说的秒传，如果服务端已经有完整文件了就直接返回成功，不用再传。第二个问题是分片的上传状态要持久化记录，服务端需要维护一张分片上传记录表，记录每个文件标识下哪些分片编号已经上传成功，客户端在续传前先查询这个状态，只补传缺失的分片，而不是重新上传整个文件，这个记录可以放数据库也可以放 Redis，取决于并发量和查询频率。</p>\n<p>第三个问题是分片合并的时机和一致性，等所有分片都上传完成后，服务端要按编号顺序把分片合并成完整文件，这一步要注意合并过程中要校验分片数量和每片的 md5，防止网络传输过程中出现损坏的分片导致合并出来的文件是坏的。第四个是并发和资源问题，分片可以并行上传来提升速度，但服务端要控制单用户的并发分片数，避免瞬间打满带宽或者磁盘 IO，同时未完成的临时分片要设置过期清理机制，防止长期占用存储空间。最后如果是分布式部署，多个上传节点之间要保证同一个文件的分片能路由到同一批可以互相访问的存储，通常做法是用对象存储的分片上传能力，比如 S3 或者 OSS 原生支持的 multipart upload，这样可以省掉自己维护合并逻辑的复杂度。</p>\n<p><strong>记忆点：秒传靠文件指纹，断点续传靠分片状态表，合并靠顺序+校验。</strong></p>"}, {"qnum": 13, "qtext": "设计一个抽奖系统，需要重点防范哪些问题？", "freq": "中频", "answerHtml": "<p>首先是超发问题，也就是奖品库存被超卖，这本质上和电商秒杀的库存扣减是同一类问题，解决思路也类似，用数据库的乐观锁配合库存字段做 CAS 更新，或者用 Redis 的原子递减操作前置做库存预扣，扣减成功才允许进入中奖流程，失败就直接判定为未中奖，绝对不能先判断库存再扣减，这种非原子操作在高并发下必然导致超发。其次是刷奖问题，就是同一个用户通过脚本或者小号反复抽奖，这需要在参与资格上做限制，比如基于用户身份加上时间窗口做频次限制，结合验证码或者设备指纹识别异常流量，另外抽奖记录要做幂等校验，防止同一次请求由于网络重试被处理多次导致重复中奖。</p>\n<p>第三个是并发一致性问题，大量用户同一时刻发起抽奖请求，如果中奖概率计算和库存扣减不是同一个原子操作，就会出现并发穿透，比较稳妥的做法是把\"判断概率、扣减库存、生成中奖记录\"这几步收敛到一个 Lua 脚本里在 Redis 端原子执行，或者用数据库行级锁配合事务保证串行化，但要注意行锁不能锁得太粗，否则会成为性能瓶颈，一般按奖品维度而不是活动维度加锁。第四个容易被忽视的是概率的公平性和可审计性，中奖结果要能事后追溯，抽奖算法和随机数种子最好有留痕，避免被质疑暗箱操作，同时奖品发放要和抽奖判定解耦，判定成功只是生成一条待发放记录，真正的发货或者卡券发放走异步流程，避免抽奖接口因为下游发放系统慢而被拖垮。</p>\n<p><strong>记忆点：超发靠原子扣减，刷奖靠频次+设备识别，并发一致性靠原子脚本或细粒度锁。</strong></p>"}, {"qnum": 14, "qtext": "Feed 流系统里推模式（写扩散）和拉模式（读扩散）该怎么权衡？", "freq": "高频", "answerHtml": "<p>推模式是指用户发布内容的时候，系统主动把这条内容写入所有粉丝的收件箱列表里，读的时候粉丝直接读自己的收件箱，不需要临时聚合，所以推模式的优点是读请求非常快，因为数据已经提前准备好了，适合粉丝数不太多、发布频率也不算特别高的场景，比如普通社交产品里大多数用户的场景。它的问题在于如果某个用户粉丝量特别大，一次发布就要写几百万份收件箱记录，这个写扩散的成本会非常高，也就是常说的大 V 问题。</p>\n<p>拉模式正好相反，发布内容只写一份到作者自己的发件箱，粉丝要看 Feed 流的时候，系统实时去拉取这个人关注的所有人的发件箱内容，再做聚合排序，写的成本很低，但读的成本很高，因为每次刷新都要做一次多路归并，关注的人越多读延迟越高。所以实际系统基本都不会单选一种模式，而是做混合方案，普通用户走推模式保证读的低延迟，超级大 V 账号走拉模式避免写扩散爆炸，用户刷 Feed 的时候把收件箱里推送过来的内容和实时拉取的大 V 内容做一次合并。另外还要考虑消息的时效性和存储成本，收件箱模式通常只保留最近一段时间或者一定条数的数据，配合分页游标做增量加载，而不是无限制地为每个用户维护全量历史。</p>\n<p><strong>记忆点：小 V 推、大 V 拉，读写扩散混合是工业界标准解法。</strong></p>"}]}, {"name": "网络、操作系统与工程实践", "questions": [{"qnum": 1, "qtext": "说一下 TCP 三次握手和四次挥手的具体过程，为什么建立连接是三次而断开连接需要四次？", "freq": "高频", "answerHtml": "<p>三次握手的过程是这样的,客户端先发一个 SYN 报文,带上自己的初始序列号,进入 SYN_SENT 状态;服务端收到之后回一个 SYN+ACK,既确认客户端的 SYN,也带上自己的初始序列号,进入 SYN_RCVD 状态;客户端收到后再回一个 ACK,确认服务端的 SYN,这时候客户端进入 ESTABLISHED 状态,服务端收到这个 ACK 之后也进入 ESTABLISHED,连接正式建立。</p>\n<p>为什么是三次而不是两次,核心原因是要防止历史失效的连接请求突然又到达服务端,导致服务端误以为客户端要建立新连接,从而一直等待打开资源造成浪费。两次握手只能保证服务端确认了客户端的发送能力和自己的接收能力,但客户端没法确认服务端的接收能力和发送能力是否都正常,必须要有第三次握手客户端的 ACK,才能让双方都确认彼此的收发能力都没问题。</p>\n<p>四次挥手是因为 TCP 是全双工的,断开连接需要双方各自关闭自己这一侧的发送通道。主动关闭方发 FIN,表示自己没有数据要发了,但还能接收数据,对方收到后回 ACK,此时连接处于半关闭状态;等被动关闭方也没有数据要发的时候,再发一个 FIN,主动方收到后回 ACK 并进入 TIME_WAIT状态,等待两倍的报文最大生存时间之后才真正关闭,这个等待是为了确保最后这个 ACK 万一丢失,对方重发 FIN 时自己还能响应,同时也让网络里滞留的旧报文段自然消亡。中间的 ACK 和 FIN 没法合并成一次,是因为被动关闭方收到 FIN 时可能还有数据没发完,不能立刻关闭。</p>\n<p><strong>记忆点：三次握手确认双方收发能力，四次挥手是因为全双工需要双向各自关闭。</strong></p>"}, {"qnum": 2, "qtext": "HTTP 和 HTTPS 的区别是什么？HTTPS 是怎么通过非对称加密和对称加密结合来保证安全的？", "freq": "高频", "answerHtml": "<p>HTTP 是明文传输的应用层协议,数据在网络上传输的时候可以被任何中间节点截获和篡改,没有身份认证机制,没法确认对方服务器是不是真的。HTTPS 是在 HTTP 和 TCP 之间加了一层 TLS/SSL,提供了三个能力,一是加密防止内容被窃听,二是完整性校验防止内容被篡改,三是身份认证,通过证书确认服务端身份的真实性,默认端口也从 80 变成了 443。</p>\n<p>具体到 TLS 握手的过程,一开始客户端和服务端要先确定用什么加密套件,服务端把自己的数字证书发给客户端,证书里包含了服务端的公钥,客户端会用本地信任的 CA 根证书链去验证这个证书是不是权威机构签发的、没有被篡改、也没有过期。验证通过之后,客户端生成一个随机数作为预主密钥,用服务端证书里的公钥把这个预主密钥加密后发给服务端,这一步用的是非对称加密,只有持有对应私钥的服务端才能解密拿到这个预主密钥,中间窃听者即使截获了也解不开。双方各自根据这个预主密钥推导出后续通信真正用的对称密钥。</p>\n<p>之所以握手阶段用非对称加密,后续正式传输数据阶段用对称加密,是因为非对称加密计算开销大,不适合大量数据的加解密,而对称加密速度快但密钥没法直接明文传输,所以非对称加密在这里只负责安全地协商出一份对称密钥,之后大批量的数据传输都走对称加密,这样兼顾了安全性和性能。TLS 1.3 相比 TLS 1.2 进一步简化了握手过程,把两次往返减少到一次,减少了建连延迟。</p>\n<p><strong>记忆点：非对称加密用来安全协商密钥，对称加密用来实际传输数据。</strong></p>"}, {"qnum": 3, "qtext": "讲一下 BIO、NIO 和多路复用的区别，select、poll、epoll 又有什么区别？", "freq": "高频", "answerHtml": "<p>BIO 是同步阻塞模型,每来一个连接就要分配一个线程去处理,这个线程在读写数据的时候会一直阻塞在那,直到数据准备好或者发送完成才能返回。这种模型编程简单,但连接数一多,线程数跟着暴涨,线程本身的创建销毁和上下文切换开销会成为瓶颈,所以只适合连接数不多的场景。</p>\n<p>NIO 是同步非阻塞模型,读写操作不会阻塞线程,读不到数据会立刻返回一个标志告诉你现在没数据,应用层可以用一个线程去轮询多个连接看看哪个准备好了,这样理论上一个线程能应对多个连接,但轮询本身如果是应用层自己一个个去问,当连接数很多的时候会浪费大量 CPU 在无意义的轮询上。</p>\n<p>多路复用是在 NIO 基础上把这个轮询的工作交给操作系统内核来做,应用只需要把关心的一批文件描述符注册给内核,调用一次系统调用就能知道这批里面哪些已经就绪,不用自己一个个去问。select 是最早的实现,它有几个明显的局限,一是能监听的文件描述符数量有限制,受 FD_SETSIZE 限制通常是1024,二是每次调用都要把整个描述符集合从用户态拷贝到内核态,三是返回之后应用层还要遍历整个集合才能知道哪些就绪,时间复杂度是 O(n)。poll 和 select 原理类似,但用链表结构去掉了数量限制,不过拷贝和遍历的开销依然存在。</p>\n<p>epoll 是 Linux 下真正解决这些问题的方案,它把描述符注册这个动作和等待事件这个动作拆开,注册只需要做一次,内核会用红黑树管理这些描述符,当某个描述符就绪的时候通过回调机制放到一个就绪链表里,应用调用 epoll_wait 只需要拿这个就绪列表,不需要遍历全部描述符,也不需要重复拷贝整个集合,所以epoll 在连接数很大但活跃连接数相对较少的场景下性能优势非常明显,这也是 Netty、Redis 这些高性能中间件底层依赖 epoll 的原因。</p>\n<p><strong>记忆点：select/poll 需要遍历全量，epoll 靠回调只关心就绪的那部分。</strong></p>"}, {"qnum": 4, "qtext": "生产环境线上服务突然 CPU 飙高，你会用哪些 Linux 命令一步步排查？", "freq": "高频", "answerHtml": "<p>我一般会按照从宏观到微观、从系统到进程到线程的顺序排查。第一步用 top 或者更细致的 htop 看整体情况,确认是不是真的是某个 Java 进程把 CPU 打满了,同时看一下是用户态 us 占比高还是系统态 sy 占比高,如果 sy 很高可能是频繁的系统调用或者上下文切换导致的,这时候可以再用 vmstat 1 看一眼 context switch 的数值和 CPU 各项占比的变化趋势,确认是不是有异常的切换频率。</p>\n<p>确认是具体某个 Java 进程之后,用 top -Hp &lt;pid&gt; 找到这个进程里 CPU 占用最高的具体线程 ID,记下来,这个线程 ID 是十进制的,要转成十六进制,因为 jstack 打印出来的线程栈里线程 ID 是十六进制。然后执行 jstack &lt;pid&gt; 把该进程的所有线程栈信息导出来,通过转换后的十六进制线程 ID 去搜索对应的堆栈,就能定位到具体是哪段代码在跑,常见的原因是死循环、正则回溯、频繁的 GC,或者不合理的锁竞争导致的自旋。</p>\n<p>如果怀疑是 GC 问题,会用 jstat -gcutil &lt;pid&gt; 1000 持续观察 GC 频率和各个区的使用率,看看是不是 Full GC 过于频繁。如果是网络相关的问题,比如怀疑丢包重传导致 CPU 异常,会用 tcpdump 抓包分析,比如 tcpdump -i eth0 port 8080 -w capture.pcap 抓下来之后用 Wireshark 分析,或者用 netstat -antp 或者 ss -antp 看连接状态的分布,确认是不是大量连接堆积在某个异常状态。整个排查思路就是先定位到进程,再定位到线程,再定位到具体代码,系统层面的信号和应用层面的堆栈要结合起来看。</p>\n<p><strong>记忆点：top定位进程和线程，jstack对照堆栈，vmstat/tcpdump看系统和网络层面的佐证。</strong></p>"}, {"qnum": 5, "qtext": "线上服务经常出现 Full GC 频繁或者内存持续增长疑似内存泄漏，你会怎么排查？", "freq": "中频", "answerHtml": "<p>先看现象再定手段。如果只是 Full GC 频繁但内存最终能回落,大概率是新生代设置过小导致对象过早晋升到老年代,或者是有短时间的大对象/大批量对象分配,这种情况我会先用 jstat -gcutil &lt;pid&gt; 1000 持续观察,看 young gc 和 full gc 的频率、老年代和元空间的使用率变化趋势,如果发现每次 young gc 后老年代都涨一截,说明存在过早晋升的问题,可以考虑调大新生代或者调整晋升阈值。</p>\n<p>如果是内存持续增长不回落,怀疑真正的内存泄漏,这时候需要 dump 内存快照分析,用 jmap -dump:format=b,file=heap.hprof &lt;pid&gt; 把堆快照导出来,注意这个操作在导出瞬间会触发 Full GC 并且可能造成短暂停顿,生产环境要谨慎在低峰期操作,或者用 jmap -histo 先快速看一下存活对象里哪些类的实例数量和占用空间异常。拿到 hprof 文件之后用 MAT 或者 JProfiler 打开,重点看支配树,找到占用内存最大的对象,顺着它的 GC Roots 引用链往上找,通常泄漏的原因是静态集合类不断被添加元素却没有清理、监听器或者回调没有被正确注销、ThreadLocal 使用后没有 remove、或者是缓存没有设置过期淘汰策略。</p>\n<p>如果没法直接 dump 生产环境的快照,也可以先用 jcmd &lt;pid&gt; GC.class_histogram 快速看类实例分布做个初步判断,或者开启 -XX:+HeapDumpOnOutOfMemoryError 提前埋好,一旦真的 OOM 能自动留下现场,再离线分析,而不是干等着下一次复现。</p>\n<p><strong>记忆点：先用jstat看趋势区分是配置问题还是真泄漏，再用jmap+MAT顺着引用链定位根因。</strong></p>"}, {"qnum": 6, "qtext": "Docker 和虚拟机有什么本质区别？Docker 里镜像、容器、仓库这几个概念分别是什么？", "freq": "中频", "answerHtml": "<p>本质区别在于隔离的层级不一样。虚拟机是通过 Hypervisor 虚拟化出一整套硬件,每个虚拟机里都要跑一个完整的操作系统内核,所以虚拟机启动慢,占用资源多,但隔离性非常彻底,不同虚拟机之间几乎完全独立。Docker 容器是操作系统层面的虚拟化,所有容器共享宿主机同一个内核,容器本身只是一个被隔离出来的进程,通过 Linux 的 namespace 做资源视图的隔离,比如 PID、网络、挂载点各自看到的都是独立的一套,再通过 cgroup 做资源使用量的限制,比如限制某个容器最多用多少 CPU 和内存。因为不需要启动单独的内核,容器启动是秒级的,资源开销也小得多,可以在同一台机器上跑更高密度的应用,但因为共享内核,隔离性理论上不如虚拟机彻底。</p>\n<p>镜像可以理解成一个只读的模板,里面打包了应用运行所需要的代码、依赖库、运行时环境和配置,镜像是分层的,每一层对应 Dockerfile 里的一条指令,层与层之间可以复用,这也是为什么基础镜像相同的多个应用镜像可以共享底层,节省存储空间。容器是镜像的一个运行实例,在只读镜像的基础上加了一层可写层,你在容器里做的任何文件改动都发生在这个可写层,不会影响到原始镜像,可以从同一个镜像启动出很多个相互独立的容器。仓库则是用来存放和分发镜像的地方,比如 Docker Hub 是公共仓库,企业内部通常会搭建私有仓库比如 Harbor,通过 push 和 pull 把镜像上传下载,配合镜像的 tag 做版本管理。</p>\n<p><strong>记忆点：虚拟机隔离硬件带内核，容器基于namespace/cgroup共享内核隔离进程。</strong></p>"}, {"qnum": 7, "qtext": "简单说说 Kubernetes 里 Pod、Deployment、Service 这几个核心概念的作用，它们是怎么配合工作的？", "freq": "中频", "answerHtml": "<p>Pod 是 K8s 里最小的调度单位,不是容器本身,而是一个或多个容器的集合,这些容器共享同一个网络命名空间和存储卷,彼此之间可以通过 localhost 直接通信,通常一个 Pod 里放一个主容器加一些辅助的 sidecar 容器,比如日志采集或者服务网格的代理。Pod 本身是不稳定的,可能因为节点故障或者调度策略被随时销毁重建,重建之后 IP 地址会变,所以不能依赖 Pod 的 IP 做服务发现。</p>\n<p>Deployment 是用来管理 Pod 生命周期的更高层抽象,你在 Deployment 里声明想要的 Pod 模板和副本数量,Deployment Controller 会持续对比期望状态和实际状态,如果发现 Pod 少了会自动补齐,多了会自动删除,这就是声明式的自愈能力。发布新版本的时候,Deployment 还负责滚动更新,按照设定的策略逐步用新版本的 Pod 替换旧版本的 Pod,期间保证有足够的可用副本对外提供服务,出问题了也能一键回滚到上一个版本。</p>\n<p>Service 解决的是 Pod 不稳定、IP 会变化这个问题,它提供了一个固定的虚拟 IP 和 DNS 名称,通过标签选择器动态关联一组符合条件的 Pod,请求打到 Service 上会被自动负载均衡转发到后面某个健康的 Pod,不管 Pod 怎么重建、IP怎么变,Service 这个访问入口始终是稳定的。三者配合起来的典型流程是,Deployment 负责维持一批 Pod 始终按照期望状态运行并支持滚动升级,Service 负责给这批动态变化的 Pod 提供一个稳定的访问入口,外部流量或者集群内部其它服务只需要认准 Service,不需要关心具体是哪个 Pod 在响应。</p>\n<p><strong>记忆点：Pod是运行实例，Deployment管生命周期和发布，Service管稳定访问入口。</strong></p>"}, {"qnum": 8, "qtext": "可观测性里常说的日志、监控、链路追踪这三大支柱各自解决什么问题？在微服务架构里怎么把它们串联起来定位一次线上问题？", "freq": "低频", "answerHtml": "<p>日志解决的是\"发生了什么\"这个问题,记录的是某个时间点某个节点上发生的具体事件,粒度最细,信息量最大,但缺点是分散在各个服务各个实例上,单看一条日志很难还原全貌,通常需要 ELK 或者类似的方案把日志集中采集、存储、索引,方便后续检索。</p>\n<p>监控解决的是\"系统现在状态怎么样\"这个问题,一般是把系统运行时的各种指标,比如 QPS、响应时间、错误率、CPU 内存使用率,按时间序列采集下来,存到时序数据库比如 Prometheus,再配合 Grafana 做可视化和告警,监控更侧重宏观趋势和异常发现,能告诉你现在有问题,但通常没法直接告诉你问题出在哪一行代码或者哪次调用。</p>\n<p>链路追踪解决的是\"一次请求经过了哪些服务、每一跳耗时多少\"这个问题,在微服务架构下一次用户请求可能会穿越十几个服务,链路追踪通过给每个请求生成一个全局唯一的 traceId,并在服务间调用时把这个 traceId 一直透传下去,同时给每一次跨服务调用生成一个 spanId 记录父子关系和耗时,最终能拼出一张完整的调用拓扑图,常见的实现比如基于 OpenTelemetry 规范落地的 SkyWalking 或者 Zipkin。</p>\n<p>三者串联起来定位问题的典型流程是,先通过监控发现某个接口错误率或者响应时间异常,告警触发;然后通过链路追踪系统,按时间范围和接口名筛选出异常的调用链,定位到具体是哪一个下游服务或者哪一跳耗时突然变长;最后拿着这条链路上的 traceId,去日志系统里检索出该 traceId 关联的所有详细日志,看具体的异常堆栈或者业务日志,还原出问题的根因。所以这三者不是互相替代,而是从宏观发现问题、到中观定位环节、再到微观还原细节这样一个逐步收敛的排查链条。</p>\n<p><strong>记忆点：监控发现异常,链路追踪定位环节,日志还原细节,三者靠traceId串联。</strong></p>"}, {"qnum": 9, "qtext": "常见的负载均衡算法有哪些，各自适用什么场景？", "freq": "高频", "answerHtml": "<p>先说轮询，这是最简单的算法，请求按顺序依次分发到每个节点，实现简单，但它有个前提假设，就是所有节点处理能力是均等的，如果集群里机器配置不一样，轮询就会让性能差的机器和性能好的机器承担同样的流量，容易造成资源使用不均衡。为了解决这个问题就有了加权轮询，给每个节点配置一个权重，权重高的节点分到更多请求，这个权重通常根据机器的 CPU、内存配置或者实际压测结果来设定，比较适合异构集群。</p>\n<p>再看最少连接数算法，它不是简单按顺序分发，而是实时统计每个节点当前正在处理的连接数，把新请求分给连接数最少的那个节点，这种算法更适合请求处理时间差异比较大的场景，比如有的请求是简单查询，有的是复杂的批处理，用轮询容易导致某些机器堆积大量慢请求，而最少连接数能动态地把压力导向更空闲的节点。最后是一致性哈希，它和前面几种目的不太一样，前面几种主要追求负载的均匀分布，一致性哈希追求的是同一个 key 稳定地落到同一个节点，这对于需要会话保持或者本地缓存命中率的场景非常关键，比如网关做用户会话路由，或者分布式缓存做数据分片，它的好处是当节点数量变化时，只有少部分 key 的路由关系会变化，不会像普通哈希取模那样引发大规模数据迁移，实际实现上通常还会引入虚拟节点，来让数据分布更均匀，避免物理节点少的时候出现哈希倾斜。</p>\n<p><strong>记忆点：轮询求简单，加权轮询求配比，最少连接求动态均衡，一致性哈希求稳定路由。</strong></p>"}, {"qnum": 10, "qtext": "CDN 的工作原理是什么，回源机制是怎么设计的？", "freq": "中频", "answerHtml": "<p>CDN 的核心思路是把内容缓存到离用户地理位置更近的边缘节点，减少用户请求要跨越的网络距离，从而降低延迟并且减轻源站压力。用户发起请求的时候，首先经过智能 DNS 解析或者 Anycast 路由，被引导到离用户最近或者网络质量最好的边缘节点，而不是直接打到源站。边缘节点收到请求后，先看本地是否已经缓存了这份内容，如果命中就直接返回给用户，这个过程完全不需要经过源站，这是 CDN 能大幅提升性能的关键。</p>\n<p>如果边缘节点没有缓存，或者缓存已经过期，就会触发回源，也就是边缘节点代替用户向源站发起一次请求，把内容拉取回来，一边缓存一边返回给用户。这里有几个细节值得注意，一是回源要做合并，如果同一时间有大量用户请求同一份还没缓存的内容，边缘节点不能每个请求都单独回源，否则源站瞬间被打爆，通常做法是让第一个请求触发回源，其余请求排队等待这次回源结果，这个叫回源合并或者请求合并。二是缓存的失效策略，内容需要设置合理的 TTL，配合源站返回的 Cache-Control、ETag、Last-Modified 这些头部信息，判断内容是否需要重新拉取，还是可以用 304 直接确认缓存仍然有效。三是对于动态内容或者不适合缓存的接口，CDN 通常会配置成直接透传到源站，不做缓存，这类场景 CDN 主要起到链路加速和防护的作用，而不是内容分发的作用。另外源站这边一般还会配置多层回源，边缘节点先回源到区域节点，区域节点再回源到源站，减少直接打到源站的请求量。</p>\n<p><strong>记忆点：就近命中减少延迟，回源合并保护源站，缓存头部决定是否重新拉取。</strong></p>"}, {"qnum": 11, "qtext": "301、302、304、401、403 这几个 HTTP 状态码分别代表什么，实际使用场景是什么？", "freq": "高频", "answerHtml": "<p>301 和 302 都是重定向，但语义完全不同，301 表示资源被永久移动到新地址，浏览器和搜索引擎收到 301 后会记住新地址，以后直接访问新地址，甚至会更新收藏夹和搜索引擎索引，常见场景是域名迁移、HTTP 强制跳转 HTTPS、旧接口永久废弃指向新接口。302 表示资源只是临时被转移，客户端不应该缓存这个跳转关系，下次还是要重新请求原地址确认，常见场景是登录后临时跳转到首页、A/B 测试临时分流到不同页面，如果把本该用 302 的场景写成 301，最麻烦的后果是浏览器和 CDN 会把跳转关系缓存死，之后想改都很难生效，这是实际项目里很容易踩的坑。</p>\n<p>304 表示资源未修改，客户端可以继续使用本地缓存，这个状态码是配合协商缓存机制工作的，客户端发请求的时候带上 If-None-Match 或者 If-Modified-Since 头，服务端比对资源的 ETag 或者最后修改时间，如果没变化就返回 304，不返回实际内容，只返回响应头，这样能省掉大量不必要的数据传输。401 表示未认证，也就是请求没有提供有效的身份凭证，或者凭证已经失效，正确的处理是引导用户重新登录，常见于 token 过期的场景。403 表示已经认证过，但是没有权限访问这个资源，这是和 401 最容易混淆的地方，简单区分就是 401 是\"你还没证明自己是谁\"，403 是\"我知道你是谁，但你不能看这个\"，实际系统设计里要严格区分这两者，不能笼统地都返回 403，否则前端没法判断该跳转登录页还是该提示权限不足。</p>\n<p><strong>记忆点：301永久302临时，304省流量，401没登录403没权限。</strong></p>"}, {"qnum": 12, "qtext": "Java 应用的健康检查和优雅停机应该怎么实现？", "freq": "高频", "answerHtml": "<p>健康检查一般要分层设计，最基础的是存活探针，只判断进程是否还在运行、端口是否还在监听，这个检查要足够轻量，不能依赖外部资源，避免因为下游抖动就把一个本身健康的实例误判为死掉。更进一步是就绪探针，除了进程存活，还要检查应用依赖的数据库连接、缓存连接、消息队列连接是否正常，只有这些依赖都就绪，才允许流量打进来，这个通常配合 Spring Boot Actuator 的 health 端点，自定义 HealthIndicator 去检查各个依赖组件的状态，编排系统比如 Kubernetes 会根据就绪探针的结果决定是否把这个 Pod 加入到 Service 的负载均衡列表里。</p>\n<p>优雅停机要解决的问题是，进程收到停止信号的瞬间，可能还有正在处理中的请求，如果直接粗暴杀掉进程，这些请求就会被截断返回错误。正确的流程是先从注册中心或者负载均衡列表里摘除自己，让新流量不再进来，然后等待一段时间让正在处理的请求处理完，最后再真正关闭进程。Spring Boot 里可以通过监听 ContextClosedEvent 或者实现 SmartLifecycle 接口，在收到 SIGTERM 信号时先标记健康检查为不健康状态，再调用线程池的 shutdown 方法拒绝新任务但等待已提交任务完成，配合 awaitTermination 设置一个超时时间兜底：</p>\n<pre><code>@Bean\npublic GracefulShutdown gracefulShutdown() {\n    return new GracefulShutdown();\n}\n// executor.shutdown();\n// executor.awaitTermination(30, TimeUnit.SECONDS);</code></pre>\n<p>另外要注意容器编排层面，Kubernetes 发送 SIGTERM 之后有一个 terminationGracePeriodSeconds，这个时间要设置得比应用内部优雅停机的耗时略长，同时最好在真正关闭连接前加一个小的 sleep，给负载均衡摘除节点留出传播时间，否则会出现进程已经开始拒绝连接、但流量还没摘干净的短暂错误窗口。</p>\n<p><strong>记忆点：存活看进程，就绪看依赖，优雅停机先摘流量再等请求处理完再关。</strong></p>"}, {"qnum": 13, "qtext": "灰度发布和蓝绿部署有什么区别，各自适合什么场景？", "freq": "中频", "answerHtml": "<p>蓝绿部署是准备两套完全独立的生产环境，蓝色是当前在跑的旧版本，绿色是新版本，新版本先在绿色环境里部署完成并做完整验证，验证通过之后，通过切换负载均衡或者路由规则，把全部流量一次性从蓝切到绿，如果发现问题可以立刻切回蓝环境，回滚速度非常快，因为旧环境完好无损地保留着。它的代价是需要两倍的资源
