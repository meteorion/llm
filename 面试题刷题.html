。</p><p>真正影响输出质量的，是<strong>任务本身有没有被讲清楚</strong>：</p><pre><code>模糊：&quot;请务必认真仔细地分析这条反馈&quot;\n清晰：&quot;紧急程度判断标准：涉及资金损失或安全问题 = 5，影响使用但有替代方案 = 3，纯咨询 = 1&quot;</code></pre><p>四类优化手段（角色设定、目标声明、Few-shot、输出限制）本质上都是把原本模糊、依赖常识和经验的判断标准，用文字显式表达出来，让模型有明确依据可以对齐——这是&quot;消除歧义&quot;，而不是&quot;讨好&quot;或&quot;激励&quot;模型。</p>"},{"qnum":3,"qtext":"准确率和稳定性是一回事吗？如何分别量化这两个指标？","answerHtml":"<p>不是一回事，两者是独立的评估维度：</p><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>定义</th><th>衡量方式</th></tr></thead><tbody><tr><td>准确率（Accuracy）</td><td>模型输出和人工标注正确答案的一致程度</td><td>多数投票结果 == expected 的比例</td></tr><tr><td>稳定性（Stability）</td><td>同一条输入多次调用，结果是否一致</td><td>多次运行结果完全相同的比例</td></tr></tbody></table></div><p>一个 Prompt 可能&quot;稳定地错&quot;（每次调用结果一样，但都是错的，说明判断标准本身有偏差）；也可能&quot;偶尔蒙对&quot;（多次结果不一致，但多数投票恰好正确，说明单次调用不可靠）。量化方法：</p><pre><code class=\"language-python\">def evaluate_prompt(prompt_fn, test_set, n_runs=3):\n    for item in test_set:\n        runs = [call_llm(prompt_fn(item[&quot;text&quot;])) for _ in range(n_runs)]\n        most_common = max(set(runs), key=runs.count)\n        is_stable = len(set(runs)) == 1        # 稳定性：多次结果是否完全一致\n        is_correct = most_common == item[&quot;expected&quot;]   # 准确率：多数投票是否正确</code></pre><p>两者按&quot;稳定性 × 准确率&quot;划成四象限：高稳定+高准确是理想状态可直接上线；高稳定+低准确说明判断标准本身有偏差需要重新设计规则；低稳定则无论准确率高低都不可靠，需要提高约束强度。</p>"},{"qnum":4,"qtext":"如何判断一次 Prompt \"优化\"是真的提升了效果，还是恰好在测试集上蒙对了？","answerHtml":"<p>陷阱场景：用几条固定的测试数据反复调整 Prompt，直到这几条全部命中就认为优化成功——但这些数据的措辞、边界情况很可能被&quot;针对性&quot;覆盖了，换一批新数据准确率可能骤降，这叫<strong>对测试集过拟合</strong>。</p><p>正确做法：</p><ul><li>测试集要有一定规模（至少 15-20 条）且覆盖不同难度</li><li>把数据划分为<strong>开发集</strong>（迭代 Prompt 时反复使用）和<strong>留出集</strong>（从不参与调优，只在 Prompt 定稿后跑一次）</li><li>对比开发集和留出集的表现：如果留出集准确率明显低于开发集（比如开发集 90%、留出集 60%），说明前面的&quot;优化&quot;很可能只是针对开发集几条数据的措辞做了过度适配，而不是抓住了任务的通用判断标准</li></ul><pre><code class=\"language-python\">DEV_SET = TEST_SET[:5]      # 迭代阶段只看这部分\nHOLDOUT_SET = TEST_SET[5:]  # 定稿后只跑一次，代表真实预期表现</code></pre>"},{"qnum":5,"qtext":"如何从零设计一套可复现的 Prompt 版本对比实验？","answerHtml":"<p>核心设计原则：<strong>递进式版本设计（便于归因）+ 双维度量化（准确率、稳定性）+ 开发集/留出集分离（防止过拟合）</strong>。</p><pre><code class=\"language-python\">def prompt_v1(text):   # 对照组：只有目标声明 + 输出限制\n    return f&quot;判断...紧急程度，只输出 JSON：{{\\&quot;urgency\\&quot;: &lt;整数&gt;}}\\n\\n{text}&quot;\n\ndef prompt_v2(text):   # 在 V1 基础上加角色设定 + 文字判断标准\n    return &quot;你是...客服主管。判断标准：5分=...\\n\\n&quot; + prompt_v1(text)\n\ndef prompt_v3(text):   # 在 V2 基础上加 Few-shot 示例\n    return prompt_v2(text).replace(&quot;只输出 JSON&quot;, &quot;示例：...\\n\\n只输出 JSON&quot;)\n\ndef evaluate_prompt(prompt_fn, test_set, n_runs=3):\n    results = []\n    for item in test_set:\n        runs = [run_prompt(prompt_fn, item[&quot;text&quot;]) for _ in range(n_runs)]\n        most_common = max(set(runs), key=runs.count)\n        results.append({&quot;stable&quot;: len(set(runs)) == 1, &quot;correct&quot;: most_common == item[&quot;expected&quot;]})\n    accuracy = sum(r[&quot;correct&quot;] for r in results) / len(results)\n    stability = sum(r[&quot;stable&quot;] for r in results) / len(results)\n    return {&quot;accuracy&quot;: accuracy, &quot;stability&quot;: stability}\n\ndef compare_prompts(prompts: dict, test_set, n_runs=3):\n    for name, fn in prompts.items():\n        result = evaluate_prompt(fn, test_set, n_runs)\n        print(f&quot;{name}：准确率 {result[&#x27;accuracy&#x27;]:.0%}，稳定性 {result[&#x27;stability&#x27;]:.0%}&quot;)\n\n# 迭代阶段：只在开发集上对比三版\ncompare_prompts({&quot;V1&quot;: prompt_v1, &quot;V2&quot;: prompt_v2, &quot;V3&quot;: prompt_v3}, DEV_SET)\n# 定稿阶段：留出集只跑一次，验证真实表现\nfinal = evaluate_prompt(prompt_v3, HOLDOUT_SET, n_runs=3)</code></pre><p>设计要点：</p><ul><li>V1→V2→V3 递进式设计，每次只新增一类优化手段，能精确归因&quot;这一提升是哪类手段带来的&quot;</li><li>每条数据跑 <code>n_runs</code> 次，同时计算准确率（vs 人工标注）和稳定性（结果一致性），而不是只看&quot;看起来对不对&quot;</li><li>开发集和留出集严格分离，留出集只在版本定稿后跑一次，避免&quot;优化&quot;实际上是过拟合了测试数据</li><li>实验结论可复现——换一批新的测试数据、换一个人跑这套代码，得到的对比结论应该是一致的</li></ul>"}]},{"name":"建立成本意识","questions":[{"qnum":1,"qtext":"长输入短输出和短输入长输出两类任务，成本优化的着力点分别是什么？","answerHtml":"<p>判断依据是拆开看 <code>usage.prompt_tokens</code> 和 <code>usage.completion_tokens</code> 谁占大头，而不是只看 <code>total_tokens</code>：</p><div class=\"table-wrap\"><table><thead><tr><th>场景</th><th>典型任务</th><th>成本主要由谁决定</th><th>优化方向</th></tr></thead><tbody><tr><td>长输入 + 短输出</td><td>文档问答、长文摘要</td><td>输入 Token</td><td>减少输入：更精细的文档切分、只喂检索到的相关片段、精简历史</td></tr><tr><td>短输入 + 长输出</td><td>代码生成、长文写作</td><td>输出 Token（单价通常更高）</td><td>约束输出长度、拆分任务分步生成、避免模型&quot;自由发挥&quot;</td></tr><tr><td>长输入 + 长输出</td><td>带大量历史的多轮技术讨论</td><td>两者都重要</td><td>两头同时控制，是成本最容易失控的场景</td></tr></tbody></table></div><p>两种场景优化方向完全不同：给&quot;长输入短输出&quot;任务加 <code>max_tokens</code> 限制收效有限（成本大头在输入），给&quot;短输入长输出&quot;任务优化历史截断也收效有限（本来就没有多轮历史）——先定位大头，再对症优化。</p>"},{"qnum":2,"qtext":"如何从零设计一个用于统计和记录大模型调用成本的工具？","answerHtml":"<p>核心思路：**每次调用后立即从 <code>response.usage</code> 取真实计费数字，用结构化对象记录，而不是事后凭印象估算**。</p><pre><code class=\"language-python\">from dataclasses import dataclass, field\n\nPRICING = {\n    &quot;deepseek-chat&quot;: {&quot;input_per_million&quot;: 1.0, &quot;output_per_million&quot;: 2.0},\n}\n\n@dataclass\nclass CostRecord:\n    label: str\n    model: str\n    input_tokens: int\n    output_tokens: int\n    cost: float = field(init=False)\n\n    def __post_init__(self):\n        price = PRICING[self.model]\n        self.cost = (\n            self.input_tokens * price[&quot;input_per_million&quot;] / 1_000_000\n            + self.output_tokens * price[&quot;output_per_million&quot;] / 1_000_000\n        )\n\n\ndef call_and_record(label, messages, model=&quot;deepseek-chat&quot;):\n    response = client.chat.completions.create(model=model, messages=messages)\n    usage = response.usage\n    return CostRecord(label, model, usage.prompt_tokens, usage.completion_tokens)</code></pre><p>设计要点：</p><ul><li>**永远以 <code>usage</code> 字段为准**，不用字符数或 <code>tiktoken</code> 本地估算替代真实计费（本地估算只适合&quot;下单前&quot;的粗略预判）</li><li>用 <code>dataclass</code> 把&quot;一次调用的成本&quot;变成结构化记录，而不是散落的变量，方便后续批量汇总、写入 CSV 或接入监控看板</li><li>价格表（<code>PRICING</code>）单独维护，模型换代或平台调价时只改一处</li><li>汇总时按&quot;请求类型&quot;分组统计，能直接回答&quot;哪类功能最烧钱&quot;这种业务问题，而不是只有一个笼统的总花费数字</li></ul>"},{"qnum":3,"qtext":"如何量化评估一次 Prompt 优化在\"效果提升\"和\"成本增加\"之间是否划算？","answerHtml":"<p>核心思路：把&quot;额外付出的 Token&quot;和&quot;换来的效果提升&quot;做比值，而不是只看效果单方面变好了就认为优化成功。</p><pre><code class=\"language-python\">def cost_per_accuracy_point(extra_tokens: int, accuracy_gain_pp: float) -&gt; float:\n    &quot;&quot;&quot;每提升 1 个百分点准确率需要额外付出多少 Token，数值越小性价比越高&quot;&quot;&quot;\n    return extra_tokens / accuracy_gain_pp if accuracy_gain_pp &gt; 0 else float(&quot;inf&quot;)</code></pre><p>以 Day 11 的 V1→V2→V3 实验为例：V1→V2 增加 80 Token 换来 40 个百分点准确率提升（2.0 Token/pp），V2→V3 增加 100 Token 只换来 20 个百分点提升（5.0 Token/pp）——V1→V2 这一步性价比明显更高。</p><p><strong>关键判断标准不是&quot;哪个版本准确率最高&quot;，而是&quot;这个任务出错的业务代价有多大&quot;</strong>：</p><ul><li>如果是成本敏感、容错率较高的场景（如粗筛工单优先级），可能停在性价比更高的 V2 就够了</li><li>如果是错误代价很高的场景（如涉及资金损失的紧急程度判断），V3 那部分性价比更低的额外提升仍然值得付出</li></ul><p>这也是&quot;效果优化&quot;和&quot;成本优化&quot;两条主线在 Day 11、Day 12 交汇的地方：Day 11 只回答&quot;哪个 Prompt 更准&quot;，Day 12 补上&quot;为了更准，多花的钱划不划算&quot;，两者合起来才是完整的工程决策。</p>"}]},{"name":"配置管理和日志","questions":[{"qnum":1,"qtext":"为什么 API Key 不能硬编码在代码中？`.env` + `.gitignore` 方案是如何配合使用的？","answerHtml":"<p>硬编码密钥的风险链条是：代码提交到 Git → 仓库成员可见（哪怕是私有仓库）→ 一旦 push 到公开仓库，GitHub 等平台秒级扫描发现密钥 → Key 被吊销或盗用。这不是&quot;只要小心就能避免&quot;的问题——依赖人的自律不如用机制来保障。</p><p><code>.env</code> + <code>.gitignore</code> 方案：</p><div class=\"table-wrap\"><table><thead><tr><th>文件</th><th>内容</th><th>是否提交 Git</th></tr></thead><tbody><tr><td><code>.env</code></td><td>真实的 Key 和本地配置值</td><td><strong>不提交</strong>（在 <code>.gitignore</code> 中排除）</td></tr><tr><td><code>.env.example</code></td><td>变量名 + 占位符说明</td><td><strong>提交</strong>（供团队参考应该设哪些变量）</td></tr></tbody></table></div><pre><code class=\"language-dotenv\"># .env（不提交）\nDEEPSEEK_API_KEY=sk-your-actual-key\n\n# .env.example（提交）\nDEEPSEEK_API_KEY=sk-your-key-here</code></pre><pre><code class=\"language-python\">from dotenv import load_dotenv\nimport os\n\nload_dotenv()\napi_key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;)\nif not api_key:\n    raise ValueError(&quot;DEEPSEEK_API_KEY 未设置，请在 .env 文件中配置&quot;)</code></pre><p><code>load_dotenv()</code> 的关键行为：环境变量已存在时默认不覆盖，CI/CD 注入的密钥优先级自然高于 <code>.env</code> 文件——这正是&quot;命令行/环境变量 &gt; .env 文件&quot;优先级的机制实现。</p>"},{"qnum":2,"qtext":"配置的三种来源（命令行参数、环境变量、.env 文件）优先级如何排序？为什么这样设计？","answerHtml":"<p>优先级从高到低：<strong>命令行参数 &gt; 环境变量 &gt; .env 文件 &gt; 代码默认值</strong>。</p><div class=\"table-wrap\"><table><thead><tr><th>来源</th><th>优先级</th><th>典型用途</th></tr></thead><tbody><tr><td>命令行参数</td><td>最高</td><td>临时覆盖，调试时一次性切换模型</td></tr><tr><td>环境变量</td><td>高</td><td>CI/CD 注入密钥，不同机器/环境设不同值</td></tr><tr><td><code>.env</code> 文件</td><td>中</td><td>本地开发默认配置，每人一份不互干扰</td></tr><tr><td>代码默认值</td><td>最低</td><td>非必填项的合理兜底，方便快速启动</td></tr></tbody></table></div><p><strong>设计原因</strong>：越&quot;临时&quot;的来源优先级越高——命令行参数是单次运行时的临时覆盖，不应该被持久化的 <code>.env</code> 文件覆盖；环境变量是运维/CI 在部署时注入的&quot;正式值&quot;，同样不应被开发者的本地 <code>.env</code> 覆盖；代码默认值只是&quot;写了比没写好&quot;的最低保障，任何外部配置都应该覆盖它。这种设计让同一份代码在开发、测试、生产三个环境中，只需改配置来源而无需改代码。</p>"},{"qnum":3,"qtext":"Python `logging` 的五个级别分别适合哪些场景？为什么建议用 `logging` 而不是 `print`？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>级别</th><th>数值</th><th>LLM 项目典型用途</th></tr></thead><tbody><tr><td>DEBUG</td><td>10</td><td>打印完整的 messages 列表、原始 API 响应（开发时用，生产关闭）</td></tr><tr><td>INFO</td><td>20</td><td>程序启动信息、每次 API 调用完成（耗时、Token 数）</td></tr><tr><td>WARNING</td><td>30</td><td>触发重试、输出被 max_tokens 截断、请求临近限速</td></tr><tr><td>ERROR</td><td>40</td><td>JSON 解析失败、API 调用失败但程序可继续运行</td></tr><tr><td>CRITICAL</td><td>50</td><td>API Key 无效等程序无法继续的灾难性错误</td></tr></tbody></table></div><p>**为什么不用 <code>print</code>**：</p><div class=\"table-wrap\"><table><thead><tr><th>能力</th><th><code>print</code></th><th><code>logging</code></th></tr></thead><tbody><tr><td>区分严重程度</td><td>无</td><td>有（五个级别）</td></tr><tr><td>运行时过滤</td><td>只能注释掉代码</td><td><code>setLevel()</code> 一行切换</td></tr><tr><td>自动时间戳</td><td>无</td><td>有</td></tr><tr><td>写入文件</td><td>需要重定向</td><td>加一个 <code>FileHandler</code></td></tr><tr><td>性能（被过滤时）</td><td><code>f-string</code> 总是先计算</td><td><code>%s</code> 格式化被过滤时不执行</td></tr></tbody></table></div><p>实践细节：<code>logger.debug(&quot;msg: %s&quot;, obj)</code> 而不是 <code>logger.debug(f&quot;msg: {obj}&quot;)</code>——后者无论日志级别是否过滤都会先执行字符串拼接，前者在 DEBUG 被过滤时完全不计算，大对象场景下性能差异明显。</p>"},{"qnum":4,"qtext":"给 LLM 项目的 API 调用加日志，应该记录哪些关键信息？","answerHtml":"<p>最小有效日志集合：<strong>请求标识 + 耗时 + Token 消耗</strong>——这三个数字回答了排查时最常见的三个问题（这是哪个请求？为什么慢？钱花在哪了？）：</p><pre><code class=\"language-python\">import time, logging\n\nlogger = logging.getLogger(__name__)\n\ndef call_with_logging(client, messages, model, label=&quot;&quot;):\n    start = time.monotonic()\n    try:\n        response = client.chat.completions.create(model=model, messages=messages)\n        elapsed = time.monotonic() - start\n        usage = response.usage\n        logger.info(\n            &quot;[%s] 完成 | 耗时 %.2fs | 输入 %d Token | 输出 %d Token&quot;,\n            label or model, elapsed, usage.prompt_tokens, usage.completion_tokens,\n        )\n        return response\n    except Exception as e:\n        elapsed = time.monotonic() - start\n        logger.error(&quot;[%s] 失败 | 耗时 %.2fs | %s&quot;, label or model, elapsed, e)\n        raise</code></pre><p><strong>启动日志单独处理</strong>：程序启动时打印一次当前生效的配置（模型名、API Key 前 8 位、超时等），让运维在日志文件里就能确认&quot;这次跑的是哪个配置&quot;，而不需要登录机器查看 <code>.env</code> 文件：</p><pre><code class=\"language-python\">logger.info(&quot;模型：%s | Key：%s... | 超时：%ds&quot;, model, api_key[:8], timeout)</code></pre><p><strong>打印 API Key 前 8 位而非完整值</strong>：能区分&quot;用的是哪个 Key&quot;但不泄露完整密钥，是&quot;可调试性&quot;和&quot;安全性&quot;之间的标准折中。</p>"},{"qnum":5,"qtext":"如何从零设计一个\"配置 + 日志 + 重试\"三合一的可维护 LLM 客户端？","answerHtml":"<p>核心设计原则：<strong>配置对象化（可测试） + 日志结构化（可追溯） + 重试分级（可重试 vs 不可重试）</strong>。</p><pre><code class=\"language-python\">import os, time, logging, sys\nfrom dataclasses import dataclass\nfrom openai import OpenAI, APIStatusError, APIConnectionError, RateLimitError\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\n@dataclass\nclass AppConfig:\n    api_key: str\n    model_name: str\n    base_url: str\n    max_retries: int\n    request_timeout: int\n\n    @classmethod\n    def from_env(cls) -&gt; &quot;AppConfig&quot;:\n        key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;, &quot;&quot;)\n        if not key:\n            raise ValueError(&quot;DEEPSEEK_API_KEY 未设置&quot;)\n        return cls(\n            api_key=key,\n            model_name=os.getenv(&quot;MODEL_NAME&quot;, &quot;deepseek-chat&quot;),\n            base_url=os.getenv(&quot;BASE_URL&quot;, &quot;https://api.deepseek.com/v1&quot;),\n            max_retries=int(os.getenv(&quot;MAX_RETRIES&quot;, &quot;3&quot;)),\n            request_timeout=int(os.getenv(&quot;REQUEST_TIMEOUT&quot;, &quot;30&quot;)),\n        )\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=&quot;%(asctime)s  %(levelname)-8s  %(name)s  %(message)s&quot;,\n    handlers=[logging.StreamHandler(sys.stdout)],\n)\nlogger = logging.getLogger(__name__)\n\nclass LLMClient:\n    def __init__(self, config: AppConfig):\n        self.config = config\n        self.client = OpenAI(api_key=config.api_key, base_url=config.base_url)\n        logger.info(&quot;初始化 | 模型：%s | Key：%s...&quot;, config.model_name, config.api_key[:8])\n\n    def chat(self, messages: list, label: str = &quot;&quot;) -&gt; str:\n        for attempt in range(1, self.config.max_retries + 1):\n            start = time.monotonic()\n            try:\n                resp = self.client.chat.completions.create(\n                    model=self.config.model_name, messages=messages,\n                    timeout=self.config.request_timeout,\n                )\n                elapsed = time.monotonic() - start\n                usage = resp.usage\n                logger.info(&quot;[%s] 完成 | %.2fs | 输入 %d | 输出 %d Token&quot;,\n                            label, elapsed, usage.prompt_tokens, usage.completion_tokens)\n                return resp.choices[0].message.content\n            except RateLimitError:\n                wait = 2 ** attempt\n                logger.warning(&quot;限速，%ds 后重试 (%d/%d)&quot;, wait, attempt, self.config.max_retries)\n                time.sleep(wait)\n            except APIConnectionError as e:\n                logger.warning(&quot;连接失败，重试 (%d/%d)：%s&quot;, attempt, self.config.max_retries, e)\n                time.sleep(1)\n            except APIStatusError as e:\n                if e.status_code in (400, 401, 403):\n                    logger.error(&quot;不可重试错误 %d：%s&quot;, e.status_code, e.message)\n                    raise\n                logger.warning(&quot;服务器错误 %d，重试 (%d/%d)&quot;, e.status_code, attempt, self.config.max_retries)\n                time.sleep(2)\n        raise RuntimeError(f&quot;达到最大重试次数 {self.config.max_retries}&quot;)</code></pre><p>三层设计要点：</p><ul><li><strong>配置层</strong>：<code>AppConfig.from_env()</code> 集中读取和校验，测试时可直接 <code>AppConfig(api_key=&quot;test&quot;, ...)</code> 构造，不依赖真实环境变量</li><li><strong>日志层</strong>：INFO 记录正常里程碑（耗时/Token），WARNING 记录临时性问题（重试），ERROR 记录不可恢复错误——级别清晰，生产环境用 <code>LOG_LEVEL=WARNING</code> 屏蔽噪音</li><li><strong>重试层</strong>：区分&quot;可重试&quot;（限速/网络/5xx）和&quot;不可重试&quot;（401/400）——不区分地无脑重试会浪费时间，直接 raise 让调用方知道是不可恢复的错误</li></ul>"}]},{"name":"第 2 周综合复盘","questions":[{"qnum":1,"qtext":"第 2 周（Day 8–13）六个主题之间是什么逻辑关系？为什么要按这个顺序学？","answerHtml":"<p>第 2 周的六个主题是同一个命题的六个层面——<strong>如何让 LLM 应用从&quot;能跑&quot;变成&quot;可信赖、可迭代、可量化、可维护&quot;</strong>，是一条递进依赖的学习链：</p><div class=\"table-wrap\"><table><thead><tr><th>顺序</th><th>Day</th><th>主题</th><th>解决什么</th><th>依赖什么</th></tr></thead><tbody><tr><td>1</td><td>8</td><td>结构化输出</td><td>输出格式不可控</td><td>Day 6 的 JSON 约束</td></tr><tr><td>2</td><td>9</td><td>输出校验与异常处理</td><td>校验失败时程序崩溃</td><td>Day 8 的 Pydantic 模型</td></tr><tr><td>3</td><td>10</td><td>文本分类器</td><td>新任务类型（封闭集输出）</td><td>Day 8/9 的结构化 + 校验</td></tr><tr><td>4</td><td>11</td><td>Prompt 优化</td><td>效果评估没有量化框架</td><td>Day 10 的多次采样实验</td></tr><tr><td>5</td><td>12</td><td>成本意识</td><td>Prompt 优化只看效果不看代价</td><td>Day 11 的版本对比数据</td></tr><tr><td>6</td><td>13</td><td>配置与日志</td><td>成本/性能指标没有留存机制</td><td>Day 12 的 Token 记录</td></tr></tbody></table></div><p><strong>不能乱序的原因</strong>：Day 9 的重试依赖 Day 8 定义的 Pydantic 模型（校验失败才触发重试）；Day 11 的稳定性评估依赖 Day 10 的多次采样结构；Day 12 的成本权衡依赖 Day 11 的准确率数据；Day 13 的 logging 把 Day 12 的成本数字持久化。每一步都在上一步产出的基础上加一层工程保障。</p>"},{"qnum":2,"qtext":"什么样的 Prompt 才算\"稳定\"？如何量化评估稳定性？","answerHtml":"<p>技术定义：同一条输入多次调用（通常 3 次），结果完全一致的比例高。稳定性 &lt; 70% 的 Prompt 不应上生产。</p><p>不稳定的四类根因及修复：</p><div class=\"table-wrap\"><table><thead><tr><th>根因</th><th>表现</th><th>修复方式</th></tr></thead><tbody><tr><td>任务目标模糊</td><td>每次返回不同格式/维度</td><td>明确说&quot;只输出 JSON，字段为 X&quot;</td></tr><tr><td>值域未锁定</td><td>标签值随机变化</td><td>enum 类型 + Pydantic 强制校验</td></tr><tr><td>边界案例未覆盖</td><td>特殊输入结果飘忽</td><td>Few-shot 展示边界案例处理方式</td></tr><tr><td>Temperature 过高</td><td>结构化任务仍有随机性</td><td>结构化任务一律 temperature=0</td></tr></tbody></table></div><pre><code class=\"language-python\">def stability_score(prompt_fn, test_set: list[str], n_runs: int = 3) -&gt; float:\n    stable = 0\n    for text in test_set:\n        runs = [call_llm(prompt_fn(text)) for _ in range(n_runs)]\n        if len(set(runs)) == 1:\n            stable += 1\n    return stable / len(test_set)</code></pre><p><strong>稳定性和准确率的关系</strong>：两者独立，必须分开评估。一个 Prompt 可以&quot;稳定地错&quot;（每次输出相同的错误结果），也可以&quot;偶尔蒙对&quot;（结果不一致但多数投票正确）——两者都不是好 Prompt。理想状态是稳定性 ≥ 80% 且准确率达到业务要求。</p>"},{"qnum":3,"qtext":"为什么说输出校验比\"提示模型要小心\"更可靠？这体现了什么工程原则？","answerHtml":"<p>&quot;提示模型小心&quot;是依赖 LLM 的输出自律，&quot;校验&quot;是在代码层建立检查点——两种方式的本质差距类似于&quot;提醒开发者别提交密钥&quot;和&quot;用 <code>.gitignore</code> 阻止提交&quot;：前者依赖人的记忆，后者用机制保障。</p><div class=\"table-wrap\"><table><thead><tr><th>对比维度</th><th>依赖提示</th><th>代码层校验</th></tr></thead><tbody><tr><td>失败时行为</td><td>随机、不可预测</td><td>确定性抛出异常</td></tr><tr><td>失败可发现性</td><td>可能悄悄带着错误数据继续运行</td><td>立即捕获，不流入下游</td></tr><tr><td>补救手段</td><td>无（已经继续运行了）</td><td>重试 → 兜底 → 三态结果</td></tr><tr><td>随时间稳定性</td><td>随模型版本更新波动</td><td>代码逻辑不变则行为稳定</td></tr></tbody></table></div><p><strong>体现的工程原则</strong>：&quot;能用机制保证的事情，不依赖人（或模型）的自律&quot;。校验层的意义不是&quot;LLM 会出错所以不信任它&quot;，而是&quot;任何外部输入（包括 LLM 输出）都应该在进入业务逻辑前经过验证&quot;——这和验证用户输入、验证第三方 API 响应是完全相同的工程理念。</p>"},{"qnum":4,"qtext":"为什么日志和配置管理要在 Demo 阶段就引入，而不是等项目变大再补？","answerHtml":"<p><strong>配置管理的债务是复利</strong>：从第 1 个硬编码密钥到第 10 个，改造成本是线性增长的；但一旦发生泄露，代价是非线性的。更重要的是，改造时机越晚，&quot;顺便用原来的方式就好了&quot;的惯性越强，技术债越难偿还。</p><pre><code>最佳引入时机：第一次写 client = OpenAI(api_key=&quot;...&quot;) 时\n此时成本：创建 .env，写 AppConfig.from_env() — 10 分钟\n此后收益：所有脚本共享配置，改一处生效全部，且永远不会意外提交密钥</code></pre><p><strong>日志的价值在出问题时才体现</strong>：用 <code>print()</code> 的项目出了问题必须在本地复现，而 <code>logging</code> 的项目看日志文件就能定位。问题总是在最不方便的时候（线上、压力下）发生，此时才意识到没有日志为时已晚。</p><pre><code>print() 的调试困境：\n  &quot;上周五线上那次报错，输入是什么？输出了什么？耗时多少？&quot;\n  → 不知道，需要复现 → 复现不稳定 → 浪费大量时间\n\nlogging 的排查流程：\n  &quot;上周五线上那次报错，查日志&quot; → 有时间戳、输入摘要、错误类型、Token 数\n  → 5 分钟定位问题</code></pre><p><strong>最佳实践</strong>：把 <code>setup_logging()</code> 和 <code>AppConfig.from_env()</code> 写进项目模板，新建任何 LLM 脚本时第一件事就是复制这两行——让好习惯的执行成本趋近于零。</p>"},{"qnum":5,"qtext":"如果让你从零搭建一个\"第 2 周成果汇总\"工程骨架，你会如何设计它的模块结构？","answerHtml":"<p>核心设计原则：<strong>单一职责 + 配置集中 + 功能正交（各模块可独立调用）</strong>。</p><pre><code>week2_toolkit/\n├── config.py          # AppConfig dataclass + from_env() + setup_logging()\n├── client.py          # LLMClient（重试 + 日志 + 成本记录），依赖 config.py\n├── prompt_templates.py# 抽取/分类/摘要三类 Prompt 构建函数，纯函数，无副作用\n├── schemas.py         # Pydantic 模型定义（ResumeInfo, ClassificationResult 等）\n└── main.py            # 演示入口，串联以上四个模块</code></pre><p>各模块职责边界：</p><div class=\"table-wrap\"><table><thead><tr><th>模块</th><th>职责</th><th>不包含</th></tr></thead><tbody><tr><td><code>config.py</code></td><td>读取/校验配置，初始化 logging</td><td>不包含 API 调用逻辑</td></tr><tr><td><code>client.py</code></td><td>封装 API 调用（重试/日志/成本）</td><td>不包含 Prompt 模板</td></tr><tr><td><code>prompt_templates.py</code></td><td>构建 messages 列表</td><td>不包含 API 调用，不含 Pydantic 校验</td></tr><tr><td><code>schemas.py</code></td><td>Pydantic 模型定义</td><td>不含业务逻辑</td></tr><tr><td><code>main.py</code></td><td>演示串联</td><td>不含可复用逻辑</td></tr></tbody></table></div><pre><code class=\"language-python\"># main.py — 串联示例\nfrom config import AppConfig, setup_logging\nfrom client import LLMClient\nfrom prompt_templates import build_extraction_prompt, build_classification_prompt\nfrom schemas import ResumeInfo, ClassificationResult\n\nconfig = AppConfig.from_env()\nsetup_logging(config.log_level)\nclient = LLMClient(config)\n\nresume = client.call_structured(\n    build_extraction_prompt(&quot;张伟，Python 开发，5年经验&quot;, {&quot;name&quot;: &quot;姓名&quot;, &quot;skills&quot;: &quot;技能&quot;}),\n    schema=ResumeInfo, label=&quot;简历抽取&quot;,\n)\n\ncategory = client.call_structured(\n    build_classification_prompt(&quot;我的订单延迟了&quot;, role=&quot;客服主管&quot;,\n                                labels={&quot;投诉&quot;: &quot;有损失&quot;, &quot;咨询&quot;: &quot;信息查询&quot;}),\n    schema=ClassificationResult, label=&quot;工单分类&quot;,\n)\n\nclient.print_cost_summary()</code></pre><p>这种结构的好处：</p><ul><li>换 API 供应商只改 <code>config.py</code> 和 <code>client.py</code>，<code>prompt_templates.py</code> 和 <code>schemas.py</code> 零改动</li><li>单元测试 <code>prompt_templates.py</code> 不需要 mock API——纯函数，输入什么出什么</li><li><code>schemas.py</code> 的 Pydantic 模型可以直接生成 JSON Schema 用于 Prompt，两处定义合一</li><li><code>main.py</code> 只有 15 行，每行都是业务逻辑，工程细节全部隐藏在其他模块里</li></ul>"}]},{"name":"RAG 基本原理","questions":[{"qnum":1,"qtext":"文档切分（Chunking）中 Chunk Size 和 Chunk Overlap 各自的作用是什么？如何选取合适的值？","answerHtml":"<p><strong>Chunk Size 的作用</strong>：决定每块的语义粒度。太小则语义不完整，太大则检索精度下降且输入成本高。</p><p><strong>Chunk Overlap 的作用</strong>：防止关键信息被切断到相邻块的边界处。</p><pre><code>无 Overlap 的切断问题：\n  Chunk 1: &quot;...退款需在购买后 30 天内&quot;\n  Chunk 2: &quot;提交申请，3-5 个工作日退回...&quot;\n  → &quot;购买后 30 天内提交申请&quot;这条关键信息跨越了两个 Chunk\n  \n有 Overlap（50 Token）：\n  Chunk 1: &quot;...退款需在购买后 30 天内&quot;\n  Chunk 2: &quot;退款需在购买后 30 天内 提交申请，3-5 个工作日退回...&quot;\n  → Chunk 2 包含了完整信息</code></pre><p>参数选取经验：</p><div class=\"table-wrap\"><table><thead><tr><th>场景</th><th>Chunk Size</th><th>Overlap</th></tr></thead><tbody><tr><td>通用文档问答（默认）</td><td>300 Token</td><td>50 Token（约 15%）</td></tr><tr><td>法律/合同（长句、严格逻辑）</td><td>500 Token</td><td>100 Token（约 20%）</td></tr><tr><td>FAQ 条目（每条本来就短）</td><td>100–150 Token</td><td>20 Token</td></tr></tbody></table></div><p><strong>不要过度调参</strong>：先用默认值（300/50）跑通，根据实际回答质量再调整——问答质量低通常是 Embedding 或检索的问题，不一定是切分参数的问题。</p>"},{"qnum":2,"qtext":"如何从零实现一个最小可用的 RAG 问答系统？请描述关键代码的设计思路。","answerHtml":"<p>核心思路：<strong>离线构建向量索引 + 在线&quot;检索-生成&quot;两步流程</strong>，最小实现只需 <code>sentence-transformers</code>、<code>numpy</code>、<code>openai</code> 三个库。</p><pre><code class=\"language-python\">from sentence_transformers import SentenceTransformer\nimport numpy as np\n\nmodel = SentenceTransformer(&quot;paraphrase-multilingual-MiniLM-L12-v2&quot;)\n\n# ─── 离线构建 ──────────────────────────────────────────────────────────────\n\ndef chunk_text(text: str, size: int = 300, overlap: int = 50) -&gt; list[str]:\n    words = text.split()\n    chunks, i = [], 0\n    while i &lt; len(words):\n        chunks.append(&quot; &quot;.join(words[i:i+size]))\n        i += size - overlap\n    return [c for c in chunks if c.strip()]\n\ndef build_index(docs: list[str]) -&gt; dict:\n    chunks = [c for doc in docs for c in chunk_text(doc)]\n    return {&quot;chunks&quot;: chunks, &quot;vectors&quot;: model.encode(chunks)}\n\n# ─── 在线检索 ──────────────────────────────────────────────────────────────\n\ndef retrieve(query: str, index: dict, top_k: int = 3) -&gt; list[str]:\n    q = model.encode([query])[0]\n    scores = [float(np.dot(q, v) / (np.linalg.norm(q) * np.linalg.norm(v)))\n              for v in index[&quot;vectors&quot;]]\n    top = sorted(range(len(scores)), key=lambda i: scores[i], reverse=True)[:top_k]\n    return [index[&quot;chunks&quot;][i] for i in top]\n\n# ─── 在线生成 ──────────────────────────────────────────────────────────────\n\ndef answer(question: str, chunks: list[str], client) -&gt; str:\n    context = &quot;\\n\\n---\\n\\n&quot;.join(f&quot;[片段 {i+1}]\\n{c}&quot; for i, c in enumerate(chunks))\n    messages = [\n        {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;只根据参考资料回答，资料中没有的内容请明确说无法回答。&quot;},\n        {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: f&quot;参考资料：\\n\\n{context}\\n\\n问题：{question}&quot;},\n    ]\n    return client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=messages, temperature=0.1\n    ).choices[0].message.content</code></pre><p>关键设计决策：</p><ul><li>**<code>build_index</code> 与 <code>answer</code> 分离**：索引只建一次，问答每次调用；不要在问答函数里重建索引</li><li>**同一个 <code>model</code> 实例**：<code>build_index</code> 和 <code>retrieve</code> 用同一个 <code>SentenceTransformer</code> 对象，保证向量空间一致</li><li>**<code>temperature=0.1</code>**：事实问答用低温度减少随机性，但不用 0 是因为自然语言回答需要一点流畅度</li><li><strong>&quot;只根据资料回答&quot;约束</strong>：这条 system 指令让模型在找不到答案时拒答，而不是编造——这是 RAG 减少幻觉的关键机制之一</li></ul>"}]},{"name":"读取本地文档","questions":[{"qnum":1,"qtext":"RAG 系统中文档读取阶段的质量为什么至关重要？常见的文档噪音有哪些？","answerHtml":"<p>文档读取是 RAG 流程的入口，&quot;垃圾进，垃圾出&quot;——读取阶段引入的噪音会污染切分、向量化和最终回答的每一个环节。</p><pre><code>噪音对下游的影响链：\n\n  页眉&quot;第 3 章&quot; 混入正文\n    → 这块 Chunk 向量化后代表&quot;关于第 3 章的内容&quot;\n    → 用户问无关问题时，Chunk 可能被错误召回\n    → 模型看到这段噪音内容，生成不准确的回答</code></pre><p><strong>常见噪音类型</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>噪音类型</th><th>来源</th><th>影响</th></tr></thead><tbody><tr><td>连续多余空行</td><td>PDF 排版还原 / 段落分隔</td><td>Chunk 大量浪费在空白上</td></tr><tr><td>行内多余空格</td><td>PDF 坐标还原误差</td><td>词被拆成多个 Token</td></tr><tr><td>页眉页脚</td><td>PDF 固定区域</td><td>每页都有相同文字混入多个 Chunk</td></tr><tr><td>页码（- 1 - 等格式）</td><td>PDF 页脚</td><td>无语义，污染向量表示</td></tr><tr><td>图注（图 3-1：...）</td><td>图片下方说明</td><td>没有图片内容，图注单独出现语义完整度低</td></tr><tr><td>编码乱码字符</td><td>字体映射不完整</td><td>切分时产生&quot;词&quot;实际是乱码，向量化后语义偏差</td></tr></tbody></table></div>"},{"qnum":2,"qtext":"读取中文文本文件时编码问题如何处理？UTF-8、GBK、UTF-8-BOM 有什么区别？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>编码</th><th>全称</th><th>特点</th><th>常见来源</th></tr></thead><tbody><tr><td>UTF-8</td><td>Unicode Transform Format 8-bit</td><td>国际通用，中文 3 字节/字</td><td>macOS/Linux 创建的文件</td></tr><tr><td>GBK</td><td>国家标准汉字编码</td><td>中文 2 字节/字，向下兼容 GB2312</td><td>Windows 下创建的中文文件</td></tr><tr><td>UTF-8-BOM</td><td>UTF-8 + Byte Order Mark</td><td>UTF-8 文件开头有 3 字节 BOM（<code>\\xEF\\xBB\\xBF</code>）</td><td>Windows 记事本&quot;另存为 UTF-8&quot;</td></tr></tbody></table></div><p>处理策略（按优先级）：</p><pre><code class=\"language-python\"># 1. 来源已知 → 直接指定\nopen(path, encoding=&quot;utf-8&quot;)\n\n# 2. 中文文件，来源不确定 → 尝试列表\nfor enc in (&quot;utf-8&quot;, &quot;utf-8-sig&quot;, &quot;gbk&quot;):\n    try:\n        return open(path, encoding=enc).read()\n    except UnicodeDecodeError:\n        continue\n\n# 3. 完全未知 → chardet 自动检测\nimport chardet\nraw = open(path, &quot;rb&quot;).read(10_000)\nencoding = chardet.detect(raw)[&quot;encoding&quot;] or &quot;utf-8&quot;</code></pre><p>**<code>utf-8-sig</code> 的作用**：自动去除 UTF-8-BOM 开头的 3 字节标记——如果用 <code>utf-8</code> 读取含 BOM 的文件，文本开头会有一个看不见的 <code>﻿</code> 字符，混入文档内容影响后续处理。</p>"},{"qnum":3,"qtext":"为什么 PDF 文本提取比读取 TXT 文件难得多？有哪些常见坑？","answerHtml":"<p><strong>根本原因</strong>：PDF 是&quot;页面描述语言&quot;，存储的是&quot;在坐标 (x, y) 处绘制字形 X&quot;的指令，而不是有序的文本流。文本提取是逆向工程——把视觉坐标系上的字形还原成有逻辑顺序的文字。</p><pre><code>TXT：字节序列直接对应字符顺序，`open()` 即读即用\nPDF：坐标 (100, 700) 处的字 + 坐标 (500, 700) 处的字 → 它们在同一行，但顺序需要推断</code></pre><p><strong>四大常见坑</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>坑</th><th>表现</th><th>解决方案</th></tr></thead><tbody><tr><td>多栏布局乱序</td><td>左右两栏文字交错出现（左1行→右1行→左2行→右2行）</td><td>用 <code>pdfplumber.crop()</code> 分区域提取再拼接</td></tr><tr><td>页眉页脚混入</td><td>每页都有相同内容重复出现在多个 Chunk</td><td><code>crop()</code> 裁剪掉顶底固定高度</td></tr><tr><td>乱码字符</td><td>中文显示为方块或奇怪符号</td><td>换用 pymupdf（字体处理更强）</td></tr><tr><td>扫描件无文本</td><td><code>extract_text()</code> 返回 <code>None</code> 或空字符串</td><td>OCR（pytesseract 等），Day 16 先跳过</td></tr></tbody></table></div><p>推荐处理顺序：先用 <code>pdfplumber</code> 试跑，质量差再考虑 pymupdf；扫描件问题放到有 OCR 需求时再解决，不要一开始就引入复杂依赖。</p>"},{"qnum":4,"qtext":"读取文档后为什么需要文本清洗？哪些清洗操作是安全的，哪些会破坏 RAG 效果？","answerHtml":"<p><strong>为什么需要清洗</strong>：不同来源的文档读取后格式差异大，噪音直接影响切分质量和向量语义准确性。清洗的目标是&quot;去除视觉格式噪音，保留语义信息&quot;。</p><p><strong>安全的清洗操作</strong>（不影响语义）：</p><pre><code class=\"language-python\">text = text.replace(&quot;\\r\\n&quot;, &quot;\\n&quot;)         # 统一换行符\ntext = re.sub(r&quot;\\n{3,}&quot;, &quot;\\n\\n&quot;, text)    # 压缩连续空行\ntext = re.sub(r&quot;[ \\t]{2,}&quot;, &quot; &quot;, text)    # 压缩多余空格\ntext = text.strip()                       # 去首尾空白</code></pre><p><strong>危险的清洗操作</strong>（会破坏 RAG 效果）：</p><div class=\"table-wrap\"><table><thead><tr><th>操作</th><th>破坏原因</th></tr></thead><tbody><tr><td>去停用词（&quot;的&quot;&quot;了&quot;&quot;是&quot;）</td><td>Embedding 模型依赖完整句子的上下文，去停用词破坏语法结构</td></tr><tr><td>词干化 / 词形还原</td><td>中文分词本身不适用，英文文档也会破坏 Embedding 语义</td></tr><tr><td>去标点符号</td><td>标点影响句子边界，去掉后切分和 Embedding 都会出问题</td></tr><tr><td>强制截断到 N 字符</td><td>应该在切分阶段处理，不是在加载阶段截断</td></tr></tbody></table></div><p><strong>判断原则</strong>：如果一个清洗操作会改变文本的语义或信息完整性，就不应该在文档加载阶段做——这类操作要么不做，要么放到切分策略里按需处理。</p>"},{"qnum":5,"qtext":"如何设计一个支持多格式的统一文档加载器？请描述接口设计和关键实现思路。","answerHtml":"<p>核心设计原则：**统一输出格式（<code>Document</code> dataclass）+ 格式路由表 + 各格式独立加载函数**。</p><pre><code class=\"language-python\">from dataclasses import dataclass, field\nfrom pathlib import Path\n\n@dataclass\nclass Document:\n    text: str          # 清洗后的纯文本\n    source: str        # 来源文件路径（Day 20 引用来源时使用）\n    file_type: str     # txt / md / pdf\n    page_count: int = 1\n    metadata: dict = field(default_factory=dict)\n\ndef load_document(path: str) -&gt; Document:\n    ext = Path(path).suffix.lower()\n    loader = {&quot;.txt&quot;: _load_txt, &quot;.md&quot;: _load_md, &quot;.pdf&quot;: _load_pdf}.get(ext)\n    if loader is None:\n        raise ValueError(f&quot;不支持的格式：{ext}&quot;)\n    return loader(path)\n\ndef load_directory(dir_path: str, extensions=None, recursive=False) -&gt; list[Document]:\n    exts = extensions or [&quot;.txt&quot;, &quot;.md&quot;, &quot;.pdf&quot;]\n    pattern = &quot;**/*&quot; if recursive else &quot;*&quot;\n    docs = []\n    for ext in exts:\n        for f in Path(dir_path).glob(f&quot;{pattern}{ext}&quot;):\n            try:\n                docs.append(load_document(str(f)))\n            except Exception as e:\n                print(f&quot;[跳过] {f}：{e}&quot;)\n    return docs</code></pre><p><strong>接口设计的三个关键决策</strong>：</p><ul><li>**为什么用 <code>Document</code> 而不是直接返回字符串**：<code>source</code> 字段是 Day 20 引用来源的基础；<code>page_count</code> 和 <code>metadata</code> 为后续扩展预留空间；统一格式让调用方代码稳定，换格式只改加载器内部实现</li></ul><ul><li>**为什么用路由表 <code>{&quot;.txt&quot;: _load_txt, ...}</code>**：比 <code>if/elif</code> 更易扩展——新增格式只在路由表加一行，不改 <code>load_document</code> 主体逻辑</li></ul><ul><li>**<code>load_directory</code> 为什么用 try/except 跳过失败文件**：知识库可能包含部分损坏或不支持的文件，单个失败不应中断整批加载——记录日志后跳过，保证能加载其他正常文件</li></ul>"}]},{"name":"文本切分","questions":[{"qnum":1,"qtext":"固定大小切分和按语义边界切分有什么本质区别？各自的适用场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>固定大小切分</th><th>按语义边界切分</th></tr></thead><tbody><tr><td>切分依据</td><td>字符数 / Token 数（与内容无关）</td><td>段落、句子等自然语言边界</td></tr><tr><td>Chunk 大小</td><td>均匀可控</td><td>差异较大（受原文结构影响）</td></tr><tr><td>语义完整性</td><td>可能在句子中间截断</td><td>保证每块是完整的语义单元</td></tr><tr><td>实现复杂度</td><td>极简</td><td>需要语言检测（段落符、句号等）</td></tr><tr><td>适用场景</td><td>快速原型；结构无规律的纯流文本</td><td>有清晰段落结构的正式文档、法律合同、FAQ</td></tr></tbody></table></div><p><strong>核心区别</strong>：固定大小切分以&quot;字符均匀&quot;为目标，与文本语义完全解耦；语义边界切分以&quot;语义完整&quot;为目标，接受大小不均换来的内容完整性。</p><p><strong>实际影响</strong>：固定切分可能把一句&quot;退款需在 30 天内 | 提交申请&quot;从中截断，导致两个 Chunk 各只包含半句话，向量化后语义都不完整，检索时容易召回错误内容。</p>"},{"qnum":2,"qtext":"Chunk Size 和 Chunk Overlap 各自的作用是什么？选取不当会带来什么后果？","answerHtml":"<p><strong>Chunk Size（块大小）</strong>：</p><ul><li>决定每块向量代表的&quot;语义粒度&quot;</li><li>过小：每块只有几个词，语义不完整，无法独立回答问题；向量化后语义混乱</li><li>过大：一块里混入多个话题，向量是多话题的平均，检索时既不精准又带入大量无关内容</li><li>经验值：中文场景 300–500 字符（约 200–400 字），英文场景 300–600 Token</li></ul><p><strong>Chunk Overlap（块重叠）</strong>：</p><ul><li>解决语义跨块边界的问题——一个事实可能恰好跨在两个 Chunk 的切断处</li><li>通过让相邻两块共享一段文本（前块尾部 = 后块头部），确保边界处的语义在至少一块中是完整的</li><li>过小（&lt; 5%）：边界信息丢失，检索时跨块关键信息无法被召回</li><li>过大（&gt; 40%）：大量冗余存储，索引体积膨胀，相似块互相干扰检索结果</li><li>经验值：Chunk Size 的 15–25%（如 Chunk Size=400，Overlap=60–100）</li></ul>"},{"qnum":3,"qtext":"递归字符切分（Recursive Character Splitter）的核心思路是什么？为什么推荐作为默认策略？","answerHtml":"<p><strong>核心思路</strong>：给定一组按优先级排列的分隔符（如 <code>[&quot;\\n\\n&quot;, &quot;\\n&quot;, &quot;。&quot;, &quot;.&quot;, &quot; &quot;, &quot;&quot;]</code>），先尝试最高优先级的分隔符切分；如果某块仍然超过 <code>chunk_size</code>，则用下一个分隔符继续切分这块，直到满足大小约束或用尽所有分隔符（最后用字符强制切分兜底）。</p><pre><code>分隔符优先级：段落 &gt; 行 &gt; 句号 &gt; 词 &gt; 字符\n结果：尽可能在&quot;最自然的边界&quot;处切，只在迫不得已时才截断更小的单元</code></pre><p><strong>为什么推荐作为默认</strong>：</p><ul><li><strong>语义完整性好</strong>：优先段落边界，退而求其次用句子，最差情况才截字符——比固定字符切分语义损失小得多</li><li><strong>大小可控</strong>：通过 <code>chunk_size</code> 硬性约束，不会出现纯段落切分时 Chunk 大小差异几十倍的情况</li><li><strong>通用性强</strong>：同一组分隔符对中英文混合文档都适用，无需针对语言调整</li><li><strong>LangChain 默认实现验证</strong>：社区大规模使用证明它是最实用的折中方案</li></ul>"},{"qnum":4,"qtext":"切分策略对 RAG 检索质量的影响路径是什么？如何设计切分策略对比实验？","answerHtml":"<p><strong>影响路径</strong>：</p><pre><code>切分策略\n  → Chunk 语义纯度（一块是否只包含一个话题）\n    → 向量化质量（向量能否精确代表这块的语义）\n      → 检索召回质量（问题向量和答案向量的余弦相似度）\n        → 最终回答质量（模型拿到的上下文是否包含答案）</code></pre><p><strong>对比实验设计</strong>：</p><pre><code class=\"language-python\"># Step 1：准备同一份文档，用不同策略切分\nstrategies = {\n    &quot;固定字符&quot;: chunk_by_chars(text, 400, 80),\n    &quot;递归切分&quot;: RecursiveCharacterSplitter(400, 80).split(text),\n    &quot;句子切分&quot;: chunk_by_sentences(text, 300, 1),\n}\n\n# Step 2：对每种策略统计 Chunk 分布（块数、大小均值/标准差/最值）\nfor name, chunks in strategies.items():\n    print(analyze_chunks(chunks, name))\n\n# Step 3：构建向量索引，用一组测试问题检索，记录最高相似度分数\nfor query in test_questions:\n    evaluate_retrieval(query, text, strategies)\n\n# Step 4：分析哪种策略的最高相似度最高（说明检索到的最相关块更纯粹）</code></pre><p><strong>关键观察点</strong>：相同 <code>chunk_size</code> 下，语义边界切分通常检索相似度更高；过粗的切分（大段落）相似度反而低，因为向量是多话题平均，与问题向量距离更远。</p>"},{"qnum":5,"qtext":"如何从零实现一个支持多策略、可对比的文本切分工具？请描述核心设计决策。","answerHtml":"<p><strong>设计目标</strong>：支持四种策略，统一输出格式，能输出统计报告，易于扩展新策略。</p><pre><code class=\"language-python\">from abc import ABC, abstractmethod\nfrom dataclasses import dataclass\n\n@dataclass\nclass ChunkStats:\n    strategy: str\n    count: int\n    mean_size: float\n    std_size: float\n    min_size: int\n    max_size: int\n\n\nclass BaseSplitter(ABC):\n    @abstractmethod\n    def split(self, text: str) -&gt; list[str]:\n        ...\n\n    def analyze(self, text: str) -&gt; ChunkStats:\n        from statistics import mean, stdev\n        chunks = self.split(text)\n        sizes = [len(c) for c in chunks]\n        return ChunkStats(\n            strategy=self.__class__.__name__,\n            count=len(chunks),\n            mean_size=round(mean(sizes), 1) if sizes else 0,\n            std_size=round(stdev(sizes), 1) if len(sizes) &gt; 1 else 0,\n            min_size=min(sizes) if sizes else 0,\n            max_size=max(sizes) if sizes else 0,\n        )\n\n\nclass FixedCharSplitter(BaseSplitter):\n    def __init__(self, chunk_size=400, overlap=80):\n        self.chunk_size = chunk_size\n        self.overlap = overlap\n\n    def split(self, text: str) -&gt; list[str]:\n        chunks, start = [], 0\n        while start &lt; len(text):\n            chunks.append(text[start:start + self.chunk_size].strip())\n            start += self.chunk_size - self.overlap\n        return [c for c in chunks if c]\n\n\n# RecursiveCharacterSplitter、SentenceSplitter 继承 BaseSplitter，各自实现 split()\n\ndef compare_all(text: str, splitters: list[BaseSplitter]) -&gt; None:\n    print(f&quot;{&#x27;策略&#x27;:&lt;30}{&#x27;块数&#x27;:&gt;6}{&#x27;均值&#x27;:&gt;8}{&#x27;标准差&#x27;:&gt;8}{&#x27;最小&#x27;:&gt;8}{&#x27;最大&#x27;:&gt;8}&quot;)\n    print(&quot;-&quot; * 70)\n    for sp in splitters:\n        s = sp.analyze(text)\n        print(f&quot;{s.strategy:&lt;30}{s.count:&gt;6}{s.mean_size:&gt;8}{s.std_size:&gt;8}&quot;\n              f&quot;{s.min_size:&gt;8}{s.max_size:&gt;8}&quot;)</code></pre><p><strong>三个核心设计决策</strong>：</p><ul><li>**抽象基类 <code>BaseSplitter</code>**：统一接口，<code>compare_all</code> 不关心策略内部实现；新增策略只加一个子类，不改比较框架</li><li>**<code>analyze()</code> 放在基类**：统计逻辑复用，各策略天然支持统计报告，无需重复实现</li><li>**<code>ChunkStats</code> dataclass**：结构化输出，比返回 dict 更类型安全，方便后续扩展（如画分布直方图）</li></ul>"}]},{"name":"Embedding 与向量检索","questions":[{"qnum":1,"qtext":"Embedding 模型的\"一致性约束\"是什么？违反后会出现什么问题？","answerHtml":"<p>一致性约束是指：RAG 流程中，对文档 Chunk 进行向量化（离线构建）和对用户问题进行向量化（在线检索）<strong>必须使用同一个 Embedding 模型</strong>。</p><p><strong>违反后的后果</strong>：不同 Embedding 模型产生的向量处于不同的语义空间——即使两个向量的维度相同，它们的坐标系也完全不同，余弦相似度计算结果毫无意义。</p><pre><code>类比：用厘米尺量文档（建立索引），用英寸尺量问题（在线查询）\n      结果：12 厘米和 12 英寸看起来都是 12，但实际对比的是两个不同单位，毫无意义\n\nEmbedding 层面：\n  模型 A 认为&quot;退款&quot;→ [0.8, 0.1, ...]\n  模型 B 认为&quot;退款&quot;→ [0.3, 0.7, ...]\n  用 A 建库，用 B 查询 → 两个向量在各自空间里都合理，但放在一起比余弦相似度是随机的</code></pre><p><strong>实践影响</strong>：一旦上线后更换 Embedding 模型，必须<strong>重新向量化全部文档</strong>并重建索引——这是一个有运维成本的操作，因此模型选型要尽早确定。</p>"},{"qnum":2,"qtext":"余弦相似度、内积、L2 距离三种度量方式有什么区别？RAG 场景为什么通常选余弦相似度？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>度量</th><th>公式</th><th>范围</th><th>受向量长度影响</th><th>RAG 适用性</th></tr></thead><tbody><tr><td>余弦相似度</td><td><code>(A·B)/(‖A‖·‖B‖)</code></td><td>[-1, 1]</td><td>否（只看方向）</td><td><strong>首选</strong></td></tr><tr><td>内积（点积）</td><td><code>A·B</code></td><td>无限制</td><td>是（长度影响结果）</td><td>仅在向量归一化后等价于余弦</td></tr><tr><td>L2 距离</td><td><code>√Σ(aᵢ-bᵢ)²</code></td><td>[0, ∞)</td><td>是</td><td>图像/数值特征，文本场景少用</td></tr></tbody></table></div><p><strong>为什么 RAG 选余弦相似度</strong>：</p><p>文本的 Embedding 向量长度会随文本长度变化——短问题（5 个字）的向量模通常比长段落（200 个字）小。如果用内积，&quot;语义完全相同但文字更多&quot;的段落会因为向量模更大而得到更高分，这不是我们想要的排序逻辑。余弦相似度只看两个向量的<strong>方向夹角</strong>，消除了长度带来的偏差，让语义相近程度直接决定排序结果。</p><p><strong>实践速查</strong>：</p><pre><code>score ≥ 0.85 → 语义非常相近，高度相关\n0.7–0.85    → 相关，通常可以作为参考资料\n0.5–0.7     → 弱相关，需要结合其他条件判断\n&lt; 0.5       → 关系很小，通常过滤掉</code></pre>"},{"qnum":3,"qtext":"API-based Embedding 和本地 Embedding 模型如何选择？各自的适用场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>API-based</th><th>本地模型</th></tr></thead><tbody><tr><td>代表方案</td><td>DeepSeek Embedding、OpenAI text-embedding-3-small</td><td>sentence-transformers（MiniLM / BGE）</td></tr><tr><td>向量维度</td><td>1024–1536</td><td>384–1024</td></tr><tr><td>效果</td><td>较强，商用级优化</td><td>略低，但中文 BGE 系列效果优秀</td></tr><tr><td>成本</td><td>按 Token 计费</td><td>零 API 成本（有硬件成本）</td></tr><tr><td>数据隐私</td><td>数据需发送到云端</td><td>数据留在本地</td></tr><tr><td>延迟</td><td>100–300ms（网络 I/O）</td><td>5–50ms（CPU 推理）</td></tr><tr><td>适用阶段</td><td>生产环境，对效果要求高</td><td>学习/原型/数据敏感场景</td></tr></tbody></table></div><p><strong>决策树</strong>：</p><pre><code>数据能出境且预算充足？\n  → 是 → API-based（DeepSeek 或 OpenAI）\n  → 否 → 本地模型\n\n本地模型选型：\n  纯学习/原型             → MiniLM-L12-v2（轻量，中英文双语）\n  生产中文知识库           → BAAI/bge-large-zh-v1.5（效果最强）\n  需要中文+英文均衡         → BAAI/bge-m3（多语言版本）</code></pre><p>入门阶段统一推荐 <code>paraphrase-multilingual-MiniLM-L12-v2</code>：约 120MB，免费，支持中英文，CPU 可运行，足以验证 RAG 完整流程。</p>"},{"qnum":4,"qtext":"向量检索中的 Top-K 和相似度阈值分别解决什么问题？应该如何配合使用？","answerHtml":"<p><strong>Top-K</strong> 解决&quot;返回多少结果&quot;的问题：</p><ul><li>K 过小（K=1）：上下文信息量不足，模型可能因为缺少关键细节而回答不完整</li><li>K 过大（K=10）：引入太多低相关内容，占用过多 Context Token 且容易干扰模型判断</li><li>经验值：<code>top_k=3</code> 是大多数场景的合理起点</li></ul><p><strong>相似度阈值（min_score）</strong> 解决&quot;什么都没检索到时如何拒绝&quot;的问题：</p><pre><code>场景：用户问&quot;明天天气怎么样&quot;，知识库全是产品文档\n\n无阈值：top-1 结果 score=0.38，强行返回一段完全不相关的文档\n        → 模型收到无关资料，可能生成幻觉或胡乱联系\n\n有阈值（min_score=0.6）：score=0.38 &lt; 0.6，过滤掉，返回空列表\n                         → RAG 层报告&quot;无相关文档&quot;→ 模型可以诚实说不知道</code></pre><p><strong>配合使用策略</strong>：</p><pre><code class=\"language-python\">results = index.search(query_vec, top_k=3)\nresults = [r for r in results if r[&quot;score&quot;] &gt;= 0.6]\n\nif not results:\n    return &quot;根据当前知识库，未找到与您问题相关的信息。&quot;</code></pre><p>阈值不是越高越好——过高会导致&quot;宁愿拒答也不回答&quot;的体验；过低则相当于没有阈值。建议先用 0.5–0.6 起步，根据实际拒答率调整。</p>"},{"qnum":5,"qtext":"如何从零构建一个支持持久化、批量向量化、带阈值过滤的 RAG 检索组件？请描述核心设计决策。","answerHtml":"<p>核心设计原则：<strong>Embedding 模型可替换 + 向量存储与检索逻辑分离 + 批量 API 调用降成本</strong>。</p><pre><code class=\"language-python\">class EmbeddingModel:\n    &quot;&quot;&quot;统一封装 API 和本地两种 Embedding 来源，外部调用方无感知&quot;&quot;&quot;\n    def __init__(self, mode=&quot;local&quot;):  # mode: &quot;local&quot; | &quot;api&quot;\n        ...\n    def embed(self, texts: list[str]) -&gt; list[list[float]]:\n        ...  # 内部分发：local 用 sentence-transformers，api 用 OpenAI SDK\n\n@dataclass\nclass VectorStore:\n    &quot;&quot;&quot;纯 numpy 实现的向量索引，支持 JSON 持久化&quot;&quot;&quot;\n    texts: list[str]\n    embeddings: list[list[float]]\n    metadatas: list[dict]\n\n    def search(self, query_vec, top_k=3, min_score=0.0) -&gt; list[dict]:\n        # 矩阵归一化 + 矩阵乘法，一次计算所有余弦相似度\n        scores = (matrix_normed) @ q_norm\n        return [r for r in top_k_results if r[&quot;score&quot;] &gt;= min_score]\n\n    def save(self, path): json.dump(...)\n    def load(cls, path): ...\n\nclass RAGRetriever:\n    &quot;&quot;&quot;上层门面，对外暴露 build + retrieve 两个接口&quot;&quot;&quot;\n    def build_from_texts(self, chunks, metadatas=None):\n        vecs = self.embedder.embed(chunks)  # 批量向量化\n        self.store.add(chunks, vecs, metadatas)\n\n    def retrieve(self, query, top_k=3, min_score=0.5) -&gt; list[dict]:\n        q_vec = self.embedder.embed([query])[0]\n        return self.store.search(q_vec, top_k, min_score)</code></pre><p><strong>三个核心设计决策</strong>：</p><ul><li>**<code>EmbeddingModel</code> 隔离 API/本地差异**：调用方（<code>RAGRetriever</code>）只调用 <code>embedder.embed(texts)</code>，切换 API/本地只改构造函数参数，不改检索逻辑</li><li><strong>矩阵运算代替循环</strong>：<code>matrix_normed @ q_norm</code> 一次算出全部相似度，比 for 循环逐一计算快 10–100 倍</li><li>**<code>min_score</code> 过滤在 <code>VectorStore.search</code> 内完成**：不在上层判断，保证&quot;空结果&quot;和&quot;有结果&quot;两个分支都被统一处理，调用方不需要额外过滤逻辑</li></ul>"}]},{"name":"RAG 问答生成","questions":[{"qnum":1,"qtext":"RAG 场景下上下文拼接的\"Lost in the Middle\"效应是什么？如何缓解？","answerHtml":"<p>&quot;Lost in the Middle&quot; 是斯坦福 2023 年研究提出的现象：当 Prompt 中有多段检索文本时，模型对开头和结尾部分的注意力显著高于中间部分，中间的内容容易被忽视。</p><pre><code>模型注意力分布示意（Context 中的位置 vs 关注程度）：\n\n  开头 ████████████████████ 高\n  中间 ████░░░░░░░░░░░░░░░░ 低\n  末尾 ████████████████     较高\n\n实验结论：同样的关键信息，放在开头或末尾，模型引用率比放中间高约 20%</code></pre><p><strong>缓解策略</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>策略</th><th>做法</th><th>适用场景</th></tr></thead><tbody><tr><td>相关度降序（默认）</td><td>最相关 Chunk 排第一（开头优势）</td><td>Top-K ≤ 3 时简单有效</td></tr><tr><td>&quot;三明治&quot;排列</td><td>最相关排末尾，其余降序在前</td><td>有明确最佳命中 Chunk 时</td></tr><tr><td>控制 Chunk 数量</td><td>Top-K=3 而非 10，减少中间层</td><td>通用推荐</td></tr><tr><td>精准切分</td><td>Chunk 语义纯粹，不混入多话题</td><td>治本，而非治标</td></tr></tbody></table></div>"},{"qnum":2,"qtext":"为什么 RAG 需要\"只根据资料回答\"约束？不加约束会出现什么问题？","answerHtml":"<p>大模型有&quot;不愿说不知道&quot;的倾向——当知识不确定时，宁愿生成&quot;听起来合理&quot;的内容，而不是承认局限。RAG 场景中如果没有约束，模型会把检索到的资料和训练数据中的&quot;已有知识&quot;混合使用，产生<strong>RAG 幻觉</strong>：</p><pre><code>场景：知识库只有产品 A 的退款政策（30天）\n\n用户问：产品 B 能退款吗？\n检索结果：[产品 A 退款条款]（最相关的内容，但与 B 无关）\n\n无约束回答：\n  &quot;根据通用退款政策，产品 B 可以在 30 天内退款。&quot;\n  → 把 A 的规则&quot;推断&quot;成了 B 的规则，看起来权威但完全是捏造的\n\n有约束回答：\n  &quot;参考资料中仅包含产品 A 的退款政策，未涉及产品 B。\n   建议直接联系客服确认产品 B 的退款条款。&quot;\n  → 诚实地反映了资料的边界，用户知道应该去哪里找答案</code></pre><p>约束的核心价值：<strong>让系统的可信度可预测</strong>——用户知道这个系统只说它&quot;知道&quot;的事，不会冒充专家随意发挥。</p>"},{"qnum":3,"qtext":"RAG 中拒答逻辑应该在检索层还是生成层实现？两者有何区别？","answerHtml":"<p>两层拒答解决的是不同的问题，应该同时实现：</p><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>检索层拒答（min_score 阈值）</th><th>生成层拒答（模型自判断）</th></tr></thead><tbody><tr><td>触发条件</td><td>向量相似度低于阈值，没有足够相关的 Chunk</td><td>Chunk 存在但模型认为与问题实际无关</td></tr><tr><td>实现方式</td><td><code>if not results: return &quot;拒答文案&quot;</code></td><td>System Prompt 中的约束指令</td></tr><tr><td>优点</td><td>确定性强、节省 LLM 调用成本</td><td>能处理&quot;检索到但内容无关&quot;的情况</td></tr><tr><td>缺点</td><td>阈值敏感，过高误拒、过低漏放</td><td>依赖模型遵守指令，不如代码逻辑稳定</td></tr><tr><td>适用场景</td><td>完全无关的问题（节省 API 费用）</td><td>边界情况（Chunk 相关但内容不够）</td></tr></tbody></table></div><pre><code class=\"language-python\"># 双层拒答的正确写法\nresults = store.search(q_vec, top_k=3, min_score=0.6)  # 检索层\n\nif not results:   # 检索层拒答：直接返回，不调用 LLM\n    return &quot;根据现有知识库，未找到相关信息。&quot;\n\nanswer = llm_generate(query, results)   # 生成层可能自行判断&quot;资料不够&quot;\nreturn answer</code></pre><p>两层协同：检索层是&quot;硬拒绝&quot;（快速、节省成本），生成层是&quot;软拒绝&quot;（处理检索层漏网的边界情况）。</p>"},{"qnum":4,"qtext":"RAG 的 temperature 应该设多少？和普通对话有何不同？","answerHtml":"<p>RAG 场景的核心目标是<strong>忠实地从资料中提取和整理信息</strong>，这需要确定性而非创造性，因此 temperature 通常比普通对话低得多：</p><div class=\"table-wrap\"><table><thead><tr><th>场景</th><th>推荐 temperature</th><th>原因</th></tr></thead><tbody><tr><td>RAG 问答（精确）</td><td>0.0–0.1</td><td>同一问题多次调用结果一致，方便测试和验证</td></tr><tr><td>普通对话</td><td>0.7</td><td>需要一定多样性和自然感</td></tr><tr><td>创意写作</td><td>1.0–1.5</td><td>需要高随机性</td></tr><tr><td>代码生成</td><td>0.0</td><td>语法和逻辑不能随机</td></tr></tbody></table></div><p><strong>为什么 RAG 不用 0.0 而用 0.1</strong>：temperature=0.0 会导致完全确定性的输出，但不同版本的模型对同一个 <code>temperature=0.0</code> 的处理方式可能有细微差异；0.1 保留了极少量随机性，让回答在语言流畅性上稍微自然一些，同时对事实准确性几乎没有影响。</p><p><strong>关键判断</strong>：如果 RAG 系统用于生产，回答需要可测试（同一问题每次答案要基本一致），就使用低 temperature。如果只是演示，可以适当提高到 0.3 让语言更自然。</p>"},{"qnum":5,"qtext":"如何从零设计一个端到端的 RAG 问答系统？描述各模块的职责和接口。","answerHtml":"<p>端到端 RAG 由五个阶段组成，每个阶段有明确的输入输出契约：</p><pre><code>【离线构建阶段】\nDocumentLoader.load(path) → Document(text, source, ...)\n       ↓\nTextSplitter.split(text) → list[str]（Chunks）\n       ↓\nEmbeddingModel.embed(chunks) → list[list[float]]\n       ↓\nVectorStore.add(chunks, vecs, metadatas) → None\nVectorStore.save(path) → 持久化到磁盘\n\n【在线问答阶段】\n用户输入 query\n       ↓\nEmbeddingModel.embed([query]) → list[float]\n       ↓\nVectorStore.search(q_vec, top_k=3, min_score=0.6) → list[dict]\n       ↓\n空列表 → 直接返回拒答文案（不调用 LLM）\n       ↓\nbuild_prompt(query, results) → messages（system + user）\n       ↓\nLLM.generate(messages, temperature=0.1) → str\n       ↓\n返回最终回答</code></pre><p><strong>各模块接口设计原则</strong>：</p><pre><code class=\"language-python\"># 统一文档格式，使加载器可替换\n@dataclass\nclass Document:\n    text: str; source: str; metadata: dict\n\n# 切分器可替换（固定字符 / 递归 / 句子）\nclass BaseSplitter:\n    def split(self, text: str) -&gt; list[str]: ...\n\n# Embedding 可替换（API / 本地）\nclass EmbeddingModel:\n    def embed(self, texts: list[str]) -&gt; list[list[float]]: ...\n\n# 向量库可替换（numpy / FAISS / Chroma）\nclass VectorStore:\n    def add(self, texts, vecs, metadatas=None): ...\n    def search(self, q_vec, top_k=3, min_score=0.5) -&gt; list[dict]: ...\n    def save(self, path) / load(cls, path): ...\n\n# 上层 Pipeline：组合所有模块\nclass RAGPipeline:\n    def build(self, docs_dir: str): ...\n    def ask(self, query: str) -&gt; str: ...</code></pre><p><strong>三个工程关键点</strong>：</p><ul><li><strong>每层只暴露最小接口</strong>：<code>ask(query)</code> 返回字符串，调用方不需要感知检索/生成的内部细节</li><li><strong>拒答必须在 LLM 之前</strong>：<code>if not results: return</code> 放在生成调用之前，节省 API 费用</li><li><strong>模块替换不影响上层</strong>：换 Embedding 模型或向量库只改 <code>RAGPipeline.__init__</code>，<code>ask()</code> 的逻辑完全不动</li></ul>"}]},{"name":"RAG 引用与可解释性","questions":[{"qnum":1,"qtext":"为什么 RAG 系统需要引用机制？引用解决了什么问题？","answerHtml":"<p>引用机制让用户能追溯答案的来源，是 RAG 系统可解释性（Explainability）的核心保障。它解决了 Day 19 &quot;只根据资料回答&quot;约束遗留的一个关键问题——用户无法区分答案来自知识库还是模型&quot;脑补&quot;。</p><pre><code>没有引用的回答：\n  &quot;购买后 30 天内可申请全额退款。&quot;\n  → 用户疑问：这 30 天的规定从哪来的？是模型编的吗？\n\n有引用的回答：\n  &quot;购买后 30 天内可申请全额退款 [1]。&quot;\n  [1] 退款政策：购买后 30 天内可申请全额退款...\n  → 用户可以核实，对系统产生信任</code></pre><p>引用的三个层次：</p><div class=\"table-wrap\"><table><thead><tr><th>层次</th><th>做法</th><th>价值</th></tr></thead><tbody><tr><td>L1 标记引用</td><td>在回答中标注来源编号</td><td>最低成本，让用户知道&quot;有出处&quot;</td></tr><tr><td>L2 展示来源</td><td>回答后附上引用原文片段</td><td>用户可直接核实，无需另外查找</td></tr><tr><td>L3 可验证</td><td>程序校验引用编号是否真实、内容是否匹配</td><td>防止模型&quot;虚构引用&quot;，保证引用可信</td></tr></tbody></table></div><p>引用与 Day 19 拒答的关系：拒答保证&quot;不知道时不说&quot;，引用保证&quot;知道时给出依据&quot;，两者共同构成 RAG 的可解释性。</p>"},{"qnum":2,"qtext":"自然语言引用和结构化 JSON 引用有什么本质区别？为什么推荐结构化输出？","answerHtml":"<p>自然语言引用是让模型在回答文本中写&quot;根据[资料1]&quot;，结构化引用是让模型输出 JSON <code>{&quot;answer&quot;: &quot;...&quot;, &quot;sources&quot;: [1]}</code>，两者有三个本质区别：</p><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>自然语言引用</th><th>结构化 JSON 引用</th></tr></thead><tbody><tr><td>格式稳定性</td><td>模型可能写&quot;[1]&quot;、&quot;资料1&quot;、&quot;根据资料1&quot;等不一致格式</td><td>JSON 字段固定，格式稳定</td></tr><tr><td>可解析性</td><td>需要正则或再调一次模型提取编号</td><td><code>json.loads()</code> 直接取 <code>sources</code></td></tr><tr><td>可校验性</td><td>无法可靠映射编号到资料做验证</td><td>整数列表可直接和检索结果索引匹配</td></tr></tbody></table></div><p>自然语言引用的核心问题：</p><pre><code>模型可能输出：&quot;根据[资料1]和[资料3]，退款时间为 30 天&quot;\n→ 要从自然语言中提取 &quot;1&quot; 和 &quot;3&quot; 需要额外解析，且不可靠\n\n结构化输出：\n{&quot;answer&quot;: &quot;退款时间为 30 天&quot;, &quot;sources&quot;: [1, 3]}\n→ 直接取 sources=[1,3]，可以和检索结果做索引匹配</code></pre><p>结构化输出的设计要点：<code>answer</code> 字段保持纯文本不含引用标记（展示时由程序决定标注方式），<code>sources</code> 字段用整数列表（可直接做索引匹配），<code>sources</code> 只放实际存在的编号（防止越界）。</p>"},{"qnum":3,"qtext":"什么是\"虚构引用\"？有哪些类型？如何检测？","answerHtml":"<p>虚构引用是指模型在结构化输出中声称引用了某条资料，但实际上该资料中并没有相关内容——这比不引用更危险，因为用户以为有出处，实际是幻觉。</p><p>三种虚构引用类型：</p><div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>表现</th><th>检测难度</th><th>检测方法</th></tr></thead><tbody><tr><td>编号越界</td><td>sources=[5]，但只有 3 条资料</td><td>简单</td><td>检查编号是否在 1–N 范围内</td></tr><tr><td>编号有效但内容不匹配</td><td>sources=[3]，但 [3] 中没有 answer 的内容</td><td>困难</td><td>语义匹配：检查 answer 与引用资料的共享关键词</td></tr><tr><td>遗漏引用</td><td>answer 非空但 sources 为空</td><td>中等</td><td>检查 answer 非空时 sources 是否也非空</td></tr></tbody></table></div><pre><code class=\"language-python\">def validate_citation(rag_answer, contexts):\n    issues = []\n    valid_sources = []\n    # 防线 1：编号有效性\n    for src in rag_answer.sources:\n        if 1 &lt;= src &lt;= len(contexts):\n            valid_sources.append(src)\n        else:\n            issues.append(f&quot;引用编号 {src} 越界&quot;)\n    # 防线 2：拒答一致性\n    is_refusal = &quot;无法回答&quot; in rag_answer.answer\n    if is_refusal and valid_sources:\n        issues.append(&quot;拒答但仍有引用，存在矛盾&quot;)\n    # 防线 3：内容匹配性（粗粒度关键词检查）\n    for src in valid_sources:\n        ctx_text = contexts[src - 1][&quot;text&quot;]\n        if not extract_shared_keywords(rag_answer.answer, ctx_text):\n            issues.append(f&quot;引用 [{src}] 与回答内容不匹配，可能为虚构引用&quot;)\n    return {&quot;is_valid&quot;: len(issues) == 0, &quot;valid_sources&quot;: valid_sources, &quot;issues&quot;: issues}</code></pre><p>类型 2（内容不匹配）最难检测——粗粒度关键词匹配可以拦截明显的不匹配，但更精确的校验需要语义相似度或额外模型调用，成本较高。生产环境中先用关键词匹配做粗筛，高价值场景再引入语义校验。</p>"},{"qnum":4,"qtext":"引用校验的\"三道防线\"分别解决什么问题？为什么缺一不可？","answerHtml":"<p>三道防线分别解决不同类型的引用问题，覆盖从&quot;格式合法性&quot;到&quot;语义合理性&quot;的完整校验链路：</p><div class=\"table-wrap\"><table><thead><tr><th>防线</th><th>检查内容</th><th>拦截的虚构类型</th><th>为什么缺一不可</th></tr></thead><tbody><tr><td>1. 编号有效性</td><td>sources 中的编号是否在 1–N 范围内</td><td>越界引用</td><td>拦截&quot;不存在的资料编号&quot;，防止展示时索引越界报错</td></tr><tr><td>2. 拒答一致性</td><td>answer=&quot;无法回答&quot; 时 sources 是否为空</td><td>逻辑矛盾</td><td>拦截&quot;说了不知道却又引用了资料&quot;的自相矛盾输出</td></tr><tr><td>3. 内容匹配性</td><td>引用资料与 answer 是否有共享关键词</td><td>内容虚构</td><td>拦截&quot;编号合法但内容无关&quot;最危险的幻觉引用</td></tr></tbody></table></div><p>三道防线的协同关系：</p><pre><code>防线 1（格式层）→ 过滤越界编号，保证 sources 指向真实存在的资料\n    ↓\n防线 2（逻辑层）→ 检查拒答与引用的一致性，保证输出不自相矛盾\n    ↓\n防线 3（语义层）→ 检查引用内容与回答的匹配度，拦截&quot;有编号但内容对不上&quot;的虚构\n\n只有防线 1：越界问题解决了，但&quot;编号合法、内容虚构&quot;的幻觉漏网\n只有防线 1+2：逻辑矛盾解决了，但&quot;编号和逻辑都对、内容却无关&quot;的问题漏网\n三道齐全：从格式 → 逻辑 → 语义，层层递进，覆盖最广</code></pre><p>防线 3 是粗粒度关键词匹配而非精确语义校验，原因：关键词匹配成本极低（纯 Python 字符串操作），能拦截最明显的内容不匹配；精确语义校验需要额外 Embedding 或模型调用，成本高，留到高价值场景按需引入。</p>"},{"qnum":5,"qtext":"如何从零设计一个带引用溯源和校验的 RAG 问答系统？描述核心设计决策。","answerHtml":"<p>核心设计原则：<strong>结构化输出保证可解析 + 三道防线保证可信 + 引用展示保证可追溯</strong>。</p><pre><code class=\"language-python\">from pydantic import BaseModel, Field\n\nclass RAGAnswer(BaseModel):\n    &quot;&quot;&quot;带引用的回答结构&quot;&quot;&quot;\n    answer: str = Field(description=&quot;基于参考资料生成的回答&quot;)\n    sources: list[int] = Field(description=&quot;引用的资料编号列表&quot;)\n\nclass CitedRAGPipeline:\n    def ask(self, query: str) -&gt; str:\n        # 1. 检索（Day 18）\n        results = self.store.search(embed([query])[0], top_k=3, min_score=0.55)\n        if not results:\n            return &quot;根据当前知识库，未找到相关信息。&quot;  # 检索层拒答\n\n        # 2. 生成带引用的回答（response_format 强制 JSON）\n        prompt = build_citation_prompt(query, results)\n        raw = self.llm_call(prompt, response_format={&quot;type&quot;: &quot;json_object&quot;})\n        rag_answer = RAGAnswer(**json.loads(raw))\n\n        # 3. 引用校验（三道防线）\n        validation = validate_citation(rag_answer, results)\n\n        # 4. 格式化展示（回答 + 引用区块 + 警告）\n        return format_cited_answer(rag_answer, results, validation)</code></pre><p>三个核心设计决策：</p><ul><li><strong>answer 与 sources 分离</strong>：<code>answer</code> 保持纯文本不含 <code>[1]</code> 标记，引用信息独立放在 <code>sources</code> 列表。展示时由程序决定标注方式（方括号、上标、超链接），而非让模型在自然语言中混入标记。好处是格式稳定、可程序化处理、展示灵活。</li></ul><ul><li><strong>三道防线分层校验</strong>：编号有效性（格式层）→ 拒答一致性（逻辑层）→ 内容匹配性（语义层），从简单到复杂递进。每层解决不同类型的虚构引用，防线 1 和 2 成本极低（纯逻辑判断），防线 3 用粗粒度关键词匹配保证零额外 API 成本。校验结果通过 <code>issues</code> 列表反馈给展示层，用户可以看到&quot;⚠ 引用 [3] 与回答内容不匹配&quot;的警告。</li></ul><ul><li><strong>校验结果不影响主流程</strong>：即使引用校验发现问题，系统仍然返回回答（附带警告），而不是直接拦截。原因：虚构引用的检测是&quot;概率性&quot;的（尤其防线 3 的关键词匹配可能有误报），直接拦截会导致误拒；让用户看到回答 + 警告，由用户自行判断更合理。生产环境可以根据 <code>issues</code> 数量设置分级策略（如 1 个 issue 只警告，3 个以上 issue 标记&quot;低可信度&quot;）。</li></ul>"}]},{"name":"第 3 周综合复盘","questions":[{"qnum":1,"qtext":"第 3 周（Day 15–20）六个主题之间是什么逻辑关系？RAG 各环节如何相互影响？","answerHtml":"<p>第 3 周的六个主题是同一条数据流的六个连续环节——<strong>把&quot;私有文档&quot;转化为&quot;可信回答&quot;</strong>，是一条串联依赖链，每个环节的输出是下一个环节的输入：</p><div class=\"table-wrap\"><table><thead><tr><th>顺序</th><th>Day</th><th>主题</th><th>输入</th><th>输出</th><th>关键影响</th></tr></thead><tbody><tr><td>1</td><td>16</td><td>读取文档</td><td>磁盘文件</td><td>干净文本</td><td>噪音决定后续信噪比</td></tr><tr><td>2</td><td>17</td><td>文本切分</td><td>干净文本</td><td>Chunks</td><td>切分质量决定检索颗粒度</td></tr><tr><td>3</td><td>18</td><td>Embedding</td><td>Chunks</td><td>向量索引</td><td>向量质量决定检索相似度</td></tr><tr><td>4</td><td>18</td><td>向量检索</td><td>问题+索引</td><td>相关 Chunks</td><td>召回率决定答案上界</td></tr><tr><td>5</td><td>19</td><td>问答生成</td><td>问题+Chunks</td><td>回答文本</td><td>Prompt 约束决定忠实度</td></tr><tr><td>6</td><td>20</td><td>引用校验</td><td>回答+Chunks</td><td>可信回答</td><td>校验决定用户信任度</td></tr></tbody></table></div><p><strong>串联依赖的关键结论</strong>：RAG 的质量上限由最弱的环节决定。再好的 LLM 也救不了&quot;文档噪音太多&quot;；再好的 Embedding 模型也救不了&quot;关键句子被切断到两个 Chunk 里&quot;。不能只调 Prompt，而忽略上游数据质量。</p>"},{"qnum":2,"qtext":"RAG 准确率主要受哪些环节影响？每个环节出问题时典型表现是什么？","answerHtml":"<p>RAG 准确率有两层：检索准确率（找到答案）和生成准确率（忠实表达答案），两者是串联关系——检索准确率是生成准确率的上界。</p><div class=\"table-wrap\"><table><thead><tr><th>环节</th><th>典型问题表现</th><th>根本原因</th><th>诊断方法</th></tr></thead><tbody><tr><td>文档读取</td><td>正确答案在文档里，但未被召回</td><td>噪音稀释了 Chunk 向量</td><td>打印原始读取文本，看有无页眉页脚乱码</td></tr><tr><td>文本切分</td><td>模型说&quot;资料不足&quot;，但内容跨两个相邻 Chunk</td><td>语义边界被截断</td><td>打印 Top-K Chunks，看答案是否被切断</td></tr><tr><td>Embedding</td><td>中文问题匹配不到中文文档</td><td>使用了纯英文 Embedding 模型</td><td>换多语言模型（如 paraphrase-multilingual-MiniLM）</td></tr><tr><td>相似度阈值</td><td>问有答案的问题却拒答</td><td>min_score 设置过高</td><td>临时降到 0.0 看是否召回，定位阈值问题</td></tr><tr><td>Prompt 约束</td><td>模型混入训练知识回答，来源不可追溯</td><td>约束指令不够明确</td><td>在 System Prompt 明确&quot;未在资料中的内容必须拒答&quot;</td></tr></tbody></table></div><p><strong>诊断优先级</strong>：先打印检索结果（<code>top_k=5, min_score=0.0</code>），确认答案在不在检索结果里；在的话改 Prompt，不在的话往上游（切分/读取）查。大多数&quot;答案不准&quot;问题出在检索层，不是生成层。</p>"},{"qnum":3,"qtext":"Chunk 切分策略为什么会直接影响 RAG 最终回答的质量？影响路径是什么？","answerHtml":"<p>切分影响质量有三条独立的传导路径：</p><p><strong>路径一：语义截断 → 向量失真 → 检索遗漏</strong></p><pre><code>&quot;退款需在 30 天内提交。提交后 3-5 天退回。&quot;\n     ↓  在&quot;提交&quot;后切断\nChunk A：&quot;退款需在 30 天内提交&quot;（不含处理时长）\nChunk B：&quot;提交后 3-5 天退回&quot;（不含前置条件）\n     ↓\n问&quot;退款处理多久&quot; → Chunk A、B 分别独立检索均不完整 → 回答残缺</code></pre><p><strong>路径二：Chunk 过小 → 上下文碎片化 → 生成质量差</strong></p><p>Chunk 过小时，一个完整意思散落在 5 个 Chunk 里，拼接后语义跳跃，LLM 无法整合出完整答案。</p><p><strong>路径三：Chunk 过大 → 向量被稀释 → 相似度虚低</strong></p><p>单个 Chunk 包含退款+发货+会员多话题时，与&quot;退款问题&quot;的相似度被非退款内容拉低，可能排名靠后而错过召回。</p><p><strong>实用参数选择</strong>：通用文档用 300 Token / 50 Token Overlap，先跑通再根据召回效果调整。Overlap 的作用是保证&quot;关键句子必然完整出现在至少一个 Chunk 里&quot;，不是越大越好（浪费存储和 API 成本）。</p>"},{"qnum":4,"qtext":"为什么引用来源在业务场景中比单纯的答案准确率更重要？","answerHtml":"<p>引用解决的不是&quot;答案对不对&quot;，而是&quot;用户能否验证答案&quot;——这是两个不同层次的问题。</p><p><strong>信任度不等于准确率</strong>：一个系统准确率 95% 意味着每 20 个问题有 1 个错误。如果没有引用，用户不知道哪 1 个是错的，只能选择全信或全不信。有了引用，用户可以在&quot;重要决策&quot;时验证，在&quot;日常查询&quot;时直接接受，建立有边界的信任。</p><p><strong>错误信息的传播成本</strong>：</p><pre><code>无引用系统的错误答案：\n  &quot;退款需要 3 天&quot; → 用户直接相信 → 告诉朋友 → 10 个人产生错误预期\n  → 企业直到大量投诉才发现问题\n\n有引用系统的错误答案：\n  &quot;退款需要 3 天 [1]&quot; + [1] 实际写的是&quot;5 天&quot;\n  → 用户查看原文，发现矛盾 → 反馈给企业 → 企业快速修复知识库</code></pre><p><strong>业务必要性按场景</strong>：企业客服和法律/医疗场景中，错误答案可能导致法律纠纷（如错误承诺退款时间），引用使企业能追溯答案来源，证明&quot;我们的答案来自这份政策文档&quot;；内部工作助手中，员工向上级说明依据时需要引用原始政策文件，而不是&quot;AI 说的&quot;。</p>"},{"qnum":5,"qtext":"如果让你从零搭建一个\"第 3 周成果汇总\"完整 RAG Demo，你会如何设计它的架构？","answerHtml":"<p>核心设计原则：<strong>模块接口清晰 + 组件可替换 + 每步可观测</strong>。</p><pre><code>week3_rag/\n├── document_loader.py  # Document dataclass + load_txt/load_md/load_pdf\n├── text_splitter.py    # RecursiveCharacterSplitter（可配置 size/overlap）\n├── embedding.py        # EmbeddingModel（API 版/本地版可切换）\n├── vector_store.py     # VectorStore（numpy → FAISS → Chroma 可升级）\n├── rag_generator.py    # build_prompt + 约束生成 + 双层拒答\n├── citation.py         # RAGAnswer + validate_citation（三道防线）\n└── rag_pipeline.py     # RAGPipeline.build() + RAGPipeline.ask()</code></pre><pre><code class=\"language-python\"># rag_pipeline.py — 核心组合逻辑\nclass RAGPipeline:\n    def build(self, docs: list[Document]) -&gt; None:\n        chunks = [c for doc in docs for c in self.splitter.split(doc.text)]\n        sources = [doc.source for doc in docs for _ in self.splitter.split(doc.text)]\n        vecs = self.embedder.embed(chunks)\n        self.store.add(chunks, vecs, sources)\n\n    def ask(self, query: str) -&gt; str:\n        results = self.store.search(self.embedder.embed([query])[0], top_k=3, min_score=0.55)\n        if not results:\n            return &quot;根据当前知识库，未找到相关信息。&quot;\n        raw = self.llm_call(build_citation_prompt(query, results))\n        rag_answer = RAGAnswer(**json.loads(raw))\n        validation = validate_citation(rag_answer, results)\n        return format_cited_answer(rag_answer, results, validation)</code></pre><p><strong>三个关键工程决策</strong>：</p><ul><li>**<code>build</code> 与 <code>ask</code> 严格分离**：索引只建一次，<code>ask</code> 每次只做&quot;问题向量化 + 检索 + 生成&quot;，不重复向量化文档。这是 RAG 性能的根本保证。</li></ul><ul><li><strong>每层输入输出用数据类约束</strong>：<code>Document</code>、<code>RAGAnswer</code> 用 dataclass 定义，不用裸字典。换组件时只改实现，接口不变，上层代码零修改。</li></ul><ul><li><strong>校验结果展示，不拦截</strong>：<code>validate_citation</code> 的问题通过 <code>issues</code> 列表附加到回答末尾（⚠ 警告），不直接丢弃回答。理由：关键词匹配是粗粒度的，误报率不低；让用户看到警告自行判断，比&quot;悄悄丢弃&quot;更透明。</li></ul>"}]},{"name":"Tool Calling 基础","questions":[{"qnum":1,"qtext":"\"回答问题\"和\"调用工具做事\"的本质区别是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>普通对话（回答问题）</th><th>Tool Calling（调用工具）</th></tr></thead><tbody><tr><td>数据来源</td><td>训练时冻结的知识</td><td>运行时从外部实时获取</td></tr><tr><td>是否有副作用</td><td>无（只生成文字）</td><td>有（可写数据库、发邮件、调 API）</td></tr><tr><td>回答依据</td><td>模型&quot;记忆&quot;</td><td>外部系统的确定性返回值</td></tr><tr><td>数据新鲜度</td><td>知识截止日期限制</td><td>每次调用都是最新数据</td></tr></tbody></table></div><p><strong>直觉类比</strong>：普通对话的模型像一本百科全书（只能告诉你书里写的内容）；Tool Calling 的模型像一个带手机的顾问（可以实时搜索、打电话，告诉你现在的真实情况）。</p><p>问&quot;今天北京天气&quot;：普通对话只能给出泛泛的季节性描述；Tool Calling 可以调用天气 API 返回今天的实时温度。</p>"},{"qnum":2,"qtext":"Tool Calling 的完整交互流程是什么？每一步做了什么？","answerHtml":"<p>完整流程分 5 步，横跨两次 API 调用：</p><div class=\"table-wrap\"><table><thead><tr><th>步骤</th><th>谁做</th><th>做什么</th></tr></thead><tbody><tr><td>1</td><td>你的代码</td><td>把工具定义（<code>tools</code> 参数）+ 对话历史发给模型</td></tr><tr><td>2</td><td>模型</td><td>判断是否需要工具，若需要则返回 <code>tool_calls</code>（而不是普通文字回答）</td></tr><tr><td>3</td><td>你的代码</td><td>解析 <code>tool_calls</code>，执行对应的 Python 函数，得到结果</td></tr><tr><td>4</td><td>你的代码</td><td>把工具结果以 <code>role: &quot;tool&quot;</code> 消息追加进历史，再次发给模型</td></tr><tr><td>5</td><td>模型</td><td>基于工具结果生成最终自然语言回答</td></tr></tbody></table></div><pre><code class=\"language-python\"># Step 2 的关键检查\nmsg = response.choices[0].message\nif msg.tool_calls:        # 需要调用工具\n    for tc in msg.tool_calls:\n        result = dispatch(tc.function.name, json.loads(tc.function.arguments))\n        messages.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                         &quot;content&quot;: json.dumps(result)})\n    # Step 5：第二次 create()\n    final = client.chat.completions.create(model=..., messages=messages, tools=TOOLS)\nelse:                     # 直接回答，不需要工具\n    answer = msg.content</code></pre><p><code>tool_call_id</code> 的作用：当模型一次返回多个 <code>tool_calls</code> 时，每个工具结果通过 <code>id</code> 对应到具体请求，避免混淆。</p>"},{"qnum":3,"qtext":"工具定义（Function Schema）中 name、description、parameters 各有什么作用？如何写好 description？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>作用</th><th>写不好的后果</th></tr></thead><tbody><tr><td><code>name</code></td><td>模型用这个名字在 <code>tool_calls</code> 里标记要调用哪个函数</td><td>命名不清晰，调试时难以识别</td></tr><tr><td><code>description</code></td><td>模型靠这段文字判断&quot;是否该调用这个工具&quot;</td><td>描述模糊 → 模型调错工具或不调工具</td></tr><tr><td><code>parameters</code></td><td>告诉模型该传什么参数，是 JSON Schema 格式</td><td>约束不清 → 模型传错类型或遗漏必填项</td></tr></tbody></table></div><p><strong>写好 description 的四个要素</strong>：</p><pre><code class=\"language-python\"># 好的 description\n&quot;获取指定城市的当前实时天气，返回温度（摄氏度）、天气状况和风速。&quot;\n&quot;仅适用于查询当前天气，不支持历史数据和未来预报。&quot;\n\n# 要素分解：\n# 1. 工具能做什么：&quot;获取指定城市的当前实时天气&quot;\n# 2. 返回什么格式：&quot;返回温度（摄氏度）、天气状况和风速&quot;\n# 3. 适用边界：&quot;仅适用于当前天气查询&quot;\n# 4. 不适用场景：&quot;不支持历史数据和未来预报&quot;（防止滥用）</code></pre><p><strong>参数 description 同样重要</strong>：每个参数的 <code>description</code> 字段告诉模型如何填写该参数，如 <code>&quot;城市名称，例如&#x27;北京&#x27;、&#x27;上海&#x27;&quot;</code> 比 <code>&quot;城市&quot;</code> 对模型更有指导意义。</p>"},{"qnum":4,"qtext":"如何从零实现一个最小的 Tool Calling Demo？描述关键代码的设计思路。","answerHtml":"<p>最小实现的三个核心设计：<strong>工具注册分离、统一分发器、两次 API 调用</strong>。</p><pre><code class=\"language-python\"># 1. 工具定义（JSON Schema）与实现函数分开管理\nTOOLS = [{&quot;type&quot;: &quot;function&quot;, &quot;function&quot;: {\n    &quot;name&quot;: &quot;get_weather&quot;,\n    &quot;description&quot;: &quot;获取城市实时天气&quot;,\n    &quot;parameters&quot;: {&quot;type&quot;: &quot;object&quot;,\n                   &quot;properties&quot;: {&quot;city&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;城市名&quot;}},\n                   &quot;required&quot;: [&quot;city&quot;]}\n}}]\n\ndef get_weather(city: str) -&gt; dict:\n    return {&quot;city&quot;: city, &quot;temp&quot;: 25, &quot;condition&quot;: &quot;晴&quot;}  # 真实场景调外部 API\n\n# 2. 统一分发器：将模型返回的函数名映射到实际函数\nTOOL_FUNCTIONS = {&quot;get_weather&quot;: get_weather}\ndef dispatch_tool(name, args): return TOOL_FUNCTIONS[name](**args)\n\n# 3. 两次 API 调用的核心逻辑\ndef chat_with_tools(user_input: str) -&gt; str:\n    messages = [{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input}]\n    # 第一次：模型决策\n    resp = client.chat.completions.create(model=&quot;deepseek-chat&quot;,\n                                          messages=messages, tools=TOOLS, tool_choice=&quot;auto&quot;)\n    msg = resp.choices[0].message\n    if not msg.tool_calls:\n        return msg.content   # 不需要工具，直接返回\n    # 执行工具\n    messages.append(msg)\n    for tc in msg.tool_calls:\n        result = dispatch_tool(tc.function.name, json.loads(tc.function.arguments))\n        messages.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                         &quot;content&quot;: json.dumps(result, ensure_ascii=False)})\n    # 第二次：生成最终回答\n    final = client.chat.completions.create(model=&quot;deepseek-chat&quot;, messages=messages, tools=TOOLS)\n    return final.choices[0].message.content</code></pre><p><strong>三个设计决策的理由</strong>：</p><ul><li><strong>工具注册与实现分离</strong>：<code>TOOLS</code>（Schema）和 <code>TOOL_FUNCTIONS</code>（函数）解耦，新增工具只加一行 Schema + 一个函数，主流程零改动</li><li><strong>统一分发器</strong>：把 <code>if name == &quot;get_weather&quot;: ...</code> 的条件分支改成字典映射，可扩展性强，且工具名错误时能统一报错</li><li>**<code>tool_choice=&quot;auto&quot;</code>**：让模型自己判断是否调用工具；<code>&quot;none&quot;</code> 禁用工具（测试用），<code>&quot;required&quot;</code> 强制调用（特殊场景）</li></ul>"}]},{"name":"定义工具","questions":[{"qnum":1,"qtext":"工具参数设计有哪些核心原则？必填参数和可选参数如何决策？","answerHtml":"<p>工具参数不是给人用的，是给 <strong>LLM 填写</strong>的——设计目标是让模型在不需要额外解释的情况下正确填写每个参数。</p><p><strong>四个核心原则</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>原则</th><th>说明</th><th>反例</th></tr></thead><tbody><tr><td>参数名自解释</td><td><code>city</code> 比 <code>c</code> 好，<code>user_id</code> 比 <code>uid</code> 好</td><td>参数名 <code>data</code>，描述&quot;数据&quot;</td></tr><tr><td>每个参数只传一类信息</td><td>城市和国家用两个参数，不要用一个&quot;地址&quot;参数</td><td><code>location: &quot;中国北京&quot;</code></td></tr><tr><td>参数数量控制</td><td>5 个以内；超过就考虑拆分工具</td><td>15 个参数的单工具</td></tr><tr><td>可选参数给合理默认值</td><td><code>unit=&quot;celsius&quot;</code> 比让模型每次都填好</td><td>没有默认值的可选参数</td></tr></tbody></table></div><p><strong>必填 vs 可选决策</strong>：工具在没有这个参数时能正常运行 → 可选；不能 → 必填。如果有默认行为，必须在 description 里说明缺省时的行为。</p><p><strong>enum 的作用</strong>：选项型参数用 enum 锁定所有合法值，比只写 description 的限制效果强得多：</p><pre><code class=\"language-python\"># 弱约束：模型可能填 &quot;celsius&quot;、&quot;c&quot;、&quot;摄氏度&quot; 等不一致的值\n&quot;unit&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;温度单位&quot;}\n\n# 强约束：模型只能填这两个值\n&quot;unit&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;enum&quot;: [&quot;celsius&quot;, &quot;fahrenheit&quot;]}</code></pre>"},{"qnum":2,"qtext":"工具函数的返回值应该如何设计才对 LLM\"友好\"？","answerHtml":"<p>LLM 会把工具返回值序列化成字符串传入对话，设计原则是<strong>让模型容易理解和引用</strong>。</p><p><strong>三个设计原则</strong>：</p><ul><li><strong>平铺优于嵌套</strong>：模型处理 <code>result[&quot;rate&quot;]</code> 比 <code>result[&quot;data&quot;][&quot;exchange&quot;][&quot;rate&quot;]</code> 更可靠</li><li><strong>包含语义上下文</strong>：数值旁边附上单位和含义</li><li><strong>提供 summary 字段</strong>：预先整合的自然语言描述，模型可以直接引用</li></ul><pre><code class=\"language-python\"># 不友好（缩写字段名 + 纯数字 + 深嵌套）\n{&quot;t&quot;: 25, &quot;c&quot;: &quot;sun&quot;, &quot;data&quot;: {&quot;w&quot;: {&quot;speed&quot;: 3}}}\n\n# 友好（自解释 + 有单位 + 有 summary）\n{\n    &quot;city&quot;: &quot;北京&quot;,\n    &quot;temperature_celsius&quot;: 25,\n    &quot;condition&quot;: &quot;晴天&quot;,\n    &quot;wind_level&quot;: &quot;3 级&quot;,\n    &quot;summary&quot;: &quot;北京今天晴天，25°C，3 级风，适合户外活动&quot;\n}</code></pre><p><strong>summary 的价值</strong>：为复杂数据提供预先整合好的自然语言描述，模型无需自己拼接多个字段，减少幻觉风险。特别是在数据有多个维度时（天气 = 温度 + 天气状况 + 风速 + 湿度），summary 可以帮助模型生成更准确、更流畅的回答。</p>"},{"qnum":3,"qtext":"工具出错时应该返回错误 dict 还是抛异常？两种方式有什么区别？","answerHtml":"<p>推荐<strong>返回错误 dict</strong>，而不是抛异常。</p><div class=\"table-wrap\"><table><thead><tr><th>对比维度</th><th>抛异常</th><th>返回错误 dict</th></tr></thead><tbody><tr><td>对话流程</td><td>中断，需要在 dispatch 层捕获</td><td>不中断，错误信息传给模型</td></tr><tr><td>模型感知</td><td>看不到错误信息</td><td>能看到 message，可生成友好提示</td></tr><tr><td>用户体验</td><td>程序可能崩溃或返回技术栈信息</td><td>模型解释&quot;城市名不对，您是否想查...&quot;</td></tr><tr><td>适用场景</td><td>程序级不可恢复错误（配置错误）</td><td>业务级可解释错误（输入无效、API 超时）</td></tr></tbody></table></div><pre><code class=\"language-python\"># 标准错误返回格式\ndef get_weather(city: str) -&gt; dict:\n    if not city.strip():\n        return {&quot;error&quot;: True, &quot;message&quot;: &quot;城市名不能为空&quot;}   # 模型能读懂并向用户解释\n    result = call_api(city)\n    if result is None:\n        return {&quot;error&quot;: True, &quot;message&quot;: f&quot;未找到城市 &#x27;{city}&#x27; 的天气数据，请检查名称&quot;}\n    return result</code></pre><p>当模型接收到 <code>{&quot;error&quot;: True, &quot;message&quot;: &quot;未找到城市 &#x27;Abc&#x27; 的天气数据&quot;}</code> 时，它可以生成&quot;抱歉，我没有找到 Abc 的天气数据，请确认城市名称是否正确，或者尝试英文名称&quot;，而不是让程序崩溃。</p>"},{"qnum":4,"qtext":"如何验证工具定义（Function Schema）的质量？有哪些常见的规范问题？","answerHtml":"<p>工具 Schema 的质量直接影响模型是否能正确判断&quot;何时调用&quot;和&quot;如何填参数&quot;，上线前应该做系统性检查。</p><p><strong>常见规范问题</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>问题类型</th><th>表现</th><th>修复方式</th></tr></thead><tbody><tr><td>description 过短</td><td>少于 20 字，缺少关键信息</td><td>补充能做什么 + 适用边界</td></tr><tr><td>参数缺少 description</td><td>模型只能靠参数名猜含义</td><td>每个参数都加 description + 示例</td></tr><tr><td>选项型参数未用 enum</td><td>模型可能填不一致的值</td><td>加 <code>&quot;enum&quot;: [...]</code> 锁定取值</td></tr><tr><td>必填参数设置过多</td><td>把可选参数也设成必填</td><td>能有默认值的改为可选</td></tr><tr><td>工具描述互相重叠</td><td>两个工具功能相似，模型不知选哪个</td><td>在 description 里明确各自的使用边界</td></tr></tbody></table></div><pre><code class=\"language-python\">def validate_tool_schema(schema: dict) -&gt; list[str]:\n    issues = []\n    fn = schema.get(&quot;function&quot;, {})\n    if not fn.get(&quot;description&quot;) or len(fn[&quot;description&quot;]) &lt; 20:\n        issues.append(&quot;description 过短，建议 ≥ 20 字&quot;)\n    for name, param in fn.get(&quot;parameters&quot;, {}).get(&quot;properties&quot;, {}).items():\n        if not param.get(&quot;description&quot;):\n            issues.append(f&quot;参数 &#x27;{name}&#x27; 缺少 description&quot;)\n    return issues</code></pre><p><strong>实际验证方法</strong>：schema 静态检查之外，还要<strong>实测模型行为</strong>——用 5–10 个不同措辞的问题测试工具能否被正确触发，以及参数填写是否准确。</p>"},{"qnum":5,"qtext":"如何从零设计一个可被 LLM 调用的工具库？描述模块结构和关键设计决策。","answerHtml":"<p>核心设计原则：<strong>工具实现与 Schema 定义同文件、统一分发器、工具可独立测试</strong>。</p><pre><code>tools/\n├── __init__.py          # 汇总所有工具的 SCHEMA + 分发器\n├── weather.py           # get_weather 函数 + WEATHER_TOOL_SCHEMA\n├── exchange_rate.py     # get_exchange_rate 函数 + EXCHANGE_RATE_TOOL_SCHEMA\n├── knowledge_base.py    # search_knowledge_base 函数 + KB_TOOL_SCHEMA\n└── tests/\n    └── test_tools.py    # 每个工具的独立测试（正常路径 + 错误路径）</code></pre><pre><code class=\"language-python\"># tools/__init__.py — 统一入口\nfrom .weather import get_weather, WEATHER_TOOL_SCHEMA\nfrom .exchange_rate import get_exchange_rate, EXCHANGE_RATE_TOOL_SCHEMA\nfrom .knowledge_base import search_knowledge_base, KNOWLEDGE_BASE_TOOL_SCHEMA\n\nALL_TOOLS = [WEATHER_TOOL_SCHEMA, EXCHANGE_RATE_TOOL_SCHEMA, KNOWLEDGE_BASE_TOOL_SCHEMA]\n\nTOOL_REGISTRY = {\n    &quot;get_weather&quot;: get_weather,\n    &quot;get_exchange_rate&quot;: get_exchange_rate,\n    &quot;search_knowledge_base&quot;: search_knowledge_base,\n}\n\ndef dispatch(name: str, args: dict) -&gt; dict:\n    if name not in TOOL_REGISTRY:\n        return {&quot;error&quot;: True, &quot;message&quot;: f&quot;未知工具：{name}&quot;}\n    return TOOL_REGISTRY[name](**args)</code></pre><p><strong>三个关键设计决策</strong>：</p><ul><li><strong>Schema 与实现同文件</strong>：<code>WEATHER_TOOL_SCHEMA</code> 和 <code>get_weather</code> 在同一个文件里，避免修改函数参数时忘记同步 Schema，减少&quot;Schema 和实现不一致&quot;的 bug</li></ul><ul><li><strong>统一分发器 + 注册表</strong>：<code>TOOL_REGISTRY</code> 字典替代 <code>if/elif</code> 条件分支，新增工具只加一行注册，不改主流程；工具名不存在时统一报错</li></ul><ul><li><strong>工具必须能独立运行</strong>：每个工具文件的 <code>if __name__ == &quot;__main__&quot;</code> 块可以直接运行测试，不依赖 LLM 环境——这是发现参数设计问题的最快方式，在接入模型之前就能排除大部分问题</li></ul>"}]},{"name":"多步工作流","questions":[{"qnum":1,"qtext":"单步工具调用和多步工作流在结构上有什么本质区别？","answerHtml":"<p>核心区别是<strong>工具调用次数是否在运行时确定</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>单步（Day 24）</th><th>多步（Day 25）</th></tr></thead><tbody><tr><td>API 调用次数</td><td>固定 2 次（决策 + 生成）</td><td>N+1 次（N 由模型自主决定）</td></tr><tr><td>实现结构</td><td><code>if msg.tool_calls: 执行; 第二次调用</code></td><td><code>while iteration &lt; max_iter: 执行; if not tool_calls: break</code></td></tr><tr><td>调用链长度</td><td>最多 1 个工具</td><td>0 到 max_iter 个工具</td></tr><tr><td>适用问题</td><td>单一数据源查询（&quot;北京天气&quot;）</td><td>多数据源综合（&quot;上海出差，带500美元够吗，天气怎样&quot;）</td></tr></tbody></table></div><p>单步 = 固定两次 API 调用；多步 = 循环 N+1 次，N 由模型在每一轮的 <code>tool_calls</code> 是否为空决定。</p>"},{"qnum":2,"qtext":"多步工作流中的循环应该什么时候退出？有哪些终止条件？","answerHtml":"<p>有三种退出条件，<strong>前两种是必须实现的</strong>：</p><p><strong>条件 1（正常）：模型不再请求工具</strong></p><pre><code class=\"language-python\">if not msg.tool_calls:\n    return msg.content   # 模型认为信息已够，直接回答</code></pre><p>这是最理想的退出方式，模型自主判断&quot;我已经有足够信息了&quot;。</p><p>**条件 2（安全）：达到最大迭代次数 <code>max_iterations</code>**</p><pre><code class=\"language-python\">for iteration in range(max_iter):\n    ...\nelse:\n    # for 循环正常结束（未被 break 打断）= 达到上限\n    return force_generate_answer(messages)</code></pre><p>防止模型在工具返回错误或 Bug 时无限调用，产生大量 API 费用。</p><p><strong>条件 3（可选）：连续 N 次工具调用均返回错误</strong></p><pre><code class=\"language-python\">consecutive_errors += 1\nif consecutive_errors &gt;= 3:\n    return &quot;工具暂时不可用，请稍后再试。&quot;</code></pre><p>适合对可靠性要求高的生产场景。</p>"},{"qnum":3,"qtext":"为什么多步工作流必须设置 max_iterations 上限？不设置会有什么风险？","answerHtml":"<p><code>max_iterations</code> 是多步工作流的<strong>安全阀</strong>，防止两类问题：</p><p><strong>风险 1：模型 Bug 导致无限循环</strong></p><pre><code>异常场景：工具返回了空结果 {}，模型认为&quot;还需要数据&quot;继续调用 → 工具还是返回空 → ...\n无上限：无限循环直到 API 超时或账单耗尽\n有上限：第 6 次迭代强制退出，生成基于已有信息的回答</code></pre><p><strong>风险 2：Token 成本累积超预期</strong></p><pre><code>第 N 次 API 调用的输入 Token = Σ(前 N-1 次的所有工具调用结果) + 系统提示 + 用户输入\n→ 随迭代次数增加，每次调用的 Token 消耗线性增长\n→ 10 次迭代的总 Token ≈ 1 次的 4–5 倍\n\n有上限：明确限制最大成本区间，避免单次对话成本暴增</code></pre><p><strong>推荐值</strong>：通用助手 <code>max_iter=5</code>；复杂 Agent <code>max_iter=10</code>；生产环境根据 <code>预算 / 单次平均成本</code> 计算。</p>"},{"qnum":4,"qtext":"多步工作流的\"可观测性\"指什么？如何实现调用链日志？","answerHtml":"<p>可观测性指能从外部看清楚工作流内部每一步发生了什么，包含三个层次：</p><ul><li><strong>层次 1（基础）</strong>：调用了几次工具、分别是哪些</li><li><strong>层次 2（调试）</strong>：每次调用的入参、出参（能定位&quot;哪一步出了问题&quot;）</li><li><strong>层次 3（审计）</strong>：每次调用的耗时、Token 消耗、决策理由</li></ul><p><strong>实现要点</strong>：</p><pre><code class=\"language-python\">for iteration in range(max_iter):\n    # 记录决策\n    logger.info(&quot;[迭代 %d] 工具：%s&quot;, iteration, [tc.function.name for tc in msg.tool_calls])\n    \n    for tc in msg.tool_calls:\n        t = time.monotonic()\n        result = registry[tc.function.name](**args)\n        \n        # 记录工具结果（用 summary 字段，避免日志过长）\n        logger.info(&quot;  %s(%s) → %s（%.3fs）&quot;, tc.function.name, args,\n                    result.get(&quot;summary&quot;, str(result)[:60]), time.monotonic() - t)</code></pre><p>同时可以把每步记录到 <code>WorkflowResult.steps</code>（dataclass），用于：</p><ul><li>事后分析哪类问题会触发几步工具调用</li><li>将调用链展示在 UI 界面上（Day 26 的需求）</li><li>计算平均工具调用次数，优化 max_iter 设置</li></ul>"},{"qnum":5,"qtext":"如何从零实现一个支持多步推理、带调用链记录的工作流 Demo？描述关键设计决策。","answerHtml":"<p>核心设计：<strong>while 循环 + max_iter 安全上限 + for-else 强制生成 + WorkflowResult 记录</strong>。</p><pre><code class=\"language-python\">@dataclass\nclass WorkflowResult:\n    user_input: str\n    final_answer: str\n    steps: list = field(default_factory=list)  # 每步 ToolStep 记录\n    terminated_by: str = &quot;model_done&quot;          # &quot;model_done&quot; | &quot;max_iterations&quot;\n\ndef run_workflow(user_input, max_iter=6):\n    wf = WorkflowResult(user_input=user_input)\n    messages = [system_msg, {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input}]\n    \n    for iteration in range(max_iter):\n        msg = client.chat.completions.create(\n            model=&quot;deepseek-chat&quot;, messages=messages,\n            tools=TOOLS, tool_choice=&quot;auto&quot;, temperature=0,\n        ).choices[0].message\n        \n        if not msg.tool_calls:      # ← 正常退出\n            wf.final_answer = msg.content\n            wf.terminated_by = &quot;model_done&quot;\n            break\n        \n        messages.append(msg)\n        for tc in msg.tool_calls:\n            result = TOOL_REGISTRY.get(tc.function.name, bad_tool)(**json.loads(tc.function.arguments))\n            wf.steps.append(ToolStep(tc.function.name, ...))\n            messages.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                             &quot;content&quot;: json.dumps(result, ensure_ascii=False)})\n    \n    else:   # for-else：循环未被 break 打断，说明达到 max_iter   ← 安全退出\n        wf.terminated_by = &quot;max_iterations&quot;\n        wf.final_answer = client.chat.completions.create(model=&quot;deepseek-chat&quot;,\n            messages=messages, temperature=0).choices[0].message.content\n    \n    return wf</code></pre><p><strong>五个关键设计决策</strong>：</p><ul><li><strong>for-else 语义</strong>：<code>for</code> 循环被 <code>break</code> 打断 → 正常退出（不执行 <code>else</code>）；循环跑完 → 达上限（执行 <code>else</code>），天然区分两种退出路径</li><li><strong>WorkflowResult dataclass</strong>：记录每步 ToolStep，支持事后分析和 UI 展示</li><li><strong>强制生成兜底</strong>：达到上限后不直接报错，而是基于已有历史消息调一次 API 生成尽量有用的回答</li><li>**<code>temperature=0</code>**：每次决策调用都用 0，保证同一问题的调用顺序可预测、可复现</li><li><strong>工具错误 dict 而非 raise</strong>：工具返回 <code>{&quot;error&quot;: True, ...}</code> 让模型感知并处理，而不是程序崩溃</li></ul>"}]},{"name":"单工具调用 Demo","questions":[{"qnum":1,"qtext":"tool_choice 参数的 auto / none / required 三种模式有什么区别？各适用于什么场景？","answerHtml":"<p><code>tool_choice</code> 控制模型在收到工具列表后的决策行为：</p><div class=\"table-wrap\"><table><thead><tr><th>模式</th><th>行为</th><th>典型场景</th></tr></thead><tbody><tr><td><code>&quot;auto&quot;</code>（默认）</td><td>模型自主判断是否调用工具；需要时返回 <code>tool_calls</code>，不需要时直接回答</td><td>通用对话助手，用户可能问任何问题</td></tr><tr><td><code>&quot;none&quot;</code></td><td>禁用所有工具，即使注册了工具也不调用，只用训练知识回答</td><td>基线测试（对比有无工具时的回答质量）</td></tr><tr><td><code>&quot;required&quot;</code></td><td>强制模型必须调用至少一个工具，不允许直接文字回答</td><td>信息抽取流水线，需要保证每条输入都走工具路径</td></tr></tbody></table></div><p>还可以指定具体工具：</p><pre><code class=\"language-python\">tool_choice={&quot;type&quot;: &quot;function&quot;, &quot;function&quot;: {&quot;name&quot;: &quot;get_weather&quot;}}\n# → 强制调用 get_weather，参数由模型填写</code></pre><p>适用于批量抽取（强制每条数据都调用 <code>extract_info</code>）或测试特定工具的参数填写是否正确。</p><p>**生产环境默认用 <code>&quot;auto&quot;</code>**，它最符合用户期望：该触发时触发，不该触发时直接回答。</p>"},{"qnum":2,"qtext":"模型决定是否调用工具的依据是什么？哪些因素会影响触发稳定性？","answerHtml":"<p>模型的触发决策基于三个维度：</p><ul><li><strong>用户意图与工具能力的匹配度</strong>：用户问&quot;今天北京天气&quot; + <code>get_weather</code> → 高匹配 → 触发；问&quot;Python 是什么&quot; + <code>get_weather</code> → 无匹配 → 不触发</li></ul><ul><li><strong>工具 description 的清晰程度</strong>：</li></ul><pre><code>   模糊：&quot;获取数据&quot;\n   → 模型不知道什么时候用，触发边界不稳定\n   \n   清晰：&quot;获取指定城市的当前实时天气，仅适用于当前天气查询，不支持历史天气&quot;\n   → 模型准确知道触发边界，&quot;北京历史最冷温度&quot;不触发，&quot;今天北京天气&quot;触发</code></pre><ul><li><strong>模型对自身知识的自信度</strong>：基础知识问题（&quot;GIL 是什么&quot;）模型直接回答；实时状态问题（&quot;今天天气&quot;）倾向调用工具</li></ul><p><strong>提高触发稳定性的方法</strong>：</p><ul><li>优化 description：在 description 中明确&quot;适用于...&quot;和&quot;不适用于...&quot;的边界</li><li>添加 System Prompt 指导：<code>&quot;当用户询问任何当前天气时，必须先调用 get_weather 工具&quot;</code></li><li>设置 <code>temperature=0</code>：降低随机性，让触发行为更一致</li></ul>"},{"qnum":3,"qtext":"工具调用的完整 Demo 应该包含哪些要素？如何添加日志和耗时统计？","answerHtml":"<p>一个生产级 Demo 需要覆盖完整的&quot;决策 → 执行 → 回答&quot;闭环，并且可观测：</p><p><strong>核心要素</strong>：</p><ul><li>工具定义（Schema）和执行函数分离，通过注册表（<code>TOOL_REGISTRY</code>）关联</li><li>两次 API 调用结构：第一次决策（是否调用工具），第二次生成（基于工具结果回答）</li><li>分发器处理工具执行，统一处理未知工具和参数错误</li><li>工具错误时返回错误 dict 而不是抛异常，让模型生成友好提示</li></ul><p><strong>日志和耗时统计</strong>：</p><pre><code class=\"language-python\">import logging, time\n\nlogger = logging.getLogger(__name__)\n\ndef chat(user_input, history):\n    # 第一次调用：决策\n    t0 = time.monotonic()\n    resp1 = client.chat.completions.create(...)\n    elapsed1 = time.monotonic() - t0\n    \n    if not msg.tool_calls:\n        logger.info(&quot;直接回答（%.2fs，无工具调用）&quot;, elapsed1)\n        return msg.content, history\n    \n    logger.info(&quot;模型决定调用 %d 个工具（%.2fs）&quot;, len(msg.tool_calls), elapsed1)\n    \n    for tc in msg.tool_calls:\n        t_tool = time.monotonic()\n        result = TOOL_REGISTRY[tc.function.name](**args)\n        logger.info(&quot;  ← 工具返回（%.3fs）：%s&quot;, time.monotonic() - t_tool, result.get(&quot;summary&quot;))\n    \n    # 第二次调用：生成\n    t2 = time.monotonic()\n    ...\n    log
