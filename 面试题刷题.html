57 的生产就绪度检查清单关注的是系统整体的工程能力完备度。数据形式上，前者用测试 case 三元组（输入/预期工具/预期回答要点），后者用能力维度检查项（是否具备某项工程能力）。通过标准上，前者是逐条 case 是否通过、算通过率，后者是逐项能力是否具备、算就绪度分数。</p><pre><code class=\"language-python\">@dataclass\nclass ReadinessItem:\n    dimension: str; item: str; status: bool; note: str = &quot;&quot;</code></pre><p>两者互补：Agent 行为评估回答&quot;这个 Agent 干活干得对不对&quot;，生产就绪度检查清单回答&quot;这个系统具不具备支撑真实流量的工程能力&quot;——一个关注功能正确性，一个关注系统完备度。</p>"},{"qnum":6,"qtext":"路线 C 的七个阶段（可观测→成本→架构并发→上下文状态→安全→反馈→部署）分别对应解决了什么问题？","answerHtml":"<pre><code>可观测（Day 43-44）        → 看得见：知道系统怎么执行的\n成本可控（Day 45-47）       → 花得起：缓存/批处理/路由分别省不同类型的钱\n架构统一+防并发（Day 48-49） → 扛得住：网关统一入口，限流防止被打爆\n上下文+状态健壮（Day 50-51） → 不出错：请求内容装得对，跨请求状态丢不了\n安全防护（Day 53-54）       → 防得住：注入攻防+输出护栏两道防线\n反馈闭环（Day 55）          → 能改进：知道用户满不满意，能驱动下一轮迭代\n容器化部署（Day 56）        → 能上线：从本地 Demo 变成公开可访问的服务</code></pre><p>七个阶段层层递进，把 Day 42 那个&quot;能力完备但生产不可维护&quot;的 Agent，升级为具备生产可维护性特征的完整系统——这也是 Day 57 作为路线 C 收官日的核心总结。</p>"}]},{"name":"深化阶段·混合检索","questions":[{"qnum":1,"qtext":"向量检索和 BM25 检索分别擅长什么？为什么说两者互补？","answerHtml":"<p>两者在匹配方式、擅长领域、弱点三方面正好形成互补。匹配方式上，向量检索（稠密）靠语义相似度，BM25（稀疏）靠关键词精确匹配。擅长领域上，向量检索擅长同义改写、跨表达方式的语义关联，BM25 擅长专有名词、编号、精确术语。弱点上，向量检索对生僻词/专有名词的向量表示不够精确，BM25 则无法理解&quot;离职&quot;和&quot;解除劳动合同&quot;是同一件事。</p><p><strong>互补的原因</strong>：向量检索负责&quot;意思一样但说法不同&quot;，BM25 负责&quot;必须原文精确出现&quot;。真实业务场景里这两类查询同时存在（比如既有&quot;员工离职流程是什么&quot;这种语义类问题，也有&quot;产品型号 XJ-2024 保修期&quot;这种精确术语类问题），只用一种检索方式必然在另一类查询上表现差。</p>"},{"qnum":2,"qtext":"BM25 相比 TF-IDF 做了哪两个关键改进？","answerHtml":"<ul><li><strong>词频饱和</strong>：TF-IDF 里词频的重要性是无上限线性增长的，一个词出现 100 次不该被认为比出现 10 次重要 10 倍；BM25 让词频对得分的贡献存在上限</li><li><strong>文档长度归一化</strong>：长文档天然包含更多词，容易&quot;意外命中&quot;更多查询词；BM25 用 <code>|D|/avgdl</code>（文档长度相对平均长度的比例）做归一化，避免长文档 unfair 地占优</li></ul><pre><code>score(D, Q) = Σ IDF(qi) × [f(qi, D) × (k1 + 1)] / [f(qi, D) + k1 × (1 - b + b × |D|/avgdl)]</code></pre><p><code>k1</code> 控制词频饱和速度，<code>b</code> 控制文档长度归一化强度。</p>"},{"qnum":3,"qtext":"把向量检索和 BM25 的分数直接加权相加融合，会有什么问题？","answerHtml":"<p>两路分数完全不是同一个量纲：</p><pre><code>向量相似度: 0.82, 0.79, 0.75 ...（天然落在 0-1 区间）\nBM25 分数:  12.3, 8.7, 5.2 ...（数值范围完全不同，且随语料库规模变化）</code></pre><p>直接加权相加（如 <code>0.5 × vector_score + 0.5 × bm25_score</code>）会导致数值范围大的一路系统性地主导融合结果，而不是真正意义上的&quot;各占一半权重&quot;。要让加权融合生效，必须先对两路分数做归一化，且需要额外调权重比例——增加了不必要的调参复杂度。</p>"},{"qnum":4,"qtext":"RRF（Reciprocal Rank Fusion）是怎么工作的？为什么它能避开分数量纲不同的问题？","answerHtml":"<pre><code class=\"language-python\">def reciprocal_rank_fusion(result_lists, k=60):\n    scores = {}\n    for results in result_lists:\n        for rank, doc in enumerate(results, start=1):\n            scores[doc[&quot;text&quot;]] = scores.get(doc[&quot;text&quot;], 0.0) + 1.0 / (k + rank)\n    return sorted(scores.items(), key=lambda x: x[1], reverse=True)</code></pre><p>RRF 的核心思路是<strong>抛弃原始分数，只用排名</strong>——不管两路检索的分数量纲差多远，只看&quot;这篇文档在各自结果里排第几名&quot;，用 <code>1/(k+rank)</code> 累加。<code>k</code> 是平滑常数（通常取 60），避免排名靠前的文档分数过度陡峭。</p><p><strong>避开量纲问题的原因</strong>：排名是天然可比的（第 1 名就是第 1 名，不管背后的原始分数是 0.82 还是 12.3），完全不需要归一化或调权重，这是它比加权分数融合更鲁棒的根本原因。</p>"},{"qnum":5,"qtext":"混合检索在什么类型的查询上提升最明显？在什么类型的查询上提升不明显？","answerHtml":"<p>混合检索在精确术语类的查询上提升最明显，比如产品型号、错误代码、专有名词、编号这类查询，因为 BM25 那一路能精确命中包含准确字符串的文档，而向量检索对这类稀有 token 的语义表示往往不够精确。相反，在纯语义类查询上，也就是措辞不同但语义相关的自然语言问题，提升就不明显了——向量检索本身已经能较好覆盖这类查询，混合检索甚至可能因为 BM25 那一路引入噪音，反而轻微拉低融合排名。</p><p><strong>结论</strong>：是否需要上混合检索，取决于业务场景里&quot;精确匹配类查询&quot;的比例——纯闲聊或纯语义问答场景收益有限，涉及产品型号/错误代码/专业术语的知识库场景收益明显。</p>"},{"qnum":6,"qtext":"中文场景下用 BM25 做检索，为什么必须先用 jieba 分词，直接对原始字符串跑 BM25 会有什么问题？","answerHtml":"<pre><code class=\"language-python\">def tokenize(text: str) -&gt; list[str]:\n    &quot;&quot;&quot;中文需要先分词，BM25 本身只处理词元序列&quot;&quot;&quot;\n    return list(jieba.cut(text))</code></pre><p>BM25 的打分公式建立在词元级别的词频统计上，它得知道某个词在文档里出现了几次、在整个语料库里的逆文档频率是多少。英文天生用空格分隔单词，直接按空格切就能拿到词元；但中文没有这种天然的分隔符，如果不分词，直接把整句话当一个词元，或者按单字符切开，那像&quot;产品型号&quot;&quot;XJ-2024&quot;这种多字词的词频根本统计不对，查询词和文档词在词元层面也对不齐，BM25 打出来的分就完全失真了。所以中文场景必须先用 <code>jieba.cut</code> 这类分词工具把文本切成词元序列，再交给 <code>BM25Okapi</code> 去处理。</p>"},{"qnum":7,"qtext":"混合检索里，为什么向量索引和 BM25 索引必须基于同一批 chunk 构建，而不能各自独立选择切分策略？","answerHtml":"<pre><code class=\"language-python\">class HybridRetriever:\n    def __init__(self, chunks: list[str], vector_store):\n        self.vector_store = vector_store       # Day 18 的向量检索\n        self.bm25_retriever = BM25Retriever(chunks)   # 今天新加的关键词检索</code></pre><p><strong>关键点</strong>：两路检索基于<strong>同一批 chunk</strong> 建索引，保证融合时引用的是同一个文档集合，不会出现&quot;向量库有但 BM25 库没有&quot;的不一致。如果两路检索各自用不同的切分策略建索引，RRF 融合时同一篇原文可能在两路里对应的是内容不完全相同的两个 chunk，&quot;这篇文档在两路里的排名&quot;这个前提就不成立了，融合结果会失去意义。</p>"},{"qnum":8,"qtext":"Day 58 的 `HybridRetriever.dual_search()` 里，向量检索和 BM25 检索为什么可以并行执行？如果是远程向量库应该怎么做？","answerHtml":"<pre><code class=\"language-python\">def dual_search(self, query: str, top_k: int = 10) -&gt; tuple[list[dict], list[dict]]:\n    vector_results = self.vector_store.search(query, top_k=top_k)   # 稠密检索结果\n    bm25_results = self.bm25_retriever.search(query, top_k=top_k)   # 稀疏检索结果\n    return vector_results, bm25_results</code></pre><p>两路检索互相独立，谁也不依赖谁的结果（不像 Reranker 依赖粗召回的输出），因此可以并行执行。如果向量库是远程服务（如托管的 Chroma/Pinecone），可以用 <code>asyncio.gather</code> 并发发起向量检索请求和 BM25 检索（BM25 通常本地内存计算），复用 Day 46 批处理的并发思路，把两路检索的总耗时从&quot;串行相加&quot;降到&quot;取两者较慢的一路&quot;。</p>"}]},{"name":"深化阶段·Reranker 重排序","questions":[{"qnum":1,"qtext":"Bi-Encoder 和 Cross-Encoder 的本质区别是什么？为什么 Cross-Encoder 更准但更贵？","answerHtml":"<p>两者在编码方式、交互粒度、doc 是否可预计算三方面都不同。编码方式上，Bi-Encoder（向量检索）让 query 和 doc 独立编码，Cross-Encoder（Reranker）把 query 和 doc 拼接后一起编码。交互粒度上，Bi-Encoder 只在最后比较两个向量的相似度，Cross-Encoder 在模型内部注意力层就能直接捕捉词级交互。doc 是否可预计算上，Bi-Encoder 可以在检索前批量算好存库，Cross-Encoder 不行，每次都要重新计算。</p><p><strong>更准的原因</strong>：Cross-Encoder 把 query 和 doc 放在一起端到端地算了一遍，能捕捉到 Bi-Encoder 压缩进两个独立向量后丢失的交互信息。<strong>更贵的原因</strong>：正是因为不能预计算，每一次打分都要对这一对 query-doc 重新跑一遍完整的模型前向传播，无法像 Bi-Encoder 一样批量离线建索引。</p>"},{"qnum":2,"qtext":"为什么不能对全量文档直接用 Cross-Encoder 做检索？两阶段检索是怎么设计的？","answerHtml":"<p>假设知识库有 10 万条 chunk，对每个查询都用 Cross-Encoder 给全部 10 万条打分，意味着每次查询要跑 10 万次模型前向传播，延迟和算力成本都不可接受。两阶段检索的设计：</p><pre><code>粗召回（Day 58 混合检索）：快、便宜，覆盖优先，Top-N（如50）\n   ↓\n精排（Reranker）：慢、准，只处理 N 条候选，精度优先，Top-K（如5）</code></pre><p>粗召回牺牲一部分精度换取速度，尽量覆盖候选范围；精排在小范围候选内牺牲一部分速度换取精度——这和 Day 47 分级路由&quot;用最贵的资源做最关键的判断&quot;是同一种工程思路。</p>"},{"qnum":3,"qtext":"Reranker 精排阶段处理的是多少条候选？为什么不是全量文档？","answerHtml":"<p>只处理粗召回返回的 Top-N 候选（如 N=50），不涉及全量文档：</p><pre><code class=\"language-python\">def two_stage_retrieve(query, hybrid_retriever, reranker, coarse_n=50, final_k=5):\n    coarse_candidates = hybrid_retriever.dual_search(query, top_k=coarse_n)   # 先降到 50 条\n    fused = reciprocal_rank_fusion(coarse_candidates, k=60)[:coarse_n]\n    return reranker.rerank(query, fused, top_k=final_k)   # Reranker 只对这 50 条打分</code></pre><p>把候选数量从全量（如 10 万条）降到 50 条，Cross-Encoder 的计算量就变得完全可接受——这正是两阶段设计把 Reranker 的高成本控制在可承受范围的关键。</p>"},{"qnum":4,"qtext":"加 Reranker 后 Hit Rate 提升了，这个提升的本质是什么？","answerHtml":"<p>粗召回阶段（向量+BM25+RRF）本身已经能把正确文档&quot;捞进&quot;Top-N 候选，但受限于 Bi-Encoder 的向量压缩和 RRF 融合的排名规则，正确文档未必排进最终返回的 Top-K。Reranker 用更精细的交互式打分重新排序这批候选，能把&quot;排名靠后但其实相关&quot;的正确文档重新拉到前面。</p><p><strong>本质</strong>：Reranker 提升的是&quot;排序准不准&quot;，不是&quot;能不能找到&quot;——它只是把已经在候选池里的正确文档排到更靠前的位置，而不是从候选池之外把文档&quot;变出来&quot;。</p>"},{"qnum":5,"qtext":"如果正确文档没有出现在最终 Top-K 结果里，应该先怀疑粗召回还是精排出了问题？","answerHtml":"<p>应该先怀疑<strong>粗召回</strong>。因为 Reranker 只能对粗召回返回的 Top-N 候选重新排序，如果正确文档在粗召回阶段就没有进入这 N 条候选，Reranker 根本没有机会看到它，自然无法把它排进最终结果。</p><p><strong>排查顺序</strong>：先检查正确文档是否在粗召回的 Top-N 里（如果 N=50 都没进去，说明混合检索/RRF 融合环节有问题，可能需要调整 Chunk 切分或检索策略）；如果确认正确文档在 Top-N 里但被排到了 Top-K 之外，才需要检查 Reranker 模型本身的打分是否合理。<strong>粗召回决定&quot;能不能找到&quot;，精排只决定&quot;排序准不准&quot;</strong>，这也是为什么粗召回阶段的 Top-N 要设置得足够大，覆盖率优先于速度。</p>"},{"qnum":6,"qtext":"常见的开源 Reranker 模型有哪些？分别适合什么场景，应该怎么选型？","answerHtml":"<p>常见的开源 Reranker 模型大概有三种。第一种是 BAAI 的 <code>bge-reranker-base</code> 和 <code>bge-reranker-large</code>，中英双语效果好，开源可以本地部署，<code>base</code> 版本速度快，<code>large</code> 版本精度更高。第二种是 <code>cross-encoder/ms-marco-MiniLM-L-6-v2</code>，英文场景比较常用，模型轻量，由 sentence-transformers 官方维护。第三种是 Cohere Rerank API，属于商业 API，不需要自己部署，多语言效果稳定，按调用量计费。</p><p><strong>选型建议</strong>：中文场景优先 <code>bge-reranker</code>（本地部署，无额外 API 成本）；不想自己维护模型、预算允许的场景可以直接用 Cohere Rerank 这类托管服务。</p>"},{"qnum":7,"qtext":"Hit Rate@K 这个评估指标是怎么定义的？对比\"加 Reranker 前后\"效果的评估脚本是怎么设计的？","answerHtml":"<pre><code>Hit Rate@K = 命中的查询数 / 总查询数\n（命中 = 正确文档出现在返回的 Top-K 结果里）</code></pre><p>评估脚本需要一份标注好&quot;正确文档 ID&quot;的测试集，分别用两个检索函数跑同一批查询：一个是&quot;粗召回直接截断 Top-K&quot;（<code>coarse_only</code>），一个是&quot;粗召回 + Reranker 精排后取 Top-K&quot;（<code>with_reranker</code>），再对比两者的 <code>evaluate_hit_rate()</code> 结果：</p><pre><code class=\"language-python\">hit_rate_before = evaluate_hit_rate(EVAL_SET, coarse_only, top_k=5)\nhit_rate_after = evaluate_hit_rate(EVAL_SET, with_reranker, top_k=5)</code></pre><p><strong>记忆点</strong>：Hit Rate 只关心&quot;正确文档在不在 Top-K 里&quot;，不关心排在第几名，这也是为什么它能干净地量化 Reranker 带来的排序质量提升。</p>"}]},{"name":"深化阶段·HyDE","questions":[{"qnum":1,"qtext":"什么是 query-document mismatch？为什么直接用问题检索有时候效果不好？","answerHtml":"<p>用户问题通常是口语化的疑问句，知识库文档通常是陈述句、说明文，两者在语言风格、句式结构、用词习惯上天然存在差异：</p><pre><code>用户问题：&quot;东西坏了怎么办，能退吗&quot;（口语化疑问句）\n知识库文档：&quot;产品质量问题处理流程：……&quot;（正式陈述句）</code></pre><p>即使讨论的是同一件事，问题的向量表示更像&quot;疑问句的语义&quot;，文档的向量表示更像&quot;说明文的语义&quot;，两者在向量空间里的距离可能没有想象中近——这种&quot;问题和答案文体不同导致检索不准&quot;的现象就是 query-document mismatch，是纯向量检索甚至加上 BM25 都难以彻底解决的结构性问题。</p>"},{"qnum":2,"qtext":"HyDE 的核心思路是什么？为什么生成的假设答案不需要保证内容准确？","answerHtml":"<p>核心思路：不直接用问题去检索，而是先让模型针对问题生成一段&quot;假设性答案&quot;，再用这段假设答案的 Embedding 去检索。</p><pre><code>传统检索：用户问题 → Embedding → 检索知识库\nHyDE 检索：用户问题 → LLM生成假设答案 → 对假设答案做Embedding → 检索知识库</code></pre><p><strong>不需要准确的原因</strong>：假设答案从来不会返回给用户，只是一个&quot;用来检索的中间媒介&quot;，它的价值在于<strong>文体和措辞风格更接近真实文档</strong>，而不在于内容本身是否准确——即使假设答案里有编造的细节（幻觉），只要文体贴近知识库文档，检索效果依然能提升。</p>"},{"qnum":3,"qtext":"HyDE 检索流程的三个步骤是什么？关键区别在哪一步？","answerHtml":"<pre><code>Step 1：LLM 针对问题生成假设性答案（要求文体正式陈述、贴近文档风格，不要求准确）\nStep 2：对假设答案做 Embedding（不是对原始问题做 Embedding）\nStep 3：用假设答案的向量去检索知识库</code></pre><p><strong>关键区别在 Step 2</strong>：检索用的向量来自&quot;假设答案&quot;而不是&quot;原始问题&quot;——这正是 HyDE 名字里 &quot;Hypothetical Document&quot; 的含义，把检索的锚点从问题的语义空间搬到了文档的语义空间。</p>"},{"qnum":4,"qtext":"把 HyDE 和 Day 58 的混合检索结合时，向量检索路和 BM25 路分别应该用假设文档还是原始问题？为什么？","answerHtml":"<pre><code class=\"language-python\">vector_results = hybrid_retriever.vector_store.search(hypothetical_doc, top_k=50)  # 用假设文档\nbm25_results = hybrid_retriever.bm25_retriever.search(question, top_k=50)          # 用原始问题</code></pre><p><strong>原因</strong>：BM25 依赖关键词精确匹配，假设文档里的编造内容可能引入无关关键词，反而污染 BM25 的匹配结果，所以 BM25 这一路仍用原始问题。同理，最终 Reranker 判断&quot;这篇文档是否真的回答了用户的问题&quot;，也应该基于原始问题而不是假设答案——只有向量检索这一路因为要利用&quot;文体贴近&quot;这个优势，才用假设文档做 Embedding。</p>"},{"qnum":5,"qtext":"HyDE 有哪些局限性？什么场景下不适合用 HyDE？","answerHtml":"<pre><code>额外成本：每次检索多一次 LLM 调用，增加延迟和 Token 成本\n幻觉风险：假设答案如果生成方向完全跑偏，可能让检索走向错误方向，反而不如直接用原始问题准确\n收益有限的场景：如果用户问题本身已经是清晰的陈述式表达（如直接输入产品型号），HyDE 的转换步骤价值不大</code></pre><p><strong>不适合的场景</strong>：对延迟/成本极度敏感的场景；问题本身已经很规范清晰的场景；检索效果差的根因其实是 Chunk 切分不合理或 Embedding 模型选型问题（这类问题 HyDE 解决不了，需要针对性排查 Day 17/18 的相关环节）。</p>"},{"qnum":6,"qtext":"HyDE 生成假设答案的 Prompt 设计里，为什么要求\"正式陈述文体\"而不是直接说\"请回答这个问题\"？","answerHtml":"<pre><code class=\"language-python\">HYDE_PROMPT_TEMPLATE = &quot;&quot;&quot;你是一个专业知识库的内容撰写助手。\n请针对下面的问题，写一段可能出现在正式文档里的回答。\n要求：\n1. 语言风格要正式、陈述式，避免口语化表达\n2. 长度控制在 80-150 字\n3. 不需要保证内容绝对准确，重点是文体贴近正式说明文档\n&quot;&quot;&quot;</code></pre><p><strong>设计要点</strong>：明确要求&quot;正式陈述文体&quot;而不是&quot;回答用户问题&quot;，这是让生成结果贴近知识库文风的关键——如果 Prompt 写成&quot;请回答这个问题&quot;，模型可能生成的是口语化的助手式回复，反而和知识库文档的文体差异依然很大，达不到 HyDE 缩小 query-document mismatch 的目的。</p>"},{"qnum":7,"qtext":"从对比实验的具体 case 看，HyDE 在哪类问题上提升明显，哪类问题上没有差异？","answerHtml":"<p>具体看几个 case：问&quot;东西坏了怎么办，能退吗&quot;，直接检索命中的是&quot;产品使用说明&quot;（相关性较弱），HyDE 检索命中的是&quot;产品质量问题处理流程&quot;（更准确）；问&quot;多久能到账&quot;，直接检索命中&quot;物流配送时效&quot;（跑偏，答非所问），HyDE 检索命中&quot;退款到账时间说明&quot;（更准确）；问&quot;换个尺码麻烦吗&quot;，直接检索和 HyDE 检索都命中&quot;换货政策&quot;，结果一致，没有明显差异。</p><p><strong>结论</strong>：HyDE 在&quot;问题信息量少、口语化程度高&quot;的 case 上（如缺乏明确主语的&quot;多久能到账&quot;）提升明显；在问题本身已经比较清晰、和文档措辞差异不大的 case 上（如&quot;换个尺码麻烦吗&quot;），两种方式的检索结果基本一致，HyDE 的额外成本没有换来明显收益。</p>"}]},{"name":"深化阶段·查询改写与多查询检索","questions":[{"qnum":1,"qtext":"Query Rewriting 和 Multi-query Fusion 分别解决模糊问题的哪类症状？","answerHtml":"<p>Query Rewriting 针对的是&quot;指代不明 / 信息不全&quot;这类症状，比如&quot;那个东西怎么用&quot;这种脱离上下文无法理解的问题，需要结合对话历史改写成&quot;蓝牙耳机没声音时应该如何排查和使用&quot;；Multi-query Fusion 针对的是&quot;单一查询覆盖角度有限&quot;这类症状，即一句话里隐含了多个子意图，比如&quot;退货流程和运费谁承担&quot;会被拆成&quot;退货申请流程是什么&quot;和&quot;退货运费由谁承担&quot;两个变体分别检索。</p><p>Query Rewriting 是<strong>一对一</strong>改写（模糊问题 → 清晰问题），Multi-query Fusion 是<strong>一对多</strong>扩展（一个清晰问题 → 多个角度变体）。</p>"},{"qnum":2,"qtext":"Query Rewriting 为什么必须结合对话历史？如果原问题本身已经清晰，应该怎么处理？","answerHtml":"<p>指代消解（&quot;那个东西&quot;具体指什么）必须依赖之前的对话内容才能确定，脱离对话历史无法判断&quot;那个东西&quot;是蓝牙耳机还是别的产品：</p><pre><code class=\"language-python\">def rewrite_query(history: list[dict], last_message: str) -&gt; str:\n    history_text = &quot;\\n&quot;.join(f&quot;{h['role']}: {h['content']}&quot; for h in history)\n    prompt = REWRITE_PROMPT.format(history=history_text, last_message=last_message)\n    return call_llm(prompt, temperature=0)</code></pre><p><strong>原问题已经清晰时</strong>：Prompt 里应明确要求&quot;如果原问题已经清晰完整，直接返回原问题，不要画蛇添足&quot;——因为改写本身有引入语义偏移的风险，只有确实模糊的问题才值得承担这个风险，不应该对所有问题都无差别改写。</p>"},{"qnum":3,"qtext":"Multi-query Fusion 生成的多个查询变体，最后怎么合并成一个排名？","answerHtml":"<p>复用 Day 58 的 RRF（Reciprocal Rank Fusion）：</p><pre><code class=\"language-python\">def multi_query_retrieve(question, hybrid_retriever, top_k=5):\n    variants = generate_query_variants(question, n=3)\n    all_queries = [question] + variants\n    result_lists = [hybrid_retriever.vector_store.search(q, top_k=20) for q in all_queries]\n    fused = reciprocal_rank_fusion(result_lists, k=60)\n    return fused[:top_k]</code></pre><p>每路查询各自检索出一批候选，RRF 只依据&quot;文档在各路结果里的排名&quot;累加分数，不需要处理不同查询检索分数的量纲问题——这和 Day 58 融合向量检索与 BM25 结果时使用的是同一套融合机制，只是这里融合的是&quot;多个查询变体各自的检索结果&quot;而不是&quot;多种检索方式的结果&quot;。</p>"},{"qnum":4,"qtext":"Multi-query 检索时，为什么要把原始问题也保留为一路查询，而不是完全用生成的变体替代？","answerHtml":"<pre><code class=\"language-python\">all_queries = [question] + variants   # 保留原始问题这一路</code></pre><p><strong>原因</strong>：生成的变体是&quot;补充覆盖角度&quot;，不是&quot;替代原始意图&quot;——如果完全丢弃原始问题只用变体检索，一旦变体生成偏离了原始问题的核心意图（模型理解错了子话题划分），检索结果就完全没有机会命中真正相关的文档。保留原始问题这一路，相当于给整个融合结果加了一道&quot;不偏离原意&quot;的兜底保障。</p>"},{"qnum":5,"qtext":"Query Rewriting、Multi-query、HyDE 三者分别改变的是什么？实际使用时应该按什么顺序组合？","answerHtml":"<p>三者改变的对象完全不同：HyDE 改变的是检索锚点的文体，把问题转换成假设答案；Query Rewriting 改变的是查询内容本身，把模糊表述改写成清晰表述；Multi-query 改变的是查询数量，把一个查询扩展成多个角度的变体。</p><p><strong>组合顺序</strong>：先做 Query Rewriting 解决&quot;这句话在问什么&quot;，再做 Multi-query 解决&quot;从哪些角度检索这个已经说清楚的问题&quot;，每个变体还可以再套一层 HyDE 转换文体。顺序不能颠倒——如果先做 Multi-query 再改写，生成的变体会基于模糊指代的原始问题，变体本身也是模糊的，无法真正扩大有效覆盖角度。三者可以叠加，但每叠加一层就多一次 LLM 调用，需要权衡延迟和收益，不是无脑全部叠满。</p>"},{"qnum":6,"qtext":"Query Rewriting 里 `call_llm` 用 `temperature=0`，Multi-query 生成变体时用 `temperature=0.5`，这个差异说明了什么设计考量？","answerHtml":"<pre><code class=\"language-python\">def rewrite_query(history: list[dict], last_message: str) -&gt; str:\n    ...\n    return call_llm(prompt, temperature=0)\n\ndef generate_query_variants(question: str, n: int = 3) -&gt; list[str]:\n    prompt = MULTI_QUERY_PROMPT.format(question=question)\n    response = call_llm(prompt, temperature=0.5)   # 需要一定多样性，温度不能是0</code></pre><p>两者的目标完全不同：Query Rewriting 追求的是&quot;消除歧义后的唯一正确表述&quot;——改写结果应该是确定、可复现的，用 <code>temperature=0</code> 避免同一个模糊问题每次改写出不同版本；Multi-query Fusion 追求的是&quot;从不同角度覆盖问题&quot;——如果用 <code>temperature=0</code>，模型大概率会生成措辞相近甚至重复的变体，起不到扩大检索覆盖面的作用，所以需要 <code>temperature=0.5</code> 保留一定随机性，但又不能太高（避免变体偏离原始问题的核心意图）。</p><p><strong>记忆点</strong>：温度参数不是越低越&quot;稳妥&quot;——要看这一步任务本身需要的是&quot;确定性&quot;还是&quot;多样性&quot;。</p>"}]},{"name":"深化阶段·第 10 周复盘（RAG 优化手段选型）","questions":[{"qnum":1,"qtext":"RAG 检索效果不好可以拆解成哪两类问题？怎么判断某个 case 属于哪一类？","answerHtml":"<p>可以拆解成&quot;召回不到&quot;（Recall 问题）和&quot;排序不准&quot;（Precision/Ranking 问题）两类：召回不到指正确文档根本没有出现在候选池里，症状是不管怎么调整排序，正确答案都不可能出现在最终结果里；排序不准指正确文档在候选池里、但排名不够靠前，症状是候选池够大的话能找到，但 Top-K 截断把它挡在外面了。</p><p><strong>判断方法</strong>：先看正确文档是否出现在足够大的候选池里（如 Top-50），如果没有，是召回问题；如果在候选池里但没进最终 Top-K，是排序问题。</p>"},{"qnum":2,"qtext":"混合检索、HyDE、查询改写/多查询，为什么都归类为解决\"召回不到\"？","answerHtml":"<p>三者的共同点是都在<strong>扩大或校准候选池</strong>：</p><pre><code>混合检索   → BM25 补上向量检索对专有名词/精确术语召回不到的短板\nHyDE       → 改变检索锚点文体，解决 query-document mismatch 导致的召回不准\n查询改写/多查询 → 消除指代不明/信息缺失/单一查询覆盖不全导致的召回缺口</code></pre><p>如果正确文档从一开始就没被这三种手段的任何一种捞进候选池，那再怎么排序也找不回来——它们解决的是&quot;能不能被捞出来&quot;，而不是&quot;捞出来之后排第几&quot;。</p>"},{"qnum":3,"qtext":"为什么说 Reranker 只解决\"排序不准\"，不解决\"召回不到\"？","answerHtml":"<p>Reranker 的前提是<strong>它只对粗召回返回的候选池重新打分排序</strong>，不会去处理候选池之外的文档。如果正确文档在粗召回阶段就没有进入 Top-N 候选，Reranker 根本没有机会看到它，自然无法把它排进最终结果——这一点在 Day 59 已经强调过：&quot;Reranker 提升的是排序准不准，不是能不能找到&quot;。所以 Reranker 天生就不负责扩大召回，它只在候选池内部重新排序。</p>"},{"qnum":4,"qtext":"如果只能给 RAG 系统加一招优化，应该优先加哪个？为什么？","answerHtml":"<p>优先加<strong>混合检索</strong>：</p><pre><code>混合检索：实现成本最低（不需要额外模型调用，只加一路 BM25 索引），\n          几乎不增加延迟，且覆盖面最广——任何知识库都可能有专有名词/型号类查询\nReranker：紧随其后，只要粗召回质量过得去，几乎总能提升排序质量，成本可控\nHyDE/查询改写：额外 LLM 调用带来更高延迟和成本，只在特定场景（文体差异大/多轮模糊问题）才划算</code></pre><p><strong>判断依据</strong>：不是看单一效果好不好，而是综合&quot;实现成本&quot;和&quot;适用场景覆盖面&quot;——混合检索是四招里唯一&quot;零额外模型调用成本、收益覆盖面最广&quot;的选择。</p>"},{"qnum":5,"qtext":"四招优化手段都用上之后，检索质量依然不达标，接下来该往哪个方向排查？","answerHtml":"<p>应该回头检查更底层的环节：</p><pre><code>Chunk 切分策略（Day 17）：切分粒度是否合适，是否在语义边界被截断\nEmbedding 模型选型（Day 18）：模型是否适合当前领域的文本类型（如中文/垂直领域术语）</code></pre><p><strong>原因</strong>：混合检索、Reranker、HyDE、查询改写都是在&quot;检索方式&quot;和&quot;查询质量&quot;层面做优化，如果底层的 Chunk 切分本身就把语义切碎了，或者 Embedding 模型对当前领域的文本理解本身就有偏差，再怎么优化检索策略也无法弥补这些更底层的问题——这是排查优先级从&quot;检索层&quot;下沉到&quot;数据/模型层&quot;的信号。</p>"},{"qnum":6,"qtext":"RAG 优化手段选型表里，\"正确文档能在候选池里找到但排在 Top-K 之外\"和\"用户问题措辞口语化、知识库文档正式文体差异很大\"这两种症状，分别对应什么手段和优先级？为什么优先级不同？","answerHtml":"<p>正确文档能在候选池里找到、但排在 Top-K 之外，对应的手段是 Reranker，优先级高，属于默认标配；用户问题措辞口语化、和知识库文档的正式文体差异很大，对应的手段是 HyDE，优先级中等，属于按信号引入。</p><p><strong>优先级不同的原因</strong>：Reranker 只要粗召回质量过得去，几乎总能带来排序质量提升，且只对候选池（几十条）打分，成本可控，属于&quot;默认标配&quot;；HyDE 需要一次额外的 LLM 生成调用，延迟和成本明显更高，只有在&quot;问题和文档文体差异大&quot;这个明确信号出现时才划算，属于&quot;按信号引入&quot;而非无脑加上。</p>"},{"qnum":7,"qtext":"判断\"该不该优先加某个优化手段\"时，为什么不能只看效果好不好，还要看哪些维度？四招在这些维度上的对比是怎样的？","answerHtml":"<p>判断优先级要看两个维度，一个是实现成本，一个是适用场景覆盖面。先说混合检索，也就是 BM25 加 RRF，它是本地库，不需要额外调模型，成本最低，几乎不增加延迟，而且覆盖面很广——几乎所有知识库都会遇到专有名词或者编号类的查询。Reranker 成本中等，得部署或者调用一次 Cross-Encoder，延迟也是中等，因为只处理一小批候选，覆盖面同样广，只要候选池里有正确文档它就能提升排序。HyDE 也是中等成本，但要多打一次 LLM 生成调用，延迟明显更高，覆盖面就窄很多，只有问题和文档文体差异大的场景才划算。查询改写或者多查询也是中等成本，但可能要打两到四次额外的 LLM 调用，延迟同样偏高，覆盖面算中等，主要看模糊问题占的比例有多少。</p><p><strong>原因</strong>：只看&quot;效果好不好&quot;会让人误以为&quot;多加一招总没坏处&quot;，但每一招都有实实在在的延迟和成本代价，只有把&quot;成本&quot;和&quot;覆盖面&quot;放在一起权衡，才能得出&quot;混合检索该默认加，HyDE 该按需加&quot;这样具体可执行的优先级结论。</p>"},{"qnum":8,"qtext":"为什么不建议\"把四招优化手段同时加上再看效果\"，而要先判断问题类型再针对性选择？","answerHtml":"<p>选型表的使用方法明确指出：遇到检索质量问题时，应该先用 2.1 节的判断方法确定是&quot;召回不到&quot;还是&quot;排序不准&quot;，再对照选型表选择对应手段——<strong>而不是把四招同时加上再看效果</strong>，那样即使整体效果变好了，也说不清究竟是哪一招起了作用，无法把这次改动的收益归因到具体手段上，下次遇到类似问题时也无法复用这次的经验判断该加哪一招。这和 Day 64 持续评估强调的&quot;每次改动都要能精确说明改进了什么&quot;是同一套工程方法论。</p>"}]},{"name":"深化阶段·RAGAS 评估框架入门","questions":[{"qnum":1,"qtext":"为什么\"感觉答得不错\"这种主观评估不足以支撑 RAG 系统的持续迭代？","answerHtml":"<p>三个根本问题：</p><pre><code>不可复现：因人而异、因心情而异，两个人对同一个回答的判断可能不一致\n无法量化对比：改了 Prompt 或调整了 Chunk 参数，&quot;感觉好像变好了&quot;说不清具体好了多少\n无法追踪回归：没有历史指标基线，无法自动判断某次改动是否引入了新问题</code></pre><p>RAGAS 用另一个 LLM 作为&quot;评判者&quot;（LLM-as-judge），针对问题、答案、检索上下文的关系自动计算量化分数，把&quot;感觉&quot;替换成&quot;可复现、可对比、可追踪&quot;的数字指标。</p>"},{"qnum":2,"qtext":"RAGAS 的四个核心指标分别衡量什么？","answerHtml":"<p>RAGAS 的四个核心指标分为生成和检索两个环节：生成环节包括 Faithfulness（忠实度），衡量答案里的论断是否都能在检索上下文里找到依据、而非编造；以及 Answer Relevancy（答案相关性），衡量答案是否切题回应了问题。检索环节包括 Context Precision（上下文精度），衡量检索结果里排序靠前的内容是否都相关；以及 Context Recall（上下文召回率），衡量检索结果是否覆盖了回答所需的全部信息。</p>"},{"qnum":3,"qtext":"忠实度（Faithfulness）和答案相关性（Answer Relevancy）有什么区别？一个答案可能出现\"忠实度高但相关性低\"吗？","answerHtml":"<p>区别：Faithfulness 检查答案是否&quot;编造了上下文之外的内容&quot;，Answer Relevancy 检查答案是否&quot;切题回应了问题&quot;——两者都是评估生成阶段，但关注的角度不同：一个管&quot;真不真实&quot;，一个管&quot;对不对题&quot;。</p><p><strong>可以同时出现忠实度高但相关性低</strong>：</p><pre><code>问题：&quot;退货运费谁承担？&quot;\n答案：&quot;我们公司非常重视用户体验，退货政策的设计参考了行业标准……&quot;\n\n如果这段话每一句都能在上下文里找到依据（没有编造），Faithfulness 会打高分\n但这段话根本没有正面回答&quot;运费谁承担&quot;，Answer Relevancy 会打低分</code></pre><p>这说明&quot;内容真实&quot;和&quot;回答切题&quot;是两个独立的维度，缺一不可。</p>"},{"qnum":4,"qtext":"上下文精度（Context Precision）和上下文召回率（Context Recall）分别评估检索的哪个方面？为什么只有 Context Recall 需要标注 ground_truth？","answerHtml":"<pre><code>Context Precision → 检索结果的排序质量：靠前位置命中相关内容的比例（类似&quot;精排准不准&quot;）\nContext Recall     → 检索结果的覆盖率：是否覆盖了标准答案所需的全部信息点（类似&quot;召回全不全&quot;）</code></pre><p><strong>为什么 Context Recall 需要 ground_truth</strong>：它的计算方式是把标注好的标准答案拆解成多个信息点，逐一检查每个信息点能否在检索到的上下文里找到对应内容——没有标准答案，就无法知道&quot;应该覆盖哪些信息点&quot;，自然无法计算覆盖率。而 Faithfulness/Answer Relevancy/Context Precision 都是基于&quot;问题-答案-上下文&quot;三者内部的关系计算，不需要额外的标准答案。</p>"},{"qnum":5,"qtext":"跑完 RAGAS 评估后，发现检索环节两个指标明显偏低，接下来应该往哪个方向排查？","answerHtml":"<p>应该回到 Day 58–61 的检索优化手段里针对性排查，而不是继续调 Prompt（那是生成环节的事）：</p><pre><code>Context Precision 低（排序不准）→ 检查是否需要引入/优化 Reranker（Day 59）\nContext Recall 低（覆盖不全）  → 检查是否需要混合检索（Day 58）补上精确匹配缺口，\n                                 或查询改写/多查询（Day 61）扩大覆盖角度，\n                                 或 HyDE（Day 60）缩小语义鸿沟</code></pre><p><strong>核心原则</strong>：RAGAS 报表明确指出问题出在检索还是生成后，直接对照 Day 62 的&quot;RAG 优化手段选型表&quot;选择对应手段，不需要凭感觉从头排查——量化指标和优化手段选型表配合使用，形成&quot;发现问题→定位环节→选择手段&quot;的完整闭环。</p>"},{"qnum":6,"qtext":"Faithfulness 指标的计算思路是什么？为什么要先把答案拆解成多个独立论断（claim）？","answerHtml":"<pre><code>问题：&quot;退货运费谁承担？&quot;\n检索上下文：&quot;因产品质量问题退货的，运费由卖家承担……&quot;\n模型答案：&quot;因质量问题退货运费由卖家承担，退货有效期为 30 天。&quot;\n                                                ↑ &quot;30天&quot;在上下文里没有出现——这是幻觉</code></pre><p><strong>计算思路</strong>：把答案拆解成多个独立的论断（claim），逐一检查每个论断能否被检索上下文支撑，最终分数是&quot;能被支撑的论断数 / 总论断数&quot;。拆解成独立论断而不是整体判断&quot;这段话对不对&quot;，是因为一段答案里往往真假掺杂（部分论断有依据、部分是编造），只有拆到论断粒度才能精确量化&quot;编造了多大比例&quot;，而不是简单给整段话打一个&quot;对&quot;或&quot;错&quot;的二元判断。</p>"},{"qnum":7,"qtext":"Context Precision 和 Context Recall 的计算思路分别是什么？和 Faithfulness 的计算方式有什么共同点？","answerHtml":"<pre><code>Context Precision 计算思路：类似 Reranker 评估的思路——检查每个检索位置上的内容是否相关，\n                           越靠前的位置命中相关内容，分数越高（体现&quot;位置越靠前权重越大&quot;）\n\nContext Recall 计算思路：把标注好的标准答案（ground_truth）拆解成多个信息点，\n                         检查每个信息点是否能在检索到的上下文里找到对应内容，\n                         分数 = 能找到对应内容的信息点数 / 标准答案总信息点数</code></pre><p><strong>共同点</strong>：四个指标本质上都遵循同一套&quot;LLM-as-judge&quot;方法论——先把评估对象（答案/检索结果/标准答案）拆解成更细粒度的单元（论断/检索位置/信息点），再逐一用 LLM 判断每个单元是否满足条件，最后汇总成一个 0-1 之间的比例分数，而不是让 LLM 直接对整体打一个笼统的分数——细粒度拆解是 RAGAS 能给出可复现、可解释指标的关键。</p>"}]},{"name":"深化阶段·评估集与持续评估","questions":[{"qnum":1,"qtext":"Day 63 的\"跑一次评估\"和 Day 64 的\"持续评估\"有什么区别？评估集能带来哪三个价值？","answerHtml":"<p>区别体现在三个维度上：测试用例方面，Day 63 是临时凑的几条，Day 64 是固定沉淀的 20 条、覆盖三类场景；运行方式方面，Day 63 是手动跑一次看结果，Day 64 是可重复运行的脚本、每次改动后都能跑；结果记录方面，Day 63 看完就丢，Day 64 有基准报表、每次运行都能和基准对比。</p><p>三个价值：</p><pre><code>基准对比：能说清楚&quot;这次改动让某指标从0.65提升到0.78&quot;，而不是&quot;感觉好像好一点&quot;\n回归检测：改动后重跑，能第一时间发现某类case分数突然下降\n持续追踪：随着新的低分case被采集，评估集本身也持续扩充，越来越贴近真实问题</code></pre>"},{"qnum":2,"qtext":"评估集的三元组结构里，为什么要加\"标准引用来源\"这个字段，而不是只有问题和标准答案？","answerHtml":"<pre><code class=\"language-python\">@dataclass\nclass EvalCase:\n    case_id: str; question: str\n    ground_truth_answer: str\n    ground_truth_sources: list[str]   # 多出的这一环\n    category: str</code></pre><p><strong>原因</strong>：只有&quot;问题+标准答案&quot;只能验证生成结果的语义是否正确，无法验证检索环节是否命中了正确的来源文档。加上 <code>ground_truth_sources</code> 后，即使系统给出的答案表述方式不同但内容正确，也能通过检查&quot;是否命中了正确的来源文档&quot;来独立验证检索环节的准确性——这让评估能分别定位到检索和生成两个环节，而不是只看最终答案的笼统对错。</p>"},{"qnum":3,"qtext":"20 条评估问题为什么要覆盖 answerable/boundary/out_of_scope 三类，只测 answerable 会有什么问题？","answerHtml":"<pre><code>answerable（能回答）  → 验证正常场景下的检索和生成质量\nboundary（边界情况）  → 验证信息不完整时的稳健性（不臆造、不遗漏）\nout_of_scope（超出范围）→ 验证&quot;无资料拒答&quot;机制是否生效</code></pre><p><strong>只测 answerable 的问题</strong>：会让评估集看起来分数很高（因为都是知识库覆盖得比较好的简单场景），但掩盖了系统在边界情况和拒答场景下的真实短板——这是&quot;只跑几个顺利 case 就以为系统很好&quot;的常见误区，真实用户提问远不止 answerable 这一类。</p>"},{"qnum":4,"qtext":"为什么 out_of_scope 类问题不适合用标准的 RAGAS 四指标评估？应该用什么替代？","answerHtml":"<p>RAGAS 四指标（尤其 Context Recall）依赖标注好的标准答案和标准来源，但 out_of_scope 类问题<strong>本身就没有&quot;标准答案&quot;</strong>——知识库里根本不包含相关信息，评估的核心也不是&quot;答案内容准不准确&quot;，而是&quot;系统有没有老实说不知道&quot;。</p><p>应该用独立的<strong>拒答准确率（Refusal Accuracy）</strong>替代：</p><pre><code class=\"language-python\">REFUSAL_KEYWORDS = [&quot;不支持&quot;, &quot;没有相关信息&quot;, &quot;无法回答&quot;, &quot;超出&quot;, &quot;暂不清楚&quot;]\ndef is_refusal_response(answer: str) -&gt; bool:\n    return any(kw in answer for kw in REFUSAL_KEYWORDS)</code></pre><p>这是对 Day 19&quot;无资料拒答&quot;机制的量化验证，和 RAGAS 四指标共同构成完整的评估报表。</p>"},{"qnum":5,"qtext":"评估集应该是一次性写完就固定不变，还是持续演进的？演进的机制是什么？","answerHtml":"<p>应该是<strong>持续演进</strong>的。演进机制是把 Day 55 反馈追踪发现的真实失败 case 持续转化成新的评估用例：</p><pre><code class=\"language-python\">def build_eval_case_from_feedback(low_score_record: dict) -&gt; EvalCase:\n    return EvalCase(\n        case_id=f&quot;regression_{low_score_record['trace_id']}&quot;,\n        question=low_score_record[&quot;user_input&quot;],\n        ground_truth_answer=&quot;&quot;,   # 需要人工补充标注\n        ground_truth_sources=[],\n        category=&quot;answerable&quot;,\n    )</code></pre><p><strong>原因</strong>：一次性写完的 20 条评估用例永远只能覆盖开发者当初设想的场景，而生产环境里用户的真实提问模式会不断暴露新的失败案例——把这些真实失败 case 持续吸收进评估集，才能让评估集越来越贴近真实使用中的问题分布，而不是停留在&quot;自己觉得应该测什么&quot;的主观假设上。</p>"},{"qnum":6,"qtext":"`run_full_evaluation()` 脚本里，为什么要把 answerable+boundary 和 out_of_scope 两类 case 分开处理评估？","answerHtml":"<pre><code class=\"language-python\">def run_full_evaluation(rag_system, eval_set: list[EvalCase]) -&gt; dict:\n    ragas_dataset = build_eval_dataset(rag_system, answerable_cases + boundary_cases)\n    ragas_scores = evaluate(ragas_dataset, metrics=[faithfulness, answer_relevancy,\n                                                      context_precision, context_recall])\n    refusal_accuracy = evaluate_refusal(rag_system, out_of_scope_cases)</code></pre><p><strong>原因</strong>：这是因为 answerable 和 boundary 这两类问题，知识库里本来就有真实答案，可以用标注好的 <code>ground_truth_answer</code> 和 <code>ground_truth_sources</code>，走 RAGAS 那四个指标。但 out_of_scope 这类问题不一样，它压根没有&quot;标准答案&quot;——知识库里根本不包含相关信息，这时候评估的核心是&quot;系统有没有老实拒答&quot;，而不是&quot;答案内容准不准&quot;。RAGAS 的四个指标，尤其是依赖 ground_truth 的 Context Recall，在这种场景下根本算不出来，所以必须用单独的 <code>evaluate_refusal()</code> 来评估。</p>"},{"qnum":7,"qtext":"基准报表的版本管理原则是什么？为什么要给每个基准文件打版本标签，而不是每次运行都覆盖同一个文件？","answerHtml":"<pre><code class=\"language-python\">def save_baseline(report: dict, version_tag: str, baseline_dir: str = &quot;eval_baselines&quot;):\n    filepath = f&quot;{baseline_dir}/baseline_{version_tag}.json&quot;</code></pre><p><strong>版本管理原则</strong>：每次做了一轮明确的优化（比如接入了 Day 58 的混合检索），跑完评估后把这次的报表存成一个新的基准文件，用版本标签命名（如 <code>baseline_v2_hybrid_retrieval.json</code>），下次改动后和最近的基准对比。如果每次都覆盖同一个文件，就无法追溯&quot;某个具体指标是在哪一次改动之后开始下降/提升的&quot;，一旦出现回归也无法定位是哪次改动引入的问题——版本化保存是让&quot;回归检测&quot;和&quot;追溯改动&quot;这两个持续评估的核心价值真正落地的前提。</p>"},{"qnum":8,"qtext":"从五节的示例输出（`v2_hybrid_retrieval` 相比上一版本的对比）看，为什么 faithfulness/answer_relevancy 几乎没变化，而 context_precision/context_recall 大幅提升？这说明了什么？","answerHtml":"<pre><code>faithfulness: → +0.0020\nanswer_relevancy: → -0.0050\ncontext_precision: ↑ +0.0600\ncontext_recall: ↑ +0.1600</code></pre><p>这次改动只动了检索环节，没碰生成的 Prompt，所以检索这两个指标——Context Precision 和 Context Recall——出现明显提升，是直接效果；生成这两个指标——Faithfulness 和 Answer Relevancy——基本没变，也在意料之中，因为这次改动本来就没涉及生成部分。<strong>这说明了什么</strong>：这说明了持续评估真正的价值，就在于能精确说清楚&quot;这次改动到底改进了什么、有没有带来副作用&quot;。如果这时候 Faithfulness 意外掉了，就要警惕是不是这次改动引入了新问题，而不能把所有指标的变化都笼统地归到&quot;这次改动&quot;头上。</p>"}]},{"name":"深化阶段·PDF/表格/扫描件解析进阶","questions":[{"qnum":1,"qtext":"为什么说 pdfplumber 这类基于坐标提取的工具，处理复杂真实文档时\"很脏\"？","answerHtml":"<p>pdfplumber 本质上是按 PDF 内部记录的文字物理坐标顺序提取字符，不理解文档的<strong>逻辑结构</strong>（这段文字属于哪个标题、这几个数字属于哪张表格的哪一行哪一列）。这会导致三类问题：</p><pre><code>排版混乱：多栏排版按坐标提取会把左右栏内容交替拼接，语义错乱\n表格错位：表格拍平成纯文本后丢失行列对齐关系\n扫描件无文字层：本质是图片，没有可提取的文字字符，直接返回空</code></pre><p>这一步是 RAG 流程的最上游，如果这里丢失或扭曲了信息，后续的切分、检索、生成、评估优化都是建立在残缺数据上。</p>"},{"qnum":2,"qtext":"表格转文本后为什么容易出现\"错位\"问题？应该怎么解决？","answerHtml":"<p>原始表格是行列对齐的结构，按坐标顺序拍平成纯文本后失去了这种对齐关系：</p><pre><code>原表格：\n| 产品名   | 单价  | 库存 |\n| 蓝牙耳机 | 199元 | 50   |\n\n拍平后可能变成：\n产品名单价库存蓝牙耳机199元50</code></pre><p>模型完全无法从这段文字还原&quot;蓝牙耳机对应199元、库存50&quot;的对应关系。<strong>解决方式</strong>：用能识别表格行列边界的解析工具（Docling/marker），把每个单元格作为独立结构化数据保留，输出成 Markdown 表格语法而不是拍平的纯文本——模型训练时见过大量 Markdown 表格，能正确理解这种格式里的行列对应关系。</p>"},{"qnum":3,"qtext":"扫描件为什么无法用 pdfplumber 提取出文字？处理扫描件需要什么额外流程？","answerHtml":"<p>扫描件本质是一张图片，PDF 文件里没有任何可提取的文字字符层，pdfplumber 这类基于文本层提取的工具直接返回空字符串。处理扫描件需要走 OCR（光学字符识别）流程：</p><pre><code>扫描件（图片）→ 图像预处理（去噪/矫正倾斜/二值化）\n             → OCR引擎识别文字区域和内容（Tesseract/PaddleOCR/云端API）\n             → 输出文字+位置坐标 → 按版面重新组织成可读文本</code></pre><p><strong>关键认知</strong>：OCR 只解决&quot;能不能提取出文字&quot;，识别质量高度依赖扫描件清晰度，模糊/倾斜/手写体的扫描件即使用最好的 OCR 也可能出错，往往需要人工校对兜底。</p>"},{"qnum":4,"qtext":"Docling/marker 这类工具相比 pdfplumber，核心优势是什么？","answerHtml":"<p>pdfplumber 的提取方式是按坐标顺序拼接字符，遇到表格时直接拍平成没有结构的纯文本，标题和正文之间的层级关系也完全无法区分；Docling/marker 则会先做版面分析，识别出文档的逻辑结构，表格能输出成保留行列对齐关系的 Markdown 表格语法，标题层级也能被识别并保留下来。</p><p><strong>核心优势</strong>：这些工具内部集成了版面分析（Layout Analysis）能力，能识别出文档里的标题、段落、表格等不同区域，分别按各自的语义结构输出结构化 Markdown，而不是简单按坐标顺序拼接字符——2025 年后 Docling 已成为生产级文档解析的主流选择，尤其在含表格、复杂排版的真实业务文档场景。</p>"},{"qnum":5,"qtext":"Docling 这类新一代工具是不是能解决所有文档解析问题？它处理不了哪些边界情况？","answerHtml":"<p>不是。Docling 处理不了或效果不佳的场景：</p><pre><code>排版极度复杂（多层嵌套表格、密集图文混排）→ 版面分析模型判断可能出错\n纯图片PDF（扫描件）→ 仍需先过OCR引擎提取文字，Docling不能单独解决\n加密文档 → 无法直接打开解析，需先解密\n手写内容 → OCR对手写体识别准确率本身受限，Docling继承这部分错误\n低分辨率扫描件 → 图像模糊导致OCR识别错误率高，Docling无法修复上游OCR错误</code></pre><p><strong>关键认知</strong>：不是所有文档质量问题都能靠&quot;换一个更好的解析工具&quot;解决——有些是工具能力边界内的问题（可以预处理或换工具），有些是数据本身质量问题（模糊扫描件、手写内容），后者往往需要人工校对兜底，而不是无限投入在解析工具选型上。</p>"},{"qnum":6,"qtext":"面对\"简单单栏文本 PDF\"\"含表格复杂排版的真实业务文档\"\"扫描件\"这三类不同文档，分别应该选择什么解析方案？","answerHtml":"<p>面对这三类文档，应该按复杂度分层选型。第一，简单单栏文本 PDF、没有表格的场景，推荐用 pdfplumber，够轻量，Day 16 已经用过。第二，含表格、复杂排版的真实业务文档，推荐用 Docling 或者 marker，靠版面分析能力，输出结构化的 Markdown。第三，扫描件这种没有文字层的文档，得先过 OCR 引擎，比如 Tesseract 或 PaddleOCR，再交给 Docling 做结构化整理。</p><p><strong>判断依据</strong>：不是&quot;越新越好的工具就该全面替换旧工具&quot;，而是按文档的复杂度分层选型——简单场景优先用更轻量、依赖更少的 pdfplumber；真正复杂（表格、多栏）的业务文档才值得引入 Docling/marker 这类更重的版面分析工具；扫描件是图片，任何文本层提取工具都无能为力，必须先过 OCR。</p>"},{"qnum":7,"qtext":"Docling 相比 pdfplumber 在处理速度上有什么代价？这对工具选型意味着什么？","answerHtml":"<p>对比处理耗时，pdfplumber 很快，Docling 则明显更慢——多了一层版面分析模型的推理开销。</p><p><strong>代价</strong>：Docling 内部要跑版面分析模型对文档做结构识别，推理开销明显高于 pdfplumber 单纯按坐标提取字符串。<strong>对选型的意义</strong>：Docling 在表格和复杂排版场景下抽取质量明显更好，但代价是处理更慢、依赖更重（需要下载和运行版面分析模型）——对于简单的纯文本 PDF（无表格、单栏排版），pdfplumber 依然是更轻量的选择，不应该无差别地把所有文档都扔给 Docling 处理，而要按文档复杂度权衡准确率和速度/资源成本。</p>"}]},{"name":"深化阶段·RAG 深化版整合（Agentic RAG）","questions":[{"qnum":1,"qtext":"传统 RAG 和 Agentic RAG 的核心区别是什么？","answerHtml":"<pre><code>传统 RAG：检索固定发生一次，不管结果好坏都直接送去生成\nAgentic RAG：retrieve → grade_docs 判断相关性 → 不合格则 rewrite_query → retrieve 再试，\n             合格才 generate</code></pre><p>核心区别在于<strong>检索是否可以被自主判断和重试</strong>——传统 RAG 把检索当作一个机械的固定步骤，Agentic RAG 把检索变成 Agent 可以自主决策的环节：检索结果不好时，有机会换个角度再查一次，而不是被迫在不相关资料上勉强生成或直接拒答。</p>"},{"qnum":2,"qtext":"Agentic RAG 的 LangGraph 图里，grade_docs 节点判断的是什么？为什么不能只看\"有没有检索到文档\"？","answerHtml":"<p><code>grade_docs</code> 判断的是&quot;检索到的文档内容能不能支撑回答这个具体问题&quot;，而不是简单看&quot;检索到了几篇文档&quot;：</p><pre><code class=\"language-python\">def grade_docs(state):\n    docs_text = &quot;\\n---\\n&quot;.join(d[&quot;text&quot;] for d in state[&quot;retrieved_docs&quot;])\n    result = json.loads(call_llm(GRADE_PROMPT.format(question=state[&quot;question&quot;], docs=docs_text)))\n    return {&quot;is_relevant&quot;: result[&quot;is_relevant&quot;]}</code></pre><p><strong>原因</strong>：即使检索到了 5 篇文档，如果内容都不相关（比如检索系统&quot;凑数&quot;返回了排名靠后的无关结果），这些文档对回答问题毫无帮助，应该判定为不合格触发重试——&quot;有没有检索到&quot;和&quot;检索到的内容有没有用&quot;是两回事，只看数量会漏掉&quot;检索到但全不相关&quot;这种情况。</p>"},{"qnum":3,"qtext":"Agentic RAG 的循环终止条件应该怎么设计？达到重试上限后应该怎么处理？","answerHtml":"<pre><code class=\"language-python\">MAX_RETRY = 2\n\ndef route_after_grading(state):\n    if state[&quot;is_relevant&quot;]:\n        return &quot;generate&quot;\n    if state[&quot;retry_count&quot;] &gt;= MAX_RETRY:\n        return &quot;generate&quot;   # 达到上限仍然进入 generate\n    return &quot;rewrite_query&quot;</code></pre><p><strong>达到重试上限后的处理</strong>：不是抛异常终止，而是照样进入 <code>generate</code>——因为生成阶段本身已经有&quot;资料不足则拒答&quot;的机制（Day 19），两层设计互相配合：图层面只负责&quot;给足够的重试机会&quot;，生成阶段负责&quot;资料确实不够时诚实拒答&quot;，不需要在图层面单独处理&quot;彻底找不到&quot;的情况。这和 Day 35 的双层终止保护是同一个设计思路。</p>"},{"qnum":4,"qtext":"retrieve 节点内部整合了哪些 Day 58-59 的能力？为什么说这是\"框架负责编排，具体能力模块保持独立复用\"？","answerHtml":"<pre><code class=\"language-python\">def hybrid_retrieve_with_rerank(query, top_k=5):\n    vector_results = hybrid_retriever.vector_store.search(query, top_k=50)\n    bm25_results = hybrid_retriever.bm25_retriever.search(query, top_k=50)\n    fused = reciprocal_rank_fusion([vector_results, bm25_results], k=60)[:50]\n    reranked = reranker.rerank(query, fused, top_k=top_k)\n    return reranked</code></pre><p>整合了 Day 58 的混合检索（向量+BM25+RRF融合）和 Day 59 的 Reranker 精排，两阶段检索流程完全不用重新设计。<strong>框架负责编排的含义</strong>：LangGraph 只是把这个已经写好的函数包装成一个 Node，负责决定&quot;什么时候调用它、调用之后怎么路由&quot;；检索的具体实现细节（怎么融合、怎么精排）完全在 Day 58-59 就已经独立开发和验证过了——编排层和能力模块层解耦，是模块化设计的体现。</p>"},{"qnum":5,"qtext":"整合前后跑 RAGAS 评估，为什么检索环节指标的提升幅度明显大于生成环节指标？","answerHtml":"<pre><code>Context Precision: 0.68 → 0.79（+0.11）\nContext Recall:     0.62 → 0.81（+0.19）\nFaithfulness:       0.85 → 0.90（+0.05）\nAnswer Relevancy:   0.80 → 0.87（+0.07）</code></pre><p><strong>原因</strong>：今天的整合动作主要是升级检索方式（混合检索+Reranker+Agentic重试），并没有改动生成阶段的 Prompt，所以检索两个指标（Context Precision/Recall）的提升是<strong>直接效果</strong>；生成两个指标（Faithfulness/Answer Relevancy）也有提升，但这是<strong>间接效果</strong>——喂给模型的资料更准确、更全了，模型自然更容易给出忠实且切题的答案，生成 Prompt 本身没有变化。这个对比清楚地说明了&quot;检索质量提升会连带改善生成质量&quot;这个链路依赖关系。</p>"},{"qnum":6,"qtext":"`AgenticRAGState` 里为什么要同时设计 `question` 和 `current_query` 两个字段，而不是只用一个字段？","answerHtml":"<pre><code class=\"language-python\">class AgenticRAGState(TypedDict):\n    question: str              # 原始问题（不变）\n    current_query: str         # 当前用于检索的查询（可能被改写过）\n    retrieved_docs: list[dict]\n    is_relevant: bool\n    retry_count: int\n    answer: str</code></pre><p><code>question</code> 存的是用户最初问的那个原始问题，在整张图的执行过程中始终<strong>不变</strong>；<code>current_query</code> 是当前这一轮实际拿去检索的查询词，会在 <code>rewrite_query</code> 节点里被反复改写。把这两个字段分开的意义在于，<code>retrieve</code> 节点每次重试用的都是可能已经改写过的 <code>current_query</code>，让检索词越改越准；而 <code>grade_docs</code>、<code>generate</code> 这些需要判断&quot;是不是真的回答了用户问题&quot;的环节，始终能拿到没被污染过的原始 <code>question</code> 作为判断基准。要是只用一个字段，改写循环转了几轮之后，就没法追溯用户最初到底想问什么了。</p>"},{"qnum":7,"qtext":"节点设计表里，`grade_docs` 和 `route_after_grading` 分别是什么角色？为什么笔记里特意强调 `grade_docs` \"不是路由函数，是一个真正执行判断逻辑的节点\"？","answerHtml":"<p><code>grade_docs</code> 承担的职责是判断检索到的文档是否足够回答问题，它是一个<strong>真正执行判断逻辑的节点</strong>；<code>route_after_grading</code>（条件边路由函数）承担的职责则是根据 <code>grade_docs</code> 的判断结果，决定走 <code>generate</code> 还是 <code>rewrite_query</code>。</p><pre><code class=\"language-python\">def grade_docs(state: AgenticRAGState) -&gt; dict:\n    ...\n    result = json.loads(call_llm(prompt, temperature=0))\n    return {&quot;is_relevant&quot;: result[&quot;is_relevant&quot;]}   # 写入 State\n\ndef route_after_grading(state: AgenticRAGState) -&gt; str:\n    if state[&quot;is_relevant&quot;]:\n        return &quot;generate&quot;\n    ...</code></pre><p><code>grade_docs</code> 是图里真正的一个节点，它会调用 LLM 去执行判断逻辑，并把判断结果 <code>is_relevant</code> 写进 State，这次调用和它产出的结果都会被记录在图的执行轨迹里，是可观测、可审计的一步。<code>route_after_grading</code> 不一样，它只是条件边的路由函数，单纯读取 State 里已经算好的 <code>is_relevant</code> 字段来做分支决策，本身不产生新的状态变更，也不调用模型。把&quot;产出判断结果&quot;和&quot;依据判断结果选边&quot;拆成两个不同的东西，正是 LangGraph 里的标准分工——节点负责有副作用的状态更新，条件边路由函数只做无副作用的纯读取分支。</p>"}]},{"name":"深化阶段·第 11 周复盘与深化阶段总结","questions":[{"qnum":1,"qtext":"判断\"A/C/B 三条线里哪条对项目提升最明显\"，应该用什么标准，而不是凭感觉？","answerHtml":"<p>三条判断标准：</p><pre><code>标准1：这条线解决的问题，在我的项目里是否真实存在过？\n标准2：这条线补齐后，是否有量化数据支撑&quot;确实变好了&quot;？\n       （路线B有RAGAS指标，路线C有生产就绪度检查清单，路线A有Agent行为评估框架）\n标准3：如果去掉这条线的产出，项目会立刻暴露出什么问题？</code></pre><p><strong>核心原则</strong>：这是一个需要结合自己项目实际短板回答的问题，没有统一的标准答案——一个知识库客服项目可能路线 B 收益最大，一个多步任务处理助手可能路线 A 收益最大，一个已对外服务的项目可能路线 C 是刚需，按这三条标准对照自己的项目逐条判断，比直接采纳任何&quot;通用答案&quot;更可靠。</p>"},{"qnum":2,"qtext":"plan.md 第四阶段（私有化部署/微调/多模态）什么时候才该考虑投入？","answerHtml":"<p><code>plan.md</code> 明确提醒：&quot;对纯应用开发岗，本阶段优先级低于把二、三阶段的 RAG/Agent 做深。多数业务问题应先用'更好的 Prompt + RAG + 工具'解决，微调是最后手段。&quot;</p><p>判断标准：</p><pre><code>如果 A/C/B 三条线都已经做到&quot;能给别人演示、有数据支撑&quot;的程度 → 可以按需进入第四阶段\n如果某条线明显还是短板 → 继续在这条线上加深，而不是急着往第四阶段扩展</code></pre><p><strong>关键判断点</strong>：是否有明确的业务场景需要私有化部署/微调（数据隐私要求、成本必须大幅降低、需要行业专有能力）——如果没有这类明确需求，且 Prompt+RAG+工具的空间还没用尽，第四阶段不该是下一步的默认选项。</p>"},{"qnum":3,"qtext":"深化阶段九条常见误区的共同本质是什么？","answerHtml":"<p>九条误区（框架崇拜、跳过LangChain学LangGraph、工程化一步到位、可观测性拖后、只优化不评估、安全一次性做完、反馈不回流、批处理缓存路由混淆、Agent过度设计）的共同本质是：</p><p><strong>深化阶段学的每一项能力都有明确的适用边界和引入信号，&quot;多学了一项能力&quot;不等于&quot;该无脑用上&quot;。</strong></p><p>这条方法论贯穿了 Day 52（工程化能力按隐性成本和规模信号判断）、Day 57（生产就绪度按流量规模判断）、Day 62（RAG 优化手段按召回/排序问题类型判断）、Day 67（第四阶段按业务需求判断）所有复盘日——判断&quot;什么时候该用&quot;比&quot;知道有这个技术&quot;更重要。</p>"},{"qnum":4,"qtext":"深化阶段三条路线（A/C/B）分别把项目从什么状态升级到了什么状态？","answerHtml":"<pre><code>路线A（Day 31-42）：Day 25 手写 ReAct 循环 → LCEL管道+StateGraph编排+Checkpoint持久化+\n                    Human-in-the-loop+MCP工具标准化+跨会话记忆+多Agent协作\n\n路线C（Day 43-57）：能力完备但生产不可维护的 Agent → 可观测+成本可控+架构统一+\n                    上下文/状态健壮+安全防护+反馈闭环+可部署\n\n路线B（Day 58-67）：Day 20 基础RAG系统 → 混合检索+Reranker+HyDE+查询改写+\n                    RAGAS量化评估+持续评估集+文档解析进阶+Agentic RAG</code></pre><p>三条路线分别针对&quot;编排能力&quot;&quot;生产工程化&quot;&quot;检索质量&quot;三个维度做深，共同把一个 30 天路线跑出来的基础 Agent+RAG 项目，升级成经得起真实场景考验的系统。</p>"},{"qnum":5,"qtext":"深化阶段最重要的一个认知转变是什么？","answerHtml":"<p>五个认知转变里最核心的一条是：<strong>从&quot;感觉答得不错&quot;到&quot;用 RAGAS 量化指标 + 持续评估集验证每一次改动&quot;</strong>——这个转变贯穿了整个 Day 63-66，把主观判断替换成了可复现、可对比、可追踪回归的数字指标。</p><p>其余四个认知转变（框架解决具体痛点而非炫技、生产可维护性可拆解为具体能力、安全需要多层防御纵深、检索优化需要区分召回/排序问题）都可以看作&quot;评估驱动&quot;这个核心原则在不同子领域的具体应用——没有量化验证，任何&quot;优化&quot;都只是主观感觉上的自我安慰。</p>"},{"qnum":6,"qtext":"判断标准里的\"标准 3\"（去掉这条线，项目会立刻暴露出什么问题），三条线各自对应的具体例子是什么？","answerHtml":"<pre><code>标准 3：如果去掉这条线的产出，项目会立刻暴露出什么问题？\n  去掉路线 A 的编排能力 → 复杂任务会退回手写 while 循环的脆弱状态\n  去掉路线 C 的安全护栏 → 项目直接不能上线\n  去掉路线 B 的检索优化 → 专业术语类问题答不准</code></pre><p><strong>这个标准的价值</strong>：比起抽象地问&quot;这条线重不重要&quot;，&quot;去掉它会立刻暴露什么问题&quot;是一个更具体、更可操作的自查方式——它把&quot;重要性&quot;翻译成了&quot;缺失后的具体故障场景&quot;，能帮助更准确地定位当前项目真正离不开哪条线的产出。</p>"},{"qnum":7,"qtext":"第 11 周（Day 63–66）这四天的内容体现了怎样的递进主线？","answerHtml":"<pre><code>Day 63（RAGAS 入门）：第一次跑出量化指标，替代&quot;感觉答得不错&quot;的主观判断\nDay 64（评估集与持续评估）：把&quot;跑一次评估&quot;固化成&quot;可重复运行的资产&quot;\nDay 65（文档解析进阶）：往 RAG 流程最上游排查——数据质量问题\nDay 66（RAG 深化版整合）：把前面所有能力（含检索优化+评估体系）整合成一个真正升级的系统</code></pre><p>这一周的主线是&quot;从有量化指标，到有可持续运行的评估资产，到往上游数据质量排查，最后整合成一个真正升级的系统&quot;——这也是整个路线 B（Day 58-67）&quot;提升 RAG 质量&quot;这条线的收尾一周：先解决&quot;怎么衡量好不好&quot;，再解决&quot;怎么持续衡量&quot;，再解决&quot;数据源头干不干净&quot;，最后把所有能力拧成一股绳整合进实际系统。</p>"},{"qnum":8,"qtext":"深化阶段结束后，除了\"继续在短板路线加深\"和\"按需评估第四阶段\"外，还有第三个候选方向是什么？分别对应什么信号？","answerHtml":"<pre><code>候选 1：某条线（A/C/B）仍是明显短板 → 继续在这条线上加深\n候选 2：三条线都已经&quot;能演示、有数据支撑&quot; → 可以按需评估第四阶段\n候选 3：三条线都够用，且没有第四阶段的明确业务需求 → 转向横向深化或新方向\n        例如：把当前项目真正推向生产使用、持续收集真实反馈（回到 Day 55 的反馈闭环机制）\n        用真实用户数据反过来验证和迭代已经学过的全部能力</code></pre><p><strong>候选 3 对应的信号</strong>：既不是&quot;某条线明显短板需要补&quot;，也不是&quot;有明确的私有化部署/微调/多模态业务需求&quot;，而是三条线都已经达标、但也没有第四阶段的硬性理由——这种情况下最有价值的下一步不是继续往技术清单上添新能力，而是把已经具备的能力真正推向生产、用真实用户数据反过来检验和迭代，这本身就是一种&quot;深化&quot;，只是深化的对象从&quot;学新技术&quot;变成了&quot;用真实反馈打磨已有系统&quot;。</p>"}]},{"name":"深化阶段·补充篇·FastAPI 后端工程","questions":[{"qnum":1,"qtext":"Day 26 的 Gradio 内嵌调用方式，存在什么结构性限制？FastAPI 解决了哪三个问题？","answerHtml":"<p>Gradio 方案是在界面回调函数里直接调用 LLM/RAG/Agent 逻辑，界面代码和推理逻辑运行在同一个进程里——<strong>只有 Gradio 这一个前端能调用这套逻辑</strong>，如果想让手机 App、其他内部系统也用上同一套能力，就得复制一份逻辑接进新的调用方。</p><p>FastAPI 解决的三个问题：</p><pre><code>多客户端复用：独立后端 API 后，任意 HTTP 客户端都能调用同一套推理逻辑\n前后端职责分离：前端只管展示交互，后端只管推理和业务逻辑，两者可独立开发部署扩容\n自动生成接口文档：基于类型注解自动生成 Swagger UI，不需要额外手写接口说明文档</code></pre>"},{"qnum":2,"qtext":"FastAPI 的请求/响应模型为什么直接复用 Pydantic？这带来了什么好处？","answerHtml":"<pre><code class=\"language-python\">class ChatRequest(BaseModel):\n    question: str = Field(..., min_length=1, description=&quot;用户问题，不能为空&quot;)\n    session_id: str = Field(default=&quot;default&quot;)</code></pre><p>其实 Day 8 就已经用 Pydantic 做过结构化输出的字段约束了，FastAPI 的请求响应模型用的是同一套机制。<strong>好处</strong>：好处很直接：类型注解会被 FastAPI 自动拿去做请求体解析和校验——如果客户端传来的 <code>question</code> 是空字符串，FastAPI 在进入函数体之前就会自动返回 422 错误，根本不需要像 Day 8、9 那样手写 <code>if not question</code> 之类的校验代码。这本质上是把&quot;手写校验逻辑&quot;升级成了&quot;框架自动校验&quot;，跟 Day 8 的 Pydantic 结构化输出是同一套思路的复用。</p>"},{"qnum":3,"qtext":"Depends 依赖注入解决的是什么问题？举例说明它比在每个端点里重复写校验代码好在哪里？","answerHtml":"<pre><code class=\"language-python\">def verify_api_key(x_api_key: str = Header(...)):\n    if x_api_key != EXPECTED_API_KEY:\n        raise HTTPException(status_code=401, detail=&quot;无效的 API Key&quot;)\n    return x_api_key\n\n@app.post(&quot;/chat&quot;)\ndef chat(request: ChatRequest, api_key: str = Depends(verify_api_key)):\n    ...</code></pre><p><code>Depends</code> 把&quot;校验 API Key&quot;这类<strong>横切逻辑</strong>从业务函数体里抽出来，声明成一个独立的依赖项。<strong>好处</strong>：如果有 10 个端点都需要鉴权，不需要在每个端点函数内部重复写一遍校验代码，只需要在每个函数签名里加一个 <code>Depends(verify_api_key)</code>——修改校验逻辑时只改一处，而不是十处地方分别改。这是&quot;横切关注点和业务逻辑解耦&quot;的具体实现，和 Day 35 里&quot;Checkpoint 是横切关注点，不侵入业务逻辑&quot;是同一种设计思想。</p>"},{"qnum":4,"qtext":"FastAPI 里怎么实现流式输出？和 Day 4/26 已经做过的流式输出是什么关系？","answerHtml":"<pre><code class=\"language-python\">from fastapi.responses import StreamingResponse\n\ndef token_generator(question: str):\n    for chunk in call_llm_stream(question):\n        yield chunk\n\n@app.post(&quot;/chat/stream&quot;)\ndef chat_stream(request: ChatRequest):\n    return StreamingResponse(token_generator(request.question), media_type=&quot;text/event-stream&quot;)</code></pre><p><code>StreamingResponse</code> 接收一个生成器（<code>yield</code> 而不是 <code>return</code>），HTTP 响应随着生成器产出内容逐步发送，而不是等全部生成完毕才一次性返回。<strong>和之前的关系</strong>：Day 4 在 CLI 里直接 <code>print</code> 逐字输出，Day 26 把同样的生成器 <code>yield</code> 给 Gradio 的流式回调，Day 68 把同一个生成器包进 <code>StreamingResponse</code>——三者底层都是同一套&quot;生成器逐步产出内容&quot;的思路，只是外层的展示载体（终端/Gradio界面/HTTP响应）不同。</p>"},{"qnum":5,"qtext":"是不是所有 LLM 项目都应该拆成独立的 FastAPI 后端？判断标准是什么？","answerHtml":"<p>不是。判断标准：</p><pre><code>只需要自己/团队内部演示 → Gradio 内嵌调用，引入成本最低，够用\n需要多个不同客户端调用同一套推理能力（网页+App、需要被其他内部系统调用）→ 独立 FastAPI 后端</code></pre><p>如果只是个人 Demo 或快速原型验证，拆成独立后端反而增加了维护成本（要单独设计请求/响应模型、单独部署服务）——这和整个深化阶段反复强调的&quot;按信号引入，而非无脑叠加&quot;是同一个判断逻辑：FastAPI 后端解决的是&quot;多客户端复用&quot;这个具体问题，只有这个问题真实存在时，引入它才有收益。</p>"},{"qnum":6,"qtext":"`/health` 健康检查端点的实现只有一行返回逻辑，为什么笔记里把它称为\"生产部署的标配\"？它在容器化部署和负载均衡场景里起什么作用？","answerHtml":"<pre><code class=\"language-python\">@app.get(&quot;/health&quot;)\ndef health_check():\n    return {&quot;status&quot;: &quot;ok&quot;, &quot;model_gateway&quot;: model_gateway.is_ready()}   # 复用 Day 48 的网关状态</code></pre><ul><li>健康检查端点故意设计得极简，不涉及任何业务逻辑（不调用 RAG/LLM），只是快速返回服务本身是否存活——这样负载均衡器和容器编排系统才能用很低的开销、高频率地探测某个实例是否还活着（笔记原文：&quot;健康检查端点是生产部署的标配（Day 56 的容器化部署、云平台的负载均衡都依赖它判断实例是否存活）&quot;）。</li><li>具体实现里顺带返回了 <code>model_gateway.is_ready()</code>（复用 Day 48 的模型网关状态），意味着这个端点不仅回答&quot;进程还在不在&quot;，也能回答&quot;关键依赖（模型网关）是否已经就绪可用&quot;。</li><li>如果没有这个端点：Day 56 的容器化部署和云平台负载均衡就没有标准化的方式判断某个实例是否可以接收流量，只能盲发请求，可能把请求打到一个已经出问题但进程还没退出的实例上。</li></ul>"},{"qnum":7,"qtext":"给已有项目接入 FastAPI 时，`api.py` 里为什么没有重新实现 Agentic RAG 的推理逻辑？这体现了和 Day 66 一致的什么设计原则？","answerHtml":"<pre><code class=\"language-python\">from agentic_rag.graph import graph as agentic_rag_graph   # 复用 Day 66 的 Agentic RAG 图\nfrom gateway.gateway import model_gateway                    # 复用 Day 48 的模型网关\n\n@app.post(&quot;/chat&quot;, response_model=ChatResponse)\ndef chat(request: ChatRequest):\n    result = agentic_rag_graph.invoke(\n        {...},\n        config={&quot;configurable&quot;: {&quot;thread_id&quot;: request.session_id}},   # 复用 Day 35 的会话隔离\n    )\n    return ChatResponse(answer=result[&quot;answer&quot;], trace_id=request.session_id)</code></pre><p><code>api.py</code> 只是一层薄薄的 HTTP 包装：真正的推理逻辑（Agentic RAG 图来自 Day 66、模型网关来自 Day 48、会话隔离机制来自 Day 35）全部是之前已经独立实现好的模块，FastAPI 层不重新写业务逻辑，只负责把已有能力暴露成标准的 HTTP 接口。</p><p>这和 Day 66 强调的&quot;框架负责编排，具体能力模块保持独立复用&quot;是同一个设计原则——FastAPI 在这里扮演的也是&quot;编排/暴露&quot;的角色，而不是重新实现一遍推理能力。好处是：Agentic RAG 图、模型网关等模块可以脱离 FastAPI 独立测试、独立复用（比如未来接入 CLI 或其他前端框架），不会因为套了一层 HTTP 外壳就被锁死在 FastAPI 里。</p>"}]},{"name":"深化阶段·补充篇·Claude Code Skills 教程","questions":[{"qnum":1,"qtext":"Claude Code Skill 和斜杠命令、CLAUDE.md 分别有什么区别？","answerHtml":"<p>这三者不一样的地方可以从几个方面说。先说触发方式，斜杠命令是显式的，用户必须记住命令名主动敲出来；Skill 既能显式调用，写个 <code>/skill-name</code>，也能靠语义匹配自动触发；CLAUDE.md 压根不存在&quot;触发&quot;这个概念，每次对话都会自动加载。再看内容性质，斜杠命令是单个可执行的动作；Skill 针对的是某类重复性任务的多步骤操作流程；CLAUDE.md 装的是项目背景、约定这些长期有效的规则。最后是加载时机，斜杠命令是调用的时候才加载；Skill 只在任务匹配上了才按需加载；CLAUDE.md 是每次对话一开始就加载好的。</p><p><strong>核心区别</strong>：斜杠命令要求用户&quot;记住咒语&quot;，Skill 让 Claude 自己判断某个任务是否该用某个 Skill；CLAUDE.md 是&quot;始终相关&quot;的背景信息，Skill 是&quot;只在匹配到特定任务时才相关&quot;的操作流程。</p>"},{"qnum":2,"qtext":"SKILL.md 的 description 字段为什么说是\"匹配算法读取的触发条件\"而不是简介？写的时候要注意什么？","answerHtml":"<pre><code class=\"language-yaml\">description: This skill should be used when the user asks to &quot;写 DayN 学习笔记&quot;,\n  &quot;生成学习笔记&quot;, &quot;补一篇学习笔记&quot;, &quot;更新面试题&quot;, &quot;同步面试题&quot;, &quot;更新进度&quot;, &quot;同步 README&quot;, ...</code></pre><p>description 不是给人看的一句话概括，而是 Claude 判断&quot;这个任务该不该用这个 Skill&quot;的核心依据——<strong>写的时候要覆盖用户可能的多种真实说法</strong>（&quot;写学习笔记&quot;/&quot;补笔记&quot;/&quot;更新面试题&quot;），而不是只写一句抽象的&quot;用来管理学习笔记&quot;。description 覆盖的措辞越具体，用户换一种说法提需求时越不容易漏配。</p>"},{"qnum":3,"qtext":"为什么 Skill 要把详细格式规范拆进 references/ 子目录，而不是全写进 SKILL.md 主文件？","answerHtml":"<pre><code>.claude/skills/day-note-sync/\n├── SKILL.md              # 精简：只有&quot;何时用+步骤概览&quot;\n└── references/           # 详细：格式规范、模板，按需加载\n    ├── note-template.md\n    ├── interview-questions-sync.md\n    └── readme-sync.md</code></pre><p><strong>原因是控制上下文 Token 消耗</strong>：如果把所有细节都写进 <code>SKILL.md</code> 本体，每次哪怕只是判断&quot;要不要用这个 Skill&quot;都要把全部细节加载进上下文；拆分成&quot;精简主文件 + 按需加载的参考文件&quot;后，只有真正开始执行到具体某一步时才会去读取对应的参考文件，平时不产生这部分开销。</p>"},{"qnum":4,"qtext":"设计一个 Skill 时，\"缺信息先问用户不瞎猜\"这条原则解决的是什么问题？","answerHtml":"<pre><code>开始前确认拿到：Day 编号、主题名、以及这天要覆盖的知识点列表\n（若用户没给，先向用户要一份要点清单，不要凭空编造技术细节）</code></pre><p>这条原则是一道<strong>安全阀</strong>，防止 Skill 在关键信息缺失的情况下自己瞎编内容继续往下执行——比如写学习笔记时如果不知道具体要覆盖哪些知识点，Skill 不应该凭空编造技术细节填充，而应该先向用户要清单。这保证了 Skill 产出的内容是基于真实信息，而不是&quot;看起来像那么回事&quot;但实际编造的内容。</p>"},{"qnum":5,"qtext":"什么样的任务适合封装成 Skill，什么样的任务适合用 Subagent，什么样的适合直接用普通 Prompt？","answerHtml":"<pre><code>一次性、不会重复的需求 → 普通 Prompt，不需要封装\n反复出现、每次都需要按同样步骤/格式执行 → Skill（保证一致性，不会因不同对话遗漏步骤）\n需要大量独立探索/试错、不希望污染主对话上下文 → Subagent（完全独立的上下文，只把最终结果带回）</code></pre><p><strong>判断标准</strong>：核心看&quot;是否会重复&quot;和&quot;是否需要隔离上下文&quot;两个维度——只做一次的任务封装成 Skill 是浪费；会反复出现但探索量不大的任务（如本仓库每次写新一天笔记都要做的四件事）适合封装成 Skill；需要在大量文件里翻找、可能产生大量中间噪音的任务，更适合丢给 Subagent 去独立处理。</p>"},{"qnum":6,"qtext":"项目级 Skill 和个人级 Skill 分别放在什么位置？分别适合什么场景？为什么 day-note-sync 应该是项目级而不是个人级？","answerHtml":"<pre><code>项目级 Skill：.claude/skills/&lt;name&gt;/SKILL.md，随仓库提交，团队所有人共享\n个人级 Skill：通常在用户主目录下的全局配置里，只对当前用户生效，不会被提交进项目仓库</code></pre><ul><li>项目级 Skill 适合&quot;这个仓库特有的重复性任务&quot;——day-note-sync 依赖这个仓库的具体目录结构（学习笔记/、面试题.md、规划文档/plan.md 等），离开这个仓库就没有意义，所以应该放进 <code>.claude/skills/day-note-sync/</code> 随仓库提交，让协作者都能用同一套流程，不需要每人各自维护一份。</li><li>个人级 Skill 适合&quot;我个人在所有项目里都想用的习惯性流程&quot;（比如个人的 commit message 风格偏好），这类 Skill 和具体某个仓库的结构无关，写进某个项目仓库反而会给其他协作者带来困惑（&quot;这个 Skill 为什么在这里，跟这个项目有什么关系&quot;），所以应该放在用户主目录的全局配置里，不提交进项目仓库。</li></ul><p><strong>判断标准</strong>：这个流程离开当前仓库还有没有意义——有意义 → 项目级；只对自己有意义 → 个人级。</p>"},{"qnum":7,"qtext":"day-note-sync 五条设计原则里，\"步骤固定有序\"和\"结尾自检清单\"分别解决什么问题？如果一个 Skill 缺了这两条会出现什么后果？","answerHtml":"<pre><code>③ 正文按步骤列出&quot;四件事要按顺序整套执行&quot;\n   ——写笔记→面试题→路线图→README，每一步都写清楚&quot;在哪个文件、插入到什么位置&quot;\n   这保证了每次调用行为一致，不会因为不同对话而随意变动执行顺序\n\n⑤ 结尾有&quot;完成后自检&quot;清单\n   ——四个文件是否都改了、编号是否连续、有没有把未完成的 Day 标记成已完成\n   这是执行完毕后的质量门控，防止 Skill 执行到一半漏了某一步却没被发现</code></pre><ul><li>&quot;步骤固定有序&quot;解决的是<strong>执行一致性</strong>问题：把&quot;写笔记→面试题→路线图→README&quot;这四件事的顺序和每一步该改哪个文件、插入到什么位置都写死，保证不管哪次对话触发这个 Skill，行为都完全一样，不会因为不同的上下文或不同的措辞而漏做某一步或做错顺序。</li><li>&quot;结尾自检清单&quot;解决的是<strong>质量门控</strong>问题：在 Skill 执行完之后再检查一遍&quot;四个文件是否都改了、编号是否连续、有没有把未完成的 Day 标记成已完成&quot;，这是执行完毕后的最后一道检查，防止 Skill 中途漏了某一步但没有被察觉。</li><li>缺了&quot;步骤固定有序&quot;：Skill 的行为会退化成和普通 Prompt 差不多，每次执行顺序可能不一样，起不到&quot;保证一致性&quot;的封装价值。</li><li>缺了&quot;自检清单&quot;：即使 Skill 执行到一半出错漏了某一步（比如笔记写了但面试题忘了同步），也没有机制能发现这个遗漏，问题会被悄悄带到下一次对话才被用户发现。</li></ul>"},{"qnum":8,"qtext":"动手写的 commit-message-helper 示例里，为什么明确规定\"只输出建议的 commit message 文本，不要自动执行 `git commit`\"？这体现了设计 Skill 时的什么原则？","answerHtml":"<pre><code class=\"language-markdown\">## 输出格式\n\n只输出建议的 commit message 文本，不要自动执行 `git commit`——是否提交由用户决定。</code></pre><ul><li>这条规定明确划定了 Skill 的<strong>输出边界</strong>：Skill 负责生成建议内容，但不代替用户做出&quot;是否提交&quot;这个决策性动作。</li><li>原因是 <code>git commit</code> 是一个有副作用、会改变仓库历史的操作——如果 Skill 自动执行，一旦生成的 commit message 判断错了改动类型（比如把 <code>fix</code> 误判成 <code>feat</code>），或者用户其实还想再改动一些内容才提交，自动提交就没有回退的余地，用户失去了&quot;确认后再执行&quot;的把关机会。</li><li>笔记原文把这总结为&quot;即使是简单任务，也要写清楚'到哪一步为止'，避免 Skill 擅自做超出预期的操作&quot;——这是除了&quot;description 覆盖多种说法&quot;&quot;步骤固定有序&quot;之外，设计 Skill 时另一个容易被忽视但同样重要的原则：<strong>Skill 的自主性应该止步于&quot;生成建议&quot;，凡是有副作用、不可逆、或者应该由用户最终拍板的动作，都应该留给用户手动确认执行</strong>，这和 Day 36 human-in-the-loop 人工审核节点的思路是相通的。</li></ul>"}]}]};
</script>

<script>
(function () {
  "use strict";

  var groups = QUIZ_DATA.groups;

  // Build flat list for prev/next navigation
  var flat = [];
  groups.forEach(function (g, gi) {
    g.questions.forEach(function (q, qi) {
      flat.push({ groupIndex: gi, groupName: g.name, qnum: q.qnum, qtext: q.qtext, answerHtml: q.answerHtml });
    });
  });

  var STORAGE_KEY = "quiz_last_index";
  var current = 0;
  try {
    var saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (!isNaN(saved) && saved >= 0 && saved < flat.length) current = saved;
  } catch (e) {}

  var topbarTitle = document.getElementById("topbar-title");
  var topbarProgress = document.getElementById("topbar-progress");
  var breadcrumb = document.getElementById("breadcrumb");
  var qnumBadge = document.getElementById("qnum-badge");
  var qtext = document.getElementById("qtext");
  var revealBtn = document.getElementById("reveal-btn");
  var answerBox = document.getElementById("answer-box");
  var answerContent = document.getElementById("answer-content");
  var prevBtn = document.getElementById("prev-btn");
  var nextBtn = document.getElementById("next-btn");
  var sidebar = document.getElementById("sidebar");
  var sidebarBackdrop = document.getElementById("sidebar-backdrop");
  var hamburger = document.getElementById("hamburger");
  var mainEl = document.getElementById("main");
  var bottomNav = document.getElementById("bottom-nav");

  // Reserve exactly (bottom-nav height + 100px) at the bottom of #main so the
  // last bit of a long answer never sits underneath the fixed bottom nav.
  function syncBottomSpace() {
    var reserve = bottomNav.offsetHeight + 100;
    mainEl.style.paddingBottom = reserve + "px";
  }

  // ---------- Build sidebar ----------
  var groupEls = []; // {el, questionEls: []}

  groups.forEach(function (g, gi) {
    var block = document.createElement("div");
    block.className = "group-block";

    var header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML =
      '<svg class="chevron" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<span class="gname"></span>' +
      '<span class="gcount">' + g.questions.length + '</span>';
    header.querySelector(".gname").textContent = g.name;
    block.appendChild(header);

    var list = document.createElement("div");
    list.className = "question-list";

    var questionEls = [];
    g.questions.forEach(function (q, qi) {
      var item = document.createElement("div");
      item.className = "question-item";
      var flatIndex = flat.findIndex(function (f) { return f.groupIndex === gi && f.qnum === q.qnum; });
      item.dataset.index = flatIndex;
      item.innerHTML = '<span class="qtag">Q' + q.qnum + '</span><span class="qsnippet"></span>';
      item.querySelector(".qsnippet").textContent = q.qtext;
      item.addEventListener("click", function () {
        goTo(parseInt(item.dataset.index, 10));
        closeSidebarOnMobile();
      });
      list.appendChild(item);
      questionEls.push(item);
    });
    block.appendChild(list);

    header.addEventListener("click", function () {
      block.classList.toggle("open");
    });

    sidebar.appendChild(block);
    groupEls.push({ el: block, questionEls: questionEls });
  });

  function closeSidebarOnMobile() {
    if (window.innerWidth <= 768) {
      sidebar.classList.remove("open");
      sidebarBackdrop.classList.remove("open");
    }
  }

  hamburger.addEventListener("click", function () {
    sidebar.classList.toggle("open");
    sidebarBackdrop.classList.toggle("open");
  });
  sidebarBackdrop.addEventListener("click", closeSidebarOnMobile);

  // ---------- Render ----------
  function render(index) {
    var item = flat[index];

    breadcrumb.textContent = item.groupName;
    qnumBadge.textContent = "第 " + item.qnum + " 题（本组）";
    qtext.textContent = item.qtext;
    answerContent.innerHTML = item.answerHtml;

    answerBox.classList.remove("visible");
    revealBtn.classList.remove("is-shown");
    revealBtn.textContent = "查看答案";

    topbarTitle.textContent = item.groupName;
    topbarProgress.textContent = (index + 1) + " / " + flat.length;

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === flat.length - 1;

    // sidebar active state + auto-expand + scroll into view
    groupEls.forEach(function (g, gi) {
      var isCurrentGroup = gi === item.groupIndex;
      g.el.classList.toggle("open", isCurrentGroup || g.el.classList.contains("open"));
      g.questionEls.forEach(function (el) {
        el.classList.toggle("active", parseInt(el.dataset.index, 10) === index);
      });
    });
    var activeEl = sidebar.querySelector(".question-item.active");
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });

    window.scrollTo(0, 0);

    try { localStorage.setItem(STORAGE_KEY, String(index)); } catch (e) {}
  }

  function goTo(index) {
    if (index < 0 || index >= flat.length) return;
    current = index;
    render(current);
  }

  revealBtn.addEventListener("click", function () {
    var showing = answerBox.classList.toggle("visible");
    revealBtn.classList.toggle("is-shown", showing);
    revealBtn.textContent = showing ? "隐藏答案" : "查看答案";
  });

  prevBtn.addEventListener("click", function () { goTo(current - 1); });
  nextBtn.addEventListener("click", function () { goTo(current + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") goTo(current - 1);
    else if (e.key === "ArrowRight") goTo(current + 1);
    else if (e.key === " ") { e.preventDefault(); revealBtn.click(); }
  });

  window.addEventListener("resize", syncBottomSpace);

  syncBottomSpace();
  render(current);
})();
</script>
</body>
</html>
