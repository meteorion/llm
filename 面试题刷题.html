exchange_rate.py\n└── tests/\n    └── test_tools.py</code></pre><p><strong>各模块职责边界</strong>（关键是&quot;谁知道什么&quot;）：各模块的职责边界关键在于&quot;谁知道什么&quot;。tools 目录知道工具具体怎么执行，但不知道 LLM 是谁、UI 长什么样。core/workflow.py 知道该怎么调用 LLM 和工具，但不知道 UI 要怎么展示。app.py 知道 UI 组件怎么绑定，但不知道工具内部的实现细节。</p><p><strong>整合步骤</strong>：</p><ul><li>识别各 Day Demo 的可复用模块，提取到对应目录</li><li>统一配置入口（所有 <code>os.getenv</code> 改为从 <code>config.py</code> 读取）</li><li>统一日志初始化（主入口 <code>logging.basicConfig</code> 一次，子模块 <code>logging.getLogger(__name__)</code>）</li><li>确认模块独立可测（<code>python core/workflow.py</code> 无需启动 UI 即可运行）</li></ul>"},{"qnum":3,"qtext":".env.example 和 .gitignore 应该怎么写？为什么不能提交 .env 文件？","answerHtml":"<p><strong>.env 不能提交的原因</strong>：<code>.env</code> 里包含真实的 API Key，一旦推送到 GitHub（即使删掉也可能在历史记录里），Key 可能被爬虫扫描到并滥用，导致账单被盗刷或账号被封禁。</p><p><strong><code>.env.example</code>（只含模板，不含真实值）</strong>：</p><pre><code class=\"language-bash\"># .env.example — 复制为 .env 并填入真实值\nDEEPSEEK_API_KEY=your_api_key_here\n# MODEL=deepseek-chat     # 可选，默认使用 deepseek-chat</code></pre><p><strong><code>.gitignore</code>（必须包含的条目）</strong>：</p><pre><code># 环境变量（绝对不能提交）\n.env\n\n# Python 缓存\n__pycache__/\n*.pyc\n*.pyo\n\n# 编辑器文件\n.DS_Store\n.idea/\n.vscode/\n\n# 依赖目录（应通过 requirements.txt 安装）\nvenv/\n.venv/</code></pre><p><strong>操作流程</strong>：</p><ul><li>先提交 <code>.env.example</code> 到 git（让别人知道要配置什么）</li><li>创建 <code>.gitignore</code> 排除 <code>.env</code></li><li>用户克隆后：<code>cp .env.example .env</code>，填入真实 key</li></ul>"},{"qnum":4,"qtext":"如何从零搭建一个\"可调用工具的个人助理\"完整项目？描述模块划分和关键实现。","answerHtml":"<p>核心设计：<strong>tools 独立 + core 封装工作流 + app.py 纯 UI + 统一配置</strong>。</p><p><strong>模块划分</strong>：</p><pre><code>tools/          → 工具实现（可独立运行，不依赖 LLM）\ncore/config.py  → 统一配置（CFG dataclass，frozen=True 防止误修改）\ncore/client.py  → LLM 客户端单例（避免每次 import 都创建新客户端）\ncore/workflow.py → 多步 for 循环 + WorkflowResult 记录\napp.py          → Gradio Blocks（左侧聊天 + 右侧工具链 + 两个 State）</code></pre><p><strong>关键实现要点</strong>：</p><pre><code class=\"language-python\"># 1. 配置单例（frozen dataclass 防止意外修改）\nCFG = Config(api_key=os.getenv(&quot;DEEPSEEK_API_KEY&quot;), ...)\n\n# 2. 客户端单例（避免重复创建）\n_client = None\ndef get_client():\n    global _client\n    if _client is None:\n        _client = OpenAI(api_key=CFG.api_key, base_url=CFG.base_url)\n    return _client\n\n# 3. 工作流：for-else 区分正常退出和超限退出\nfor _ in range(CFG.max_iterations):\n    msg = get_client().chat.completions.create(...).choices[0].message\n    if not msg.tool_calls:\n        break\n    # 执行工具...\nelse:\n    # 超出上限，强制生成\n\n# 4. UI：两个 State，职责分离\nmessages_state = gr.State(value=None)   # 工作流历史（给模型用）\nchain_state = gr.State(value=&quot;&quot;)        # 调用链文本（给展示用）</code></pre><p><strong>三个关键验证点</strong>：</p><ul><li><code>python tools/weather.py</code> 直接运行 → 工具可独立测试</li><li><code>python core/workflow.py</code> 直接运行 → 工作流无需 UI 即可验证</li><li><code>python app.py</code> + 浏览器测试 3 种问题（0/1/2 步工具）→ 全流程正确</li><li><strong><code>temperature=0</code></strong>：两次调用都设 0，保证触发行为和最终回答的一致性，方便测试</li></ul>"}]},{"name":"补工程细节","questions":[{"qnum":1,"qtext":"LLM 项目中异常处理的\"分层设计\"是什么？各层应该如何处理各自的异常？","answerHtml":"<p>分层设计指不同代码层只处理自己能解决的异常，不能处理的向上抛或降级，具体分三层。第一层是工具层，位于 <code>tools/*.py</code>，处理策略是 <code>return {&quot;error&quot;: True, &quot;message&quot;: &quot;...&quot;}</code>，错误表现为工具返回错误 dict，让模型基于这个 dict 生成友好回复。第二层是工作流层，位于 <code>core/workflow.py</code>，处理策略是捕获 API 异常（超时、限流、认证），能重试的就重试，错误表现是返回错误文案，并把 <code>terminated_by</code> 标记为 &quot;error&quot;。第三层是 UI 层，位于 <code>app.py</code>，处理策略是用 <code>try/except Exception</code> 兜底，错误表现是用户只看到友好文案，不会看到 traceback。</p><p><strong>工具层不抛异常的原因</strong>：工作流用 for 循环驱动，工具抛异常会中断整个循环；返回 error dict 让模型能基于错误信息生成自然语言提示（&quot;这个城市暂不支持，您是想查哪里？&quot;）。</p><p><strong>工作流层重试策略</strong>：</p><pre><code class=\"language-python\">except RateLimitError:\n    time.sleep(5 * (attempt + 1))   # 指数退避\n    continue\nexcept AuthenticationError:\n    return WorkflowResult(final_answer=&quot;API Key 验证失败&quot;, terminated_by=&quot;auth_error&quot;)\n    # 认证错误无需重试，直接返回</code></pre>"},{"qnum":2,"qtext":"给 LLM 项目加日志时，应该记录哪三类关键信息？各自的内容是什么？","answerHtml":"<p>这三类日志分别是启动日志、请求日志和错误日志。第一类是启动日志，在程序启动时记录，内容包括模型名称、API Base URL、Key 的前几位（脱敏处理）、以及最大迭代次数，用途是确认配置正确、便于定位环境问题。第二类是请求日志，在每次 API 调用后记录，内容包括耗时（秒）、input_tokens、output_tokens、total_tokens，用途是做性能分析、成本监控，及时发现异常高消耗的情况。第三类是错误日志，在异常发生时记录，内容包括工具名称、参数、异常类型，并配合 <code>logger.exception()</code> 自动附加完整的 traceback，用途是不需要重现问题就能排查原因。</p><p><strong>关键细节</strong>：</p><ul><li>API Key <strong>绝对不能完整打印</strong>到日志，只打印前 8 位作为验证标识</li><li>使用 <code>logger.exception()</code> 而不是 <code>logger.error()</code>，前者自动附加完整异常链（traceback）</li><li><code>logging.basicConfig</code> 只在主入口调用<strong>一次</strong>；子模块用 <code>logging.getLogger(__name__)</code> 继承</li></ul>"},{"qnum":3,"qtext":"什么是\"fail-fast\"？配置验证为什么要在启动时而不是请求时做？","answerHtml":"<p><strong>Fail-fast</strong>：系统在检测到错误配置时立即停止执行，而不是等到运行时才暴露错误。</p><p>这两种做法可以从几个角度来对比。先看错误发现的时机：不做验证的话，往往要等用户发第一条消息触发调用才会崩溃，而做了启动时验证，程序启动几秒内配置有问题就直接报错退出了，根本不用等有人来用。再看错误定位，不做验证时抛出来的是很深层的异常，光看报错很难判断是配置问题还是代码问题；做了 fail-fast 之后，会直接给出类似&quot;DEEPSEEK_API_KEY 未设置&quot;这种明确到位的提示。然后是成本风险，不做验证如果是跑了好几次请求才报错，Token 可能已经白白消耗掉了，而 fail-fast 是在真正调用模型之前就拦住了，成本是零。最后是用户体验，不做验证用户看到的是一堆 Python 的 traceback，很唬人；做了 fail-fast 用户看到的是&quot;请检查 .env 文件&quot;这种友好提示，体验完全不一样。</p><p><strong>实现模式</strong>：</p><pre><code class=\"language-python\">def _load() -&gt; Config:\n    errors = []\n    key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;, &quot;&quot;).strip()\n    if not key:\n        errors.append(&quot;DEEPSEEK_API_KEY 未设置&quot;)\n    if errors:\n        print(&quot;❌ 配置错误：&quot; + &quot;；&quot;.join(errors))\n        sys.exit(1)   # fail-fast：立即退出\n    return Config(api_key=key, ...)\n\nCFG = _load()   # 模块 import 时就执行，最早被触发</code></pre>"},{"qnum":4,"qtext":"工具调用的输出校验（output validation）应该验证什么？如何实现？","answerHtml":"<p>输出校验防止&quot;脏数据&quot;（格式错误的数据）传入下一层。应在三处做校验：</p><p><strong>1. 工具返回值校验</strong>（工作流层接收工具结果时）：</p><pre><code class=\"language-python\">def validate_tool_result(name: str, result: dict) -&gt; dict:\n    if not isinstance(result, dict):\n        return {&quot;error&quot;: True, &quot;message&quot;: &quot;工具返回格式错误&quot;}\n    if result.get(&quot;error&quot;):\n        return result  # 已经是合法错误 dict，直接透传\n    missing = [f for f in REQUIRED_FIELDS.get(name, []) if f not in result]\n    if missing:\n        logger.warning(&quot;工具 '%s' 返回缺少字段：%s&quot;, name, missing)\n    return result</code></pre><p><strong>2. LLM 结构化输出校验</strong>（需要模型返回 JSON 时）：</p><ul><li>使用 <code>response_format={&quot;type&quot;: &quot;json_object&quot;}</code> 约束格式</li><li>用 Pydantic <code>model_validate_json()</code> 验证字段</li><li>校验失败时降级返回默认值，不崩溃</li></ul><p><strong>3. 工作流整体输出校验</strong>：</p><pre><code class=\"language-python\">if not wf.final_answer.strip():\n    wf.final_answer = &quot;未能生成回答，请重新提问。&quot;</code></pre>"},{"qnum":5,"qtext":"如何从零给一个 LLM 项目补全\"异常处理 + 日志 + 配置验证 + 输出校验\"四件套？","answerHtml":"<p>按以下顺序改造，优先做影响最大的：</p><p><strong>Step 1：配置验证（改 <code>core/config.py</code>）</strong></p><ul><li>把 <code>Config</code> 加载逻辑包在 <code>_load()</code> 函数里</li><li>收集所有配置错误（不要发现一个就退出，收集全部后一次性报错）</li><li><code>if errors: sys.exit(1)</code>，模块级调用 <code>CFG = _load()</code></li></ul><p><strong>Step 2：日志初始化（改 <code>app.py</code> 主入口）</strong></p><ul><li>在 <code>if __name__ == &quot;__main__&quot;:</code> 前调用 <code>setup_logging()</code></li><li><code>httpx</code>/<code>httpcore</code> 降级为 WARNING 避免刷屏</li><li>各子模块添加 <code>logger = logging.getLogger(__name__)</code></li></ul><p><strong>Step 3：API 异常处理（改 <code>core/workflow.py</code>）</strong></p><ul><li>把 API 调用包在 <code>_call_api()</code> 函数里</li><li><code>RateLimitError</code> → 重试 3 次（指数退避）</li><li><code>AuthenticationError</code> → 立即返回错误，不重试</li><li><code>APITimeoutError/APIConnectionError</code> → 抛 <code>ConnectionError</code>，上层捕获</li></ul><p>**Step 4：工具层（改 <code>tools/*.py</code>）**</p><ul><li>所有工具用 <code>try/except</code> 包裹，返回 <code>{&quot;error&quot;: True, &quot;message&quot;: &quot;...&quot;}</code> 而非抛异常</li><li>在 <code>dispatch()</code> 里加 <code>TypeError</code> 捕获（参数不匹配）和兜底 <code>Exception</code></li></ul><p><strong>Step 5：UI 兜底（改 <code>app.py</code> 的 respond 函数）</strong></p><ul><li><code>try/except Exception</code> 包裹整个业务调用</li><li>把技术错误转成用户友好文案</li></ul><p><strong>验证顺序</strong>：先删 API Key 测 fail-fast → 再 mock RateLimitError 测重试 → 再传错工具参数测工具兜底 → 最后整体跑 5 次对话验日志输出。</p>"}]},{"name":"测试和优化","questions":[{"qnum":1,"qtext":"LLM 应用测试和普通软件测试有哪些核心区别？","answerHtml":"<p>普通软件测试和 LLM 项目测试其实差别很大，可以从几个方面来看。首先是正确性怎么判断：普通软件用 <code>assertEqual</code> 做精确匹配就行，结果对不对一目了然；但 LLM 项目没法这么判断，得看语义、结构、功能是不是匹配，很难写出精确的断言。其次是稳定性的前提不一样：普通软件默认相同输入就该产出相同输出，很稳定；LLM 的输出是概率性的，同样的问题问几次答案可能都不一样，所以必须多跑几次才能验证它稳不稳定。第三是评估方式，普通软件可以做到全自动化断言，LLM 项目做不到这么干净，得靠规则检查加上人工抽样一起来判断效果。第四是失败模式，普通软件一旦出问题就是崩溃或者返回错误，很容易发现；LLM 项目的失败往往是生成了内容但内容是错的，比如幻觉、该召回的没召回、不该触发工具却触发了，这种错误很难靠程序自动抓出来。最后是边界问题，普通软件的边界是明确的，数据类型、长度这些都能穷举清楚；LLM 面对的是语义层面的边界，几乎不可能穷举完。</p><p><strong>核心结论</strong>：LLM 测试的目标不是&quot;100% 通过&quot;，而是<strong>量化&quot;在预期范围内失败的概率&quot;</strong>并把它降到可接受水平。</p><p><strong>四个测试维度</strong>：输出稳定性（一致率）、工具触发准确率（Precision/Recall）、检索准确率（Hit Rate/MRR）、成本合理性（tokens/轮）。</p>"},{"qnum":2,"qtext":"如何测试工具调用的\"触发准确率\"？精确率和召回率分别测什么？","answerHtml":"<p><strong>精确率（Precision）</strong>：触发的工具是不是都对的？防止<strong>误触发</strong>。</p><pre><code>Precision = 正确触发次数 / 总触发次数\n（&quot;触发了的里面有多少是应该触发的&quot;）</code></pre><p><strong>召回率（Recall）</strong>：应该触发的工具是不是都触发了？防止<strong>漏触发</strong>。</p><pre><code>Recall = 正确触发次数 / 应该触发的总次数\n（&quot;应该触发的里面有多少被触发了&quot;）</code></pre><p><strong>F1 综合指标</strong>：<code>2×P×R / (P+R)</code>，平衡精确率和召回率。</p><p><strong>测试实现思路</strong>：</p><ul><li>准备测试用例，每条标注 <code>expected_tools</code>（应触发）和 <code>should_not_call</code>（不应触发）</li><li>实际运行，收集 <code>called</code> 工具集合</li><li><code>missed = expected - called</code>（漏触发），<code>wrong = called &amp; forbidden</code>（误触发）</li><li>统计 tp / fp / fn，计算 Precision / Recall / F1</li></ul><p><strong>典型问题与修复</strong>：</p><ul><li>Precision 低（误触发多）→ 收紧 description，加&quot;何时不用&quot;的限定</li><li>Recall 低（漏触发多）→ 扩展 description，补别名/同义词</li></ul>"},{"qnum":3,"qtext":"什么是输出稳定性测试？temperature=0 时输出一定稳定吗？","answerHtml":"<p><strong>稳定性</strong>：相同问题多次运行时，<strong>核心行为是否一致</strong>——重点是工具触发行为和回答功能，而非措辞完全相同。</p><p><strong>temperature=0 的实际稳定性</strong>：</p><p><code>temperature=0</code> 使用贪心解码（每步选概率最高的 token），理论上是确定性的，但实践中仍有不稳定来源，主要来自三个方面。第一是工具参数差异，模型有时传 <code>{&quot;city&quot;: &quot;北京&quot;}</code>，有时传 <code>{&quot;city&quot;: &quot;Beijing&quot;}</code>，导致工具结果不同。第二是商业 API 差异，像 DeepSeek 这类服务内部可能存在负载均衡或模型版本更新。第三是工具本身的随机性，真实 API（比如天气、股票接口）每次返回的数据本身就不同，会影响后续生成的内容。</p><p><strong>测试方法</strong>：相同问题跑 3–5 次，对比每次的工具触发序列（<code>[s.name for s in wf.steps]</code>），如果结果集合大小 &gt; 1，则判定为不稳定。</p>"},{"qnum":4,"qtext":"如何分析一次完整对话的 Token 成本？有哪些典型的成本增长陷阱？","answerHtml":"<p><strong>Token 消耗结构</strong>：</p><pre><code>input_tokens = System Prompt + 对话历史（所有轮次）\n             + 工具 Schema（ALL_TOOLS 的 JSON） + 当前消息\n\noutput_tokens = 模型回复文字 + tool_calls JSON</code></pre><p><strong>工具 Schema 隐性成本</strong>：3 个工具的 Schema 通常占 300–600 tokens，每次请求都要发送。</p><p><strong>两大成本陷阱</strong>：</p><ul><li><strong>历史未截断</strong>：多轮对话中历史消息线性增长，第 10 轮时 input_tokens 可能是第 1 轮的 10 倍。修复：用 <code>trim_history(messages, max_turns=5)</code> 保留最近 N 轮。</li></ul><ul><li><strong>工作流循环失控</strong>：多步工作流每次循环都重新发送完整历史，10 次循环的 Token 消耗是 3 次的 3 倍以上。修复：<code>max_iterations</code> 限制 + 超时退出。</li></ul><p><strong>成本计算</strong>：</p><pre><code class=\"language-python\">cost_usd = (input_tokens * 0.14 + output_tokens * 0.28) / 1_000_000\n# DeepSeek chat 定价（非缓存，截至 2025）</code></pre>"},{"qnum":5,"qtext":"如何从零设计一份 LLM 项目的测试记录表？包含哪些维度和字段？","answerHtml":"<p>测试记录表应包含<strong>元数据、用例详情、汇总指标、改进计划</strong>四部分：</p><p><strong>元数据</strong>：测试时间、项目版本、模型名称、temperature 值。</p><p><strong>用例详情表</strong>（每条一行）应该包含这样几个字段：第一个字段是编号，作用是给每条用例一个唯一序号，方便引用；第二个是测试问题，记录完整的原文；第三个是预期行为，写明应该调用哪个工具、回答方向是什么；第四个是实际行为，记录实际调用了什么工具、回答摘要是什么；第五个是结果，用 ✅ 或 ❌ 标记；第六个是问题/备注，记录失败原因或者其他特殊观察。</p><p><strong>汇总指标</strong>：通过率、工具触发精确率/召回率/F1、平均 Token 消耗、平均耗时。</p><p><strong>改进计划</strong>（P0–P3 优先级）：</p><pre><code>P0（立即修）：影响核心功能 + 每次都复现\nP1（本次修）：影响核心功能 + 多数复现，或影响体验 + 每次都复现\nP2（下次修）：偶发或影响体验\nP3（记录）：已知问题，可接受</code></pre><p>一份好的测试记录表的价值在于：让&quot;发现问题 → 修复 → 验证改善&quot;形成闭环，而不是测一次就结束。</p>"}]},{"name":"整理作品与总结","questions":[{"qnum":1,"qtext":"一个\"别人可以直接运行\"的项目 README 需要包含哪些核心章节？","answerHtml":"<p>必须包含的四个部分是这些。第一个是项目介绍，作用是让读者在 30 秒内知道这个项目是什么，写不好的表现是像&quot;智能助手&quot;这种毫无信息量的描述。第二个是功能列表，作用是具体说明能做什么，写不好的表现是&quot;支持多种功能&quot;这类抽象描述。第三个是快速开始，作用是把安装、配置、运行三步说清楚，控制在 3 步以内，写不好的表现是步骤超过 5 步，或者没有给出预期输出。第四个是示例，作用是展示真实的输入输出，写不好的表现是用文字描述代替真实对话。</p><p>可选加分项：技术架构图、FAQ、.env.example 说明、技术栈表格。</p><p><strong>黄金标准</strong>：陌生开发者按 README 操作，<strong>5 分钟内</strong>能发出第一条消息。验证方法：自己清空配置重跑一遍，或让朋友操作并计时。</p>"},{"qnum":2,"qtext":"如何写\"快速开始\"章节，让陌生开发者 5 分钟内跑起来？","answerHtml":"<p><strong>三步原则</strong>：快速开始必须是三步以内的可执行命令：</p><pre><code class=\"language-bash\"># Step 1：安装\ngit clone &lt;url&gt; &amp;&amp; cd &lt;repo&gt; &amp;&amp; pip install -r requirements.txt\n\n# Step 2：配置\ncp .env.example .env   # 填入 API Key\n\n# Step 3：运行\npython app.py          # 访问 http://127.0.0.1:7860</code></pre><p><strong>关键：每步都要写预期结果</strong>，让用户能自检：</p><ul><li>Step 1 ✅ 预期：<code>Successfully installed</code> 若干包，无红色报错</li><li>Step 2 ✅ 预期：<code>.env</code> 中 <code>DEEPSEEK_API_KEY=sk-xxxxx</code>（非空）</li><li>Step 3 ✅ 预期：终端输出 <code>Running on local URL: http://127.0.0.1:7860</code></li></ul><p><strong>五种常见疏漏</strong>：</p><ul><li>未写 Python 版本要求</li><li>没有 <code>.env.example</code>（用户不知道需要配什么变量）</li><li><code>requirements.txt</code> 未锁定版本（安装了不兼容版本）</li><li>未说明运行入口文件</li><li>示例不真实（截图与实际不符）</li></ul>"},{"qnum":3,"qtext":"示例输入输出为什么比功能描述更有说服力？如何选择展示哪些示例？","answerHtml":"<p><strong>为什么示例更有力</strong>：功能描述是抽象的，示例是具体的。</p><pre><code>功能描述（无信息量）：\n  &quot;支持实时天气查询和货币换算，可处理复合问题&quot;\n\n示例（直接展示能力）：\n  用户：上海明天适合出门吗？顺便帮我算 500 欧元换多少人民币\n  助手：上海明天多云，气温 22–28°C，适合出门。\n       500 欧元约等于 3,920 人民币（1 EUR = 7.84 CNY）。</code></pre><p>示例让读者立刻知道：系统能处理复合问题、回答是自然语言、工具调用是自动推断的。</p><p><strong>三类必选示例</strong>：<strong>三类必选示例</strong>分别是这些。第一类是核心功能示例，内容是单工具调用（天气或者汇率），用来展示最基本的功能能正常工作。第二类是差异化亮点示例，内容是多工具串行调用，配合工具链可视化截图，用来展示项目最有特色的能力。第三类是边界处理示例，内容是不触发工具的普通聊天，用来展示系统足够智能、不会滥用工具。</p>"},{"qnum":4,"qtext":"30 天 LLM 应用开发学习中，最重要的五个认知转变是什么？","answerHtml":"<p>第一个转变是从&quot;API调用&quot;到&quot;工程系统&quot;：起点认知是填个 Key 发消息就行，终点认知是 LLM 其实是一个系统组件，需要配置管理、异常处理、日志监控。第二个转变是从&quot;Prompt=咒语&quot;到&quot;Prompt=规格&quot;：起点认知是 Prompt 越华丽越好，终点认知是 Prompt 本质是规格说明，需要精简、明确边界、可迭代。第三个转变是从&quot;模型万能&quot;到&quot;RAG补充&quot;：起点认知是直接问模型就行，终点认知是私有或实时知识需要靠 RAG，先检索出相关段落，再让模型基于段落回答。第四个转变是从&quot;工具=插件&quot;到&quot;能力边界&quot;：起点认知是工具只是附加功能，终点认知是工具 description 写得精不精确，直接决定模型能不能在正确时机使用它。第五个转变是从&quot;能跑&quot;到&quot;可维护&quot;：起点认知是 Demo 能跑就算完成，终点认知是 fail-fast、分层异常处理、日志、测试这些机制，才决定了项目能不能被别人维护下去。</p>"},{"qnum":5,"qtext":"一个 LLM 项目从 Demo 到生产级别还需要补充哪些关键能力？","answerHtml":"<p>按三个方向分类：</p><p><strong>路线 A：深化 Agent 能力</strong></p><ul><li>LangGraph：图结构定义复杂 Agent 流程（分支、循环、多 Agent 协作）</li><li>MCP（Model Context Protocol）：标准化工具接口协议</li><li>长期记忆：跨对话记忆（向量存储 + 摘要压缩）</li></ul><p><strong>路线 B：提升 RAG 系统质量</strong></p><ul><li>多路召回：向量检索 + BM25 关键词检索，覆盖更多场景</li><li>Reranker：Cross-Encoder 重排序，精度提升 10–20%</li><li>RAGAS：自动化 RAG 质量评估框架</li></ul><p><strong>路线 C：生产部署</strong>这条路线上，几项关键能力分别对应这些工具和方案。第一是可观测性，工具是 LangFuse 或 LangSmith，解决的问题是追踪每一次 LLM 调用、定位慢查询。第二是成本控制，方案是 Prompt 缓存和模型分级路由，能把 API 费用降低 40% 到 80%。第三是安全，方案是 Prompt 注入防护和输出护栏，用来防止越权使用和有害输出。第四是部署，方案是 Docker 加 Hugging Face Spaces，让别人不用配置环境就能直接使用。</p><p><strong>判断优先级</strong>：做完 30 天后，看哪个部分让你最不满意——那就是下一阶段的重点方向。</p>"}]},{"name":"深化阶段·LangChain 基础（LCEL 与核心抽象）","questions":[{"qnum":1,"qtext":"为什么要在原生 API 之上使用 LangChain 框架？它解决了哪些核心问题？","answerHtml":"<p>原生 API 有三个痛点：<strong>Provider 绑定</strong>（切换模型需改客户端、参数名、响应字段）、<strong>链路代码重复</strong>（每个 Demo 都要手写&quot;拼 messages → 调 API → 取 content&quot;这条链）、<strong>输出解析散落</strong>（JSON 解析、Pydantic 校验、重试逻辑各自散落在业务代码里）。</p><p>LangChain 对应的解决方式是这样的：针对 Provider 绑定问题，解法是提供统一的 <code>ChatModel</code> 接口，切换 Provider 时只需要改初始化部分；针对链路代码重复问题，解法是用 LCEL 管道，也就是 <code>prompt | model | parser</code> 这种写法，把链路标准化；针对输出解析散落问题，解法是用 <code>OutputParser</code> 系列统一做解析，并且内置了重试机制。</p><p><strong>注意</strong>：LangChain 是在理解原生 API 之后才引入的工具——不理解底层就直接用框架，出问题时分不清是哪一层的锅。</p>"},{"qnum":2,"qtext":"什么是 LangChain 的 Runnable 接口？它统一了哪三个核心方法？","answerHtml":"<p><code>Runnable</code> 是 LangChain 所有组件（<code>PromptTemplate</code>、<code>ChatModel</code>、<code>OutputParser</code>）共同实现的接口，使得它们可以用 <code>|</code> 串联成管道。</p><p>三个核心方法分别是这些。第一个是 <code>.invoke(input)</code>，作用是同步单次调用，返回单个结果。第二个是 <code>.stream(input)</code>，作用是流式调用、逐 token 输出，返回类型是 <code>Iterator[chunk]</code>。第三个是 <code>.batch([i1, i2])</code>，作用是并行批量调用，返回类型是 <code>list</code>。</p><p><strong>为什么重要</strong>：<code>RunnableSequence</code>（即 <code>a | b | c</code>）把这三个方法自动传播到整条链——调用 <code>chain.stream(...)</code> 时，每一个 <code>Runnable</code> 组件都以流式模式运行，不需要额外代码。</p>"},{"qnum":3,"qtext":"LCEL 管道语法 `prompt | model | parser` 的执行过程是什么？每一步的输入输出类型分别是什么？","answerHtml":"<pre><code class=\"language-python\">chain = prompt | llm | parser\nchain.invoke({&quot;question&quot;: &quot;...&quot;})</code></pre><p>执行流程：</p><pre><code>输入：dict {&quot;question&quot;: &quot;...&quot;}\n  ↓ prompt.invoke(dict)\n输出：ChatPromptValue（含 system + human 两条消息）\n  ↓ llm.invoke(ChatPromptValue)\n输出：AIMessage（含 content、response_metadata 等字段）\n  ↓ parser.invoke(AIMessage)\n输出：str（纯文本，即 AIMessage.content）</code></pre><p>具体到每一步，<code>prompt</code> 这一步输入类型是 <code>dict</code>，输出类型是 <code>ChatPromptValue</code>；<code>llm</code> 这一步输入类型是 <code>ChatPromptValue</code>，输出类型是 <code>AIMessage</code>；<code>parser</code>（也就是 <code>StrOutputParser</code>）这一步输入类型是 <code>AIMessage</code>，输出类型是 <code>str</code>。</p><p>类型转换是隐式的，调试时用 <code>prompt.invoke(input)</code> 单独查看中间状态。</p>"},{"qnum":4,"qtext":"`ChatPromptTemplate` 相比手拼字符串 messages 多做了哪些事？又隐藏了什么？","answerHtml":"<p><strong>多做的事</strong>：在变量占位符校验上，手写用 f-string 时忘了加变量并不会报错，而框架里 <code>{var}</code> 缺失时会直接抛出 <code>KeyError</code>；在消息角色验证上，手写时把 <code>&quot;system&quot;</code> 拼错成 <code>&quot;sistem&quot;</code> 也不会报错，而框架在用 <code>(&quot;system&quot;, ...)</code> 创建模板时就会校验角色名；在多轮历史插入上，手写要手动 <code>messages.extend(history)</code>，框架则提供 <code>MessagesPlaceholder</code> 做声明式插入。</p><p><strong>隐藏的部分</strong>（需要主动查看）：</p><pre><code class=\"language-python\"># 实际发出的 API 请求，被框架封装\n# 调试时单独调用：\nprint(prompt.invoke({&quot;question&quot;: &quot;...&quot;}))  # 查看实际消息结构</code></pre><p>token 计数藏在 <code>AIMessage.response_metadata[&quot;token_usage&quot;]</code> 里，不在链的直接输出中。</p>"},{"qnum":5,"qtext":"什么场景下应该用 LangChain，什么场景下手写原生 API 更合适？","answerHtml":"<p>简单的单步调用（一问一答）场景，更适合手写，因为依赖少、调试直接、没有框架版本风险；多步链路（RAG、Agent）场景，更适合用 LangChain，因为统一接口天然支持流式和批量；需要精确控制 API 参数时，更适合手写，因为框架封装会屏蔽部分参数；需要跨 Provider 可移植性时，更适合用 LangChain，因为切换 Provider 只改初始化，链路代码不用动；生产系统且依赖稳定性优先时，更适合手写或锁定版本，因为 LangChain 的破坏性变更比较频繁。</p><p><strong>LangChain 的价值随链路复杂度增长</strong>：在 Day 31 的单轮聊天 Demo 上，框架带来的收益不显著；到 LangGraph 多步 Agent 编排（Day 33+），统一接口的价值才真正体现。</p>"},{"qnum":6,"qtext":"`PromptTemplate` 和 `ChatPromptTemplate` 有什么区别？为什么现在几乎只用后者？","answerHtml":"<p>两者是 LangChain 里两种不同的模板类型，适用于不同代际的模型接口：<code>PromptTemplate</code> 面向单次文本补全（legacy completion API），常见于旧版模型、非对话任务；<code>ChatPromptTemplate</code> 面向当前主流的聊天模型，比如 GPT-4、DeepSeek Chat、Qwen 这些。</p><p><code>PromptTemplate</code> 面向的是&quot;输入一段文本、补全一段文本&quot;的老式 completion 接口，不区分角色（system/user/assistant）；<code>ChatPromptTemplate</code> 面向的是现在主流的聊天模型接口，用 <code>(&quot;system&quot;, ...)</code> / <code>(&quot;human&quot;, ...)</code> 这样的角色化消息列表组织 Prompt，天然对应 <code>messages</code> 参数的结构。</p><p>现在几乎只用 <code>ChatPromptTemplate</code> 的原因很直接：聊天模型已经是绝对主流，<code>PromptTemplate</code> 对应的 completion API 属于历史遗留，Day 31 之后的所有 Demo（结构化输出、RAG、LangGraph Node）用的都是 <code>ChatPromptTemplate</code>。</p><p><strong>记忆点：<code>PromptTemplate</code> 对应老式补全接口，<code>ChatPromptTemplate</code> 对应角色化的聊天接口——选型只看你调用的是不是 Chat 模型。</strong></p>"},{"qnum":7,"qtext":"用 LangChain 重写 Day 4 聊天 Demo 后，历史记录的存储类型发生了什么变化？这个变化说明了什么？","answerHtml":"<p>历史记录的类型从 <code>list[dict]</code> 变成了 <code>list[HumanMessage | AIMessage]</code>：</p><pre><code class=\"language-python\"># 手写版（Day 4）：历史记录是 dict 列表\nhistory = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是一个有帮助的助手。&quot;}]\nhistory.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input})\nhistory.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: reply})\n\n# LangChain 版（Day 31）：历史记录是消息对象列表\nfrom langchain_core.messages import HumanMessage, AIMessage\nhistory = []\nhistory.append(HumanMessage(content=user_input))\nhistory.append(AIMessage(content=reply))</code></pre><p>这个变化说明 LangChain 用<strong>类型化的消息对象</strong>取代了裸 <code>dict</code>——<code>HumanMessage</code>、<code>AIMessage</code>（以及后续会用到的 <code>SystemMessage</code>、<code>ToolMessage</code>）是 LangChain 统一消息类型系统的组成部分，比 <code>{&quot;role&quot;: &quot;...&quot;, &quot;content&quot;: &quot;...&quot;}</code> 多了类型安全（IDE 能识别字段、写错角色名会在构造时报错而不是等到发请求）。</p><p>更重要的是，这套消息对象类型不是 Day 31 用完就丢的——Day 33 的 LangGraph <code>AgentState</code> 里 <code>messages: Annotated[list, add_messages]</code> 存的正是这一套消息对象，<code>add_messages</code> Reducer 就是靠识别 <code>AIMessage</code>/<code>HumanMessage</code>/<code>ToolMessage</code> 的类型和 <code>id</code> 来做追加和去重的。Day 31 换掉的消息类型，是为 Day 33 之后的图状态设计埋下的基础。</p><p><strong>记忆点：dict 换成消息对象不是换皮，是为后面 LangGraph 的 Reducer 机制做类型铺垫。</strong></p>"}]},{"name":"深化阶段·LangChain 结构化输出与 RAG 链","questions":[{"qnum":1,"qtext":"`PydanticOutputParser` 和手写 JSON 解析的核心区别是什么？框架帮你标准化了哪三个步骤？","answerHtml":"<p>手写版每次需要自己完成三步：① 取 <code>response.choices[0].message.content</code>；② <code>json.loads()</code> 解析（需处理 markdown 代码块）；③ <code>Pydantic(**data)</code> 校验（需捕获异常）。</p><p><code>PydanticOutputParser</code> 其实就是把手写的这三步都标准化了。取文本这一步，手写得自己写 <code>response.choices[0].message.content</code> 去掏出内容，框架里用 <code>StrOutputParser</code> 就能自动提取，不用惦记这行代码。JSON 解析这一步，手写要自己调 <code>json.loads()</code>，还得处理模型可能返回的 markdown 代码块这种脏数据，框架内置了清理逻辑，解析失败还会直接抛出 <code>OutputParserException</code>，方便你捕获。Pydantic 校验这一步，手写得自己写 <code>Model(**data)</code> 再套一层 try/except 兜底，框架内部就直接帮你把校验做完了，甚至还能再套一层 <code>OutputFixingParser</code>，校验不过还能自动修复。</p><p>额外收益：<code>parser.get_format_instructions()</code> 自动生成符合 JSON Schema 的约束文本，替代手写的格式说明——字段描述、类型约束直接从 Pydantic model 的 <code>Field(description=...)</code> 生成，不需要手动维护两份信息。</p>"},{"qnum":2,"qtext":"`with_structured_output()` 和 `PydanticOutputParser` 有什么区别？各自适用什么场景？","answerHtml":"<pre><code class=\"language-python\"># PydanticOutputParser：在 Prompt 里插入约束文本\nparser = PydanticOutputParser(pydantic_object=Resume)\nchain = prompt.partial(format_instructions=parser.get_format_instructions()) | llm | parser\n\n# with_structured_output()：通过 API 层（tool_calling / json_mode）强制约束\nstructured_llm = llm.with_structured_output(Resume)\nresult = structured_llm.invoke(&quot;请从以下简历中抽取：...&quot;)</code></pre><p>这两者的区别可以从四个方面来看。约束方式不一样：<code>PydanticOutputParser</code> 是往 Prompt 里塞一段 JSON Schema 文本去约束模型，而 <code>with_structured_output()</code> 是在 API 层，靠 tool_calling 或者 json_mode 硬性约束。Prompt 的可控程度也不一样：前者很透明，约束文本放在 Prompt 哪个位置完全由你自己决定；后者是框架帮你处理的，你看不太到底层怎么拼的，透明度低一些。可靠性上差别更明显：前者说到底还是依赖模型愿不愿意遵守 Prompt 里的约束，后者是 API 层强制保证格式，明显更可靠。所以适用场景也就分开了：需要精确控制 Prompt、链路又比较复杂的时候用前者；想快速搭个原型、不太纠结约束细节的时候，用后者更省心。</p><p><strong>生产建议</strong>：支持 <code>tool_calling</code> 的模型（GPT-4o、DeepSeek、Qwen 等）优先用 <code>with_structured_output()</code>；需要自定义格式约束文本位置时用 <code>PydanticOutputParser</code>。</p>"},{"qnum":3,"qtext":"LangChain `Retriever` 接口封装了什么？和 Day 18 手写检索返回值有什么本质不同？","answerHtml":"<p><code>Retriever</code> 封装了三步：① 把查询字符串向量化（调 embedding 模型）；② 在向量库里相似度检索，取 Top-K；③ 把结果包装成 <code>List[Document]</code>。</p><p>与 Day 18 手写版的本质区别在返回类型：</p><pre><code class=\"language-python\"># Day 18 手写：返回 list[str]，只有文本\ndef retrieve(query: str) -&gt; list[str]:\n    embedding = embed(query)\n    results = chroma.query(query_embeddings=[embedding], n_results=3)\n    return results[&quot;documents&quot;][0]\n\n# LangChain Retriever：返回 List[Document]，含文本 + metadata\nretriever.invoke(&quot;query&quot;)  # -&gt; [Document(page_content=&quot;...&quot;, metadata={&quot;source&quot;: &quot;...&quot;})]</code></pre><p><code>Document.metadata</code> 是关键：它把&quot;这段文字来自哪个文件&quot;随检索结果一路传下去，不需要额外传参就能支持 Day 20 的引用溯源。另一个关键区别：<code>Retriever</code> 是 <code>Runnable</code>，可以直接用 <code>|</code> 参与 LCEL 链；手写函数不行。</p>"},{"qnum":4,"qtext":"LCEL RAG 链里 `RunnablePassthrough` 和 `RunnableParallel` 分别解决什么问题？","answerHtml":"<p>RAG 链的 Prompt 需要两个输入（<code>context</code> 和 <code>question</code>），但链的原始输入只有一个字符串（用户问题）。这是&quot;一个输入要喂给多个分支&quot;的问题，<code>RunnableParallel</code> 解决了它：</p><pre><code class=\"language-python\">rag_chain = (\n    {\n        &quot;context&quot;: retriever | format_docs,  # RunnableParallel 的第一个分支\n        &quot;question&quot;: RunnablePassthrough(),   # RunnableParallel 的第二个分支\n    }\n    | prompt\n    | llm\n    | StrOutputParser()\n)</code></pre><ul><li><strong><code>RunnableParallel</code></strong>（dict 字面量是语法糖）：并行执行多个分支，把各分支结果合并为一个 dict，输出 <code>{&quot;context&quot;: &quot;...&quot;, &quot;question&quot;: &quot;...&quot;}</code>，让 Prompt 的两个变量都能被填充</li><li><strong><code>RunnablePassthrough()</code></strong>：把输入原样透传，不做任何处理——这里用来把用户问题传给 Prompt 的 <code>{question}</code> 变量，否则问题字符串会被 <code>retriever</code> 那条分支&quot;消耗掉&quot;</li></ul><p>两者配合就是&quot;一个输入 → 两路并行处理 → 合并 → 继续&quot;的经典 LCEL 模式。</p>"},{"qnum":5,"qtext":"什么时候用 LangChain 现成组件更好，什么时候手写更可控？给出判断标准。","answerHtml":"<p>判断标准其实可以按场景一条条过。需要流式、批量或者异步处理的时候，框架组件天生就支持，基本零代码改动，手写的话这些都得自己一点点实现。需要换 Provider 或者换向量库的时候，用框架只改初始化那部分代码就行，链路代码完全不用动；手写的话，改动往往会扩散到整个业务代码里，牵一发动全身。如果需要精确控制 Prompt 里到底写了什么，<code>PydanticOutputParser</code> 能做到这点，但 <code>with_structured_output()</code> 这种黑盒式的封装就做不到，透明度不够。调试排错的时候反而是手写更占优势，框架组件想看中间状态得单独 invoke 某个节点才行，手写代码每一步直接 print 一下就够了，很直观。如果只是写个一次性脚本或者场景特别简单，硬套框架组件反而是过度设计，手写明显更快更省事。但一旦是 RAG、Agent 这种多步链路的场景，框架用 LCEL 组合的优势就体现出来了，手写的 while 循环只会越写越长、越来越难维护。</p><p><strong>核心判断标准</strong>：链路复杂度越高、需要跨 Provider 可移植性、需要流式/批量支持时，框架收益越大；简单单步、精确控制细节、排错优先时，手写更好。Day 31–32 的 Demo 规模并不大，引入框架的价值有限；到 Day 33 的 LangGraph 多步 Agent 编排，框架优势才真正显现。</p>"},{"qnum":6,"qtext":"LangChain 内置的三种 OutputParser 分别是什么？各自的输出类型和适用场景是什么？`OutputFixingParser` 在它们基础上解决了什么问题？","answerHtml":"<p>三种 OutputParser 按解析强度递增排列：<code>StrOutputParser</code> 输出纯文本 <code>str</code>，适合普通对话、摘要这类不需要解析结构的场景，覆盖了 90% 的使用场景；<code>JsonOutputParser</code> 输出 <code>dict</code>，适合输出是 JSON 但不需要严格类型校验的场景；<code>PydanticOutputParser</code> 输出 Pydantic 对象，适合需要类型安全、字段校验、IDE 自动补全的场景。</p><p>三者都是 <code>Runnable</code>，可以直接用 <code>|</code> 接在 <code>llm</code> 之后，选型只看你需要多强的结构化保证。</p><p><code>OutputFixingParser</code> 是在这三者之上再包一层的进阶方案，解决&quot;解析失败怎么办&quot;的问题：</p><pre><code class=\"language-python\">from langchain.output_parsers import OutputFixingParser\n\n# 解析失败时，会再调一次模型，让它修复不合规的输出\nrobust_parser = OutputFixingParser.from_llm(parser=parser, llm=llm)\nchain = prompt | llm | robust_parser</code></pre><p>它相当于自动化了 Day 9 里手写的&quot;解析失败 → 重试&quot;逻辑：原来出错要自己捕获异常、拼修复 Prompt、再调一次模型，现在包一层 <code>OutputFixingParser</code> 就搞定，代价是失败时会多花一次模型调用。</p><p><strong>记忆点：Str/Json/Pydantic 三种 Parser 是&quot;要多强的结构化&quot;的选型问题，OutputFixingParser 是&quot;解析失败怎么兜底&quot;的问题，两者维度不同、可以叠加使用。</strong></p>"},{"qnum":7,"qtext":"`vectorstore.as_retriever()` 通过哪些参数控制检索行为？创建向量库的两种方式（从文档列表 vs 加载持久化目录）有什么区别？","answerHtml":"<p><code>as_retriever()</code> 的两个核心参数：</p><pre><code class=\"language-python\">retriever = vectorstore.as_retriever(\n    search_type=&quot;similarity&quot;,    # 相似度检索（默认）\n    search_kwargs={&quot;k&quot;: 3},      # 返回最相似的 3 条\n)</code></pre><p><code>search_type</code> 决定检索策略（默认是余弦相似度检索），<code>search_kwargs</code> 是传给具体策略的参数字典，最常用的是 <code>k</code>（Top-K 返回条数）。</p><p>创建向量库有两种方式，对应不同的使用阶段：</p><pre><code class=\"language-python\"># 方式一：从文档列表创建（小批量，适合 Demo，内存中临时构建）\nvectorstore = Chroma.from_documents(docs, embedding=embeddings)\n\n# 方式二：加载已有的持久化向量库（对应 Day 18 的做法）\nvectorstore = Chroma(persist_directory=&quot;./chroma_db&quot;, embedding_function=embeddings)</code></pre><p><code>from_documents()</code> 这种方式适合快速验证、临时数据、一次性 Demo，数据来源是内存中的 <code>Document</code> 列表，每次都要重新构建；<code>persist_directory=...</code> 这种方式适合生产场景、需要复用已构建好的向量库，数据来源是磁盘上已经存过的向量库文件，可以直接加载。</p><p>方式二对应的正是 Day 18 手写 RAG 时把 embedding 结果持久化到 Chroma 的那一套流程——LangChain 版本只是把&quot;连接到已有向量库&quot;这件事包装成了统一的 <code>Chroma(...)</code> 初始化调用。</p><p><strong>记忆点：<code>search_kwargs={&quot;k&quot;: N}</code> 控制&quot;取几条&quot;，<code>from_documents</code> 和 <code>persist_directory</code> 分别对应&quot;临时构建&quot;和&quot;加载已有&quot;两种向量库使用方式。</strong></p>"}]},{"name":"深化阶段·LangGraph 基础（用状态图重写 ReAct）","questions":[{"qnum":1,"qtext":"LangGraph 的 `StateGraph` 和手写 `while` 循环相比，核心区别是什么？","answerHtml":"<p>手写 <code>while</code> 循环把 Agent 状态隐式地藏在 <code>messages</code> 列表里，流程用 <code>if/return</code> 控制；<code>StateGraph</code> 把状态显式定义为 <code>TypedDict</code>，流程表达为 Node + Edge 的有向图。</p><p>核心区别体现在三点：</p><ol><li><strong>状态可见</strong>：<code>AgentState</code> 的每个字段都有名字和类型，任何 Node 都能读/写，不需要解析消息内容才能知道&quot;当前处于哪一步&quot;</li><li><strong>可中断</strong>：图可以在任意 Node 后加 <code>interrupt_before</code>，执行到那里自动挂起，等待外部信号继续；<code>while</code> 循环不行，函数栈不能挂起</li><li><strong>可持久化</strong>：接入 <code>MemorySaver</code> 或任意 Checkpointer，状态快照自动持久化，进程重启后可恢复；<code>while</code> 循环里的状态随进程死亡</li></ol><p>适用判断：如果不需要中断、持久化、复杂分支，手写 <code>while</code> 更简洁；一旦出现这三类需求中的任何一个，就该切换到 LangGraph。</p>"},{"qnum":2,"qtext":"LangGraph `Node` 函数的签名是什么？返回值有什么规范？","answerHtml":"<p>Node 函数接收完整的 <code>State</code>，返回一个字典——<strong>只包含需要更新的字段，不返回完整 State</strong>：</p><pre><code class=\"language-python\">def call_model(state: AgentState) -&gt; dict:\n    response = llm_with_tools.invoke(state[&quot;messages&quot;])\n    return {\n        &quot;messages&quot;: [response],       # 只返回变化的字段\n        &quot;iteration&quot;: state[&quot;iteration&quot;] + 1,\n    }</code></pre><p>返回值里没有出现的字段，LangGraph 保持原值不动（不是置空，是不动）。这是 Node 和普通函数不同的地方：不需要把整个 State 复制一遍再传出去，只说&quot;我改了什么&quot;就够了。</p><p>LangGraph 用 Reducer 决定如何把返回的局部更新合并进当前 State：没有 Reducer 标注的字段直接覆盖，用 <code>Annotated[list, add_messages]</code> 标注的字段则把新内容追加进去。</p>"},{"qnum":3,"qtext":"`Annotated[list, add_messages]` 是什么，为什么消息历史字段要用它？","answerHtml":"<p><code>Annotated[list, add_messages]</code> 是 LangGraph 的 Reducer 语法：<code>add_messages</code> 告诉 LangGraph 不要用新值直接覆盖 <code>messages</code> 字段，而是把 Node 返回的新消息<strong>追加</strong>到原列表末尾，并对 <code>tool_call_id</code> 相同的消息做去重更新。</p><pre><code class=\"language-python\">class AgentState(TypedDict):\n    messages: Annotated[list, add_messages]   # 追加 Reducer\n    iteration: int                             # 直接覆盖</code></pre><p>如果不加 <code>add_messages</code>，每次 Node 返回 <code>{&quot;messages&quot;: [new_msg]}</code> 都会把整个 <code>messages</code> 字段替换成只含一条消息的列表，之前的对话历史全丢了。</p><p><code>add_messages</code> 还处理了 <code>AIMessage</code> / <code>HumanMessage</code> / <code>ToolMessage</code> 的混合场景，以及工具重试时 <code>tool_call_id</code> 重复的边界情况——手写追加逻辑很容易踩这些坑。</p>"},{"qnum":4,"qtext":"LangGraph 的条件边（`add_conditional_edges`）怎么用？和固定边有什么区别？","answerHtml":"<p>固定边用 <code>add_edge(&quot;a&quot;, &quot;b&quot;)</code>，Node <code>a</code> 执行完<strong>始终</strong>跳到 Node <code>b</code>，不看 State 内容。</p><p>条件边用 <code>add_conditional_edges(&quot;a&quot;, routing_fn, mapping)</code>：<code>routing_fn</code> 接收当前 State，返回一个字符串 key；<code>mapping</code> 把 key 映射到目标 Node 名称：</p><pre><code class=\"language-python\">def should_continue(state: AgentState) -&gt; str:\n    last = state[&quot;messages&quot;][-1]\n    if state[&quot;iteration&quot;] &gt;= MAX_ITERATIONS:\n        return &quot;end&quot;\n    if not getattr(last, &quot;tool_calls&quot;, None):\n        return &quot;end&quot;\n    return &quot;continue&quot;\n\ngraph.add_conditional_edges(\n    &quot;call_model&quot;,\n    should_continue,\n    {&quot;continue&quot;: &quot;call_tools&quot;, &quot;end&quot;: END},\n)</code></pre><p><code>routing_fn</code> 只做决策，不修改 State，返回字符串——它不是 Node，不会出现在图的节点列表里，但会出现在 <code>draw_mermaid()</code> 的边标注上。</p><p>ReAct 循环里的&quot;继续 vs 结束&quot;就是最典型的二路条件边；Day 34 会扩展成工具失败走重试、成功走汇总的三路路由。</p>"},{"qnum":5,"qtext":"在 LangGraph 中，`MAX_ITERATIONS` 这类静态配置应该放进 `State` 里还是写成常量？为什么？","answerHtml":"<p>应该写成<strong>常量</strong>（或传入 <code>graph.compile(configurable={...})</code>），<strong>不应该放进 <code>State</code></strong>。</p><p>原因：<code>State</code> 的设计原则是&quot;运行时会变化的数据&quot;——消息历史会随每轮对话增长，迭代计数会随每个 Node 递增，这些属于 State。<code>MAX_ITERATIONS</code> 是图的静态配置，从第一步到最后一步始终是同一个值，放进 State 会带来两个问题：</p><ol><li>每个 Node 的返回字典都要带上它（即使没有改动），或者忘记带就被 Reducer 置空</li><li>让 <code>AgentState</code> 的语义变模糊——读到它的人不清楚&quot;这是个会变化的运行时值，还是个不变的配置&quot;</li></ol><p>正确做法：在 <code>routing_fn</code> 或 Node 内部直接引用模块级常量 <code>MAX_ITERATIONS = 8</code>，或通过 <code>config</code> 参数传入（LangGraph 支持 <code>graph.invoke(state, config={&quot;configurable&quot;: {&quot;max_iter&quot;: 8}})</code>）。</p>"},{"qnum":6,"qtext":"LangGraph 里 Edge 有哪几种类型？分别用什么 API 创建，各自的用途是什么？","answerHtml":"<p>LangGraph 的 Edge 一共有四种类型。第一种是固定边，写法是 <code>graph.add_edge(&quot;node_a&quot;, &quot;node_b&quot;)</code>，用途是始终跳到下一个固定节点，不看 State。第二种是条件边，写法是 <code>graph.add_conditional_edges(&quot;node_a&quot;, routing_fn)</code>，用途是根据 State 内容动态决定下一步，这是 Day 34 的重点。第三种是入口边，写法是 <code>graph.set_entry_point(&quot;node_a&quot;)</code>，用途是决定图从哪个 Node 开始执行。第四种是结束边，写法是 <code>graph.add_edge(&quot;node_a&quot;, END)</code>，用途是决定图在哪个 Node 后结束。</p><p>Day 33 的 ReAct 图用到了其中三种：<code>set_entry_point(&quot;call_model&quot;)</code> 作为入口边；<code>call_model</code> 到 <code>call_tools</code> / <code>END</code> 之间用条件边（<code>should_continue</code> 决定去向）；<code>call_tools</code> 回 <code>call_model</code> 用固定边（工具执行完必然回模型，不需要判断）。<code>END</code> 本质上是 LangGraph 内置的一个特殊终止节点，<code>add_edge(&quot;node&quot;, END)</code> 就是结束边的写法。</p><p>这四种类型合起来就能表达任意复杂度的流程图：入口边定起点，固定边表达确定的流转，条件边表达分叉，结束边（连到 <code>END</code>）表达终点。</p><p><strong>记忆点：入口边定起点、结束边定终点、固定边表达&quot;必然去向&quot;、条件边表达&quot;看情况去向&quot;——四种边组合起来就是完整的图结构。</strong></p>"}]},{"name":"深化阶段·条件边与分支路由","questions":[{"qnum":1,"qtext":"`add_conditional_edges` 的三个参数分别是什么？条件边和固定边的本质区别是什么？","answerHtml":"<p><code>add_conditional_edges</code> 接收三个参数：</p><pre><code class=\"language-python\">graph.add_conditional_edges(\n    &quot;call_tools&quot;,        # ① 源节点：从哪个节点执行完之后开始判断\n    route_after_tools,   # ② 路由函数：接收 State，返回一个字符串 key\n    {&quot;retry&quot;: &quot;retry_node&quot;, &quot;done&quot;: &quot;summarize&quot;},   # ③ 映射表：key → 目标节点名\n)</code></pre><p>执行时机是源节点执行完、State 更新完之后：LangGraph 调用路由函数拿到 key，再去映射表查目标节点跳转。</p><p>本质区别在于：下一步去向上，固定边 <code>add_edge(&quot;a&quot;, &quot;b&quot;)</code> 恒定不变，<code>a</code> 执行完之后必然去 <code>b</code>；条件边 <code>add_conditional_edges</code> 则看 State 内容动态决定去哪。是否看运行时状态上，固定边不看，条件边要看。适用场景上，固定边适合无分叉的流转，条件边适合有真正分叉的流转。</p><p><strong>记忆点：一句话判断——下一步去哪，是不是由 State 的运行时内容决定的？是就用条件边，不是就用固定边。</strong></p>"},{"qnum":2,"qtext":"LangGraph 里的\"路由函数\"和\"Node\"有什么区别？路由函数有哪三条约束？","answerHtml":"<p>Node 和路由函数都接收 <code>State</code>，但职责完全相反：<strong>Node 负责&quot;改状态&quot;，路由函数负责&quot;看状态决定去哪&quot;</strong>。</p><p>路由函数的三条约束分别是这些。第一条是只读 State，也就是只做判断、不能返回状态更新，违反了这条，返回的 dict 会被当成 key 去查找，结果找不到就报错。第二条是必须返回字符串 key，而且这个返回值必须是映射表里存在的 key，违反了这条，返回一个没有登记的 key 会直接抛出 <code>ValueError</code>。第三条是路由函数本身不是 Node，它不会出现在节点列表里，但会出现在 <code>draw_mermaid()</code> 的边标注上，这一条描述的是它的本质定位，没有单独的违反后果。</p><pre><code class=\"language-python\">def route_after_tools(state) -&gt; str:\n    if state[&quot;tool_ok&quot;]:\n        return &quot;done&quot;\n    return &quot;retry&quot; if state[&quot;retry_count&quot;] &lt; MAX_RETRIES else &quot;done&quot;\n    # ❌ 不能 return {&quot;retry_count&quot;: ...}——改状态是 Node 的活</code></pre><p><strong>改状态的活永远交给 Node，路由函数只读不写。</strong></p>"},{"qnum":3,"qtext":"判断一条边该用条件边还是固定边，判断标准是什么？把该固定的边写成条件边有什么坏处？","answerHtml":"<p>判断标准：<strong>下一步去向是否由 State 的运行时内容决定</strong>。是（有真正分叉）→ 条件边；否（恒定去向）→ 固定边。</p><p>一个反例（过度设计）：</p><pre><code class=\"language-python\"># ❌ retry_node 之后其实必然回 call_model，却硬套条件边\ndef route_after_retry(state) -&gt; str:\n    return &quot;back&quot;          # 永远只返回这一个值\ngraph.add_conditional_edges(&quot;retry_node&quot;, route_after_retry, {&quot;back&quot;: &quot;call_model&quot;})\n\n# ✅ 只有一个确定去向，用固定边\ngraph.add_edge(&quot;retry_node&quot;, &quot;call_model&quot;)</code></pre><p>坏处：路由函数所有分支只返回一个值时，条件边没有任何分叉价值，反而让 <code>draw_mermaid()</code> 画出一条带标注的&quot;假分支&quot;，误导读图的人以为这里有条件判断，增加理解成本。</p><p><strong>判据：如果路由函数所有分支最终只可能返回一个值，那它就不该是条件边。</strong></p>"},{"qnum":4,"qtext":"给 ReAct 图加\"失败走重试、成功走汇总\"分支时，State 要新增哪些字段？为什么 retry_count 不复用 iteration？","answerHtml":"<p>在 Day 33 的 <code>AgentState</code> 基础上新增两个字段：</p><pre><code class=\"language-python\">class AgentState(TypedDict):\n    messages: Annotated[list, add_messages]\n    iteration: int\n    tool_ok: bool        # 新增：上一次工具执行是否全部成功（路由函数据此判断）\n    retry_count: int     # 新增：已重试次数</code></pre><p><code>tool_ok</code> 由 <code>call_tools</code> 节点在执行时写入（任一工具返回含 <code>error</code> 键就置 <code>False</code>），路由函数 <code>route_after_tools</code> 据此决定走 <code>retry</code> 还是 <code>done</code>。</p><p><code>retry_count</code> 不复用 <code>iteration</code> 的原因：两者语义不同。</p><ul><li><code>iteration</code> 统计&quot;模型被调用了几轮&quot;——正常的多步 ReAct 也会增长</li><li><code>retry_count</code> 统计&quot;因工具失败而重试了几次&quot;——只在错误路径上增长</li></ul><p>如果混用，一次正常的多轮对话会被误判成&quot;重试太多次&quot;而提前触发降级。State 字段要各司其职，一个字段只表达一个语义。</p>"},{"qnum":5,"qtext":"怎么验证图在工具失败时确实走了重试分支而不是崩溃？","answerHtml":"<p>核心目标是&quot;制造失败 → 观察到走了 <code>retry</code> 分支 → 程序没崩溃&quot;。三种观察手段：</p><pre><code class=\"language-python\"># 方式 1：在 retry_node 里打印（最直接）\ndef retry_node(state):\n    print(f&quot;⟳ 第 {state['retry_count'] + 1} 次重试&quot;)\n    return {&quot;retry_count&quot;: state[&quot;retry_count&quot;] + 1}\n\n# 方式 2：用 stream 逐节点观察经过路径\nfor event in graph.stream(initial_state):\n    print(list(event.keys()))\n    # 失败案例会看到 ['call_model'] ['call_tools'] ['retry_node'] ['call_model'] ...\n\n# 方式 3：可视化确认 retry 边存在\nprint(graph.get_graph().draw_mermaid())\n# call_tools -. retry .-&gt; retry_node</code></pre><p>构造失败的方法：让工具对非法输入返回 <code>{&quot;error&quot;: ...}</code>（如查询不支持的城市），<code>call_tools</code> 检测到 error 键把 <code>tool_ok</code> 置 <code>False</code>，路由函数返回 <code>&quot;retry&quot;</code>。关键验证点是<strong>程序没有抛异常崩溃，而是沿着 <code>retry</code> 边流转，最终给出降级回答</strong>——这正是条件边相比手写 <code>try/except + continue</code> 的价值：错误处理成了图里一条可命名、可观察的边。</p>"},{"qnum":6,"qtext":"`add_conditional_edges` 支持\"路由函数返回抽象 key 再查映射表\"和\"路由函数直接返回节点名\"两种写法，二者有什么区别？为什么更推荐前者？","answerHtml":"<p>两种写法功能等价，但设计意图不同：</p><pre><code class=\"language-python\"># 写法 A（推荐）：路由函数返回抽象 key，映射表决定 key → 节点\ngraph.add_conditional_edges(&quot;call_tools&quot;, route_after_tools,\n                            {&quot;retry&quot;: &quot;retry_node&quot;, &quot;done&quot;: &quot;summarize&quot;})\n\n# 写法 B：路由函数直接返回节点名（省掉映射表）\ndef route_after_tools(state) -&gt; str:\n    return &quot;retry_node&quot; if not state[&quot;tool_ok&quot;] else &quot;summarize&quot;\ngraph.add_conditional_edges(&quot;call_tools&quot;, route_after_tools)</code></pre><p>两种写法在三个维度上有差异：路由逻辑与节点名的关系上，写法 A 是解耦的——改节点名只需要改映射表，路由函数完全不用动；写法 B 是耦合的——改节点名要同步改路由函数里的字符串。可读性上，写法 A 的 key（<code>retry</code>/<code>done</code>）是语义化的，一眼就能看出业务含义；写法 B 直接用节点名，读代码时要绕一层才能理解语义。<code>draw_mermaid()</code> 的边标注上，写法 A 用 key 标注（<code>-. retry .-&gt;</code>），语义清晰；写法 B 用节点名标注，稍显隐晦。</p><p>推荐写法 A 的核心原因：写法 A 的 key（<code>retry</code>/<code>done</code>）表达的是&quot;业务语义&quot;，节点名（<code>retry_node</code>/<code>summarize</code>）表达的是&quot;实现细节&quot;——两者解耦之后，重命名节点（比如把 <code>summarize</code> 改成 <code>finalize</code>）只需要改映射表这一行，路由函数完全不用动；写法 B 把两者耦合在一起，任何节点改名都要跟着改路由函数内部的字符串，容易漏改导致运行时找不到节点。</p><p><strong>记忆点：映射表写法把&quot;路由决策&quot;和&quot;节点命名&quot;解耦，改节点名不改路由逻辑——这是写法 A 优于写法 B 的核心原因。</strong></p>"}]},{"name":"深化阶段·循环终止与 Checkpoint 持久化","questions":[{"qnum":1,"qtext":"LangGraph 里有哪两层循环终止保护？它们分别对应什么粒度，触发行为有什么不同？","answerHtml":"<p>两层终止保护：业务层的实现方式是在路由函数里比较 <code>state[&quot;iteration&quot;] &gt;= MAX_ITERATIONS</code>，计数粒度是模型被调用的轮次（语义粒度），触发行为是走&quot;结束&quot;分支、让模型给出降级回答、优雅终止；框架层的实现方式是通过 <code>config = {&quot;recursion_limit&quot;: N}</code>，计数粒度是所有 Node 执行次数之和（物理粒度），触发行为是抛出 <code>GraphRecursionError</code>，需要调用层用 try/except 捕获。</p><p>两层分工：业务层保证<strong>语义正确</strong>（给用户有意义的&quot;抱歉没查到&quot;），框架层保证<strong>系统安全</strong>（防止业务层逻辑 bug 导致真正的死循环拖垮进程）。生产代码两层都要有：</p><pre><code class=\"language-python\">from langgraph.errors import GraphRecursionError\ntry:\n    result = graph.invoke(state, config={&quot;recursion_limit&quot;: 50, &quot;configurable&quot;: {...}})\nexcept GraphRecursionError:\n    result = &quot;执行超限，请简化问题后重试&quot;</code></pre><p><strong>记忆点：业务层管&quot;语义终止&quot;，框架层管&quot;系统兜底&quot;，两层互补不替代。</strong></p>"},{"qnum":2,"qtext":"Checkpoint 和 State 有什么区别？`thread_id` 的作用是什么？","answerHtml":"<p><code>State</code> 是图在某一时刻的完整状态（<code>TypedDict</code> 实例），运行中只有一份&quot;当前状态&quot;；<code>Checkpoint</code> 是每个 Node 执行完后对 State 打的快照，附带 <code>next</code>（下一节点）、<code>created_at</code> 等元数据，一次图执行会产生多个历史快照。</p><p><code>thread_id</code> 是 Checkpointer 用来隔离不同会话的键。同一图实例里，不同 <code>thread_id</code> 的快照完全独立，互不干扰。相同 <code>thread_id</code> 的多次 <code>invoke</code> 共享快照序列，后一次自动延续前一次的状态——这是多轮对话记忆和跨进程恢复的基础。</p><pre><code class=\"language-python\"># 用户 A 和用户 B 的快照完全隔离\nconfig_a = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;user-alice&quot;}}\nconfig_b = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;user-bob&quot;}}</code></pre>"},{"qnum":3,"qtext":"`MemorySaver` 怎么接入？接入后 `invoke` 时需要传哪个参数？为什么？","answerHtml":"<p>接入只需两步：</p><pre><code class=\"language-python\">from langgraph.checkpoint.memory import MemorySaver\n\nmemory = MemorySaver()\ngraph = builder.compile(checkpointer=memory)   # ① compile 时传 checkpointer</code></pre><p><code>invoke</code> 时必须传 <code>config</code>：</p><pre><code class=\"language-python\">config = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;session-1&quot;}}\ngraph.invoke(initial_state, config=config)      # ② invoke 时传 config</code></pre><p>必须传 <code>config</code> 的原因：Checkpointer 靠 <code>thread_id</code> 来区分不同会话的快照序列。不传 <code>config</code> 时 LangGraph 不知道这次执行属于哪个会话，无法读写正确的快照，会直接报错。</p><p><strong>Checkpoint 是横切关注点</strong>：接入后节点和边的代码完全不用改，只改初始化和 <code>invoke</code> 调用处。</p>"},{"qnum":4,"qtext":"`interrupt_before` 是什么？`invoke(None)` 为什么能从暂停点继续执行？","answerHtml":"<p><code>interrupt_before</code> 是 <code>compile</code> 时传入的节点名列表，指定哪些节点在执行<strong>前</strong>自动暂停：</p><pre><code class=\"language-python\">graph = builder.compile(checkpointer=memory, interrupt_before=[&quot;call_tools&quot;])</code></pre><p>图执行到 <code>call_tools</code> 前，自动将当前 State 存入 Checkpoint，然后 <code>invoke</code> 返回——此时 <code>graph.get_state(config).next == ('call_tools',)</code>，说明图还未结束，在等待继续信号。</p><p><code>invoke(None)</code> 能从暂停点继续，原因：</p><ol><li><code>None</code> 告诉 LangGraph &quot;不注入新的初始状态&quot;</li><li>LangGraph 从 Checkpointer 读取 <code>thread_id</code> 对应的最新快照</li><li>快照里的 <code>next</code> 字段指向 <code>call_tools</code>，图从这里继续执行</li></ol><pre><code class=\"language-python\"># 暂停后，人工确认，然后恢复\nfinal = graph.invoke(None, config=config)</code></pre><p><code>interrupt_before</code> + <code>invoke(None)</code> + <code>update_state</code> 三者组合，就是 Day 36 Human-in-the-loop 的完整实现基础。</p>"},{"qnum":5,"qtext":"`MemorySaver` 和 `SqliteSaver` 各适用什么场景？切换 Checkpointer 需要改哪些代码？","answerHtml":"<p>存储位置上，<code>MemorySaver</code> 存在进程内存里，<code>SqliteSaver</code> 存在磁盘 SQLite 文件里；进程重启后，<code>MemorySaver</code> 的快照会丢失，<code>SqliteSaver</code> 的快照会保留；适用场景上，<code>MemorySaver</code> 适合开发调试、单次会话验证，<code>SqliteSaver</code> 适合长任务、跨会话/跨进程恢复、生产环境。</p><p>切换只需改初始化一行，其余代码（节点、边、<code>invoke</code>、<code>get_state</code>）<strong>零改动</strong>：</p><pre><code class=\"language-python\"># 开发阶段\nmemory = MemorySaver()\n\n# 生产阶段，改这一行即可\nfrom langgraph.checkpoint.sqlite import SqliteSaver\nmemory = SqliteSaver.from_conn_string(&quot;checkpoints.db&quot;)\n\n# 后续代码完全不变\ngraph = builder.compile(checkpointer=memory)\ngraph.invoke(initial_state, config=config)\ngraph.get_state(config)\ngraph.invoke(None, config=config)</code></pre><p>这是&quot;Checkpoint 是横切关注点&quot;的直接体现：持久化策略和业务逻辑解耦，换存储方案不需要动图的任何业务代码。</p>"},{"qnum":6,"qtext":"`graph.get_state()` 返回的 `StateSnapshot` 有哪些关键字段？如何用它判断图是处于暂停状态还是已经执行完毕？","answerHtml":"<p><code>StateSnapshot</code> 包含四个关键字段：</p><pre><code class=\"language-python\">snapshot = graph.get_state(config)\nsnapshot.values        # dict：当前 State 字段值\nsnapshot.next          # tuple：下一步要执行的节点，() 表示已结束\nsnapshot.config        # dict：这个快照对应的 config\nsnapshot.created_at    # str：ISO 格式时间戳</code></pre><p>判断图是否暂停的关键是 <code>snapshot.next</code>：<strong>如果 <code>next</code> 非空（如 <code>('call_tools',)</code>），说明图还没执行完，正在某个节点前等待</strong>；如果 <code>next</code> 为空元组 <code>()</code>，说明图已经跑完到 <code>END</code>。</p><pre><code class=\"language-python\">snapshot = graph.get_state(config)\nif snapshot.next:\n    print(f&quot;图暂停在 {snapshot.next} 之前，等待恢复&quot;)\nelse:\n    print(&quot;图已执行完毕&quot;)</code></pre><p>除了查看当前快照，<code>graph.get_state_history(config)</code> 还能拿到该 <code>thread_id</code> 下的<strong>全部历史快照</strong>（从新到旧的迭代器），对应一次图执行在每个 Node 执行完后打的快照序列：</p><pre><code class=\"language-python\">for snapshot in graph.get_state_history(config):\n    print(snapshot.created_at, snapshot.next)</code></pre><p><code>get_state</code> 只看&quot;现在&quot;，<code>get_state_history</code> 能回溯&quot;图是怎么一步步走到现在的&quot;，两者配合是调试 Checkpoint 逻辑（比如确认某一步的 State 是否符合预期）最直接的手段。</p><p><strong>记忆点：<code>snapshot.next</code> 非空 = 暂停中，为空元组 = 已结束；<code>get_state</code> 看当前，<code>get_state_history</code> 看全部历史轨迹。</strong></p>"},{"qnum":7,"qtext":"`SqliteSaver` 相比 `MemorySaver` 是如何实现\"跨进程恢复\"的？结合\"进程 1 暂停 → 进程 2 恢复\"的场景说明关键机制。","answerHtml":"<p><code>MemorySaver</code> 把 Checkpoint 存在进程内存里，进程一退出快照就没了；<code>SqliteSaver</code> 把 Checkpoint 写进磁盘上的 SQLite 文件，只要文件还在，任何进程都能读到同一份快照数据：</p><pre><code class=\"language-python\">from langgraph.checkpoint.sqlite import SqliteSaver\n\n# 方式 A：上下文管理器（推荐）\nwith SqliteSaver.from_conn_string(&quot;checkpoints.db&quot;) as memory:\n    graph = builder.compile(checkpointer=memory)\n    result = graph.invoke(initial_state, config=config)\n\n# 方式 B：手动管理连接\nmemory = SqliteSaver.from_conn_string(&quot;checkpoints.db&quot;)\ngraph = builder.compile(checkpointer=memory)</code></pre><p>跨进程恢复的完整场景：</p><pre><code class=\"language-python\"># 进程 1：开始执行，在 call_tools 前暂停\ngraph.invoke(initial_state, config={&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;task-001&quot;}})\n# 此时进程 1 退出，checkpoints.db 里已经写入了暂停点的快照\n\n# 进程 2（全新进程，甚至可以是不同机器上挂载同一份数据库文件）：\n# 重启后，从暂停点继续\ngraph.invoke(None, config={&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;task-001&quot;}})\n# invoke(None) + 同一 thread_id → LangGraph 从 checkpoints.db 里查 thread_id=&quot;task-001&quot; 的最新快照 → 继续执行</code></pre><p>关键机制是两点：① Checkpoint 数据落盘而不是留在进程堆内存里，进程生命周期和 Checkpoint 生命周期彻底解耦；② <code>thread_id</code> 是查找快照的唯一键，只要新进程用相同的 <code>thread_id</code> 连上同一个数据库文件，就能查到上次暂停时的完整 State，<code>invoke(None)</code> 触发的仍然是&quot;读快照 → 从 <code>next</code> 指向的节点继续&quot;这套逻辑，和同进程内恢复完全一样。</p><p><strong>记忆点：<code>SqliteSaver</code> 把快照从进程内存搬到磁盘文件，<code>thread_id</code> 是跨进程也能找到同一份快照的钥匙——恢复逻辑本身（<code>invoke(None)</code>）不因跨进程而改变。</strong></p>"}]},{"name":"深化阶段·Human-in-the-loop 人工审核节点","questions":[{"qnum":1,"qtext":"Human-in-the-loop 的三条审核路径分别是什么？各自用什么 LangGraph API 实现？","answerHtml":"<p>在 <code>interrupt_before=[&quot;call_tools&quot;]</code> 暂停之后，一共有三条路径可以走。第一条是<strong>批准</strong>，工具照着原来的参数执行就行，直接调用 <code>graph.invoke(None, config)</code> 恢复执行即可，什么都不用改。第二条是<strong>修改参数后批准</strong>，工具还是会执行，但用的是改过的新参数，做法是先调 <code>graph.update_state(config, {&quot;messages&quot;: [corrected_ai_msg]})</code> 把消息修正过来，再调 <code>graph.invoke(None, config)</code> 恢复执行。第三条是<strong>拒绝</strong>，工具完全不会被执行，做法是调 <code>graph.update_state(config, {&quot;messages&quot;: rejection_msgs}, as_node=&quot;call_tools&quot;)</code>，注入一条拒绝消息，然后同样用 <code>graph.invoke(None, config)</code> 恢复执行。</p><p>三条路径最终都调用 <code>invoke(None)</code> 恢复执行，区别在于恢复前是否修改了 State：批准不改、修改参数改了模型消息、拒绝注入了假 ToolMessage 并声明 <code>as_node</code>。</p>"},{"qnum":2,"qtext":"`update_state` 的 `as_node` 参数有什么用？拒绝路径为什么必须传 `as_node=\"call_tools\"`？","answerHtml":"<p><code>as_node</code> 告诉 LangGraph：这次 State 更新应该被视为<strong>哪个节点执行完毕后的输出</strong>。LangGraph 用它来确定图的下一步走向。如果不传 <code>as_node</code>，图会认为自己仍停在暂停的位置（call_tools 之前），下一步就会继续执行 call_tools；如果传了 <code>as_node=&quot;call_tools&quot;</code>，图会认为 call_tools 已经执行完毕，于是沿着 call_tools 的出边走向下一个节点 call_model。</p><p>拒绝路径的目标是<strong>跳过 call_tools，让模型看到拒绝结果后给用户解释</strong>。如果不传 <code>as_node</code>，图仍然会去执行 <code>call_tools</code>（我们注入的 ToolMessage 会被 <code>add_messages</code> 追加，然后 <code>call_tools</code> 再追加真实的工具结果），工具还是会被调用。传了 <code>as_node=&quot;call_tools&quot;</code> 之后，图认为 <code>call_tools</code> 已经跑完了，直接去 <code>call_model</code>，拒绝消息就是工具的&quot;执行结果&quot;。</p>"},{"qnum":3,"qtext":"修改工具参数时，为什么要保持 `AIMessage` 的 `id` 不变？","answerHtml":"<p><code>add_messages</code> Reducer 合并消息时遵循这个规则：<strong>相同 <code>id</code> 的消息，新消息替换旧消息；不同 <code>id</code> 的消息，追加到列表末尾</strong>。</p><pre><code class=\"language-python\">corrected_msg = AIMessage(\n    content=last_ai_msg.content,\n    tool_calls=[corrected_tool_call],\n    id=last_ai_msg.id,      # 关键：同 id → 替换原始消息\n)\ngraph.update_state(config, {&quot;messages&quot;: [corrected_msg]})</code></pre><p>如果用新 <code>id</code>，State 里会变成两条 <code>AIMessage</code>：原始的（带旧参数的 tool_calls）和新的（带新参数的 tool_calls）。<code>call_tools</code> 执行时读最后一条消息，得到新参数，结果看似正确；但原始消息留在历史里，会给模型带来困惑——它会看到一条没有对应 ToolMessage 的&quot;悬空&quot;工具调用记录。保持相同 <code>id</code> 让更新语义变成&quot;修正&quot;而非&quot;追加&quot;，History 干净可追溯。</p>"},{"qnum":4,"qtext":"哪些操作必须加人工确认？给出判断标准和典型例子。","answerHtml":"<p>判断标准是：只要满足以下任意一条就应该加人工确认。第一是不可逆，也就是执行后无法撤销，典型例子是发送邮件、删除文件、提交订单；第二是涉及外部副作用，也就是影响系统边界之外的操作，比如调用第三方 API 写入数据、发布内容；第三是涉及资金，比如支付、转账、退款；第四是涉及隐私数据，比如读取或传输用户个人信息、导出数据；第五是高影响范围，比如批量发通知、批量修改权限。</p><p>反例（不需要审核）：查询天气/汇率/搜索结果——只读、无副作用、可重复执行，出错重试即可，不需要人工干预。</p><p><strong>记忆口诀：不可逆、有副作用、涉及钱或隐私、影响范围大——这四类必须加确认。</strong></p>"},{"qnum":5,"qtext":"生产场景里如何只对高风险工具触发审核，而让低风险工具（如查天气）自动执行？","answerHtml":"<p><code>interrupt_before=[&quot;call_tools&quot;]</code> 会对所有工具调用暂停，不够精细。生产场景的做法是在 <code>call_tools</code> 节点内部按工具名过滤：</p><pre><code class=\"language-python\">HIGH_RISK_TOOLS = {&quot;send_email&quot;, &quot;delete_record&quot;, &quot;process_payment&quot;}\n\ndef call_tools_with_filter(state: AgentState) -&gt; dict:\n    last_message = state[&quot;messages&quot;][-1]\n    safe_calls = [tc for tc in last_message.tool_calls if tc[&quot;name&quot;] not in HIGH_RISK_TOOLS]\n    high_risk_calls = [tc for tc in last_message.tool_calls if tc[&quot;name&quot;] in HIGH_RISK_TOOLS]\n\n    results = []\n    # 低风险工具立即执行\n    for tc in safe_calls:\n        result = tool_registry[tc[&quot;name&quot;]].invoke(tc[&quot;args&quot;])\n        results.append(ToolMessage(content=str(result), tool_call_id=tc[&quot;id&quot;]))\n\n    # 高风险工具：暂存到 State，交给后续的 human_review 节点处理\n    return {&quot;messages&quot;: results, &quot;pending_approval&quot;: high_risk_calls}</code></pre><p>另一种更简洁的实现：把高风险工具拆到独立节点 <code>call_high_risk_tools</code>，只对该节点加 <code>interrupt_before</code>，低风险工具走 <code>call_safe_tools</code> 节点（无中断）。这样图结构上就分离了两类工具的处理路径，审核逻辑和执行逻辑都更清晰。</p>"},{"qnum":6,"qtext":"演示\"拒绝\"路径时，怎么验证 `send_email` 工具确实没有被调用？这种验证方式对 Human-in-the-loop 系统的可靠性验证有什么启发？","answerHtml":"<p>验证方法是看工具函数内部的副作用有没有真正发生。<code>send_email</code> 工具在真正执行时会打印一行模拟发送日志：</p><pre><code class=\"language-python\">@tool\ndef send_email(to: str, subject: str, body: str) -&gt; dict:\n    &quot;&quot;&quot;发送电子邮件。该操作不可逆，发送前需要人工确认。&quot;&quot;&quot;\n    print(f&quot;\\n📧 [模拟发送] 收件人: {to} | 主题: {subject}&quot;)   # 只有工具真正被调用才会打印\n    print(f&quot;   正文: {body}&quot;)\n    return {&quot;status&quot;: &quot;sent&quot;, &quot;to&quot;: to, &quot;subject&quot;: subject}</code></pre><p>走拒绝路径时：</p><pre><code class=\"language-python\">result_c = reject(config_c)\n# ❌ 已拒绝，工具调用被取消...\nprint(result_c[&quot;messages&quot;][-1].content)\n# 很抱歉，此次发送邮件的操作已被取消，邮件未发出。如果您需要其他帮助，请告知。</code></pre><p><strong>关键的验证点在于，路径 C 走完之后，<code>send_email</code> 内部那行 <code>print(f&quot;📧 [模拟发送]...&quot;)</code> 应该永远不会出现在控制台里</strong>——只要它打印出来了，就说明拒绝逻辑没生效，工具其实还是被真实调用了。除了盯这行日志，还可以用 <code>graph.get_state_history(config)</code> 把路径 C 的全部历史快照打出来，找到注入 <code>ToolMessage</code> 的那一步，确认传了 <code>as_node=&quot;call_tools&quot;</code> 之后，图确实认为 <code>call_tools</code> 已经&quot;执行完&quot;了——也就是快照里根本没有出现真正跑过 <code>call_tools</code> 节点的痕迹。</p><p>这个验证方式的启发在于：<strong>审核逻辑对不对，不能只看模型给用户的回复措辞是否&quot;像是拒绝了&quot;</strong>——模型完全可能一边正常调用了工具、一边在回复里编造&quot;已取消&quot;的说法（幻觉）。必须验证工具函数内部真实的副作用（日志、外部系统状态）有没有发生，这是判断 Human-in-the-loop 拒绝路径是否真正生效的唯一可靠依据，光看最终文本回复是不够的。</p><p><strong>记忆点：判断拒绝路径是否生效，要看工具的真实副作用有没有发生，不能只信模型嘴上说的&quot;已取消&quot;。</strong></p>"}]},{"name":"深化阶段·第 5 周复盘（LangChain / LangGraph 适用边界）","questions":[{"qnum":1,"qtext":"LangChain LCEL 和 LangGraph 各自解决了什么问题？两者是替代关系还是互补关系？","answerHtml":"<p>这两者其实解决的是完全不同层面的问题。LangChain 的 LCEL 解决的是单步链路怎么标准化，说白了就是组装 Prompt、调用模型、解析输出这一整套流程里反复出现的重复劳动，核心抽象是 <code>Runnable</code> 接口配合 <code>|</code> 这个管道语法，适用的场景就是一次&quot;输入进去、输出出来&quot;的链路。LangGraph 解决的是另一个层面的问题，也就是多步流程怎么编排，专门针对状态藏得看不见、分支走向不透明、没法中断也没法持久化这些痛点，核心抽象是 <code>StateGraph</code> 加上 <code>Node</code>、<code>Edge</code>、<code>Checkpointer</code> 这一套，适用的场景是把好几个步骤组织成一张有状态的流程图。</p><p><strong>互补关系，不是替代关系</strong>。LangGraph 的 Node 本质上是 LCEL <code>Runnable</code>，可以把 <code>prompt | model | parser</code> 的 LCEL 链直接挂进 LangGraph Node。实际项目里：LCEL 负责单个 Node 内部的链路组合，LangGraph 负责 Node 之间的编排和状态管理，两者配合使用。</p>"},{"qnum":2,"qtext":"LangGraph 相比手写 `while` 循环具体解决了哪四个问题？","answerHtml":"<p>第一个问题是状态不显式：手写 while 循环里，状态基本都窝在 <code>messages</code> 这一个列表里，你根本看不清当前跑到哪一步了，LangGraph 用 <code>TypedDict</code> 定义的 State，给每个字段都起了名字、定了类型，这个问题就解决了。第二个问题是流程没法可视化：手写代码里 <code>if/elif/else</code> 散落得到处都是，既没名字也画不出结构，LangGraph 用命名的 Node 加 Edge 组织流程，配合 <code>draw_mermaid()</code> 一行代码就能把整张图打印出来。第三个问题是没法持久化：手写 while 只要进程一崩溃，状态就全没了，长任务必须一口气跑完不能断，LangGraph 用 <code>MemorySaver</code> 或者 <code>SqliteSaver</code>，每一步执行完都自动生成快照。第四个问题是没法中断和恢复：手写函数的调用栈没法挂起，做不了 Human-in-the-loop，LangGraph 用 <code>interrupt_before</code> 配合 <code>invoke(None)</code>，就能从暂停的地方接着往下执行。</p><p>四项能力的底层逻辑都是同一件事：<strong>State 显式化之后，持久化就是序列化 State，中断就是在某个 Node 前存快照，恢复就是反序列化快照继续执行</strong>——这些都是自然的副产品。</p>"},{"qnum":3,"qtext":"什么信号说明该引入 LangGraph？什么信号说明手写 while 够用？","answerHtml":"<p><strong>引入 LangGraph 的信号</strong>（满足任意一条）：</p><ul><li>需要在执行中等待人工输入/确认（Human-in-the-loop）</li><li>流程有多条分支路径，分支条件依赖运行时状态</li><li>进程崩溃后需要从中断点继续，而非从头开始</li><li>需要向团队演示/调试 Agent 的执行路径</li></ul><p><strong>手写 while 仍然够用的条件</strong>（需同时满足所有）：</p><ul><li>流程是线性的：用户输入 → 模型推理 → 工具执行（最多两步）</li><li>状态简单：只有 <code>messages</code> 列表，无跨步骤自定义字段</li><li>无需持久化：重启从头开始完全可以接受</li><li>无需人工介入：工具全部自动执行</li></ul><p><strong>判断口诀：不需要分支 + 不需要中断 + 不需要持久化 → 手写 while 够用；任何一个&quot;需要&quot;出现 → 考虑 LangGraph。</strong></p>"},{"qnum":4,"qtext":"为什么说\"LangGraph Node 本质上是 LCEL Runnable\"？实际项目里两者怎么配合使用？","answerHtml":"<p>LangGraph 的 Node 函数签名（接收 <code>State</code>，返回 <code>dict</code>）本质上符合 LCEL <code>Runnable</code> 接口的语义——两者都是&quot;接收输入，产生输出&quot;的可组合单元。</p><p>实际配合方式：</p><pre><code class=\"language-python\"># 单个 Node 内部用 LCEL 链处理复杂链路\nsummarize_chain = ChatPromptTemplate.from_template(&quot;总结：{text}&quot;) | llm | StrOutputParser()\n\ndef summarize_node(state: AgentState) -&gt; dict:\n    text = state[&quot;messages&quot;][-1].content\n    summary = summarize_chain.invoke({&quot;text&quot;: text})   # LCEL 链在 Node 内部运行\n    return {&quot;messages&quot;: [AIMessage(content=summary)]}\n\n# Node 挂进 LangGraph\nbuilder.add_node(&quot;summarize&quot;, summarize_node)</code></pre><p><strong>分工</strong>：LCEL 管&quot;这个 Node 内部怎么处理&quot;（链路组合），LangGraph 管&quot;这些 Node 怎么串联、状态怎么传递、何时暂停&quot;（编排）。两层职责清晰，互不越界。</p>"},{"qnum":5,"qtext":"引入 LangChain 的代价是什么？哪些场景下引入它反而增加了负担？","answerHtml":"<p><strong>代价</strong>：引入 LangChain 的代价主要有四类。第一是依赖重，比如 <code>langchain-openai</code> 就有几十个传递依赖，安装时间长，版本冲突风险也高；第二是调试透明度降低，手写代码每一步都可以直接 <code>print</code> 查看，但 LCEL 需要把链路拆开单独 <code>invoke</code> 才能看到中间状态；第三是版本迭代快，LangChain 的破坏性变更比较频繁，升级时可能导致原来的代码失效；第四是隐藏了 API 细节，实际发出的 HTTP 请求结构、Token 计数发生在哪个环节，都被框架封装起来看不见了。</p><p><strong>不值得引入的场景</strong>：</p><ul><li>一次性脚本、简单单步调用——代码量反而比手写更多</li><li>调试优先——框架的中间状态需要额外步骤才能看到</li><li>团队不熟悉 LangChain——学习和维护成本超过收益</li><li>需要精确控制每一个 API 参数——框架封装屏蔽了部分参数</li></ul><p><strong>判断标准</strong>：链路复杂度越高（RAG、Agent、多步链路），框架收益越大；越简单越一次性，手写越合适。在 Day 31–32 规模的 Demo 上，LangChain 的收益不显著；到 Day 33 的 LangGraph 多步 Agent 编排，框架统一接口的价值才真正体现。</p>"},{"qnum":6,"qtext":"原生 API 手写代码里有哪三类\"重复劳动\"会在每个项目里反复出现？LCEL 的管道语法分别标准化了其中的哪一部分？","answerHtml":"<p>这三类重复劳动分别是：第一是 Provider 绑定，手写方式是 <code>client = OpenAI(base_url=..., api_key=...)</code>，每次都要改的地方是换一个模型就得改调用方式；第二是链路组装，手写方式是 <code>messages = [{...}]; response = client.chat...; content = response.choices[0]...</code> 这几行，每次都要改的地方是每个项目都要重新写这三行；第三是输出解析，手写方式是 <code>json.loads(content)</code> 加 <code>try/except</code> 再加 <code>Pydantic(**data)</code>，每次都要改的地方是解析逻辑到处复制粘贴。</p><p>LCEL 用 <code>chain = ChatPromptTemplate.from_template(&quot;...&quot;) | ChatOpenAI(...) | StrOutputParser()</code> 一条管道对应标准化这三类：</p><ul><li><strong>Provider 绑定</strong> → 换成 <code>ChatOpenAI(...)</code> 等 <code>Runnable</code> 实例，切换 Provider 只改初始化参数，调用方式不变</li><li><strong>链路组装</strong> → <code>|</code> 操作符自动串联，不用手写 <code>messages</code> 构造和 <code>response.choices[0]</code> 解析</li><li><strong>输出解析</strong> → <code>StrOutputParser</code> / <code>PydanticOutputParser</code> 把&quot;解析 + 校验 + 失败重试&quot;封装成可复用组件</li></ul><p><strong>记忆点：LCEL 不是发明了新能力，而是把三段散装的重复代码收进一个 <code>Runnable</code> 协议里。</strong></p>"},{"qnum":7,"qtext":"手写 while 循环的三个结构性缺陷，在真实项目场景里具体会造成什么后果？","answerHtml":"<p>手写 while 循环有三个结构性缺陷，每一个在真实项目里都会造成具体的后果。第一是状态隐式，也就是状态都藏在 messages 里，想知道&quot;这一轮调用了几个工具&quot;只能遍历整个 messages 数组去数 ToolMessage 的数量，要加一个新字段比如 retry_count，还得在调用方和工具执行处分别手动维护；第二是不可中断，要实现 Human-in-the-loop，只能在工具执行前用 <code>input()</code> 阻塞整个进程，没法在 web 服务里使用，因为函数栈没法挂起，也就没法&quot;稍后继续&quot;；第三是不可持久化，进程一旦崩溃，前面 20 步的工具调用全部白费，只能从头再来，长任务必须一口气跑完，不能分步保存进度。</p><p>这三类后果分别对应 LangGraph 的三项能力：<code>TypedDict</code> State 解决状态隐式、<code>interrupt_before</code> + <code>invoke(None)</code> 解决不可中断、<code>MemorySaver</code> / <code>SqliteSaver</code> 解决不可持久化。</p><p><strong>记忆点：手写 while 的缺陷不是&quot;理论上不优雅&quot;，而是会在具体运维场景里变成&quot;无法上线&quot;的硬伤。</strong></p>"},{"qnum":8,"qtext":"笔记把 Day 31–36 六天内容总结为\"能跑 → 能编排 → 能审核\"的升级路径，具体是怎么对应到每两天的？","answerHtml":"<pre><code>Day 31–32（LangChain LCEL）→ 能跑：\n  把&quot;组装 Prompt → 调用模型 → 解析输出&quot;这条链路标准化\n  原生 API 的三段分散代码 → prompt | model | parser 一条管道\n\nDay 33–34（LangGraph 基础 + 条件边）→ 能编排：\n  把 while 循环里的隐式状态 + if/else 分支 → 显式 StateGraph + 命名的 Node / Edge\n  状态可见、分支可可视化、图结构可打印\n\nDay 35–36（Checkpoint + Human-in-the-loop）→ 能审核：\n  给图加上&quot;暂停 → 持久化 → 恢复&quot;能力，进而实现人工审核决策\n  手写 while 循环里实现不了的能力，现在一行 compile 参数就能开启</code></pre><p>这条路径每一层都以前一层为基础：没有 LCEL 的单步标准化，LangGraph 的 Node 无法复用 LCEL 链；没有 LangGraph 的显式 State，Checkpoint 和中断恢复无从谈起。</p><p><strong>记忆点：&quot;能跑&quot;解决单步问题，&quot;能编排&quot;解决多步流程问题，&quot;能审核&quot;解决人机协作问题——层层递进，不能跳步。</strong></p>"}]},{"name":"深化阶段·MCP 协议原理","questions":[{"qnum":1,"qtext":"MCP 是什么？它解决了工具集成的哪个核心问题？\"USB-C 类比\"的准确性体现在哪里？","answerHtml":"<p>MCP（Model Context Protocol）是 Anthropic 在 2024 年底发布的开放协议，解决的核心问题是<strong>工具集成的碎片化</strong>：每个 AI 应用各自写一套工具集成代码，工具无法跨应用、跨语言复用。</p><p>MCP 的核心主张：把工具（Tools）、数据（Resources）、提示词（Prompts）打包成标准化的 MCP Server，任何遵循 MCP 协议的 AI 应用（MCP Client）都可以发现并使用，不受编程语言限制。</p><p>&quot;USB-C 类比&quot;的准确性：</p><ul><li><strong>USB-C 统一了设备 ↔ 充电器接口</strong>：任何 USB-C 设备都能用任何 USB-C 充电器，不需要专属充电器</li><li><strong>MCP 统一了 AI 应用 ↔ 工具服务器接口</strong>：任何 MCP Client 都能连接任何 MCP Server，工具开发者写一次，所有 AI 应用可用</li></ul><p>碎片化的典型表现：&quot;查数据库&quot;工具被十个团队各自实现十份——MCP 把它做成一个标准化的独立进程服务，十个团队的 AI 应用都&quot;连接&quot;它而不是各自&quot;复制&quot;它。</p>"},{"qnum":2,"qtext":"MCP 的三种核心能力（Tools / Resources / Prompts）各自是什么？三者在\"副作用\"上有何本质区别？","answerHtml":"<p>Tools 的方向是 Client 调用、Server 执行，由模型决策触发，典型用途是搜索、查数据库、发邮件、执行操作这类会产生动作的场景；Resources 的方向是 Client 主动拉取，由 Client 主动请求触发，典型用途是读文档、读实时指标、读日历事件；Prompts 的方向是 Client 请求模板，同样由 Client 主动请求触发，典型用途是获取调优好的（可能带参数的）提示词模板。</p><p><strong>副作用区分是关键</strong>：</p><ul><li><strong>Tools</strong>：可能产生副作用（发邮件会真的发、查数据库会消耗资源、执行代码会改变状态）——模型需要决定&quot;是否真的要调用&quot;</li><li><strong>Resources</strong>：通常只读、无副作用（读文件不改变文件，读指标不改变指标）——Client 主动拉取，不需要模型判断</li><li><strong>Prompts</strong>：纯只读、无副作用（请求模板不做任何操作）——适合把调优好的提示词集中管理、跨应用共享</li></ul>"},{"qnum":3,"qtext":"MCP 和 Function Calling 的定位差异是什么？两者是替代关系还是互补关系？","answerHtml":"<p>Function Calling 处在模型 API 层，解决的是模型如何表达&quot;我要调用哪个工具、传什么参数&quot;这个问题，由各家 LLM 厂商（OpenAI / Anthropic / DeepSeek）各自定义，不涉及跨语言的问题，工具代码和应用是绑定的，无法复用。MCP 则处在工具服务连接层，解决的是工具服务器如何被标准化发现、跨应用复用的问题，由 Anthropic 定义为开放协议、厂商中立，Server 和 Client 可以用不同语言实现，一个 Server 可以被多个 Client 共享复用。</p><p><strong>互补关系，不是替代关系</strong>。完整工具调用链路：</p><ol><li>MCP Client 调用 Server 的 <code>list_tools()</code> 拿到工具列表</li><li>Client 把工具列表<strong>转成 Function Calling 格式</strong>注册给模型</li><li>模型通过 Function Calling 决定调用哪个工具，返回结构化调用请求</li><li>Client 把请求转发给 MCP Server 的 <code>call_tool()</code> 执行</li></ol><p><strong>MCP 在外层解决&quot;工具服务怎么被发现和连接&quot;，Function Calling 在内层解决&quot;模型怎么表达工具调用意图&quot;</strong>——两层职责清晰，MCP Server 本质上通过 Function Calling 把工具暴露给模型。</p>"},{"qnum":4,"qtext":"MCP Server 做成独立进程而非\"注册函数到应用里\"，带来了哪三个架构收益？","answerHtml":"<p>这带来三个架构收益。第一是语言无关，Server 可以用 Python、TypeScript、Go、Rust 任意一种语言来写，Client 完全不关心它的实现语言，所以 Python 写的 AI 应用可以直接连接一个用 Go 写的工具服务器；第二是可复用，一个&quot;数据库查询 Server&quot;可以被多个 AI 应用同时连接，不需要每个应用各自再实现一遍；第三是进程隔离，Server 崩溃不会影响到 Client 也就是 AI 应用本身，而且 Server 的系统权限比如文件系统访问权限，和 Client 的权限可以分开控制。</p><p>对比 Day 23–25 手写 <code>@tool</code> 函数（工具和应用同进程）：</p><ul><li>工具绑定在应用里 → 换 AI 应用就要把工具代码复制过去</li><li>MCP Server 是独立进程 → AI 应用只需要&quot;连接&quot;而不是&quot;复制&quot;</li></ul><p>这个架构决策让 MCP 成为可能：&quot;写一次工具服务器，全公司 AI 应用共用&quot;。</p>"},{"qnum":5,"qtext":"MCP 和 A2A 连接的对象分别是什么？A2A 的 Task 对象、Agent Card、流式状态更新（Push）三个核心概念各自解决什么问题？","answerHtml":"<p>MCP 连接的方向是模型（通过 Client）和工具/数据（Server）之间，回答的问题是模型怎么找到并调用外部工具、外部数据怎么被模型读取；A2A 连接的方向是 Agent 和 Agent 之间，回答的问题是一个 Agent 怎么把子任务委派给另一个 Agent、两个 Agent 之间怎么同步任务状态。</p><p>A2A 的三个核心概念：</p><ul><li><strong>Task 对象</strong>：任务有明确的生命周期状态（<code>submitted</code> → <code>working</code> → <code>completed</code> / <code>failed</code>）</li><li><strong>Agent Card</strong>：每个 Agent 声明自己能做什么（类比 MCP 的 <code>list_tools</code>，但声明的是 Agent 的整体能力，不是单个工具）</li><li><strong>流式状态更新（Push）</strong>：委派出去的任务通过 Streaming 推送进度，不需要轮询</li></ul><p>类比：MCP 像&quot;插座标准&quot;——工具（插头）和 Agent（设备）之间的接口规范；A2A 像&quot;快递协议&quot;——Agent 之间怎么&quot;寄任务&quot;、&quot;查进度&quot;、&quot;收结果&quot;。</p><p><strong>记忆点：遇到&quot;Agent 怎么用工具&quot;想到 MCP，遇到&quot;Agent 怎么和另一个 Agent 协作&quot;想到 A2A。</strong></p>"},{"qnum":6,"qtext":"MCP 为什么能在 2024 年底发布后迅速成为 2026 年的事实标准？和早期 ChatGPT Plugin 相比，MCP 成功的关键设计差异是什么？","answerHtml":"<p>四个原因：</p><ol><li><strong>开放协议，厂商中立</strong>：任何 AI 应用都可以实现 MCP Client，任何工具服务都可以实现 MCP Server，不被任何厂商绑定</li><li><strong>生态快速积累</strong>：GitHub、Slack、Google Drive、数据库、浏览器等已经有大量开源 MCP Server 实现，接入后立刻可用</li><li><strong>工具复用解决了真实痛点</strong>：提供了&quot;写一次工具服务器、全公司 AI 应用共用&quot;的标准方案</li><li><strong>被主流 AI 应用和框架采纳</strong>：Claude Code、Claude Desktop、Cursor、LangChain、LangGraph 都原生支持</li></ol><p>与 ChatGPT Plugin 的关键差异：ChatGPT Plugin 是闭源的、绑定在 ChatGPT 上，工具定义复杂，也没有解决跨应用复用的问题，是一个失败的先例；MCP 则是开放协议、厂商中立，设计上轻量，从源头上就是开放、轻量、跨语言的，因此解决了跨应用复用的问题。</p><p><strong>记忆点：MCP 成功的关键不是技术多先进，而是&quot;开放 + 轻量 + 跨语言&quot;从设计源头解决了 ChatGPT Plugin 没解决的&quot;跨 AI 应用复用&quot;问题。</strong></p>"},{"qnum":7,"qtext":"MCP 架构里的 Host 角色是什么？和 Client、Server 有什么区别？从 Client 启动到执行一次工具调用，完整交互流程有哪几步？","answerHtml":"<p>角色划分：MCP Server 的职责是暴露 Tools / Resources / Prompts、响应 Client 的请求，例子是一个运行着&quot;数据库查询工具&quot;的独立进程；MCP Client 的职责是发现并调用 Server 的能力、把工具结果传给模型，例子是 Claude Code、自己写的 AI 应用、或者一张 LangGraph 图；Host 是可选角色，职责是管理 Client 的生命周期、处理用户界面，例子是 VS Code 插件、桌面应用。</p><p>Host 不直接和 Server 交互，它是 Client 的&quot;容器&quot;——比如 VS Code 插件（Host）里跑着一个 MCP Client，真正连接 Server 的是 Client 这一层。</p><p>完整交互流程（四步）：</p><ol><li>Client 启动时调用 Server 的 <code>list_tools()</code> 拿到工具列表</li><li>Client 把工具列表转成 Function Calling 格式注册给模型</li><li>模型决定调用某个工具，Client 把请求转发给 Server 的 <code>call_tool()</code></li><li>Server 执行工具逻辑，返回结果给 Client，Client 再把结果传给模型</li></ol><p><strong>记忆点：Host 管&quot;这个 Client 住在哪个应用里&quot;，Client 管&quot;怎么和 Server 对话&quot;，Server 管&quot;真正干活&quot;。</strong></p>"}]},{"name":"深化阶段·开发最小 MCP Server","questions":[{"qnum":1,"qtext":"FastMCP 的 `@mcp.tool()` 装饰器自动做了哪三件事？和 Day 23 手写 JSON Schema 定义工具相比省了哪些工作？","answerHtml":"<p><code>@mcp.tool()</code> 自动完成三件事：</p><ol><li><strong>从函数签名（参数名 + 类型提示）生成 JSON Schema</strong>：<code>city: str</code> → <code>{&quot;type&quot;: &quot;string&quot;}</code>，<code>amount: int</code> → <code>{&quot;type&quot;: &quot;integer&quot;}</code>，无需手写</li><li><strong>从 docstring 读取工具描述</strong>：docstring 第一行成为工具的 <code>description</code>，模型会读这里来判断何时调用——docstring 质量直接决定工具触发准确率</li><li><strong>注册到 Server 实例</strong>：装饰的函数自动加入 <code>list_tools()</code> 的响应列表，以及 <code>call_tool()</code> 的分发表</li></ol><p>跟 Day 23 手写 JSON Schema 比一比就能看出省了多少事。工具名这块，Day 23 得自己手写 <code>&quot;name&quot;: &quot;get_weather&quot;</code>，FastMCP 直接从函数名读取，不用你操心。参数 Schema 这块，Day 23 每个参数的 <code>type</code>、<code>description</code>、<code>required</code> 都得一个个手写，FastMCP 直接从类型提示自动生成。工具描述这块，Day 23 要手写 <code>&quot;description&quot;: &quot;...&quot;</code>，FastMCP 从函数的 docstring 里自动读取。注册到 Server 这块，Day 23 得手动拼一个 <code>tools=[]</code> 列表，FastMCP 一个 <code>@mcp.tool()</code> 装饰器就自动把注册的事办完了。</p><p>省的工作：参数 JSON Schema 全部手写（每个参数 3-5 行）→ 只写类型提示（1 个词）。代码量从每个工具 ~15 行缩减到 ~3 行定义代码。</p>"},{"qnum":2,"qtext":"MCP Server 的 stdio transport 是什么？Client 和 Server 的进程关系是怎样的？","answerHtml":"<p>stdio transport 是 MCP 默认的通信方式：Client 把 Server 作为<strong>子进程</strong>启动，两者通过操作系统的标准 I/O 管道通信——Client 写入 Server 的 <strong>stdin</strong> 发送请求，读取 Server 的 <strong>stdout</strong> 接收响应，格式是 JSON-RPC 2.0。</p><p>进程关系：</p><pre><code>MCP Client（Claude Code 进程）\n    │ fork/spawn\n    ▼\nMCP Server（python weather_mcp_server.py 进程）\n    ├─ stdin ◄── Client 写入（请求：list_tools / call_tool）\n    └─ stdout ──► Client 读取（响应：工具列表 / 调用结果）</code></pre><p><strong>生命周期由 Client 管理</strong>：Client 启动时 spawn Server 子进程，Client 退出时 kill Server 子进程。Server 不需要常驻后台，不需要端口，不需要任何运维操作。</p><p>为什么默认用 stdio 而不是 HTTP：本地工具（文件系统、数据库、本地 API）用 stdio 更简单——零配置、无端口、天然进程隔离、无网络攻击面。需要把工具部署为团队共享远程服务时，才切换到 HTTP/SSE transport（<code>mcp.run(transport=&quot;sse&quot;)</code>）。</p>"},{"qnum":3,"qtext":"MCP 工具的返回值为什么应该是纯字符串而不是 dict 或 JSON 对象？","answerHtml":"<p>MCP Client 收到 <code>call_tool</code> 的响应后，把结果包装成 <code>ToolMessage</code> 的 <code>content</code> 字段传回给模型。模型的输入是自然语言上下文，而不是代码执行环境——它无法&quot;解构&quot;一个 dict，只能&quot;阅读&quot;文本。</p><p>具体原因有三个。第一是模型读自然语言更可靠，比如 <code>&quot;上海：多云，26°C，湿度 72%&quot;</code> 这样的句子，比 <code>{&quot;city&quot;: &quot;上海&quot;, &quot;temp&quot;: 26}</code> 这样的结构更不容易被模型误解；第二是避免序列化歧义，dict 在不同 Client 实现里序列化的方式可能不一样，而纯字符串不存在这个问题；第三是便于最终展示，工具结果通常会直接进入模型的回答，字符串格式能让回答读起来更自然。</p><p>例外：如果工具结果需要被<strong>下游代码</strong>处理（而不是仅供模型阅读），可以返回 JSON 字符串（<code>json.dumps(result)</code>），但要在 docstring 里说明格式——让模型知道它收到的是 JSON，可以提取字段。</p>"},{"qnum":4,"qtext":"`.mcp.json` 的 `command` + `args` 配置具体做了什么？Server 的启动和关闭由谁管理？","answerHtml":"<p><code>.mcp.json</code> 的配置：</p><pre><code class=\"language-json\">{\n  &quot;mcpServers&quot;: {\n    &quot;weather-tools&quot;: {\n      &quot;command&quot;: &quot;python&quot;,\n      &quot;args&quot;: [&quot;tools/weather_mcp_server.py&quot;]\n    }\n  }\n}</code></pre><p>这是 Client 启动 Server 子进程的&quot;配方&quot;——等价于 Client 在内部执行：</p><pre><code class=\"language-bash\">python tools/weather_mcp_server.py</code></pre><p>并把这个进程的 stdin/stdout 管道接给自己。</p><p><strong>启动和关闭的完整生命周期</strong>：</p><ol><li>Claude Code 启动时，读取 <code>.mcp.json</code>，对每个 <code>mcpServers</code> 条目执行 <code>command + args</code> 启动子进程</li><li>通过 stdin 发送 <code>initialize</code> 握手请求，完成协议协商</li><li>发送 <code>list_tools</code> 拿到工具列表，注册给 Claude</li><li>用户对话触发工具调用时，发送 <code>call_tool</code> 请求，等待 stdout 响应</li><li>Claude Code 退出时，向子进程发送终止信号，Server 进程随之退出</li></ol><p><strong>Server 的启停由 Client（Claude Code）全权管理</strong>，开发者不需要手动启动或关闭 Server——配置好 <code>.mcp.json</code> 之后，Client 负责其余一切。</p>"},{"qnum":5,"qtext":"从\"手写 `@tool` 函数（Day 23）\"到\"MCP Server 工具（Day 39）\"，架构上的核心变化是什么？什么场景下值得做这个升级？","answerHtml":"<p><strong>架构上最核心的变化，是工具从&quot;跟应用挤在同一个进程里的函数&quot;变成了&quot;独立的进程服务&quot;。</strong>具体拆开看：运行位置上，Day 23 的工具和 AI 应用是同一个 Python 进程，Day 39 的 MCP Server 是完全独立的进程，靠 stdio 或者 HTTP 通信。语言上，Day 23 的工具必须用 Python 写，得跟应用同语言，Day 39 就没这个限制了，只要实现了 MCP 协议，什么语言写都行。复用性上，Day 23 的工具代码是绑死在当前这个应用里的，Day 39 里随便哪个 MCP Client 都能连上同一个 Server 复用它。进程隔离上，Day 23 工具一崩溃，应用跟着就崩了，Day 39 工具进程崩了，Client 进程完全不受影响。权限控制上，Day 23 工具和应用共享同一套进程权限，Day 39 里 Server 进程的权限是可以单独设置的。</p><p><strong>值得做这个升级的场景</strong>：</p><ul><li>同一套工具需要被多个 AI 应用（Claude Code、自写 Agent、团队其他项目）复用</li><li>工具用非 Python 语言写更合适（如需要 Go 的高并发、Rust 的安全性）</li><li>需要把工具隔离到更严格的权限沙箱（如只允许 Server 进程访问特定目录）</li><li>工具需要对外（跨机器）提供服务</li></ul><p><strong>不值得升级的场景</strong>：</p><ul><li>工具只被一个 AI 应用用，且是 Python 实现——手写 <code>@tool</code> 更简单，无需额外进程</li><li>原型阶段、快速验证——MCP Server 多了配置和进程管理的心智负担</li></ul>"},{"qnum":6,"qtext":"FastMCP 和 MCP 低级 Server API 有什么区别？各自适合什么场景？","answerHtml":"<p>FastMCP 是高级 API，入口是 <code>from mcp.server.fastmcp import FastMCP</code>，特点是装饰器风格、自动从类型提示生成 JSON Schema、代码极简，适合日常开发和快速验证；低级 Server API 是底层接口，入口是 <code>from mcp.server import Server</code>，需要手动实现 <code>list_tools</code> / <code>call_tool</code> handler，换来完全的控制权，适合需要动态生成工具列表、或者工具元数据要高度定制的场景。</p><p>FastMCP 的 <code>@mcp.tool()</code> 装饰器做的事情和 LangChain 的 <code>@tool</code> 类似：读取函数签名（参数名 + 类型提示）和 docstring，自动生成 MCP 工具描述。天气/汇率工具用 FastMCP 实现，对已经熟悉 Day 23–25 的人几乎没有学习成本。</p><p>选型标准：工具列表固定、追求开发效率 → FastMCP；需要根据运行时状态动态决定暴露哪些工具（如按用户权限过滤工具列表）→ 才需要低级 Server API 手动实现 handler。</p><p><strong>记忆点：FastMCP 是&quot;够用就好&quot;的默认选择，低级 API 是&quot;需要完全控制&quot;时的退路。</strong></p>"},{"qnum":7,"qtext":"不依赖 Claude Code，如何用 MCP Client SDK 直接验证 Server 的 list_tools 和 call_tool 两个接口？完整调用链路是什么？","answerHtml":"<pre><code class=\"language-python\">import asyncio\nfrom mcp.client.session import ClientSession\nfrom mcp.client.stdio import StdioServerParameters, stdio_client\n\n\nasync def test():\n    server_params = StdioServerParameters(\n        command=&quot;python&quot;,\n        args=[&quot;tools/weather_mcp_server.py&quot;],\n    )\n    async with stdio_client(server_params) as (read, write):\n        async with ClientSession(read, write) as session:\n            await session.initialize()\n            tools = await session.list_tools()\n            for tool in tools.tools:\n                print(f&quot;  {tool.name}: {tool.description}&quot;)\n            result = await session.call_tool(&quot;get_weather&quot;, {&quot;city&quot;: &quot;上海&quot;})\n            print(result.content[0].text)\n\n\nasyncio.run(test())</code></pre><p>完整调用链路：</p><ol><li><code>StdioServerParameters</code> 指定要启动的 Server 命令和参数</li><li><code>stdio_client()</code> 启动 Server 子进程，建立 stdin/stdout 管道，得到 <code>read</code>/<code>write</code> 流</li><li><code>ClientSession</code> 包装这对流，<code>session.initialize()</code> 完成协议握手</li><li><code>session.list_tools()</code> 拿到工具列表（含 <code>inputSchema</code>）</li><li><code>session.call_tool(工具名, 参数字典)</code> 执行调用，结果在 <code>result.content[0].text</code> 里</li></ol><p>这段测试代码不依赖任何 AI 应用或模型，直接在协议层验证 Server 行为是否正确——适合 Server 开发阶段快速调试，不用每次改代码都重启 Claude Code 验证。</p><p><strong>记忆点：这就是 Day 38 流程图里&quot;Client 调用 Server&quot;的完整过程在代码里的具体落地：<code>initialize()</code> 握手 → <code>list_tools()</code> 拿列表 → <code>call_tool()</code> 执行。</strong></p>"}]},{"name":"深化阶段·跨对话长期记忆","questions":[{"qnum":1,"qtext":"LLM 应用的记忆为什么要分\"短期\"和\"长期\"两层？各自存在哪里、生命周期是什么？","answerHtml":"<p><strong>短期记忆（工作记忆）</strong>：当前会话的 <code>messages</code> 列表，存在 Python 进程内存里，程序重启即消失。生命周期 = 当前会话。容量受上下文窗口限制。</p><p><strong>长期记忆（持久记忆）</strong>：用户偏好、事实、历史摘要，持久化到文件 / 数据库 / 向量库，程序重启后仍然存在。生命周期 = 持久（按需清理）。</p><p><strong>必须分层的原因</strong>有四点：存储位置不同——短期记忆放在进程内存里，快但易失，长期记忆放在磁盘/数据库里，慢但持久；生命周期不同——短期记忆随会话结束就消失，长期记忆跨会话保留；注入方式不同——短期记忆直接追加到 messages 传给模型，长期记忆需要精选后注入 System Prompt；此外还有上下文窗口的限制——不能把所有历史消息全塞进去，长期记忆必须经过压缩和筛选才能注入。</p><p>不分层的后果：要么每次会话让用户重复告知偏好（差体验），要么把所有历史塞进上下文（Token 爆炸、成本失控）。</p>"},{"qnum":2,"qtext":"让模型主动写入记忆有哪两种方式？各自的可靠性差异是什么？","answerHtml":"<p>第一种方式是记忆工具加 Prompt 引导，原理是让模型自己判断什么时候该调用 <code>remember_preference(key, value)</code> 这个工具，代码写出来就是 <code>@tool def remember_preference(key, value)</code> 这样一个函数。这种方式可靠性只能算中等，因为它完全依赖模型判断得准不准，模型偶尔意识不到&quot;这个信息该记下来&quot;，就会漏记。第二种方式是用 mem0 自动提取，原理不一样，是每轮对话结束后调 <code>m.add(对话文本)</code>，让另一个 LLM 从对话里提取关键信息，自动向量化写进去，代码就是 <code>memory.add(conversation, user_id=uid)</code> 这一行。这种方式可靠性明显更高，因为它是每轮强制提取，不用等模型自己主动判断该不该记。</p><p><strong>记忆工具方式的注意点</strong>：</p><ul><li>System Prompt 必须明确告诉模型&quot;何时该记&quot;（如&quot;当用户提到偏好时立即调用&quot;）</li><li>不能依赖用户主动要求模型记住——模型要主动判断</li><li>工具描述（docstring）要写清楚触发时机，这直接影响触发准确率</li></ul><p><strong>mem0 方式的代价</strong>：每轮对话多一次 LLM 调用（提取记忆），增加延迟和 Token 消耗。</p>"},{"qnum":3,"qtext":"把记忆注入 System Prompt 时，如何避免记忆条目过多导致上下文超限？","answerHtml":"<p>三个控制手段：</p><p><strong>1. KV 存储的天然去重</strong>：dict 赋值覆盖，同一个 key 只保留最新值。&quot;常用城市&quot;从&quot;北京&quot;改成&quot;上海&quot;时，只有一条记忆条目，不会累积。</p><p><strong>2. 摘要压缩</strong>：对历史对话摘要（情节记忆），定期用 LLM 把多条旧摘要合并成一条。</p><pre><code class=\"language-python\">if len(summaries) &gt; MAX_ENTRIES:\n    old = &quot;\\n&quot;.join(summaries[:N])\n    compressed = llm.summarize(old)   # 一次 LLM 调用压缩 N 条 → 1 条\n    summaries = [compressed] + summaries[N:]</code></pre><p><strong>3. 语义检索（按需注入）</strong>：对于向量化记忆，不全量注入，而是根据当前用户问题检索 top-k 条最相关的记忆注入 System Prompt。&quot;用户问天气&quot;→ 只注入&quot;常用城市：北京&quot;，不注入&quot;喜欢拿铁&quot;。</p><p>对于&quot;用户偏好&quot;这个典型场景：KV 存储的天然去重已足够，通常不需要摘要压缩或语义检索（偏好条数少，全量注入也在几十个 Token 内）。</p>"},{"qnum":4,"qtext":"KV 文件存储和向量存储记忆各自适合什么场景？判断标准是什么？","answerHtml":"<p>KV 文件（JSON）适合存结构化偏好，比如城市、货币、姓名，检索方式是按 key 精确查找，实现成本极低，用标准库 json + pathlib 就够，注入方式是条数少时全量注入，适用条数是几条到几十条。向量存储适合存自由文本，也就是用户任意说过的话，检索方式是语义相似度 top-k，实现成本较高，需要 Embedding 模型加向量库（Chroma/FAISS），注入方式是按相关性 top-k 注入，适用条数是几十条到几千条。</p><p><strong>判断标准</strong>：</p><ul><li>记忆条目有明确的 key（&quot;常用城市&quot;、&quot;用户名&quot;）→ KV 存储</li><li>记忆条目是自由文本、需要&quot;找相关&quot;而不是&quot;按名查找&quot;→ 向量存储</li><li>记忆条数 &lt; 20 条 → KV 存储，全量注入成本可控</li><li>记忆条数 &gt; 50 条 → 向量存储 + 语义检索</li></ul><p>实际项目里两种方式常常并存：结构化偏好用 KV，历史摘要用向量存储。</p>"},{"qnum":5,"qtext":"mem0 的 `add` 和手写 `remember_preference` 工具有什么本质区别？各自有什么优缺点？","answerHtml":"<p>这两者本质区别可以从好几个点来看。触发机制不一样：手写工具是靠模型自己判断该记了才主动调用，mem0 是每轮对话结束后强制执行，不用模型做判断。信息提取方式也不一样：手写工具是模型在调用参数里自己填好 key 和 value，mem0 是另外起一个 LLM 从整段对话里自动提取关键信息。存储结构上，手写工具用的是开发者自己定义的 KV dict，很简单直接，mem0 用的是它自己管理的一套向量数据库。检索方式上，手写工具是按 key 精确查找，mem0 做的是语义检索、返回 top-k 条最相关的。额外的 LLM 调用上，手写工具没有多余开销，记忆写入就是工具逻辑本身的一部分，mem0 每次 <code>add</code> 都要多调一次 LLM 去做提取，这是要花钱花时间的。依赖上也不一样，手写工具零外部依赖，mem0 得 <code>pip install mem0ai</code>，还得配一个向量库。</p><p><strong>手写工具的优点</strong>：实现简单，无额外依赖，延迟低（记忆写入无需 LLM 调用），开发者完全掌控存储结构。</p><p><strong>手写工具的缺点</strong>：依赖模型主动判断&quot;该不该记&quot;，偶发遗漏；只能记结构化 key/value，不适合自由文本。</p><p><strong>mem0 的优点</strong>：自动提取，可靠性高；支持自由文本、多用户隔离；内置语义检索。</p><p><strong>mem0 的缺点</strong>：每次 <code>add</code> 多一次 LLM 调用（延迟 + Token 成本）；引入外部依赖；黑盒提取有时不准确。</p><p>判断：原型或结构化偏好 → 手写工具；生产环境、自由文本记忆、多用户 → mem0 或类似方案。</p>"},{"qnum":6,"qtext":"笔记划分的三层记忆结构（工作记忆/情节记忆/语义记忆）各自的存储位置、生命周期、容量约束是什么？今天的实践聚焦哪一层？","answerHtml":"<p>这三层记忆可以逐层来说。第一层是工作记忆，存的是当前会话的 messages 列表，就放在 Python 进程的内存里，生命周期很短，会话一结束就没了，容量受上下文窗口限制，一般是 8k 到 128k tokens 这个量级。第二层是情节记忆，存的是历史会话的摘要或者关键事件，这一层是要持久化的，放在文件或者数据库里，生命周期比较长，可以长期保留、按需定期清理，容量上通常会先压缩再注入 System Prompt，控制在一两千 tokens 以内。第三层是语义记忆，存的是用户偏好、常用事实这些相对稳定的信息，同样要持久化，放在 KV 文件或者向量数据库里，生命周期是永久保留、可以按用户随时更新，容量上不会全量注入，而是按需检索出相关的那部分。</p><p>今天的实践聚焦 <strong>Layer 3（语义记忆）</strong>：用户偏好的持久化，是三层里最容易实现、收益最直观的部分。</p><p><strong>记忆点：三层的核心区别是&quot;活多久、放哪儿、能装多少&quot;——工作记忆易失、情节记忆要压缩、语义记忆按需检索。</strong></p>"},{"qnum":7,"qtext":"LRU 淘汰策略具体怎么实现？它和 KV 去重、摘要压缩相比解决的是哪个问题？为什么\"用户偏好\"这个场景通常不需要 LRU？","answerHtml":"<pre><code class=\"language-python\">import time\n\ndef set_preference_with_lru(key: str, value: str, max_entries: int = 50) -&gt; None:\n    memories = load_memory()  # 返回 {key: {&quot;value&quot;: v, &quot;last_used&quot;: ts}}\n    memories[key] = {&quot;value&quot;: value, &quot;last_used&quot;: time.time()}\n\n    if len(memories) &gt; max_entries:\n        # 按 last_used 升序排，淘汰最旧的\n        oldest_key = min(memories, key=lambda k: memories[k][&quot;last_used&quot;])\n        del memories[oldest_key]\n\n    save_memory(memories)</code></pre><p>三种增长控制策略解决的问题并不相同。第一种是 KV 去重，也就是靠 dict 赋值覆盖，解决的是同一个 key 被多次写入时不产生重复条目的问题；第二种是摘要压缩，解决的是内容持续累积——比如历史对话摘要——时，把旧内容合并变薄的问题；第三种是 LRU 淘汰，解决的是条目总数超过硬性上限时，按&quot;最久未访问&quot;原则强制腾出空间的问题。</p><p>&quot;用户偏好&quot;场景通常不需要 LRU：偏好条目数量天然有限（常用城市、货币对、用户名等，通常几条到几十条），远达不到需要淘汰的规模；LRU 主要用于条目数可能无限增长的场景（如每条对话都可能产生一条独立记忆的向量存储）。</p><p><strong>记忆点：去重防重复、压缩防膨胀、LRU 防超限——三个策略针对的是记忆增长的三个不同阶段。</strong></p>"}]},{"name":"深化阶段·多 Agent 协作模式","questions":[{"qnum":1,"qtext":"Planner / Executor / Critic 三角色的职责边界各是什么？为什么不让一个 Agent 完成所有步骤？","answerHtml":"<p>三个角色的输入输出和职责边界分别是：Planner 接收用户的复合问题，输出 SubTask[]，职责是理解意图、拆分子任务，但它不调用任何工具，也不验证结果对不对；Executor 接收 SubTask，输出 TaskResult，职责是按指定的工具和参数去执行，但它不判断执行结果是否完整回答了用户的问题；Critic 接收原始问题和全部 TaskResult[]，输出 CriticVerdict，职责是判断结果是否完整，但它不会自己执行工具，也不会修改任何结果。</p><p><strong>为什么不让一个 Agent 完成所有步骤</strong>：不让一个 Agent 完成所有步骤，是因为单 Agent 在三个方面表现不好。第一是认知负担，单个 Agent 要同时理解意图、决定工具顺序、处理错误、验证结果完整性，复杂任务很容易漏步；第二是容错能力，执行出错时没有独立的检查环节，错误会直接传到用户那里；第三是可替换性，拆任务和执行耦合在一起，想换一个更强的执行模型就得整体替换，没法单独升级。</p><p>分角色的核心价值：每个角色可以独立调优（换 Prompt、换模型），职责清晰后 Bug 更容易定位（是 Planner 拆错了还是 Executor 执行错了）。</p>"},{"qnum":2,"qtext":"Agent 间的消息传递协议需要包含哪些字段？如何判断\"这一步完成了\"？","answerHtml":"<p><strong>SubTask（Planner → Executor）</strong>：先看 SubTask，这是 Planner 传给 Executor 的消息，包含五个字段。第一个是 <code>task_id</code>，类型是 str，作用是唯一标识，方便 TaskResult 回传时做关联；第二个是 <code>description</code>，类型是 str，是任务描述，供 Executor 理解上下文；第三个是 <code>tool_name</code>，类型是 str，是要调用的工具名；第四个是 <code>tool_args</code>，类型是 dict，是工具参数；第五个是 <code>depends_on</code>，类型是 list[str]，存的是前置任务 ID，执行前要检查这些前置任务是否都已完成。</p><p><strong>TaskResult（Executor → Critic）</strong>：再看 TaskResult，这是 Executor 传给 Critic 的消息，包含四个字段。第一个是 <code>task_id</code>，类型是 str，对应的是 SubTask 的 ID；第二个是 <code>status</code>，取值是 &quot;completed&quot; 或者 &quot;failed&quot;，是判断&quot;这一步完成了没有&quot;的核心字段；第三个是 <code>result</code>，类型是 str，是成功时的结果文本；第四个是 <code>error</code>，类型是 str，是失败时的错误原因。</p><p><strong>判断&quot;这一步完成了&quot;</strong>：<code>result.status == &quot;completed&quot;</code>。依赖关系用 <code>depends_on</code> 实现——Executor 执行每个子任务前检查 <code>depends_on</code> 里的所有 ID 是否都已 completed，未满足则标记 failed。</p>"},{"qnum":3,"qtext":"Critic Agent 的判断标准是什么？它的输出结构应该包含哪些字段？","answerHtml":"<p><strong>判断标准</strong>：对照用户的<strong>原始问题意图</strong>，检查每个子任务的结果：</p><ol><li>是否所有子任务都 completed（没有 failed 的关键步骤）</li><li>结果内容是否实质上回答了用户的需求（不只是&quot;工具没报错&quot;，而是&quot;用户要知道的信息都有了&quot;）</li><li>结果之间是否存在矛盾或明显异常</li></ol><p><strong>CriticVerdict 输出结构</strong>：</p><pre><code class=\"language-python\">{\n  &quot;passed&quot;: bool,           # 整体是否通过\n  &quot;missing&quot;: list[str],     # 未被回答的需求点（passed=false 时填写）\n  &quot;reason&quot;: str,            # 整体判断理由（简洁，1-2句）\n  &quot;retry_hint&quot;: str         # 给 Planner 的重试建议（passed=false 时填写）\n}</code></pre><p><strong>Critic 不应该做的事</strong>：</p><ul><li>不重新执行工具（只判断，不操作）</li><li>不自行填补缺失信息（明确告诉 Planner 缺什么）</li><li>不只检查 status，要检查 result 内容（status=completed 但 result 是空字符串也是失败）</li></ul>"},{"qnum":4,"qtext":"A2A 协议的 Task 状态机、流式 Push、Agent Card 分别解决了同进程 Demo 的哪个工程短板？","answerHtml":"<p>同进程 Demo 其实有三个工程短板，A2A 协议正好一一对应解决。先说第一个，任务状态没有持久化——之前状态就放在内存的 results 列表里，进程一崩溃就全没了；A2A 用 Task 状态机来解决这个问题，从 submitted 到 working 再到 completed 或 failed，Task 对象存在 Executor 服务的存储里，就算进程崩了也能查得到，Planner 随时调 GET /tasks/{id} 就知道进度。第二个短板是同步阻塞，原来 Executor 得把所有子任务都跑完，Planner 才能往下走；A2A 引入了 Streaming Push，也就是用 SSE 或 WebSocket，让 Executor 每完成一个阶段就主动推状态给 Planner，这样 Planner 可以边等边干别的，比如先去 Critic 已经跑完的那部分。第三个短板是工具表写死了，原来的 TOOL_REGISTRY 是硬编码的，新增一个 Executor 就得改代码；这个问题靠 Agent Card 解决，就是那个 <code>/.well-known/agent.json</code>，每个 Executor 服务自己声明能处理什么类型的任务，Planner 就能动态发现有哪些 Agent 可用，不用再硬编码了。</p>"},{"qnum":5,"qtext":"MCP / A2A / Function Calling 三层协议各解决什么问题？在一个完整多 Agent 系统里三者如何配合？","answerHtml":"<p>三层协议解决的是三个不同层次的问题：Function Calling 解决的是模型如何表达&quot;我要调用哪个工具、传什么参数&quot;，跨越的是模型内部——模型和工具调用意图之间的边界；MCP 解决的是工具服务如何标准化暴露、被多个 AI 应用发现和复用，跨越的是 AI 应用（Client）和工具服务器（Server）之间的边界；A2A 解决的是 Agent 如何向另一个 Agent 委派任务、推送状态、声明能力，跨越的是 Agent 与 Agent 之间的边界。</p><p><strong>三者在完整多 Agent 系统里的配合</strong>：</p><pre><code>Planner Agent ──A2A: 委派 SubTask──► Executor Agent\n     │                                     │\n  MCP: 工具连接                         MCP: 工具连接\n     ▼                                     ▼\n  记忆工具 MCP Server              天气/汇率 MCP Server\n\n模型层：Function Calling（决定何时调用哪个工具）\nMCP 层：工具服务的标准化连接（解决 &quot;用什么工具&quot;）\nA2A 层：Agent 间任务委派和状态同步（解决 &quot;谁做这件事&quot;）</code></pre><p>三者不是替代关系：</p><ul><li>没有 Function Calling，模型无法表达工具调用意图</li><li>没有 MCP，工具和 Agent 代码耦合，无法复用</li><li>没有 A2A，多个 Agent 只能同进程调函数，无法独立部署和扩容</li></ul>"},{"qnum":
