uot;、&quot;查进度&quot;、&quot;收结果&quot;。</p><p><strong>记忆点：遇到&quot;Agent 怎么用工具&quot;想到 MCP，遇到&quot;Agent 怎么和另一个 Agent 协作&quot;想到 A2A。</strong></p>"},{"qnum":6,"qtext":"MCP 为什么能在 2024 年底发布后迅速成为 2026 年的事实标准？和早期 ChatGPT Plugin 相比，MCP 成功的关键设计差异是什么？","answerHtml":"<p>四个原因：</p><ol><li><strong>开放协议，厂商中立</strong>：任何 AI 应用都可以实现 MCP Client，任何工具服务都可以实现 MCP Server，不被任何厂商绑定</li><li><strong>生态快速积累</strong>：GitHub、Slack、Google Drive、数据库、浏览器等已经有大量开源 MCP Server 实现，接入后立刻可用</li><li><strong>工具复用解决了真实痛点</strong>：提供了&quot;写一次工具服务器、全公司 AI 应用共用&quot;的标准方案</li><li><strong>被主流 AI 应用和框架采纳</strong>：Claude Code、Claude Desktop、Cursor、LangChain、LangGraph 都原生支持</li></ol><p>与 ChatGPT Plugin 的关键差异：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>ChatGPT Plugin（失败的先例）</th><th>MCP</th></tr></thead><tbody><tr><td><strong>开放性</strong></td><td>闭源，绑定 ChatGPT</td><td>开放协议，厂商中立</td></tr><tr><td><strong>复杂度</strong></td><td>工具定义复杂</td><td>轻量</td></tr><tr><td><strong>跨应用复用</strong></td><td>没有解决</td><td>从设计上就是开放的、轻量的、跨语言的</td></tr></tbody></table></div><p><strong>记忆点：MCP 成功的关键不是技术多先进，而是&quot;开放 + 轻量 + 跨语言&quot;从设计源头解决了 ChatGPT Plugin 没解决的&quot;跨 AI 应用复用&quot;问题。</strong></p>"},{"qnum":7,"qtext":"MCP 架构里的 Host 角色是什么？和 Client、Server 有什么区别？从 Client 启动到执行一次工具调用，完整交互流程有哪几步？","answerHtml":"<p>角色划分：</p><div class=\"table-wrap\"><table><thead><tr><th>角色</th><th>职责</th><th>例子</th></tr></thead><tbody><tr><td><strong>MCP Server</strong></td><td>暴露 Tools / Resources / Prompts，响应 Client 的请求</td><td>一个运行着&quot;数据库查询工具&quot;的独立进程</td></tr><tr><td><strong>MCP Client</strong></td><td>发现并调用 Server 的能力，把工具结果传给模型</td><td>Claude Code、你自己写的 AI 应用、LangGraph 图</td></tr><tr><td><strong>Host（可选）</strong></td><td>管理 Client 的生命周期，处理用户界面</td><td>VS Code 插件、桌面应用</td></tr></tbody></table></div><p>Host 不直接和 Server 交互，它是 Client 的&quot;容器&quot;——比如 VS Code 插件（Host）里跑着一个 MCP Client，真正连接 Server 的是 Client 这一层。</p><p>完整交互流程（四步）：</p><ol><li>Client 启动时调用 Server 的 <code>list_tools()</code> 拿到工具列表</li><li>Client 把工具列表转成 Function Calling 格式注册给模型</li><li>模型决定调用某个工具，Client 把请求转发给 Server 的 <code>call_tool()</code></li><li>Server 执行工具逻辑，返回结果给 Client，Client 再把结果传给模型</li></ol><p><strong>记忆点：Host 管&quot;这个 Client 住在哪个应用里&quot;，Client 管&quot;怎么和 Server 对话&quot;，Server 管&quot;真正干活&quot;。</strong></p>"}]},{"name":"深化阶段·开发最小 MCP Server","questions":[{"qnum":1,"qtext":"FastMCP 的 `@mcp.tool()` 装饰器自动做了哪三件事？和 Day 23 手写 JSON Schema 定义工具相比省了哪些工作？","answerHtml":"<p><code>@mcp.tool()</code> 自动完成三件事：</p><ol><li><strong>从函数签名（参数名 + 类型提示）生成 JSON Schema</strong>：<code>city: str</code> → <code>{&quot;type&quot;: &quot;string&quot;}</code>，<code>amount: int</code> → <code>{&quot;type&quot;: &quot;integer&quot;}</code>，无需手写</li><li><strong>从 docstring 读取工具描述</strong>：docstring 第一行成为工具的 <code>description</code>，模型会读这里来判断何时调用——docstring 质量直接决定工具触发准确率</li><li><strong>注册到 Server 实例</strong>：装饰的函数自动加入 <code>list_tools()</code> 的响应列表，以及 <code>call_tool()</code> 的分发表</li></ol><p>和 Day 23 手写 JSON Schema 的对比：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>Day 23 手写</th><th>FastMCP 装饰器</th></tr></thead><tbody><tr><td>工具名</td><td>手写 <code>&quot;name&quot;: &quot;get_weather&quot;</code></td><td>自动从函数名读取</td></tr><tr><td>参数 Schema</td><td>手写每个参数的 <code>type</code>、<code>description</code>、<code>required</code></td><td>从类型提示自动生成</td></tr><tr><td>工具描述</td><td>手写 <code>&quot;description&quot;: &quot;...&quot;</code></td><td>从 docstring 自动读取</td></tr><tr><td>注册到 Server</td><td>手动构建 <code>tools=[]</code> 列表</td><td><code>@mcp.tool()</code> 自动注册</td></tr></tbody></table></div><p>省的工作：参数 JSON Schema 全部手写（每个参数 3-5 行）→ 只写类型提示（1 个词）。代码量从每个工具 ~15 行缩减到 ~3 行定义代码。</p>"},{"qnum":2,"qtext":"MCP Server 的 stdio transport 是什么？Client 和 Server 的进程关系是怎样的？","answerHtml":"<p>stdio transport 是 MCP 默认的通信方式：Client 把 Server 作为<strong>子进程</strong>启动，两者通过操作系统的标准 I/O 管道通信——Client 写入 Server 的 <strong>stdin</strong> 发送请求，读取 Server 的 <strong>stdout</strong> 接收响应，格式是 JSON-RPC 2.0。</p><p>进程关系：</p><pre><code>MCP Client（Claude Code 进程）\n    │ fork/spawn\n    ▼\nMCP Server（python weather_mcp_server.py 进程）\n    ├─ stdin ◄── Client 写入（请求：list_tools / call_tool）\n    └─ stdout ──► Client 读取（响应：工具列表 / 调用结果）</code></pre><p><strong>生命周期由 Client 管理</strong>：Client 启动时 spawn Server 子进程，Client 退出时 kill Server 子进程。Server 不需要常驻后台，不需要端口，不需要任何运维操作。</p><p>为什么默认用 stdio 而不是 HTTP：本地工具（文件系统、数据库、本地 API）用 stdio 更简单——零配置、无端口、天然进程隔离、无网络攻击面。需要把工具部署为团队共享远程服务时，才切换到 HTTP/SSE transport（<code>mcp.run(transport=&quot;sse&quot;)</code>）。</p>"},{"qnum":3,"qtext":"MCP 工具的返回值为什么应该是纯字符串而不是 dict 或 JSON 对象？","answerHtml":"<p>MCP Client 收到 <code>call_tool</code> 的响应后，把结果包装成 <code>ToolMessage</code> 的 <code>content</code> 字段传回给模型。模型的输入是自然语言上下文，而不是代码执行环境——它无法&quot;解构&quot;一个 dict，只能&quot;阅读&quot;文本。</p><p>三个具体原因：</p><div class=\"table-wrap\"><table><thead><tr><th>原因</th><th>说明</th></tr></thead><tbody><tr><td><strong>模型读自然语言更可靠</strong></td><td><code>&quot;上海：多云，26°C，湿度 72%&quot;</code> 比 <code>{&quot;city&quot;: &quot;上海&quot;, &quot;temp&quot;: 26}</code> 更难被模型误解</td></tr><tr><td><strong>避免序列化歧义</strong></td><td>dict 在不同 Client 实现里序列化方式可能不同，纯字符串没有歧义</td></tr><tr><td><strong>用于最终展示</strong></td><td>工具结果通常直接进入模型的回答，字符串格式让回答更自然</td></tr></tbody></table></div><p>例外：如果工具结果需要被<strong>下游代码</strong>处理（而不是仅供模型阅读），可以返回 JSON 字符串（<code>json.dumps(result)</code>），但要在 docstring 里说明格式——让模型知道它收到的是 JSON，可以提取字段。</p>"},{"qnum":4,"qtext":"`.mcp.json` 的 `command` + `args` 配置具体做了什么？Server 的启动和关闭由谁管理？","answerHtml":"<p><code>.mcp.json</code> 的配置：</p><pre><code class=\"language-json\">{\n  &quot;mcpServers&quot;: {\n    &quot;weather-tools&quot;: {\n      &quot;command&quot;: &quot;python&quot;,\n      &quot;args&quot;: [&quot;tools/weather_mcp_server.py&quot;]\n    }\n  }\n}</code></pre><p>这是 Client 启动 Server 子进程的&quot;配方&quot;——等价于 Client 在内部执行：</p><pre><code class=\"language-bash\">python tools/weather_mcp_server.py</code></pre><p>并把这个进程的 stdin/stdout 管道接给自己。</p><p><strong>启动和关闭的完整生命周期</strong>：</p><ol><li>Claude Code 启动时，读取 <code>.mcp.json</code>，对每个 <code>mcpServers</code> 条目执行 <code>command + args</code> 启动子进程</li><li>通过 stdin 发送 <code>initialize</code> 握手请求，完成协议协商</li><li>发送 <code>list_tools</code> 拿到工具列表，注册给 Claude</li><li>用户对话触发工具调用时，发送 <code>call_tool</code> 请求，等待 stdout 响应</li><li>Claude Code 退出时，向子进程发送终止信号，Server 进程随之退出</li></ol><p><strong>Server 的启停由 Client（Claude Code）全权管理</strong>，开发者不需要手动启动或关闭 Server——配置好 <code>.mcp.json</code> 之后，Client 负责其余一切。</p>"},{"qnum":5,"qtext":"从\"手写 `@tool` 函数（Day 23）\"到\"MCP Server 工具（Day 39）\"，架构上的核心变化是什么？什么场景下值得做这个升级？","answerHtml":"<p><strong>架构上的核心变化</strong>：工具从&quot;和应用同进程的函数&quot;变成&quot;独立进程服务&quot;。</p><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>Day 23（手写 @tool）</th><th>Day 39（MCP Server）</th></tr></thead><tbody><tr><td>运行位置</td><td>和 AI 应用同一个 Python 进程</td><td>独立进程，通过 stdio / HTTP 通信</td></tr><tr><td>语言限制</td><td>工具必须是 Python（和应用同语言）</td><td>工具可以是任何语言（只要实现 MCP 协议）</td></tr><tr><td>复用性</td><td>工具代码绑定在当前应用里</td><td>任何 MCP Client 都可以连接同一个 Server</td></tr><tr><td>进程隔离</td><td>工具崩溃 = 应用崩溃</td><td>工具进程崩溃不影响 Client 进程</td></tr><tr><td>权限控制</td><td>工具和应用共享进程权限</td><td>Server 进程的权限可以独立设置</td></tr></tbody></table></div><p><strong>值得做这个升级的场景</strong>：</p><ul><li>同一套工具需要被多个 AI 应用（Claude Code、自写 Agent、团队其他项目）复用</li><li>工具用非 Python 语言写更合适（如需要 Go 的高并发、Rust 的安全性）</li><li>需要把工具隔离到更严格的权限沙箱（如只允许 Server 进程访问特定目录）</li><li>工具需要对外（跨机器）提供服务</li></ul><p><strong>不值得升级的场景</strong>：</p><ul><li>工具只被一个 AI 应用用，且是 Python 实现——手写 <code>@tool</code> 更简单，无需额外进程</li><li>原型阶段、快速验证——MCP Server 多了配置和进程管理的心智负担</li></ul>"},{"qnum":6,"qtext":"FastMCP 和 MCP 低级 Server API 有什么区别？各自适合什么场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>API</th><th>入口</th><th>特点</th><th>适用场景</th></tr></thead><tbody><tr><td><strong>FastMCP</strong>（高级）</td><td><code>from mcp.server.fastmcp import FastMCP</code></td><td>装饰器风格，自动从类型提示生成 JSON Schema，代码极简</td><td>日常开发、快速验证</td></tr><tr><td><strong>低级 Server</strong>（底层）</td><td><code>from mcp.server import Server</code></td><td>手动实现 <code>list_tools</code> / <code>call_tool</code> handler，完全控制</td><td>需要动态生成工具列表、工具元数据高度定制</td></tr></tbody></table></div><p>FastMCP 的 <code>@mcp.tool()</code> 装饰器做的事情和 LangChain 的 <code>@tool</code> 类似：读取函数签名（参数名 + 类型提示）和 docstring，自动生成 MCP 工具描述。天气/汇率工具用 FastMCP 实现，对已经熟悉 Day 23–25 的人几乎没有学习成本。</p><p>选型标准：工具列表固定、追求开发效率 → FastMCP；需要根据运行时状态动态决定暴露哪些工具（如按用户权限过滤工具列表）→ 才需要低级 Server API 手动实现 handler。</p><p><strong>记忆点：FastMCP 是&quot;够用就好&quot;的默认选择，低级 API 是&quot;需要完全控制&quot;时的退路。</strong></p>"},{"qnum":7,"qtext":"不依赖 Claude Code，如何用 MCP Client SDK 直接验证 Server 的 list_tools 和 call_tool 两个接口？完整调用链路是什么？","answerHtml":"<pre><code class=\"language-python\">import asyncio\nfrom mcp.client.session import ClientSession\nfrom mcp.client.stdio import StdioServerParameters, stdio_client\n\n\nasync def test():\n    server_params = StdioServerParameters(\n        command=&quot;python&quot;,\n        args=[&quot;tools/weather_mcp_server.py&quot;],\n    )\n    async with stdio_client(server_params) as (read, write):\n        async with ClientSession(read, write) as session:\n            await session.initialize()\n            tools = await session.list_tools()\n            for tool in tools.tools:\n                print(f&quot;  {tool.name}: {tool.description}&quot;)\n            result = await session.call_tool(&quot;get_weather&quot;, {&quot;city&quot;: &quot;上海&quot;})\n            print(result.content[0].text)\n\n\nasyncio.run(test())</code></pre><p>完整调用链路：</p><ol><li><code>StdioServerParameters</code> 指定要启动的 Server 命令和参数</li><li><code>stdio_client()</code> 启动 Server 子进程，建立 stdin/stdout 管道，得到 <code>read</code>/<code>write</code> 流</li><li><code>ClientSession</code> 包装这对流，<code>session.initialize()</code> 完成协议握手</li><li><code>session.list_tools()</code> 拿到工具列表（含 <code>inputSchema</code>）</li><li><code>session.call_tool(工具名, 参数字典)</code> 执行调用，结果在 <code>result.content[0].text</code> 里</li></ol><p>这段测试代码不依赖任何 AI 应用或模型，直接在协议层验证 Server 行为是否正确——适合 Server 开发阶段快速调试，不用每次改代码都重启 Claude Code 验证。</p><p>**记忆点：这就是 Day 38 流程图里&quot;Client 调用 Server&quot;的完整过程在代码里的具体落地：<code>initialize()</code> 握手 → <code>list_tools()</code> 拿列表 → <code>call_tool()</code> 执行。**</p>"}]},{"name":"深化阶段·跨对话长期记忆","questions":[{"qnum":1,"qtext":"LLM 应用的记忆为什么要分\"短期\"和\"长期\"两层？各自存在哪里、生命周期是什么？","answerHtml":"<p><strong>短期记忆（工作记忆）</strong>：当前会话的 <code>messages</code> 列表，存在 Python 进程内存里，程序重启即消失。生命周期 = 当前会话。容量受上下文窗口限制。</p><p><strong>长期记忆（持久记忆）</strong>：用户偏好、事实、历史摘要，持久化到文件 / 数据库 / 向量库，程序重启后仍然存在。生命周期 = 持久（按需清理）。</p><p><strong>必须分层的原因</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>原因</th><th>说明</th></tr></thead><tbody><tr><td><strong>存储位置不同</strong></td><td>短期：进程内存（快，但易失）；长期：磁盘/数据库（慢，但持久）</td></tr><tr><td><strong>生命周期不同</strong></td><td>短期：会话结束消失；长期：跨会话保留</td></tr><tr><td><strong>注入方式不同</strong></td><td>短期：直接追加到 messages 传给模型；长期：精选后注入 System Prompt</td></tr><tr><td><strong>上下文窗口限制</strong></td><td>不能把所有历史消息全塞进去，长期记忆需要压缩和筛选后再注入</td></tr></tbody></table></div><p>不分层的后果：要么每次会话让用户重复告知偏好（差体验），要么把所有历史塞进上下文（Token 爆炸、成本失控）。</p>"},{"qnum":2,"qtext":"让模型主动写入记忆有哪两种方式？各自的可靠性差异是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>方式</th><th>原理</th><th>可靠性</th><th>典型代码</th></tr></thead><tbody><tr><td><strong>记忆工具 + Prompt 引导</strong></td><td>模型判断何时调用 <code>remember_preference(key, value)</code> 工具</td><td>中等——依赖模型的判断准确性，偶发遗漏（模型没意识到该记）</td><td><code>@tool def remember_preference(key, value)</code></td></tr><tr><td><strong>mem0 自动提取</strong></td><td><code>m.add(对话文本)</code> 调用 LLM 从对话里提取关键信息，自动向量化写入</td><td>更高——每轮对话结束后强制提取，不依赖模型主动判断</td><td><code>memory.add(conversation, user_id=uid)</code></td></tr></tbody></table></div><p><strong>记忆工具方式的注意点</strong>：</p><ul><li>System Prompt 必须明确告诉模型&quot;何时该记&quot;（如&quot;当用户提到偏好时立即调用&quot;）</li><li>不能依赖用户主动要求模型记住——模型要主动判断</li><li>工具描述（docstring）要写清楚触发时机，这直接影响触发准确率</li></ul><p><strong>mem0 方式的代价</strong>：每轮对话多一次 LLM 调用（提取记忆），增加延迟和 Token 消耗。</p>"},{"qnum":3,"qtext":"把记忆注入 System Prompt 时，如何避免记忆条目过多导致上下文超限？","answerHtml":"<p>三个控制手段：</p><p><strong>1. KV 存储的天然去重</strong>：dict 赋值覆盖，同一个 key 只保留最新值。&quot;常用城市&quot;从&quot;北京&quot;改成&quot;上海&quot;时，只有一条记忆条目，不会累积。</p><p><strong>2. 摘要压缩</strong>：对历史对话摘要（情节记忆），定期用 LLM 把多条旧摘要合并成一条。</p><pre><code class=\"language-python\">if len(summaries) &gt; MAX_ENTRIES:\n    old = &quot;\\n&quot;.join(summaries[:N])\n    compressed = llm.summarize(old)   # 一次 LLM 调用压缩 N 条 → 1 条\n    summaries = [compressed] + summaries[N:]</code></pre><p><strong>3. 语义检索（按需注入）</strong>：对于向量化记忆，不全量注入，而是根据当前用户问题检索 top-k 条最相关的记忆注入 System Prompt。&quot;用户问天气&quot;→ 只注入&quot;常用城市：北京&quot;，不注入&quot;喜欢拿铁&quot;。</p><p>对于&quot;用户偏好&quot;这个典型场景：KV 存储的天然去重已足够，通常不需要摘要压缩或语义检索（偏好条数少，全量注入也在几十个 Token 内）。</p>"},{"qnum":4,"qtext":"KV 文件存储和向量存储记忆各自适合什么场景？判断标准是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>KV 文件（JSON）</th><th>向量存储</th></tr></thead><tbody><tr><td><strong>内容类型</strong></td><td>结构化偏好（城市/货币/姓名）</td><td>自由文本（任意说过的话）</td></tr><tr><td><strong>检索方式</strong></td><td>按 key 精确查找</td><td>语义相似度 top-k</td></tr><tr><td><strong>实现成本</strong></td><td>极低（标准库 json + pathlib）</td><td>需要 Embedding 模型 + 向量库（Chroma/FAISS）</td></tr><tr><td><strong>注入方式</strong></td><td>全量注入（条数少时可行）</td><td>按相关性 top-k 注入</td></tr><tr><td><strong>适用条数</strong></td><td>几条到几十条</td><td>几十条到几千条</td></tr></tbody></table></div><p><strong>判断标准</strong>：</p><ul><li>记忆条目有明确的 key（&quot;常用城市&quot;、&quot;用户名&quot;）→ KV 存储</li><li>记忆条目是自由文本、需要&quot;找相关&quot;而不是&quot;按名查找&quot;→ 向量存储</li><li>记忆条数 &lt; 20 条 → KV 存储，全量注入成本可控</li><li>记忆条数 &gt; 50 条 → 向量存储 + 语义检索</li></ul><p>实际项目里两种方式常常并存：结构化偏好用 KV，历史摘要用向量存储。</p>"},{"qnum":5,"qtext":"mem0 的 `add` 和手写 `remember_preference` 工具有什么本质区别？各自有什么优缺点？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>手写 <code>remember_preference</code> 工具</th><th>mem0 <code>m.add()</code></th></tr></thead><tbody><tr><td><strong>触发机制</strong></td><td>模型判断，主动调用工具</td><td>每轮对话结束后强制执行</td></tr><tr><td><strong>信息提取</strong></td><td>模型在工具调用参数里填写 key/value</td><td>另一个 LLM 从对话里自动提取关键信息</td></tr><tr><td><strong>存储结构</strong></td><td>开发者定义（KV dict）</td><td>向量数据库（mem0 管理）</td></tr><tr><td><strong>检索方式</strong></td><td>按 key 精确查找</td><td>语义检索 top-k</td></tr><tr><td><strong>额外 LLM 调用</strong></td><td>无（记忆写入在工具逻辑里）</td><td>有（每次 <code>add</code> 调用 LLM 提取）</td></tr><tr><td><strong>依赖</strong></td><td>无外部依赖</td><td><code>pip install mem0ai</code> + 向量库</td></tr></tbody></table></div><p><strong>手写工具的优点</strong>：实现简单，无额外依赖，延迟低（记忆写入无需 LLM 调用），开发者完全掌控存储结构。</p><p><strong>手写工具的缺点</strong>：依赖模型主动判断&quot;该不该记&quot;，偶发遗漏；只能记结构化 key/value，不适合自由文本。</p><p><strong>mem0 的优点</strong>：自动提取，可靠性高；支持自由文本、多用户隔离；内置语义检索。</p><p><strong>mem0 的缺点</strong>：每次 <code>add</code> 多一次 LLM 调用（延迟 + Token 成本）；引入外部依赖；黑盒提取有时不准确。</p><p>判断：原型或结构化偏好 → 手写工具；生产环境、自由文本记忆、多用户 → mem0 或类似方案。</p>"},{"qnum":6,"qtext":"笔记划分的三层记忆结构（工作记忆/情节记忆/语义记忆）各自的存储位置、生命周期、容量约束是什么？今天的实践聚焦哪一层？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>层</th><th>内容</th><th>存储</th><th>生命周期</th><th>容量</th></tr></thead><tbody><tr><td><strong>Layer 1 工作记忆</strong>（Working Memory）</td><td>当前会话的 messages 列表</td><td>Python 进程内存</td><td>当前会话结束即消失</td><td>受上下文窗口限制（通常 8k–128k tokens）</td></tr><tr><td><strong>Layer 2 情节记忆</strong>（Episodic Memory）</td><td>历史会话的摘要 / 关键事件</td><td>文件 / 数据库（持久化）</td><td>长期保留，可定期清理</td><td>压缩后注入 System Prompt，保持在 1-2k tokens</td></tr><tr><td><strong>Layer 3 语义记忆</strong>（Semantic Memory）</td><td>用户偏好、常用事实、技能偏好</td><td>KV 文件 / 向量数据库（持久化）</td><td>永久保留，可按用户更新</td><td>按需检索，不全量注入</td></tr></tbody></table></div><p>今天的实践聚焦 <strong>Layer 3（语义记忆）</strong>：用户偏好的持久化，是三层里最容易实现、收益最直观的部分。</p><p><strong>记忆点：三层的核心区别是&quot;活多久、放哪儿、能装多少&quot;——工作记忆易失、情节记忆要压缩、语义记忆按需检索。</strong></p>"},{"qnum":7,"qtext":"LRU 淘汰策略具体怎么实现？它和 KV 去重、摘要压缩相比解决的是哪个问题？为什么\"用户偏好\"这个场景通常不需要 LRU？","answerHtml":"<pre><code class=\"language-python\">import time\n\ndef set_preference_with_lru(key: str, value: str, max_entries: int = 50) -&gt; None:\n    memories = load_memory()  # 返回 {key: {&quot;value&quot;: v, &quot;last_used&quot;: ts}}\n    memories[key] = {&quot;value&quot;: value, &quot;last_used&quot;: time.time()}\n\n    if len(memories) &gt; max_entries:\n        # 按 last_used 升序排，淘汰最旧的\n        oldest_key = min(memories, key=lambda k: memories[k][&quot;last_used&quot;])\n        del memories[oldest_key]\n\n    save_memory(memories)</code></pre><p>三种增长控制策略解决的问题不同：</p><div class=\"table-wrap\"><table><thead><tr><th>策略</th><th>解决的问题</th></tr></thead><tbody><tr><td><strong>KV 去重</strong>（dict 赋值覆盖）</td><td>同一个 key 多次写入不产生重复条目</td></tr><tr><td><strong>摘要压缩</strong></td><td>内容持续累积（如历史对话摘要）时，把旧内容合并变薄</td></tr><tr><td><strong>LRU 淘汰</strong></td><td>条目总数超过硬性上限时，按&quot;最久未访问&quot;原则强制腾出空间</td></tr></tbody></table></div><p>&quot;用户偏好&quot;场景通常不需要 LRU：偏好条目数量天然有限（常用城市、货币对、用户名等，通常几条到几十条），远达不到需要淘汰的规模；LRU 主要用于条目数可能无限增长的场景（如每条对话都可能产生一条独立记忆的向量存储）。</p><p><strong>记忆点：去重防重复、压缩防膨胀、LRU 防超限——三个策略针对的是记忆增长的三个不同阶段。</strong></p>"}]},{"name":"深化阶段·多 Agent 协作模式","questions":[{"qnum":1,"qtext":"Planner / Executor / Critic 三角色的职责边界各是什么？为什么不让一个 Agent 完成所有步骤？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>角色</th><th>输入</th><th>输出</th><th>职责</th><th>不做什么</th></tr></thead><tbody><tr><td><strong>Planner</strong></td><td>用户复合问题</td><td>SubTask[]</td><td>理解意图、拆分子任务</td><td>不调工具、不验证结果</td></tr><tr><td><strong>Executor</strong></td><td>SubTask</td><td>TaskResult</td><td>按指定工具和参数执行</td><td>不判断是否完整回答了问题</td></tr><tr><td><strong>Critic</strong></td><td>原始问题 + TaskResult[]</td><td>CriticVerdict</td><td>判断结果是否完整</td><td>不执行工具、不修改结果</td></tr></tbody></table></div><p><strong>为什么不让一个 Agent 完成所有步骤</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>问题</th><th>单 Agent 表现</th></tr></thead><tbody><tr><td>认知负担</td><td>同时理解意图、决定工具顺序、处理错误、验证完整性——复杂任务容易漏步</td></tr><tr><td>容错能力</td><td>执行错误时没有独立的检查环节，错误直接到用户</td></tr><tr><td>可替换性</td><td>拆任务和执行耦合，想换更强的执行模型需要整体替换</td></tr></tbody></table></div><p>分角色的核心价值：每个角色可以独立调优（换 Prompt、换模型），职责清晰后 Bug 更容易定位（是 Planner 拆错了还是 Executor 执行错了）。</p>"},{"qnum":2,"qtext":"Agent 间的消息传递协议需要包含哪些字段？如何判断\"这一步完成了\"？","answerHtml":"<p><strong>SubTask（Planner → Executor）</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead><tbody><tr><td><code>task_id</code></td><td>str</td><td>唯一标识，用于 TaskResult 回传时关联</td></tr><tr><td><code>description</code></td><td>str</td><td>任务描述，供 Executor 理解上下文</td></tr><tr><td><code>tool_name</code></td><td>str</td><td>要调用的工具名</td></tr><tr><td><code>tool_args</code></td><td>dict</td><td>工具参数</td></tr><tr><td><code>depends_on</code></td><td>list[str]</td><td>前置任务 ID，执行前检查是否已完成</td></tr></tbody></table></div><p><strong>TaskResult（Executor → Critic）</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>类型</th><th>说明</th></tr></thead><tbody><tr><td><code>task_id</code></td><td>str</td><td>对应 SubTask 的 ID</td></tr><tr><td><code>status</code></td><td>&quot;completed&quot;/&quot;failed&quot;</td><td>判断&quot;完成了&quot;的核心字段</td></tr><tr><td><code>result</code></td><td>str</td><td>成功时的结果文本</td></tr><tr><td><code>error</code></td><td>str</td><td>失败时的错误原因</td></tr></tbody></table></div><p><strong>判断&quot;这一步完成了&quot;</strong>：<code>result.status == &quot;completed&quot;</code>。依赖关系用 <code>depends_on</code> 实现——Executor 执行每个子任务前检查 <code>depends_on</code> 里的所有 ID 是否都已 completed，未满足则标记 failed。</p>"},{"qnum":3,"qtext":"Critic Agent 的判断标准是什么？它的输出结构应该包含哪些字段？","answerHtml":"<p><strong>判断标准</strong>：对照用户的<strong>原始问题意图</strong>，检查每个子任务的结果：</p><ol><li>是否所有子任务都 completed（没有 failed 的关键步骤）</li><li>结果内容是否实质上回答了用户的需求（不只是&quot;工具没报错&quot;，而是&quot;用户要知道的信息都有了&quot;）</li><li>结果之间是否存在矛盾或明显异常</li></ol><p><strong>CriticVerdict 输出结构</strong>：</p><pre><code class=\"language-python\">{\n  &quot;passed&quot;: bool,           # 整体是否通过\n  &quot;missing&quot;: list[str],     # 未被回答的需求点（passed=false 时填写）\n  &quot;reason&quot;: str,            # 整体判断理由（简洁，1-2句）\n  &quot;retry_hint&quot;: str         # 给 Planner 的重试建议（passed=false 时填写）\n}</code></pre><p><strong>Critic 不应该做的事</strong>：</p><ul><li>不重新执行工具（只判断，不操作）</li><li>不自行填补缺失信息（明确告诉 Planner 缺什么）</li><li>不只检查 status，要检查 result 内容（status=completed 但 result 是空字符串也是失败）</li></ul>"},{"qnum":4,"qtext":"A2A 协议的 Task 状态机、流式 Push、Agent Card 分别解决了同进程 Demo 的哪个工程短板？","answerHtml":"<p>同进程 Demo 的三个短板及 A2A 的对应解决方案：</p><div class=\"table-wrap\"><table><thead><tr><th>短板</th><th>表现</th><th>A2A 设计</th><th>如何解决</th></tr></thead><tbody><tr><td><strong>1. 无任务状态持久化</strong></td><td>任务状态只在内存 <code>results</code> 列表里，进程崩溃全丢</td><td><strong>Task 状态机</strong> <code>submitted→working→completed/failed</code></td><td>Task 对象持久化在 Executor 服务存储里，进程崩溃后仍可查询；Planner 任何时候可 <code>GET /tasks/{id}</code> 知道进度</td></tr><tr><td><strong>2. 同步阻塞</strong></td><td>Executor 执行完所有子任务后 Planner 才能继续</td><td><strong>Streaming Push</strong>（SSE/WebSocket）</td><td>Executor 每完成一个阶段主动 Push 状态给 Planner，Planner 可以边等边处理其他事情（如先 Critic 已完成的步骤）</td></tr><tr><td><strong>3. 工具表硬编码</strong></td><td>硬编码 <code>TOOL_REGISTRY</code>，新增 Executor 需要改代码</td><td><strong>Agent Card</strong>（<code>/.well-known/agent.json</code>）</td><td>每个 Executor 服务声明自己能处理的任务类型，Planner 动态发现可用 Agent，无需硬编码</td></tr></tbody></table></div>"},{"qnum":5,"qtext":"MCP / A2A / Function Calling 三层协议各解决什么问题？在一个完整多 Agent 系统里三者如何配合？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>协议</th><th>解决的问题</th><th>跨越的边界</th></tr></thead><tbody><tr><td><strong>Function Calling</strong></td><td>模型如何表达&quot;我要调用哪个工具、传什么参数&quot;</td><td>模型 ↔ 工具调用意图（模型内部）</td></tr><tr><td><strong>MCP</strong></td><td>工具服务如何标准化暴露、被多个 AI 应用发现和复用</td><td>AI 应用（Client）↔ 工具服务器（Server）</td></tr><tr><td><strong>A2A</strong></td><td>Agent 如何向另一个 Agent 委派任务、推送状态、声明能力</td><td>Agent ↔ Agent</td></tr></tbody></table></div><p><strong>三者在完整多 Agent 系统里的配合</strong>：</p><pre><code>Planner Agent ──A2A: 委派 SubTask──► Executor Agent\n     │                                     │\n  MCP: 工具连接                         MCP: 工具连接\n     ▼                                     ▼\n  记忆工具 MCP Server              天气/汇率 MCP Server\n\n模型层：Function Calling（决定何时调用哪个工具）\nMCP 层：工具服务的标准化连接（解决 &quot;用什么工具&quot;）\nA2A 层：Agent 间任务委派和状态同步（解决 &quot;谁做这件事&quot;）</code></pre><p>三者不是替代关系：</p><ul><li>没有 Function Calling，模型无法表达工具调用意图</li><li>没有 MCP，工具和 Agent 代码耦合，无法复用</li><li>没有 A2A，多个 Agent 只能同进程调函数，无法独立部署和扩容</li></ul>"},{"qnum":6,"qtext":"Executor 执行子任务时如何处理任务间的依赖关系？遇到某个子任务执行失败，是终止整个流程还是继续执行后续任务？为什么这样设计？","answerHtml":"<pre><code class=\"language-python\">for task in tasks:\n    task_id = task[&quot;task_id&quot;]\n\n    # 检查依赖是否已完成\n    unmet = [dep for dep in task.get(&quot;depends_on&quot;, []) if dep not in completed_ids]\n    if unmet:\n        results.append({\n            &quot;task_id&quot;: task_id, &quot;status&quot;: &quot;failed&quot;,\n            &quot;result&quot;: &quot;&quot;, &quot;error&quot;: f&quot;前置任务未完成：{unmet}&quot;,\n        })\n        continue\n\n    try:\n        result = tool_fn(**task[&quot;tool_args&quot;])\n        results.append({&quot;task_id&quot;: task_id, &quot;status&quot;: &quot;completed&quot;, &quot;result&quot;: result, &quot;error&quot;: &quot;&quot;})\n        completed_ids.add(task_id)\n    except Exception as e:\n        results.append({&quot;task_id&quot;: task_id, &quot;status&quot;: &quot;failed&quot;, &quot;result&quot;: &quot;&quot;, &quot;error&quot;: str(e)})</code></pre><p><strong>依赖处理</strong>：每个子任务执行前先检查 <code>depends_on</code> 里的所有前置 <code>task_id</code> 是否都在 <code>completed_ids</code> 集合里；有未满足的依赖直接标记 failed 并 <code>continue</code>，不阻塞整个流程。</p><p><strong>失败处理</strong>：无论是依赖未满足还是工具调用抛异常，都只把当前子任务标记 failed，然后 <code>continue</code> 执行下一个子任务——不会因为一个子任务失败就终止整个 Executor 流程。</p><p>这样设计的原因：子任务之间大多相互独立（查天气和查汇率互不影响），一个子任务失败不该连累其他能正常执行的子任务；把&quot;是否整体失败&quot;的判断权交给下游的 Critic，而不是 Executor 自己中途掐断——Executor 只负责&quot;尽量执行完能执行的&quot;，完整性判断是 Critic 的职责。</p><p><strong>记忆点：Executor 是&quot;能做多少做多少&quot;的执行者，不是&quot;一错就停&quot;的守门员——守门员的角色留给 Critic。</strong></p>"},{"qnum":7,"qtext":"Planner 的实现里为什么用 `response_format={\"type\": \"json_object\"}` 而不是普通文本输出？为什么代码里要同时兼容\"直接返回列表\"和\"返回 `{\"tasks\": [...]}`\"两种情况？","answerHtml":"<pre><code class=\"language-python\">def plan(user_request: str) -&gt; list[dict]:\n    response = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;,\n        messages=[...],\n        response_format={&quot;type&quot;: &quot;json_object&quot;},\n    )\n    raw = response.choices[0].message.content\n    data = json.loads(raw)\n    # 模型可能返回 {&quot;tasks&quot;: [...]} 或直接返回列表\n    return data if isinstance(data, list) else data.get(&quot;tasks&quot;, list(data.values())[0])</code></pre><p>用 <code>response_format={&quot;type&quot;: &quot;json_object&quot;}</code> 的原因：强制模型输出合法 JSON，避免模型在 JSON 前后加解释性文字（如&quot;好的，以下是拆解结果：&quot;）导致 <code>json.loads</code> 直接报错——这是结构化输出场景的标准做法。</p><p>兼容两种返回形状的原因：<code>response_format={&quot;type&quot;: &quot;json_object&quot;}</code> 只保证输出是一个合法 JSON<strong>对象</strong>，不保证顶层一定是数组——模型可能按语义习惯包一层 <code>{&quot;tasks&quot;: [...]}</code>，也可能直接返回数组式的 JSON。代码用 <code>isinstance(data, list)</code> 判断，是 list 就直接用，是 dict 就取 <code>tasks</code> 字段（或退化到取第一个 value），做防御性兼容，避免因模型输出形状的细微差异导致整个 Planner 崩溃。</p><p><strong>记忆点：结构化输出只保证&quot;合法 JSON&quot;，不保证&quot;你想要的那个顶层结构&quot;——解析代码要为模型的&quot;善意但不精确&quot;留出兼容空间。</strong></p>"}]},{"name":"深化阶段·第 6 周复盘（项目整合与 Agent 评估）","questions":[{"qnum":1,"qtext":"Agent 行为评估 case 的三元组（用户输入 / 预期工具调用序列 / 预期回答要点）分别验证什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>验证什么</th><th>评分方式</th></tr></thead><tbody><tr><td><strong>用户输入</strong></td><td>—</td><td>固定输入，触发 Agent 执行</td></tr><tr><td><strong>预期工具调用序列</strong></td><td>工具触发准确率：Agent 是否调用了正确的工具、顺序是否对</td><td>精确匹配工具名列表（顺序也要对）</td></tr><tr><td><strong>预期回答要点</strong></td><td>内容正确性：最终回答是否包含关键信息</td><td>关键词模糊匹配（<code>all(kw in answer for kw in points)</code>）</td></tr></tbody></table></div><p><strong>两者都通过才算整条 case 通过</strong>。分别统计的价值：</p><ul><li>工具调用 ✓ + 回答要点 ✗ → 工具执行对了但模型没有正确使用结果（格式问题或上下文传递问题）</li><li>工具调用 ✗ + 回答要点 ✓ → 模型&quot;猜&quot;出了正确答案但走了错误路径（不可靠）</li><li>两者都 ✗ → 通常是工具调用错导致了回答也错，优先修工具调用</li></ul>"},{"qnum":2,"qtext":"三类测试任务（single_tool / multi_step / boundary）各自评估 Agent 的哪个能力维度？通常哪类通过率最低？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>评估的能力维度</th><th>典型 Case</th></tr></thead><tbody><tr><td><strong>single_tool</strong></td><td>工具触发精准率（不多不少，描述够就触发）</td><td>&quot;北京今天天气？&quot;→ 调一次 <code>get_weather</code></td></tr><tr><td><strong>multi_step</strong></td><td>规划能力 + 子步骤拆解 + 工具调用顺序</td><td>&quot;帮我规划行程，需要天气和汇率&quot; → 按顺序调两个工具</td></tr><tr><td><strong>boundary</strong></td><td>鲁棒性：遇到不支持场景能礼貌拒绝，不强行调工具</td><td>&quot;查火星天气&quot; → 不调工具，回复不支持</td></tr></tbody></table></div><p><strong>通常 multi_step 通过率最低</strong>：根因主要是两个——①Planner 对&quot;同一工具用不同参数&quot;理解不足，把&quot;查北京和上海天气&quot;只拆成一个子任务；②步骤依赖处理不当，顺序可以乱。<strong>boundary 通过率次低</strong>：模型倾向于&quot;尽力帮忙&quot;，遇到不支持的场景容易强行调工具后回复错误，而不是直接拒绝。</p>"},{"qnum":3,"qtext":"工具调用 ✗ 和回答要点 ✗ 分别指向什么根因？根因定位的优先顺序是什么？","answerHtml":"<p><strong>工具调用 ✗ 的根因定位</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>子症状</th><th>根因</th><th>修复方向</th></tr></thead><tbody><tr><td>该调没调（漏触发）</td><td>工具 description 不够清晰、System Prompt 没说明何时触发</td><td>优化工具 description 和 Prompt 引导</td></tr><tr><td>不该调但调了（误触发）</td><td>工具 description 过于宽泛</td><td>缩窄 description，加&quot;仅在 X 情况下调用&quot;</td></tr><tr><td>调了错误工具</td><td>多个工具描述相似、模型混淆</td><td>给相似工具加明确区分说明</td></tr><tr><td>顺序错了</td><td>Planner Prompt 没说明依赖关系</td><td>在 Planner 的 System Prompt 里说明&quot;有依赖的任务用 depends_on&quot;</td></tr></tbody></table></div><p><strong>回答要点 ✗ 的根因</strong>（工具调用 ✓ 时）：</p><ul><li>工具返回了正确结果，但模型没有组织进回答 → 检查 System Prompt 是否要求&quot;必须在回答里包含工具结果&quot;</li><li>工具返回格式模型难以解读 → 优化工具返回值为更自然的文本</li></ul><p><strong>优先顺序</strong>：先修工具调用（根源），再修回答要点（下游）。工具调用对了，回答通常也会自然改善。</p>"},{"qnum":4,"qtext":"长期记忆（System Prompt 注入）和工具调用之间如何划分职责？用户明确说出城市时应该用哪个？","answerHtml":"<p>两者解决不同类型的信息需求：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>长期记忆（System Prompt 注入）</th><th>工具调用</th></tr></thead><tbody><tr><td><strong>信息类型</strong></td><td>固定偏好（常用城市、用户名）</td><td>动态数据（当前天气、实时汇率）</td></tr><tr><td><strong>时效性</strong></td><td>低（偏好变化慢）</td><td>高（每次调用拿最新值）</td></tr><tr><td><strong>使用时机</strong></td><td>用户未明确说明时作为默认值</td><td>用户明确请求实时数据时触发</td></tr></tbody></table></div><p><strong>用户明确说出城市时</strong>：以<strong>用户当前输入为准</strong>，调用工具查询该城市——记忆偏好只是&quot;默认值&quot;，不覆盖用户的明确指令。</p><p>需要在 System Prompt 里明确写：</p><pre><code>【已知用户偏好】仅在用户未指定时作为默认值使用。\n当用户在当前消息里明确说出具体城市/货币时，以用户输入为准，忽略已知偏好。</code></pre><p>不写清楚这一点，模型可能用记忆里的&quot;北京&quot;去查用户明确说的&quot;上海天气&quot;。</p>"},{"qnum":5,"qtext":"把四项能力（LangGraph / MCP / 记忆 / 多 Agent）同时整合进原项目时，各自引入了什么额外代价？怎么判断是否值得？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>额外代价</th><th>值得引入的条件</th></tr></thead><tbody><tr><td><strong>LangGraph</strong></td><td>依赖包 + 学习 StateGraph API + 调试需要理解图结构</td><td>流程有分支/需要中断/需要持久化任意一条满足</td></tr><tr><td><strong>MCP</strong></td><td>独立进程 + .mcp.json 配置 + 进程管理</td><td>工具需要被 2 个以上应用复用，或需要跨语言</td></tr><tr><td><strong>长期记忆</strong></td><td>记忆文件管理 + System Prompt 变长（Token 增加）</td><td>用户有明显的重复偏好，且重启后需要继续使用</td></tr><tr><td><strong>多 Agent</strong></td><td>LLM 调用次数 3 倍（Planner + Executor + Critic） + 延迟增加</td><td>任务有明确多步骤且容错需求高，简单任务不适用</td></tr></tbody></table></div><p><strong>整合时的优先顺序</strong>（代价从低到高）：</p><ol><li><strong>长期记忆</strong>：代价最小，收益立竿见影（用户体验直接改善）</li><li><strong>LangGraph</strong>：中等代价，流程可观测性和可扩展性大幅提升</li><li><strong>MCP</strong>：代价与工具数量正相关，工具少时优先级不高</li><li><strong>多 Agent</strong>：代价最大，仅对真正复杂的复合任务引入，不要默认开启</li></ol>"},{"qnum":6,"qtext":"Day 27 原项目的四个短板分别是什么？严重程度如何排列？升级版架构图里，LangGraph / MCP / 记忆 / 多 Agent 分别对应解决哪个短板？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>短板</th><th>表现</th><th>严重程度</th></tr></thead><tbody><tr><td><strong>工具和应用耦合</strong></td><td>天气/汇率工具写死在项目里，换个 AI 应用要复制粘贴代码</td><td>中</td></tr><tr><td><strong>无跨会话记忆</strong></td><td>用户每次重启都要重新说&quot;我在北京&quot;、&quot;我用美元&quot;</td><td>高（直接影响用户体验）</td></tr><tr><td><strong>单 Agent 规划瓶颈</strong></td><td>复合问题（&quot;帮我规划行程，需要天气+汇率+路线&quot;）容易漏步或顺序混乱</td><td>中</td></tr><tr><td><strong>流程不可观测</strong></td><td>while 循环里看不清&quot;现在执行到哪一步&quot;，调试靠 print</td><td>中</td></tr></tbody></table></div><p>四项能力的对应关系：</p><div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>解决的短板</th></tr></thead><tbody><tr><td><strong>MCP（Day 38-39）</strong></td><td>工具和应用耦合</td></tr><tr><td><strong>长期记忆（Day 40）</strong></td><td>无跨会话记忆</td></tr><tr><td><strong>多 Agent 协作（Day 41）</strong></td><td>单 Agent 规划瓶颈</td></tr><tr><td><strong>LangGraph（Day 33-36）</strong></td><td>流程不可观测</td></tr></tbody></table></div><p><strong>记忆点：四个短板严重程度不同（记忆丢失体验最差），但升级方案是&quot;一个短板配一项能力&quot;的精确对应，不是眉毛胡子一把抓。</strong></p>"},{"qnum":7,"qtext":"示例评估报告（15 条 case）里，m03、m05、m06、b01 分别为什么被判定为失败？这些具体的失败模式说明了什么问题？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>Case ID</th><th>场景</th><th>失败原因</th></tr></thead><tbody><tr><td><strong>m03</strong></td><td>&quot;同时告诉我北京和上海的天气&quot;</td><td>工具调用 ✗（只调了一次），回答要点 ✗ —— 应该调用 <code>get_weather</code> 两次（北京、上海），模型只调了一次</td></tr><tr><td><strong>m05</strong></td><td>&quot;帮我记住货币是美元，然后查一下汇率&quot;</td><td>工具调用 ✗（顺序错了），回答要点 ✓ —— 两个工具都调了，但 <code>save_preference</code> 应先于 <code>get_exchange_rate</code> 执行，顺序不对</td></tr><tr><td><strong>m06</strong></td><td>&quot;我去上海和广州各出差一天，各地天气如何&quot;</td><td>工具调用 ✗（只调了一次），回答要点 ✗ —— 和 m03 同类问题，同一工具不同参数只拆出了一个子任务</td></tr><tr><td><strong>b01</strong></td><td>&quot;帮我查火星的天气&quot;</td><td>工具调用 ✓（正确地未触发），但回答要点 ✗（没说&quot;不支持&quot;）—— 模型没调工具是对的，但回答内容没有明确说明&quot;不支持&quot;，关键词匹配失败</td></tr></tbody></table></div><p>说明的问题：m03/m06 共同暴露&quot;Planner 对&#x27;同一工具用不同参数&#x27;理解不足&quot;——把&quot;查两个城市&quot;错误拆成一个子任务；m05 暴露&quot;依赖顺序处理不当&quot;；b01 暴露&quot;工具调用对了但回答内容不够明确&quot;——提醒&quot;工具调用对&quot;不等于&quot;回答质量过关&quot;，两个维度要分开看。</p><p><strong>记忆点：具体 case 的失败原因比&quot;通过率 50%&quot;这个数字更有诊断价值——同样是 multi_step 失败，&quot;漏拆子任务&quot;和&quot;顺序错了&quot;是两类完全不同的 Prompt 优化方向。</strong></p>"},{"qnum":8,"qtext":"本周知识地图里，Day 38-41 每一天分别是在延续哪一天/哪几天的内容？整体呈现出什么样的升级路径？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>Day 38</th><th>Day 39</th><th>Day 40</th><th>Day 41</th></tr></thead><tbody><tr><td><strong>和前周的关系</strong></td><td>继承 Day 23 工具调用</td><td>Day 38 原理 → 代码</td><td>复用 Day 4 多轮对话思路</td><td>复用 Day 25 ReAct 思路</td></tr></tbody></table></div><p>升级路径总结：</p><pre><code>Day 23（手写工具） → Day 39（MCP Server）：工具复用\nDay 4（消息历史） → Day 40（持久记忆）：跨会话连续性\nDay 25（单 Agent ReAct） → Day 41（多 Agent 协作）：任务复杂度\nDay 33-36（LangGraph 编排） → Day 42（整合项目）：全部串联</code></pre><p>这说明 Day 38-41 不是凭空引入新概念，而是分别针对 Day 1-30 阶段遗留的具体短板做纵向升级——每一天都能在更早的 Day 里找到&quot;这是在升级谁&quot;的锚点，而不是孤立的新知识点。</p><p><strong>记忆点：深化阶段的每一天，都是 Day 1-30 某个具体短板的&quot;续集&quot;，不是另起炉灶。</strong></p>"}]},{"name":"深化阶段·可观测性基础（接入 LangFuse/LangSmith）","questions":[{"qnum":1,"qtext":"\"能跑\"和\"能被观测\"有什么本质区别？Python logging 无法回答哪类问题？","answerHtml":"<p>&quot;能跑&quot;指功能逻辑正确，请求进来、答案出去；&quot;能被观测&quot;指能按任意维度查询、聚合系统的运行状态——不只知道&quot;发生了什么&quot;，还能知道&quot;哪里慢 / 哪里贵 / 哪里频繁出错&quot;。</p><p>Python <code>logging</code> 输出的是非结构化文本流，无法回答：</p><div class=\"table-wrap\"><table><thead><tr><th>问题</th><th>logging 的局限</th></tr></thead><tbody><tr><td>这次请求哪一步最慢？</td><td>需要手算时间戳差值，且日志顺序可能被多线程打乱</td></tr><tr><td>某次请求总共花了多少 Token？</td><td>需要扫描多行日志才能关联，无法聚合</td></tr><tr><td>上周 multi_step 任务的失败率是多少？</td><td>日志无索引，只能 grep 后手动计数</td></tr><tr><td>某次失败请求的完整 Prompt 是什么？</td><td>日志只打印摘要，完整上下文通常不会写进日志</td></tr></tbody></table></div><p>可观测性系统（LangFuse / LangSmith）把每次请求的每个步骤存成<strong>结构化数据</strong>，可在 Dashboard 里搜索、过滤、聚合，这是 logging 的本质差距。</p>"},{"qnum":2,"qtext":"Trace 和 Span 各自是什么？在 LLM Agent 里分别对应哪些操作？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>概念</th><th>定义</th><th>LLM Agent 中的对应</th></tr></thead><tbody><tr><td><strong>Trace</strong></td><td>一次请求从进入系统到返回结果的完整记录，有唯一 <code>trace_id</code></td><td>一次用户对话轮次（从收到用户消息到返回最终答案）</td></tr><tr><td><strong>Span</strong></td><td>Trace 里的一个步骤，记录某一操作的开始、结束、输入、输出</td><td>LangGraph 的一个 Node 执行、一次工具调用、一次 LLM API 调用</td></tr><tr><td><strong>Generation</strong>（特殊 Span）</td><td>专门记录 LLM API 调用，额外包含 Token 用量</td><td><code>client.chat.completions.create(...)</code> 每次调用</td></tr></tbody></table></div><pre><code>Trace: 一次用户请求（7.3s）\n├── Span: planner_node（1.5s）\n├── Span: tool_call:get_weather（0.04s）\n└── Generation: call_model（5.5s，535 tokens output）</code></pre><p>Span 可以嵌套——<code>planner_node</code> 内部的 LLM 调用是 <code>planner_node</code> Span 下的一个 Generation 子 Span。</p>"},{"qnum":3,"qtext":"LangFuse 的三种接入方式（OpenAI 拦截 / @observe 装饰器 / 手动 SDK）各自适合什么场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>方式</th><th>代码改动</th><th>适合场景</th></tr></thead><tbody><tr><td><code>from langfuse.openai import openai</code>（拦截 client）</td><td>换一行 import</td><td>最快接入；自动记录所有 LLM 调用，不需要修改业务逻辑</td></tr><tr><td><code>@observe()</code> 装饰器 + <code>langfuse_context.update_current_trace(...)</code></td><td>给函数加装饰器</td><td>需要在 Trace 上加业务语义（名称、<code>user_id</code>、标签）便于 Dashboard 过滤</td></tr><tr><td><code>lf.trace()</code> / <code>trace.generation()</code> / <code>span.end()</code> 手动埋点</td><td>较多</td><td>需要精确控制 Span 边界，或记录 LangFuse 无法自动捕获的信息（如工具返回值）</td></tr><tr><td>LangChain 回调 <code>CallbackHandler</code></td><td>传入 <code>config={&quot;callbacks&quot;: [...]}</code></td><td>已有 LangChain LCEL 链，零改动把每个 Runnable 步骤变成 Span</td></tr></tbody></table></div><p><strong>推荐策略</strong>：先用&quot;拦截 client&quot;快速接入，跑通后加 <code>@observe</code> 补充业务语义，最后按需在关键节点加手动 Span。</p>"},{"qnum":4,"qtext":"在 LangFuse Dashboard 的单条 Trace 瀑布图里能读到哪些信息？对比日志文件有什么优势？","answerHtml":"<p><strong>瀑布图能读到</strong>：</p><ul><li>每个 Span 的名称、开始时间、持续时间（条形图直观显示占比）</li><li>点进 Generation Span：完整的 messages 数组（System Prompt + 历史消息 + 当前消息）、输出 content、input / output Token 数量</li><li>点进工具 Span：入参（如 <code>city=&quot;上海&quot;</code>）和返回值</li><li>Trace 层面：总耗时、总 Token、总成本（按模型定价自动计算）</li></ul><p><strong>对比日志文件的优势</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>日志文件</th><th>LangFuse Dashboard</th></tr></thead><tbody><tr><td>找某次失败请求</td><td>grep + 肉眼扫描</td><td>按 tag / 状态 / 时间过滤，一键定位</td></tr><tr><td>查哪一步最慢</td><td>手算时间戳差</td><td>瀑布图直接显示各 Span 耗时占比</td></tr><tr><td>看完整 Prompt</td><td>通常未打印</td><td>Generation Span 里存完整 messages</td></tr><tr><td>统计某天总成本</td><td>无法直接统计</td><td>Dashboard 按时间聚合，自动计算</td></tr></tbody></table></div>"},{"qnum":5,"qtext":"LangFuse 和 LangSmith 的核心区别是什么？选型的判断标准是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>LangFuse</th><th>LangSmith</th></tr></thead><tbody><tr><td><strong>开源</strong></td><td>✅ 可自部署</td><td>❌ 闭源</td></tr><tr><td><strong>SDK 覆盖</strong></td><td>原生 OpenAI、LangChain、LangGraph、手动 SDK</td><td>主要针对 LangChain / LangGraph 生态</td></tr><tr><td><strong>免费额度</strong></td><td>慷慨（适合个人和小团队）</td><td>有限制（超出后按量计费）</td></tr><tr><td><strong>国内访问</strong></td><td>官方云版可访问</td><td>有时不稳定</td></tr><tr><td><strong>特色功能</strong></td><td>Token 成本追踪、Prompt 版本管理</td><td>Prompt Hub、内置评估框架</td></tr></tbody></table></div><p><strong>选型判断标准</strong>：</p><ul><li>项目<strong>不依赖 LangChain</strong> 或需要自部署 → <strong>LangFuse</strong></li><li>项目<strong>深度依赖 LangChain</strong> 且已购买 LangSmith 订阅 → <strong>LangSmith</strong></li><li>个人学习项目（本路线） → <strong>LangFuse</strong>（免费额度充足，原生 OpenAI 支持好）</li></ul>"},{"qnum":6,"qtext":"LangGraph 的 Agent 图没有原生的 LangFuse 集成，应该怎么给它加可观测性？加完之后 Trace/Span 的嵌套关系是什么样的？","answerHtml":"<p>LangGraph 没有开箱即用的 LangFuse 集成，需要在每个 Node 函数上手动加 <code>@observe</code> 装饰器，并用 <code>langfuse_context.update_current_observation()</code> 记录该 Node 的输入输出：</p><pre><code class=\"language-python\">from langfuse.decorators import observe\n\n@observe(name=&quot;planner_node&quot;)\ndef planner_node(state: AgentState) -&gt; dict:\n    langfuse_context.update_current_observation(input={&quot;user_request&quot;: state[&quot;user_request&quot;]})\n    tasks = plan(state[&quot;user_request&quot;])\n    langfuse_context.update_current_observation(output={&quot;tasks&quot;: tasks})\n    return {&quot;tasks&quot;: tasks}</code></pre><p>整个 LangGraph 图的一次执行自动成为一个 Trace，每个被 <code>@observe</code> 装饰的 Node 是这个 Trace 下的一个 Span，嵌套关系自动保留：</p><pre><code>Trace: langgraph_agent_run [8.1s]\n├── Span: planner_node            ██      1.5s\n├── Span: executor_node           ██████  4.2s\n│   ├── Event: tool:get_weather   █       0.04s\n│   └── Event: tool:exchange_rate █       0.03s\n└── Span: critic_node             ██      2.4s</code></pre><p><strong>记忆点</strong>：LangGraph 没有框架层面的自动埋点，可观测性是&quot;手动加在每个 Node 上&quot;的，但一旦加好，Node 之间的父子调用关系会被 LangFuse 自动组织成 Trace 下的树状 Span 结构，不需要手动维护层级。</p>"},{"qnum":7,"qtext":"Day 42 评估报告里 `m03` 用例（\"同时告诉我北京和上海的天气\"）工具调用失败，接入 LangFuse 后排查方式发生了什么质变？","answerHtml":"<p>接入前，只能靠 print/日志肉眼扫描，最多能猜测&quot;可能是 Planner 的问题&quot;。接入 LangFuse 后，找到这次失败请求对应的 Trace，展开 Span 直接能看到：</p><ul><li>Planner 的输出 JSON（能直接看出拆了几个子任务）</li><li>Executor 的工具调用次数（是不是只调了一次 <code>get_weather</code>）</li><li>哪个具体 Span 产生了 <code>status=failed</code></li></ul><p>这是从&quot;猜测是 Planner 的问题&quot;到&quot;确认是 Planner 只输出了一个子任务&quot;的跨越——日志只能告诉你&quot;出错了&quot;，Dashboard 能告诉你&quot;在哪一步、哪个环节出错了&quot;。</p><p><strong>记忆点</strong>：可观测性的核心价值不是&quot;记录更多数据&quot;，而是把&quot;排查方式&quot;从靠猜测和肉眼扫描，变成靠精确定位和结构化查询。</p>"}]},{"name":"深化阶段·结构化日志与成本监控面板","questions":[{"qnum":1,"qtext":"为什么 LLM 应用的日志必须结构化？纯文本日志有哪些致命缺陷？","answerHtml":"<p>纯文本日志（如 <code>logging.info(f&quot;完成，耗时 {t}s，tokens: {usage}&quot;)</code>）的核心问题：</p><div class=\"table-wrap\"><table><thead><tr><th>缺陷</th><th>后果</th></tr></thead><tbody><tr><td><strong>字段无统一名称</strong></td><td>有时写 <code>tokens:</code>，有时写 <code>token_count:</code>，提取时必须为每种格式单独写正则</td></tr><tr><td><strong>数值与文本混写</strong></td><td>无法用标准库解析，必须手写正则，且正则对格式变化极其脆弱</td></tr><tr><td><strong>无关联 ID</strong></td><td>多线程下无法把&quot;请求开始&quot;和&quot;请求完成&quot;两行对应到同一次调用</td></tr><tr><td><strong>无法直接聚合</strong></td><td>统计&quot;上周总成本&quot;需要先提取数字再累加，每次都是一次性工程</td></tr></tbody></table></div><p>结构化日志把每条记录存为独立的 JSON 对象（JSONL 格式），任何字段都可以用 <code>json.loads()</code> 直接解析，用 <code>jq</code> 或 Python <code>filter</code> 做任意维度的查询和聚合，不需要正则。</p>"},{"qnum":2,"qtext":"结构化日志里 trace_id / tokens / cost / latency 四个字段各自的作用是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>作用</th></tr></thead><tbody><tr><td><strong>trace_id</strong></td><td>把同一次请求产生的多条日志行（request_start / tool_call / request_complete）关联在一起；多线程下不依赖时间戳对齐</td></tr><tr><td><strong>tokens_input / tokens_output</strong></td><td>原子级成本记录；input 和 output 分开因为两者定价不同（output 通常贵 3-4 倍）；用于排查&quot;哪次请求 Prompt 过长&quot;</td></tr><tr><td><strong>cost_usd</strong></td><td>已换算的美元成本；直接 sum 可得总花费，不需要在分析时再查定价表</td></tr><tr><td><strong>latency_total_ms / latency_llm_ms / latency_tool_ms</strong></td><td>三层耗时：total 是用户体验指标，llm 用于判断模型延迟，tool 用于定位慢工具；三者之和 ≈ total</td></tr></tbody></table></div>"},{"qnum":3,"qtext":"tokens_input 和 tokens_output 为什么要分开记录？cost 字段的计算公式是什么？","answerHtml":"<p><strong>分开记录的原因</strong>：</p><ol><li><strong>定价不同</strong>：几乎所有模型都对 output token 收取更高费用（通常是 input 的 2-4 倍），合并记录会丢失成本结构信息</li><li><strong>排查方向不同</strong>：<code>tokens_input</code> 偏大 → Prompt 过长（优化 System Prompt 或压缩上下文）；<code>tokens_output</code> 偏大 → 模型回答冗长（在 Prompt 里加&quot;请简洁回答&quot;约束）</li></ol><p><strong>成本计算公式</strong>：</p><pre><code class=\"language-python\">cost_usd = (tokens_input × price_input_per_1M + tokens_output × price_output_per_1M) / 1_000_000</code></pre><p>例如 DeepSeek-chat（input $0.14/1M，output $0.28/1M），一次请求 312 input + 535 output：</p><pre><code>cost = (312 × 0.14 + 535 × 0.28) / 1_000_000 = (43.68 + 149.8) / 1_000_000 ≈ $0.000193</code></pre>"},{"qnum":4,"qtext":"latency_total / latency_llm / latency_tool 三个耗时字段各自能排查什么性能问题？","answerHtml":"<pre><code>latency_total ≈ latency_llm + latency_tool + 业务逻辑耗时</code></pre><div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>能排查的问题</th><th>典型发现</th></tr></thead><tbody><tr><td><code>latency_total_ms</code></td><td>用户侧感知到的总延迟；是否超过 SLA 阈值</td><td>某类请求总耗时突然增加 3 倍</td></tr><tr><td><code>latency_llm_ms</code></td><td>模型 API 延迟；判断瓶颈是否在 LLM 调用</td><td><code>llm / total &gt; 80%</code> → 考虑换更快的模型或开启流式输出</td></tr><tr><td><code>latency_tool_ms</code></td><td>工具调用延迟；哪个工具最慢</td><td>某天 <code>tool_ms</code> 暴增 → 外部 API 出现问题</td></tr></tbody></table></div><p><strong>排查流程</strong>：先看 <code>latency_total</code> 找到慢请求 → 比较 <code>latency_llm</code> 和 <code>latency_tool</code> 确定瓶颈在哪一层 → 针对性优化（缓存 / 换模型 / 修工具实现）。</p>"},{"qnum":5,"qtext":"LangFuse Dashboard 和本地结构化 JSONL 日志如何分工协作？","answerHtml":"<p>两者处理不同粒度和不同访问模式的需求，互为补充：</p><div class=\"table-wrap\"><table><thead><tr><th>场景</th><th>用哪个</th><th>原因</th></tr></thead><tbody><tr><td>&quot;这次请求为什么慢？&quot;</td><td>LangFuse Dashboard</td><td>瀑布图直接展示每个 Span 耗时，点进去看完整 Prompt</td></tr><tr><td>&quot;上周总共花了多少钱？&quot;</td><td>本地 JSONL 脚本</td><td><code>jq</code> 或 Python sum，一条命令出结果，无需 API 调用</td></tr><tr><td>&quot;哪个功能最贵？&quot;</td><td>本地 JSONL 脚本</td><td>按 <code>function_name</code> 分组聚合，自定义分析逻辑</td></tr><tr><td>&quot;某次 error 的完整上下文？&quot;</td><td>LangFuse Dashboard</td><td>存了完整 messages 数组，本地日志只有摘要</td></tr><tr><td>&quot;最近 30 天成本趋势图？&quot;</td><td>本地 JSONL 脚本</td><td>数据全量在本地，不受账号计划的数据保留限制</td></tr></tbody></table></div><p><strong>最佳实践</strong>：同时运行两者。LangFuse 用于实时调试（细粒度、有 UI），本地 JSONL 用于批量分析（灵活、无依赖、可永久保留）。</p>"},{"qnum":6,"qtext":"function_name 字段在成本归因里起什么作用？笔记里的具体案例说明了什么问题？","answerHtml":"<p>同一个 Agent 往往有多个功能入口（天气查询/行程规划/汇率换算），只有按 <code>function_name</code> 分组聚合，才能知道&quot;哪个功能最贵&quot;，而不是只看到一个模糊的总成本数字：</p><pre><code>按 function_name 聚合（最近 7 天）：\n  travel_planner:   $0.82  (47 次，平均 $0.017/次)\n  weather_query:    $0.23  (158 次，平均 $0.0015/次)\n  exchange_rate:    $0.04  (61 次，平均 $0.00066/次)\n\n→ travel_planner 只有 47 次却占了总成本的 75%，优化重点明确</code></pre><p>如果没有 <code>function_name</code> 这个维度，266 条日志汇总出的&quot;合计 0.0426 USD&quot;只是一个数字，无法回答&quot;接下来该优化哪个功能&quot;——这正是&quot;知道花了多少&quot;和&quot;知道哪里花多了&quot;之间的关键差距。</p>"},{"qnum":7,"qtext":"`cost_report.py` 的\"按天\"（`report_by_day`）和\"按功能\"（`report_by_func`）两种聚合视角，各自回答的是什么问题？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>视角</th><th>回答的问题</th><th>典型发现</th></tr></thead><tbody><tr><td><strong>按天</strong>（<code>report_by_day</code>）</td><td>&quot;成本是不是在趋势性变化&quot;——请求数、总成本、Token、均耗时按日期排列</td><td>某天成本突然翻倍，可能是流量激增或某次改动导致 Prompt 变长</td></tr><tr><td><strong>按功能</strong>（<code>report_by_func</code>）</td><td>&quot;钱花在了哪个功能上&quot;——按 <code>function_name</code> 分组，同时统计每个功能的错误数</td><td><code>travel_planner</code> 请求数少但成本占比高，优化优先级明确</td></tr></tbody></table></div><p><code>report_by_func</code> 还额外统计了每个功能的 <code>errors</code> 数（从 <code>event=&quot;error&quot;</code> 的日志行里聚合），这是按天视角没有的维度——按功能视角同时回答&quot;哪个功能贵&quot;和&quot;哪个功能不稳定&quot;两个问题。</p><p><strong>记忆点</strong>：两种聚合视角不是互相替代，而是分别回答&quot;什么时候变贵了&quot;和&quot;哪里变贵了&quot;两个不同的问题，实际排查时往往先看按天发现异常，再切到按功能定位原因。</p>"}]},{"name":"深化阶段·Prompt / 结果缓存","questions":[{"qnum":1,"qtext":"精确匹配缓存和语义缓存的核心区别是什么？各自适合哪类场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>精确匹配缓存</th><th>语义缓存</th></tr></thead><tbody><tr><td><strong>命中条件</strong></td><td>请求内容的哈希值完全相同</td><td>查询向量与已缓存向量的余弦相似度 &gt; 阈值</td></tr><tr><td><strong>命中率</strong></td><td>低（字符串稍有不同就 miss）</td><td>高（语义相似的不同表述都能命中）</td></tr><tr><td><strong>误命中风险</strong></td><td>无</td><td>有（阈值过低时语义不同的问题返回错误答案）</td></tr><tr><td><strong>额外成本</strong></td><td>无</td><td>Embedding API 调用费用</td></tr><tr><td><strong>实现复杂度</strong></td><td>低（hash + KV 存储）</td><td>高（Embedding + 向量数据库）</td></tr></tbody></table></div><p><strong>各自适合场景</strong>：</p><ul><li><strong>精确匹配</strong>：完全固定的查询（批量处理同一批数据、FAQ 精确问题、SDK 文档的代码生成）</li><li><strong>语义缓存</strong>：自然语言输入（用户可能用不同表述问同一个问题，适合对话式产品）</li></ul><p><strong>推荐路径</strong>：先上精确匹配，命中率 &lt; 30% 再升级语义缓存。</p>"},{"qnum":2,"qtext":"缓存键必须包含哪些字段？漏掉某个字段会导致什么问题？","answerHtml":"<pre><code class=\"language-python\">缓存键 = hash(model + temperature + system_prompt + messages)</code></pre><div class=\"table-wrap\"><table><thead><tr><th>漏掉的字段</th><th>后果</th></tr></thead><tbody><tr><td><code>model</code></td><td>换模型后命中旧模型的缓存，返回质量不同的答案</td></tr><tr><td><code>temperature</code></td><td><code>temperature=0</code>（确定性输出）和 <code>temperature=0.9</code>（随机输出）共用缓存，结果性质完全不同</td></tr><tr><td><code>system_prompt</code></td><td>给不同角色（客服 / 技术助手）设置不同 System Prompt 时，错误命中彼此的缓存</td></tr><tr><td><code>messages</code>（历史）</td><td>多轮对话中只用最后一条消息做 key，忽略上下文，导致同样的问题在不同上下文下返回相同缓存</td></tr></tbody></table></div>"},{"qnum":3,"qtext":"语义缓存的相似度阈值如何选取？阈值过高 / 过低各有什么风险？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>阈值范围</th><th>效果</th><th>风险</th></tr></thead><tbody><tr><td><strong>过高（0.99+）</strong></td><td>命中率极低，接近精确匹配</td><td>语义缓存几乎没有收益</td></tr><tr><td><strong>推荐（0.90–0.95）</strong></td><td>命中率和准确性平衡</td><td>需要针对业务做验证</td></tr><tr><td><strong>过低（&lt; 0.85）</strong></td><td>命中率高，但出现误命中</td><td>&quot;北京天气&quot;和&quot;上海天气&quot;可能互相命中，返回错误城市的答案</td></tr></tbody></table></div><p><strong>选取方法</strong>：</p><ol><li>收集 50–100 对&quot;应该命中&quot;和&quot;不应该命中&quot;的样本对</li><li>计算每对的余弦相似度，找到能正确区分两类的分界点</li><li>取分界点往高处偏移一点（宁可少命中，不能误命中）</li></ol>"},{"qnum":4,"qtext":"缓存失效策略有哪几种？含\"今天\"/\"实时\"这类词语的查询应该如何处理？","answerHtml":"<p><strong>三种失效策略</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>策略</th><th>机制</th><th>适用场景</th></tr></thead><tbody><tr><td><strong>TTL（被动过期）</strong></td><td>读取时检查时间戳，超时则视为失效</td><td>大多数场景，实现简单</td></tr><tr><td><strong>基于内容特征</strong></td><td>检测到时效性关键词则跳过缓存或用超短 TTL</td><td>含&quot;今天 / 实时 / 当前&quot;的查询</td></tr><tr><td><strong>主动失效</strong></td><td>数据源更新时调用 <code>cache_delete(key)</code></td><td>有明确更新事件（产品信息变更）</td></tr></tbody></table></div><p><strong>含时效性词语的处理</strong>：</p><pre><code class=\"language-python\">NO_CACHE_KEYWORDS = [&quot;现在&quot;, &quot;今天&quot;, &quot;最新&quot;, &quot;实时&quot;, &quot;当前&quot;, &quot;刚刚&quot;]\n\ndef should_skip_cache(user_input: str) -&gt; bool:\n    return any(kw in user_input for kw in NO_CACHE_KEYWORDS)</code></pre><ul><li>命中关键词 → 跳过缓存（直接调 LLM）或使用极短 TTL（如 5 分钟）</li><li>未命中关键词 → 正常缓存流程</li></ul>"},{"qnum":5,"qtext":"语义缓存自身也要调用 Embedding API，这个成本如何考量？什么情况下语义缓存不划算？","answerHtml":"<p><strong>成本考量</strong>：</p><pre><code>语义缓存的净收益 = 命中次数 × LLM_cost - 总请求次数 × Embedding_cost</code></pre><p>Embedding 成本通常是 LLM 成本的 1/10 到 1/100，所以只要命中率足够高，净收益为正。</p><p><strong>语义缓存不划算的情况</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>情况</th><th>原因</th></tr></thead><tbody><tr><td><strong>命中率很低</strong>（&lt; 10%）</td><td>Embedding 成本 &gt; LLM 节省，反而更贵</td></tr><tr><td><strong>LLM 本身很便宜</strong></td><td>LLM 单次成本 ≈ Embedding 成本时，收益接近零</td></tr><tr><td><strong>每个查询都高度个性化</strong></td><td>几乎没有语义相似的重复查询，命中率天然低</td></tr><tr><td><strong>答案时效性要求高</strong></td><td>缓存 TTL 极短，大量缓存项在被命中前就过期</td></tr></tbody></table></div><p><strong>判断公式</strong>（简化）：</p><pre><code>如果 命中率 × LLM_cost &gt; Embedding_cost，语义缓存值得\n否则，先用精确匹配，不值得升级</code></pre>"},{"qnum":6,"qtext":"精确匹配缓存为什么要做\"内存 + 磁盘\"两级实现，而不是只用一种？两级之间是怎么配合的？","answerHtml":"<pre><code class=\"language-python\">def cache_get(key: str) -&gt; str | None:\n    # 1. 先查内存（最快，但进程重启后失效）\n    if key in _mem_cache:\n        result, expires_at = _mem_cache[key]\n        if expires_at &gt; time.monotonic():\n            return result\n        del _mem_cache[key]\n    # 2. 再查磁盘（持久化，但访问稍慢）\n    cache_file = CACHE_DIR / f&quot;{key}.json&quot;\n    if cache_file.exists():\n        data = json.loads(cache_file.read_text(encoding=&quot;utf-8&quot;))\n        if data[&quot;expires_at&quot;] &gt; time.time():\n            _mem_cache[key] = (data[&quot;result&quot;], ...)   # 命中磁盘后回填内存\n            return data[&quot;result&quot;]\n        cache_file.unlink()\n    return None</code></pre><div class=\"table-wrap\"><table><thead><tr><th>层级</th><th>优点</th><th>缺点</th></tr></thead><tbody><tr><td>内存缓存</td><td>访问延迟 &lt; 1ms，无 I/O 开销</td><td>进程重启后全部丢失</td></tr><tr><td>磁盘缓存</td><td>跨进程重启依然有效</td><td>每次读写有文件 I/O 开销</td></tr></tbody></table></div><p>两级配合的关键是<strong>磁盘命中后会&quot;回填&quot;内存</strong>——第一次读到某条缓存走磁盘，之后同一个 key 的后续请求就直接命中内存，兼顾了&quot;重启不丢&quot;和&quot;访问够快&quot;两个诉求，而不是二选一。</p>"},{"qnum":7,"qtext":"缓存失效的\"主动失效\"和\"被动过期（TTL）\"有什么本质区别？什么场景必须用主动失效？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>方式</th><th>机制</th><th>触发时机</th><th>适用场景</th></tr></thead><tbody><tr><td><strong>被动过期（TTL）</strong></td><td>读取时检查时间戳，过期则视为失效</td><td>缓存被下一次读取访问到时</td><td>大多数场景，实现简单，无需感知数据源变化</td></tr><tr><td><strong>主动失效</strong></td><td>数据源更新时，调用方主动 <code>cache_delete(key)</code></td><td>数据变更发生的那一刻</td><td>有明确更新事件（如产品信息更新后立刻清空该产品的所有缓存）</td></tr></tbody></table></div><p><strong>本质区别</strong>：TTL 是&quot;缓存自己猜多久会过期&quot;，是被动的、有滞后性的（数据其实已经变了，但缓存要等到 TTL 到期才会失效）；主动失效是&quot;数据变了就立刻通知缓存&quot;，没有滞后窗口，但需要在数据更新逻辑里额外调用清理接口，和业务逻辑耦合更强。</p><p><strong>判断标准</strong>：只有当 TTL 不够精确（业务不能接受&quot;数据已更新但缓存还没过期&quot;的滞后窗口）时才使用主动失效，否则优先用 TTL——这是&quot;简单优先&quot;的工程原则。</p>"}]},{"name":"深化阶段·批处理（Batching）","questions":[{"qnum":1,"qtext":"批处理、缓存、模型路由分别解决了 LLM 应用的哪种浪费？三者如何叠加使用？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>优化手段</th><th>解决的浪费</th><th>核心机制</th></tr></thead><tbody><tr><td><strong>缓存</strong></td><td>重复请求的 Token 成本：相同/相似问题反复花钱</td><td>命中缓存时跳过 LLM 调用</td></tr><tr><td><strong>批处理</strong></td><td>串行等待的时间：N 个独立任务排队执行</td><td>并发发起多个请求，等待时间取最大值而非累加</td></tr><tr><td><strong>模型路由</strong></td><td>用错模型的成本：简单任务不该用贵模型</td><td>按复杂度把请求分发到合适的模型档位</td></tr></tbody></table></div><p><strong>叠加顺序</strong>（从左到右依次判断）：</p><ol><li><strong>路由</strong>：先选对模型档位（简单任务用便宜模型）</li><li><strong>缓存</strong>：查缓存，命中则直接返回（避免重复调用）</li><li><strong>批处理</strong>：对剩余未命中的请求并发执行</li></ol><p>三者叠加后，总成本 = 路由节省 + 缓存节省 + 批处理加速（不节省 Token，但减少等待时间）。</p>"},{"qnum":2,"qtext":"为什么用 asyncio 并发而不是多线程实现批处理？asyncio.Semaphore 的作用是什么？","answerHtml":"<p><strong>为什么用 asyncio</strong>：LLM API 调用是 I/O 密集型——大部分时间在等网络响应，CPU 几乎空闲。Python 多线程受 GIL 限制，且有线程创建/切换开销。<code>asyncio</code> 协程在单线程内通过事件循环切换，在 I/O 等待时把 CPU 让给其他协程，没有线程开销，配合 <code>AsyncOpenAI</code> 客户端效率最高。</p><p><strong>asyncio.Semaphore 的作用</strong>：控制同时持有&quot;令牌&quot;的协程数，防止并发数过高触发 API 限速（429 Too Many Requests）：</p><pre><code class=\"language-python\">sem = asyncio.Semaphore(10)   # 最多同时 10 个请求在途\n\nasync def call_with_limit(item):\n    async with sem:            # 没有令牌时等待，有令牌时进入\n        return await call_llm(item)\n                               # async with 退出时自动归还令牌</code></pre><p>没有 Semaphore 时，100 个任务瞬间并发 100 个请求，几乎必然触发限速，导致大量重试，总耗时反而比串行更长。</p>"},{"qnum":3,"qtext":"MAX_CONCURRENCY 如何设定？并发数过高会导致什么问题？","answerHtml":"<p><strong>设定参考</strong>：</p><pre><code>MAX_CONCURRENCY ≈ RPM / 60 × 平均单次耗时(s)</code></pre><p>例：RPM=60，平均耗时 2s → <code>MAX_CONCURRENCY = 60/60 × 2 = 2</code>（理论值，实践从 5-10 开始）</p><p><strong>调参策略</strong>：</p><ol><li>从 <code>MAX_CONCURRENCY = 5</code> 开始跑</li><li>观察日志中 429 错误的占比</li><li>若 429 &lt; 5%，逐步提高（10 → 20）</li><li>若 429 &gt; 10%，降低并发数</li></ol><p><strong>并发数过高的后果</strong>：</p><ul><li>触发 API 限速（429），每次限速都要等待 + 重试</li><li>重试叠加后总耗时可能比低并发数的方案更长（适得其反）</li><li>占用连接池资源，可能导致连接超时</li></ul>"},{"qnum":4,"qtext":"Batch API 和 asyncio 并发各有什么取舍？什么场景下 Batch API 更划算？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>asyncio 并发</th><th>Batch API</th></tr></thead><tbody><tr><td><strong>延迟</strong></td><td>秒到分钟（并发数控制）</td><td>分钟到 24 小时（不可控）</td></tr><tr><td><strong>成本</strong></td><td>正常定价</td><td>通常 50% 折扣</td></tr><tr><td><strong>实现复杂度</strong></td><td>低（几十行代码）</td><td>高（文件上传 + 轮询 + 结果下载）</td></tr><tr><td><strong>Provider 支持</strong></td><td>所有 OpenAI 兼容 API</td><td>仅 OpenAI / Anthropic</td></tr><tr><td><strong>适合场景</strong></td><td>需要分钟内完成</td><td>可以等数小时、追求最低成本</td></tr></tbody></table></div><p><strong>Batch API 更划算的条件</strong>（同时满足）：</p><ol><li>任务不紧急（24 小时内完成可接受）</li><li>批量规模大（几千到几万条，折扣收益显著）</li><li>使用 OpenAI 或 Anthropic（有专用 Batch API）</li></ol><p>对于 DeepSeek 等没有专用 Batch API 的 Provider，只能用 asyncio 并发。</p>"},{"qnum":5,"qtext":"批处理能减少 Token 成本吗？它实际优化的是什么指标？","answerHtml":"<p><strong>批处理不能减少 Token 成本</strong>。100 条请求不论串行还是并发，消耗的 Token 总量完全相同——每条请求的 System Prompt、用户输入、模型输出都不变。</p><p><strong>批处理实际优化的指标</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>指标</th><th>串行（N 条）</th><th>批处理（并发 C）</th><th>改善</th></tr></thead><tbody><tr><td><strong>总耗时</strong></td><td>N × 单次耗时</td><td>ceil(N/C) × 单次耗时</td><td>C 倍加速（理论）</td></tr><tr><td><strong>Token 成本</strong></td><td>N × 单次成本</td><td>N × 单次成本</td><td><strong>不变</strong></td></tr><tr><td><strong>吞吐量</strong></td><td>1 条/单次耗时</td><td>C 条/单次耗时</td><td>C 倍提升</td></tr></tbody></table></div><p>唯一能降低 Token 成本的批处理变体是 Batch API——厂商对异步提交给予折扣（通常 50%），但这是厂商定价策略，不是批处理本身的效果。</p><p><strong>总结</strong>：批处理优化的是<strong>时间效率</strong>（吞吐量），不是<strong>成本效率</strong>。要省钱，用缓存（省重复 Token）或路由（用更便宜的模型）。</p>"},{"qnum":6,"qtext":"哪些任务特征决定了它适合用批处理？给出适合和不适合的对比。","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>特征</th><th>适合批处理</th><th>不适合批处理</th></tr></thead><tbody><tr><td><strong>实时性要求</strong></td><td>可以容忍分钟级等待（离线处理）</td><td>需要秒级响应（对话类场景）</td></tr><tr><td><strong>任务依赖关系</strong></td><td>各条任务彼此独立，互不依赖结果</td><td>任务 B 需要依赖任务 A 的输出结果</td></tr><tr><td><strong>数量规模</strong></td><td>几十条到数万条</td><td>单条请求，没有批量化的意义</td></tr><tr><td><strong>典型场景</strong></td><td>批量打标签、批量摘要、批量翻译、批量向量化</td><td>实时对话、需要流式输出的交互场景</td></tr></tbody></table></div><p><strong>判断标准</strong>：批处理的前提是&quot;任务之间彼此独立&quot;——如果任务 B 的输入依赖任务 A 的输出（比如多步 Agent 里后一步要用前一步的结果），并发执行反而会因为顺序错乱导致结果错误，这类场景不能简单套用批处理，需要用 LangGraph 那样的编排机制。</p>"},{"qnum":7,"qtext":"批处理中，如果一条任务失败了，为什么不会导致其他 99 条任务全部失败？`asyncio.gather` 和指数退避重试各自起了什么作用？","answerHtml":"<p>两个关键设计点共同保证了&quot;局部失败不拖累整体&quot;：</p><pre><code class=\"language-python\">async def label_one(item_id, description):\n    async with sem:\n        for attempt in range(3):\n            try:\n                response = await async_client.chat.completions.create(...)\n                return {&quot;id&quot;: item_id, ..., &quot;status&quot;: &quot;ok&quot;}\n            except Exception as e:\n                if attempt == 2:\n                    return {&quot;id&quot;: item_id, &quot;label&quot;: &quot;ERROR&quot;, &quot;error&quot;: str(e), &quot;status&quot;: &quot;error&quot;}\n                await asyncio.sleep(2 ** attempt)   # 指数退避：1s, 2s, 4s</code></pre><ol><li>**<code>label_one</code> 内部捕获异常，不向外抛出**——失败时返回一个 <code>status=&quot;error&quot;</code> 的字典而不是抛异常，所以 <code>asyncio.gather(*tasks)</code> 不会因为某个协程抛异常而取消其他协程（<code>gather</code> 默认 <code>return_exceptions=False</code>，但由于异常已经在内部被捕获，根本不会传播到 <code>gather</code> 层面）</li><li><strong>指数退避重试</strong>（1s/2s/4s）用于应对限速或临时性错误，避免&quot;一失败就立刻重试&quot;引发重试风暴，加重限速压力</li></ol><p>失败条目最终记录 <code>status=&quot;error&quot;</code>，汇总后按需人工处理或单独重跑，其余条目正常完成，互不影响。</p>"}]},{"name":"深化阶段·模型分级路由","questions":[{"qnum":1,"qtext":"路由判断依据有哪几类信号？各自有什么局限性？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>信号</th><th>判断逻辑</th><th>局限性</th></tr></thead><tbody><tr><td><strong>问题长度</strong></td><td>长 → 复杂，短 → 简单</td><td>长输入不一定是复杂任务（如&quot;翻译这段 500 字文章&quot;）</td></tr><tr><td><strong>工具调用关键词</strong></td><td>含&quot;查询/天气/汇率&quot;→ 需要工具，提高复杂度</td><td>关键词覆盖不全，容易漏判</td></tr><tr><td><strong>任务类型关键词</strong></td><td>&quot;分析/合同/推断&quot;→ 复杂；&quot;什么是/翻译&quot;→ 简单</td><td>关键词可能被用户混用，误判率高</td></tr><tr><td><strong>历史失败率</strong></td><td>同类请求在小模型的历史失败率高 → 本次升档</td><td>需要足够样本量，冷启动期无效</td></tr></tbody></table></div><p><strong>多信号加权综合</strong>是最稳健的方式——单一信号误判率高，多个信号投票后误判率显著降低。</p>"},{"qnum":2,"qtext":"路由阈值为什么应该\"宁高勿低\"？降档失败的代价是什么？","answerHtml":"<p><strong>降档失败（把复杂请求路由到小模型）的代价</strong>：</p><ul><li><strong>质量损失</strong>：小模型可能给出错误或浅薄的回答，用户体验受损</li><li><strong>工具调用失败</strong>：小模型可能无法正确解析函数签名，导致工具调用出错</li><li><strong>重试成本</strong>：失败后需要升档重试，总成本 = 小模型成本 + 大模型成本，比直接用大模型更贵</li><li><strong>用户流失</strong>：用户对错误答案的容忍度远低于对稍慢响应的容忍度</li></ul><p><strong>升档&quot;失败&quot;（把简单请求路由到大模型）的代价</strong>：仅多花一点 Token 费用，回答质量不受影响。</p><p>因此阈值应保守——复杂度得分 0.55 时的正确选择是 standard 而非 lite，宁可多花一点钱，不要冒降档风险。</p>"},{"qnum":3,"qtext":"路由决策日志应该记录哪些字段？如何用日志量化路由的成本收益？","answerHtml":"<p><strong>必记字段</strong>：</p><pre><code class=\"language-json\">{\n  &quot;user_input&quot;:    &quot;（前80字）&quot;,\n  &quot;complexity&quot;:    0.73,          // 综合复杂度分数\n  &quot;tier&quot;:          &quot;standard&quot;,    // 路由到哪个档位\n  &quot;model&quot;:         &quot;deepseek-chat&quot;,\n  &quot;tokens_input&quot;:  312,\n  &quot;tokens_output&quot;: 535,\n  &quot;cost_usd&quot;:      0.000193,\n  &quot;latency_ms&quot;:    3412,\n  &quot;status&quot;:        &quot;success&quot;      // success / error / success_fallback\n}</code></pre><p><strong>量化成本收益的方法</strong>：</p><ol><li>从日志里按档位聚合请求数和总成本</li><li>计算&quot;反事实成本&quot;：如果所有请求都用 premium 档位，总成本是多少</li><li><code>路由节省 = 反事实成本 - 实际成本</code></li><li>同时监控 <code>status=error</code> 和 <code>status=success_fallback</code> 的比例——这是降档失败率，是质量代价</li></ol>"},{"qnum":4,"qtext":"成本对比时应该和哪个基准比较：全用 standard 还是全用 premium？为什么？","answerHtml":"<p><strong>应该和&quot;全用 premium&quot;对比</strong>，理由：</p><p>路由的目标是&quot;在保证质量的前提下降低成本&quot;。&quot;全用 premium&quot;是质量最有保障的基准，路由相对于它节省了多少成本，才能衡量路由带来的实际价值。</p><p><strong>和&quot;全用 standard&quot;对比的问题</strong>：</p><ul><li>standard 档位处理复杂任务时可能质量不足（失败率高）</li><li>计算出来的&quot;节省&quot;其实包含了质量降低的隐性成本</li><li>结论可能是&quot;路由反而更贵&quot;（因为 premium 请求的成本被计入）——这让结论失真</li></ul><p><strong>正确的分析思路</strong>：</p><pre><code>路由方案总成本 vs 全用 premium 总成本\n  → 差值 = 路由节省的钱\n  → 同时看降档失败率（quality cost）\n  → 权衡：节省了多少钱，付出了多少质量代价</code></pre>"},{"qnum":5,"qtext":"综合复杂度评分（`complexity_score`）是怎么把长度、工具、关键词、历史失败率四个信号合并成一个分数的？权重是怎么设计的？","answerHtml":"<pre><code class=\"language-python\">def complexity_score(user_input, category=&quot;default&quot;, failure_stats=None):\n    weights = {&quot;length&quot;: 0.25, &quot;tool&quot;: 0.30, &quot;keyword&quot;: 0.30, &quot;failure&quot;: 0.15}\n    scores = {\n        &quot;length&quot;:  length_score(user_input),\n        &quot;tool&quot;:    tool_score(user_input),\n        &quot;keyword&quot;: keyword_score(user_input),\n        &quot;failure&quot;: failure_rate_score(category, failure_stats or {}),\n    }\n    return sum(weights[k] * scores[k] for k in weights)</code></pre><p>四个信号各自返回 0.0~1.0 的子分数，再按权重加权求和得到一个 0.0~1.0 的综合分数。<strong>权重设计逻辑</strong>：<code>tool</code>（是否需要工具调用）和 <code>keyword</code>（任务类型关键词）权重最高（各 0.30），因为这两者是对模型能力要求最直接的信号；<code>length</code>（问题长度）权重中等（0.25），因为长度只是代理指标，容易误判；<code>failure</code>（历史失败率）权重最低（0.15），因为它需要足够样本量才可靠，且是&quot;事后修正&quot;信号而非&quot;事前判断&quot;信号。</p><p><strong>记忆点</strong>：单一信号误判率高，多信号加权投票后误判率显著降低——这是 Q1 已有题目提到的&quot;局限性&quot;在算法层面的具体实现。</p>"},{"qnum":6,"qtext":"路由器的档位扫描逻辑是怎样的？为什么 `TIERS` 列表要按\"从高到低\"排列，并从高档位开始扫描？","answerHtml":"<pre><code class=\"language-python\">TIERS = [\n    ModelTier(&quot;premium&quot;,  &quot;deepseek-reasoner&quot;, ..., threshold=0.65),\n    ModelTier(&quot;standard&quot;, &quot;deepseek-chat&quot;,     ..., threshold=0.30),\n    ModelTier(&quot;lite&quot;,     &quot;deepseek-chat&quot;,     ..., threshold=0.00),\n]\n\ndef route(user_input, category=&quot;default&quot;, failure_stats=None):\n    score = complexity_score(user_input, category, failure_stats)\n    for tier in TIERS:            # 从高档位往低档位扫描\n        if score &gt;= tier.threshold:\n            return tier, score\n    return TIERS[-1], score       # 兜底：最低档位</code></pre><p><strong>扫描顺序的意义</strong>：<code>TIERS</code> 按 premium → standard → lite 排列，<code>route()</code> 依次检查 <code>score &gt;= tier.threshold</code>，命中即返回。这保证了&quot;分数刚好够格某个高档位阈值时，优先给它匹配到高档位&quot;——比如 <code>score=0.5</code>，虽然 <code>standard</code> 的阈值 0.30 也满足，但因为扫描顺序从 premium 开始，会先判断 <code>0.5 &gt;= 0.65</code>（不满足）再判断 <code>0.5 &gt;= 0.30</code>（满足），最终落在 standard。如果扫描顺序反过来（从 lite 开始），同样的分数会先命中 lite 的 <code>threshold=0.00</code>，永远无法路由到更高档位——这正是&quot;从高到低扫描&quot;这个实现细节和&quot;路由阈值宁高勿低&quot;这个设计原则（已有 Q2）在代码层面的落地方式。</p>"},{"qnum":7,"qtext":"什么是路由的回退机制（fallback）？它解决了路由器的什么风险？","answerHtml":"<p>回退机制是指：当路由到 lite/standard 档位的请求调用失败时，自动升档到 premium 重试一次：</p><pre><code class=\"language-python\">def routed_call_with_fallback(user_input, system_prompt=&quot;&quot;, category=&quot;default&quot;, failure_stats=None):\n    result = routed_call(user_input, system_prompt, category, failure_stats)\n    if result[&quot;status&quot;] == &quot;error&quot; and result[&quot;tier&quot;] != &quot;premium&quot;:\n        # 自动升档到 premium 重试\n        response = client.chat.completions.create(model=TIERS[0].model_id, ...)\n        result[&quot;answer&quot;] = response.choices[0].message.content\n        result[&quot;tier&quot;]   = f&quot;{result[&#x27;tier&#x27;]}→premium(fallback)&quot;\n        result[&quot;status&quot;] = &quot;success_fallback&quot;\n    return result</code></pre><p><strong>解决的风险</strong>：单纯依赖阈值判断的路由器不可能做到 100% 准确，一定存在&quot;误判为简单、实际需要更强能力&quot;的降档失败案例（已有 Q2 讨论过降档失败的代价）。回退机制是路由阈值保守设计之外的<strong>第二道保险</strong>——即使一次路由判断错了，失败后自动升档兜底，避免用户直接收到一个失败或质量不足的回答。日志里的 <code>status=success_fallback</code> 也是衡量路由准确率的关键指标：这个比例越高，说明阈值设置偏乐观，需要调整。</p>"},{"qnum":8,"qtext":"判断\"是否需要工具调用\"时，纯关键词匹配（`tool_score`）有什么局限？笔记里提到的更准确方法是什么？","answerHtml":"<p>关键词匹配的局限：</p><pre><code class=\"language-python\">TOOL_KEYWORDS = [&quot;查一下&quot;, &quot;帮我搜&quot;, &quot;查询&quot;, &quot;查找&quot;, &quot;计算&quot;, &quot;转换&quot;, &quot;天气&quot;, &quot;汇率&quot;, &quot;价格&quot;, &quot;翻译&quot;, &quot;搜索&quot;]</code></pre><p>这种方式本质是<strong>枚举</strong>，只能覆盖预先想到的措辞，遇到没有出现在列表里的等价表达（比如&quot;能不能帮我核实一下……&quot;）就会漏判；而且是否真的需要调用工具，往往取决于语义而非字面关键词是否出现。</p><p><strong>更准确的方法</strong>：用一个便宜的小模型先做一次&quot;是否需要工具&quot;的二分类判断（成本极低，因为只是个二分类任务），再根据这个判断结果决定主请求该用哪个模型档位——本质上是&quot;用一次低成本的 LLM 调用替代关键词枚举，把语义判断问题交给模型而不是规则&quot;。这和 Day 54 输出护栏里&quot;规则匹配 vs 模型分类&quot;的取舍是同一个工程思路：能枚举的用规则，语义类判断用模型。</p>"}]},{"name":"深化阶段·模型网关","questions":[{"qnum":1,"qtext":"模型网关解决什么问题？没有网关时的痛点是什么？","answerHtml":"<p>模型网关在<strong>应用业务代码和具体 Provider SDK 之间</strong>加一个适配层，解决以下痛点：</p><div class=\"table-wrap\"><table><thead><tr><th>痛点</th><th>具体表现</th></tr></thead><tbody><tr><td><strong>Provider 换不动</strong></td><td>SDK 调用散落在各业务文件，换 Provider 需要改 N 个地方</td></tr><tr><td><strong>鉴权逻辑重复</strong></td><td>API Key 出现在多个文件，管理混乱，容易泄露</td></tr><tr><td><strong>横切逻辑各自实现</strong></td><td>日志 / 重试 / 限流在每个调用点单独写，行为不一致</td></tr><tr><td><strong>成本无法聚合</strong></td><td>没有统一出口，难以统计所有调用的总 Token 消耗</td></tr></tbody></table></div><p>网关把上述问题收拢到一层处理，业务代码只和网关交互，完全不感知底层 Provider 的差异。</p>"},{"qnum":2,"qtext":"网关层的职责边界是什么？哪些事情网关应该做，哪些不应该做？","answerHtml":"<p><strong>网关应该做</strong>：</p><pre><code>✅ 统一 Provider 接口（屏蔽 SDK 差异）\n✅ 集中鉴权（API Key 只在网关层出现）\n✅ 统一请求/响应结构（GatewayRequest / GatewayResponse）\n✅ 统一日志（结构化写入，对接成本统计）\n✅ 统一路由（按复杂度选模型档位）\n✅ 统一重试（指数退避，业务代码无感知）\n✅ 为限流预留接入点</code></pre><p><strong>网关不应该做</strong>：</p><pre><code>❌ 业务逻辑（判断用户意图、构建 Prompt）\n❌ Prompt 工程（System Prompt 组装）\n❌ 输出解析（JSON 提取、格式校验）\n❌ 上层应用状态管理（对话历史、用户偏好）</code></pre>"},{"qnum":3,"qtext":"Provider 配置为什么要集中到一个文件？切换 Provider 时业务代码如何做到零改动？","answerHtml":"<p><strong>集中配置的原因</strong>：</p><ul><li>API Key、base_url、默认模型都是环境差异，不是业务逻辑，应该和业务代码分离</li><li>集中后，一份 <code>config.py</code> 就是所有 Provider 信息的单一来源，审计和更新都只在一处</li></ul><p><strong>零改动的实现方式</strong>：</p><pre><code class=\"language-python\"># config.py\nACTIVE_PROVIDER = &quot;deepseek&quot;   # ← 只改这一行\n\n# gateway.py\ndef __init__(self, provider_name=ACTIVE_PROVIDER):\n    cfg = PROVIDERS[provider_name]\n    self._client = OpenAI(api_key=cfg.api_key, base_url=cfg.base_url)\n\n# weather_agent.py（业务代码，永远不碰）\nfrom gateway import gateway\nresp = gateway.complete(req)   # 不知道也不关心底层用了哪个 Provider</code></pre><p>关键设计：所有 Provider 都兼容 OpenAI 接口格式（base_url 不同，但 <code>chat.completions.create</code> 接口相同），所以只用一个 <code>OpenAI</code> client，切换时只换 <code>api_key</code> 和 <code>base_url</code>。</p>"},{"qnum":4,"qtext":"LiteLLM 的核心价值是什么？它和手写网关的根本区别在哪里？","answerHtml":"<p><strong>LiteLLM 的核心价值</strong>：用统一的 <code>litellm.completion(model=&quot;provider/model-id&quot;, messages=[...])</code> 调用 100+ 个 Provider，不需要为每个 Provider 单独写适配代码。还内置了成本统计、Provider 回退、重试等常用能力。</p><p><strong>与手写网关的根本区别</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>手写网关</th><th>LiteLLM</th></tr></thead><tbody><tr><td><strong>覆盖范围</strong></td><td>只支持手动适配的 Provider</td><td>100+ Provider 开箱即用</td></tr><tr><td><strong>实现方式</strong></td><td>自己写适配代码（几百行）</td><td><code>pip install litellm</code>，一行调用</td></tr><tr><td><strong>可控性</strong></td><td>完全掌控，可深度定制</td><td>依赖 LiteLLM 实现，修改需 fork 源码</td></tr><tr><td><strong>学习价值</strong></td><td>理解网关层的设计原理</td><td>直接用，跳过原理学习</td></tr></tbody></table></div><p>手写网关是理解&quot;为什么要有网关、网关做什么&quot;的最好方式；LiteLLM 是生产环境&quot;快速接多 Provider&quot;的最佳工具。</p>"},{"qnum":5,"qtext":"什么情况下选自研网关，什么情况下选 LiteLLM？判断标准是什么？","answerHtml":"<p><strong>选自研网关的条件</strong>（满足任一）：</p><ul><li>Provider 固定（1-2 个），长期不变，不需要快速切换</li><li>路由逻辑与业务强耦合，需要深度定制</li><li>极端控制依赖（嵌入式、边缘部署、安全审计严格的场景）</li><li>学习目的：理解网关设计原理</li></ul><p><strong>选 LiteLLM 的条件</strong>（满足任一）：</p><ul><li>需要同时对接 3 个以上 Provider</li><li>需要内置的 Provider 回退、成本追踪、缓存</li><li>团队规模大，追求标准化而非重复造轮子</li><li>需要 LiteLLM Proxy（统一 HTTP API，让任何语言的客户端都能调用）</li></ul><p><strong>本路线建议</strong>：先手写理解原理，再按需引入 LiteLLM——两者不互斥，手写网关是思维模型，LiteLLM 是生产工具。</p>"},{"qnum":6,"qtext":"网关层承载的日志、路由、重试三个横切关注点，分别是怎么集成进 `complete()` 方法的？","answerHtml":"<p>三者都以&quot;业务代码无感知、只在网关内部生效&quot;的方式接入：</p><pre><code class=\"language-python\"># ① 统一日志（对接 Day 44）：在 complete() 开头和结尾各写一条结构化日志\ndef complete(self, req):\n    log_request(trace_id=..., event=&quot;request_start&quot;)\n    # ... 调用逻辑 ...\n    log_request(trace_id=..., event=&quot;request_complete&quot;, tokens_input=..., cost_usd=...)\n\n# ② 统一路由（对接 Day 47）：如果调用方没指定 model，网关自动路由\ndef complete(self, req):\n    if not req.model:\n        tier, score = route(user_text)\n        req = GatewayRequest(**{**req.__dict__, &quot;model&quot;: tier.model_id})\n\n# ③ 统一重试：在 complete() 外面包一层退避重试\ndef complete_with_retry(self, req, max_retries=3):\n    for attempt in range(max_retries):\n        resp = self.complete(req)\n        if resp.status == &quot;success&quot;:\n            return resp\n        time.sleep(2 ** attempt)\n    return resp</code></pre><p><strong>共同特点</strong>：业务代码只调用 <code>gateway.complete(req)</code>，完全不知道日志怎么写、模型怎么选、失败了怎么重试——这三件事都被&quot;收拢&quot;进网关这一层，这正是网关作为&quot;应用代码和 Provider 之间适配层&quot;的价值所在。</p>"},{"qnum":7,"qtext":"`GatewayRequest` / `GatewayResponse` 这套统一请求/响应结构的设计意图是什么？为什么不直接让业务代码拼装 OpenAI SDK 的原生 messages？","answerHtml":"<pre><code class=\"language-python\">@dataclass\nclass GatewayRequest:\n    messages: list[dict]\n    system_prompt: str = &quot;&quot;\n    model: str = &quot;&quot;          # 留空则用 Provider 的 default_model\n    temperature: float = 0.0\n    max_tokens: int = 2048\n    user_id: str = &quot;&quot;        # 用于限流和日志\n    trace_id: str = &quot;&quot;       # 用于日志关联\n\n@dataclass\nclass GatewayResponse:\n    content: str\n    model: str; provider: str\n    tokens_input: int; tokens_output: int; cost_usd: float\n    latency_ms: int; status: str; error: str = &quot;&quot;</code></pre><p><strong>设计意图</strong>：</p><ol><li><strong>与具体 Provider 解耦</strong>——<code>GatewayRequest</code> 不关心底层调用的是 OpenAI 格式还是别的格式，网关内部负责转换；业务代码只需要构造这一个统一结构</li><li><strong>预留横切关注点的挂载点</strong>——<code>user_id</code>、<code>trace_id</code> 这两个字段本身不是&quot;业务数据&quot;，而是专门为 Day 44 日志关联、Day 49 限流预留的接口；如果直接用原生 <code>messages</code> 数组，就没有地方存放这些元信息</li><li><strong>响应结构统一携带成本和状态</strong>——<code>GatewayResponse</code> 里的 <code>tokens_input/cost_usd/latency_ms/status</code> 都是原生 OpenAI SDK 响应对象不直接暴露或格式不统一的字段，网关统一计算好再交给业务代码，业务代码不需要自己算成本</li></ol>"},{"qnum":8,"qtext":"LiteLLM 的内置回退（`fallbacks`）和 LiteLLM Proxy 分别解决什么问题？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>用法</th><th>解决的问题</th></tr></thead><tbody><tr><td><strong>内置回退</strong></td><td><code>litellm.completion(model=&quot;deepseek/deepseek-chat&quot;, messages=[...], fallbacks=[&quot;openai/gpt-4o-mini&quot;])</code></td><td>主模型调用失败时（限速、超时、服务异常）自动切换到备用模型重试，不需要业务代码自己写 try/except 切换逻辑</td></tr><tr><td><strong>LiteLLM Proxy</strong></td><td><code>litellm --model deepseek/deepseek-chat --port 4000</code>，作为独立进程运行，暴露统一的 HTTP API</td><td>让&quot;任何能调 OpenAI 接口的代码&quot;都能直接指向 <code>localhost:4000</code>，即使调用方不是 Python（比如前端直接调、或者用别的语言写的服务），也不需要引入 LiteLLM 的 Python SDK</td></tr></tbody></table></div><p><strong>核心区别</strong>：内置回退是 Python 库级别的能力（进程内直接调用），LiteLLM Proxy 是把网关能力封装成一个独立服务，任何语言的客户端都能通过标准 HTTP 请求使用——这是&quot;网关&quot;从&quot;一段代码&quot;进化成&quot;一个独立服务&quot;的形态，适合多语言技术栈共享同一套网关能力的场景。</p>"}]},{"name":"深化阶段·限流与配额","questions":[{"qnum":1,"qtext":"LLM 应用为什么必须做应用层限流？只依赖 Provider 的 RPM 限制有什么问题？","answerHtml":"<p>LLM API 按 Token 计费，成本失控是 LLM 应用特有的风险——普通 Web 应用的 Bug 顶多让服务崩溃，LLM 应用的 Bug 可能带来一张巨额账单。不限流的四类后果：</p><div class=\"table-wrap\"><table><thead><tr><th>场景</th><th>后果</th></tr></thead><tbody><tr><td>恶意用户循环调用</td><td>几分钟内耗尽大量 Token</td></tr><tr><td>爬虫或脚本滥用</td><td>打满 Provider 配额，影响其他用户</td></tr><tr><td>Bug 触发死循环</td><td>重试死循环，成本指数级增长</td></tr><tr><td>流量突发峰值</td><td>批量 429，服务降级</td></tr></tbody></table></div><p><strong>只依赖 Provider 限流的问题</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>Provider 限流</th><th>应用层限流</th></tr></thead><tbody><tr><td>触发后响应</td><td>返回 429，调用方需自行处理</td><td>网关直接拒绝，返回友好提示</td></tr><tr><td>粒度</td><td>按 API Key（全账号共享）</td><td>按用户ID / IP / 功能模块</td></tr><tr><td>可定制性</td><td>固定，无法改变</td><td>完全可控（不同用户不同配额）</td></tr><tr><td>成本保护</td><td>保护 Provider 资源</td><td>保护自己的账单</td></tr></tbody></table></div><p>两者互补：应用层限流是第一道防线，Provider 限流是兜底保障。</p>"},{"qnum":2,"qtext":"固定窗口和滑动窗口限流的本质区别是什么？固定窗口的\"边界突刺\"具体是怎么产生的？","answerHtml":"<p><strong>本质区别</strong>：固定窗口把时间切成等长的不重叠段，每段独立计数，段内超限即拒绝；滑动窗口则以&quot;当前时刻向前 N 秒&quot;为窗口，随时间流动，任意时间点的窗口内请求数都不超限。</p><p><strong>边界突刺的产生</strong>：</p><p>假设上限 5 次/分钟：</p><pre><code>:59  发 5 次 → 第 1 分钟消耗完（5 次）\n1:01 发 5 次 → 第 2 分钟重置，可以通过（再 5 次）\n→ 2 秒内共 10 次请求，实际承受了 2 倍上限的压力</code></pre><p>固定窗口的计数器在窗口边界瞬间归零，攻击者可以在边界前后各发满一个窗口配额，突破实际限速。滑动窗口没有固定边界，任意 60 秒区间内都严格不超过 5 次，消除了突刺。</p>"},{"qnum":3,"qtext":"滑动窗口限流器的核心数据结构和逻辑是什么？实现时要注意什么？","answerHtml":"<p><strong>核心数据结构</strong>：<code>dict[key, deque]</code>——每个限流 key 对应一个时间戳双端队列。</p><p><strong>核心逻辑</strong>：</p><pre><code class=\"language-python\">def is_allowed(self, key: str) -&gt; bool:\n    now = time.monotonic()\n    cutoff = now - self.window_seconds\n    dq = self._timestamps[key]\n\n    # 1. 清理窗口外的旧记录\n    while dq and dq[0] &lt; cutoff:\n        dq.popleft()\n\n    # 2. 判断是否超限\n    if len(dq) &gt;= self.max_requests:\n        return False\n\n    # 3. 记录本次请求时间戳\n    dq.append(now)\n    return True</code></pre><p><strong>实现注意点</strong>：</p><ul><li>**用 <code>time.monotonic()</code> 而非 <code>time.time()</code>**：单调时钟不受系统时间跳变影响，更适合计时场景</li><li><strong>内存管理</strong>：用户数量大时，每个 key 的 deque 会积累时间戳。可设置 TTL 或定期清理长时间无请求的 key</li><li>**超限时提供 <code>retry_after</code>**：<code>dq[0] + window_seconds - now</code> 是最早一条记录过期的时间，即&quot;最快多久后可以重试&quot;</li></ul>"},{"qnum":4,"qtext":"限流触发时应该返回什么？为什么不能用异常或 HTTP 500 来表达超限？","answerHtml":"<p><strong>正确的超限响应</strong>：</p><pre><code class=\"language-python\">GatewayResponse(\n    status=&quot;rate_limited&quot;,        # 专用状态，区别于 &quot;error&quot;，可被精确识别\n    error=&quot;请求过于频繁，请在 X 秒后重试。&quot;,  # 含重试时间，用户可读\n    cost_usd=0.0,                 # 未调用 LLM，零成本\n    latency_ms=0,                 # 立即返回，不阻塞\n)</code></pre><p><strong>为什么不能用异常或 HTTP 500</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>做法</th><th>问题</th></tr></thead><tbody><tr><td>抛出未捕获异常</td><td>让调用方崩溃，无法区分限流和真实错误</td></tr><tr><td>返回 HTTP 500</td><td>掩盖了限流语义；调用方以为是服务故障，可能触发告警</td></tr><tr><td>只返回 &quot;error&quot;</td><td>调用方不知道是否应该重试、何时重试</td></tr></tbody></table></div><p>正确做法的三个原则：<strong>语义精确</strong>（<code>rate_limited</code> ≠ <code>error</code>）、<strong>可操作</strong>（提供 <code>retry_after</code>）、<strong>零成本</strong>（拒绝不产生 LLM 调用费）。</p>"},{"qnum":5,"qtext":"如何设计多层限流叠加策略？按用户、按功能、按 IP 三种维度各解决什么问题？","answerHtml":"<p><strong>三个维度的职责</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>限流 key</th><th>解决的问题</th></tr></thead><tbody><tr><td>按用户 ID</td><td><code>f&quot;{user_id}&quot;</code></td><td>精细控制单个用户的总调用量，区分免费/付费等级</td></tr><tr><td>按用户+功能</td><td><code>f&quot;{user_id}:{func_name}&quot;</code></td><td>昂贵功能（如 travel_planner）单独设严格配额，防止单个功能把用户配额耗尽</td></tr><tr><td>按 IP</td><td><code>f&quot;ip:{ip_addr}&quot;</code></td><td>未登录/匿名用户的兜底防护，防止绕过用户认证的滥用</td></tr></tbody></table></div><p><strong>多层叠加的检查顺序</strong>：</p><pre><code class=\"language-python\"># 先按用户（最精细）→ 再按功能（昂贵功能保护）→ 最后按 IP（匿名兜底）\nresult = check_user_limit(user_id, tier)\nif not result.allowed: return result\n\nif func_name in EXPENSIVE_FUNCTIONS:\n    result = check_function_limit(user_id, func_name)\n    if not result.allowed: return result\n\nif is_anonymous(user_id):\n    result = check_ip_limit(ip_addr)\n    if not result.allowed: return result</code></pre><p><strong>配额分级示例</strong>：</p><pre><code>free 用户：10 次/60 秒\npro 用户：60 次/60 秒\ntravel_planner 功能：3 次/60 秒（无论用户等级）\n匿名 IP：20 次/60 秒</code></pre><p>叠加策略的核心是&quot;多把锁&quot;——每个维度只管自己的范围，都通过才允许请求。</p>"},{"qnum":6,"qtext":"令牌桶（Token Bucket）算法的原理是什么？它和滑动窗口相比，核心差异体现在哪里？","answerHtml":"<p><strong>原理</strong>：桶里有令牌，每次请求消耗一个令牌，令牌以固定速率补充；桶满则停止补充。桶里有积累令牌时可以连续通过多个请求（允许突发）：</p><pre><code class=\"language-python\">class TokenBucketRateLimiter:\n    def __init__(self, capacity: int, refill_rate: float):\n        self.capacity = capacity          # 桶的最大容量（允许的突发量）\n        self.refill_rate = refill_rate    # 每秒补充的令牌数\n\n    def is_allowed(self, key: str) -&gt; bool:\n        now = time.monotonic()\n        tokens, last_time = self._buckets.get(key, (self.capacity, now))\n        elapsed = now - last_time\n        tokens = min(self.capacity, tokens + elapsed * self.refill_rate)  # 补充令牌\n        if tokens &lt; 1.0:\n            self._buckets[key] = (tokens, now)\n            return False\n        self._buckets[key] = (tokens - 1.0, now)\n        return True</code></pre><p><strong>核心差异</strong>：滑动窗口是&quot;严格限速&quot;——任意时间窗口内的请求数都不允许超过上限，不允许突发；令牌桶允许&quot;合理的突发&quot;——只要桶里积累了足够的令牌（比如长时间没有请求，令牌攒满了），可以在短时间内连续通过多个请求，之后再按补充速率平滑限速。<strong>一句话</strong>：滑动窗口保证的是&quot;任意窗口都不超限&quot;，令牌桶保证的是&quot;长期平均速率不超限，但允许短期突发&quot;。</p>"},{"qnum":7,"qtext":"固定窗口、滑动窗口、令牌桶三种算法在实现复杂度、精确性、是否允许突发、内存开销上分别如何？各自适合什么场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>固定窗口</th><th>滑动窗口</th><th>令牌桶</th></tr></thead><tbody><tr><td>实现复杂度</td><td>低</td><td>中</td><td>中</td></tr><tr><td>精确性</td><td>低（有边界突刺）</td><td>高（任意窗口精确）</td><td>高（平滑）</td></tr><tr><td>允许突发</td><td>有限（仅边界处）</td><td>否（严格限制）</td><td>是（可配置桶容量）</td></tr><tr><td>内存开销</td><td>低（一个计数器）</td><td>中（需存时间戳队列）</td><td>低（两个数值：令牌数+上次补充时间）</td></tr><tr><td>适合场景</td><td>粗粒度保护，要求简单</td><td>精确限速，生产首选</td><td>允许突发的 API 网关场景</td></tr></tbody></table></div><p><strong>本路线的选择</strong>：笔记里给应用网关接入的是滑动窗口（精确度最高，适合按用户精细限速的场景），但三种算法不是互相替代关系——固定窗口适合&quot;要求极简、误差可以接受&quot;的场景，令牌桶适合&quot;需要容忍短时突发流量、但长期要控制速率&quot;的场景，具体用哪种取决于业务对&quot;突发容忍度&quot;和&quot;实现成本&quot;的权衡。</p>"},{"qnum":8,"qtext":"不同用户等级的配额（`QuotaConfig`）应该怎么设计？给出笔记里的具体分级示例。","answerHtml":"<pre><code class=\"language-python\">@dataclass\nclass QuotaConfig:\n    max_requests: int      # 窗口内最大请求数\n    window_seconds: int    # 窗口大小（秒）\n    tier: str              # 用户等级名称\n\nQUOTA_TIERS: dict[str, QuotaConfig] = {\n    &quot;free&quot;:     QuotaConfig(max_requests=10,   window_seconds=60, tier=&quot;free&quot;),\n    &quot;pro&quot;:      QuotaConfig(max_requests=60,   window_seconds=60, tier=&quot;pro&quot;),\n    &quot;premium&quot;:  QuotaConfig(max_requests=300,  window_seconds=60, tier=&quot;premium&quot;),\n    &quot;internal&quot;: QuotaConfig(max_requests=1000, window_seconds=60, tier=&quot;internal&quot;),\n}</code></pre><p><strong>设计要点</strong>：配额差异化是限流器从&quot;一刀切&quot;进化到&quot;按业务价值分层&quot;的关键——免费用户配额最紧（防止滥用/控制成本），付费等级依次放宽，内部调用（如自己团队的服务间调用）给最宽松的配额。限流器内部按 <code>f&quot;{user_id}:{tier}&quot;</code> 作为 key 隔离不同用户的计数窗口，这样同一个限流器实例可以同时服务所有等级的用户，不需要为每个等级单独实例化。</p>"}]},{"name":"深化阶段·上下文工程","questions":[{"qnum":1,"qtext":"上下文工程和 Prompt 工程的本质区别是什么？为什么需要独立对待？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>Prompt 工程</th><th>上下文工程</th></tr></thead><tbody><tr><td><strong>核心问题</strong></td><td>怎么写出好的指令</td><td>每次请求往窗口里装什么、装多少</td></tr><tr><td><strong>时间维度</strong></td><td>一次性设计</td><td>每次请求都要计算</td></tr><tr><td><strong>输入变量</strong></td><td>静态（一次写好）</td><td>动态（RAG 结果/历史/工具返回持续变化）</td></tr><tr><td><strong>主要约束</strong></td><td>表达清晰、格式正确</td><td>Token 预算有限，超限直接报错</td></tr></tbody></table></div><p><strong>为什么需要独立对待</strong>：System Prompt 写得再好，如果上下文窗口被无关历史消息塞满，或 RAG 检索到的内容和问题不匹配，模型仍然会输出低质量的结果。Prompt 工程解决&quot;写什么&quot;，上下文工程解决&quot;装什么、装多少、怎么裁剪&quot;——两个问题的决策频率和变量完全不同。</p>"},{"qnum":2,"qtext":"LLM 应用的上下文由哪五类内容组成？为什么要固定它们的排列顺序？","answerHtml":"<p><strong>五类内容</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>分区</th><th>内容</th><th>可裁剪性</th></tr></thead><tbody><tr><td>① System Prompt</td><td>角色定义、行为规则、输出格式</td><td>不可裁剪</td></tr><tr><td>② RAG 检索结果</td><td>从知识库检索到的相关文档片段</td><td>按相关度裁剪</td></tr><tr><td>③ 工具返回结果</td><td>已执行工具的输出（天气、搜索等）</td><td>字段级压缩</td></tr><tr><td>④ 对话历史</td><td>之前的 user/assistant 消息</td><td>按时间裁剪</td></tr><tr><td>⑤ 当前用户消息</td><td>本次用户输入</td><td>不可裁剪</td></tr></tbody></table></div><p><strong>固定顺序的原因</strong>：</p><ul><li>System Prompt 在最前：模型先建立&quot;角色框架&quot;，后续内容都在这个框架内解读</li><li>RAG 在历史之前：参考资料放在前面，避免被历史消息淹没，也更接近&quot;开头&quot;（&quot;Lost in the Middle&quot;效应：模型对中间内容关注度下降）</li><li>当前消息在最后：最接近生成位置，被模型重点关注</li></ul>"},{"qnum":3,"qtext":"对话历史的裁剪策略是什么？为什么要成对删除而不是逐条删除？","answerHtml":"<p><strong>裁剪策略</strong>：从最老的消息开始删，保留最近的对话轮次。</p><pre><code class=\"language-python\">def trim_history(history, max_tokens):\n    while history and messages_tokens(history) &gt; max_tokens:\n        if len(history) &gt;= 2:\n            history = history[2:]   # 成对删：最老的 user + assistant\n        else:\n            history = history[1:]\n    return history</code></pre><p><strong>为什么成对删除</strong>：</p><p>对话历史的消息是 <code>[user, assistant, user, assistant, ...]</code> 的交替结构。如果只删 <code>user</code> 不删对应的 <code>assistant</code>，会出现&quot;孤立的 assistant 消息&quot;——模型看到一条 assistant 消息但不知道对应的问题是什么，上下文语义断裂。成对删除确保每个 assistant 回复都有对应的 user 问题，对话结构保持完整。</p><p><strong>进阶策略</strong>：当删到只剩 4 轮仍超限时，改用摘要替换——把旧历史压缩成一条系统消息 <code>[早期对话摘要] ...</code>，保留最近 N 轮原始消息。</p>"},{"qnum":4,"qtext":"RAG 检索结果的裁剪策略是什么？什么样的文档应该优先被丢弃？","answerHtml":"<p><strong>裁剪策略</strong>：按相关度分数从高到低保留文档，超出预算后停止添加。</p><pre><code class=\"language-python\">def trim_rag_results(docs, max_tokens):\n    sorted_docs = sorted(docs, key=lambda d: d[&quot;score&quot;], reverse=True)\n    result, used = [], 0\n    for doc in sorted_docs:\n        tokens = estimate_tokens(doc[&quot;content&quot;])\n        if used + tokens &gt; max_tokens:\n            break   # 后续文档相关度更低，直接停止\n        result.append(doc)\n        used += tokens\n    return result</code></pre><p><strong>优先丢弃的文档</strong>：相关度分数低的文档。这里有一个重要决策：不是按&quot;出现顺序&quot;截断，而是按&quot;相关度倒序&quot;保留——宁可少几篇，也要保证留
