ger.info(&quot;最终回答（%.2fs）&quot;, time.monotonic() - t2)</code></pre><p>日志的核心价值：在调试时能清楚看到&quot;模型有没有调工具、调了哪个工具、工具返回了什么、最终回答是什么&quot;，不需要逐行 print。</p>"},{"qnum":4,"qtext":"多轮对话中为什么不能把 tool_calls 消息从历史里删掉？","answerHtml":"<p>因为 <code>tool_calls</code> 消息（<code>role: assistant</code>）和 <code>tool</code> 消息（<code>role: tool</code>）是一对强绑定的记录——<code>tool</code> 消息里的 <code>tool_call_id</code> 必须和对应 <code>assistant</code> 消息里的 <code>tc.id</code> 一致，模型用这个 ID 配对&quot;哪个工具结果对应哪次调用&quot;。</p><pre><code>完整消息历史（含工具调用轮次）：\n\n[system]    &quot;你是智能助手...&quot;\n[user]      &quot;北京天气怎么样？&quot;\n[assistant] {tool_calls: [{id: &quot;call_abc&quot;, name: &quot;get_weather&quot;, args: ...}]}  ← 不能删\n[tool]      {tool_call_id: &quot;call_abc&quot;, content: &quot;北京晴，22°C&quot;}               ← 不能删\n[assistant] &quot;北京今天晴天，22°C，非常适合出行。&quot;\n[user]      &quot;上海呢？&quot;</code></pre><p><strong>删掉会怎样</strong>：</p><ul><li>如果只保留最终 <code>assistant</code> 回答（删掉 <code>tool_calls</code> 和 <code>tool</code> 消息），下一轮模型不知道第 1 轮是通过工具获取了实时天气，可能会认为&quot;北京晴，22°C&quot;是模型自己的判断，而非真实数据，导致第 2 轮误用</li><li>API 层面：如果删掉 <code>tool_calls</code> 但保留 <code>tool</code> 消息（<code>tool_call_id</code> 找不到对应的 <code>assistant</code> 消息），API 会直接报错</li></ul>"},{"qnum":5,"qtext":"如何从零实现一个支持多轮对话、带日志记录的单工具调用完整 Demo？描述关键设计决策。","answerHtml":"<p>核心设计：<strong>共享消息历史 + 日志记录每步 + 错误返回 dict + 工具注册表解耦</strong>。</p><pre><code class=\"language-python\">SYSTEM_PROMPT = &quot;你是智能助手，可查询天气和汇率，询问实时信息时优先使用工具。&quot;\nTOOL_REGISTRY = {&quot;get_weather&quot;: get_weather, &quot;get_exchange_rate&quot;: get_exchange_rate}\n\ndef chat(user_input: str, history: list = None) -&gt; tuple[str, list]:\n    if history is None:\n        history = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: SYSTEM_PROMPT}]\n    history.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input})\n    \n    # 第一次调用：让模型决策\n    msg = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=history,\n        tools=TOOLS, tool_choice=&quot;auto&quot;, temperature=0,\n    ).choices[0].message\n    \n    if not msg.tool_calls:\n        history.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: msg.content})\n        return msg.content, history\n    \n    history.append(msg)  # 必须完整保留 tool_calls 消息\n    for tc in msg.tool_calls:\n        result = TOOL_REGISTRY.get(tc.function.name,\n                     lambda **_: {&quot;error&quot;: True, &quot;message&quot;: &quot;未知工具&quot;}\n                 )(**json.loads(tc.function.arguments))\n        history.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                        &quot;content&quot;: json.dumps(result, ensure_ascii=False)})\n    \n    # 第二次调用：生成最终回答\n    answer = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=history, tools=TOOLS, temperature=0,\n    ).choices[0].message.content\n    history.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: answer})\n    return answer, history\n\n# 使用方式（多轮）\nhistory = None\nfor q in [&quot;北京今天天气？&quot;, &quot;上海呢？两个城市哪个更热？&quot;, &quot;1000人民币换多少美元？&quot;]:\n    answer, history = chat(q, history)\n    print(f&quot;Q: {q}\\nA: {answer}\\n&quot;)</code></pre><p><strong>五个关键设计决策</strong>：</p><ul><li>**<code>history</code> 跨轮共享**：函数返回更新后的 <code>history</code>，由调用方持有并传入下一轮，实现多轮记忆</li><li>**<code>tool_calls</code> 完整入历史**：直接 <code>history.append(msg)</code>，保留 <code>tool_calls</code> 原始对象，防止 <code>tool_call_id</code> 对不上</li><li>**<code>TOOL_REGISTRY</code> 字典分发**：比 <code>if/elif</code> 可扩展，新增工具只加一行注册</li><li><strong>工具错误返回 dict</strong>：未知工具返回 <code>{&quot;error&quot;: True, ...}</code>，让模型生成用户友好的提示而不是程序崩溃</li><li>**<code>temperature=0</code>**：两次调用都设 0，保证触发行为和最终回答的一致性，方便测试</li></ul>"}]},{"name":"添加简单界面","questions":[{"qnum":1,"qtext":"Streamlit 和 Gradio 分别适合什么场景？LLM Demo 应该选哪个？","answerHtml":"<p>两者都是把 Python 函数变成 Web 应用的框架，但侧重点不同：</p><div class=\"table-wrap\"><table><thead><tr><th>对比维度</th><th>Streamlit</th><th>Gradio</th></tr></thead><tbody><tr><td>核心定位</td><td>数据应用（图表、报表、Dashboard）</td><td>ML/AI 模型 Demo（输入 → 推理 → 输出）</td></tr><tr><td>聊天界面</td><td>需手动用 <code>st.chat_message</code> + <code>st.chat_input</code> 搭建</td><td>内置 <code>gr.ChatInterface</code>，5 行代码完成</td></tr><tr><td>组件丰富度</td><td>更丰富（数据表格、图表、地图）</td><td>AI 场景专用（Image/Audio/Chatbot）</td></tr><tr><td>学习曲线</td><td>略高（需理解响应式重渲染机制）</td><td>更低（函数签名即界面）</td></tr><tr><td>流式输出</td><td><code>st.write_stream()</code></td><td>函数用 <code>yield</code> 即可</td></tr></tbody></table></div><p><strong>结论</strong>：</p><ul><li>LLM 聊天/工具 Demo → <strong>Gradio</strong>（内置 ChatInterface，更少代码，更快展示）</li><li>数据分析/监控面板 → <strong>Streamlit</strong>（图表和布局更灵活）</li><li>两者差距不大，选你更熟悉的即可；Gradio 在 LLM Demo 场景的&quot;入门成本&quot;确实更低</li></ul>"},{"qnum":2,"qtext":"gr.Interface 和 gr.ChatInterface 有什么区别？各适用于什么场景？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>gr.Interface</th><th>gr.ChatInterface</th></tr></thead><tbody><tr><td>适用交互模式</td><td>一次性：单次输入 → 单次输出</td><td>多轮：保持对话历史的聊天</td></tr><tr><td>历史管理</td><td>不自动管理，每次独立</td><td>自动维护 <code>history</code> 列表</td></tr><tr><td>函数签名</td><td><code>fn(input1, input2) → output</code></td><td><code>fn(message, history) → reply</code></td></tr><tr><td>内置 UI</td><td>输入/输出并排展示</td><td>气泡式聊天窗口 + 输入框</td></tr><tr><td>典型场景</td><td>文本摘要、情感分析、翻译</td><td>聊天机器人、对话式助手</td></tr></tbody></table></div><pre><code class=\"language-python\"># gr.Interface：一次性处理\ndef summarize(text):\n    return call_llm(f&quot;总结：{text}&quot;)\ngr.Interface(fn=summarize, inputs=&quot;textbox&quot;, outputs=&quot;textbox&quot;).launch()\n\n# gr.ChatInterface：多轮对话（Gradio 自动传入 history）\ndef chat(message, history):\n    messages = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是助手&quot;}]\n    messages += history\n    messages.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: message})\n    return call_llm(messages)\ngr.ChatInterface(fn=chat).launch()</code></pre><p>需要<strong>自定义布局</strong>（比如左侧聊天 + 右侧展示工具链）时，用 <code>gr.Blocks</code>，可以自由组合 <code>gr.Chatbot</code>、<code>gr.Textbox</code>、<code>gr.Markdown</code> 等组件。</p>"},{"qnum":3,"qtext":"如何在 Gradio 界面里实现流式输出？和非流式有什么体验差异？","answerHtml":"<p>Gradio 检测到函数是生成器（包含 <code>yield</code>）时自动开启流式模式：</p><pre><code class=\"language-python\"># 非流式：等待完整结果，文字一次性出现\ndef chat(message, history):\n    response = client.chat.completions.create(model=&quot;deepseek-chat&quot;, messages=...)\n    return response.choices[0].message.content   # return\n\n# 流式：文字逐渐出现（打字机效果）\ndef chat_stream(message, history):\n    stream = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=...,\n        stream=True,    # 关键：API 层开启流式\n    )\n    partial = &quot;&quot;\n    for chunk in stream:\n        delta = chunk.choices[0].delta.content\n        if delta:\n            partial += delta\n            yield partial   # 每个 chunk 都更新显示</code></pre><p><strong>体验差异</strong>：</p><pre><code>非流式：[等待 2 秒]……→ 完整文字突然出现\n流式：  文字逐字出现……体验更流畅，用户感知的等待时间更短</code></pre><p>流式输出的实际价值：长回答（&gt;200 字）时，用户不需要盯着空白屏幕等 2–3 秒，看到第一个字就知道在响应，心理等待感显著降低。</p>"},{"qnum":4,"qtext":"gr.State 是什么？为什么多轮对话需要它？不用会发生什么？","answerHtml":"<p><code>gr.State</code> 是 Gradio 的<strong>会话级持久化存储</strong>——每个用户 Tab 独立拥有一份，跨请求保持（HTTP 请求本身是无状态的，Gradio 在 WebSocket 层为每个 Session 维护 State）。</p><p><strong>不用 gr.State 时</strong>：每次用户发消息，函数收到的 <code>history</code> 都是空的——模型不记得之前的对话。</p><pre><code class=\"language-python\"># ❌ 不用 State：每次对话历史丢失\ndef chat(message, history):   # history 每次都是 []\n    ...\n\n# ✅ 用 gr.State：历史跨请求保持\nwith gr.Blocks() as demo:\n    messages_state = gr.State(value=None)   # 每个用户 Session 独立的 State\n    \n    def respond(user_msg, state):\n        if state is None:\n            state = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是助手&quot;}]\n        state.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_msg})\n        reply = call_llm(state)\n        state.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: reply})\n        return reply, state   # 必须 return 更新后的 state\n    \n    # outputs 里包含 messages_state，才能把更新后的值存回去\n    btn.click(respond, [msg_input, messages_state], [output, messages_state])</code></pre><p>关键规则：<code>gr.State</code> 的值通过函数的 <strong>return</strong> 传回，不能在函数内直接修改外部变量。</p>"},{"qnum":5,"qtext":"如何从零搭建一个展示工具调用链的 LLM Demo 界面？描述关键设计决策。","answerHtml":"<p>核心设计：<strong>gr.Blocks 自定义布局 + gr.State 保持历史 + 调用链格式化为 Markdown</strong>。</p><pre><code class=\"language-python\">with gr.Blocks() as demo:\n    messages_state = gr.State(value=None)   # 工作流消息历史\n    chain_state = gr.State(value=&quot;&quot;)        # 累积的调用链文本\n    \n    with gr.Row():\n        with gr.Column(scale=3):\n            chatbot = gr.Chatbot(type=&quot;messages&quot;)  # 左侧：对话\n            msg_input = gr.Textbox()\n        with gr.Column(scale=2):\n            chain_display = gr.Markdown()          # 右侧：工具调用链\n    \n    def respond(user_msg, chat_history, msgs, chain):\n        if not msgs:\n            msgs = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: SYSTEM_PROMPT}]\n        \n        # 执行多步工作流（Day 25 逻辑）\n        result, msgs = run_workflow(user_msg, msgs)\n        \n        chat_history.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_msg})\n        chat_history.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: result.final_answer})\n        \n        # 把调用链格式化为 Markdown，追加到历史\n        chain_md = format_chain(result.steps)   # 每步 ToolStep → Markdown 文本\n        chain = (chain or &quot;&quot;) + f&quot;\\n\\n---\\n\\n{chain_md}&quot;\n        \n        return &quot;&quot;, chat_history, msgs, chain\n    \n    msg_input.submit(respond, [msg_input, chatbot, messages_state, chain_state],\n                               [msg_input, chatbot, messages_state, chain_state])\n    chain_state.change(lambda x: x, chain_state, chain_display)  # 同步显示</code></pre><p><strong>四个关键设计决策</strong>：</p><ul><li><strong>gr.Blocks 而非 ChatInterface</strong>：需要左右分栏（聊天 + 工具链）必须用 Blocks，ChatInterface 不支持自定义布局</li><li><strong>两个 State</strong>：<code>messages_state</code> 保存工作流历史（给模型用），<code>chain_state</code> 保存调用链文本（给 UI 展示用），职责分离</li><li><strong>chain_state.change 绑定</strong>：修改 State 不会自动刷新 UI，需要显式绑定 <code>chain_state → chain_display</code></li><li><strong>format_chain 函数</strong>：把 <code>WorkflowResult.steps</code> 格式化成可读 Markdown，包含工具名、参数、结果摘要，支持直接渲染</li></ul>"}]},{"name":"整合成完整作品","questions":[{"qnum":1,"qtext":"三选一项目方向（文档问答 / 客服助手 / 工具助理）各自侧重什么技术？如何选择？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>方向</th><th>核心能力侧重</th><th>技术复杂度</th><th>推荐人群</th></tr></thead><tbody><tr><td>本地文档问答助手</td><td>RAG 全流程（Day 15–20）+ 界面</td><td>中</td><td>RAG 学得比较扎实的同学</td></tr><tr><td>企业知识库客服助手</td><td>RAG + Tool Calling 融合</td><td>高</td><td>有充裕时间、想展示更完整的工程能力</td></tr><tr><td>可调用工具的个人助理</td><td>Tool Calling（Day 22–25）+ 界面</td><td>低–中</td><td>时间有限、或 Day 22–26 学得更扎实</td></tr></tbody></table></div><p><strong>选择原则</strong>：</p><ul><li>选你最近几天学得最扎实的方向，不要选&quot;看起来更酷&quot;但没认真学的方向</li><li>整合日的重点是<strong>项目结构规范化</strong>，而非技术难度，方向不是核心</li><li>如果时间不够 → 方向 C（技术栈最集中，Day 22–26 的直接成果）</li></ul>"},{"qnum":2,"qtext":"把多个 Day Demo 整合成一个项目时，目录结构应该怎么设计？各模块职责是什么？","answerHtml":"<pre><code>tool-assistant/\n├── app.py              ← 入口：只做 UI 绑定，不含业务逻辑\n├── core/\n│   ├── config.py       ← 统一配置（读 .env，暴露 CFG 对象）\n│   ├── client.py       ← LLM 客户端单例\n│   └── workflow.py     ← 多步工作流主逻辑\n├── tools/\n│   ├── __init__.py     ← ALL_TOOLS、TOOL_REGISTRY、dispatch()\n│   ├── weather.py      ← get_weather + SCHEMA\n│   └── exchange_rate.py\n└── tests/\n    └── test_tools.py</code></pre><p><strong>各模块职责边界</strong>（关键是&quot;谁知道什么&quot;）：</p><div class=\"table-wrap\"><table><thead><tr><th>模块</th><th>知道</th><th>不知道</th></tr></thead><tbody><tr><td><code>tools/</code></td><td>工具如何执行</td><td>LLM 是谁、UI 是什么</td></tr><tr><td><code>core/workflow.py</code></td><td>如何调用 LLM 和工具</td><td>UI 怎么展示</td></tr><tr><td><code>app.py</code></td><td>UI 组件如何绑定</td><td>工具实现细节</td></tr></tbody></table></div><p><strong>整合步骤</strong>：</p><ul><li>识别各 Day Demo 的可复用模块，提取到对应目录</li><li>统一配置入口（所有 <code>os.getenv</code> 改为从 <code>config.py</code> 读取）</li><li>统一日志初始化（主入口 <code>logging.basicConfig</code> 一次，子模块 <code>logging.getLogger(__name__)</code>）</li><li>确认模块独立可测（<code>python core/workflow.py</code> 无需启动 UI 即可运行）</li></ul>"},{"qnum":3,"qtext":".env.example 和 .gitignore 应该怎么写？为什么不能提交 .env 文件？","answerHtml":"<p><strong>.env 不能提交的原因</strong>：<code>.env</code> 里包含真实的 API Key，一旦推送到 GitHub（即使删掉也可能在历史记录里），Key 可能被爬虫扫描到并滥用，导致账单被盗刷或账号被封禁。</p><p>**<code>.env.example</code>（只含模板，不含真实值）**：</p><pre><code class=\"language-bash\"># .env.example — 复制为 .env 并填入真实值\nDEEPSEEK_API_KEY=your_api_key_here\n# MODEL=deepseek-chat     # 可选，默认使用 deepseek-chat</code></pre><p>**<code>.gitignore</code>（必须包含的条目）**：</p><pre><code># 环境变量（绝对不能提交）\n.env\n\n# Python 缓存\n__pycache__/\n*.pyc\n*.pyo\n\n# 编辑器文件\n.DS_Store\n.idea/\n.vscode/\n\n# 依赖目录（应通过 requirements.txt 安装）\nvenv/\n.venv/</code></pre><p><strong>操作流程</strong>：</p><ul><li>先提交 <code>.env.example</code> 到 git（让别人知道要配置什么）</li><li>创建 <code>.gitignore</code> 排除 <code>.env</code></li><li>用户克隆后：<code>cp .env.example .env</code>，填入真实 key</li></ul>"},{"qnum":4,"qtext":"如何从零搭建一个\"可调用工具的个人助理\"完整项目？描述模块划分和关键实现。","answerHtml":"<p>核心设计：<strong>tools 独立 + core 封装工作流 + app.py 纯 UI + 统一配置</strong>。</p><p><strong>模块划分</strong>：</p><pre><code>tools/          → 工具实现（可独立运行，不依赖 LLM）\ncore/config.py  → 统一配置（CFG dataclass，frozen=True 防止误修改）\ncore/client.py  → LLM 客户端单例（避免每次 import 都创建新客户端）\ncore/workflow.py → 多步 for 循环 + WorkflowResult 记录\napp.py          → Gradio Blocks（左侧聊天 + 右侧工具链 + 两个 State）</code></pre><p><strong>关键实现要点</strong>：</p><pre><code class=\"language-python\"># 1. 配置单例（frozen dataclass 防止意外修改）\nCFG = Config(api_key=os.getenv(&quot;DEEPSEEK_API_KEY&quot;), ...)\n\n# 2. 客户端单例（避免重复创建）\n_client = None\ndef get_client():\n    global _client\n    if _client is None:\n        _client = OpenAI(api_key=CFG.api_key, base_url=CFG.base_url)\n    return _client\n\n# 3. 工作流：for-else 区分正常退出和超限退出\nfor _ in range(CFG.max_iterations):\n    msg = get_client().chat.completions.create(...).choices[0].message\n    if not msg.tool_calls:\n        break\n    # 执行工具...\nelse:\n    # 超出上限，强制生成\n\n# 4. UI：两个 State，职责分离\nmessages_state = gr.State(value=None)   # 工作流历史（给模型用）\nchain_state = gr.State(value=&quot;&quot;)        # 调用链文本（给展示用）</code></pre><p><strong>三个关键验证点</strong>：</p><ul><li><code>python tools/weather.py</code> 直接运行 → 工具可独立测试</li><li><code>python core/workflow.py</code> 直接运行 → 工作流无需 UI 即可验证</li><li><code>python app.py</code> + 浏览器测试 3 种问题（0/1/2 步工具）→ 全流程正确</li><li>**<code>temperature=0</code>**：两次调用都设 0，保证触发行为和最终回答的一致性，方便测试</li></ul>"}]},{"name":"补工程细节","questions":[{"qnum":1,"qtext":"LLM 项目中异常处理的\"分层设计\"是什么？各层应该如何处理各自的异常？","answerHtml":"<p>分层设计指不同代码层只处理自己能解决的异常，不能处理的向上抛或降级。</p><div class=\"table-wrap\"><table><thead><tr><th>层</th><th>位置</th><th>处理策略</th><th>错误表现</th></tr></thead><tbody><tr><td>工具层</td><td><code>tools/*.py</code></td><td><code>return {&quot;error&quot;: True, &quot;message&quot;: &quot;...&quot;}</code></td><td>工具返回错误 dict，模型生成友好回复</td></tr><tr><td>工作流层</td><td><code>core/workflow.py</code></td><td>捕获 API 异常（超时/限流/认证），可重试则重试</td><td>返回错误文案，terminated_by=&quot;error&quot;</td></tr><tr><td>UI 层</td><td><code>app.py</code></td><td><code>try/except Exception</code> 兜底</td><td>用户看到友好文案，不显示 traceback</td></tr></tbody></table></div><p><strong>工具层不抛异常的原因</strong>：工作流用 for 循环驱动，工具抛异常会中断整个循环；返回 error dict 让模型能基于错误信息生成自然语言提示（&quot;这个城市暂不支持，您是想查哪里？&quot;）。</p><p><strong>工作流层重试策略</strong>：</p><pre><code class=\"language-python\">except RateLimitError:\n    time.sleep(5 * (attempt + 1))   # 指数退避\n    continue\nexcept AuthenticationError:\n    return WorkflowResult(final_answer=&quot;API Key 验证失败&quot;, terminated_by=&quot;auth_error&quot;)\n    # 认证错误无需重试，直接返回</code></pre>"},{"qnum":2,"qtext":"给 LLM 项目加日志时，应该记录哪三类关键信息？各自的内容是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>日志类型</th><th>时机</th><th>记录内容</th><th>用途</th></tr></thead><tbody><tr><td><strong>启动日志</strong></td><td>程序启动时</td><td>模型名称、API Base URL、Key 前几位（脱敏）、最大迭代次数</td><td>确认配置正确、定位环境问题</td></tr><tr><td><strong>请求日志</strong></td><td>每次 API 调用后</td><td>耗时（秒）、input_tokens、output_tokens、total_tokens</td><td>性能分析、成本监控、发现异常高消耗</td></tr><tr><td><strong>错误日志</strong></td><td>异常发生时</td><td>工具名称、参数、异常类型 + <code>logger.exception()</code> 自动附加完整 traceback</td><td>无需重现问题即可排查原因</td></tr></tbody></table></div><p><strong>关键细节</strong>：</p><ul><li>API Key <strong>绝对不能完整打印</strong>到日志，只打印前 8 位作为验证标识</li><li>使用 <code>logger.exception()</code> 而不是 <code>logger.error()</code>，前者自动附加完整异常链（traceback）</li><li><code>logging.basicConfig</code> 只在主入口调用<strong>一次</strong>；子模块用 <code>logging.getLogger(__name__)</code> 继承</li></ul>"},{"qnum":3,"qtext":"什么是\"fail-fast\"？配置验证为什么要在启动时而不是请求时做？","answerHtml":"<p><strong>Fail-fast</strong>：系统在检测到错误配置时立即停止执行，而不是等到运行时才暴露错误。</p><div class=\"table-wrap\"><table><thead><tr><th>对比</th><th>Fail-slow（不做配置验证）</th><th>Fail-fast（启动时验证）</th></tr></thead><tbody><tr><td>错误发现时机</td><td>用户发第一条消息时崩溃</td><td>程序启动 5 秒内报错退出</td></tr><tr><td>错误定位</td><td>深层异常，难以识别是配置问题</td><td>明确的&quot;DEEPSEEK_API_KEY 未设置&quot;提示</td></tr><tr><td>成本风险</td><td>若多次请求后才报错，可能已消耗 Token</td><td>0 成本发现配置错误</td></tr><tr><td>用户体验</td><td>看到 Python traceback</td><td>看到&quot;请检查 .env 文件&quot;的友好提示</td></tr></tbody></table></div><p><strong>实现模式</strong>：</p><pre><code class=\"language-python\">def _load() -&gt; Config:\n    errors = []\n    key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;, &quot;&quot;).strip()\n    if not key:\n        errors.append(&quot;DEEPSEEK_API_KEY 未设置&quot;)\n    if errors:\n        print(&quot;❌ 配置错误：&quot; + &quot;；&quot;.join(errors))\n        sys.exit(1)   # fail-fast：立即退出\n    return Config(api_key=key, ...)\n\nCFG = _load()   # 模块 import 时就执行，最早被触发</code></pre>"},{"qnum":4,"qtext":"工具调用的输出校验（output validation）应该验证什么？如何实现？","answerHtml":"<p>输出校验防止&quot;脏数据&quot;（格式错误的数据）传入下一层。应在三处做校验：</p><p><strong>1. 工具返回值校验</strong>（工作流层接收工具结果时）：</p><pre><code class=\"language-python\">def validate_tool_result(name: str, result: dict) -&gt; dict:\n    if not isinstance(result, dict):\n        return {&quot;error&quot;: True, &quot;message&quot;: &quot;工具返回格式错误&quot;}\n    if result.get(&quot;error&quot;):\n        return result  # 已经是合法错误 dict，直接透传\n    missing = [f for f in REQUIRED_FIELDS.get(name, []) if f not in result]\n    if missing:\n        logger.warning(&quot;工具 &#x27;%s&#x27; 返回缺少字段：%s&quot;, name, missing)\n    return result</code></pre><p><strong>2. LLM 结构化输出校验</strong>（需要模型返回 JSON 时）：</p><ul><li>使用 <code>response_format={&quot;type&quot;: &quot;json_object&quot;}</code> 约束格式</li><li>用 Pydantic <code>model_validate_json()</code> 验证字段</li><li>校验失败时降级返回默认值，不崩溃</li></ul><p><strong>3. 工作流整体输出校验</strong>：</p><pre><code class=\"language-python\">if not wf.final_answer.strip():\n    wf.final_answer = &quot;未能生成回答，请重新提问。&quot;</code></pre>"},{"qnum":5,"qtext":"如何从零给一个 LLM 项目补全\"异常处理 + 日志 + 配置验证 + 输出校验\"四件套？","answerHtml":"<p>按以下顺序改造，优先做影响最大的：</p><p>**Step 1：配置验证（改 <code>core/config.py</code>）**</p><ul><li>把 <code>Config</code> 加载逻辑包在 <code>_load()</code> 函数里</li><li>收集所有配置错误（不要发现一个就退出，收集全部后一次性报错）</li><li><code>if errors: sys.exit(1)</code>，模块级调用 <code>CFG = _load()</code></li></ul><p>**Step 2：日志初始化（改 <code>app.py</code> 主入口）**</p><ul><li>在 <code>if __name__ == &quot;__main__&quot;:</code> 前调用 <code>setup_logging()</code></li><li><code>httpx</code>/<code>httpcore</code> 降级为 WARNING 避免刷屏</li><li>各子模块添加 <code>logger = logging.getLogger(__name__)</code></li></ul><p>**Step 3：API 异常处理（改 <code>core/workflow.py</code>）**</p><ul><li>把 API 调用包在 <code>_call_api()</code> 函数里</li><li><code>RateLimitError</code> → 重试 3 次（指数退避）</li><li><code>AuthenticationError</code> → 立即返回错误，不重试</li><li><code>APITimeoutError/APIConnectionError</code> → 抛 <code>ConnectionError</code>，上层捕获</li></ul><p>**Step 4：工具层（改 <code>tools/*.py</code>）**</p><ul><li>所有工具用 <code>try/except</code> 包裹，返回 <code>{&quot;error&quot;: True, &quot;message&quot;: &quot;...&quot;}</code> 而非抛异常</li><li>在 <code>dispatch()</code> 里加 <code>TypeError</code> 捕获（参数不匹配）和兜底 <code>Exception</code></li></ul><p>**Step 5：UI 兜底（改 <code>app.py</code> 的 respond 函数）**</p><ul><li><code>try/except Exception</code> 包裹整个业务调用</li><li>把技术错误转成用户友好文案</li></ul><p><strong>验证顺序</strong>：先删 API Key 测 fail-fast → 再 mock RateLimitError 测重试 → 再传错工具参数测工具兜底 → 最后整体跑 5 次对话验日志输出。</p>"}]},{"name":"测试和优化","questions":[{"qnum":1,"qtext":"LLM 应用测试和普通软件测试有哪些核心区别？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>普通软件测试</th><th>LLM 项目测试</th></tr></thead><tbody><tr><td>正确性判断</td><td><code>assertEqual</code>（精确匹配）</td><td>语义/结构/功能匹配（无法精确断言）</td></tr><tr><td>稳定性前提</td><td>默认稳定（相同输入=相同输出）</td><td>需要多次运行验证（概率性输出）</td></tr><tr><td>评估方式</td><td>全自动化断言</td><td>规则检查 + 人工抽样</td></tr><tr><td>失败模式</td><td>崩溃或错误返回（可检测）</td><td>生成了错误内容（幻觉、漏召回、误触发，难以自动检测）</td></tr><tr><td>边界</td><td>已知边界（数据类型、长度）</td><td>语义边界难以穷举</td></tr></tbody></table></div><p><strong>核心结论</strong>：LLM 测试的目标不是&quot;100% 通过&quot;，而是<strong>量化&quot;在预期范围内失败的概率&quot;</strong>并把它降到可接受水平。</p><p><strong>四个测试维度</strong>：输出稳定性（一致率）、工具触发准确率（Precision/Recall）、检索准确率（Hit Rate/MRR）、成本合理性（tokens/轮）。</p>"},{"qnum":2,"qtext":"如何测试工具调用的\"触发准确率\"？精确率和召回率分别测什么？","answerHtml":"<p><strong>精确率（Precision）</strong>：触发的工具是不是都对的？防止<strong>误触发</strong>。</p><pre><code>Precision = 正确触发次数 / 总触发次数\n（&quot;触发了的里面有多少是应该触发的&quot;）</code></pre><p><strong>召回率（Recall）</strong>：应该触发的工具是不是都触发了？防止<strong>漏触发</strong>。</p><pre><code>Recall = 正确触发次数 / 应该触发的总次数\n（&quot;应该触发的里面有多少被触发了&quot;）</code></pre><p><strong>F1 综合指标</strong>：<code>2×P×R / (P+R)</code>，平衡精确率和召回率。</p><p><strong>测试实现思路</strong>：</p><ul><li>准备测试用例，每条标注 <code>expected_tools</code>（应触发）和 <code>should_not_call</code>（不应触发）</li><li>实际运行，收集 <code>called</code> 工具集合</li><li><code>missed = expected - called</code>（漏触发），<code>wrong = called &amp; forbidden</code>（误触发）</li><li>统计 tp / fp / fn，计算 Precision / Recall / F1</li></ul><p><strong>典型问题与修复</strong>：</p><ul><li>Precision 低（误触发多）→ 收紧 description，加&quot;何时不用&quot;的限定</li><li>Recall 低（漏触发多）→ 扩展 description，补别名/同义词</li></ul>"},{"qnum":3,"qtext":"什么是输出稳定性测试？temperature=0 时输出一定稳定吗？","answerHtml":"<p><strong>稳定性</strong>：相同问题多次运行时，<strong>核心行为是否一致</strong>——重点是工具触发行为和回答功能，而非措辞完全相同。</p><p><strong>temperature=0 的实际稳定性</strong>：</p><p><code>temperature=0</code> 使用贪心解码（每步选概率最高的 token），理论上是确定性的。但实践中仍有不稳定来源：</p><div class=\"table-wrap\"><table><thead><tr><th>不稳定来源</th><th>说明</th></tr></thead><tbody><tr><td>工具参数差异</td><td>模型有时传 <code>{&quot;city&quot;: &quot;北京&quot;}</code>，有时传 <code>{&quot;city&quot;: &quot;Beijing&quot;}</code>，导致工具结果不同</td></tr><tr><td>商业 API 差异</td><td>DeepSeek 等服务内部可能有负载均衡或模型版本更新</td></tr><tr><td>工具本身随机性</td><td>真实 API（天气/股票）每次返回数据不同，影响后续生成</td></tr></tbody></table></div><p><strong>测试方法</strong>：相同问题跑 3–5 次，对比每次的工具触发序列（<code>[s.name for s in wf.steps]</code>），如果结果集合大小 &gt; 1，则判定为不稳定。</p>"},{"qnum":4,"qtext":"如何分析一次完整对话的 Token 成本？有哪些典型的成本增长陷阱？","answerHtml":"<p><strong>Token 消耗结构</strong>：</p><pre><code>input_tokens = System Prompt + 对话历史（所有轮次）\n             + 工具 Schema（ALL_TOOLS 的 JSON） + 当前消息\n\noutput_tokens = 模型回复文字 + tool_calls JSON</code></pre><p><strong>工具 Schema 隐性成本</strong>：3 个工具的 Schema 通常占 300–600 tokens，每次请求都要发送。</p><p><strong>两大成本陷阱</strong>：</p><ul><li><strong>历史未截断</strong>：多轮对话中历史消息线性增长，第 10 轮时 input_tokens 可能是第 1 轮的 10 倍。修复：用 <code>trim_history(messages, max_turns=5)</code> 保留最近 N 轮。</li></ul><ul><li><strong>工作流循环失控</strong>：多步工作流每次循环都重新发送完整历史，10 次循环的 Token 消耗是 3 次的 3 倍以上。修复：<code>max_iterations</code> 限制 + 超时退出。</li></ul><p><strong>成本计算</strong>：</p><pre><code class=\"language-python\">cost_usd = (input_tokens * 0.14 + output_tokens * 0.28) / 1_000_000\n# DeepSeek chat 定价（非缓存，截至 2025）</code></pre>"},{"qnum":5,"qtext":"如何从零设计一份 LLM 项目的测试记录表？包含哪些维度和字段？","answerHtml":"<p>测试记录表应包含<strong>元数据、用例详情、汇总指标、改进计划</strong>四部分：</p><p><strong>元数据</strong>：测试时间、项目版本、模型名称、temperature 值。</p><p><strong>用例详情表</strong>（每条一行）：</p><div class=\"table-wrap\"><table><thead><tr><th>字段</th><th>说明</th></tr></thead><tbody><tr><td>编号</td><td>唯一序号（便于引用）</td></tr><tr><td>测试问题</td><td>完整原文</td></tr><tr><td>预期行为</td><td>应调工具 + 回答方向</td></tr><tr><td>实际行为</td><td>实际调用工具 + 回答摘要</td></tr><tr><td>结果</td><td>✅/❌</td></tr><tr><td>问题/备注</td><td>失败原因或特殊观察</td></tr></tbody></table></div><p><strong>汇总指标</strong>：通过率、工具触发精确率/召回率/F1、平均 Token 消耗、平均耗时。</p><p><strong>改进计划</strong>（P0–P3 优先级）：</p><pre><code>P0（立即修）：影响核心功能 + 每次都复现\nP1（本次修）：影响核心功能 + 多数复现，或影响体验 + 每次都复现\nP2（下次修）：偶发或影响体验\nP3（记录）：已知问题，可接受</code></pre><p>一份好的测试记录表的价值在于：让&quot;发现问题 → 修复 → 验证改善&quot;形成闭环，而不是测一次就结束。</p>"}]},{"name":"整理作品与总结","questions":[{"qnum":1,"qtext":"一个\"别人可以直接运行\"的项目 README 需要包含哪些核心章节？","answerHtml":"<p>必须包含的四个部分：</p><div class=\"table-wrap\"><table><thead><tr><th>章节</th><th>作用</th><th>失败表现</th></tr></thead><tbody><tr><td><strong>项目介绍</strong></td><td>30 秒内让读者知道这是什么</td><td>&quot;智能助手&quot;等无信息量描述</td></tr><tr><td><strong>功能列表</strong></td><td>具体说能做什么</td><td>&quot;支持多种功能&quot;等抽象描述</td></tr><tr><td><strong>快速开始</strong></td><td>安装→配置→运行，3 步内</td><td>步骤超 5 步 / 没有预期输出</td></tr><tr><td><strong>示例</strong></td><td>真实输入/输出</td><td>用文字描述代替真实对话</td></tr></tbody></table></div><p>可选加分项：技术架构图、FAQ、.env.example 说明、技术栈表格。</p><p><strong>黄金标准</strong>：陌生开发者按 README 操作，<strong>5 分钟内</strong>能发出第一条消息。验证方法：自己清空配置重跑一遍，或让朋友操作并计时。</p>"},{"qnum":2,"qtext":"如何写\"快速开始\"章节，让陌生开发者 5 分钟内跑起来？","answerHtml":"<p><strong>三步原则</strong>：快速开始必须是三步以内的可执行命令：</p><pre><code class=\"language-bash\"># Step 1：安装\ngit clone &lt;url&gt; &amp;&amp; cd &lt;repo&gt; &amp;&amp; pip install -r requirements.txt\n\n# Step 2：配置\ncp .env.example .env   # 填入 API Key\n\n# Step 3：运行\npython app.py          # 访问 http://127.0.0.1:7860</code></pre><p><strong>关键：每步都要写预期结果</strong>，让用户能自检：</p><ul><li>Step 1 ✅ 预期：<code>Successfully installed</code> 若干包，无红色报错</li><li>Step 2 ✅ 预期：<code>.env</code> 中 <code>DEEPSEEK_API_KEY=sk-xxxxx</code>（非空）</li><li>Step 3 ✅ 预期：终端输出 <code>Running on local URL: http://127.0.0.1:7860</code></li></ul><p><strong>五种常见疏漏</strong>：</p><ul><li>未写 Python 版本要求</li><li>没有 <code>.env.example</code>（用户不知道需要配什么变量）</li><li><code>requirements.txt</code> 未锁定版本（安装了不兼容版本）</li><li>未说明运行入口文件</li><li>示例不真实（截图与实际不符）</li></ul>"},{"qnum":3,"qtext":"示例输入输出为什么比功能描述更有说服力？如何选择展示哪些示例？","answerHtml":"<p><strong>为什么示例更有力</strong>：功能描述是抽象的，示例是具体的。</p><pre><code>功能描述（无信息量）：\n  &quot;支持实时天气查询和货币换算，可处理复合问题&quot;\n\n示例（直接展示能力）：\n  用户：上海明天适合出门吗？顺便帮我算 500 欧元换多少人民币\n  助手：上海明天多云，气温 22–28°C，适合出门。\n       500 欧元约等于 3,920 人民币（1 EUR = 7.84 CNY）。</code></pre><p>示例让读者立刻知道：系统能处理复合问题、回答是自然语言、工具调用是自动推断的。</p><p><strong>三类必选示例</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>类型</th><th>示例内容</th><th>展示的能力</th></tr></thead><tbody><tr><td>核心功能</td><td>单工具调用（天气 or 汇率）</td><td>最基本功能正常工作</td></tr><tr><td>差异化亮点</td><td>多工具串行 + 工具链可视化截图</td><td>项目最有特色的能力</td></tr><tr><td>边界处理</td><td>不触发工具的普通聊天</td><td>系统足够智能，不滥用工具</td></tr></tbody></table></div>"},{"qnum":4,"qtext":"30 天 LLM 应用开发学习中，最重要的五个认知转变是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>认知转变</th><th>起点认知</th><th>终点认知</th></tr></thead><tbody><tr><td><strong>API调用→工程系统</strong></td><td>填 Key 发消息就行</td><td>LLM 是系统组件，需要配置管理、异常处理、日志监控</td></tr><tr><td><strong>Prompt=咒语→规格</strong></td><td>Prompt 越华丽越好</td><td>Prompt 是规格说明，需精简、明确边界、可迭代</td></tr><tr><td><strong>模型万能→RAG补充</strong></td><td>直接问模型即可</td><td>私有/实时知识需 RAG：先检索段落，再让模型基于段落回答</td></tr><tr><td><strong>工具=插件→能力边界</strong></td><td>工具是附加功能</td><td>工具 description 的精确程度决定模型能否在正确时机使用</td></tr><tr><td><strong>能跑→可维护</strong></td><td>Demo 能跑就算完成</td><td>fail-fast / 分层异常 / 日志 / 测试——这些决定项目能否被他人维护</td></tr></tbody></table></div>"},{"qnum":5,"qtext":"一个 LLM 项目从 Demo 到生产级别还需要补充哪些关键能力？","answerHtml":"<p>按三个方向分类：</p><p><strong>路线 A：深化 Agent 能力</strong></p><ul><li>LangGraph：图结构定义复杂 Agent 流程（分支、循环、多 Agent 协作）</li><li>MCP（Model Context Protocol）：标准化工具接口协议</li><li>长期记忆：跨对话记忆（向量存储 + 摘要压缩）</li></ul><p><strong>路线 B：提升 RAG 系统质量</strong></p><ul><li>多路召回：向量检索 + BM25 关键词检索，覆盖更多场景</li><li>Reranker：Cross-Encoder 重排序，精度提升 10–20%</li><li>RAGAS：自动化 RAG 质量评估框架</li></ul><p><strong>路线 C：生产部署</strong></p><div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>工具/方案</th><th>解决的问题</th></tr></thead><tbody><tr><td>可观测性</td><td>LangFuse / LangSmith</td><td>追踪每次 LLM 调用，定位慢查询</td></tr><tr><td>成本控制</td><td>Prompt 缓存、模型分级路由</td><td>降低 API 费用 40–80%</td></tr><tr><td>安全</td><td>Prompt 注入防护、输出护栏</td><td>防止越权使用和有害输出</td></tr><tr><td>部署</td><td>Docker + Hugging Face Spaces</td><td>让他人无需配置环境即可使用</td></tr></tbody></table></div><p><strong>判断优先级</strong>：做完 30 天后，看哪个部分让你最不满意——那就是下一阶段的重点方向。</p>"}]},{"name":"深化阶段·LangChain 基础（LCEL 与核心抽象）","questions":[{"qnum":1,"qtext":"为什么要在原生 API 之上使用 LangChain 框架？它解决了哪些核心问题？","answerHtml":"<p>原生 API 有三个痛点：<strong>Provider 绑定</strong>（切换模型需改客户端、参数名、响应字段）、<strong>链路代码重复</strong>（每个 Demo 都要手写&quot;拼 messages → 调 API → 取 content&quot;这条链）、<strong>输出解析散落</strong>（JSON 解析、Pydantic 校验、重试逻辑各自散落在业务代码里）。</p><p>LangChain 对应解决：</p><div class=\"table-wrap\"><table><thead><tr><th>问题</th><th>LangChain 的解法</th></tr></thead><tbody><tr><td>Provider 绑定</td><td>统一 <code>ChatModel</code> 接口，切换 Provider 只改初始化</td></tr><tr><td>链路代码重复</td><td>LCEL 管道（`prompt \\</td></tr><tr><td>输出解析散落</td><td><code>OutputParser</code> 系列统一解析 + 内置重试机制</td></tr></tbody></table></div><p><strong>注意</strong>：LangChain 是在理解原生 API 之后才引入的工具——不理解底层就直接用框架，出问题时分不清是哪一层的锅。</p>"},{"qnum":2,"qtext":"什么是 LangChain 的 Runnable 接口？它统一了哪三个核心方法？","answerHtml":"<p><code>Runnable</code> 是 LangChain 所有组件（<code>PromptTemplate</code>、<code>ChatModel</code>、<code>OutputParser</code>）共同实现的接口，使得它们可以用 <code>|</code> 串联成管道。</p><p>三个核心方法：</p><div class=\"table-wrap\"><table><thead><tr><th>方法</th><th>作用</th><th>返回类型</th></tr></thead><tbody><tr><td><code>.invoke(input)</code></td><td>同步单次调用</td><td>单个结果</td></tr><tr><td><code>.stream(input)</code></td><td>流式调用，逐 token 输出</td><td><code>Iterator[chunk]</code></td></tr><tr><td><code>.batch([i1, i2])</code></td><td>并行批量调用</td><td><code>list</code></td></tr></tbody></table></div><p><strong>为什么重要</strong>：<code>RunnableSequence</code>（即 <code>a | b | c</code>）把这三个方法自动传播到整条链——调用 <code>chain.stream(...)</code> 时，每一个 <code>Runnable</code> 组件都以流式模式运行，不需要额外代码。</p>"},{"qnum":3,"qtext":"LCEL 管道语法 `prompt | model | parser` 的执行过程是什么？每一步的输入输出类型分别是什么？","answerHtml":"<pre><code class=\"language-python\">chain = prompt | llm | parser\nchain.invoke({&quot;question&quot;: &quot;...&quot;})</code></pre><p>执行流程：</p><pre><code>输入：dict {&quot;question&quot;: &quot;...&quot;}\n  ↓ prompt.invoke(dict)\n输出：ChatPromptValue（含 system + human 两条消息）\n  ↓ llm.invoke(ChatPromptValue)\n输出：AIMessage（含 content、response_metadata 等字段）\n  ↓ parser.invoke(AIMessage)\n输出：str（纯文本，即 AIMessage.content）</code></pre><div class=\"table-wrap\"><table><thead><tr><th>步骤</th><th>输入类型</th><th>输出类型</th></tr></thead><tbody><tr><td><code>prompt</code></td><td><code>dict</code></td><td><code>ChatPromptValue</code></td></tr><tr><td><code>llm</code></td><td><code>ChatPromptValue</code></td><td><code>AIMessage</code></td></tr><tr><td><code>parser</code>（<code>StrOutputParser</code>）</td><td><code>AIMessage</code></td><td><code>str</code></td></tr></tbody></table></div><p>类型转换是隐式的，调试时用 <code>prompt.invoke(input)</code> 单独查看中间状态。</p>"},{"qnum":4,"qtext":"`ChatPromptTemplate` 相比手拼字符串 messages 多做了哪些事？又隐藏了什么？","answerHtml":"<p><strong>多做的事</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>功能</th><th>手写方式</th><th>框架提供</th></tr></thead><tbody><tr><td>变量占位符校验</td><td>f-string 忘了加变量不报错</td><td><code>{var}</code> 缺少时抛 <code>KeyError</code></td></tr><tr><td>消息角色验证</td><td>拼错 <code>&quot;sistem&quot;</code> 不报错</td><td><code>(&quot;system&quot;, ...)</code> 创建时就验证</td></tr><tr><td>多轮历史插入</td><td>手动 <code>messages.extend(history)</code></td><td><code>MessagesPlaceholder</code> 声明式插入</td></tr></tbody></table></div><p><strong>隐藏的部分</strong>（需要主动查看）：</p><pre><code class=\"language-python\"># 实际发出的 API 请求，被框架封装\n# 调试时单独调用：\nprint(prompt.invoke({&quot;question&quot;: &quot;...&quot;}))  # 查看实际消息结构</code></pre><p>token 计数藏在 <code>AIMessage.response_metadata[&quot;token_usage&quot;]</code> 里，不在链的直接输出中。</p>"},{"qnum":5,"qtext":"什么场景下应该用 LangChain，什么场景下手写原生 API 更合适？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>场景</th><th>推荐</th><th>原因</th></tr></thead><tbody><tr><td>简单单步调用（一问一答）</td><td>手写</td><td>依赖少、调试直接、无框架版本风险</td></tr><tr><td>多步链路（RAG、Agent）</td><td>LangChain</td><td>统一接口 + 流式/批量天然支持</td></tr><tr><td>精确控制 API 参数</td><td>手写</td><td>框架封装会屏蔽部分参数</td></tr><tr><td>跨 Provider 可移植性</td><td>LangChain</td><td>只改初始化，链路代码不动</td></tr><tr><td>生产系统，依赖稳定性优先</td><td>手写或锁定版本</td><td>LangChain 破坏性变更频繁</td></tr></tbody></table></div><p><strong>LangChain 的价值随链路复杂度增长</strong>：在 Day 31 的单轮聊天 Demo 上，框架带来的收益不显著；到 LangGraph 多步 Agent 编排（Day 33+），统一接口的价值才真正体现。</p>"},{"qnum":6,"qtext":"`PromptTemplate` 和 `ChatPromptTemplate` 有什么区别？为什么现在几乎只用后者？","answerHtml":"<p>两者是 LangChain 里两种不同的模板类型，适用于不同代际的模型接口：</p><div class=\"table-wrap\"><table><thead><tr><th>模板类型</th><th>适用场景</th><th>示例</th></tr></thead><tbody><tr><td><code>PromptTemplate</code></td><td>单次文本补全（legacy completion API）</td><td>旧版模型、非对话任务</td></tr><tr><td><code>ChatPromptTemplate</code></td><td>聊天模型（当前主流）</td><td>GPT-4、DeepSeek Chat、Qwen</td></tr></tbody></table></div><p><code>PromptTemplate</code> 面向的是&quot;输入一段文本、补全一段文本&quot;的老式 completion 接口，不区分角色（system/user/assistant）；<code>ChatPromptTemplate</code> 面向的是现在主流的聊天模型接口，用 <code>(&quot;system&quot;, ...)</code> / <code>(&quot;human&quot;, ...)</code> 这样的角色化消息列表组织 Prompt，天然对应 <code>messages</code> 参数的结构。</p><p>现在几乎只用 <code>ChatPromptTemplate</code> 的原因很直接：聊天模型已经是绝对主流，<code>PromptTemplate</code> 对应的 completion API 属于历史遗留，Day 31 之后的所有 Demo（结构化输出、RAG、LangGraph Node）用的都是 <code>ChatPromptTemplate</code>。</p><p>**记忆点：<code>PromptTemplate</code> 对应老式补全接口，<code>ChatPromptTemplate</code> 对应角色化的聊天接口——选型只看你调用的是不是 Chat 模型。**</p>"},{"qnum":7,"qtext":"用 LangChain 重写 Day 4 聊天 Demo 后，历史记录的存储类型发生了什么变化？这个变化说明了什么？","answerHtml":"<p>历史记录的类型从 <code>list[dict]</code> 变成了 <code>list[HumanMessage | AIMessage]</code>：</p><pre><code class=\"language-python\"># 手写版（Day 4）：历史记录是 dict 列表\nhistory = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是一个有帮助的助手。&quot;}]\nhistory.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input})\nhistory.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: reply})\n\n# LangChain 版（Day 31）：历史记录是消息对象列表\nfrom langchain_core.messages import HumanMessage, AIMessage\nhistory = []\nhistory.append(HumanMessage(content=user_input))\nhistory.append(AIMessage(content=reply))</code></pre><p>这个变化说明 LangChain 用<strong>类型化的消息对象</strong>取代了裸 <code>dict</code>——<code>HumanMessage</code>、<code>AIMessage</code>（以及后续会用到的 <code>SystemMessage</code>、<code>ToolMessage</code>）是 LangChain 统一消息类型系统的组成部分，比 <code>{&quot;role&quot;: &quot;...&quot;, &quot;content&quot;: &quot;...&quot;}</code> 多了类型安全（IDE 能识别字段、写错角色名会在构造时报错而不是等到发请求）。</p><p>更重要的是，这套消息对象类型不是 Day 31 用完就丢的——Day 33 的 LangGraph <code>AgentState</code> 里 <code>messages: Annotated[list, add_messages]</code> 存的正是这一套消息对象，<code>add_messages</code> Reducer 就是靠识别 <code>AIMessage</code>/<code>HumanMessage</code>/<code>ToolMessage</code> 的类型和 <code>id</code> 来做追加和去重的。Day 31 换掉的消息类型，是为 Day 33 之后的图状态设计埋下的基础。</p><p><strong>记忆点：dict 换成消息对象不是换皮，是为后面 LangGraph 的 Reducer 机制做类型铺垫。</strong></p>"}]},{"name":"深化阶段·LangChain 结构化输出与 RAG 链","questions":[{"qnum":1,"qtext":"`PydanticOutputParser` 和手写 JSON 解析的核心区别是什么？框架帮你标准化了哪三个步骤？","answerHtml":"<p>手写版每次需要自己完成三步：① 取 <code>response.choices[0].message.content</code>；② <code>json.loads()</code> 解析（需处理 markdown 代码块）；③ <code>Pydantic(**data)</code> 校验（需捕获异常）。</p><p><code>PydanticOutputParser</code> 把这三步标准化：</p><div class=\"table-wrap\"><table><thead><tr><th>步骤</th><th>手写</th><th>框架</th></tr></thead><tbody><tr><td>取文本</td><td><code>response.choices[0].message.content</code></td><td><code>StrOutputParser</code> 自动提取</td></tr><tr><td>JSON 解析</td><td><code>json.loads()</code> + 处理代码块</td><td>Parser 内置清理，解析失败抛 <code>OutputParserException</code></td></tr><tr><td>Pydantic 校验</td><td><code>Model(**data)</code> + try/except</td><td>Parser 内部完成，可套 <code>OutputFixingParser</code> 自动修复</td></tr></tbody></table></div><p>额外收益：<code>parser.get_format_instructions()</code> 自动生成符合 JSON Schema 的约束文本，替代手写的格式说明——字段描述、类型约束直接从 Pydantic model 的 <code>Field(description=...)</code> 生成，不需要手动维护两份信息。</p>"},{"qnum":2,"qtext":"`with_structured_output()` 和 `PydanticOutputParser` 有什么区别？各自适用什么场景？","answerHtml":"<pre><code class=\"language-python\"># PydanticOutputParser：在 Prompt 里插入约束文本\nparser = PydanticOutputParser(pydantic_object=Resume)\nchain = prompt.partial(format_instructions=parser.get_format_instructions()) | llm | parser\n\n# with_structured_output()：通过 API 层（tool_calling / json_mode）强制约束\nstructured_llm = llm.with_structured_output(Resume)\nresult = structured_llm.invoke(&quot;请从以下简历中抽取：...&quot;)</code></pre><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th><code>PydanticOutputParser</code></th><th><code>with_structured_output()</code></th></tr></thead><tbody><tr><td>约束方式</td><td>在 Prompt 里插入 JSON Schema 文本</td><td>在 API 层（tool_calling/json_mode）强制</td></tr><tr><td>Prompt 控制</td><td>透明，你决定约束文本放哪里</td><td>框架控制，透明度低</td></tr><tr><td>可靠性</td><td>依赖模型遵从 Prompt</td><td>API 层强制，更可靠</td></tr><tr><td>适用场景</td><td>需要精确控制 Prompt / 链路复杂时</td><td>快速原型、不关心约束细节时</td></tr></tbody></table></div><p><strong>生产建议</strong>：支持 <code>tool_calling</code> 的模型（GPT-4o、DeepSeek、Qwen 等）优先用 <code>with_structured_output()</code>；需要自定义格式约束文本位置时用 <code>PydanticOutputParser</code>。</p>"},{"qnum":3,"qtext":"LangChain `Retriever` 接口封装了什么？和 Day 18 手写检索返回值有什么本质不同？","answerHtml":"<p><code>Retriever</code> 封装了三步：① 把查询字符串向量化（调 embedding 模型）；② 在向量库里相似度检索，取 Top-K；③ 把结果包装成 <code>List[Document]</code>。</p><p>与 Day 18 手写版的本质区别在返回类型：</p><pre><code class=\"language-python\"># Day 18 手写：返回 list[str]，只有文本\ndef retrieve(query: str) -&gt; list[str]:\n    embedding = embed(query)\n    results = chroma.query(query_embeddings=[embedding], n_results=3)\n    return results[&quot;documents&quot;][0]\n\n# LangChain Retriever：返回 List[Document]，含文本 + metadata\nretriever.invoke(&quot;query&quot;)  # -&gt; [Document(page_content=&quot;...&quot;, metadata={&quot;source&quot;: &quot;...&quot;})]</code></pre><p><code>Document.metadata</code> 是关键：它把&quot;这段文字来自哪个文件&quot;随检索结果一路传下去，不需要额外传参就能支持 Day 20 的引用溯源。另一个关键区别：<code>Retriever</code> 是 <code>Runnable</code>，可以直接用 <code>|</code> 参与 LCEL 链；手写函数不行。</p>"},{"qnum":4,"qtext":"LCEL RAG 链里 `RunnablePassthrough` 和 `RunnableParallel` 分别解决什么问题？","answerHtml":"<p>RAG 链的 Prompt 需要两个输入（<code>context</code> 和 <code>question</code>），但链的原始输入只有一个字符串（用户问题）。这是&quot;一个输入要喂给多个分支&quot;的问题，<code>RunnableParallel</code> 解决了它：</p><pre><code class=\"language-python\">rag_chain = (\n    {\n        &quot;context&quot;: retriever | format_docs,  # RunnableParallel 的第一个分支\n        &quot;question&quot;: RunnablePassthrough(),   # RunnableParallel 的第二个分支\n    }\n    | prompt\n    | llm\n    | StrOutputParser()\n)</code></pre><ul><li>**<code>RunnableParallel</code>**（dict 字面量是语法糖）：并行执行多个分支，把各分支结果合并为一个 dict，输出 <code>{&quot;context&quot;: &quot;...&quot;, &quot;question&quot;: &quot;...&quot;}</code>，让 Prompt 的两个变量都能被填充</li><li>**<code>RunnablePassthrough()</code>**：把输入原样透传，不做任何处理——这里用来把用户问题传给 Prompt 的 <code>{question}</code> 变量，否则问题字符串会被 <code>retriever</code> 那条分支&quot;消耗掉&quot;</li></ul><p>两者配合就是&quot;一个输入 → 两路并行处理 → 合并 → 继续&quot;的经典 LCEL 模式。</p>"},{"qnum":5,"qtext":"什么时候用 LangChain 现成组件更好，什么时候手写更可控？给出判断标准。","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>判断维度</th><th>用框架组件</th><th>手写更好</th></tr></thead><tbody><tr><td>需要流式 / 批量 / 异步</td><td>✅ 天然支持，零代码</td><td>需自己实现</td></tr><tr><td>切换 Provider / 向量库</td><td>✅ 只改初始化，链路不动</td><td>改动扩散到业务代码</td></tr><tr><td>需要精确控制 Prompt 内容</td><td><code>PydanticOutputParser</code> 可以</td><td><code>with_structured_output()</code> 不透明</td></tr><tr><td>调试排错</td><td>需单独 invoke 中间节点</td><td>✅ 每步直接 print</td></tr><tr><td>一次性脚本 / 极简场景</td><td>过度设计</td><td>✅ 更快更简单</td></tr><tr><td>多步链路（RAG、Agent）</td><td>✅ LCEL 组合优势明显</td><td>while 循环越写越长</td></tr></tbody></table></div><p><strong>核心判断标准</strong>：链路复杂度越高、需要跨 Provider 可移植性、需要流式/批量支持时，框架收益越大；简单单步、精确控制细节、排错优先时，手写更好。Day 31–32 的 Demo 规模并不大，引入框架的价值有限；到 Day 33 的 LangGraph 多步 Agent 编排，框架优势才真正显现。</p>"},{"qnum":6,"qtext":"LangChain 内置的三种 OutputParser 分别是什么？各自的输出类型和适用场景是什么？`OutputFixingParser` 在它们基础上解决了什么问题？","answerHtml":"<p>三种 OutputParser 按解析强度递增排列：</p><div class=\"table-wrap\"><table><thead><tr><th>Parser</th><th>输出类型</th><th>适用场景</th></tr></thead><tbody><tr><td><code>StrOutputParser</code></td><td><code>str</code>（纯文本）</td><td>普通对话、摘要，不需要解析结构，覆盖 90% 场景</td></tr><tr><td><code>JsonOutputParser</code></td><td><code>dict</code></td><td>输出是 JSON 但不需要严格类型校验</td></tr><tr><td><code>PydanticOutputParser</code></td><td>Pydantic 对象</td><td>需要类型安全、字段校验、IDE 自动补全</td></tr></tbody></table></div><p>三者都是 <code>Runnable</code>，可以直接用 <code>|</code> 接在 <code>llm</code> 之后，选型只看你需要多强的结构化保证。</p><p><code>OutputFixingParser</code> 是在这三者之上再包一层的进阶方案，解决&quot;解析失败怎么办&quot;的问题：</p><pre><code class=\"language-python\">from langchain.output_parsers import OutputFixingParser\n\n# 解析失败时，会再调一次模型，让它修复不合规的输出\nrobust_parser = OutputFixingParser.from_llm(parser=parser, llm=llm)\nchain = prompt | llm | robust_parser</code></pre><p>它相当于自动化了 Day 9 里手写的&quot;解析失败 → 重试&quot;逻辑：原来出错要自己捕获异常、拼修复 Prompt、再调一次模型，现在包一层 <code>OutputFixingParser</code> 就搞定，代价是失败时会多花一次模型调用。</p><p><strong>记忆点：Str/Json/Pydantic 三种 Parser 是&quot;要多强的结构化&quot;的选型问题，OutputFixingParser 是&quot;解析失败怎么兜底&quot;的问题，两者维度不同、可以叠加使用。</strong></p>"},{"qnum":7,"qtext":"`vectorstore.as_retriever()` 通过哪些参数控制检索行为？创建向量库的两种方式（从文档列表 vs 加载持久化目录）有什么区别？","answerHtml":"<p><code>as_retriever()</code> 的两个核心参数：</p><pre><code class=\"language-python\">retriever = vectorstore.as_retriever(\n    search_type=&quot;similarity&quot;,    # 相似度检索（默认）\n    search_kwargs={&quot;k&quot;: 3},      # 返回最相似的 3 条\n)</code></pre><p><code>search_type</code> 决定检索策略（默认是余弦相似度检索），<code>search_kwargs</code> 是传给具体策略的参数字典，最常用的是 <code>k</code>（Top-K 返回条数）。</p><p>创建向量库有两种方式，对应不同的使用阶段：</p><pre><code class=\"language-python\"># 方式一：从文档列表创建（小批量，适合 Demo，内存中临时构建）\nvectorstore = Chroma.from_documents(docs, embedding=embeddings)\n\n# 方式二：加载已有的持久化向量库（对应 Day 18 的做法）\nvectorstore = Chroma(persist_directory=&quot;./chroma_db&quot;, embedding_function=embeddings)</code></pre><div class=\"table-wrap\"><table><thead><tr><th>方式</th><th>适用场景</th><th>数据来源</th></tr></thead><tbody><tr><td><code>from_documents()</code></td><td>快速验证、临时数据、一次性 Demo</td><td>内存中的 <code>Document</code> 列表，每次重新构建</td></tr><tr><td><code>persist_directory=...</code></td><td>生产场景、需要复用已构建好的向量库</td><td>磁盘上已经存过的向量库文件，直接加载</td></tr></tbody></table></div><p>方式二对应的正是 Day 18 手写 RAG 时把 embedding 结果持久化到 Chroma 的那一套流程——LangChain 版本只是把&quot;连接到已有向量库&quot;这件事包装成了统一的 <code>Chroma(...)</code> 初始化调用。</p><p>**记忆点：<code>search_kwargs={&quot;k&quot;: N}</code> 控制&quot;取几条&quot;，<code>from_documents</code> 和 <code>persist_directory</code> 分别对应&quot;临时构建&quot;和&quot;加载已有&quot;两种向量库使用方式。**</p>"}]},{"name":"深化阶段·LangGraph 基础（用状态图重写 ReAct）","questions":[{"qnum":1,"qtext":"LangGraph 的 `StateGraph` 和手写 `while` 循环相比，核心区别是什么？","answerHtml":"<p>手写 <code>while</code> 循环把 Agent 状态隐式地藏在 <code>messages</code> 列表里，流程用 <code>if/return</code> 控制；<code>StateGraph</code> 把状态显式定义为 <code>TypedDict</code>，流程表达为 Node + Edge 的有向图。</p><p>核心区别体现在三点：</p><ol><li><strong>状态可见</strong>：<code>AgentState</code> 的每个字段都有名字和类型，任何 Node 都能读/写，不需要解析消息内容才能知道&quot;当前处于哪一步&quot;</li><li><strong>可中断</strong>：图可以在任意 Node 后加 <code>interrupt_before</code>，执行到那里自动挂起，等待外部信号继续；<code>while</code> 循环不行，函数栈不能挂起</li><li><strong>可持久化</strong>：接入 <code>MemorySaver</code> 或任意 Checkpointer，状态快照自动持久化，进程重启后可恢复；<code>while</code> 循环里的状态随进程死亡</li></ol><p>适用判断：如果不需要中断、持久化、复杂分支，手写 <code>while</code> 更简洁；一旦出现这三类需求中的任何一个，就该切换到 LangGraph。</p>"},{"qnum":2,"qtext":"LangGraph `Node` 函数的签名是什么？返回值有什么规范？","answerHtml":"<p>Node 函数接收完整的 <code>State</code>，返回一个字典——<strong>只包含需要更新的字段，不返回完整 State</strong>：</p><pre><code class=\"language-python\">def call_model(state: AgentState) -&gt; dict:\n    response = llm_with_tools.invoke(state[&quot;messages&quot;])\n    return {\n        &quot;messages&quot;: [response],       # 只返回变化的字段\n        &quot;iteration&quot;: state[&quot;iteration&quot;] + 1,\n    }</code></pre><p>返回值里没有出现的字段，LangGraph 保持原值不动（不是置空，是不动）。这是 Node 和普通函数不同的地方：不需要把整个 State 复制一遍再传出去，只说&quot;我改了什么&quot;就够了。</p><p>LangGraph 用 Reducer 决定如何把返回的局部更新合并进当前 State：没有 Reducer 标注的字段直接覆盖，用 <code>Annotated[list, add_messages]</code> 标注的字段则把新内容追加进去。</p>"},{"qnum":3,"qtext":"`Annotated[list, add_messages]` 是什么，为什么消息历史字段要用它？","answerHtml":"<p><code>Annotated[list, add_messages]</code> 是 LangGraph 的 Reducer 语法：<code>add_messages</code> 告诉 LangGraph 不要用新值直接覆盖 <code>messages</code> 字段，而是把 Node 返回的新消息<strong>追加</strong>到原列表末尾，并对 <code>tool_call_id</code> 相同的消息做去重更新。</p><pre><code class=\"language-python\">class AgentState(TypedDict):\n    messages: Annotated[list, add_messages]   # 追加 Reducer\n    iteration: int                             # 直接覆盖</code></pre><p>如果不加 <code>add_messages</code>，每次 Node 返回 <code>{&quot;messages&quot;: [new_msg]}</code> 都会把整个 <code>messages</code> 字段替换成只含一条消息的列表，之前的对话历史全丢了。</p><p><code>add_messages</code> 还处理了 <code>AIMessage</code> / <code>HumanMessage</code> / <code>ToolMessage</code> 的混合场景，以及工具重试时 <code>tool_call_id</code> 重复的边界情况——手写追加逻辑很容易踩这些坑。</p>"},{"qnum":4,"qtext":"LangGraph 的条件边（`add_conditional_edges`）怎么用？和固定边有什么区别？","answerHtml":"<p>固定边用 <code>add_edge(&quot;a&quot;, &quot;b&quot;)</code>，Node <code>a</code> 执行完<strong>始终</strong>跳到 Node <code>b</code>，不看 State 内容。</p><p>条件边用 <code>add_conditional_edges(&quot;a&quot;, routing_fn, mapping)</code>：<code>routing_fn</code> 接收当前 State，返回一个字符串 key；<code>mapping</code> 把 key 映射到目标 Node 名称：</p><pre><code class=\"language-python\">def should_continue(state: AgentState) -&gt; str:\n    last = state[&quot;messages&quot;][-1]\n    if state[&quot;iteration&quot;] &gt;= MAX_ITERATIONS:\n        return &quot;end&quot;\n    if not getattr(last, &quot;tool_calls&quot;, None):\n        return &quot;end&quot;\n    return &quot;continue&quot;\n\ngraph.add_conditional_edges(\n    &quot;call_model&quot;,\n    should_continue,\n    {&quot;continue&quot;: &quot;call_tools&quot;, &quot;end&quot;: END},\n)</code></pre><p><code>routing_fn</code> 只做决策，不修改 State，返回字符串——它不是 Node，不会出现在图的节点列表里，但会出现在 <code>draw_mermaid()</code> 的边标注上。</p><p>ReAct 循环里的&quot;继续 vs 结束&quot;就是最典型的二路条件边；Day 34 会扩展成工具失败走重试、成功走汇总的三路路由。</p>"},{"qnum":5,"qtext":"在 LangGraph 中，`MAX_ITERATIONS` 这类静态配置应该放进 `State` 里还是写成常量？为什么？","answerHtml":"<p>应该写成<strong>常量</strong>（或传入 <code>graph.compile(configurable={...})</code>），**不应该放进 <code>State</code>**。</p><p>原因：<code>State</code> 的设计原则是&quot;运行时会变化的数据&quot;——消息历史会随每轮对话增长，迭代计数会随每个 Node 递增，这些属于 State。<code>MAX_ITERATIONS</code> 是图的静态配置，从第一步到最后一步始终是同一个值，放进 State 会带来两个问题：</p><ol><li>每个 Node 的返回字典都要带上它（即使没有改动），或者忘记带就被 Reducer 置空</li><li>让 <code>AgentState</code> 的语义变模糊——读到它的人不清楚&quot;这是个会变化的运行时值，还是个不变的配置&quot;</li></ol><p>正确做法：在 <code>routing_fn</code> 或 Node 内部直接引用模块级常量 <code>MAX_ITERATIONS = 8</code>，或通过 <code>config</code> 参数传入（LangGraph 支持 <code>graph.invoke(state, config={&quot;configurable&quot;: {&quot;max_iter&quot;: 8}})</code>）。</p>"},{"qnum":6,"qtext":"LangGraph 里 Edge 有哪几种类型？分别用什么 API 创建，各自的用途是什么？","answerHtml":"<p>LangGraph 的 Edge 一共有四种类型：</p><div class=\"table-wrap\"><table><thead><tr><th>Edge 类型</th><th>代码写法</th><th>用途</th></tr></thead><tbody><tr><td><strong>固定边</strong></td><td><code>graph.add_edge(&quot;node_a&quot;, &quot;node_b&quot;)</code></td><td>始终跳到下一个固定节点，不看 State</td></tr><tr><td><strong>条件边</strong></td><td><code>graph.add_conditional_edges(&quot;node_a&quot;, routing_fn)</code></td><td>根据 State 内容动态决定下一步（Day 34 重点）</td></tr><tr><td><strong>入口边</strong></td><td><code>graph.set_entry_point(&quot;node_a&quot;)</code></td><td>图从哪个 Node 开始执行</td></tr><tr><td><strong>结束边</strong></td><td><code>graph.add_edge(&quot;node_a&quot;, END)</code></td><td>图在哪个 Node 后结束</td></tr></tbody></table></div><p>Day 33 的 ReAct 图用到了其中三种：<code>set_entry_point(&quot;call_model&quot;)</code> 作为入口边；<code>call_model</code> 到 <code>call_tools</code> / <code>END</code> 之间用条件边（<code>should_continue</code> 决定去向）；<code>call_tools</code> 回 <code>call_model</code> 用固定边（工具执行完必然回模型，不需要判断）。<code>END</code> 本质上是 LangGraph 内置的一个特殊终止节点，<code>add_edge(&quot;node&quot;, END)</code> 就是结束边的写法。</p><p>这四种类型合起来就能表达任意复杂度的流程图：入口边定起点，固定边表达确定的流转，条件边表达分叉，结束边（连到 <code>END</code>）表达终点。</p><p><strong>记忆点：入口边定起点、结束边定终点、固定边表达&quot;必然去向&quot;、条件边表达&quot;看情况去向&quot;——四种边组合起来就是完整的图结构。</strong></p>"}]},{"name":"深化阶段·条件边与分支路由","questions":[{"qnum":1,"qtext":"`add_conditional_edges` 的三个参数分别是什么？条件边和固定边的本质区别是什么？","answerHtml":"<p><code>add_conditional_edges</code> 接收三个参数：</p><pre><code class=\"language-python\">graph.add_conditional_edges(\n    &quot;call_tools&quot;,        # ① 源节点：从哪个节点执行完之后开始判断\n    route_after_tools,   # ② 路由函数：接收 State，返回一个字符串 key\n    {&quot;retry&quot;: &quot;retry_node&quot;, &quot;done&quot;: &quot;summarize&quot;},   # ③ 映射表：key → 目标节点名\n)</code></pre><p>执行时机是源节点执行完、State 更新完之后：LangGraph 调用路由函数拿到 key，再去映射表查目标节点跳转。</p><p>本质区别：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>固定边 <code>add_edge(&quot;a&quot;, &quot;b&quot;)</code></th><th>条件边 <code>add_conditional_edges</code></th></tr></thead><tbody><tr><td>下一步去向</td><td>恒定，a 之后<strong>必然</strong>去 b</td><td><strong>看 State 内容</strong>动态决定</td></tr><tr><td>是否看运行时状态</td><td>不看</td><td>看</td></tr><tr><td>适用</td><td>无分叉的流转</td><td>有真正分叉的流转</td></tr></tbody></table></div><p><strong>记忆点：一句话判断——下一步去哪，是不是由 State 的运行时内容决定的？是就用条件边，不是就用固定边。</strong></p>"},{"qnum":2,"qtext":"LangGraph 里的\"路由函数\"和\"Node\"有什么区别？路由函数有哪三条约束？","answerHtml":"<p>Node 和路由函数都接收 <code>State</code>，但职责完全相反：<strong>Node 负责&quot;改状态&quot;，路由函数负责&quot;看状态决定去哪&quot;</strong>。</p><p>路由函数的三条约束：</p><div class=\"table-wrap\"><table><thead><tr><th>约束</th><th>说明</th><th>违反后果</th></tr></thead><tbody><tr><td>只读 State</td><td>只做判断，不返回状态更新</td><td>返回 dict 会被当成 key 找不到而报错</td></tr><tr><td>返回字符串 key</td><td>返回值必须是映射表里存在的 key</td><td>返回未登记的 key 抛 <code>ValueError</code></td></tr><tr><td>不是 Node</td><td>不出现在节点列表，但出现在 <code>draw_mermaid()</code> 的边标注上</td><td>——</td></tr></tbody></table></div><pre><code class=\"language-python\">def route_after_tools(state) -&gt; str:\n    if state[&quot;tool_ok&quot;]:\n        return &quot;done&quot;\n    return &quot;retry&quot; if state[&quot;retry_count&quot;] &lt; MAX_RETRIES else &quot;done&quot;\n    # ❌ 不能 return {&quot;retry_count&quot;: ...}——改状态是 Node 的活</code></pre><p><strong>改状态的活永远交给 Node，路由函数只读不写。</strong></p>"},{"qnum":3,"qtext":"判断一条边该用条件边还是固定边，判断标准是什么？把该固定的边写成条件边有什么坏处？","answerHtml":"<p>判断标准：<strong>下一步去向是否由 State 的运行时内容决定</strong>。是（有真正分叉）→ 条件边；否（恒定去向）→ 固定边。</p><p>一个反例（过度设计）：</p><pre><code class=\"language-python\"># ❌ retry_node 之后其实必然回 call_model，却硬套条件边\ndef route_after_retry(state) -&gt; str:\n    return &quot;back&quot;          # 永远只返回这一个值\ngraph.add_conditional_edges(&quot;retry_node&quot;, route_after_retry, {&quot;back&quot;: &quot;call_model&quot;})\n\n# ✅ 只有一个确定去向，用固定边\ngraph.add_edge(&quot;retry_node&quot;, &quot;call_model&quot;)</code></pre><p>坏处：路由函数所有分支只返回一个值时，条件边没有任何分叉价值，反而让 <code>draw_mermaid()</code> 画出一条带标注的&quot;假分支&quot;，误导读图的人以为这里有条件判断，增加理解成本。</p><p><strong>判据：如果路由函数所有分支最终只可能返回一个值，那它就不该是条件边。</strong></p>"},{"qnum":4,"qtext":"给 ReAct 图加\"失败走重试、成功走汇总\"分支时，State 要新增哪些字段？为什么 retry_count 不复用 iteration？","answerHtml":"<p>在 Day 33 的 <code>AgentState</code> 基础上新增两个字段：</p><pre><code class=\"language-python\">class AgentState(TypedDict):\n    messages: Annotated[list, add_messages]\n    iteration: int\n    tool_ok: bool        # 新增：上一次工具执行是否全部成功（路由函数据此判断）\n    retry_count: int     # 新增：已重试次数</code></pre><p><code>tool_ok</code> 由 <code>call_tools</code> 节点在执行时写入（任一工具返回含 <code>error</code> 键就置 <code>False</code>），路由函数 <code>route_after_tools</code> 据此决定走 <code>retry</code> 还是 <code>done</code>。</p><p><code>retry_count</code> 不复用 <code>iteration</code> 的原因：两者语义不同。</p><ul><li><code>iteration</code> 统计&quot;模型被调用了几轮&quot;——正常的多步 ReAct 也会增长</li><li><code>retry_count</code> 统计&quot;因工具失败而重试了几次&quot;——只在错误路径上增长</li></ul><p>如果混用，一次正常的多轮对话会被误判成&quot;重试太多次&quot;而提前触发降级。State 字段要各司其职，一个字段只表达一个语义。</p>"},{"qnum":5,"qtext":"怎么验证图在工具失败时确实走了重试分支而不是崩溃？","answerHtml":"<p>核心目标是&quot;制造失败 → 观察到走了 <code>retry</code> 分支 → 程序没崩溃&quot;。三种观察手段：</p><pre><code class=\"language-python\"># 方式 1：在 retry_node 里打印（最直接）\ndef retry_node(state):\n    print(f&quot;⟳ 第 {state[&#x27;retry_count&#x27;] + 1} 次重试&quot;)\n    return {&quot;retry_count&quot;: state[&quot;retry_count&quot;] + 1}\n\n# 方式 2：用 stream 逐节点观察经过路径\nfor event in graph.stream(initial_state):\n    print(list(event.keys()))\n    # 失败案例会看到 [&#x27;call_model&#x27;] [&#x27;call_tools&#x27;] [&#x27;retry_node&#x27;] [&#x27;call_model&#x27;] ...\n\n# 方式 3：可视化确认 retry 边存在\nprint(graph.get_graph().draw_mermaid())\n# call_tools -. retry .-&gt; retry_node</code></pre><p>构造失败的方法：让工具对非法输入返回 <code>{&quot;error&quot;: ...}</code>（如查询不支持的城市），<code>call_tools</code> 检测到 error 键把 <code>tool_ok</code> 置 <code>False</code>，路由函数返回 <code>&quot;retry&quot;</code>。关键验证点是**程序没有抛异常崩溃，而是沿着 <code>retry</code> 边流转，最终给出降级回答**——这正是条件边相比手写 <code>try/except + continue</code> 的价值：错误处理成了图里一条可命名、可观察的边。</p>"},{"qnum":6,"qtext":"`add_conditional_edges` 支持\"路由函数返回抽象 key 再查映射表\"和\"路由函数直接返回节点名\"两种写法，二者有什么区别？为什么更推荐前者？","answerHtml":"<p>两种写法功能等价，但设计意图不同：</p><pre><code class=\"language-python\"># 写法 A（推荐）：路由函数返回抽象 key，映射表决定 key → 节点\ngraph.add_conditional_edges(&quot;call_tools&quot;, route_after_tools,\n                            {&quot;retry&quot;: &quot;retry_node&quot;, &quot;done&quot;: &quot;summarize&quot;})\n\n# 写法 B：路由函数直接返回节点名（省掉映射表）\ndef route_after_tools(state) -&gt; str:\n    return &quot;retry_node&quot; if not state[&quot;tool_ok&quot;] else &quot;summarize&quot;\ngraph.add_conditional_edges(&quot;call_tools&quot;, route_after_tools)</code></pre><div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>写法 A（有映射表）</th><th>写法 B（直接返回节点名）</th></tr></thead><tbody><tr><td>路由逻辑与节点名</td><td>解耦：改节点名只改映射表，路由函数不用动</td><td>耦合：改节点名要同步改路由函数里的字符串</td></tr><tr><td>可读性</td><td>key 是语义化的（<code>retry</code>/<code>done</code>），一眼看出业务含义</td><td>直接是节点名，读代码时要绕一层才能理解语义</td></tr><tr><td><code>draw_mermaid()</code> 标注</td><td>用 key 标注边（<code>-. retry .-&gt;</code>），语义清晰</td><td>用节点名标注边，稍隐晦</td></tr></tbody></table></div><p>推荐写法 A 的核心原因：写法 A 的 key（<code>retry</code>/<code>done</code>）表达的是&quot;业务语义&quot;，节点名（<code>retry_node</code>/<code>summarize</code>）表达的是&quot;实现细节&quot;——两者解耦之后，重命名节点（比如把 <code>summarize</code> 改成 <code>finalize</code>）只需要改映射表这一行，路由函数完全不用动；写法 B 把两者耦合在一起，任何节点改名都要跟着改路由函数内部的字符串，容易漏改导致运行时找不到节点。</p><p><strong>记忆点：映射表写法把&quot;路由决策&quot;和&quot;节点命名&quot;解耦，改节点名不改路由逻辑——这是写法 A 优于写法 B 的核心原因。</strong></p>"}]},{"name":"深化阶段·循环终止与 Checkpoint 持久化","questions":[{"qnum":1,"qtext":"LangGraph 里有哪两层循环终止保护？它们分别对应什么粒度，触发行为有什么不同？","answerHtml":"<p>两层终止保护：</p><div class=\"table-wrap\"><table><thead><tr><th>层级</th><th>实现方式</th><th>计数粒度</th><th>触发行为</th></tr></thead><tbody><tr><td><strong>业务层</strong></td><td>路由函数里比较 <code>state[&quot;iteration&quot;] &gt;= MAX_ITERATIONS</code></td><td>模型被调用的轮次（语义粒度）</td><td>走&quot;结束&quot;分支，模型给出降级回答，优雅终止</td></tr><tr><td><strong>框架层</strong></td><td><code>config = {&quot;recursion_limit&quot;: N}</code></td><td>所有 Node 执行次数之和（物理粒度）</td><td>抛 <code>GraphRecursionError</code>，需调用层 try/except 捕获</td></tr></tbody></table></div><p>两层分工：业务层保证<strong>语义正确</strong>（给用户有意义的&quot;抱歉没查到&quot;），框架层保证<strong>系统安全</strong>（防止业务层逻辑 bug 导致真正的死循环拖垮进程）。生产代码两层都要有：</p><pre><code class=\"language-python\">from langgraph.errors import GraphRecursionError\ntry:\n    result = graph.invoke(state, config={&quot;recursion_limit&quot;: 50, &quot;configurable&quot;: {...}})\nexcept GraphRecursionError:\n    result = &quot;执行超限，请简化问题后重试&quot;</code></pre><p><strong>记忆点：业务层管&quot;语义终止&quot;，框架层管&quot;系统兜底&quot;，两层互补不替代。</strong></p>"},{"qnum":2,"qtext":"Checkpoint 和 State 有什么区别？`thread_id` 的作用是什么？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>概念</th><th>是什么</th><th>数量</th></tr></thead><tbody><tr><td><strong>State</strong></td><td>图在某一时刻的完整状态（<code>TypedDict</code> 实例）</td><td>运行中只有一份&quot;当前状态&quot;</td></tr><tr><td><strong>Checkpoint</strong></td><td>每个 Node 执行完后对 State 打的快照，附带 <code>next</code>（下一节点）、<code>created_at</code> 等元数据</td><td>一次图执行产生多个历史快照</td></tr></tbody></table></div><p><code>thread_id</code> 是 Checkpointer 用来隔离不同会话的键。同一图实例里，不同 <code>thread_id</code> 的快照完全独立，互不干扰。相同 <code>thread_id</code> 的多次 <code>invoke</code> 共享快照序列，后一次自动延续前一次的状态——这是多轮对话记忆和跨进程恢复的基础。</p><pre><code class=\"language-python\"># 用户 A 和用户 B 的快照完全隔离\nconfig_a = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;user-alice&quot;}}\nconfig_b = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;user-bob&quot;}}</code></pre>"},{"qnum":3,"qtext":"`MemorySaver` 怎么接入？接入后 `invoke` 时需要传哪个参数？为什么？","answerHtml":"<p>接入只需两步：</p><pre><code class=\"language-python\">from langgraph.checkpoint.memory import MemorySaver\n\nmemory = MemorySaver()\ngraph = builder.compile(checkpointer=memory)   # ① compile 时传 checkpointer</code></pre><p><code>invoke</code> 时必须传 <code>config</code>：</p><pre><code class=\"language-python\">config = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;session-1&quot;}}\ngraph.invoke(initial_state, config=config)      # ② invoke 时传 config</code></pre><p>必须传 <code>config</code> 的原因：Checkpointer 靠 <code>thread_id</code> 来区分不同会话的快照序列。不传 <code>config</code> 时 LangGraph 不知道这次执行属于哪个会话，无法读写正确的快照，会直接报错。</p><p><strong>Checkpoint 是横切关注点</strong>：接入后节点和边的代码完全不用改，只改初始化和 <code>invoke</code> 调用处。</p>"},{"qnum":4,"qtext":"`interrupt_before` 是什么？`invoke(None)` 为什么能从暂停点继续执行？","answerHtml":"<p><code>interrupt_before</code> 是 <code>compile</code> 时传入的节点名列表，指定哪些节点在执行<strong>前</strong>自动暂停：</p><pre><code class=\"language-python\">graph = builder.compile(checkpointer=memory, interrupt_before=[&quot;call_tools&quot;])</code></pre><p>图执行到 <code>call_tools</code> 前，自动将当前 State 存入 Checkpoint，然后 <code>invoke</code> 返回——此时 <code>graph.get_state(config).next == (&#x27;call_tools&#x27;,)</code>，说明图还未结束，在等待继续信号。</p><p><code>invoke(None)</code> 能从暂停点继续，原因：</p><ol><li><code>None</code> 告诉 LangGraph &quot;不注入新的初始状态&quot;</li><li>LangGraph 从 Checkpointer 读取 <code>thread_id</code> 对应的最新快照</li><li>快照里的 <code>next</code> 字段指向 <code>call_tools</code>，图从这里继续执行</li></ol><pre><code class=\"language-python\"># 暂停后，人工确认，然后恢复\nfinal = graph.invoke(None, config=config)</code></pre><p><code>interrupt_before</code> + <code>invoke(None)</code> + <code>update_state</code> 三者组合，就是 Day 36 Human-in-the-loop 的完整实现基础。</p>"},{"qnum":5,"qtext":"`MemorySaver` 和 `SqliteSaver` 各适用什么场景？切换 Checkpointer 需要改哪些代码？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>MemorySaver</th><th>SqliteSaver</th></tr></thead><tbody><tr><td>存储位置</td><td>进程内存</td><td>磁盘 SQLite 文件</td></tr><tr><td>进程重启</td><td>快照<strong>丢失</strong></td><td>快照<strong>保留</strong></td></tr><tr><td>适用场景</td><td>开发调试、单次会话验证</td><td>长任务、跨会话/跨进程恢复、生产</td></tr></tbody></table></div><p>切换只需改初始化一行，其余代码（节点、边、<code>invoke</code>、<code>get_state</code>）<strong>零改动</strong>：</p><pre><code class=\"language-python\"># 开发阶段\nmemory = MemorySaver()\n\n# 生产阶段，改这一行即可\nfrom langgraph.checkpoint.sqlite import SqliteSaver\nmemory = SqliteSaver.from_conn_string(&quot;checkpoints.db&quot;)\n\n# 后续代码完全不变\ngraph = builder.compile(checkpointer=memory)\ngraph.invoke(initial_state, config=config)\ngraph.get_state(config)\ngraph.invoke(None, config=config)</code></pre><p>这是&quot;Checkpoint 是横切关注点&quot;的直接体现：持久化策略和业务逻辑解耦，换存储方案不需要动图的任何业务代码。</p>"},{"qnum":6,"qtext":"`graph.get_state()` 返回的 `StateSnapshot` 有哪些关键字段？如何用它判断图是处于暂停状态还是已经执行完毕？","answerHtml":"<p><code>StateSnapshot</code> 包含四个关键字段：</p><pre><code class=\"language-python\">snapshot = graph.get_state(config)\nsnapshot.values        # dict：当前 State 字段值\nsnapshot.next          # tuple：下一步要执行的节点，() 表示已结束\nsnapshot.config        # dict：这个快照对应的 config\nsnapshot.created_at    # str：ISO 格式时间戳</code></pre><p>判断图是否暂停的关键是 <code>snapshot.next</code>：**如果 <code>next</code> 非空（如 <code>(&#x27;call_tools&#x27;,)</code>），说明图还没执行完，正在某个节点前等待**；如果 <code>next</code> 为空元组 <code>()</code>，说明图已经跑完到 <code>END</code>。</p><pre><code class=\"language-python\">snapshot = graph.get_state(config)\nif snapshot.next:\n    print(f&quot;图暂停在 {snapshot.next} 之前，等待恢复&quot;)\nelse:\n    print(&quot;图已执行完毕&quot;)</code></pre><p>除了查看当前快照，<code>graph.get_state_history(config)</code> 还能拿到该 <code>thread_id</code> 下的<strong>全部历史快照</strong>（从新到旧的迭代器），对应一次图执行在每个 Node 执行完后打的快照序列：</p><pre><code class=\"language-python\">for snapshot in graph.get_state_history(config):\n    print(snapshot.created_at, snapshot.next)</code></pre><p><code>get_state</code> 只看&quot;现在&quot;，<code>get_state_history</code> 能回溯&quot;图是怎么一步步走到现在的&quot;，两者配合是调试 Checkpoint 逻辑（比如确认某一步的 State 是否符合预期）最直接的手段。</p><p>**记忆点：<code>snapshot.next</code> 非空 = 暂停中，为空元组 = 已结束；<code>get_state</code> 看当前，<code>get_state_history</code> 看全部历史轨迹。**</p>"},{"qnum":7,"qtext":"`SqliteSaver` 相比 `MemorySaver` 是如何实现\"跨进程恢复\"的？结合\"进程 1 暂停 → 进程 2 恢复\"的场景说明关键机制。","answerHtml":"<p><code>MemorySaver</code> 把 Checkpoint 存在进程内存里，进程一退出快照就没了；<code>SqliteSaver</code> 把 Checkpoint 写进磁盘上的 SQLite 文件，只要文件还在，任何进程都能读到同一份快照数据：</p><pre><code class=\"language-python\">from langgraph.checkpoint.sqlite import SqliteSaver\n\n# 方式 A：上下文管理器（推荐）\nwith SqliteSaver.from_conn_string(&quot;checkpoints.db&quot;) as memory:\n    graph = builder.compile(checkpointer=memory)\n    result = graph.invoke(initial_state, config=config)\n\n# 方式 B：手动管理连接\nmemory = SqliteSaver.from_conn_string(&quot;checkpoints.db&quot;)\ngraph = builder.compile(checkpointer=memory)</code></pre><p>跨进程恢复的完整场景：</p><pre><code class=\"language-python\"># 进程 1：开始执行，在 call_tools 前暂停\ngraph.invoke(initial_state, config={&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;task-001&quot;}})\n# 此时进程 1 退出，checkpoints.db 里已经写入了暂停点的快照\n\n# 进程 2（全新进程，甚至可以是不同机器上挂载同一份数据库文件）：\n# 重启后，从暂停点继续\ngraph.invoke(None, config={&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;task-001&quot;}})\n# invoke(None) + 同一 thread_id → LangGraph 从 checkpoints.db 里查 thread_id=&quot;task-001&quot; 的最新快照 → 继续执行</code></pre><p>关键机制是两点：① Checkpoint 数据落盘而不是留在进程堆内存里，进程生命周期和 Checkpoint 生命周期彻底解耦；② <code>thread_id</code> 是查找快照的唯一键，只要新进程用相同的 <code>thread_id</code> 连上同一个数据库文件，就能查到上次暂停时的完整 State，<code>invoke(None)</code> 触发的仍然是&quot;读快照 → 从 <code>next</code> 指向的节点继续&quot;这套逻辑，和同进程内恢复完全一样。</p><p>**记忆点：<code>SqliteSaver</code> 把快照从进程内存搬到磁盘文件，<code>thread_id</code> 是跨进程也能找到同一份快照的钥匙——恢复逻辑本身（<code>invoke(None)</code>）不因跨进程而改变。**</p>"}]},{"name":"深化阶段·Human-in-the-loop 人工审核节点","questions":[{"qnum":1,"qtext":"Human-in-the-loop 的三条审核路径分别是什么？各自用什么 LangGraph API 实现？","answerHtml":"<p>在 <code>interrupt_before=[&quot;call_tools&quot;]</code> 暂停后，有三条路径：</p><div class=\"table-wrap\"><table><thead><tr><th>路径</th><th>工具是否执行</th><th>实现方式</th></tr></thead><tbody><tr><td><strong>批准</strong></td><td>✅ 执行，参数不变</td><td><code>graph.invoke(None, config)</code></td></tr><tr><td><strong>修改参数后批准</strong></td><td>✅ 执行，用新参数</td><td><code>graph.update_state(config, {&quot;messages&quot;: [corrected_ai_msg]})</code> → <code>graph.invoke(None, config)</code></td></tr><tr><td><strong>拒绝</strong></td><td>❌ 不执行</td><td><code>graph.update_state(config, {&quot;messages&quot;: rejection_msgs}, as_node=&quot;call_tools&quot;)</code> → <code>graph.invoke(None, config)</code></td></tr></tbody></table></div><p>三条路径最终都调用 <code>invoke(None)</code> 恢复执行，区别在于恢复前是否修改了 State：批准不改、修改参数改了模型消息、拒绝注入了假 ToolMessage 并声明 <code>as_node</code>。</p>"},{"qnum":2,"qtext":"`update_state` 的 `as_node` 参数有什么用？拒绝路径为什么必须传 `as_node=\"call_tools\"`？","answerHtml":"<p><code>as_node</code> 告诉 LangGraph：这次 State 更新应该被视为<strong>哪个节点执行完毕后的输出</strong>。LangGraph 用它来确定图的下一步走向。</p><div class=\"table-wrap\"><table><thead><tr><th>as_node 取值</th><th>图认为谁刚执行完</th><th>下一步执行</th></tr></thead><tbody><tr><td>不传</td><td>保持暂停位置（call_tools 前）</td><td>继续执行 call_tools</td></tr><tr><td><code>&quot;call_tools&quot;</code></td><td>call_tools 执行完毕</td><td>沿 call_tools 出边走 → call_model</td></tr></tbody></table></div><p>拒绝路径的目标是<strong>跳过 call_tools，让模型看到拒绝结果后给用户解释</strong>。如果不传 <code>as_node</code>，图仍然会去执行 <code>call_tools</code>（我们注入的 ToolMessage 会被 <code>add_messages</code> 追加，然后 <code>call_tools</code> 再追加真实的工具结果），工具还是会被调用。传了 <code>as_node=&quot;call_tools&quot;</code> 之后，图认为 <code>call_tools</code> 已经跑完了，直接去 <code>call_model</code>，拒绝消息就是工具的&quot;执行结果&quot;。</p>"},{"qnum":3,"qtext":"修改工具参数时，为什么要保持 `AIMessage` 的 `id` 不变？","answerHtml":"<p><code>add_messages</code> Reducer 合并消息时遵循这个规则：**相同 <code>id</code> 的消息，新消息替换旧消息；不同 <code>id</code> 的消息，追加到列表末尾**。</p><pre><code class=\"language-python\">corrected_msg = AIMessage(\n    content=last_ai_msg.content,\n    tool_calls=[corrected_tool_call],\n    id=last_ai_msg.id,      # 关键：同 id → 替换原始消息\n)\ngraph.update_state(config, {&quot;messages&quot;: [corrected_msg]})</code></pre><p>如果用新 <code>id</code>，State 里会变成两条 <code>AIMessage</code>：原始的（带旧参数的 tool_calls）和新的（带新参数的 tool_calls）。<code>call_tools</code> 执行时读最后一条消息，得到新参数，结果看似正确；但原始消息留在历史里，会给模型带来困惑——它会看到一条没有对应 ToolMessage 的&quot;悬空&quot;工具调用记录。保持相同 <code>id</code> 让更新语义变成&quot;修正&quot;而非&quot;追加&quot;，History 干净可追溯。</p>"},{"qnum":4,"qtext":"哪些操作必须加人工确认？给出判断标准和典型例子。","answerHtml":"<p>判断标准：操作满足以下<strong>任意一条</strong>就应该加确认。</p><div class=\"table-wrap\"><table><thead><tr><th>条件</th><th>典型例子</th></tr></thead><tbody><tr><td><strong>不可逆</strong>：执行后无法撤销</td><td>发送邮件、删除文件、提交订单</td></tr><tr><td><strong>涉及外部副作用</strong>：影响系统边界之外</td><td>调用第三方 API 写入、发布内容</td></tr><tr><td><strong>涉及资金</strong></td><td>支付、转账、退款</td></tr><tr><td><strong>涉及隐私数据</strong></td><td>读取/传输用户个人信息、导出数据</td></tr><tr><td><strong>高影响范围</strong></td><td>批量发通知、批量修改权限</td></tr></tbody></table></div><p>反例（不需要审核）：查询天气/汇率/搜索结果——只读、无副作用、可重复执行，出错重试即可，不需要人工干预。</p><p><strong>记忆口诀：不可逆、有副作用、涉及钱或隐私、影响范围大——这四类必须加确认。</strong></p>"},{"qnum":5,"qtext":"生产场景里如何只对高风险工具触发审核，而让低风险工具（如查天气）自动执行？","answerHtml":"<p><code>interrupt_before=[&quot;call_tools&quot;]</code> 会对所有工具调用暂停，不够精细。生产场景的做法是在 <code>call_tools</code> 节点内部按工具名过滤：</p><pre><code class=\"language-python\">HIGH_RISK_TOOLS = {&quot;send_email&quot;, &quot;delete_record&quot;, &quot;process_payment&quot;}\n\ndef call_tools_with_filter(state: AgentState) -&gt; dict:\n    last_message = state[&quot;messages&quot;][-1]\n    safe_calls = [tc for tc in last_message.tool_calls if tc[&quot;name&quot;] not in HIGH_RISK_TOOLS]\n    high_risk_calls = [tc for tc in last_message.tool_calls if tc[&quot;name&quot;] in HIGH_RISK_TOOLS]\n\n    results = []\n    # 低风险工具立即执行\n    for tc in safe_calls:\n        result = tool_registry[tc[&quot;name&quot;]].invoke(tc[&quot;args&quot;])\n        results.append(ToolMessage(content=str(result), tool_call_id=tc[&quot;id&quot;]))\n\n    # 高风险工具：暂存到 State，交给后续的 human_review 节点处理\n    return {&quot;messages&quot;: results, &quot;pending_approval&quot;: high_risk_calls}</code></pre><p>另一种更简洁的实现：把高风险工具拆到独立节点 <code>call_high_risk_tools</code>，只对该节点加 <code>interrupt_before</code>，低风险工具走 <code>call_safe_tools</code> 节点（无中断）。这样图结构上就分离了两类工具的处理路径，审核逻辑和执行逻辑都更清晰。</p>"},{"qnum":6,"qtext":"演示\"拒绝\"路径时，怎么验证 `send_email` 工具确实没有被调用？这种验证方式对 Human-in-the-loop 系统的可靠性验证有什么启发？","answerHtml":"<p>验证方法是看工具函数内部的副作用有没有真正发生。<code>send_email</code> 工具在真正执行时会打印一行模拟发送日志：</p><pre><code class=\"language-python\">@tool\ndef send_email(to: str, subject: str, body: str) -&gt; dict:\n    &quot;&quot;&quot;发送电子邮件。该操作不可逆，发送前需要人工确认。&quot;&quot;&quot;\n    print(f&quot;\\n📧 [模拟发送] 收件人: {to} | 主题: {subject}&quot;)   # 只有工具真正被调用才会打印\n    print(f&quot;   正文: {body}&quot;)\n    return {&quot;status&quot;: &quot;sent&quot;, &quot;to&quot;: to, &quot;subject&quot;: subject}</code></pre><p>走拒绝路径时：</p><pre><code class=\"language-python\">result_c = reject(config_c)\n# ❌ 已拒绝，工具调用被取消...\nprint(result_c[&quot;messages&quot;][-1].content)\n# 很抱歉，此次发送邮件的操作已被取消，邮件未发出。如果您需要其他帮助，请告知。</code></pre><p>**关键验证点：路径 C 中 <code>send_email</code> 内部的 <code>print(f&quot;📧 [模拟发送]...&quot;)</code> 那一行永远不会出现在控制台**——如果它打印出来了，说明拒绝逻辑失效、工具还是被真实调用了。此外还可以用 <code>graph.get_state_history(config)</code> 打印路径 C 的全部历史快照，定位到注入 <code>ToolMessage</code> 那一步，确认 <code>as_node=&quot;call_tools&quot;</code> 确实让图认为 <code>call_tools</code> 已经&quot;执行完&quot;（快照里没有出现真正执行 <code>call_tools</code> 节点产生的痕迹）。</p><p>这个验证方式的启发在于：<strong>审核逻辑对不对，不能只看模型给用户的回复措辞是否&quot;像是拒绝了&quot;</strong>——模型完全可能一边正常调用了工具、一边在回复里编造&quot;已取消&quot;的说法（幻觉）。必须验证工具函数内部真实的副作用（日志、外部系统状态）有没有发生，这是判断 Human-in-the-loop 拒绝路径是否真正生效的唯一可靠依据，光看最终文本回复是不够的。</p><p><strong>记忆点：判断拒绝路径是否生效，要看工具的真实副作用有没有发生，不能只信模型嘴上说的&quot;已取消&quot;。</strong></p>"}]},{"name":"深化阶段·第 5 周复盘（LangChain / LangGraph 适用边界）","questions":[{"qnum":1,"qtext":"LangChain LCEL 和 LangGraph 各自解决了什么问题？两者是替代关系还是互补关系？","answerHtml":"<p>两者解决的是不同层面的问题：</p><div class=\"table-wrap\"><table><thead><tr><th></th><th>LangChain LCEL</th><th>LangGraph</th></tr></thead><tbody><tr><td>解决的问题</td><td>单步链路标准化（组装 Prompt → 调模型 → 解析输出的重复劳动）</td><td>多步流程编排（状态隐式、分支不可见、不可中断/持久化）</td></tr><tr><td>核心抽象</td><td><code>Runnable</code> 接口 + `\\</td><td>` 管道语法</td></tr><tr><td>适用范围</td><td>一次&quot;输入 → 输出&quot;的链路</td><td>多个步骤组织成有状态的流程图</td></tr></tbody></table></div><p><strong>互补关系，不是替代关系</strong>。LangGraph 的 Node 本质上是 LCEL <code>Runnable</code>，可以把 <code>prompt | model | parser</code> 的 LCEL 链直接挂进 LangGraph Node。实际项目里：LCEL 负责单个 Node 内部的链路组合，LangGraph 负责 Node 之间的编排和状态管理，两者配合使用。</p>"},{"qnum":2,"qtext":"LangGraph 相比手写 `while` 循环具体解决了哪四个问题？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>手写 while 的问题</th><th>LangGraph 的解法</th></tr></thead><tbody><tr><td><strong>状态显式</strong></td><td>状态藏在 <code>messages</code> 里，看不清当前处于哪一步</td><td><code>TypedDict</code> State，每个字段有名字有类型</td></tr><tr><td><strong>流程可视化</strong></td><td><code>if/elif/else</code> 散落各处，没有名字，无法画出来</td><td>命名的 Node + Edge，<code>draw_mermaid()</code> 一行打印图结构</td></tr><tr><td><strong>持久化</strong></td><td>进程崩溃状态全丢，长任务必须一口气跑完</td><td><code>MemorySaver</code> / <code>SqliteSaver</code>，每步后自动快照</td></tr><tr><td><strong>可中断/恢复</strong></td><td>函数栈不能挂起，无法实现 Human-in-the-loop</td><td><code>interrupt_before</code> + <code>invoke(None)</code> 从暂停点继续</td></tr></tbody></table></div><p>四项能力的底层逻辑都是同一件事：<strong>State 显式化之后，持久化就是序列化 State，中断就是在某个 Node 前存快照，恢复就是反序列化快照继续执行</strong>——这些都是自然的副产品。</p>"},{"qnum":3,"qtext":"什么信号说明该引入 LangGraph？什么信号说明手写 while 够用？","answerHtml":"<p><strong>引入 LangGraph 的信号</strong>（满足任意一条）：</p><ul><li>需要在执行中等待人工输入/确认（Human-in-the-loop）</li><li>流程有多条分支路径，分支条件依赖运行时状态</li><li>进程崩溃后需要从中断点继续，而非从头开始</li><li>需要向团队演示/调试 Agent 的执行路径</li></ul><p><strong>手写 while 仍然够用的条件</strong>（需同时满足所有）：</p><ul><li>流程是线性的：用户输入 → 模型推理 → 工具执行（最多两步）</li><li>状态简单：只有 <code>messages</code> 列表，无跨步骤自定义字段</li><li>无需持久化：重启从头开始完全可以接受</li><li>无需人工介入：工具全部自动执行</li></ul><p><strong>判断口诀：不需要分支 + 不需要中断 + 不需要持久化 → 手写 while 够用；任何一个&quot;需要&quot;出现 → 考虑 LangGraph。</strong></p>"},{"qnum":4,"qtext":"为什么说\"LangGraph Node 本质上是 LCEL Runnable\"？实际项目里两者怎么配合使用？","answerHtml":"<p>LangGraph 的 Node 函数签名（接收 <code>State</code>，返回 <code>dict</code>）本质上符合 LCEL <code>Runnable</code> 接口的语义——两者都是&quot;接收输入，产生输出&quot;的可组合单元。</p><p>实际配合方式：</p><pre><code class=\"language-python\"># 单个 Node 内部用 LCEL 链处理复杂链路\nsummarize_chain = ChatPromptTemplate.from_template(&quot;总结：{text}&quot;) | llm | StrOutputParser()\n\ndef summarize_node(state: AgentState) -&gt; dict:\n    text = state[&quot;messages&quot;][-1].content\n    summary = summarize_chain.invoke({&quot;text&quot;: text})   # LCEL 链在 Node 内部运行\n    return {&quot;messages&quot;: [AIMessage(content=summary)]}\n\n# Node 挂进 LangGraph\nbuilder.add_node(&quot;summarize&quot;, summarize_node)</code></pre><p><strong>分工</strong>：LCEL 管&quot;这个 Node 内部怎么处理&quot;（链路组合），LangGraph 管&quot;这些 Node 怎么串联、状态怎么传递、何时暂停&quot;（编排）。两层职责清晰，互不越界。</p>"},{"qnum":5,"qtext":"引入 LangChain 的代价是什么？哪些场景下引入它反而增加了负担？","answerHtml":"<p><strong>代价</strong>：</p><div class=\"table-wrap\"><table><thead><tr><th>代价</th><th>具体体现</th></tr></thead><tbody><tr><td>依赖重</td><td><code>langchain-openai</code> 有几十个传递依赖，安装时间长，版本冲突风险高</td></tr><tr><td>调试透明度降低</td><td>手写每步可 <code>print</code>；LCEL 需要把链路拆开单独 <code>invoke</code> 才能看中间状态</td></tr><tr><td>版本迭代快</td><td>LangChain 破坏性变更频繁，升级可能导致代码失效</td></tr><tr><td>隐藏 API 细节</td><td>实际发出的 HTTP 请求结构、Token 计数位置被封装在框架里</td></tr></tbody></table></div><p><strong>不值得引入的场景</strong>：</p><ul><li>一次性脚本、简单单步调用——代码量反而比手写更多</li><li>调试优先——框架的中间状态需要额外步骤才能看到</li><li>团队不熟悉 LangChain——学习和维护成本超过收益</li><li>需要精确控制每一个 API 参数——框架封装屏蔽了部分参数</li></ul><p><strong>判断标准</strong>：链路复杂度越高（RAG、Agent、多步链路），框架收益越大；越简单越一次性，手写越合适。在 Day 31–32 规模的 Demo 上，LangChain 的收益不显著；到 Day 33 的 LangGraph 多步 Agent 编排，框架统一接口的价值才真正体现。</p>"},{"qnum":6,"qtext":"原生 API 手写代码里有哪三类\"重复劳动\"会在每个项目里反复出现？LCEL 的管道语法分别标准化了其中的哪一部分？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>重复劳动</th><th>手写方式</th><th>每次都要改的地方</th></tr></thead><tbody><tr><td>Provider 绑定</td><td><code>client = OpenAI(base_url=..., api_key=...)</code></td><td>换一个模型就要改调用方式</td></tr><tr><td>链路组装</td><td><code>messages = [{...}]; response = client.chat...; content = response.choices[0]...</code></td><td>每个项目都写这三行</td></tr><tr><td>输出解析</td><td><code>json.loads(content)</code> + <code>try/except</code> + <code>Pydantic(**data)</code></td><td>解析逻辑到处复制粘贴</td></tr></tbody></table></div><p>LCEL 用 <code>chain = ChatPromptTemplate.from_template(&quot;...&quot;) | ChatOpenAI(...) | StrOutputParser()</code> 一条管道对应标准化这三类：</p><ul><li><strong>Provider 绑定</strong> → 换成 <code>ChatOpenAI(...)</code> 等 <code>Runnable</code> 实例，切换 Provider 只改初始化参数，调用方式不变</li><li><strong>链路组装</strong> → <code>|</code> 操作符自动串联，不用手写 <code>messages</code> 构造和 <code>response.choices[0]</code> 解析</li><li><strong>输出解析</strong> → <code>StrOutputParser</code> / <code>PydanticOutputParser</code> 把&quot;解析 + 校验 + 失败重试&quot;封装成可复用组件</li></ul><p>**记忆点：LCEL 不是发明了新能力，而是把三段散装的重复代码收进一个 <code>Runnable</code> 协议里。**</p>"},{"qnum":7,"qtext":"手写 while 循环的三个结构性缺陷，在真实项目场景里具体会造成什么后果？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>缺陷</th><th>手写 while 里的真实后果</th></tr></thead><tbody><tr><td><strong>状态隐式（藏在 messages 里）</strong></td><td>要看&quot;这轮调了几个工具&quot;，只能遍历整个 messages 数组数 ToolMessage 的数量；加一个新字段（如 retry_count）要在调用方和工具执行处各自手动维护</td></tr><tr><td><strong>不可中断</strong></td><td>要实现 Human-in-the-loop，只能在工具执行前 <code>input()</code> 阻塞整个进程，无法在 web 服务里使用；函数栈不能挂起，无法&quot;稍后继续&quot;</td></tr><tr><td><strong>不可持久化</strong></td><td>进程崩溃后 20 步的工具调用全部白费，只能从头开始；长任务必须一口气跑完，不能分步保存进度</td></tr></tbody></table></div><p>这三类后果分别对应 LangGraph 的三项能力：<code>TypedDict</code> State 解决状态隐式、<code>interrupt_before</code> + <code>invoke(None)</code> 解决不可中断、<code>MemorySaver</code> / <code>SqliteSaver</code> 解决不可持久化。</p><p><strong>记忆点：手写 while 的缺陷不是&quot;理论上不优雅&quot;，而是会在具体运维场景里变成&quot;无法上线&quot;的硬伤。</strong></p>"},{"qnum":8,"qtext":"笔记把 Day 31–36 六天内容总结为\"能跑 → 能编排 → 能审核\"的升级路径，具体是怎么对应到每两天的？","answerHtml":"<pre><code>Day 31–32（LangChain LCEL）→ 能跑：\n  把&quot;组装 Prompt → 调用模型 → 解析输出&quot;这条链路标准化\n  原生 API 的三段分散代码 → prompt | model | parser 一条管道\n\nDay 33–34（LangGraph 基础 + 条件边）→ 能编排：\n  把 while 循环里的隐式状态 + if/else 分支 → 显式 StateGraph + 命名的 Node / Edge\n  状态可见、分支可可视化、图结构可打印\n\nDay 35–36（Checkpoint + Human-in-the-loop）→ 能审核：\n  给图加上&quot;暂停 → 持久化 → 恢复&quot;能力，进而实现人工审核决策\n  手写 while 循环里实现不了的能力，现在一行 compile 参数就能开启</code></pre><p>这条路径每一层都以前一层为基础：没有 LCEL 的单步标准化，LangGraph 的 Node 无法复用 LCEL 链；没有 LangGraph 的显式 State，Checkpoint 和中断恢复无从谈起。</p><p><strong>记忆点：&quot;能跑&quot;解决单步问题，&quot;能编排&quot;解决多步流程问题，&quot;能审核&quot;解决人机协作问题——层层递进，不能跳步。</strong></p>"}]},{"name":"深化阶段·MCP 协议原理","questions":[{"qnum":1,"qtext":"MCP 是什么？它解决了工具集成的哪个核心问题？\"USB-C 类比\"的准确性体现在哪里？","answerHtml":"<p>MCP（Model Context Protocol）是 Anthropic 在 2024 年底发布的开放协议，解决的核心问题是<strong>工具集成的碎片化</strong>：每个 AI 应用各自写一套工具集成代码，工具无法跨应用、跨语言复用。</p><p>MCP 的核心主张：把工具（Tools）、数据（Resources）、提示词（Prompts）打包成标准化的 MCP Server，任何遵循 MCP 协议的 AI 应用（MCP Client）都可以发现并使用，不受编程语言限制。</p><p>&quot;USB-C 类比&quot;的准确性：</p><ul><li><strong>USB-C 统一了设备 ↔ 充电器接口</strong>：任何 USB-C 设备都能用任何 USB-C 充电器，不需要专属充电器</li><li><strong>MCP 统一了 AI 应用 ↔ 工具服务器接口</strong>：任何 MCP Client 都能连接任何 MCP Server，工具开发者写一次，所有 AI 应用可用</li></ul><p>碎片化的典型表现：&quot;查数据库&quot;工具被十个团队各自实现十份——MCP 把它做成一个标准化的独立进程服务，十个团队的 AI 应用都&quot;连接&quot;它而不是各自&quot;复制&quot;它。</p>"},{"qnum":2,"qtext":"MCP 的三种核心能力（Tools / Resources / Prompts）各自是什么？三者在\"副作用\"上有何本质区别？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>能力</th><th>方向</th><th>触发方式</th><th>典型用途</th></tr></thead><tbody><tr><td><strong>Tools</strong></td><td>Client 调用 → Server 执行</td><td>模型决策触发</td><td>搜索、查数据库、发邮件、执行操作</td></tr><tr><td><strong>Resources</strong></td><td>Client 主动拉取</td><td>Client 主动请求</td><td>读文档、读实时指标、读日历事件</td></tr><tr><td><strong>Prompts</strong></td><td>Client 请求模板</td><td>Client 主动请求</td><td>获取调优好的提示词模板（含参数）</td></tr></tbody></table></div><p><strong>副作用区分是关键</strong>：</p><ul><li><strong>Tools</strong>：可能产生副作用（发邮件会真的发、查数据库会消耗资源、执行代码会改变状态）——模型需要决定&quot;是否真的要调用&quot;</li><li><strong>Resources</strong>：通常只读、无副作用（读文件不改变文件，读指标不改变指标）——Client 主动拉取，不需要模型判断</li><li><strong>Prompts</strong>：纯只读、无副作用（请求模板不做任何操作）——适合把调优好的提示词集中管理、跨应用共享</li></ul>"},{"qnum":3,"qtext":"MCP 和 Function Calling 的定位差异是什么？两者是替代关系还是互补关系？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>Function Calling</th><th>MCP</th></tr></thead><tbody><tr><td><strong>层次</strong></td><td>模型 API 层</td><td>工具服务连接层</td></tr><tr><td><strong>解决的问题</strong></td><td>模型如何表达&quot;我要调用哪个工具、传什么参数&quot;</td><td>工具服务器如何被标准化发现和跨应用复用</td></tr><tr><td><strong>定义方</strong></td><td>各 LLM 厂商（OpenAI / Anthropic / DeepSeek）</td><td>Anthropic（开放协议，厂商中立）</td></tr><tr><td><strong>跨语言</strong></td><td>不涉及</td><td>✅ Server 和 Client 可以用不同语言</td></tr><tr><td><strong>工具复用</strong></td><td>❌ 工具代码和应用绑定</td><td>✅ 一个 Server 被多个 Client 共享</td></tr></tbody></table></div><p><strong>互补关系，不是替代关系</strong>。完整工具调用链路：</p><ol><li>MCP Client 调用 Server 的 <code>list_tools()</code> 拿到工具列表</li><li>Client 把工具列表<strong>转成 Function Calling 格式</strong>注册给模型</li><li>模型通过 Function Calling 决定调用哪个工具，返回结构化调用请求</li><li>Client 把请求转发给 MCP Server 的 <code>call_tool()</code> 执行</li></ol><p><strong>MCP 在外层解决&quot;工具服务怎么被发现和连接&quot;，Function Calling 在内层解决&quot;模型怎么表达工具调用意图&quot;</strong>——两层职责清晰，MCP Server 本质上通过 Function Calling 把工具暴露给模型。</p>"},{"qnum":4,"qtext":"MCP Server 做成独立进程而非\"注册函数到应用里\"，带来了哪三个架构收益？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>收益</th><th>具体体现</th></tr></thead><tbody><tr><td><strong>语言无关</strong></td><td>Server 可以用 Python / TypeScript / Go / Rust 写，Client 不关心实现语言——Python AI 应用可以连接 Go 写的工具服务器</td></tr><tr><td><strong>可复用</strong></td><td>一个&quot;数据库查询 Server&quot;可以被多个 AI 应用同时连接，不需要每个应用各自实现一遍</td></tr><tr><td><strong>进程隔离</strong></td><td>Server 崩溃不影响 Client（AI 应用）；Server 的系统权限（如文件系统访问）和 Client 的权限可以分别控制</td></tr></tbody></table></div><p>对比 Day 23–25 手写 <code>@tool</code> 函数（工具和应用同进程）：</p><ul><li>工具绑定在应用里 → 换 AI 应用就要把工具代码复制过去</li><li>MCP Server 是独立进程 → AI 应用只需要&quot;连接&quot;而不是&quot;复制&quot;</li></ul><p>这个架构决策让 MCP 成为可能：&quot;写一次工具服务器，全公司 AI 应用共用&quot;。</p>"},{"qnum":5,"qtext":"MCP 和 A2A 连接的对象分别是什么？A2A 的 Task 对象、Agent Card、流式状态更新（Push）三个核心概念各自解决什么问题？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th></th><th>MCP</th><th>A2A</th></tr></thead><tbody><tr><td><strong>连接方向</strong></td><td>模型（通过 Client）↔ 工具/数据（Server）</td><td>Agent ↔ Agent</td></tr><tr><td><strong>回答的问题</strong></td><td>模型怎么找到并调用外部工具？外部数据怎么被模型读取？</td><td>一个 Agent 怎么把子任务委派给另一个 Agent？两个 Agent 之间怎么同步任务状态？</td></tr></tbody></table></div><p>A2A 的三个核心概念：</p><ul><li><strong>Task 对象</strong>：任务有明确的生命周期状态（<code>submitted</code> → <code>working</code> → <code>completed</code> / <code>failed</code>）</li><li><strong>Agent Card</strong>：每个 Agent 声明自己能做什么（类比 MCP 的 <code>list_tools</code>，但声明的是 Agent 的整体能力，不是单个工具）</li><li><strong>流式状态更新（Push）</strong>：委派出去的任务通过 Streaming 推送进度，不需要轮询</li></ul><p>类比：MCP 像&quot;插座标准&quot;——工具（插头）和 Agent（设备）之间的接口规范；A2A 像&quot;快递协议&quot;——Agent 之间怎么&quot;寄任务&q
