能力模块保持独立复用&quot;是同一个设计原则——FastAPI 在这里扮演的也是&quot;编排/暴露&quot;的角色，而不是重新实现一遍推理能力。好处是：Agentic RAG 图、模型网关等模块可以脱离 FastAPI 独立测试、独立复用（比如未来接入 CLI 或其他前端框架），不会因为套了一层 HTTP 外壳就被锁死在 FastAPI 里。</p>"}]},{"name":"深化阶段·补充篇·Claude Code Skills 教程","questions":[{"qnum":1,"qtext":"Claude Code Skill 和斜杠命令、CLAUDE.md 分别有什么区别？","answerHtml":"<div class=\"table-wrap\"><table><thead><tr><th>维度</th><th>斜杠命令</th><th>Skill</th><th>CLAUDE.md</th></tr></thead><tbody><tr><td>触发方式</td><td>显式，用户必须记住命令名并输入</td><td>支持显式（<code>/skill-name</code>）也支持隐式（语义匹配自动调用）</td><td>不是&quot;触发&quot;的概念，每次对话都加载</td></tr><tr><td>内容性质</td><td>单个可执行动作</td><td>针对特定重复性任务的多步骤操作流程</td><td>项目背景、约定、长期有效的规则</td></tr><tr><td>加载时机</td><td>调用时</td><td>只在任务匹配时按需加载</td><td>每次对话开始就加载</td></tr></tbody></table></div><p><strong>核心区别</strong>：斜杠命令要求用户&quot;记住咒语&quot;，Skill 让 Claude 自己判断某个任务是否该用某个 Skill；CLAUDE.md 是&quot;始终相关&quot;的背景信息，Skill 是&quot;只在匹配到特定任务时才相关&quot;的操作流程。</p>"},{"qnum":2,"qtext":"SKILL.md 的 description 字段为什么说是\"匹配算法读取的触发条件\"而不是简介？写的时候要注意什么？","answerHtml":"<pre><code class=\"language-yaml\">description: This skill should be used when the user asks to &quot;写 DayN 学习笔记&quot;,\n  &quot;生成学习笔记&quot;, &quot;补一篇学习笔记&quot;, &quot;更新面试题&quot;, &quot;同步面试题&quot;, &quot;更新进度&quot;, &quot;同步 README&quot;, ...</code></pre><p>description 不是给人看的一句话概括，而是 Claude 判断&quot;这个任务该不该用这个 Skill&quot;的核心依据——<strong>写的时候要覆盖用户可能的多种真实说法</strong>（&quot;写学习笔记&quot;/&quot;补笔记&quot;/&quot;更新面试题&quot;），而不是只写一句抽象的&quot;用来管理学习笔记&quot;。description 覆盖的措辞越具体，用户换一种说法提需求时越不容易漏配。</p>"},{"qnum":3,"qtext":"为什么 Skill 要把详细格式规范拆进 references/ 子目录，而不是全写进 SKILL.md 主文件？","answerHtml":"<pre><code>.claude/skills/day-note-sync/\n├── SKILL.md              # 精简：只有&quot;何时用+步骤概览&quot;\n└── references/           # 详细：格式规范、模板，按需加载\n    ├── note-template.md\n    ├── interview-questions-sync.md\n    └── readme-sync.md</code></pre><p><strong>原因是控制上下文 Token 消耗</strong>：如果把所有细节都写进 <code>SKILL.md</code> 本体，每次哪怕只是判断&quot;要不要用这个 Skill&quot;都要把全部细节加载进上下文；拆分成&quot;精简主文件 + 按需加载的参考文件&quot;后，只有真正开始执行到具体某一步时才会去读取对应的参考文件，平时不产生这部分开销。</p>"},{"qnum":4,"qtext":"设计一个 Skill 时，\"缺信息先问用户不瞎猜\"这条原则解决的是什么问题？","answerHtml":"<pre><code>开始前确认拿到：Day 编号、主题名、以及这天要覆盖的知识点列表\n（若用户没给，先向用户要一份要点清单，不要凭空编造技术细节）</code></pre><p>这条原则是一道<strong>安全阀</strong>，防止 Skill 在关键信息缺失的情况下自己瞎编内容继续往下执行——比如写学习笔记时如果不知道具体要覆盖哪些知识点，Skill 不应该凭空编造技术细节填充，而应该先向用户要清单。这保证了 Skill 产出的内容是基于真实信息，而不是&quot;看起来像那么回事&quot;但实际编造的内容。</p>"},{"qnum":5,"qtext":"什么样的任务适合封装成 Skill，什么样的任务适合用 Subagent，什么样的适合直接用普通 Prompt？","answerHtml":"<pre><code>一次性、不会重复的需求 → 普通 Prompt，不需要封装\n反复出现、每次都需要按同样步骤/格式执行 → Skill（保证一致性，不会因不同对话遗漏步骤）\n需要大量独立探索/试错、不希望污染主对话上下文 → Subagent（完全独立的上下文，只把最终结果带回）</code></pre><p><strong>判断标准</strong>：核心看&quot;是否会重复&quot;和&quot;是否需要隔离上下文&quot;两个维度——只做一次的任务封装成 Skill 是浪费；会反复出现但探索量不大的任务（如本仓库每次写新一天笔记都要做的四件事）适合封装成 Skill；需要在大量文件里翻找、可能产生大量中间噪音的任务，更适合丢给 Subagent 去独立处理。</p>"},{"qnum":6,"qtext":"项目级 Skill 和个人级 Skill 分别放在什么位置？分别适合什么场景？为什么 day-note-sync 应该是项目级而不是个人级？","answerHtml":"<pre><code>项目级 Skill：.claude/skills/&lt;name&gt;/SKILL.md，随仓库提交，团队所有人共享\n个人级 Skill：通常在用户主目录下的全局配置里，只对当前用户生效，不会被提交进项目仓库</code></pre><ul><li>项目级 Skill 适合&quot;这个仓库特有的重复性任务&quot;——day-note-sync 依赖这个仓库的具体目录结构（学习笔记/、面试题.md、规划文档/plan.md 等），离开这个仓库就没有意义，所以应该放进 <code>.claude/skills/day-note-sync/</code> 随仓库提交，让协作者都能用同一套流程，不需要每人各自维护一份。</li><li>个人级 Skill 适合&quot;我个人在所有项目里都想用的习惯性流程&quot;（比如个人的 commit message 风格偏好），这类 Skill 和具体某个仓库的结构无关，写进某个项目仓库反而会给其他协作者带来困惑（&quot;这个 Skill 为什么在这里，跟这个项目有什么关系&quot;），所以应该放在用户主目录的全局配置里，不提交进项目仓库。</li></ul><p><strong>判断标准</strong>：这个流程离开当前仓库还有没有意义——有意义 → 项目级；只对自己有意义 → 个人级。</p>"},{"qnum":7,"qtext":"day-note-sync 五条设计原则里，\"步骤固定有序\"和\"结尾自检清单\"分别解决什么问题？如果一个 Skill 缺了这两条会出现什么后果？","answerHtml":"<pre><code>③ 正文按步骤列出&quot;四件事要按顺序整套执行&quot;\n   ——写笔记→面试题→路线图→README，每一步都写清楚&quot;在哪个文件、插入到什么位置&quot;\n   这保证了每次调用行为一致，不会因为不同对话而随意变动执行顺序\n\n⑤ 结尾有&quot;完成后自检&quot;清单\n   ——四个文件是否都改了、编号是否连续、有没有把未完成的 Day 标记成已完成\n   这是执行完毕后的质量门控，防止 Skill 执行到一半漏了某一步却没被发现</code></pre><ul><li>&quot;步骤固定有序&quot;解决的是<strong>执行一致性</strong>问题：把&quot;写笔记→面试题→路线图→README&quot;这四件事的顺序和每一步该改哪个文件、插入到什么位置都写死，保证不管哪次对话触发这个 Skill，行为都完全一样，不会因为不同的上下文或不同的措辞而漏做某一步或做错顺序。</li><li>&quot;结尾自检清单&quot;解决的是<strong>质量门控</strong>问题：在 Skill 执行完之后再检查一遍&quot;四个文件是否都改了、编号是否连续、有没有把未完成的 Day 标记成已完成&quot;，这是执行完毕后的最后一道检查，防止 Skill 中途漏了某一步但没有被察觉。</li><li>缺了&quot;步骤固定有序&quot;：Skill 的行为会退化成和普通 Prompt 差不多，每次执行顺序可能不一样，起不到&quot;保证一致性&quot;的封装价值。</li><li>缺了&quot;自检清单&quot;：即使 Skill 执行到一半出错漏了某一步（比如笔记写了但面试题忘了同步），也没有机制能发现这个遗漏，问题会被悄悄带到下一次对话才被用户发现。</li></ul>"},{"qnum":8,"qtext":"动手写的 commit-message-helper 示例里，为什么明确规定\"只输出建议的 commit message 文本，不要自动执行 `git commit`\"？这体现了设计 Skill 时的什么原则？","answerHtml":"<pre><code class=\"language-markdown\">## 输出格式\n\n只输出建议的 commit message 文本，不要自动执行 `git commit`——是否提交由用户决定。</code></pre><ul><li>这条规定明确划定了 Skill 的<strong>输出边界</strong>：Skill 负责生成建议内容，但不代替用户做出&quot;是否提交&quot;这个决策性动作。</li><li>原因是 <code>git commit</code> 是一个有副作用、会改变仓库历史的操作——如果 Skill 自动执行，一旦生成的 commit message 判断错了改动类型（比如把 <code>fix</code> 误判成 <code>feat</code>），或者用户其实还想再改动一些内容才提交，自动提交就没有回退的余地，用户失去了&quot;确认后再执行&quot;的把关机会。</li><li>笔记原文把这总结为&quot;即使是简单任务，也要写清楚&#x27;到哪一步为止&#x27;，避免 Skill 擅自做超出预期的操作&quot;——这是除了&quot;description 覆盖多种说法&quot;&quot;步骤固定有序&quot;之外，设计 Skill 时另一个容易被忽视但同样重要的原则：<strong>Skill 的自主性应该止步于&quot;生成建议&quot;，凡是有副作用、不可逆、或者应该由用户最终拍板的动作，都应该留给用户手动确认执行</strong>，这和 Day 36 human-in-the-loop 人工审核节点的思路是相通的。</li></ul>"}]}]};
</script>

<script>
(function () {
  "use strict";

  var groups = QUIZ_DATA.groups;

  // Build flat list for prev/next navigation
  var flat = [];
  groups.forEach(function (g, gi) {
    g.questions.forEach(function (q, qi) {
      flat.push({ groupIndex: gi, groupName: g.name, qnum: q.qnum, qtext: q.qtext, answerHtml: q.answerHtml });
    });
  });

  var STORAGE_KEY = "quiz_last_index";
  var current = 0;
  try {
    var saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
    if (!isNaN(saved) && saved >= 0 && saved < flat.length) current = saved;
  } catch (e) {}

  var topbarTitle = document.getElementById("topbar-title");
  var topbarProgress = document.getElementById("topbar-progress");
  var breadcrumb = document.getElementById("breadcrumb");
  var qnumBadge = document.getElementById("qnum-badge");
  var qtext = document.getElementById("qtext");
  var revealBtn = document.getElementById("reveal-btn");
  var answerBox = document.getElementById("answer-box");
  var answerContent = document.getElementById("answer-content");
  var prevBtn = document.getElementById("prev-btn");
  var nextBtn = document.getElementById("next-btn");
  var sidebar = document.getElementById("sidebar");
  var sidebarBackdrop = document.getElementById("sidebar-backdrop");
  var hamburger = document.getElementById("hamburger");
  var mainEl = document.getElementById("main");
  var bottomNav = document.getElementById("bottom-nav");

  // Reserve exactly (bottom-nav height + 100px) at the bottom of #main so the
  // last bit of a long answer never sits underneath the fixed bottom nav.
  function syncBottomSpace() {
    var reserve = bottomNav.offsetHeight + 100;
    mainEl.style.paddingBottom = reserve + "px";
  }

  // ---------- Build sidebar ----------
  var groupEls = []; // {el, questionEls: []}

  groups.forEach(function (g, gi) {
    var block = document.createElement("div");
    block.className = "group-block";

    var header = document.createElement("div");
    header.className = "group-header";
    header.innerHTML =
      '<svg class="chevron" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '<span class="gname"></span>' +
      '<span class="gcount">' + g.questions.length + '</span>';
    header.querySelector(".gname").textContent = g.name;
    block.appendChild(header);

    var list = document.createElement("div");
    list.className = "question-list";

    var questionEls = [];
    g.questions.forEach(function (q, qi) {
      var item = document.createElement("div");
      item.className = "question-item";
      var flatIndex = flat.findIndex(function (f) { return f.groupIndex === gi && f.qnum === q.qnum; });
      item.dataset.index = flatIndex;
      item.innerHTML = '<span class="qtag">Q' + q.qnum + '</span><span class="qsnippet"></span>';
      item.querySelector(".qsnippet").textContent = q.qtext;
      item.addEventListener("click", function () {
        goTo(parseInt(item.dataset.index, 10));
        closeSidebarOnMobile();
      });
      list.appendChild(item);
      questionEls.push(item);
    });
    block.appendChild(list);

    header.addEventListener("click", function () {
      block.classList.toggle("open");
    });

    sidebar.appendChild(block);
    groupEls.push({ el: block, questionEls: questionEls });
  });

  function closeSidebarOnMobile() {
    if (window.innerWidth <= 768) {
      sidebar.classList.remove("open");
      sidebarBackdrop.classList.remove("open");
    }
  }

  hamburger.addEventListener("click", function () {
    sidebar.classList.toggle("open");
    sidebarBackdrop.classList.toggle("open");
  });
  sidebarBackdrop.addEventListener("click", closeSidebarOnMobile);

  // ---------- Render ----------
  function render(index) {
    var item = flat[index];

    breadcrumb.textContent = item.groupName;
    qnumBadge.textContent = "第 " + item.qnum + " 题（本组）";
    qtext.textContent = item.qtext;
    answerContent.innerHTML = item.answerHtml;

    answerBox.classList.remove("visible");
    revealBtn.classList.remove("is-shown");
    revealBtn.textContent = "查看答案";

    topbarTitle.textContent = item.groupName;
    topbarProgress.textContent = (index + 1) + " / " + flat.length;

    prevBtn.disabled = index === 0;
    nextBtn.disabled = index === flat.length - 1;

    // sidebar active state + auto-expand + scroll into view
    groupEls.forEach(function (g, gi) {
      var isCurrentGroup = gi === item.groupIndex;
      g.el.classList.toggle("open", isCurrentGroup || g.el.classList.contains("open"));
      g.questionEls.forEach(function (el) {
        el.classList.toggle("active", parseInt(el.dataset.index, 10) === index);
      });
    });
    var activeEl = sidebar.querySelector(".question-item.active");
    if (activeEl) activeEl.scrollIntoView({ block: "nearest" });

    window.scrollTo(0, 0);

    try { localStorage.setItem(STORAGE_KEY, String(index)); } catch (e) {}
  }

  function goTo(index) {
    if (index < 0 || index >= flat.length) return;
    current = index;
    render(current);
  }

  revealBtn.addEventListener("click", function () {
    var showing = answerBox.classList.toggle("visible");
    revealBtn.classList.toggle("is-shown", showing);
    revealBtn.textContent = showing ? "隐藏答案" : "查看答案";
  });

  prevBtn.addEventListener("click", function () { goTo(current - 1); });
  nextBtn.addEventListener("click", function () { goTo(current + 1); });

  document.addEventListener("keydown", function (e) {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowLeft") goTo(current - 1);
    else if (e.key === "ArrowRight") goTo(current + 1);
    else if (e.key === " ") { e.preventDefault(); revealBtn.click(); }
  });

  window.addEventListener("resize", syncBottomSpace);

  syncBottomSpace();
  render(current);
})();
</script>
</body>
</html>
