<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大模型应用开发 · 面试题刷题</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel-bg: #ffffff;
    --border: #e3e5e9;
    --text: #1f2430;
    --text-muted: #6b7280;
    --primary: #3b5bdb;
    --primary-light: #e8ecfc;
    --code-bg: #282c34;
    --code-text: #e6e6e6;
    --table-head-bg: #f0f2f7;
    --sidebar-w: 300px;
    --topbar-h: 56px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    position: relative;
  }

  /* ---------- Top bar ---------- */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    z-index: 30;
  }

  #hamburger {
    display: none;
    width: 36px; height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    border-radius: 8px;
    align-items: center;
    justify-content: center;
  }
  #hamburger:active { background: var(--primary-light); }
  #hamburger span, #hamburger span::before, #hamburger span::after {
    content: "";
    display: block;
    width: 20px; height: 2px;
    background: var(--text);
    position: relative;
    transition: 0.2s;
  }
  #hamburger span::before { position: absolute; top: -6px; }
  #hamburger span::after { position: absolute; top: 6px; }

  #topbar-title {
    font-weight: 600;
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #topbar-progress {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    position: fixed;
    top: var(--topbar-h);
    left: 0;
    width: var(--sidebar-w);
    height: calc(100vh - var(--topbar-h));
    overflow-y: auto;
    background: var(--panel-bg);
    border-right: 1px solid var(--border);
    padding: 8px 0 24px;
    z-index: 15;
  }

  .group-block { border-bottom: 1px solid #f0f1f4; }

  .group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    user-select: none;
  }
  .group-header:hover { background: #fafbfc; }
  .group-header .chevron {
    flex-shrink: 0;
    width: 14px; height: 14px;
    transition: transform 0.15s;
    color: var(--text-muted);
  }
  .group-block.open .chevron { transform: rotate(90deg); }
  .group-header .gname { flex: 1; line-height: 1.4; }
  .group-header .gcount {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    border-radius: 10px;
    padding: 1px 7px;
    flex-shrink: 0;
  }

  .question-list { display: none; padding: 2px 0 6px; }
  .group-block.open .question-list { display: block; }

  .question-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px 7px 30px;
    font-size: 13px;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1.4;
  }
  .question-item:hover { background: var(--primary-light); color: var(--text); }
  .question-item.active {
    background: var(--primary-light);
    color: var(--primary);
    font-weight: 600;
  }
  .question-item .qtag {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    color: inherit;
    opacity: 0.75;
  }
  .question-item .qsnippet {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 20;
  }

  /* ---------- Main content ---------- */
  #main {
    margin-top: var(--topbar-h);
    margin-left: var(--sidebar-w);
    min-height: calc(100vh - var(--topbar-h));
    display: flex;
    justify-content: center;
    padding: 28px 20px 100px;
    /* padding-bottom is recalculated in JS to exactly clear #bottom-nav + 100px */
  }

  #card {
    width: 100%;
    max-width: 760px;
  }

  #breadcrumb {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  #question-box {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    margin-bottom: 16px;
  }

  #qnum-badge {
    display: inline-block;
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 12px;
  }

  #qtext {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.6;
    color: var(--text);
  }

  #reveal-btn {
    display: block;
    width: 100%;
    padding: 13px;
    margin-bottom: 16px;
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  #reveal-btn:hover { background: #2f4bc4; }
  #reveal-btn.is-shown { background: #eef0f5; color: var(--text-muted); }

  #answer-box {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 22px 24px;
    display: none;
    animation: fadeIn 0.2s ease;
  }
  #answer-box.visible { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px);} to { opacity: 1; transform: translateY(0);} }

  #answer-box .answer-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 10px;
    letter-spacing: 0.5px;
  }

  .answer-content p { line-height: 1.75; margin: 0 0 12px; font-size: 14.5px; }
  .answer-content ul, .answer-content ol { margin: 0 0 12px; padding-left: 22px; line-height: 1.75; font-size: 14.5px; }
  .answer-content li { margin-bottom: 4px; }
  .answer-content strong { color: var(--text); font-weight: 700; }
  .answer-content code {
    background: #eef0f5;
    color: #c0356c;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 0.9em;
    font-family: "SF Mono", Consolas, Menlo, monospace;
  }
  .answer-content pre {
    background: var(--code-bg);
    color: var(--code-text);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 0 0 14px;
    font-size: 13px;
    line-height: 1.6;
  }
  .answer-content pre code {
    background: none;
    color: inherit;
    padding: 0;
    font-size: inherit;
  }
  .answer-content .table-wrap { overflow-x: auto; margin: 0 0 14px; -webkit-overflow-scrolling: touch; }
  .answer-content table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  .answer-content th, .answer-content td {
    border: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
    line-height: 1.5;
  }
  .answer-content th { background: var(--table-head-bg); font-weight: 700; white-space: nowrap; }
  .answer-content code { word-break: break-word; }

  /* ---------- Bottom nav ---------- */
  #bottom-nav {
    position: fixed;
    left: var(--sidebar-w);
    right: 0;
    bottom: 0;
    background: var(--panel-bg);
    border-top: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    z-index: 25;
  }
  #bottom-nav .nav-inner {
    width: 100%;
    max-width: 760px;
    display: flex;
    gap: 10px;
  }
  .nav-btn {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .nav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .nav-btn:not(:disabled):hover { border-color: var(--primary); color: var(--primary); }
  .nav-btn.next { background: var(--primary); color: #fff; border-color: var(--primary); }
  .nav-btn.next:not(:disabled):hover { background: #2f4bc4; }

  /* ---------- Mobile layout ---------- */
  @media (max-width: 768px) {
    :root { --sidebar-w: 82vw; }
    #hamburger { display: flex; }
    #sidebar {
      z-index: 21;
      max-width: 320px;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      box-shadow: 2px 0 16px rgba(0,0,0,0.12);
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-backdrop.open { display: block; }
    #main { margin-left: 0; padding: 18px 14px 100px; }
    #question-box, #answer-box { padding: 16px 16px; }
    #qtext { font-size: 16px; }
    #bottom-nav { left: 0; padding: 8px 12px; }
    #topbar-title { font-size: 14px; }
  }

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="hamburger" aria-label="打开题目导航"><span></span></button>
    <div id="topbar-title">面试题刷题</div>
    <div id="topbar-progress"></div>
  </header>

  <div id="sidebar-backdrop"></div>

  <nav id="sidebar"></nav>

  <main id="main">
    <div id="card">
      <div id="breadcrumb"></div>
      <div id="question-box">
        <span id="qnum-badge"></span>
        <div id="qtext"></div>
      </div>
      <button id="reveal-btn">查看答案</button>
      <div id="answer-box">
        <div class="answer-label">答案</div>
        <div class="answer-content" id="answer-content"></div>
      </div>
    </div>
  </main>

  <div id="bottom-nav">
    <div class="nav-inner">
      <button class="nav-btn prev" id="prev-btn">← 上一题</button>
      <button class="nav-btn next" id="next-btn">下一题 →</button>
    </div>
  </div>
</div>


<script>
var QUIZ_DATA = {"groups":[{"name":"大模型基础与训练","questions":[{"qnum":1,"qtext":"什么是大语言模型（LLM）？它和传统 NLP 模型的核心区别是什么？","answerHtml":"<p>LLM 是基于 Transformer 架构、在海量文本上预训练得到的语言模型，通过&quot;预测下一个 Token&quot;学习语言规律和世界知识。与传统 NLP 模型的核心区别：传统 NLP 模型通常只做单一任务（分类、翻译、NER 各自训练一个模型），训练数据是万到百万级的标注数据，必须针对具体任务微调才能使用，交互方式也是固定的输入输出格式。大语言模型则完全不同：一个模型就能覆盖多种任务，训练用的是无标注的海量文本（TB 级），零样本或少样本即可完成从未专门训练过的任务，交互方式也变成了自然语言对话（Prompt）。</p><p>规模（参数量数十亿到万亿）带来了&quot;涌现能力&quot;——不做任何训练，仅靠 Prompt 就能完成没见过的任务。</p>"},{"qnum":2,"qtext":"Transformer 的核心机制是什么？为什么它比 RNN 更适合训练大模型？","answerHtml":"<p>核心是<strong>自注意力机制（Self-Attention）</strong>：序列中每个 Token 都能同时&quot;看到&quot;所有其他 Token，并根据相关性分配注意力权重，从而捕捉长距离依赖（如段落开头的主语和结尾的代词）。</p><p>相比 RNN 的优势：</p><ul><li><strong>可并行</strong>：RNN 必须逐词顺序计算，Transformer 所有 Token 同时计算，训练效率高几个数量级</li><li><strong>无梯度消失</strong>：RNN 长序列梯度传着传着就消失了，Transformer 任意两个位置直接相连</li><li><strong>可扩展</strong>：堆更多层、更多参数，效果持续提升，这正是&quot;大&quot;模型的前提</li></ul>"},{"qnum":3,"qtext":"大模型训练分为哪三个阶段？每个阶段的数据、目标、产物分别是什么？","answerHtml":"<p>预训练（Pre-training）阶段用的是海量无标注文本（网页、书籍、代码），目标是学习语言规律和世界知识，产物是 Base Model（只会续写）。监督微调（SFT）阶段用的是高质量的指令-回复对，目标是学会遵循指令、进行对话，产物是 Chat Model（能对话）。人类反馈强化学习（RLHF）阶段用的是人类对多个回复的排序数据，目标是让输出更安全、更符合人类偏好，产物是对齐后的最终模型。</p><p>一句话总结：预训练让模型&quot;有知识&quot;，SFT 让模型&quot;听话&quot;，RLHF 让模型&quot;讨人喜欢&quot;。</p>"},{"qnum":4,"qtext":"\"预测下一个 Token\"这么简单的任务，为什么能学到知识甚至推理能力？","answerHtml":"<p>因为要在这个任务上表现好，模型必须内化文本背后的规律：语法、事实关联、逻辑关系、代码结构等。例如预测&quot;法国的首都是___&quot;的正确答案，就必须&quot;知道&quot;这个事实；预测代码的下一个 token，就必须理解语法结构。</p><p>海量数据 × 足够大的模型 = 简单目标逼出复杂能力。这也解释了 LLM 的一个本质特征：<strong>它是概率性的语言建模，不是确定性的数据库查询</strong>——所以会有幻觉、会不确定。</p>"},{"qnum":5,"qtext":"Base Model 和 Chat Model 有什么区别？应用开发中应该用哪种？","answerHtml":"<p>Base Model 只经过预训练，本质是&quot;续写文本&quot;——你问它&quot;你好&quot;，它很可能续写出一堆类似的问题而不是回答你；它不支持 system/user/assistant 这样的消息结构，用途主要是文本补全、研究，或者作为继续微调的起点。Chat Model（Instruct）则在预训练基础上又做了 SFT（甚至 RLHF），学会了理解指令并作答，支持 messages 多轮结构，因此才能用于对话和应用开发。</p><p>应用开发必须用 Chat Model。用 API 时通过 <code>deepseek-chat</code>、<code>gpt-4o</code> 这类名称区分，带 <code>-instruct</code>/<code>-chat</code> 的是对话模型。</p>"},{"qnum":6,"qtext":"Temperature 参数的作用是什么？0、0.7、1.5 分别适合什么场景？","answerHtml":"<p>Temperature 控制采样随机性：值越低，概率分布越&quot;尖锐&quot;，越倾向于选最高概率的词；值越高，分布越&quot;平坦&quot;，低概率词也有机会被选中。具体看几个典型取值：设为 0 时，输出几乎是确定性的（相当于贪心解码），适合信息抽取、分类、结构化输出这类要求稳定可复现的场景；设为 0.7 时，输出适度多样，适合日常对话、客服这类场景；设到 1.5 时，输出会高度随机，甚至可能语无伦次，只适合创意写作、头脑风暴这类场景，而且要慎用。</p><p>工程口诀：<strong>要稳定就调低，要创意就调高</strong>。</p>"},{"qnum":7,"qtext":"Top-P（核采样）是什么？它和 Temperature 有什么关系？","answerHtml":"<p>Top-P 从概率最高的词开始累积，只在累积概率达到 P 的候选集合内采样，之外的直接排除。例如 Top-P=0.9：把候选词按概率降序累加到 0.9 为止，只在这批词里随机选。</p><p>与 Temperature 的关系：两者都控制随机性，通常<strong>调一个就够</strong>。区别在于 Top-P 是&quot;砍尾部&quot;（动态候选集大小），Temperature 是&quot;调分布形状&quot;（整体变尖锐/平坦）。实践中一般保持默认 Top-P=1，只调 Temperature。</p>"},{"qnum":8,"qtext":"temperature=0 就能保证每次输出完全一样吗？","answerHtml":"<p>不能完全保证。Temperature=0 等价于贪心解码（总选最高概率 token），在<strong>数学上</strong>是确定的，但工程上有额外变量：</p><ul><li>服务端 batching、浮点并行计算的非确定性，可能导致概率相近的 token 排序抖动</li><li>模型版本更新、底层硬件差异</li><li>流式场景下的微小差异</li></ul><p>所以对稳定性要求高的任务（抽取/分类），正确做法是 <strong>temperature=0 + 输出校验 + 必要时重试</strong>，而不是假设输出绝对一致。</p>"},{"qnum":9,"qtext":"大模型有哪些典型局限性？各有什么应对思路？","answerHtml":"<p>典型局限大概有六类，每一类都有对应的工程手段来补。第一是幻觉，模型会一本正经地编造事实，应对思路是用 RAG 提供真实依据，并要求模型给出引用来源。第二是知识截止，模型不知道训练截止日期之后发生的事，这个要靠 RAG 接入实时或私有数据来解决。第三是数学与精确计算能力差，容易算错数、数错字符，这种场景应该用 Tool Calling 去调用计算器或者代码执行，而不是让模型自己硬算。第四是上下文有限，长文档一次性放不进去，应对方式是先切分再检索，也就是 RAG 那一套。第五是输出不稳定，同样的输入可能给出不同的输出，可以通过把 temperature 设成 0，再加上校验和重试机制来缓解。第六是对 prompt 很敏感，换个说法效果就可能差很多，这就需要做好 Prompt 版本管理，并且用测试集持续评估效果。</p><p>核心认知：LLM 是&quot;概率性语言引擎&quot;，工程手段（检索/工具/校验）负责把它变成可靠系统。</p>"},{"qnum":10,"qtext":"什么是幻觉（Hallucination）？为什么会产生？应用层如何缓解？","answerHtml":"<p>幻觉指模型输出流畅自信但与事实不符的内容。成因：模型本质是&quot;预测最可能的下一个词&quot;而不是&quot;检索事实&quot;，当训练数据中没有相关事实时，它会生成统计上合理但实际错误的文本；RLHF 还会让模型倾向于&quot;给出答案&quot;而不是承认不知道。</p><p>应用层缓解手段：</p><ul><li>RAG：先检索真实资料，约束模型&quot;只根据资料回答&quot;</li><li>Prompt 明确允许拒答：&quot;如果资料中没有答案，请回答'未找到'&quot;</li><li>要求引用来源，便于事后校验</li><li>对关键事实做规则/二次校验，不直接信任</li></ul>"},{"qnum":11,"qtext":"什么是知识截止（Knowledge Cutoff）？为什么 RAG 是它的标准解法？","answerHtml":"<p>知识截止指模型只知道训练数据截止日期之前的世界。之后的新事件、企业内部文档、个人笔记，模型统统不知道——问它只会幻觉。</p><p>RAG（检索增强生成）的解法思路：<strong>知识不进模型，进上下文</strong>。问答时先从外部知识库检索相关片段，把片段塞进 Prompt 再让模型作答。这样知识可以随时更新（换文档即可），无需重新训练模型，天然解决时效性和私有数据两个问题。</p>"},{"qnum":12,"qtext":"应用开发者为什么通常不需要自己训练/微调模型？什么时候才需要？","answerHtml":"<p>不需要训练的原因：预训练成本上亿美元；Prompt 工程 + RAG + Tool Calling 已能覆盖绝大多数应用需求——这是当前应用开发的主流范式：&quot;<strong>模型能力靠 API，业务知识靠上下文</strong>&quot;。</p><p>需要微调的典型信号：对特定任务有大量高质量标注数据、对输出风格有强一致要求、需要极低延迟（小模型蒸馏）、或 Prompt 无论怎么调都达不到效果。即便如此，通常也只做 SFT/LoRA 轻量微调，而不是预训练。</p>"},{"qnum":13,"qtext":"闭源 API 和开源模型本地部署，如何选型？","answerHtml":"<p>闭源 API（GPT/Claude/DeepSeek）能力上限更高，旗舰模型持续领先，注册即可用、几分钟就能跑通，但按 Token 计费，量大之后成本相当可观，而且数据要出域，定制性也只能靠 Prompt 和参数调整。开源自部署（Qwen/Llama）能力略逊一筹但在快速逼近闭源模型，成本是一次性的 GPU 投入加上运维成本，数据完全留在内网，代价是需要具备部署和推理优化能力才能上手，好处是可以微调、量化，定制性更强。</p><p>决策顺序：先问数据是否允许出域（不允许→自部署）；再问量级（量小→API 更省）；最后问是否有特殊定制需求。</p>"},{"qnum":14,"qtext":"选一个具体模型时，应该评估哪些维度？","answerHtml":"<ul><li><strong>能力</strong>：在你目标任务上的实测效果（别只看排行榜，用自己的测试集跑）</li><li><strong>上下文窗口</strong>：是否放得下你的文档/历史</li><li><strong>成本</strong>：输入/输出单价 × 预估调用量</li><li><strong>速度/延迟</strong>：首 token 延迟、生成速度，对交互场景关键</li><li><strong>结构化输出支持</strong>：是否支持 JSON mode、Tool Calling（做抽取/工具调用的前提）</li><li><strong>合规与稳定性</strong>：服务区域、SLA、限流策略</li></ul><p>第一周的实践结论：DeepSeek 兼容 OpenAI SDK、价格低、有 JSON mode，适合作为学习与中小项目的默认选择。</p>"},{"qnum":15,"qtext":"Zero-shot、Few-shot、In-context Learning 分别是什么？","answerHtml":"<ul><li><strong>Zero-shot</strong>：不给示例，直接下指令（&quot;把下面句子翻译成英文&quot;）</li><li><strong>Few-shot</strong>：在 Prompt 里给几个输入输出示例，模型照着做</li><li><strong>In-context Learning（上下文学习）</strong>：不更新参数，仅凭上下文中的示例就学会新任务——这是 LLM 最重要的涌现能力，Few-shot 是它最常见的用法</li></ul><p>工程意义：示例是控制输出格式和风格的最强手段，比啰嗦的规则描述更有效；代价是示例也消耗 Token。</p>"}]},{"name":"Token、上下文窗口与成本","questions":[{"qnum":1,"qtext":"什么是 Token？中英文大概怎么换算？","answerHtml":"<p>Token 是模型处理文本的最小单位，不等于&quot;字&quot;或&quot;词&quot;：常见词是一个 Token，生僻词会被拆成多个，中文一个汉字通常是 1~2 个 Token。</p><p>经验换算（因模型而异）：</p><ul><li>1 个英文单词 ≈ 1.3 个 Token</li><li>1 个汉字 ≈ 0.6~1 个 Token（约 1.5 个汉字/Token）</li><li>1000 个 Token ≈ 750 个英文单词 ≈ 500~700 个汉字</li></ul><p>计费、上下文限制、max_tokens 全部以 Token 计，所以开发任何 LLM 应用都必须建立 Token 直觉。</p>"},{"qnum":2,"qtext":"API 为什么按 Token 计费？输入和输出为什么价格不同？","answerHtml":"<p>按 Token 计费是因为计算成本与 Token 数成正比：输入要经过预填充（prefill）计算，输出要逐 Token 自回归生成。</p><p>输出更贵的原因：生成阶段（decode）是串行的——每生成一个 Token 都要把前面所有 Token 重新算一遍注意力（有 KV Cache 也仍是逐个生成），计算量远大于一次性处理输入。典型价差 2~5 倍，例如输入 ¥1/百万、输出 ¥2/百万。</p><p>对 Prompt 设计的启发：<strong>长输入短输出</strong>的任务（摘要）优化重点在压缩输入；<strong>短输入长输出</strong>的任务（扩写）要控制输出长度。</p>"},{"qnum":3,"qtext":"一次 API 调用的\"输入 Token\"由哪几部分构成？","answerHtml":"<p>多轮对话中，输入不只是&quot;用户这次说的话&quot;，而是整个 messages 数组全部内容：</p><pre><code>输入 Token = system 消息\n           + 所有历史 user/assistant 消息\n           + 本次用户输入\n           +（格式开销：角色标记等结构）</code></pre><p>这是多轮对话成本高的根源：第 N 轮的输入包含前 N-1 轮的全部内容。做成本估算时必须按&quot;全量历史&quot;算，不能只算当前问题。</p>"},{"qnum":4,"qtext":"为什么说多轮对话的 Token 消耗是\"平方级增长\"？","answerHtml":"<p>设每轮新增约 t 个 Token。第 N 轮的输入 = 前面所有轮次累积的内容 ≈ N×t，而 N 轮总输入消耗 = t + 2t + … + Nt = t×N(N+1)/2，即 <strong>O(N²)</strong>。</p><p>10 轮对话的累计输入远超 10 倍单轮。这就是为什么要做历史截断、历史压缩——不只是为了不超上下文窗口，更是为了成本。</p>"},{"qnum":5,"qtext":"上下文窗口是什么？它和模型训练有什么关系？","answerHtml":"<p>上下文窗口是模型单次调用能处理的最大 Token 数（输入 + 输出）。例如 128K 窗口意味着 system + 历史 + 当前输入 + 生成的输出加起来不能超过约 12.8 万 Token。</p><p>它由训练方式决定：模型在训练时只见过一定长度的序列，推理时超过训练长度的位置编码没有学过，效果会急剧退化，因此硬性限制。超过窗口 API 会直接报错，应用必须自己管理历史长度。</p>"},{"qnum":6,"qtext":"对话历史超出上下文窗口，有哪些处理策略？","answerHtml":"<p>截断是最简单的做法——只保留最近 N 轮，优点是简单快，缺点是会丢失早期信息。滑动窗口本质相同，固定窗口大小、旧轮不断滚出，成本可控，但同样存在信息丢失的问题。历史压缩则用模型把旧历史摘要成一段塞回去，好处是保留了语义，代价是多了一次调用的成本。重写关键信息的做法是把用户姓名、目标等持续放入 system，关键信息永远不会丢，但需要先识别出&quot;什么才算关键&quot;。</p><p>实践中通常组合使用：<strong>system 永远保留 + 最近 K 轮原文 + 更早历史压缩成摘要</strong>。</p>"},{"qnum":7,"qtext":"API 响应里的 usage 字段包含什么？如何用它做成本统计？","answerHtml":"<pre><code class=\"language-python\">resp = client.chat.completions.create(...)\nusage = resp.usage\nprint(usage.prompt_tokens,        # 输入 token 数\n      usage.completion_tokens,    # 输出 token 数\n      usage.total_tokens)         # 合计</code></pre><p>成本 = prompt_tokens × 输入单价 + completion_tokens × 输出单价。</p><p>工程做法：封装客户端时统一读取 usage，累计写入日志或数据库，即可得到每个功能/每个用户的真实成本——比事后看账单细得多。</p>"},{"qnum":8,"qtext":"不看账单，如何快速估算一次调用的成本？","answerHtml":"<p>公式：<strong>成本 = 输入 Token × 输入单价 + 输出 Token × 输出单价</strong></p><p>估算步骤：</p><ul><li>输入：len(system) + len(全部历史) + len(当前问题)，中文按 1 字 ≈ 1 Token 保守估</li><li>输出：按任务的典型输出长度估（摘要 200、对话 300）</li><li>套单价（如 DeepSeek 输入 ¥0.5/百万、输出 ¥2/百万——以官网实时价格为准）</li></ul><p>例：输入 3000 Token + 输出 300 Token ≈ 3000×0.0000005 + 300×0.000002 ≈ ¥0.0021。养成&quot;调用前先心算&quot;的习惯，是成本意识的核心。</p>"},{"qnum":9,"qtext":"max_tokens 参数限制的是什么？设得太小会怎样？","answerHtml":"<p>它限制<strong>本次生成的输出</strong>最多多少 Token（不含输入）。设太小会导致回答被硬生生截断——表现为话说一半突然结束，且 <code>finish_reason</code> 为 <code>length</code> 而不是 <code>stop</code>。</p><p>注意两点：</p><ul><li>它是&quot;上限&quot;不是&quot;目标&quot;：设 2000 不代表输出 2000，模型说完了就停</li><li>它是控制成本/延迟的最后防线，和 Prompt 里的软约束（&quot;不超过 100 字&quot;）配合使用</li></ul>"},{"qnum":10,"qtext":"Token 优化的常见手段有哪些？","answerHtml":"<ul><li><strong>Prompt 层</strong>：删除废话和冗余示例，指令精炼；system 不要重复每次都传的大段说明</li><li><strong>历史层</strong>：截断旧轮次、压缩成摘要、及时清理无关上下文</li><li><strong>输出层</strong>：明确要求简洁（&quot;只输出 JSON，不要解释&quot;）、控制 max_tokens</li><li><strong>模型层</strong>：简单任务换更便宜的小模型，贵模型只用于难任务</li><li><strong>结构层</strong>：能用 enum/短代码就不要让模型输出长文本描述</li></ul><p>优化原则：先测量（usage 统计），再优化最大的那项。</p>"}]},{"name":"核心概念：Embedding / RAG / Tool Calling","questions":[{"qnum":1,"qtext":"什么是 Embedding？它是怎么表示\"语义\"的？","answerHtml":"<p>Embedding 是把文本映射成一个高维向量（如 1536 维的浮点数列表），语义相近的文本在向量空间中距离也近。</p><pre><code>&quot;猫在垫子上&quot;  → [0.12, -0.45, 0.78, ...]\n&quot;小猫趴在垫子上&quot; → [0.11, -0.43, 0.80, ...]   ← 距离很近\n&quot;今天股价大涨&quot; → [-0.62, 0.31, -0.15, ...]   ← 距离很远</code></pre><p>关键在于：这个映射是由专门的 Embedding 模型在大规模语料上训练出来的，它学到了&quot;什么和什么意思接近&quot;。语义检索、聚类、去重、推荐都建立在它之上。</p>"},{"qnum":2,"qtext":"Embedding 语义检索和关键词检索的本质区别是什么？","answerHtml":"<p>关键词检索（BM25/like）匹配依据是字面是否出现，比如用户说&quot;退货不想要了&quot;，系统搜&quot;退款&quot;就匹配不上，因为词面不同；多语言场景下中英文词不同也会直接失配；优点是可解释性高，能清楚看到命中了哪个词，而且不依赖任何模型。向量检索匹配依据是语义是否相近，&quot;退款&quot;和&quot;退货不想要了&quot;意思接近就能匹配上，跨语言语义也依然能对上；缺点是可解释性低，只能看到一个相似度分数，而且必须依赖 Embedding 模型才能工作。</p><p>本质区别：关键词比较<strong>符号</strong>，向量比较<strong>意思</strong>。生产系统常两者混合（混合检索）取长补短。</p>"},{"qnum":3,"qtext":"向量之间的相似度怎么计算？为什么常用余弦相似度？","answerHtml":"<p>常见三种：</p><ul><li><strong>余弦相似度</strong>：比较两个向量夹角，只看方向不看长度，取值 [-1, 1]</li><li><strong>内积（点积）</strong>：既看方向也看模长，向量归一化后与余弦等价</li><li><strong>L2 距离（欧氏距离）</strong>：空间中直线距离，越小越相似</li></ul><p>RAG 通常用余弦相似度，因为 Embedding 模型训练时优化的就是方向上的语义一致性；文本长短不同带来的向量模长差异不应影响&quot;语义是否相近&quot;的判断。</p>"},{"qnum":4,"qtext":"RAG 是什么？它解决了大模型的哪些问题？","answerHtml":"<p>RAG（Retrieval-Augmented Generation，检索增强生成）= 先检索、后生成：用户提问 → 从知识库检索相关片段 → 把片段和问题一起交给模型 → 模型基于片段作答。</p><p>解决的问题：</p><ul><li><strong>知识截止</strong>：接入最新数据，无需重训模型</li><li><strong>私有数据</strong>：企业文档、个人笔记不在训练集里，靠检索注入</li><li><strong>幻觉</strong>：约束模型&quot;只根据资料回答&quot;，有据可依</li><li><strong>可溯源</strong>：答案能标注来自哪篇文档</li></ul><p>一句话：<strong>模型负责理解和表达，知识库负责事实</strong>。</p>"},{"qnum":5,"qtext":"RAG 的离线构建和在线问答两个阶段分别做什么？为什么要分开？","answerHtml":"<p><strong>离线阶段</strong>（一次性/定期）：加载文档 → 清洗 → 切分成 Chunk → 每个 Chunk 生成 Embedding → 存入向量库。</p><p><strong>在线阶段</strong>（每次提问）：问题 → Embedding → 向量库检索 Top-K 相似 Chunk → 拼进 Prompt → 模型生成答案。</p><p>分开的原因：文档向量化是重操作（耗时、花钱），但结果可复用；问答是轻操作，要求低延迟。如果每次问答都重新向量化全部文档，成本和延迟都不可接受。两者通过&quot;向量库&quot;这个中间产物解耦。</p>"},{"qnum":6,"qtext":"为什么不把整个知识库直接塞进上下文，而要走 RAG 检索？","answerHtml":"<ul><li><strong>放不下</strong>：知识库动辄几十万字，再大的窗口也有极限</li><li><strong>太贵</strong>：每次问答都按全量输入计费，100 万 Token 的库问 100 次就是 1 亿 Token 输入</li><li><strong>效果差</strong>：Lost in the Middle——大量无关内容稀释注意力，准确率反而下降</li><li><strong>太慢</strong>：输入越长延迟越高</li></ul><p>RAG 用&quot;检索最相关的几百 Token&quot;替代&quot;全量塞入&quot;，同时解决容量、成本、质量、速度四个问题。</p>"},{"qnum":7,"qtext":"RAG 和微调（Fine-tuning）分别适合什么场景？","answerHtml":"<p>RAG 改变的是模型看到的上下文，而不是模型参数本身，它擅长注入事实知识并且可以溯源；知识更新只需要换文档就立即生效，成本也低，只需要做向量化；而且可解释性好，能明确引用信息来源。微调改变的是模型参数，擅长的是改变风格、格式这类行为习惯；知识更新则需要重新训练，成本高（要准备数据、要训练），并且是黑盒，可解释性差。</p><p>经验法则：<strong>知识问题用 RAG，行为问题用微调</strong>；两者还能组合（微调让模型更擅长利用检索结果）。绝大多数应用从 RAG 起步。</p>"},{"qnum":8,"qtext":"Tool Calling 是什么？模型是如何\"调用\"工具的？","answerHtml":"<p>Tool Calling 让模型在需要时输出一个结构化的&quot;工具调用请求&quot;（函数名 + JSON 参数），由应用代码执行该函数，再把结果回传给模型继续生成。</p><p>关键认知：<strong>模型自己不执行任何代码</strong>，它只是根据工具的名称和参数描述，决定&quot;要不要调、怎么调&quot;，产出的是一段结构化意图：</p><pre><code class=\"language-json\">{&quot;name&quot;: &quot;get_weather&quot;, &quot;arguments&quot;: &quot;{\\&quot;city\\&quot;: \\&quot;北京\\&quot;}&quot;}</code></pre><p>真正的执行者是你的 Python 程序。模型扮演&quot;决策者&quot;，应用扮演&quot;执行者&quot;。</p>"},{"qnum":9,"qtext":"既然模型不能执行函数，为什么还说它\"会调用工具\"？","answerHtml":"<p>因为模型完成了调用中最难的部分——<strong>理解与决策</strong>：从自然语言里识别意图、选择正确的工具、把口语化需求转成符合参数 Schema 的结构化数据。</p><p>完整流程是模型与代码的接力：</p><pre><code>用户：&quot;北京今天多少度？&quot;\n  → 模型输出 tool_call：get_weather({&quot;city&quot;: &quot;北京&quot;})   ← 模型：决策\n  → 应用执行真实函数，拿到 {&quot;temp&quot;: 32}                  ← 代码：执行\n  → 结果回传模型                                          ← 代码：回填\n  → 模型生成：&quot;北京今天 32 度。&quot;                          ← 模型：表达</code></pre><p>&quot;会调用&quot;指的是会发起和利用调用，而不是亲自执行。</p>"},{"qnum":10,"qtext":"Tool Calling 和 Agent 是什么关系？","answerHtml":"<p>Tool Calling 是<strong>基础能力</strong>：单次或多次地决定并发起工具调用。Agent 是<strong>系统形态</strong>：以 LLM 为大脑，围绕目标自主规划——决定下一步做什么、调用哪个工具、根据结果继续或结束，循环往复直到完成任务。</p><pre><code>Tool Calling = 一次&quot;手&quot;的动作（拿起工具、传对参数）\nAgent        = &quot;大脑 + 手 + 循环&quot;（自主决定用哪只手、什么时候停）</code></pre><p>Agent 的每一次具体动作几乎都依赖 Tool Calling，但只有 Tool Calling 没有规划循环，还构不成 Agent。</p>"},{"qnum":11,"qtext":"面试官问：\"怎么让大模型回答我们公司内部文档的问题？\"请给出第一周视角的完整方案。","answerHtml":"<p>标准答案就是 RAG，按两阶段展开：</p><p><strong>离线构建</strong>：收集公司文档 → 清洗切分成 Chunk → 调 Embedding API 生成向量 → 存入向量库（前期用 JSON/NumPy 本地向量库即可）。</p><p><strong>在线问答</strong>：用户提问 → 问题向量化 → 余弦相似度检索 Top-K（如 3 个）Chunk → 拼装 Prompt（&quot;只根据以下资料回答，资料中没有就说不知道&quot;）→ 调 Chat 模型生成答案 → （加分项）附上引用来源。</p><p>再补充权衡：数据敏感不能出域时换本地开源模型；并说明为什么不微调——知识更新频繁、需要溯源、成本高。</p>"}]},{"name":"Python 工程基础","questions":[{"qnum":1,"qtext":"为什么大模型开发项目必须使用虚拟环境？","answerHtml":"<p>虚拟环境为每个项目创建独立的 Python 包目录，实现<strong>依赖隔离</strong>：</p><ul><li>项目 A 需要 <code>openai==1.30</code>、项目 B 需要 <code>openai==1.50</code>，全局安装必然冲突</li><li>全局装一堆包后，<code>pip</code> 升级互相牵连，坏了不知道谁弄坏的</li><li>虚拟环境可以完整删除重建，环境永远可复现</li></ul><p>LLM 应用依赖迭代很快（SDK 版本频繁变更），没有虚拟环境的项目迟早陷入&quot;在我机器上能跑&quot;的困境。标准做法：每个项目一个 <code>.venv</code>，且 <code>.venv/</code> 加入 <code>.gitignore</code> 不提交。</p>"},{"qnum":2,"qtext":"venv 怎么创建和激活？不同操作系统有什么差异？","answerHtml":"<pre><code class=\"language-bash\"># 创建（所有平台相同）\npython -m venv .venv\n\n# 激活\n# Windows PowerShell\n.venv\\Scripts\\Activate.ps1\n# Windows CMD\n.venv\\Scripts\\activate.bat\n# macOS / Linux\nsource .venv/bin/activate</code></pre><p>激活后命令行前缀出现 <code>(.venv)</code>，此时 <code>pip install</code> 只装进本环境。差异点：Windows 的脚本在 <code>Scripts/</code> 目录，类 Unix 在 <code>bin/</code> 目录；PowerShell 首次执行可能被执行策略拦（<code>Set-ExecutionPolicy -Scope CurrentUser RemoteSigned</code>）。退出用 <code>deactivate</code>。</p>"},{"qnum":3,"qtext":"requirements.txt 的作用是什么？如何生成和使用？","answerHtml":"<p>作用：声明项目依赖清单，让任何人在任何机器上用一条命令还原环境。</p><pre><code class=\"language-bash\"># 生成（只写手动安装的顶层依赖，-u 参数不写版本号则固定版本）\npip freeze &gt; requirements.txt        # 全量快照（含间接依赖）\npip install -r requirements.txt      # 还原</code></pre><p>实践建议：手工维护顶层依赖并锁定版本（如 <code>openai==1.30.0</code>），比 <code>pip freeze</code> 全量导出更可读；配合 <code>.venv</code> 不提交，只提交 requirements.txt。</p>"},{"qnum":4,"qtext":"列表和字典在大模型应用开发中分别有哪些典型用法？","answerHtml":"<p><strong>列表（有序、可追加）</strong>——承载&quot;序列&quot;：</p><ul><li><code>messages</code> 消息历史：<code>[{&quot;role&quot;: &quot;system&quot;, ...}, ...]</code>，逐轮 append</li><li>抽取结果中的数组字段：<code>&quot;skills&quot;: [&quot;Python&quot;, &quot;Django&quot;]</code></li><li>检索返回的 Chunk 列表、批量任务的输入队列</li></ul><p><strong>字典（键值、快速查找）</strong>——承载&quot;结构&quot;：</p><ul><li>单条消息本身、API 响应解析后的 JSON 对象</li><li>抽取任务的字段定义：<code>{&quot;name&quot;: &quot;姓名&quot;, &quot;email&quot;: &quot;邮箱&quot;}</code></li><li>配置管理：<code>config = {&quot;model&quot;: &quot;deepseek-chat&quot;, &quot;temperature&quot;: 0.3}</code></li></ul><p>高频组合就是&quot;列表套字典&quot;：messages 是列表，每个元素是字典。</p>"},{"qnum":5,"qtext":"拼接 Prompt 为什么推荐用 f-string？相比 % 或 format 有什么优势？","answerHtml":"<pre><code class=\"language-python\">prompt = f&quot;请把以下用户留言分类为投诉/咨询/建议：\\n{user_input}\\n只输出类别名。&quot;</code></pre><p>优势：</p><ul><li><strong>可读性最好</strong>：变量直接嵌在文本里，Prompt 长什么样一目了然</li><li><strong>不易出错</strong>：不用数 <code>%s</code> 占位符个数，改文案不会错位</li><li><strong>支持表达式</strong>：<code>f&quot;摘要不超过{max_len}字&quot;</code>、<code>f&quot;{'、'.join(items)}&quot;</code> 都行</li></ul><p>Prompt 是需要反复调试打磨的核心资产，可读性直接决定迭代速度。多行长 Prompt 用三引号 f-string，变量插值让&quot;模板&quot;和&quot;数据&quot;分离，也便于做成函数参数。</p>"},{"qnum":6,"qtext":"用 with open 读文件时，为什么要显式指定 encoding？","answerHtml":"<pre><code class=\"language-python\">with open(&quot;data.txt&quot;, &quot;r&quot;, encoding=&quot;utf-8&quot;) as f:\n    text = f.read()</code></pre><p>不指定时 Python 用系统默认编码——Windows 上是 GBK，Linux/macOS 是 UTF-8。同一个脚本读同一个文件，在 Windows 上可能直接 <code>UnicodeDecodeError</code>，或者中文读出来是乱码。</p><p>LLM 应用的文本几乎全是 UTF-8（API、JSON、Markdown），所以<strong>读写文件永远显式写 <code>encoding=&quot;utf-8&quot;</code></strong>，这是跨平台正确性的最低成本保险。</p>"},{"qnum":7,"qtext":"try / except / finally 的执行顺序和各自用途？","answerHtml":"<pre><code class=\"language-python\">try:\n    result = call_api(prompt)      # 可能出错的代码\nexcept RateLimitError as e:\n    time.sleep(2); retry()         # 出错后的处理（可分类型多个 except）\nexcept Exception as e:\n    log(e); raise                  # 兜底：记录后重新抛出\nfinally:\n    cleanup()                      # 无论成败都执行（关文件/记日志耗时）</code></pre><p>顺序：try 出错 → 跳到第一个匹配的 except → 最后必执行 finally。</p><p>LLM 应用要点：<strong>except 要捕获具体异常类型</strong>（限流、超时、JSON 解析错误分别处理），避免裸 <code>except:</code> 把 bug 也吞掉；重试逻辑放在对应的 except 分支里。</p>"},{"qnum":8,"qtext":"调用大模型 API 时，应该区分处理哪些异常？","answerHtml":"<p>需要区分处理的异常大概有五类。第一类是 AuthenticationError，含义是 Key 无效或过期，处理策略是立即失败、提示检查配置，<strong>不重试</strong>；第二类是 RateLimitError（429），含义是请求过快或超配额，处理策略是 sleep 后重试，用指数退避；第三类是 APITimeoutError，含义是请求超时，处理策略是可重试 1~2 次，同时检查网络；第四类是 BadRequestError，含义是参数错误（比如超出上下文长度），处理策略是修正参数，<strong>不盲目重试</strong>；第五类是 json.JSONDecodeError，含义是模型输出不是合法 JSON，处理策略是加格式约束后重新请求。</p><p>分类原则：<strong>环境问题（Key/参数）快速失败，瞬时问题（限流/超时）重试，模型输出问题改约束</strong>。</p>"},{"qnum":9,"qtext":"pathlib 相比 os.path 好在哪里？在 LLM 项目里怎么用？","answerHtml":"<pre><code class=\"language-python\">from pathlib import Path\n\ndocs = Path(&quot;data/docs&quot;)                    # 路径对象\nfor f in docs.glob(&quot;*.txt&quot;):                # 遍历\n    text = f.read_text(encoding=&quot;utf-8&quot;)    # 直接读\nout = Path(&quot;output&quot;); out.mkdir(exist_ok=True)</code></pre><p>优势：面向对象（方法链 <code>f.parent / &quot;x.txt&quot;</code>）、跨平台分隔符自动处理、<code>read_text</code>/<code>write_text</code> 一步完成读写、glob 遍历优雅。</p><p>LLM 项目典型场景：批量读取知识库文档（<code>glob(&quot;*.pdf&quot;)</code>）、管理输出目录（<code>mkdir(exist_ok=True)</code>）、拼接数据路径——RAG 的文档加载器几乎都靠它。</p>"}]},{"name":"API 调用与客户端封装","questions":[{"qnum":1,"qtext":"一次 HTTP 请求的基本结构是什么？LLM API 调用里各部分对应什么？","answerHtml":"<pre><code>POST https://api.deepseek.com/chat/completions   ← 方法 + URL\nAuthorization: Bearer sk-xxxx                     ← 请求头：鉴权\nContent-Type: application/json                    ← 请求头：数据格式\n\n{&quot;model&quot;: &quot;deepseek-chat&quot;,                        ← 请求体：参数\n &quot;messages&quot;: [...]}</code></pre><p>四要素：方法（LLM API 都是 POST，因为要传大请求体且是&quot;动作&quot;不是&quot;取资源&quot;）、URL（端点路径）、请求头（认证 + 内容类型）、请求体（JSON 参数）。</p><p>用 SDK 时这些被封装了，但排错时（抓包、curl 复现、看报错）必须看得懂原始结构。</p>"},{"qnum":2,"qtext":"API Key 为什么不能硬编码在代码里？正确的管理方式是什么？","answerHtml":"<p>硬编码的风险：提交到 Git 就永久进入历史（删掉也能翻出来）、分享代码即泄漏 Key、换 Key 要改代码。Key 泄漏轻则被盗刷账单，重则数据泄露。</p><p>标准方案：<strong><code>.env</code> 文件 + <code>python-dotenv</code> + <code>.gitignore</code></strong>：</p><pre><code class=\"language-python\"># .env（不提交）\nDEEPSEEK_API_KEY=sk-xxxx\n\n# 代码\nfrom dotenv import load_dotenv\nload_dotenv()                        # 把 .env 读入环境变量\napi_key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;)</code></pre><p><code>.gitignore</code> 写入 <code>.env</code>；仓库里放一份 <code>.env.example</code>（只有字段名没有值）供他人参照配置。</p>"},{"qnum":3,"qtext":"HTTP 状态码 401、404、429、500 分别代表什么？LLM 调用中如何应对？","answerHtml":"<p>具体到几个常见状态码：401 表示未授权，通常是 Key 错误或失效，应对办法是检查 .env，而且不可重试；404 表示资源不存在，一般是 URL 或模型名写错了，要检查 base_url 和 model 配置；429 表示请求过多，也就是触发了限流，应对办法是等待后重试，用指数退避；500 表示服务器错误，属于服务端瞬时故障，可以重试，但如果持续出现就要去看官方状态页了。</p><p>记忆框架：4xx 是<strong>你的问题</strong>（改请求），5xx 是<strong>服务的问题</strong>（可重试）。其中 429 特殊——你的请求没错，只是太快了。</p>"},{"qnum":4,"qtext":"遇到 429 限流，什么是指数退避重试？为什么比固定间隔好？","answerHtml":"<pre><code class=\"language-python\">for attempt in range(5):\n    try:\n        return call_api()\n    except RateLimitError:\n        wait = 2 ** attempt          # 1s, 2s, 4s, 8s...\n        time.sleep(wait)</code></pre><p>指数退避 = 每次失败后等待时间翻倍。优于固定间隔的原因：</p><ul><li>轻微超限时第一次重试大概率就成功，不必白等</li><li>严重超限/服务过载时，固定间隔会持续撞墙，指数退避自动&quot;让路&quot;</li><li>避免大量客户端同步重试形成&quot;重试风暴&quot;</li></ul><p>批量任务（几百条数据抽取）必备：加上最大重试次数上限，超过后记录失败继续下一条，别让一条卡死整批。</p>"},{"qnum":5,"qtext":"用官方 SDK 和直接 requests.post 调 API，各有什么优劣？","answerHtml":"<p>SDK（如 openai 库）上手简单，对象化调用，内置了异常类型、自动重试也可以配置，流式输出直接给了现成的迭代器，缺点是需要额外引入一个包，而且屏蔽了协议细节，不利于理解底层原理。裸 HTTP（requests）则要自己拼 JSON、处理序列化，错误处理需要手写所有分支，流式输出也要自己解析 SSE 数据流，好处是基础库已经自带、不需要额外依赖，而且每个字段都看得见，能彻底搞懂协议细节。</p><p>结论：正式项目一律 SDK；但<strong>学习阶段值得用 requests 手写一次</strong>，把请求结构、鉴权、响应格式彻底搞懂，之后再用 SDK 就不懵了。</p>"},{"qnum":6,"qtext":"base_url 参数是干什么的？为什么换一行配置就能从 OpenAI 切到 DeepSeek？","answerHtml":"<pre><code class=\"language-python\">from openai import OpenAI\nclient = OpenAI(api_key=os.getenv(&quot;DEEPSEEK_API_KEY&quot;),\n                base_url=&quot;https://api.deepseek.com&quot;)</code></pre><p><code>base_url</code> 指定 SDK 请求的服务器地址。因为 DeepSeek 等国内厂商<strong>兼容 OpenAI 的接口协议</strong>（路径、请求格式、响应结构、SDK 都通用），SDK 只是把请求发往不同的 base_url 而已。</p><p>这就是&quot;OpenAI 兼容生态&quot;：一套代码，改 base_url + api_key + model 三个字符串即可切换厂商——也是封装统一 client 的价值所在（换模型只改配置）。</p>"},{"qnum":7,"qtext":"chat.completions.create 的核心参数有哪些？各自管什么？","answerHtml":"<pre><code class=\"language-python\">resp = client.chat.completions.create(\n    model=&quot;deepseek-chat&quot;,           # 用哪个模型\n    messages=[...],                  # 对话历史（含 system）\n    temperature=0.3,                 # 随机性\n    max_tokens=1000,                 # 输出上限\n    response_format={&quot;type&quot;: &quot;json_object&quot;},  # 强制 JSON\n    stream=False,                    # 是否流式\n)</code></pre><p>最核心的是 model + messages（决定&quot;说什么&quot;）；temperature 和 max_tokens 控制输出行为；response_format 和 stream 是结构化输出与交互体验的开关。</p>"},{"qnum":8,"qtext":"API 响应结构长什么样？为什么取内容要写 choices[0].message.content？","answerHtml":"<pre><code class=\"language-python\">resp.choices[0].message.content   # 回复文本\nresp.choices[0].finish_reason     # stop=正常结束, length=被截断\nresp.usage.prompt_tokens          # 输入 token\nresp.usage.completion_tokens      # 输出 token\nresp.model                        # 实际使用的模型</code></pre><p><code>choices</code> 是列表，因为历史原因协议支持一次生成 n 个候选（<code>n</code> 参数，默认 1），所以取第一个 <code>choices[0]</code>；<code>message</code> 里除 <code>content</code> 外还有 <code>role</code>，做多轮对话时要<strong>整个 message 对象</strong>追加回历史，而不是只存文本。</p>"},{"qnum":9,"qtext":"为什么要封装统一的 client 模块？好的封装应该包含什么？","answerHtml":"<p>把&quot;怎么连 API&quot;集中到一处，业务代码只关心&quot;说什么&quot;：</p><pre><code class=\"language-python\"># client.py\ndef chat(messages, temperature=0.3, json_mode=False) -&gt; str:\n    resp = _client.chat.completions.create(\n        model=MODEL, messages=messages, temperature=temperature,\n        response_format={&quot;type&quot;: &quot;json_object&quot;} if json_mode else None)\n    log_usage(resp.usage)            # 统计 token\n    return resp.choices[0].message.content</code></pre><p>要点：Key/base_url 只在这一处读取环境变量；统一记录 usage 和耗时；异常类型在此翻译成业务可懂的错误；其他模块 <code>from client import chat</code> 即用。换模型、加日志、改重试策略，全项目零改动。</p>"},{"qnum":10,"qtext":"finish_reason 有哪些取值？分别意味着什么？为什么要检查它？","answerHtml":"<p>取值一共有四种。第一种是 <code>stop</code>，含义是模型正常说完了、碰到了停止条件，这种情况下直接使用输出就行；第二种是 <code>length</code>，含义是达到 max_tokens 被截断了，这意味着输出不完整，得提高上限或者让模型精简回答；第三种是 <code>tool_calls</code>，含义是模型要调用工具，这时候要解析 tool_calls 并执行；第四种是 <code>content_filter</code>，含义是触发了内容过滤，需要调整输入或者提示用户。</p><p>不检查的后果：截断的 JSON 去解析必然报错、截断的回答直接给用户造成事故。批量任务里尤其要检查——<code>length</code> 意味着这条结果<strong>可能不能用</strong>。</p>"},{"qnum":11,"qtext":"流式输出（Streaming）的原理是什么？和普通调用有什么区别？","answerHtml":"<p>普通调用：等模型生成完所有 Token，一次性返回（用户盯着转圈）。流式：服务端边生成边推送，每个数据块（chunk）携带一小段增量文本，客户端逐块拼接展示——用户几乎立即看到第一个字，体验完全不同。</p><pre><code class=\"language-python\">stream = client.chat.completions.create(..., stream=True)\nfull = &quot;&quot;\nfor chunk in stream:\n    delta = chunk.choices[0].delta.content\n    if delta:\n        print(delta, end=&quot;&quot;, flush=True)\n        full += delta          # 边收边拼完整回复</code></pre><p>本质是 SSE（Server-Sent Events）协议。注意：<strong>拼完完整回复才能存入历史</strong>，历史里存的是完整 assistant 消息，不是碎片。</p>"},{"qnum":12,"qtext":"写好一个可复用的 LLM 客户端封装，从零到生产要补哪些细节？","answerHtml":"<p>在最小封装（Key + chat 函数）之上：</p><ul><li><strong>超时</strong>：显式设置 timeout，避免网络问题挂死程序</li><li><strong>重试</strong>：429/超时指数退避，带上限，区分可重试异常</li><li><strong>usage 统计</strong>：每次调用记录 token 与耗时，落日志</li><li><strong>json_mode 开关</strong>：抽取场景一键启用</li><li><strong>流式接口</strong>：<code>chat_stream()</code> 与 <code>chat()</code> 并存</li><li><strong>配置集中</strong>：model、base_url、单价常量统一管理，换模型改一处</li></ul><p>检验标准：业务模块里<strong>不出现任何 SDK 类型</strong>，只出现 <code>chat(prompt) -&gt; str</code> 这样的纯业务调用。</p>"}]},{"name":"多轮对话与消息历史","questions":[{"qnum":1,"qtext":"system、user、assistant 三种消息角色分别怎么用？","answerHtml":"<p>三种角色里，system 是由开发者产生的，作用是设定身份、规则和输出约束，而且全程不变，比如&quot;你是客服助手，只回答售后问题，语气专业&quot;；user 是由用户产生的，就是用户的输入或指令，比如&quot;我的订单还没到&quot;；assistant 是由模型产生的，是模型的历史回复，要回传回去以保持记忆，比如&quot;请问您的订单号是？&quot;。</p><p>关键理解：assistant 消息是<strong>应用替模型&quot;背书&quot;回传</strong>的——模型没有记忆，是应用把上一轮回复以 assistant 角色塞回 messages，模型才&quot;记得&quot;自己说过什么。</p>"},{"qnum":2,"qtext":"为什么每次调用 API 都要传完整历史？API 为什么设计成无状态？","answerHtml":"<p>因为大模型 API <strong>无状态</strong>：服务端不保存任何对话，&quot;记忆&quot;完全由客户端每次传入的 messages 数组提供。第 N 轮请求必须包含前 N-1 轮的全部内容，模型才接得上话。</p><p>无状态设计的理由：</p><ul><li><strong>可扩展</strong>：任意服务器都能处理任意请求，水平扩容无需同步会话</li><li><strong>免存储</strong>：亿级用户的对话历史存储成本巨大</li><li><strong>隐私</strong>：对话数据留在客户端，服务商不留底</li><li><strong>灵活</strong>：想&quot;修改记忆&quot;（删某轮、换 system）客户端说了算</li></ul><p>代价转嫁给应用：历史管理、截断、成本控制都是客户端的活。</p>"},{"qnum":3,"qtext":"多轮对话中消息历史的维护规则是什么？","answerHtml":"<p>核心规则三条：</p><ul><li><strong>只追加，不修改</strong>：每轮对话后，按顺序 append user 消息和 assistant 消息，历史是单向增长的日志</li><li><strong>成对追加</strong>：user 和 assistant 消息按对话时序排列，别打乱顺序</li><li><strong>system 永远在最前</strong>：设定不参与&quot;轮次&quot;，每次调用都原样带上</li></ul><pre><code class=\"language-python\">messages = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: SYSTEM}]\nwhile True:\n    q = input(&quot;&gt; &quot;)\n    messages.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: q})\n    reply = chat(messages)\n    messages.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: reply})</code></pre>"},{"qnum":4,"qtext":"assistant 的回复应该什么时候加入历史？直接在调用前加行不行？","answerHtml":"<p><strong>必须在拿到完整回复之后</strong> append。顺序固定为：</p><pre><code>append(user 消息) → 调用 API → 拿到回复 → append(assistant 消息) → 下一轮</code></pre><p>如果在调用前就把（空的/猜测的）assistant 消息塞进去，历史结构就错了：模型会看到&quot;自己说过&quot;没说过的话。流式输出的对应规则：边收边打印给用户，但<strong>收完完整文本才 append</strong>。</p>"},{"qnum":5,"qtext":"历史截断有哪些策略？为什么 system 消息必须保留？","answerHtml":"<p>按轮数截断只留最近 K 轮，做法最简单，是首选方案；按 Token 截断则是累计 Token 一旦超过预算就丢弃最旧的消息，能更精确地控制成本；摘要压缩是用模型把旧历史压缩成一段再塞回去，能保留语义，但会多产生一次调用的额外成本。</p><p>无论哪种，system 永远保留在最前：身份、规则、输出约束是每轮都必须生效的全局设定，丢了它模型立刻&quot;人设崩塌&quot;。更精细的做法是把&quot;用户姓名、核心目标&quot;这类关键信息提取后固化进 system，截断多少轮都不丢。</p>"},{"qnum":6,"qtext":"按轮数截断和按 Token 截断，各有什么优劣？","answerHtml":"<p>按轮数（留最近 10 轮）：实现一行代码，心智简单；缺点是每轮长短差异大，10 轮可能 500 Token 也可能 5000，成本不可控。</p><p>按 Token（超过 4000 就从最旧开始丢）：成本上限确定，充分利用预算；缺点是要估算每条消息的 Token 数（粗略 <code>len(text)</code> 即可），实现稍复杂。</p><p>实践建议：原型期用轮数截断；上线前改按 Token，并预留 system + 当前问题 + 预期输出的空间（总预算 = 上下文窗口 × 80%）。</p>"},{"qnum":7,"qtext":"多轮对话里\"上下文连贯\"和\"成本/窗口\"是天然矛盾的，怎么权衡？","answerHtml":"<p>矛盾：记得越全（历史越长）→ 回答越连贯，但 Token 成本平方级增长且逼近窗口上限；截得越狠 → 便宜，但模型&quot;失忆&quot;。</p><p>权衡框架：</p><ul><li>先问业务<strong>依赖多长的记忆</strong>：闲聊类 5~8 轮足够；任务型对话把任务目标固化进 system</li><li>分层记忆：最近 K 轮原文 + 更早内容摘要成一段 + 关键事实进 system</li><li>监控指标：用户重复提问率（截太狠的信号）+ 平均每轮 Token 成本</li></ul><p>没有标准答案，但&quot;system 固化关键信息 + 最近轮次原文&quot;是性价比最高的组合。</p>"},{"qnum":8,"qtext":"从零写一个命令行聊天程序，核心要包含哪些模块？","answerHtml":"<pre><code class=\"language-python\">SYSTEM = &quot;你是一个简洁的中文助手。&quot;\nmessages = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: SYSTEM}]\n\nprint(&quot;输入 exit 退出&quot;)\nwhile True:\n    q = input(&quot;\\n你: &quot;).strip()\n    if q.lower() in (&quot;exit&quot;, &quot;quit&quot;):\n        print(&quot;再见！&quot;); break\n    messages.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: q})\n    reply = client.chat(messages)          # 封装好的调用\n    messages.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: reply})\n    print(f&quot;AI: {reply}&quot;)</code></pre><p>四个要点：初始化（system + 空历史）、输入循环（含退出命令）、历史维护（成对 append）、输出展示。这个 20 行骨架就是所有多轮应用的雏形——网页聊天、客服系统只是把 input/print 换成界面组件。</p>"},{"qnum":9,"qtext":"CLI 聊天里用户输入空内容或 exit 命令，应该怎么处理？","answerHtml":"<pre><code class=\"language-python\">q = input(&quot;\\n你: &quot;).strip()\nif not q:                    # 空输入：跳过本轮，不调 API\n    continue\nif q.lower() in (&quot;exit&quot;, &quot;quit&quot;, &quot;退出&quot;):\n    print(&quot;再见！&quot;)\n    break</code></pre><p>处理原则：<strong>在调用 API 之前拦截无效输入</strong>。空字符串发给 API 是浪费一次调用；exit/quit 这类命令是给程序的信号，不是给模型的话。这也是&quot;输入校验放在系统边界&quot;的最小案例——所有用户输入的 LLM 应用都应先做这类前置检查。</p>"},{"qnum":10,"qtext":"如果回复是流式打印的，对话历史应该怎么记？","answerHtml":"<pre><code class=\"language-python\">messages.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: q})\nstream = client.chat_stream(messages)\nfull = &quot;&quot;\nfor chunk in stream:\n    full += chunk\n    print(chunk, end=&quot;&quot;, flush=True)\nmessages.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: full})  # 完整后再追加</code></pre><p>规则：<strong>展示可以流式，存储必须完整</strong>。历史里的 assistant 消息是下一轮的输入依据，必须是拼装完成的整段文本；把碎片或空字符串存进去，下一轮模型看到的对话就是坏的。用户中断（Ctrl+C）时要决定：丢弃半截回复，还是照样入史。</p>"},{"qnum":11,"qtext":"综合应用：给客服场景设计一个多轮对话模块，说明消息历史管理的完整方案。","answerHtml":"<p>设计要点：</p><p><strong>消息结构</strong>：<code>system</code>（客服人设 + 业务规则 + 输出约束）固定在最前；每轮成对 append user/assistant。</p><p><strong>历史管理</strong>（三层）：</p><ul><li>最近 8 轮原文保留</li><li>超出部分每轮检查：累计 Token（<code>sum(len(m[&quot;content&quot;]) for m in messages)</code> 粗估）超过预算（如 3000）就从最旧的非 system 消息开始丢弃</li><li>开场收集的关键信息（订单号、问题类型）提取后写入 system 尾部——永不因截断丢失</li></ul><p><strong>边界处理</strong>：空输入跳过；用户输入&quot;转人工&quot;等命令不进 messages 直接走业务分支；流式回复拼完再入史；每次调用记录 usage 观察成本。</p><p>这个方案在&quot;记得住关键信息&quot;和&quot;成本可控&quot;之间取得平衡，且全部逻辑在客户端完成，不依赖任何服务端状态。</p>"}]},{"name":"Prompt 工程与摘要任务","questions":[{"qnum":1,"qtext":"为什么\"总结一下这篇文章\"是一个糟糕的 Prompt？","answerHtml":"<p>它没有给出任何约束，模型的输出完全靠猜，导致不可控：</p><ul><li>长度不可控：可能 100 字也可能 1000 字</li><li>形式不可控：可能是段落、列表、甚至带标题的框架</li><li>重点不可控：模型自己决定关注什么，不一定是业务要的</li><li>风格不可控：口语、书面、营销腔随机出现</li></ul><p>Prompt 工程的第一原则：<strong>你不说清的每一件事，模型都会替你随机决定</strong>。应用开发要的是可预期的稳定输出，这与聊天随意试试完全不同。</p>"},{"qnum":2,"qtext":"Prompt 约束的四个维度是什么？各举一个摘要场景的例子。","answerHtml":"<p>四个维度分别是：第一是内容范围，约束的是写什么、不写什么，摘要场景里可以说&quot;聚焦产品功能，忽略公司历史&quot;；第二是输出格式，约束的是结构长什么样，比如&quot;输出 3 个要点，每点一行，以 - 开头&quot;；第三是长度限制，约束的是多长，比如&quot;总共不超过 80 字&quot;；第四是语气风格，约束的是什么口吻，比如&quot;面向管理者的正式书面语&quot;。</p><p>四维度齐全的 Prompt，输出才能稳定可预期；缺哪个维度，哪个维度就随机。这是评估任何任务型 Prompt 是否合格的检查清单。</p>"},{"qnum":3,"qtext":"一个规范的摘要 Prompt 结构长什么样？","answerHtml":"<pre><code class=\"language-python\">prompt = f&quot;&quot;&quot;你是一名科技资讯编辑。              # 角色：定义视角和专业度\n请对下面的文章写一份执行摘要。                  # 任务：明确做什么\n\n要求：                                         # 约束：四维度\n1. 只保留核心结论和关键数据，忽略细节例子\n2. 输出 3 个要点，每点不超过 30 字\n3. 使用正式书面语，面向企业管理者\n\n文章：\n{article}                                      # 输入：数据与模板分离\n&quot;&quot;&quot;</code></pre><p>结构公式：<strong>角色 + 任务 + 约束 + 输入</strong>。角色决定&quot;以什么视角取舍&quot;，任务是目标，约束四维度框定输出，输入放最后并用变量注入——模板固定、数据变化，才便于版本管理和批量处理。</p>"},{"qnum":4,"qtext":"Prompt 里的软长度约束和 max_tokens 硬约束有什么区别？怎么配合？","answerHtml":"<p>软约束（Prompt 里写&quot;不超过 80 字&quot;）作用在请求模型遵守这个层面，效果是大概率遵守、偶尔会超，好处是没有副作用；硬约束（如 max_tokens=200）则是代码强制截断，效果是绝对不会超，但副作用是一旦触到上限就会硬生生截断，话说到一半就被砍掉。</p><p>正确用法是<strong>双层防线</strong>：软约束引导模型主动控制篇幅（绝大多数情况生效），max_tokens 设为略高于软约束对应的 Token 数（如 80 字 ≈ 120 Token，设 160）作为保险丝——就算模型不听话，也不会让一次输出把预算打爆。</p>"},{"qnum":5,"qtext":"为什么\"不超过 100 字\"这种约束经常失效？","answerHtml":"<p>三个原因：</p><ul><li><strong>模型对字数没有精确感知</strong>：它是逐 Token 生成的，生成时&quot;不知道&quot;已经写了多少字，只能靠对长度的模糊语感</li><li><strong>中文字数 ≠ Token</strong>：约束的是 100 字，模型按 Token 空间估计，换算有偏差</li><li><strong>内容压力</strong>：要求覆盖的要点太多时，模型在&quot;完整&quot;和&quot;简短&quot;之间会牺牲简短</li></ul><p>工程对策：给参照物（&quot;不超过 3 个要点，每点不超过 30 字&quot;比&quot;不超过 100 字&quot;可控得多）；结构化拆分（限制条数和每条长度）；max_tokens 兜底；对精确字数有硬需求的场景，生成后用代码截断或二次压缩。</p>"},{"qnum":6,"qtext":"摘要任务的 temperature 应该设多少？为什么？","answerHtml":"<p>设 <strong>0.2~0.3</strong>。理由：</p><ul><li>摘要要求<strong>忠实原文</strong>，不需要创造性，随机性是负资产</li><li>但完全 0 有时会导致措辞生硬、逐句缩写式摘要；留一点随机性让表达更自然</li></ul><p>对比参照：信息抽取/分类用 0（要绝对稳定），对话用 0.7（要多样），创意写作用 1.0+。判断口诀：<strong>任务越客观，温度越低；任务越主观，温度越高</strong>。</p>"},{"qnum":7,"qtext":"多风格摘要器怎么设计？核心是什么？","answerHtml":"<p>核心是<strong>模板参数化</strong>：一个函数、N 套约束。</p><pre><code class=\"language-python\">STYLES = {\n    &quot;一句话&quot;: &quot;用一句话概括核心结论，不超过30字。&quot;,\n    &quot;要点&quot;:   &quot;输出3个要点，每点一行，不超过20字。&quot;,\n    &quot;正式&quot;:   &quot;以书面语写80字执行摘要，面向管理层。&quot;,\n}\n\ndef summarize(text, style=&quot;要点&quot;):\n    prompt = f&quot;你是专业编辑。{STYLES[style]}\\n\\n原文：\\n{text}&quot;\n    return chat(prompt, temperature=0.3)</code></pre><p>要点：风格差异全部收敛到字典里的约束文本，调用逻辑完全复用；新增风格只加一行配置。这个&quot;配置驱动&quot;思路是 Prompt 工程化的起点——把可变部分从代码里分离出来管理。</p>"},{"qnum":8,"qtext":"Prompt 版本对比实验应该怎么做？","answerHtml":"<p>标准流程：</p><ul><li><strong>固定变量</strong>：同一批测试输入、同一 model/temperature/max_tokens，只换 Prompt</li><li><strong>准备测试集</strong>：挑 5~10 条有代表性的输入（长短、题材、难度都覆盖）</li><li><strong>成对运行</strong>：V1 和 V2 分别跑全部测试输入，记录输出</li><li><strong>盲评</strong>：打乱顺序看输出（避免先入为主），按预设标准打分（忠实度/长度合规/可读性）</li><li><strong>下结论</strong>：V2 在多数样本上更好才切换，个别样本回退要记录</li></ul><p>常见错误：只测一条输入就下结论；同时改 Prompt 和参数（分不清谁起作用）；用训练时看过的例子做评估。</p>"},{"qnum":9,"qtext":"为什么 Prompt 优化需要固定的测试输入集？","answerHtml":"<p>因为 LLM 输出有随机性、对不同输入表现差异大，<strong>没有固定输入就没有可比较的基线</strong>：</p><ul><li>今天用 A 文章测、明天用 B 文章测，效果好差说不清是 Prompt 变了还是文章变了</li><li>固定输入集让每次改动都和上一次在同样条件下对比，改进是否真实一目了然</li><li>测试集还能沉淀&quot;失败案例&quot;——那些曾经翻车的输入是最好的回归测试</li></ul><p>实践：从第一天起就建 <code>test_inputs/</code> 目录，把遇到的边界案例（超长文本、空段落、外语文本）持续加进去，它就是 Prompt 的&quot;单元测试&quot;。</p>"},{"qnum":10,"qtext":"Few-shot 示例在摘要/风格控制任务中起什么作用？设计示例有什么讲究？","answerHtml":"<p>Few-shot 用&quot;输入→期望输出&quot;的实例直接示范目标行为，比抽象规则描述更有效——模型最擅长模仿示例。</p><p>设计讲究：</p><ul><li><strong>示例即标准</strong>：示例的长度、结构、语气就是模型模仿的对象，必须精心制作</li><li><strong>覆盖差异</strong>：给 2~3 个示例时，输入题材应有变化，避免模型只学到题材而非方法</li><li><strong>展示边界</strong>：包含一个&quot;信息很少的输入 → 极简输出&quot;的示例，教会模型弹性</li><li><strong>成本意识</strong>：示例常驻 Prompt，每次调用都花 Token，够用就好</li></ul>"},{"qnum":11,"qtext":"综合应用：如何系统评估并迭代一个摘要 Prompt？给出完整工作流。","answerHtml":"<ul><li><strong>建基线</strong>：V1 按四维度写好约束，跑固定测试集（8~10 条），记录输出</li><li><strong>定标准</strong>：三个量化维度——忠实度（要点来自原文，无编造）、合规度（字数/条数/格式符合约束）、可读性（目标读者能否 10 秒抓住重点）</li><li><strong>找短板</strong>：逐条检查失败模式——超长？漏关键数据？夹带评论？对应修 Prompt（加约束、给示例、改结构）</li><li><strong>对照实验</strong>：V2 与 V1 同条件跑同测试集，盲评打分，多数样本更好才合入</li><li><strong>沉淀回归集</strong>：把 V1 失败的输入永久留在测试集，防止下次改动复发</li><li><strong>版本管理</strong>：<code>prompts/v3_summarize.txt</code> 存档，代码按版本引用，可随时回滚</li></ul><p>关键认知：Prompt 是需要<strong>测试驱动、版本管理</strong>的代码资产，不是一段随手改的字符串。</p>"}]},{"name":"结构化输出与信息抽取","questions":[{"qnum":1,"qtext":"什么是信息抽取？有哪些典型应用场景？","answerHtml":"<p>信息抽取（Information Extraction）是从非结构化文本中识别并提取<strong>预定义字段</strong>，输出结构化数据的任务：</p><pre><code>&quot;张伟，25岁，曾在阿里巴巴任Python工程师3年，邮箱 zhangwei@example.com&quot;\n        ↓ LLM + 格式约束\n{&quot;name&quot;: &quot;张伟&quot;, &quot;age&quot;: 25, &quot;company&quot;: &quot;阿里巴巴&quot;,\n &quot;skills&quot;: [&quot;Python&quot;], &quot;email&quot;: &quot;zhangwei@example.com&quot;}</code></pre><p>典型场景：简历解析（姓名/技能/年限）、客服工单（问题类型/情绪/订单号）、商品描述（品牌/型号/价格）、合同要素（甲乙方/金额/日期）、新闻事件（时间/地点/人物）。共同点：<strong>输入是自然语言，输出要进数据库或被程序消费</strong>。</p>"},{"qnum":2,"qtext":"信息抽取和文章摘要的本质区别是什么？","answerHtml":"<p>摘要的输出是自然语言文本，抽取的输出则是结构化数据（JSON）；对待原文的方式上，摘要会压缩、改写、整合内容，抽取则要求忠实复制原文中的特定信息；在发挥空间上，摘要允许做语义整合，抽取<strong>不允许推断</strong>，字段值必须来自原文；评估标准上，摘要看的是语义准确性（偏主观），抽取看的是字段是否完整、类型是否正确（客观可校验）；遇到原文没提到的信息时，摘要会尽量概括着写，抽取则必须返回 null，绝不能猜。</p><p>一句话：摘要是&quot;创作&quot;，抽取是&quot;查抄&quot;。所以抽取 Prompt 必须强调两条铁律：<strong>只提取原文信息；找不到返回 null</strong>。</p>"},{"qnum":3,"qtext":"为什么抽取任务要求模型输出 JSON 而不是自然语言？","answerHtml":"<p>因为<strong>下游消费者是程序，不是人</strong>：</p><ul><li><code>json.loads()</code> 一步解析，无需脆弱的正则去抠文本</li><li>字段名和类型可以预先约定（Schema），程序知道一定有哪些键</li><li>可做二次校验：类型检查、必填检查、枚举值检查</li><li>天然支持嵌套和数组（<code>skills: [...]</code>）</li><li>便于入库、传 API、拼表格——结构化数据是程序间协作的通用货币</li></ul><p>格式即接口：JSON 输出的稳定性直接决定这个功能能不能用。</p>"},{"qnum":4,"qtext":"抽取 Prompt 里的字段定义应该包含哪些要素？","answerHtml":"<pre><code class=\"language-python\">fields = {\n    &quot;name&quot;:    &quot;求职者姓名，字符串&quot;,\n    &quot;age&quot;:     &quot;年龄，整数，没有返回 null&quot;,\n    &quot;skills&quot;:  &quot;技能列表，字符串数组，按原文列出&quot;,\n}\nfield_lines = &quot;\\n&quot;.join(f&quot;- {k}: {v}&quot; for k, v in fields.items())</code></pre><p>三要素：<strong>字段名</strong>（与下游 Schema 一致）、<strong>类型</strong>（字符串/整数/数组/布尔）、<strong>说明与兜底</strong>（取值规则、找不到怎么办）。要点：字段名用英文（模型输出英文键名更稳，避免中英文混排出错）；类型写进说明，模型会照做；兜底规则统一为 null。字段定义的质量直接决定抽取准确率。</p>"},{"qnum":5,"qtext":"字段在原文中找不到时，为什么必须让模型返回 null 而不是\"合理猜测\"？","answerHtml":"<p>因为抽取结果要被程序当作<strong>事实</strong>使用：入库、触发流程、参与计算。模型猜测的值（如按上下文&quot;推断&quot;一个邮箱格式）在统计上合理、在事实上一无是处，且<strong>猜测值和真实值在输出里长得一模一样，程序无法区分</strong>。</p><p>null 的价值：把&quot;不知道&quot;变成显式信号，下游可以决定跳过、告警还是人工补录——错误被控制在可处理范围内。对应 Prompt 铁律：&quot;只提取原文信息，找不到返回 null，不允许推断&quot;，temperature 也应设 0 消除&quot;脑补&quot;空间。</p>"},{"qnum":6,"qtext":"让模型\"只输出 JSON\"有哪些手段？各有多可靠？","answerHtml":"<p>手段大概有五种，可靠性依次递增。第一是 Prompt 声明，做法是直接写&quot;只输出 JSON，不要任何其他文字&quot;，属于基础手段，偶尔还是会违规；第二是给示例，用 Few-shot 示范纯 JSON 输出，可靠性有明显提升；第三是结构引导，用 ``<code>json 代码块把输出包裹起来，这样便于提取，但仍可能夹带说明文字；第四是 response_format，设置 </code>{&quot;type&quot;: &quot;json_object&quot;}`，这是<strong>API 层强制</strong>的，最可靠；第五是代码容错，解析失败就自动重试或修复，是最后一道防线。</p><p>生产做法是组合拳：response_format（强制）+ Prompt 约束（双保险）+ 解析容错（兜底）。</p>"},{"qnum":7,"qtext":"response_format={\"type\": \"json_object\"} 用过吗？使用时要注意什么？","answerHtml":"<p>它是 API 层的 JSON 模式开关，开启后模型<strong>保证</strong>输出可被 <code>json.loads()</code> 解析的合法 JSON，从根上消灭&quot;JSON 前后带解释文字&quot;的问题。</p><p>两个注意点：</p><ul><li><strong>Prompt 里必须出现 &quot;json&quot; 字样</strong>（并最好给出字段示例），否则 API 直接报错——这是官方的使用前提</li><li>它只保证<strong>语法合法</strong>，不保证字段名对、类型对、值不编造——<code>{&quot;nmae&quot;: &quot;张伟&quot;}</code>、<code>{&quot;age&quot;: &quot;25&quot;}</code> 都是合法 JSON 但都是错的</li></ul><p>所以 JSON mode 解决&quot;能不能解析&quot;，字段校验（如 Pydantic）解决&quot;解析出来对不对&quot;，两者缺一不可。</p>"},{"qnum":8,"qtext":"json.loads() 解析模型输出失败，常见原因有哪些？怎么处理？","answerHtml":"<p>常见失败：</p><ul><li>输出带前后缀：JSON 前后带说明文字，如「以下是抽取结果：{&quot;name&quot;: ...}」</li><li>Markdown 代码块包裹：输出被 ```json 代码块标记包裹，解析前需剥离</li><li>单引号/尾逗号等非法语法（模型手滑）</li><li>被 max_tokens 截断，JSON 不完整</li><li>输出中混入了转义不当的引号</li></ul><p>处理策略（分层兜底）：</p><pre><code class=\"language-python\">def parse_json_safe(text):\n    text = text.strip()\n    if text.startswith(&quot;```&quot;):                # 剥代码块\n        text = text.split(&quot;```&quot;)[1].lstrip(&quot;json&quot;).strip()\n    try:\n        return json.loads(text)\n    except json.JSONDecodeError:\n        start, end = text.find(&quot;{&quot;), text.rfind(&quot;}&quot;)\n        if start != -1 and end &gt; start:       # 抠出 {...} 再试\n            return json.loads(text[start:end+1])\n        raise                                   # 彻底失败 → 换约束重试</code></pre><p>再配合：JSON mode 从源头减少失败、finish_reason 检查截断、失败自动重试一次。</p>"},{"qnum":9,"qtext":"信息抽取任务的常见失败模式有哪些？各自怎么解决？","answerHtml":"<p>常见的失败模式大概有六种。第一是格式违规，表现是 JSON 外面还带着说明文字，解决办法是 JSON mode 加上容错解析；第二是字段编造，表现是输出了原文里没有的值，解决办法是在 Prompt 里要求&quot;找不到返回 null&quot;，并把 temperature 设为 0；第三是类型错误，表现是比如 age 输出成了字符串 &quot;25&quot;，解决办法是在字段定义里写明类型，再在代码层做类型转换和校验；第四是字段遗漏，表现是漏掉了某个字段没输出，解决办法是代码里补默认值，用 <code>setdefault(k, None)</code>；第五是幻觉字段名，表现是出现 nmae、Name 这类拼写变体，解决办法是用 Few-shot 示例，并在校验不通过后重试；第六是内容截断，表现是 JSON 没写完，解决办法是检查 finish_reason，并调大 max_tokens。</p><p>核心思想：<strong>Prompt 负责预防，代码负责兜底</strong>——任何失败模式都要有对应的程序化处理，而不是指望模型永远听话。</p>"},{"qnum":10,"qtext":"Few-shot 示例如何提升抽取稳定性？示例应该覆盖哪些情况？","answerHtml":"<p>在 Prompt 中给 1~2 个&quot;文本 → JSON&quot;完整示例，模型会严格模仿输出格式，字段名变体、格式漂移等问题大幅减少。</p><p>示例覆盖原则：</p><ul><li><strong>标准情况</strong>：字段齐全，示范理想输出</li><li><strong>缺失情况</strong>：原文没有某字段 → 输出 null（这条最关键，教会模型&quot;不猜&quot;）</li><li><strong>类型示范</strong>：数组怎么写、数字不带引号</li></ul><pre><code class=\"language-python\">示例输入：&quot;李娜，邮箱 lina@x.com&quot;\n示例输出：{&quot;name&quot;: &quot;李娜&quot;, &quot;age&quot;: null, &quot;email&quot;: &quot;lina@x.com&quot;}</code></pre><p>注意示例也消耗 Token，1~2 个精心设计的（尤其含 null 的）通常就够。</p>"},{"qnum":11,"qtext":"拿到模型的 JSON 后，结果校验和兜底应该怎么做？","answerHtml":"<pre><code class=\"language-python\">data = parse_json_safe(raw)\nfor key in fields:                      # 1. 补全缺失字段\n    data.setdefault(key, None)\nif not isinstance(data.get(&quot;age&quot;), int):# 2. 类型校验与修复\n    data[&quot;age&quot;] = int(data[&quot;age&quot;]) if str(data[&quot;age&quot;]).isdigit() else None\nif data.get(&quot;type&quot;) not in ALLOWED:     # 3. 枚举值校验\n    data[&quot;type&quot;] = None</code></pre><p>校验三件事：<strong>字段齐不齐</strong>（补 null）、<strong>类型对不对</strong>（转换或置 null）、<strong>值合不合法</strong>（枚举、范围）。修复不了的重试一次（把校验错误信息回传给模型&quot;你上次输出 age 应为整数，请重新输出&quot;）。兜底原则：让每条结果要么是可信数据、要么是显式 null，绝不把&quot;看起来对&quot;的数据往下游传。</p>"},{"qnum":12,"qtext":"综合应用：设计一个可复用的通用信息抽取器，说明核心设计决策。","answerHtml":"<pre><code class=\"language-python\">class InfoExtractor:\n    def extract(self, text: str, fields: dict) -&gt; dict:\n        field_lines = &quot;\\n&quot;.join(f&quot;- {k}: {v}&quot; for k, v in fields.items())\n        prompt = (\n            f&quot;从以下文本中抽取信息，以 JSON 格式输出：\\n\\n{field_lines}\\n\\n&quot;\n            &quot;规则：只提取原文信息，找不到返回 null，只输出 JSON。\\n\\n文本：\\n{text}&quot;\n        )\n        raw = chat(prompt, temperature=0.0, json_mode=True)\n        data = parse_json_safe(raw)\n        for key in fields:\n            data.setdefault(key, None)\n        return data\n\nextractor.extract(resume, {&quot;name&quot;: &quot;姓名&quot;, &quot;skills&quot;: &quot;技能数组&quot;})\nextractor.extract(ticket, {&quot;order_id&quot;: &quot;订单号&quot;, &quot;sentiment&quot;: &quot;情绪&quot;})</code></pre><p>设计决策：</p><ul><li><strong>字段外置</strong>：fields 由调用方传入，抽取器对场景无感知——简历、工单、合同一个类通吃</li><li><strong>稳定性三件套</strong>：temperature=0 + JSON mode + &quot;找不到返回 null&quot; 铁律</li><li><strong>防御式收尾</strong>：解析容错 + 缺失补 null，保证返回结构永远可预测</li><li><strong>可演进</strong>：需要更强稳定性时加 Few-shot、加类型校验、加重试，接口不变</li></ul>"}]},{"name":"第 1 周综合复盘","questions":[{"qnum":1,"qtext":"第 1 周的\"三大深度问题\"是什么？请分别用一句话回答。","answerHtml":"<ul><li><strong>Token 为什么和成本有关？</strong> API 按 Token 计费（输入输出分开计价），多轮对话每次都传全量历史，累计消耗随轮数平方级增长。</li><li><strong>Temperature 为什么影响输出？</strong> 它在采样前缩放概率分布——调低让高概率词更占优（稳定），调高让分布更平（多样）。</li><li><strong>为什么多轮对话必须传历史？</strong> API 无状态，服务端不存对话，&quot;记忆&quot;完全由客户端 messages 数组每次重传提供。</li></ul><p>这三个问题贯穿后面所有主题：成本意识 → 优化策略；随机性 → 稳定性工程；无状态 → 历史管理与状态设计。</p>"},{"qnum":2,"qtext":"Temperature 在数学上是怎么影响输出的？","answerHtml":"<p>模型对每个候选 Token 输出一个 logits 分数，除以 Temperature 后做 softmax 得到采样概率：</p><pre><code>P(token_i) = softmax(logits_i / T)</code></pre><ul><li><strong>T → 0</strong>：分数差距被放大，最高分 Token 概率趋近 1 → 近似贪心，输出确定</li><li><strong>T = 1</strong>：使用模型原始分布</li><li><strong>T &gt; 1</strong>：分数差距被压平，低概率 Token 也有机会 → 输出发散、有创意、甚至混乱</li></ul><p>理解要点：Temperature 不改变模型&quot;认为&quot;什么好（logits 不变），只改变&quot;照着做的确定程度&quot;——这也解释了为什么调高温度不会让模型变聪明，只会更随机。</p>"},{"qnum":3,"qtext":"聊天、摘要、信息抽取三个 Demo 在设计上有哪些关键差异？","answerHtml":"<p>先说聊天这个场景，它是多轮交互，得靠 messages 数组不断累积才有状态；Prompt 部分是固定的 system 加上每次变化的用户输入；temperature 调到 0.7，图的是回答有点多样性，不死板；输出是直接展示给人看的对话，所以这里最难的是历史管理，怎么把上下文管好。再看摘要，它是单次的长文本输入，一次调用完就结束，没有状态；Prompt 用的是固定模板加变量注入的方式；temperature 降到 0.3，追求的是忠实原文，不能自己发挥；输出同样是给人看的，但难点变成了约束设计，怎么让模型老老实实按原文总结。最后信息抽取，同样是单次输入、无状态，但 Prompt 里的字段定义是动态生成的，要跟着不同的抽取需求变化；temperature 直接压到 0，追求绝对稳定，一点随机都不要；而且输出不是给人看的，是交给程序去解析成 JSON，所以这里的核心难点就是格式稳定性，模型必须每次都吐出结构一致的结果。</p><p>三个 Demo 是一条演进线：<strong>状态从无到有 → 约束从松到紧 → 输出从&quot;给人&quot;到&quot;给程序&quot;</strong>，难度依次上升，恰好覆盖 LLM 应用的三种基本形态。</p>"},{"qnum":4,"qtext":"第 1 周形成的\"应用开发最小闭环\"包括哪六个能力？","answerHtml":"<ul><li><strong>认知</strong>：知道模型是什么、能干什么不能干什么（Day 1）</li><li><strong>工程底座</strong>：虚拟环境 + 依赖管理 + 异常处理（Day 2）</li><li><strong>连通</strong>：API Key 安全管理 + SDK 调用 + 客户端封装（Day 3）</li><li><strong>状态</strong>：多轮对话与消息历史管理（Day 4）</li><li><strong>控制</strong>：Prompt 四维度约束 + 长度控制（Day 5）</li><li><strong>结构化</strong>：JSON 输出约束 + 校验兜底（Day 6）</li></ul><p>这六步就是&quot;调用一次模型&quot;到&quot;做一个可靠功能&quot;的完整路径，后续所有主题（RAG、Tool Calling、Agent）都是在这个闭环上做加法。</p>"},{"qnum":5,"qtext":"\"这个月 API 账单突然翻倍\"，用第一周的知识怎么排查？","answerHtml":"<p>按 Token 公式拆解：<strong>成本 = 调用次数 × (输入 Token × 输入价 + 输出 Token × 输出价)</strong>，三个因子逐一排查：</p><ul><li><strong>调用次数变多？</strong> 查日志/usage 统计——是否新功能上线、重试风暴（429 未退避）、测试跑疯了</li><li><strong>输入 Token 变多？</strong> 最常见元凶：多轮对话历史无限增长（没做截断，平方级增长）；Prompt 越改越长；把整个文档塞进上下文而没用检索</li><li><strong>输出 Token 变多？</strong> Prompt 没限制长度、max_tokens 放太大、要求输出解释性文字</li><li><strong>单价变了？</strong> 换了更贵的模型、模型涨价</li></ul><p>预防措施：封装层统一记录 usage、按功能统计成本、给单次调用设 Token 预算。</p>"},{"qnum":6,"qtext":"给一个任务，temperature 怎么选？给出决策思路。","answerHtml":"<pre><code>任务输出是给程序消费的吗？（JSON/分类/抽取）\n ├─ 是 → 0（稳定性压倒一切）\n └─ 否 → 输出是给用户看的\n      ├─ 要求忠实/专业（摘要/改写/客服）→ 0.2~0.3\n      ├─ 日常对话/陪伴聊天 → 0.7\n      └─ 创意生成（文案/头脑风暴）→ 0.9~1.2</code></pre><p>两条底层判断：<strong>结果的容错空间有多大</strong>（错了代价大 → 调低）、<strong>多样性是不是价值本身</strong>（要的就是不一样 → 调高）。不确定时从低往高试：随机性问题（跑偏、不稳定）永远比呆板问题（表达僵硬）更难排查。</p>"},{"qnum":7,"qtext":"如何把第 1 周的成果整理成一个\"工具包\"项目？模块怎么划分？","answerHtml":"<pre><code>week1_toolkit/\n├── .env                  # 密钥（不提交）\n├── .env.example          # 密钥模板（提交）\n├── .gitignore\n├── requirements.txt\n├── client.py             # 统一 LLM 客户端：chat()/chat_stream()，usage 统计\n├── summarizer.py         # 摘要器：多风格约束配置\n├── extractor.py          # 抽取器：通用字段抽取 + 校验兜底\n└── main.py               # 演示入口：串起来跑三个功能</code></pre><p>划分原则：</p><ul><li><strong>client.py 是唯一碰 SDK 的地方</strong>——改 Key/模型/加日志，其他模块零改动</li><li><strong>三个功能模块相互独立</strong>，可单独测试</li><li><strong>main.py 只做串联演示</strong>，不含业务逻辑</li><li>Day 8 以后的新能力（结构化输出、分类器）以新模块持续加入</li></ul><p>这个结构就是后续两周项目骨架的雏形。</p>"},{"qnum":8,"qtext":"第 1 周的三个 Demo 距离\"能上线的真实产品\"还缺什么？","answerHtml":"<ul><li><strong>可靠性</strong>：没有重试与退避（限流即崩）、没有超时控制、没有输出校验（JSON 坏了直接异常）</li><li><strong>可观测</strong>：没有日志（出了问题查无实据）、没有 usage/成本统计</li><li><strong>配置管理</strong>：参数硬编码散落各处，没有统一配置与环境区分</li><li><strong>测试</strong>：没有固定测试集，改了 Prompt 不知道是好是坏</li><li><strong>用户体验</strong>：无流式输出、无错误提示、无并发处理</li><li><strong>安全</strong>：输入未做长度/内容限制，Prompt 注入毫无防护</li></ul><p>这些恰好就是第 2 周的主题（结构化输出、校验、日志、配置、成本）——<strong>Demo 关心&quot;能不能跑通&quot;，产品关心&quot;错了怎么办&quot;</strong>。</p>"},{"qnum":9,"qtext":"综合应用：只用第 1 周的知识，从零搭一个\"论文快读助手\"，怎么设计？","answerHtml":"<p><strong>需求</strong>：输入一篇论文/长文，输出中文速读卡片（一句话结论、三个要点、关键词、元信息抽取）。</p><p><strong>架构</strong>（三个模块组合）：</p><ul><li><strong>输入处理</strong>：读文件（<code>Path.read_text(encoding=&quot;utf-8&quot;)</code>），超长文本先做段落级粗筛——按标题/摘要/结论优先截取，控制输入 Token</li><li><strong>多任务单次调用</strong>：用抽取任务承载全部输出——定义字段 schema（<code>{&quot;one_line&quot;: &quot;...&quot;, &quot;points&quot;: &quot;...&quot;, &quot;keywords&quot;: [...], &quot;venue&quot;: &quot;...&quot;}</code>），temperature=0.3、JSON mode、字段定义 + 兜底规则进 Prompt</li><li><strong>校验与展示</strong>：<code>parse_json_safe</code> 解析 → <code>setdefault</code> 补全 → 类型检查 → 格式化打印卡片；记录 usage 并按单价估算单篇成本</li></ul><p><strong>工程细节</strong>：Key 走 .env；client 封装复用；批处理时加 429 指数退避；留 5 篇固定测试论文做 Prompt 回归。</p><p>这个方案证明：<strong>摘要约束 + 结构化抽取 + 客户端封装</strong>的第一周组合拳，已能做出实用的小工具。</p>"}]},{"name":"结构化输出","questions":[{"qnum":1,"qtext":"\"能被 json.loads() 解析\"和\"结构化输出可靠\"是一回事吗？三层约束分别解决什么问题？","answerHtml":"<p>不是一回事。<code>json.loads()</code> 只能保证这是一段<strong>合法的 JSON 文本</strong>，不能保证字段名对、类型对、必填字段没漏——例如 <code>{&quot;nmae&quot;: &quot;张伟&quot;}</code> 拼错字段名、<code>{&quot;age&quot;: &quot;28&quot;}</code> 类型是字符串而非整数，这些都能被 <code>json.loads()</code> 正常解析，但对下游代码来说都是&quot;错的&quot;。</p><p>真正可靠的结构化输出要靠三层约束叠加：第一层是 Prompt 层，靠文字描述或者拼接 JSON Schema，解决的问题是让模型&quot;知道&quot;应该输出什么结构；第二层是 API 参数层，用 <code>response_format={&quot;type&quot;: &quot;json_object&quot;}</code>，解决的问题是保证输出是合法 JSON、减少多余文字；第三层是应用层，靠 JSON Schema 或者 Pydantic 校验，解决的问题是保证字段类型正确、必填项齐全、没有多余字段。</p><p>三层需要叠加使用：API 层只能兜底&quot;合法 JSON&quot;这一个维度，字段级别的正确性必须靠应用层校验才能保证。</p>"},{"qnum":2,"qtext":"JSON Schema 中 required 和 additionalProperties 分别解决什么问题？","answerHtml":"<ul><li><strong><code>required</code></strong>：声明哪些字段是必填的。模型如果漏输出这些字段，应用层校验（如 Pydantic）会直接报错，而不是让程序在后续使用 <code>data[&quot;field&quot;]</code> 时抛 <code>KeyError</code>。</li><li><strong><code>additionalProperties: False</code></strong>：禁止模型输出 Schema 之外的多余字段。没有这个约束时，模型有时会&quot;自作主张&quot;多加字段（如把抽取理由也写进 JSON），污染下游数据结构。</li></ul><pre><code class=\"language-python\">schema = {\n    &quot;type&quot;: &quot;object&quot;,\n    &quot;properties&quot;: {&quot;name&quot;: {&quot;type&quot;: &quot;string&quot;}, &quot;age&quot;: {&quot;type&quot;: &quot;integer&quot;}},\n    &quot;required&quot;: [&quot;name&quot;, &quot;age&quot;],       # 缺一个都算校验失败\n    &quot;additionalProperties&quot;: False,     # 多一个字段也算校验失败\n}</code></pre><p>两者共同保证&quot;字段既不多也不少&quot;，这是结构化输出能被下游系统安全消费的前提。</p>"},{"qnum":3,"qtext":"为什么推荐用 Pydantic 而不是手写 JSON Schema + 校验代码？","answerHtml":"<p>手写方案需要单独维护一份 JSON Schema（给 Prompt 用）和一份校验逻辑（给代码用），两者容易&quot;两处维护、逐渐失步&quot;。Pydantic 用一个 <code>class</code> 同时承担三个职责：</p><p>Pydantic 用一个 <code>class</code> 同时承担三个职责：第一是数据结构定义，class 的字段本身就是 Schema；第二是类型校验与转换，用 <code>Model(**data)</code>，失败会自动抛出 <code>ValidationError</code>，而且能把像 <code>&quot;28&quot;</code> 这样的字符串自动转成整数 <code>28</code>；第三是 Prompt 约束来源，通过 <code>Model.model_json_schema()</code> 一键导出，不需要再手写第二份描述。</p><pre><code class=\"language-python\">from pydantic import BaseModel, Field\nfrom typing import Optional\n\nclass ResumeInfo(BaseModel):\n    name: str = Field(description=&quot;候选人姓名&quot;)\n    age: Optional[int] = Field(default=None, description=&quot;年龄&quot;)\n\nschema = ResumeInfo.model_json_schema()   # 直接喂给 Prompt\nresume = ResumeInfo(**json.loads(raw))    # 一步完成解析+校验+转换</code></pre><p>一份定义，三处复用，比&quot;手写 Schema + 手写 if/else 校验&quot;更不容易出现字段定义不一致的问题。</p>"},{"qnum":4,"qtext":"抽取任务中枚举字段的值容易跑偏，如何在 Prompt 和代码层面双重兜底？","answerHtml":"<p><strong>Prompt 层</strong>：在 JSON Schema 里用 <code>enum</code> 显式列出所有合法取值，并在提示词中强调&quot;必须是以下枚举值之一，不要输出其他表述&quot;：</p><pre><code class=\"language-python\">{&quot;category&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;enum&quot;: [&quot;咨询&quot;, &quot;投诉&quot;, &quot;建议&quot;, &quot;故障&quot;]}}</code></pre><p><strong>代码层</strong>：即使加了 <code>enum</code>，模型仍可能偶发输出近似但不完全匹配的值（如&quot;投诉建议&quot;），需要在校验失败时做一次兜底归一化，而不是直接判定整条记录失败：</p><pre><code class=\"language-python\">def normalize_enum(value: str, allowed: list[str]) -&gt; Optional[str]:\n    if value in allowed:\n        return value\n    for option in allowed:\n        if option in value:      # 退化为包含关系匹配\n            return option\n    return None                  # 实在无法归一化，交给人工复核</code></pre><p>两层兜底的关系：Prompt 层的 <code>enum</code> 降低跑偏概率，代码层的归一化处理&quot;降低概率之后仍然存在的长尾情况&quot;，两者配合才能把枚举命中率提升到生产可用水平。</p>"},{"qnum":5,"qtext":"如何从零设计一个支持\"批量抽取 + 类型安全 + 失败重试\"的结构化抽取器？","answerHtml":"<p>核心设计原则：<strong>Schema 与 Prompt 自动同步 + 校验失败可重试 + 失败记录不阻塞整体流程</strong>。</p><pre><code>structured_extractor/\n├── client.py       # 共享 OpenAI client\n├── schemas.py      # 各业务场景的 Pydantic 模型（ResumeInfo、FeedbackInfo…）\n├── extractor.py    # build_prompt / extract_structured / batch_extract\n└── main.py         # 演示入口</code></pre><pre><code class=\"language-python\"># extractor.py 核心逻辑\ndef build_prompt(text: str, model_cls: type[BaseModel]) -&gt; str:\n    schema = json.dumps(model_cls.model_json_schema(), ensure_ascii=False)\n    return f&quot;严格按照该 JSON Schema 抽取信息：\\n{schema}\\n\\n只输出 JSON。\\n\\n文本：\\n{text}&quot;\n\ndef extract_structured(text: str, model_cls: type[BaseModel], max_retries: int = 2) -&gt; BaseModel:\n    prompt = build_prompt(text, model_cls)\n    last_error = None\n    for _ in range(max_retries):\n        raw = call_llm(prompt)  # temperature=0 + response_format=json_object\n        try:\n            return model_cls(**json.loads(raw))\n        except (json.JSONDecodeError, ValidationError) as e:\n            last_error = e\n    raise RuntimeError(f&quot;抽取失败：{last_error}&quot;)\n\ndef batch_extract(texts: list[str], model_cls: type[BaseModel]) -&gt; dict:\n    results, failures = [], []\n    for i, text in enumerate(texts):\n        try:\n            results.append(extract_structured(text, model_cls))\n        except RuntimeError as e:\n            failures.append({&quot;index&quot;: i, &quot;error&quot;: str(e)})\n    return {&quot;success&quot;: results, &quot;failed&quot;: failures}   # 失败记录单独落盘，不阻塞整批</code></pre><p>这种设计的好处：</p><ul><li><code>schemas.py</code> 新增一个业务场景只需定义一个 Pydantic 模型，<code>extractor.py</code> 零改动即可复用</li><li>Prompt 约束始终和代码里的类型定义保持一致，不存在&quot;文档描述和代码不符&quot;的问题</li><li><code>batch_extract</code> 把&quot;部分记录失败&quot;和&quot;整体任务失败&quot;解耦，失败记录可以离线人工复核或二次重试</li></ul>"}]},{"name":"输出校验与异常处理","questions":[{"qnum":1,"qtext":"大模型调用链路中常见的异常有哪些？如何区分可重试与不可重试？","answerHtml":"<p>一次抽取请求要经过&quot;网络 → HTTP 状态码 → JSON 解析 → 字段校验&quot;多个环节，每个环节都有特有的失败方式：</p><p>先看网络层，<code>ConnectionError</code> 或者 <code>Timeout</code> 是可以重试的；再看 HTTP 层，429 限流是可以重试的，但需要退避，500/502/503 这类服务端错误也是可以重试的，而 401/403 这种 Key 无效或无权限的问题，本质是配置错误，<strong>不可重试</strong>，因为重试无法自愈，应该立即终止并告警，404 模型名写错了同样<strong>不可重试</strong>，也属于配置问题；再看解析层，<code>json.JSONDecodeError</code> 是可以重试的，换一次生成大概率能拿到合法 JSON；最后是校验层，<code>pydantic.ValidationError</code> 要视情况重试 1-2 次，仍然失败就转入业务兜底。</p><p>判断标准：<strong>这次失败是偶发的（网络抖动、模型这次没输出好）还是确定性的（配置错了、权限不对）</strong>。偶发性错误值得重试，确定性错误重试只会浪费时间和 Token，还会掩盖真正的问题。</p>"},{"qnum":2,"qtext":"json.JSONDecodeError 和 pydantic.ValidationError 分别代表什么层面的失败？处理策略有何不同？","answerHtml":"<p><code>json.JSONDecodeError</code> 是格式层面的失败，典型场景是模型输出被截断、掺杂了非 JSON 字符，处理策略是值得重试——重新生成一次大概率能拿到完整合法的 JSON；<code>pydantic.ValidationError</code> 则是语义层面的失败，典型场景是字段名拼错、类型不匹配、必填项缺失，处理策略要看具体错误类型：<code>missing</code>（缺字段）和类型不匹配值得重试 1-2 次，仍失败则不再无脑重试，转入业务兜底（标记待复核或丢弃）。</p><p>关键区别：前者是&quot;这段文本根本不是合法 JSON&quot;，后者是&quot;JSON 合法，但内容不符合预期结构&quot;。两者都应该被统一包装成结构化的返回值（而不是让异常直接向上抛），调用方只需要判断 <code>ok</code> 字段，不需要关心具体抛了哪种异常。</p>"},{"qnum":3,"qtext":"抽取结果字段缺失时，如何设计兜底策略而不是简单地\"报错\"或\"忽略\"？","answerHtml":"<p>核心原则：<strong>不是所有缺失都一样严重，应该按字段重要性分级处理</strong>，而不是用同一种策略应对所有缺失字段。</p><p>具体分三种策略：第一种是默认值填充，做法是给缺失字段填 <code>null</code>、空字符串或者 <code>0</code>，适用场景是该字段本来就允许为空；第二种是标记待人工复核，做法是记录到 <code>needs_review</code>，并附带缺失原因，适用场景是缺失的是重要字段，需要人工确认；第三种是直接丢弃记录，做法是把该条数据完全跳过，适用场景是缺失的是必填字段，记录已经不可用了。</p><p>按字段等级（<code>REQUIRED</code> / <code>IMPORTANT</code> / <code>OPTIONAL</code>）判断记录最终该归入 <code>success</code>、<code>needs_review</code> 还是 <code>failed</code> 三态之一：</p><pre><code class=\"language-python\">def assess_completeness(data: dict, field_levels: dict) -&gt; str:\n    missing_required = [k for k, lv in field_levels.items()\n                         if lv == FieldLevel.REQUIRED and not data.get(k)]\n    missing_important = [k for k, lv in field_levels.items()\n                          if lv == FieldLevel.IMPORTANT and not data.get(k)]\n    if missing_required:\n        return &quot;failed&quot;\n    if missing_important:\n        return &quot;needs_review&quot;\n    return &quot;success&quot;</code></pre><p>这样批量任务的&quot;成功率&quot;不再是非黑即白，能清楚回答&quot;有多少可以直接用、多少需要人工看一眼、多少彻底失败&quot;。</p>"},{"qnum":4,"qtext":"如何从零设计一个不会因单条脏数据崩溃的健壮批量抽取器？","answerHtml":"<p>核心设计原则：<strong>分层捕获异常 + 按错误类型决定重试策略 + 结果三态化，让单条数据的失败不影响整批任务</strong>。</p><pre><code class=\"language-python\">def call_llm_with_backoff(prompt, max_retries=3, base_delay=1.0):\n    for attempt in range(max_retries):\n        try:\n            return client.chat.completions.create(...).choices[0].message.content\n        except Exception as e:\n            status_code = getattr(e, &quot;status_code&quot;, None)\n            if status_code in (401, 403, 404):\n                raise NonRetryableError(f&quot;不可恢复错误（{status_code}）：{e}&quot;)\n            if attempt == max_retries - 1:\n                raise\n            time.sleep(base_delay * (2 ** attempt) + random.uniform(0, 1))\n\ndef parse_and_validate(raw, model_cls):\n    try:\n        data = json.loads(raw)\n    except json.JSONDecodeError as e:\n        return None, f&quot;json_error: {e}&quot;\n    try:\n        return model_cls(**data), None\n    except ValidationError as e:\n        return None, f&quot;validation_error: {e.errors()}&quot;\n\ndef extract_robust(text, model_cls, field_levels, build_prompt_fn, max_parse_retries=2):\n    prompt = build_prompt_fn(text, model_cls)\n    for attempt in range(max_parse_retries):\n        try:\n            raw = call_llm_with_backoff(prompt)\n        except NonRetryableError as e:\n            return ExtractionRecord(status=&quot;failed&quot;, reason=str(e))\n        obj, error = parse_and_validate(raw, model_cls)\n        if obj is not None:\n            status, reason = assess_completeness(obj.model_dump(), field_levels)\n            return ExtractionRecord(status=status, data=obj.model_dump(), reason=reason)\n    return ExtractionRecord(status=&quot;failed&quot;, reason=f&quot;重试耗尽：{error}&quot;)\n\ndef batch_extract_robust(texts, model_cls, field_levels, build_prompt_fn):\n    buckets = {&quot;success&quot;: [], &quot;needs_review&quot;: [], &quot;failed&quot;: []}\n    for i, text in enumerate(texts):\n        record = extract_robust(text, model_cls, field_levels, build_prompt_fn)\n        buckets[record.status].append({&quot;index&quot;: i, &quot;text&quot;: text, &quot;record&quot;: record})\n    return buckets   # 单条失败只进入 failed 桶，不会中断循环</code></pre><p>设计要点：</p><ul><li><code>call_llm_with_backoff</code> 只负责网络层重试，遇到 401/403/404 这类不可恢复错误立刻抛出，不浪费重试次数</li><li><code>parse_and_validate</code> 把 JSON 解析和 Pydantic 校验两类异常收敛为统一的 <code>(obj, error)</code> 返回值，避免多层嵌套 <code>try/except</code></li><li><code>assess_completeness</code> 把&quot;数据本身不完整&quot;和&quot;程序出错&quot;分开处理，避免把正常的业务缺失当成异常上报</li><li><code>batch_extract_robust</code> 用 <code>try/except</code> 包住每条数据的处理，配合三态分桶，保证 1000 条里有几条脏数据也不会拖垮整个批次</li></ul>"}]},{"name":"文本分类","questions":[{"qnum":1,"qtext":"分类任务和信息抽取任务在 Prompt 设计上有什么本质区别？","answerHtml":"<p>核心区别在于<strong>答案空间</strong>：抽取任务的答案来自原文、半开放（找不到就是 null）；分类任务的答案空间<strong>有限且预先确定</strong>，模型必须从一个固定的标签集合里选一个，没有&quot;部分正确&quot;的中间状态。</p><p>具体展开来看几个维度的差异：在答案空间上，抽取任务是半开放的，答案来自原文中的值；分类任务的答案空间则有限且预定义。在 Prompt 核心内容上，抽取任务要描述&quot;字段&quot;（字段名、类型、示例），分类任务要描述&quot;标签集合&quot;（每个标签的定义 + 边界示例）。在核心约束手段上，抽取任务依赖 JSON Schema + Pydantic，分类任务则用 <code>enum</code>。在评估方式上，抽取任务只能看字段级别对错，分类任务则可以用准确率、混淆矩阵这类客观可量化的指标。</p><p>因此分类任务的 Prompt 不需要像抽取那样描述字段类型，而要把精力放在<strong>把每个标签的定义写清楚</strong>——标签名对人类含义明确，但对模型来说只是一个字符串，必须靠清晰定义 + 边界案例示例才能让模型判断标准和人工标注对齐。</p>"},{"qnum":2,"qtext":"一个好的标签集合应该满足哪些设计原则？","answerHtml":"<p>设计原则大概有四条。第一是互斥，也就是 Mutually Exclusive，每条数据理想情况下只应该明确属于一个类别，类别定义之间不应该相互重叠；第二是完备，也就是 Collectively Exhaustive，标签集合要覆盖绝大多数真实数据，还要预留一个&quot;其他&quot;兜底类别，不强迫模型硬选；第三是定义清晰，每个标签要配一句话的定义，再加上 1-2 个边界示例，而不是只给一个词；第四是数量适中，通常控制在 3-15 类，类别太多的话模型在长列表里选择的准确率会明显下降，这种情况可以考虑先分大类再细分，也就是两级分类。</p><p>其中&quot;完备性&quot;最容易被忽视：如果标签集合里没有&quot;其他&quot;这样的兜底选项，模型遇到模糊或不相关的数据时会被迫&quot;矬子里拔将军&quot;，硬选一个不合适的标签，污染统计结果。</p>"},{"qnum":3,"qtext":"为什么用 enum 而不是普通字符串字段约束分类标签？单标签和多标签分类的实现有什么不同？","answerHtml":"<p>用 Python 原生 <code>Enum</code> 类型（配合 Pydantic）而不是普通字符串 + 手写 <code>if value not in [...]</code> 校验，好处是<strong>类型系统本身就是校验规则</strong>：</p><pre><code class=\"language-python\">class FeedbackCategory(str, Enum):\n    CONSULT = &quot;咨询&quot;\n    COMPLAINT = &quot;投诉&quot;\n    OTHER = &quot;其他&quot;\n\nclass ClassificationResult(BaseModel):\n    category: FeedbackCategory   # 值不在枚举范围内，Pydantic 直接抛 ValidationError</code></pre><p><code>model_json_schema()</code> 会自动把 <code>Enum</code> 转成 JSON Schema 的 <code>enum</code> 约束，Schema 定义和校验逻辑共用同一份代码，不会出现&quot;文档写了 5 个类别、代码只校验了 4 个&quot;的不一致。</p><p>单标签和多标签的实现差异：</p><pre><code class=\"language-python\"># 单标签：一条数据只能属于一个类别\nclass SingleLabelResult(BaseModel):\n    category: FeedbackCategory\n\n# 多标签：一条数据可以同时属于多个类别\nclass MultiLabelResult(BaseModel):\n    categories: list[FeedbackCategory]</code></pre><p>Prompt 措辞也要相应调整（&quot;选择最符合的一个类别&quot; vs &quot;选择所有符合的类别，可以是多个&quot;），如果 Prompt 里没写清楚是单选还是多选，模型的输出形态（单个字符串 vs 列表）会不稳定。</p>"},{"qnum":4,"qtext":"为什么不能盲目相信 LLM 单次调用给出的分类结果？如何用 Self-Consistency 估计置信度？","answerHtml":"<p>传统机器学习分类器的 <code>predict_proba()</code> 天然带置信度（如&quot;投诉 0.55，故障 0.40&quot;），但 LLM 单次调用只返回一个确定的字符串 <code>{&quot;category&quot;: &quot;投诉&quot;}</code>——即使这条数据本身很模糊，模型也会给出一个看起来&quot;言之凿凿&quot;的答案，看不出模型内部其实&quot;很纠结&quot;。</p><p><strong>Self-Consistency</strong> 思路：对同一条数据用较高的 <code>temperature</code>（引入随机性）多次调用，统计结果的一致程度作为置信度的近似：</p><pre><code class=\"language-python\">def classify_with_confidence(text: str, n_samples: int = 5) -&gt; dict:\n    votes = []\n    for _ in range(n_samples):\n        response = client.chat.completions.create(\n            model=&quot;deepseek-chat&quot;,\n            messages=[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: build_classify_prompt(text)}],\n            temperature=0.7,   # 需要一定随机性，否则每次结果相同，失去统计意义\n            response_format={&quot;type&quot;: &quot;json_object&quot;},\n        )\n        votes.append(json.loads(response.choices[0].message.content).get(&quot;category&quot;))\n\n    counter = Counter(votes)\n    top_category, top_count = counter.most_common(1)[0]\n    return {&quot;category&quot;: top_category, &quot;confidence&quot;: top_count / n_samples}</code></pre><p>置信度低（如 &lt; 0.6）的记录应标记为&quot;待人工复核&quot;而不是直接采信。代价是调用次数乘以 <code>n_samples</code>，通常只对少量关键数据或抽样质检使用，不建议全量跑。</p>"},{"qnum":5,"qtext":"如何从零设计一个可评估准确率、支持批量运行的文本分类器？从零描述你的思路。","answerHtml":"<p>核心设计原则：<strong>enum 锁定标签集合 + 强类型校验兜底 + 分布统计 + 人工基准评估准确率</strong>。</p><pre><code class=\"language-python\">class FeedbackCategory(str, Enum):\n    CONSULT = &quot;咨询&quot;; COMPLAINT = &quot;投诉&quot;; SUGGESTION = &quot;建议&quot;; FAULT = &quot;故障&quot;; OTHER = &quot;其他&quot;\n\nclass ClassificationResult(BaseModel):\n    category: FeedbackCategory\n\ndef classify_structured(text: str, max_retries: int = 2) -&gt; ClassificationResult:\n    prompt = build_classify_prompt(text)   # 含每个类别的一句话定义\n    for _ in range(max_retries):\n        raw = call_llm(prompt, temperature=0.0, response_format=json_object)\n        try:\n            return ClassificationResult(**json.loads(raw))\n        except (json.JSONDecodeError, ValidationError):\n            continue\n    return ClassificationResult(category=FeedbackCategory.OTHER)   # 重试耗尽兜底为&quot;其他&quot;\n\ndef batch_classify(texts: list[str]) -&gt; dict:\n    results = [classify_structured(t) for t in texts]\n    distribution = Counter(r.category.value for r in results)\n    return {&quot;results&quot;: list(zip(texts, results)), &quot;distribution&quot;: dict(distribution)}\n\ndef evaluate_accuracy(texts: list[str], ground_truth: list[str]) -&gt; dict:\n    predictions = [classify_structured(t).category.value for t in texts]\n    accuracy = sum(p == g for p, g in zip(predictions, ground_truth)) / len(texts)\n    confusion = Counter(zip(ground_truth, predictions))   # 定位模型最容易混淆的类别对\n    return {&quot;accuracy&quot;: accuracy, &quot;confusion&quot;: dict(confusion)}</code></pre><p>设计要点：</p><ul><li><code>Enum</code> + Pydantic 让&quot;标签值是否合法&quot;这件事由类型系统保证，不需要额外写归一化逻辑</li><li><code>classify_structured</code> 复用 Day 9 的重试思路，重试耗尽后兜底为&quot;其他&quot;而不是让程序崩溃</li><li><code>batch_classify</code> 的类别分布统计是分类任务特有的产出，能直接回答&quot;这批数据里投诉占比多少&quot;这类业务问题</li><li><code>evaluate_accuracy</code> 用小样本人工标注做基准，混淆矩阵能定位&quot;哪两个类别定义不够清晰&quot;，指导下一轮 Prompt 优化</li></ul>"}]},{"name":"Prompt 优化","questions":[{"qnum":1,"qtext":"Prompt 优化的四类手段分别解决什么问题？","answerHtml":"<p>Prompt 优化的四类手段分别解决不同层面的歧义问题。第一类是角色设定，也就是 Role Setting，解决的是&quot;用什么标准或视角判断&quot;这个歧义，适用场景是主观性强、依赖领域经验的任务，比如让&quot;资深客服主管&quot;来判断工单优先级。第二类是目标声明，即 Explicit Objective，解决的是&quot;要做什么&quot;这个歧义，适用场景是任务本身容易有多种理解方式，需要明确排除&quot;顺便做别的&quot;。第三类是 Few-shot 示例，解决的是&quot;边界案例怎么判断&quot;这个歧义，适用场景是判断规则难以用文字穷举、靠类比而非规则更准确的场景。第四类是输出限制，即 Output Constraints，解决的是&quot;结果长什么样&quot;这个歧义，适用场景是所有需要程序解析输出的场景，比如格式、长度、取值范围的约束。</p><p>四者不互斥，一个成熟的生产级 Prompt 通常同时用到全部四种；先写清楚的文字规则覆盖大多数情况，再用 Few-shot 补充规则难以描述的边界案例，是效果和成本的较优平衡点。</p>"},{"qnum":2,"qtext":"为什么说 Prompt 优化的本质是\"消除歧义\"而不是\"讨好模型\"？","answerHtml":"<p>很多人优化 Prompt 的第一反应是堆砌形容词（&quot;你是全宇宙最专业的专家，请务必认真思考&quot;），但这类&quot;魔法词&quot;效果有限——模型没有&quot;偷懒&quot;这个状态，堆砌形容词不会让它更努力思考。</p><p>真正影响输出质量的，是<strong>任务本身有没有被讲清楚</strong>：</p><pre><code>模糊：&quot;请务必认真仔细地分析这条反馈&quot;\n清晰：&quot;紧急程度判断标准：涉及资金损失或安全问题 = 5，影响使用但有替代方案 = 3，纯咨询 = 1&quot;</code></pre><p>四类优化手段（角色设定、目标声明、Few-shot、输出限制）本质上都是把原本模糊、依赖常识和经验的判断标准，用文字显式表达出来，让模型有明确依据可以对齐——这是&quot;消除歧义&quot;，而不是&quot;讨好&quot;或&quot;激励&quot;模型。</p>"},{"qnum":3,"qtext":"准确率和稳定性是一回事吗？如何分别量化这两个指标？","answerHtml":"<p>不是一回事，两者是独立的评估维度：准确率（Accuracy）指的是模型输出和人工标注正确答案的一致程度，衡量方式是&quot;多数投票结果 == expected&quot;的比例；稳定性（Stability）指的是同一条输入多次调用，结果是否一致，衡量方式是多次运行结果完全相同的比例。</p><p>一个 Prompt 可能&quot;稳定地错&quot;（每次调用结果一样，但都是错的，说明判断标准本身有偏差）；也可能&quot;偶尔蒙对&quot;（多次结果不一致，但多数投票恰好正确，说明单次调用不可靠）。量化方法：</p><pre><code class=\"language-python\">def evaluate_prompt(prompt_fn, test_set, n_runs=3):\n    for item in test_set:\n        runs = [call_llm(prompt_fn(item[&quot;text&quot;])) for _ in range(n_runs)]\n        most_common = max(set(runs), key=runs.count)\n        is_stable = len(set(runs)) == 1        # 稳定性：多次结果是否完全一致\n        is_correct = most_common == item[&quot;expected&quot;]   # 准确率：多数投票是否正确</code></pre><p>两者按&quot;稳定性 × 准确率&quot;划成四象限：高稳定+高准确是理想状态可直接上线；高稳定+低准确说明判断标准本身有偏差需要重新设计规则；低稳定则无论准确率高低都不可靠，需要提高约束强度。</p>"},{"qnum":4,"qtext":"如何判断一次 Prompt \"优化\"是真的提升了效果，还是恰好在测试集上蒙对了？","answerHtml":"<p>陷阱场景：用几条固定的测试数据反复调整 Prompt，直到这几条全部命中就认为优化成功——但这些数据的措辞、边界情况很可能被&quot;针对性&quot;覆盖了，换一批新数据准确率可能骤降，这叫<strong>对测试集过拟合</strong>。</p><p>正确做法：</p><ul><li>测试集要有一定规模（至少 15-20 条）且覆盖不同难度</li><li>把数据划分为<strong>开发集</strong>（迭代 Prompt 时反复使用）和<strong>留出集</strong>（从不参与调优，只在 Prompt 定稿后跑一次）</li><li>对比开发集和留出集的表现：如果留出集准确率明显低于开发集（比如开发集 90%、留出集 60%），说明前面的&quot;优化&quot;很可能只是针对开发集几条数据的措辞做了过度适配，而不是抓住了任务的通用判断标准</li></ul><pre><code class=\"language-python\">DEV_SET = TEST_SET[:5]      # 迭代阶段只看这部分\nHOLDOUT_SET = TEST_SET[5:]  # 定稿后只跑一次，代表真实预期表现</code></pre>"},{"qnum":5,"qtext":"如何从零设计一套可复现的 Prompt 版本对比实验？","answerHtml":"<p>核心设计原则：<strong>递进式版本设计（便于归因）+ 双维度量化（准确率、稳定性）+ 开发集/留出集分离（防止过拟合）</strong>。</p><pre><code class=\"language-python\">def prompt_v1(text):   # 对照组：只有目标声明 + 输出限制\n    return f&quot;判断...紧急程度，只输出 JSON：{{\\&quot;urgency\\&quot;: &lt;整数&gt;}}\\n\\n{text}&quot;\n\ndef prompt_v2(text):   # 在 V1 基础上加角色设定 + 文字判断标准\n    return &quot;你是...客服主管。判断标准：5分=...\\n\\n&quot; + prompt_v1(text)\n\ndef prompt_v3(text):   # 在 V2 基础上加 Few-shot 示例\n    return prompt_v2(text).replace(&quot;只输出 JSON&quot;, &quot;示例：...\\n\\n只输出 JSON&quot;)\n\ndef evaluate_prompt(prompt_fn, test_set, n_runs=3):\n    results = []\n    for item in test_set:\n        runs = [run_prompt(prompt_fn, item[&quot;text&quot;]) for _ in range(n_runs)]\n        most_common = max(set(runs), key=runs.count)\n        results.append({&quot;stable&quot;: len(set(runs)) == 1, &quot;correct&quot;: most_common == item[&quot;expected&quot;]})\n    accuracy = sum(r[&quot;correct&quot;] for r in results) / len(results)\n    stability = sum(r[&quot;stable&quot;] for r in results) / len(results)\n    return {&quot;accuracy&quot;: accuracy, &quot;stability&quot;: stability}\n\ndef compare_prompts(prompts: dict, test_set, n_runs=3):\n    for name, fn in prompts.items():\n        result = evaluate_prompt(fn, test_set, n_runs)\n        print(f&quot;{name}：准确率 {result['accuracy']:.0%}，稳定性 {result['stability']:.0%}&quot;)\n\n# 迭代阶段：只在开发集上对比三版\ncompare_prompts({&quot;V1&quot;: prompt_v1, &quot;V2&quot;: prompt_v2, &quot;V3&quot;: prompt_v3}, DEV_SET)\n# 定稿阶段：留出集只跑一次，验证真实表现\nfinal = evaluate_prompt(prompt_v3, HOLDOUT_SET, n_runs=3)</code></pre><p>设计要点：</p><ul><li>V1→V2→V3 递进式设计，每次只新增一类优化手段，能精确归因&quot;这一提升是哪类手段带来的&quot;</li><li>每条数据跑 <code>n_runs</code> 次，同时计算准确率（vs 人工标注）和稳定性（结果一致性），而不是只看&quot;看起来对不对&quot;</li><li>开发集和留出集严格分离，留出集只在版本定稿后跑一次，避免&quot;优化&quot;实际上是过拟合了测试数据</li><li>实验结论可复现——换一批新的测试数据、换一个人跑这套代码，得到的对比结论应该是一致的</li></ul>"}]},{"name":"建立成本意识","questions":[{"qnum":1,"qtext":"长输入短输出和短输入长输出两类任务，成本优化的着力点分别是什么？","answerHtml":"<p>判断依据是拆开看 <code>usage.prompt_tokens</code> 和 <code>usage.completion_tokens</code> 谁占大头，而不是只看 <code>total_tokens</code>。</p><p>长输入 + 短输出的场景，比如文档问答、长文摘要，成本主要由输入 Token 决定，优化方向是减少输入：更精细的文档切分、只喂检索到的相关片段、精简历史。短输入 + 长输出的场景，比如代码生成、长文写作，成本主要由输出 Token（单价通常更高）决定，优化方向是约束输出长度、拆分任务分步生成、避免模型&quot;自由发挥&quot;。长输入 + 长输出的场景，比如带大量历史的多轮技术讨论，输入和输出两者的成本都重要，需要两头同时控制，是成本最容易失控的场景。</p><p>两种场景优化方向完全不同：给&quot;长输入短输出&quot;任务加 <code>max_tokens</code> 限制收效有限（成本大头在输入），给&quot;短输入长输出&quot;任务优化历史截断也收效有限（本来就没有多轮历史）——先定位大头，再对症优化。</p>"},{"qnum":2,"qtext":"如何从零设计一个用于统计和记录大模型调用成本的工具？","answerHtml":"<p>核心思路：<strong>每次调用后立即从 <code>response.usage</code> 取真实计费数字，用结构化对象记录，而不是事后凭印象估算</strong>。</p><pre><code class=\"language-python\">from dataclasses import dataclass, field\n\nPRICING = {\n    &quot;deepseek-chat&quot;: {&quot;input_per_million&quot;: 1.0, &quot;output_per_million&quot;: 2.0},\n}\n\n@dataclass\nclass CostRecord:\n    label: str\n    model: str\n    input_tokens: int\n    output_tokens: int\n    cost: float = field(init=False)\n\n    def __post_init__(self):\n        price = PRICING[self.model]\n        self.cost = (\n            self.input_tokens * price[&quot;input_per_million&quot;] / 1_000_000\n            + self.output_tokens * price[&quot;output_per_million&quot;] / 1_000_000\n        )\n\n\ndef call_and_record(label, messages, model=&quot;deepseek-chat&quot;):\n    response = client.chat.completions.create(model=model, messages=messages)\n    usage = response.usage\n    return CostRecord(label, model, usage.prompt_tokens, usage.completion_tokens)</code></pre
