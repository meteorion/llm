><p>设计要点：</p><ul><li><strong>永远以 <code>usage</code> 字段为准</strong>，不用字符数或 <code>tiktoken</code> 本地估算替代真实计费（本地估算只适合&quot;下单前&quot;的粗略预判）</li><li>用 <code>dataclass</code> 把&quot;一次调用的成本&quot;变成结构化记录，而不是散落的变量，方便后续批量汇总、写入 CSV 或接入监控看板</li><li>价格表（<code>PRICING</code>）单独维护，模型换代或平台调价时只改一处</li><li>汇总时按&quot;请求类型&quot;分组统计，能直接回答&quot;哪类功能最烧钱&quot;这种业务问题，而不是只有一个笼统的总花费数字</li></ul>"},{"qnum":3,"qtext":"如何量化评估一次 Prompt 优化在\"效果提升\"和\"成本增加\"之间是否划算？","answerHtml":"<p>核心思路：把&quot;额外付出的 Token&quot;和&quot;换来的效果提升&quot;做比值，而不是只看效果单方面变好了就认为优化成功。</p><pre><code class=\"language-python\">def cost_per_accuracy_point(extra_tokens: int, accuracy_gain_pp: float) -&gt; float:\n    &quot;&quot;&quot;每提升 1 个百分点准确率需要额外付出多少 Token，数值越小性价比越高&quot;&quot;&quot;\n    return extra_tokens / accuracy_gain_pp if accuracy_gain_pp &gt; 0 else float(&quot;inf&quot;)</code></pre><p>以 Day 11 的 V1→V2→V3 实验为例：V1→V2 增加 80 Token 换来 40 个百分点准确率提升（2.0 Token/pp），V2→V3 增加 100 Token 只换来 20 个百分点提升（5.0 Token/pp）——V1→V2 这一步性价比明显更高。</p><p><strong>关键判断标准不是&quot;哪个版本准确率最高&quot;，而是&quot;这个任务出错的业务代价有多大&quot;</strong>：</p><ul><li>如果是成本敏感、容错率较高的场景（如粗筛工单优先级），可能停在性价比更高的 V2 就够了</li><li>如果是错误代价很高的场景（如涉及资金损失的紧急程度判断），V3 那部分性价比更低的额外提升仍然值得付出</li></ul><p>这也是&quot;效果优化&quot;和&quot;成本优化&quot;两条主线在 Day 11、Day 12 交汇的地方：Day 11 只回答&quot;哪个 Prompt 更准&quot;，Day 12 补上&quot;为了更准，多花的钱划不划算&quot;，两者合起来才是完整的工程决策。</p>"}]},{"name":"配置管理和日志","questions":[{"qnum":1,"qtext":"为什么 API Key 不能硬编码在代码中？`.env` + `.gitignore` 方案是如何配合使用的？","answerHtml":"<p>硬编码密钥的风险链条是：代码提交到 Git → 仓库成员可见（哪怕是私有仓库）→ 一旦 push 到公开仓库，GitHub 等平台秒级扫描发现密钥 → Key 被吊销或盗用。这不是&quot;只要小心就能避免&quot;的问题——依赖人的自律不如用机制来保障。</p><p><code>.env</code> + <code>.gitignore</code> 方案的分工很清晰：<code>.env</code> 文件保存真实的 Key 和本地配置值，属于<strong>不提交</strong>的文件（在 <code>.gitignore</code> 中排除）；<code>.env.example</code> 文件只保存变量名和占位符说明，属于<strong>需要提交</strong>的文件（供团队参考应该设哪些变量）。</p><pre><code class=\"language-dotenv\"># .env（不提交）\nDEEPSEEK_API_KEY=sk-your-actual-key\n\n# .env.example（提交）\nDEEPSEEK_API_KEY=sk-your-key-here</code></pre><pre><code class=\"language-python\">from dotenv import load_dotenv\nimport os\n\nload_dotenv()\napi_key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;)\nif not api_key:\n    raise ValueError(&quot;DEEPSEEK_API_KEY 未设置，请在 .env 文件中配置&quot;)</code></pre><p><code>load_dotenv()</code> 的关键行为：环境变量已存在时默认不覆盖，CI/CD 注入的密钥优先级自然高于 <code>.env</code> 文件——这正是&quot;命令行/环境变量 &gt; .env 文件&quot;优先级的机制实现。</p>"},{"qnum":2,"qtext":"配置的三种来源（命令行参数、环境变量、.env 文件）优先级如何排序？为什么这样设计？","answerHtml":"<p>优先级从高到低：<strong>命令行参数 &gt; 环境变量 &gt; .env 文件 &gt; 代码默认值</strong>。命令行参数优先级最高，典型用途是临时覆盖——调试时一次性切换模型；环境变量优先级次之，典型用途是 CI/CD 注入密钥，不同机器/环境设不同值；<code>.env</code> 文件优先级居中，典型用途是本地开发默认配置，每人一份不互相干扰；代码默认值优先级最低，典型用途是非必填项的合理兜底，方便快速启动。</p><p><strong>设计原因</strong>：越&quot;临时&quot;的来源优先级越高——命令行参数是单次运行时的临时覆盖，不应该被持久化的 <code>.env</code> 文件覆盖；环境变量是运维/CI 在部署时注入的&quot;正式值&quot;，同样不应被开发者的本地 <code>.env</code> 覆盖；代码默认值只是&quot;写了比没写好&quot;的最低保障，任何外部配置都应该覆盖它。这种设计让同一份代码在开发、测试、生产三个环境中，只需改配置来源而无需改代码。</p>"},{"qnum":3,"qtext":"Python `logging` 的五个级别分别适合哪些场景？为什么建议用 `logging` 而不是 `print`？","answerHtml":"<p>Python logging 一共有五个级别，级别从低到高分别对应不同的使用场景。第一个是 DEBUG，数值是 10，在 LLM 项目里典型用途是打印完整的 messages 列表、原始 API 响应，这个一般开发时用，生产环境要关掉。第二个是 INFO，数值 20，典型用途是记录程序启动信息、每次 API 调用完成时的耗时和 Token 数。第三个是 WARNING，数值 30，典型用途是触发重试、输出被 max_tokens 截断、请求临近限速这类情况。第四个是 ERROR，数值 40，典型用途是 JSON 解析失败、API 调用失败但程序还能继续运行的场景。最后是 CRITICAL，数值 50，典型用途是 API Key 无效这种程序完全无法继续的灾难性错误。</p><p><strong>为什么不用 <code>print</code></strong>：其实从几个能力点上一比就很清楚。第一，区分严重程度这件事上，<code>print</code> 根本没有这个概念，而 <code>logging</code> 有五个级别可以用。第二，运行时过滤上，<code>print</code> 想关掉日志只能去注释代码，<code>logging</code> 用 <code>setLevel()</code> 一行代码就能切换。第三，自动时间戳，<code>print</code> 没有，<code>logging</code> 是自带的。第四，写入文件，<code>print</code> 得自己手动重定向，<code>logging</code> 只要加一个 <code>FileHandler</code> 就行。最后是性能这块，尤其是日志被过滤掉的时候差别很大：<code>print</code> 用的 <code>f-string</code> 不管有没有用到，都会先把字符串拼接计算出来；而 <code>logging</code> 用 <code>%s</code> 这种占位符格式化，只要这条日志被过滤掉，根本不会去执行字符串拼接。</p><p>实践细节：<code>logger.debug(&quot;msg: %s&quot;, obj)</code> 而不是 <code>logger.debug(f&quot;msg: {obj}&quot;)</code>——后者无论日志级别是否过滤都会先执行字符串拼接，前者在 DEBUG 被过滤时完全不计算，大对象场景下性能差异明显。</p>"},{"qnum":4,"qtext":"给 LLM 项目的 API 调用加日志，应该记录哪些关键信息？","answerHtml":"<p>最小有效日志集合：<strong>请求标识 + 耗时 + Token 消耗</strong>——这三个数字回答了排查时最常见的三个问题（这是哪个请求？为什么慢？钱花在哪了？）：</p><pre><code class=\"language-python\">import time, logging\n\nlogger = logging.getLogger(__name__)\n\ndef call_with_logging(client, messages, model, label=&quot;&quot;):\n    start = time.monotonic()\n    try:\n        response = client.chat.completions.create(model=model, messages=messages)\n        elapsed = time.monotonic() - start\n        usage = response.usage\n        logger.info(\n            &quot;[%s] 完成 | 耗时 %.2fs | 输入 %d Token | 输出 %d Token&quot;,\n            label or model, elapsed, usage.prompt_tokens, usage.completion_tokens,\n        )\n        return response\n    except Exception as e:\n        elapsed = time.monotonic() - start\n        logger.error(&quot;[%s] 失败 | 耗时 %.2fs | %s&quot;, label or model, elapsed, e)\n        raise</code></pre><p><strong>启动日志单独处理</strong>：程序启动时打印一次当前生效的配置（模型名、API Key 前 8 位、超时等），让运维在日志文件里就能确认&quot;这次跑的是哪个配置&quot;，而不需要登录机器查看 <code>.env</code> 文件：</p><pre><code class=\"language-python\">logger.info(&quot;模型：%s | Key：%s... | 超时：%ds&quot;, model, api_key[:8], timeout)</code></pre><p><strong>打印 API Key 前 8 位而非完整值</strong>：能区分&quot;用的是哪个 Key&quot;但不泄露完整密钥，是&quot;可调试性&quot;和&quot;安全性&quot;之间的标准折中。</p>"},{"qnum":5,"qtext":"如何从零设计一个\"配置 + 日志 + 重试\"三合一的可维护 LLM 客户端？","answerHtml":"<p>核心设计原则：<strong>配置对象化（可测试） + 日志结构化（可追溯） + 重试分级（可重试 vs 不可重试）</strong>。</p><pre><code class=\"language-python\">import os, time, logging, sys\nfrom dataclasses import dataclass\nfrom openai import OpenAI, APIStatusError, APIConnectionError, RateLimitError\nfrom dotenv import load_dotenv\n\nload_dotenv()\n\n@dataclass\nclass AppConfig:\n    api_key: str\n    model_name: str\n    base_url: str\n    max_retries: int\n    request_timeout: int\n\n    @classmethod\n    def from_env(cls) -&gt; &quot;AppConfig&quot;:\n        key = os.getenv(&quot;DEEPSEEK_API_KEY&quot;, &quot;&quot;)\n        if not key:\n            raise ValueError(&quot;DEEPSEEK_API_KEY 未设置&quot;)\n        return cls(\n            api_key=key,\n            model_name=os.getenv(&quot;MODEL_NAME&quot;, &quot;deepseek-chat&quot;),\n            base_url=os.getenv(&quot;BASE_URL&quot;, &quot;https://api.deepseek.com/v1&quot;),\n            max_retries=int(os.getenv(&quot;MAX_RETRIES&quot;, &quot;3&quot;)),\n            request_timeout=int(os.getenv(&quot;REQUEST_TIMEOUT&quot;, &quot;30&quot;)),\n        )\n\nlogging.basicConfig(\n    level=logging.INFO,\n    format=&quot;%(asctime)s  %(levelname)-8s  %(name)s  %(message)s&quot;,\n    handlers=[logging.StreamHandler(sys.stdout)],\n)\nlogger = logging.getLogger(__name__)\n\nclass LLMClient:\n    def __init__(self, config: AppConfig):\n        self.config = config\n        self.client = OpenAI(api_key=config.api_key, base_url=config.base_url)\n        logger.info(&quot;初始化 | 模型：%s | Key：%s...&quot;, config.model_name, config.api_key[:8])\n\n    def chat(self, messages: list, label: str = &quot;&quot;) -&gt; str:\n        for attempt in range(1, self.config.max_retries + 1):\n            start = time.monotonic()\n            try:\n                resp = self.client.chat.completions.create(\n                    model=self.config.model_name, messages=messages,\n                    timeout=self.config.request_timeout,\n                )\n                elapsed = time.monotonic() - start\n                usage = resp.usage\n                logger.info(&quot;[%s] 完成 | %.2fs | 输入 %d | 输出 %d Token&quot;,\n                            label, elapsed, usage.prompt_tokens, usage.completion_tokens)\n                return resp.choices[0].message.content\n            except RateLimitError:\n                wait = 2 ** attempt\n                logger.warning(&quot;限速，%ds 后重试 (%d/%d)&quot;, wait, attempt, self.config.max_retries)\n                time.sleep(wait)\n            except APIConnectionError as e:\n                logger.warning(&quot;连接失败，重试 (%d/%d)：%s&quot;, attempt, self.config.max_retries, e)\n                time.sleep(1)\n            except APIStatusError as e:\n                if e.status_code in (400, 401, 403):\n                    logger.error(&quot;不可重试错误 %d：%s&quot;, e.status_code, e.message)\n                    raise\n                logger.warning(&quot;服务器错误 %d，重试 (%d/%d)&quot;, e.status_code, attempt, self.config.max_retries)\n                time.sleep(2)\n        raise RuntimeError(f&quot;达到最大重试次数 {self.config.max_retries}&quot;)</code></pre><p>三层设计要点：</p><ul><li><strong>配置层</strong>：<code>AppConfig.from_env()</code> 集中读取和校验，测试时可直接 <code>AppConfig(api_key=&quot;test&quot;, ...)</code> 构造，不依赖真实环境变量</li><li><strong>日志层</strong>：INFO 记录正常里程碑（耗时/Token），WARNING 记录临时性问题（重试），ERROR 记录不可恢复错误——级别清晰，生产环境用 <code>LOG_LEVEL=WARNING</code> 屏蔽噪音</li><li><strong>重试层</strong>：区分&quot;可重试&quot;（限速/网络/5xx）和&quot;不可重试&quot;（401/400）——不区分地无脑重试会浪费时间，直接 raise 让调用方知道是不可恢复的错误</li></ul>"}]},{"name":"第 2 周综合复盘","questions":[{"qnum":1,"qtext":"第 2 周（Day 8–13）六个主题之间是什么逻辑关系？为什么要按这个顺序学？","answerHtml":"<p>第 2 周的六个主题其实是同一个命题的六个层面——如何让 LLM 应用从&quot;能跑&quot;变成&quot;可信赖、可迭代、可量化、可维护&quot;，六个主题之间是一条递进依赖的学习链。第一步是 Day 8 的结构化输出，解决的是输出格式不可控的问题，它依赖 Day 6 打下的 JSON 约束基础。第二步是 Day 9 的输出校验与异常处理，解决的是校验失败时程序崩溃的问题，依赖 Day 8 定义好的 Pydantic 模型。第三步是 Day 10 的文本分类器，这是一个新的任务类型，也就是封闭集输出，依赖前面 Day 8、Day 9 的结构化和校验能力。第四步是 Day 11 的 Prompt 优化，解决的是效果评估没有量化框架的问题，依赖 Day 10 建立的多次采样实验方法。第五步是 Day 12 的成本意识，解决的是 Prompt 优化只看效果不看代价的问题，依赖 Day 11 积累的版本对比数据。第六步是 Day 13 的配置与日志，解决的是成本和性能指标没有留存机制的问题，依赖 Day 12 记录下来的 Token 数据。</p><p><strong>不能乱序的原因</strong>：Day 9 的重试依赖 Day 8 定义的 Pydantic 模型（校验失败才触发重试）；Day 11 的稳定性评估依赖 Day 10 的多次采样结构；Day 12 的成本权衡依赖 Day 11 的准确率数据；Day 13 的 logging 把 Day 12 的成本数字持久化。每一步都在上一步产出的基础上加一层工程保障。</p>"},{"qnum":2,"qtext":"什么样的 Prompt 才算\"稳定\"？如何量化评估稳定性？","answerHtml":"<p>技术定义：同一条输入多次调用（通常 3 次），结果完全一致的比例高。稳定性 &lt; 70% 的 Prompt 不应上生产。</p><p>不稳定通常可以归结为四类根因，每一类都有对应的修复方式。第一类是任务目标模糊，表现为每次返回的格式或维度都不一样，修复方式是在 Prompt 里明确说清楚&quot;只输出 JSON，字段为 X&quot;。第二类是值域未锁定，表现为标签值随机变化，修复方式是用 enum 类型加上 Pydantic 强制校验。第三类是边界案例未覆盖，表现为特殊输入的结果飘忽不定，修复方式是用 Few-shot 展示边界案例该怎么处理。第四类是 Temperature 过高，表现为结构化任务依然存在随机性，修复方式是结构化任务一律把 temperature 设成 0。</p><pre><code class=\"language-python\">def stability_score(prompt_fn, test_set: list[str], n_runs: int = 3) -&gt; float:\n    stable = 0\n    for text in test_set:\n        runs = [call_llm(prompt_fn(text)) for _ in range(n_runs)]\n        if len(set(runs)) == 1:\n            stable += 1\n    return stable / len(test_set)</code></pre><p><strong>稳定性和准确率的关系</strong>：两者独立，必须分开评估。一个 Prompt 可以&quot;稳定地错&quot;（每次输出相同的错误结果），也可以&quot;偶尔蒙对&quot;（结果不一致但多数投票正确）——两者都不是好 Prompt。理想状态是稳定性 ≥ 80% 且准确率达到业务要求。</p>"},{"qnum":3,"qtext":"为什么说输出校验比\"提示模型要小心\"更可靠？这体现了什么工程原则？","answerHtml":"<p>&quot;提示模型小心&quot;是依赖 LLM 的输出自律，&quot;校验&quot;是在代码层建立检查点——两种方式的本质差距类似于&quot;提醒开发者别提交密钥&quot;和&quot;用 <code>.gitignore</code> 阻止提交&quot;：前者依赖人的记忆，后者用机制保障。</p><p>从四个维度对比就能看出差距：失败时的行为上，依赖提示是随机、不可预测的，代码层校验则是确定性地抛出异常；失败的可发现性上，依赖提示可能悄悄带着错误数据继续运行，代码层校验会立即捕获、不让错误流入下游；补救手段上，依赖提示没有补救手段（已经继续运行了），代码层校验则有重试 → 兜底 → 三态结果这一整套机制；随时间的稳定性上，依赖提示会随模型版本更新而波动，代码层校验只要代码逻辑不变，行为就是稳定的。</p><p><strong>体现的工程原则</strong>：&quot;能用机制保证的事情，不依赖人（或模型）的自律&quot;。校验层的意义不是&quot;LLM 会出错所以不信任它&quot;，而是&quot;任何外部输入（包括 LLM 输出）都应该在进入业务逻辑前经过验证&quot;——这和验证用户输入、验证第三方 API 响应是完全相同的工程理念。</p>"},{"qnum":4,"qtext":"为什么日志和配置管理要在 Demo 阶段就引入，而不是等项目变大再补？","answerHtml":"<p><strong>配置管理的债务是复利</strong>：从第 1 个硬编码密钥到第 10 个，改造成本是线性增长的；但一旦发生泄露，代价是非线性的。更重要的是，改造时机越晚，&quot;顺便用原来的方式就好了&quot;的惯性越强，技术债越难偿还。</p><pre><code>最佳引入时机：第一次写 client = OpenAI(api_key=&quot;...&quot;) 时\n此时成本：创建 .env，写 AppConfig.from_env() — 10 分钟\n此后收益：所有脚本共享配置，改一处生效全部，且永远不会意外提交密钥</code></pre><p><strong>日志的价值在出问题时才体现</strong>：用 <code>print()</code> 的项目出了问题必须在本地复现，而 <code>logging</code> 的项目看日志文件就能定位。问题总是在最不方便的时候（线上、压力下）发生，此时才意识到没有日志为时已晚。</p><pre><code>print() 的调试困境：\n  &quot;上周五线上那次报错，输入是什么？输出了什么？耗时多少？&quot;\n  → 不知道，需要复现 → 复现不稳定 → 浪费大量时间\n\nlogging 的排查流程：\n  &quot;上周五线上那次报错，查日志&quot; → 有时间戳、输入摘要、错误类型、Token 数\n  → 5 分钟定位问题</code></pre><p><strong>最佳实践</strong>：把 <code>setup_logging()</code> 和 <code>AppConfig.from_env()</code> 写进项目模板，新建任何 LLM 脚本时第一件事就是复制这两行——让好习惯的执行成本趋近于零。</p>"},{"qnum":5,"qtext":"如果让你从零搭建一个\"第 2 周成果汇总\"工程骨架，你会如何设计它的模块结构？","answerHtml":"<p>核心设计原则：<strong>单一职责 + 配置集中 + 功能正交（各模块可独立调用）</strong>。</p><pre><code>week2_toolkit/\n├── config.py          # AppConfig dataclass + from_env() + setup_logging()\n├── client.py          # LLMClient（重试 + 日志 + 成本记录），依赖 config.py\n├── prompt_templates.py# 抽取/分类/摘要三类 Prompt 构建函数，纯函数，无副作用\n├── schemas.py         # Pydantic 模型定义（ResumeInfo, ClassificationResult 等）\n└── main.py            # 演示入口，串联以上四个模块</code></pre><p>各模块的职责边界划分得很清楚。config.py 负责读取和校验配置、初始化 logging，但不包含 API 调用逻辑。client.py 负责封装 API 调用，包括重试、日志和成本记录，但不包含 Prompt 模板。prompt_templates.py 负责构建 messages 列表，但不包含 API 调用，也不含 Pydantic 校验。schemas.py 负责 Pydantic 模型定义，不含业务逻辑。main.py 负责演示串联，不含可复用逻辑。</p><pre><code class=\"language-python\"># main.py — 串联示例\nfrom config import AppConfig, setup_logging\nfrom client import LLMClient\nfrom prompt_templates import build_extraction_prompt, build_classification_prompt\nfrom schemas import ResumeInfo, ClassificationResult\n\nconfig = AppConfig.from_env()\nsetup_logging(config.log_level)\nclient = LLMClient(config)\n\nresume = client.call_structured(\n    build_extraction_prompt(&quot;张伟，Python 开发，5年经验&quot;, {&quot;name&quot;: &quot;姓名&quot;, &quot;skills&quot;: &quot;技能&quot;}),\n    schema=ResumeInfo, label=&quot;简历抽取&quot;,\n)\n\ncategory = client.call_structured(\n    build_classification_prompt(&quot;我的订单延迟了&quot;, role=&quot;客服主管&quot;,\n                                labels={&quot;投诉&quot;: &quot;有损失&quot;, &quot;咨询&quot;: &quot;信息查询&quot;}),\n    schema=ClassificationResult, label=&quot;工单分类&quot;,\n)\n\nclient.print_cost_summary()</code></pre><p>这种结构的好处：</p><ul><li>换 API 供应商只改 <code>config.py</code> 和 <code>client.py</code>，<code>prompt_templates.py</code> 和 <code>schemas.py</code> 零改动</li><li>单元测试 <code>prompt_templates.py</code> 不需要 mock API——纯函数，输入什么出什么</li><li><code>schemas.py</code> 的 Pydantic 模型可以直接生成 JSON Schema 用于 Prompt，两处定义合一</li><li><code>main.py</code> 只有 15 行，每行都是业务逻辑，工程细节全部隐藏在其他模块里</li></ul>"}]},{"name":"RAG 基本原理","questions":[{"qnum":1,"qtext":"文档切分（Chunking）中 Chunk Size 和 Chunk Overlap 各自的作用是什么？如何选取合适的值？","answerHtml":"<p><strong>Chunk Size 的作用</strong>：决定每块的语义粒度。太小则语义不完整，太大则检索精度下降且输入成本高。</p><p><strong>Chunk Overlap 的作用</strong>：防止关键信息被切断到相邻块的边界处。</p><pre><code>无 Overlap 的切断问题：\n  Chunk 1: &quot;...退款需在购买后 30 天内&quot;\n  Chunk 2: &quot;提交申请，3-5 个工作日退回...&quot;\n  → &quot;购买后 30 天内提交申请&quot;这条关键信息跨越了两个 Chunk\n  \n有 Overlap（50 Token）：\n  Chunk 1: &quot;...退款需在购买后 30 天内&quot;\n  Chunk 2: &quot;退款需在购买后 30 天内 提交申请，3-5 个工作日退回...&quot;\n  → Chunk 2 包含了完整信息</code></pre><p>参数选取上有一些经验值可以参考。通用文档问答作为默认场景，Chunk Size 一般设 300 Token，Overlap 设 50 Token，大约占 15%。法律或合同这种长句、逻辑严格的文档，Chunk Size 要放大到 500 Token，Overlap 也要提到 100 Token，大约占 20%。FAQ 条目因为每条本来就短，Chunk Size 只需要 100 到 150 Token，Overlap 给 20 Token 就够了。</p><p><strong>不要过度调参</strong>：先用默认值（300/50）跑通，根据实际回答质量再调整——问答质量低通常是 Embedding 或检索的问题，不一定是切分参数的问题。</p>"},{"qnum":2,"qtext":"如何从零实现一个最小可用的 RAG 问答系统？请描述关键代码的设计思路。","answerHtml":"<p>核心思路：<strong>离线构建向量索引 + 在线&quot;检索-生成&quot;两步流程</strong>，最小实现只需 <code>sentence-transformers</code>、<code>numpy</code>、<code>openai</code> 三个库。</p><pre><code class=\"language-python\">from sentence_transformers import SentenceTransformer\nimport numpy as np\n\nmodel = SentenceTransformer(&quot;paraphrase-multilingual-MiniLM-L12-v2&quot;)\n\n# ─── 离线构建 ──────────────────────────────────────────────────────────────\n\ndef chunk_text(text: str, size: int = 300, overlap: int = 50) -&gt; list[str]:\n    words = text.split()\n    chunks, i = [], 0\n    while i &lt; len(words):\n        chunks.append(&quot; &quot;.join(words[i:i+size]))\n        i += size - overlap\n    return [c for c in chunks if c.strip()]\n\ndef build_index(docs: list[str]) -&gt; dict:\n    chunks = [c for doc in docs for c in chunk_text(doc)]\n    return {&quot;chunks&quot;: chunks, &quot;vectors&quot;: model.encode(chunks)}\n\n# ─── 在线检索 ──────────────────────────────────────────────────────────────\n\ndef retrieve(query: str, index: dict, top_k: int = 3) -&gt; list[str]:\n    q = model.encode([query])[0]\n    scores = [float(np.dot(q, v) / (np.linalg.norm(q) * np.linalg.norm(v)))\n              for v in index[&quot;vectors&quot;]]\n    top = sorted(range(len(scores)), key=lambda i: scores[i], reverse=True)[:top_k]\n    return [index[&quot;chunks&quot;][i] for i in top]\n\n# ─── 在线生成 ──────────────────────────────────────────────────────────────\n\ndef answer(question: str, chunks: list[str], client) -&gt; str:\n    context = &quot;\\n\\n---\\n\\n&quot;.join(f&quot;[片段 {i+1}]\\n{c}&quot; for i, c in enumerate(chunks))\n    messages = [\n        {&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;只根据参考资料回答，资料中没有的内容请明确说无法回答。&quot;},\n        {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: f&quot;参考资料：\\n\\n{context}\\n\\n问题：{question}&quot;},\n    ]\n    return client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=messages, temperature=0.1\n    ).choices[0].message.content</code></pre><p>关键设计决策：</p><ul><li><strong><code>build_index</code> 与 <code>answer</code> 分离</strong>：索引只建一次，问答每次调用；不要在问答函数里重建索引</li><li><strong>同一个 <code>model</code> 实例</strong>：<code>build_index</code> 和 <code>retrieve</code> 用同一个 <code>SentenceTransformer</code> 对象，保证向量空间一致</li><li><strong><code>temperature=0.1</code></strong>：事实问答用低温度减少随机性，但不用 0 是因为自然语言回答需要一点流畅度</li><li><strong>&quot;只根据资料回答&quot;约束</strong>：这条 system 指令让模型在找不到答案时拒答，而不是编造——这是 RAG 减少幻觉的关键机制之一</li></ul>"}]},{"name":"读取本地文档","questions":[{"qnum":1,"qtext":"RAG 系统中文档读取阶段的质量为什么至关重要？常见的文档噪音有哪些？","answerHtml":"<p>文档读取是 RAG 流程的入口，&quot;垃圾进，垃圾出&quot;——读取阶段引入的噪音会污染切分、向量化和最终回答的每一个环节。</p><pre><code>噪音对下游的影响链：\n\n  页眉&quot;第 3 章&quot; 混入正文\n    → 这块 Chunk 向量化后代表&quot;关于第 3 章的内容&quot;\n    → 用户问无关问题时，Chunk 可能被错误召回\n    → 模型看到这段噪音内容，生成不准确的回答</code></pre><p><strong>常见噪音类型</strong>：常见的噪音类型大概有六种。第一种是连续多余空行，来源是 PDF 排版还原或者段落分隔，影响是 Chunk 大量空间被浪费在空白上。第二种是行内多余空格，来源是 PDF 坐标还原误差，影响是词被拆成多个 Token。第三种是页眉页脚，来源是 PDF 固定区域的内容，影响是每一页相同的文字都会混入多个 Chunk。第四种是页码，比如&quot;- 1 -&quot;这种格式，来源是 PDF 页脚，本身没有语义，会污染向量表示。第五种是图注，比如&quot;图 3-1：……&quot;这种图片下方的说明文字，因为没有对应的图片内容，图注单独出现时语义完整度很低。第六种是编码乱码字符，来源是字体映射不完整，切分时会把乱码当成&quot;词&quot;处理，向量化后造成语义偏差。</p>"},{"qnum":2,"qtext":"读取中文文本文件时编码问题如何处理？UTF-8、GBK、UTF-8-BOM 有什么区别？","answerHtml":"<p>UTF-8（Unicode Transform Format 8-bit）是国际通用编码，中文占 3 字节/字，常见于 macOS/Linux 创建的文件。GBK（国家标准汉字编码）中文占 2 字节/字，向下兼容 GB2312，常见于 Windows 下创建的中文文件。UTF-8-BOM 即 UTF-8 + Byte Order Mark，文件开头会多出 3 字节的 BOM 标记（<code>\\xEF\\xBB\\xBF</code>），常见于 Windows 记事本&quot;另存为 UTF-8&quot;生成的文件。</p><p>处理策略（按优先级）：</p><pre><code class=\"language-python\"># 1. 来源已知 → 直接指定\nopen(path, encoding=&quot;utf-8&quot;)\n\n# 2. 中文文件，来源不确定 → 尝试列表\nfor enc in (&quot;utf-8&quot;, &quot;utf-8-sig&quot;, &quot;gbk&quot;):\n    try:\n        return open(path, encoding=enc).read()\n    except UnicodeDecodeError:\n        continue\n\n# 3. 完全未知 → chardet 自动检测\nimport chardet\nraw = open(path, &quot;rb&quot;).read(10_000)\nencoding = chardet.detect(raw)[&quot;encoding&quot;] or &quot;utf-8&quot;</code></pre><p><strong><code>utf-8-sig</code> 的作用</strong>：自动去除 UTF-8-BOM 开头的 3 字节标记——如果用 <code>utf-8</code> 读取含 BOM 的文件，文本开头会有一个看不见的 <code>﻿</code> 字符，混入文档内容影响后续处理。</p>"},{"qnum":3,"qtext":"为什么 PDF 文本提取比读取 TXT 文件难得多？有哪些常见坑？","answerHtml":"<p><strong>根本原因</strong>：PDF 是&quot;页面描述语言&quot;，存储的是&quot;在坐标 (x, y) 处绘制字形 X&quot;的指令，而不是有序的文本流。文本提取是逆向工程——把视觉坐标系上的字形还原成有逻辑顺序的文字。</p><pre><code>TXT：字节序列直接对应字符顺序，`open()` 即读即用\nPDF：坐标 (100, 700) 处的字 + 坐标 (500, 700) 处的字 → 它们在同一行，但顺序需要推断</code></pre><p><strong>四大常见坑</strong>：PDF 提取常见的坑大概有四个。第一个是多栏布局乱序，表现为左右两栏文字交错出现，也就是左1行、右1行、左2行、右2行这样穿插着来，解决方案是用 pdfplumber.crop() 分区域提取再拼接。第二个是页眉页脚混入，表现为每一页相同的内容会重复出现在多个 Chunk 里，解决方案是用 crop() 把顶部和底部的固定高度裁掉。第三个是乱码字符，表现为中文显示成方块或者奇怪符号，解决方案是换用字体处理能力更强的 pymupdf。第四个是扫描件没有文本层，表现为 extract_text() 返回 None 或者空字符串，解决方案是上 OCR，比如 pytesseract，不过这个问题可以先放一放，等 Day 16 有 OCR 需求时再解决。</p><p>推荐处理顺序：先用 <code>pdfplumber</code> 试跑，质量差再考虑 pymupdf；扫描件问题放到有 OCR 需求时再解决，不要一开始就引入复杂依赖。</p>"},{"qnum":4,"qtext":"读取文档后为什么需要文本清洗？哪些清洗操作是安全的，哪些会破坏 RAG 效果？","answerHtml":"<p><strong>为什么需要清洗</strong>：不同来源的文档读取后格式差异大，噪音直接影响切分质量和向量语义准确性。清洗的目标是&quot;去除视觉格式噪音，保留语义信息&quot;。</p><p><strong>安全的清洗操作</strong>（不影响语义）：</p><pre><code class=\"language-python\">text = text.replace(&quot;\\r\\n&quot;, &quot;\\n&quot;)         # 统一换行符\ntext = re.sub(r&quot;\\n{3,}&quot;, &quot;\\n\\n&quot;, text)    # 压缩连续空行\ntext = re.sub(r&quot;[ \\t]{2,}&quot;, &quot; &quot;, text)    # 压缩多余空格\ntext = text.strip()                       # 去首尾空白</code></pre><p><strong>危险的清洗操作</strong>（会破坏 RAG 效果）：有几类清洗操作是危险的，会破坏 RAG 效果，做的时候要特别小心。第一种是去停用词，比如把&quot;的&quot;&quot;了&quot;&quot;是&quot;这些字去掉，问题在于 Embedding 模型依赖完整句子的上下文，去掉停用词会破坏语法结构。第二种是词干化或者词形还原，中文分词本身就不适用这一套，英文文档做了也会破坏 Embedding 的语义。第三种是去标点符号，标点其实是句子边界的重要标志，去掉之后切分和 Embedding 都会出问题。第四种是强制截断到固定的 N 字符，这种操作应该放在切分阶段去做，而不是在加载阶段就直接截断。</p><p><strong>判断原则</strong>：如果一个清洗操作会改变文本的语义或信息完整性，就不应该在文档加载阶段做——这类操作要么不做，要么放到切分策略里按需处理。</p>"},{"qnum":5,"qtext":"如何设计一个支持多格式的统一文档加载器？请描述接口设计和关键实现思路。","answerHtml":"<p>核心设计原则：<strong>统一输出格式（<code>Document</code> dataclass）+ 格式路由表 + 各格式独立加载函数</strong>。</p><pre><code class=\"language-python\">from dataclasses import dataclass, field\nfrom pathlib import Path\n\n@dataclass\nclass Document:\n    text: str          # 清洗后的纯文本\n    source: str        # 来源文件路径（Day 20 引用来源时使用）\n    file_type: str     # txt / md / pdf\n    page_count: int = 1\n    metadata: dict = field(default_factory=dict)\n\ndef load_document(path: str) -&gt; Document:\n    ext = Path(path).suffix.lower()\n    loader = {&quot;.txt&quot;: _load_txt, &quot;.md&quot;: _load_md, &quot;.pdf&quot;: _load_pdf}.get(ext)\n    if loader is None:\n        raise ValueError(f&quot;不支持的格式：{ext}&quot;)\n    return loader(path)\n\ndef load_directory(dir_path: str, extensions=None, recursive=False) -&gt; list[Document]:\n    exts = extensions or [&quot;.txt&quot;, &quot;.md&quot;, &quot;.pdf&quot;]\n    pattern = &quot;**/*&quot; if recursive else &quot;*&quot;\n    docs = []\n    for ext in exts:\n        for f in Path(dir_path).glob(f&quot;{pattern}{ext}&quot;):\n            try:\n                docs.append(load_document(str(f)))\n            except Exception as e:\n                print(f&quot;[跳过] {f}：{e}&quot;)\n    return docs</code></pre><p><strong>接口设计的三个关键决策</strong>：</p><ul><li><strong>为什么用 <code>Document</code> 而不是直接返回字符串</strong>：<code>source</code> 字段是 Day 20 引用来源的基础；<code>page_count</code> 和 <code>metadata</code> 为后续扩展预留空间；统一格式让调用方代码稳定，换格式只改加载器内部实现</li></ul><ul><li><strong>为什么用路由表 <code>{&quot;.txt&quot;: _load_txt, ...}</code></strong>：比 <code>if/elif</code> 更易扩展——新增格式只在路由表加一行，不改 <code>load_document</code> 主体逻辑</li></ul><ul><li><strong><code>load_directory</code> 为什么用 try/except 跳过失败文件</strong>：知识库可能包含部分损坏或不支持的文件，单个失败不应中断整批加载——记录日志后跳过，保证能加载其他正常文件</li></ul>"}]},{"name":"文本切分","questions":[{"qnum":1,"qtext":"固定大小切分和按语义边界切分有什么本质区别？各自的适用场景？","answerHtml":"<p>从五个维度对比：切分依据上，固定大小切分按字符数/Token 数来切，与内容无关，按语义边界切分则依据段落、句子等自然语言边界；Chunk 大小上，固定大小切分均匀可控，按语义边界切分差异较大（受原文结构影响）；语义完整性上，固定大小切分可能在句子中间截断，按语义边界切分能保证每块是完整的语义单元；实现复杂度上，固定大小切分极简，按语义边界切分需要语言检测（段落符、句号等）；适用场景上，固定大小切分适合快速原型和结构无规律的纯流文本，按语义边界切分适合有清晰段落结构的正式文档、法律合同、FAQ。</p><p><strong>核心区别</strong>：固定大小切分以&quot;字符均匀&quot;为目标，与文本语义完全解耦；语义边界切分以&quot;语义完整&quot;为目标，接受大小不均换来的内容完整性。</p><p><strong>实际影响</strong>：固定切分可能把一句&quot;退款需在 30 天内 | 提交申请&quot;从中截断，导致两个 Chunk 各只包含半句话，向量化后语义都不完整，检索时容易召回错误内容。</p>"},{"qnum":2,"qtext":"Chunk Size 和 Chunk Overlap 各自的作用是什么？选取不当会带来什么后果？","answerHtml":"<p><strong>Chunk Size（块大小）</strong>：</p><ul><li>决定每块向量代表的&quot;语义粒度&quot;</li><li>过小：每块只有几个词，语义不完整，无法独立回答问题；向量化后语义混乱</li><li>过大：一块里混入多个话题，向量是多话题的平均，检索时既不精准又带入大量无关内容</li><li>经验值：中文场景 300–500 字符（约 200–400 字），英文场景 300–600 Token</li></ul><p><strong>Chunk Overlap（块重叠）</strong>：</p><ul><li>解决语义跨块边界的问题——一个事实可能恰好跨在两个 Chunk 的切断处</li><li>通过让相邻两块共享一段文本（前块尾部 = 后块头部），确保边界处的语义在至少一块中是完整的</li><li>过小（&lt; 5%）：边界信息丢失，检索时跨块关键信息无法被召回</li><li>过大（&gt; 40%）：大量冗余存储，索引体积膨胀，相似块互相干扰检索结果</li><li>经验值：Chunk Size 的 15–25%（如 Chunk Size=400，Overlap=60–100）</li></ul>"},{"qnum":3,"qtext":"递归字符切分（Recursive Character Splitter）的核心思路是什么？为什么推荐作为默认策略？","answerHtml":"<p><strong>核心思路</strong>：给定一组按优先级排列的分隔符（如 <code>[&quot;\\n\\n&quot;, &quot;\\n&quot;, &quot;。&quot;, &quot;.&quot;, &quot; &quot;, &quot;&quot;]</code>），先尝试最高优先级的分隔符切分；如果某块仍然超过 <code>chunk_size</code>，则用下一个分隔符继续切分这块，直到满足大小约束或用尽所有分隔符（最后用字符强制切分兜底）。</p><pre><code>分隔符优先级：段落 &gt; 行 &gt; 句号 &gt; 词 &gt; 字符\n结果：尽可能在&quot;最自然的边界&quot;处切，只在迫不得已时才截断更小的单元</code></pre><p><strong>为什么推荐作为默认</strong>：</p><ul><li><strong>语义完整性好</strong>：优先段落边界，退而求其次用句子，最差情况才截字符——比固定字符切分语义损失小得多</li><li><strong>大小可控</strong>：通过 <code>chunk_size</code> 硬性约束，不会出现纯段落切分时 Chunk 大小差异几十倍的情况</li><li><strong>通用性强</strong>：同一组分隔符对中英文混合文档都适用，无需针对语言调整</li><li><strong>LangChain 默认实现验证</strong>：社区大规模使用证明它是最实用的折中方案</li></ul>"},{"qnum":4,"qtext":"切分策略对 RAG 检索质量的影响路径是什么？如何设计切分策略对比实验？","answerHtml":"<p><strong>影响路径</strong>：</p><pre><code>切分策略\n  → Chunk 语义纯度（一块是否只包含一个话题）\n    → 向量化质量（向量能否精确代表这块的语义）\n      → 检索召回质量（问题向量和答案向量的余弦相似度）\n        → 最终回答质量（模型拿到的上下文是否包含答案）</code></pre><p><strong>对比实验设计</strong>：</p><pre><code class=\"language-python\"># Step 1：准备同一份文档，用不同策略切分\nstrategies = {\n    &quot;固定字符&quot;: chunk_by_chars(text, 400, 80),\n    &quot;递归切分&quot;: RecursiveCharacterSplitter(400, 80).split(text),\n    &quot;句子切分&quot;: chunk_by_sentences(text, 300, 1),\n}\n\n# Step 2：对每种策略统计 Chunk 分布（块数、大小均值/标准差/最值）\nfor name, chunks in strategies.items():\n    print(analyze_chunks(chunks, name))\n\n# Step 3：构建向量索引，用一组测试问题检索，记录最高相似度分数\nfor query in test_questions:\n    evaluate_retrieval(query, text, strategies)\n\n# Step 4：分析哪种策略的最高相似度最高（说明检索到的最相关块更纯粹）</code></pre><p><strong>关键观察点</strong>：相同 <code>chunk_size</code> 下，语义边界切分通常检索相似度更高；过粗的切分（大段落）相似度反而低，因为向量是多话题平均，与问题向量距离更远。</p>"},{"qnum":5,"qtext":"如何从零实现一个支持多策略、可对比的文本切分工具？请描述核心设计决策。","answerHtml":"<p><strong>设计目标</strong>：支持四种策略，统一输出格式，能输出统计报告，易于扩展新策略。</p><pre><code class=\"language-python\">from abc import ABC, abstractmethod\nfrom dataclasses import dataclass\n\n@dataclass\nclass ChunkStats:\n    strategy: str\n    count: int\n    mean_size: float\n    std_size: float\n    min_size: int\n    max_size: int\n\n\nclass BaseSplitter(ABC):\n    @abstractmethod\n    def split(self, text: str) -&gt; list[str]:\n        ...\n\n    def analyze(self, text: str) -&gt; ChunkStats:\n        from statistics import mean, stdev\n        chunks = self.split(text)\n        sizes = [len(c) for c in chunks]\n        return ChunkStats(\n            strategy=self.__class__.__name__,\n            count=len(chunks),\n            mean_size=round(mean(sizes), 1) if sizes else 0,\n            std_size=round(stdev(sizes), 1) if len(sizes) &gt; 1 else 0,\n            min_size=min(sizes) if sizes else 0,\n            max_size=max(sizes) if sizes else 0,\n        )\n\n\nclass FixedCharSplitter(BaseSplitter):\n    def __init__(self, chunk_size=400, overlap=80):\n        self.chunk_size = chunk_size\n        self.overlap = overlap\n\n    def split(self, text: str) -&gt; list[str]:\n        chunks, start = [], 0\n        while start &lt; len(text):\n            chunks.append(text[start:start + self.chunk_size].strip())\n            start += self.chunk_size - self.overlap\n        return [c for c in chunks if c]\n\n\n# RecursiveCharacterSplitter、SentenceSplitter 继承 BaseSplitter，各自实现 split()\n\ndef compare_all(text: str, splitters: list[BaseSplitter]) -&gt; None:\n    print(f&quot;{'策略':&lt;30}{'块数':&gt;6}{'均值':&gt;8}{'标准差':&gt;8}{'最小':&gt;8}{'最大':&gt;8}&quot;)\n    print(&quot;-&quot; * 70)\n    for sp in splitters:\n        s = sp.analyze(text)\n        print(f&quot;{s.strategy:&lt;30}{s.count:&gt;6}{s.mean_size:&gt;8}{s.std_size:&gt;8}&quot;\n              f&quot;{s.min_size:&gt;8}{s.max_size:&gt;8}&quot;)</code></pre><p><strong>三个核心设计决策</strong>：</p><ul><li><strong>抽象基类 <code>BaseSplitter</code></strong>：统一接口，<code>compare_all</code> 不关心策略内部实现；新增策略只加一个子类，不改比较框架</li><li><strong><code>analyze()</code> 放在基类</strong>：统计逻辑复用，各策略天然支持统计报告，无需重复实现</li><li><strong><code>ChunkStats</code> dataclass</strong>：结构化输出，比返回 dict 更类型安全，方便后续扩展（如画分布直方图）</li></ul>"}]},{"name":"Embedding 与向量检索","questions":[{"qnum":1,"qtext":"Embedding 模型的\"一致性约束\"是什么？违反后会出现什么问题？","answerHtml":"<p>一致性约束是指：RAG 流程中，对文档 Chunk 进行向量化（离线构建）和对用户问题进行向量化（在线检索）<strong>必须使用同一个 Embedding 模型</strong>。</p><p><strong>违反后的后果</strong>：不同 Embedding 模型产生的向量处于不同的语义空间——即使两个向量的维度相同，它们的坐标系也完全不同，余弦相似度计算结果毫无意义。</p><pre><code>类比：用厘米尺量文档（建立索引），用英寸尺量问题（在线查询）\n      结果：12 厘米和 12 英寸看起来都是 12，但实际对比的是两个不同单位，毫无意义\n\nEmbedding 层面：\n  模型 A 认为&quot;退款&quot;→ [0.8, 0.1, ...]\n  模型 B 认为&quot;退款&quot;→ [0.3, 0.7, ...]\n  用 A 建库，用 B 查询 → 两个向量在各自空间里都合理，但放在一起比余弦相似度是随机的</code></pre><p><strong>实践影响</strong>：一旦上线后更换 Embedding 模型，必须<strong>重新向量化全部文档</strong>并重建索引——这是一个有运维成本的操作，因此模型选型要尽早确定。</p>"},{"qnum":2,"qtext":"余弦相似度、内积、L2 距离三种度量方式有什么区别？RAG 场景为什么通常选余弦相似度？","answerHtml":"<p>三种度量方式各不相同：余弦相似度的公式是 <code>(A·B)/(‖A‖·‖B‖)</code>，取值范围 [-1, 1]，不受向量长度影响（只看方向），是 RAG 场景的<strong>首选</strong>；内积（点积）的公式是 <code>A·B</code>，取值无限制，会受向量长度影响（长度会影响结果），只有在向量归一化之后才等价于余弦相似度；L2 距离的公式是 <code>√Σ(aᵢ-bᵢ)²</code>，取值范围 [0, ∞)，同样受向量长度影响，更常用于图像/数值特征，文本场景很少用它。</p><p><strong>为什么 RAG 选余弦相似度</strong>：</p><p>文本的 Embedding 向量长度会随文本长度变化——短问题（5 个字）的向量模通常比长段落（200 个字）小。如果用内积，&quot;语义完全相同但文字更多&quot;的段落会因为向量模更大而得到更高分，这不是我们想要的排序逻辑。余弦相似度只看两个向量的<strong>方向夹角</strong>，消除了长度带来的偏差，让语义相近程度直接决定排序结果。</p><p><strong>实践速查</strong>：</p><pre><code>score ≥ 0.85 → 语义非常相近，高度相关\n0.7–0.85    → 相关，通常可以作为参考资料\n0.5–0.7     → 弱相关，需要结合其他条件判断\n&lt; 0.5       → 关系很小，通常过滤掉</code></pre>"},{"qnum":3,"qtext":"API-based Embedding 和本地 Embedding 模型如何选择？各自的适用场景？","answerHtml":"<p>这两条路子可以从几个方面来比。先看代表方案，API-based 这边有 DeepSeek Embedding、OpenAI 的 text-embedding-3-small 这些，本地模型这边主要是 sentence-transformers 系列，像 MiniLM、BGE。向量维度上，API-based 通常在 1024 到 1536 之间，本地模型会小一些，384 到 1024。效果上，API-based 普遍更强，毕竟有商用级的优化，本地模型稍弱一点，不过中文场景下 BGE 系列表现其实很不错。成本上，API-based 是按 Token 计费的，本地模型没有 API 费用，但你得自己承担硬件成本。数据隐私是个关键区别：API-based 得把数据传到云端，本地模型数据完全留在本地，不出门。延迟上也差得远，API-based 大概 100 到 300 毫秒，主要耗在网络 I/O 上，本地模型用 CPU 推理只要 5 到 50 毫秒。最后看适用阶段，对效果要求高的生产环境更适合用 API-based，而学习、原型验证，或者数据比较敏感的场景，就更适合用本地模型。</p><p><strong>决策树</strong>：</p><pre><code>数据能出境且预算充足？\n  → 是 → API-based（DeepSeek 或 OpenAI）\n  → 否 → 本地模型\n\n本地模型选型：\n  纯学习/原型             → MiniLM-L12-v2（轻量，中英文双语）\n  生产中文知识库           → BAAI/bge-large-zh-v1.5（效果最强）\n  需要中文+英文均衡         → BAAI/bge-m3（多语言版本）</code></pre><p>入门阶段统一推荐 <code>paraphrase-multilingual-MiniLM-L12-v2</code>：约 120MB，免费，支持中英文，CPU 可运行，足以验证 RAG 完整流程。</p>"},{"qnum":4,"qtext":"向量检索中的 Top-K 和相似度阈值分别解决什么问题？应该如何配合使用？","answerHtml":"<p><strong>Top-K</strong> 解决&quot;返回多少结果&quot;的问题：</p><ul><li>K 过小（K=1）：上下文信息量不足，模型可能因为缺少关键细节而回答不完整</li><li>K 过大（K=10）：引入太多低相关内容，占用过多 Context Token 且容易干扰模型判断</li><li>经验值：<code>top_k=3</code> 是大多数场景的合理起点</li></ul><p><strong>相似度阈值（min_score）</strong> 解决&quot;什么都没检索到时如何拒绝&quot;的问题：</p><pre><code>场景：用户问&quot;明天天气怎么样&quot;，知识库全是产品文档\n\n无阈值：top-1 结果 score=0.38，强行返回一段完全不相关的文档\n        → 模型收到无关资料，可能生成幻觉或胡乱联系\n\n有阈值（min_score=0.6）：score=0.38 &lt; 0.6，过滤掉，返回空列表\n                         → RAG 层报告&quot;无相关文档&quot;→ 模型可以诚实说不知道</code></pre><p><strong>配合使用策略</strong>：</p><pre><code class=\"language-python\">results = index.search(query_vec, top_k=3)\nresults = [r for r in results if r[&quot;score&quot;] &gt;= 0.6]\n\nif not results:\n    return &quot;根据当前知识库，未找到与您问题相关的信息。&quot;</code></pre><p>阈值不是越高越好——过高会导致&quot;宁愿拒答也不回答&quot;的体验；过低则相当于没有阈值。建议先用 0.5–0.6 起步，根据实际拒答率调整。</p>"},{"qnum":5,"qtext":"如何从零构建一个支持持久化、批量向量化、带阈值过滤的 RAG 检索组件？请描述核心设计决策。","answerHtml":"<p>核心设计原则：<strong>Embedding 模型可替换 + 向量存储与检索逻辑分离 + 批量 API 调用降成本</strong>。</p><pre><code class=\"language-python\">class EmbeddingModel:\n    &quot;&quot;&quot;统一封装 API 和本地两种 Embedding 来源，外部调用方无感知&quot;&quot;&quot;\n    def __init__(self, mode=&quot;local&quot;):  # mode: &quot;local&quot; | &quot;api&quot;\n        ...\n    def embed(self, texts: list[str]) -&gt; list[list[float]]:\n        ...  # 内部分发：local 用 sentence-transformers，api 用 OpenAI SDK\n\n@dataclass\nclass VectorStore:\n    &quot;&quot;&quot;纯 numpy 实现的向量索引，支持 JSON 持久化&quot;&quot;&quot;\n    texts: list[str]\n    embeddings: list[list[float]]\n    metadatas: list[dict]\n\n    def search(self, query_vec, top_k=3, min_score=0.0) -&gt; list[dict]:\n        # 矩阵归一化 + 矩阵乘法，一次计算所有余弦相似度\n        scores = (matrix_normed) @ q_norm\n        return [r for r in top_k_results if r[&quot;score&quot;] &gt;= min_score]\n\n    def save(self, path): json.dump(...)\n    def load(cls, path): ...\n\nclass RAGRetriever:\n    &quot;&quot;&quot;上层门面，对外暴露 build + retrieve 两个接口&quot;&quot;&quot;\n    def build_from_texts(self, chunks, metadatas=None):\n        vecs = self.embedder.embed(chunks)  # 批量向量化\n        self.store.add(chunks, vecs, metadatas)\n\n    def retrieve(self, query, top_k=3, min_score=0.5) -&gt; list[dict]:\n        q_vec = self.embedder.embed([query])[0]\n        return self.store.search(q_vec, top_k, min_score)</code></pre><p><strong>三个核心设计决策</strong>：</p><ul><li><strong><code>EmbeddingModel</code> 隔离 API/本地差异</strong>：调用方（<code>RAGRetriever</code>）只调用 <code>embedder.embed(texts)</code>，切换 API/本地只改构造函数参数，不改检索逻辑</li><li><strong>矩阵运算代替循环</strong>：<code>matrix_normed @ q_norm</code> 一次算出全部相似度，比 for 循环逐一计算快 10–100 倍</li><li><strong><code>min_score</code> 过滤在 <code>VectorStore.search</code> 内完成</strong>：不在上层判断，保证&quot;空结果&quot;和&quot;有结果&quot;两个分支都被统一处理，调用方不需要额外过滤逻辑</li></ul>"}]},{"name":"RAG 问答生成","questions":[{"qnum":1,"qtext":"RAG 场景下上下文拼接的\"Lost in the Middle\"效应是什么？如何缓解？","answerHtml":"<p>&quot;Lost in the Middle&quot; 是斯坦福 2023 年研究提出的现象：当 Prompt 中有多段检索文本时，模型对开头和结尾部分的注意力显著高于中间部分，中间的内容容易被忽视。</p><pre><code>模型注意力分布示意（Context 中的位置 vs 关注程度）：\n\n  开头 ████████████████████ 高\n  中间 ████░░░░░░░░░░░░░░░░ 低\n  末尾 ████████████████     较高\n\n实验结论：同样的关键信息，放在开头或末尾，模型引用率比放中间高约 20%</code></pre><p><strong>缓解策略</strong>：针对这个问题有几种缓解策略。第一种是相关度降序排列，也是默认做法，把最相关的 Chunk 排在第一位，利用开头的注意力优势，这个方法在 Top-K 不超过 3 的时候简单有效。第二种是&quot;三明治&quot;排列，把最相关的 Chunk 放在末尾，其余的按相关度降序排在前面，适合已经明确知道哪个是最佳命中 Chunk 的情况。第三种是控制 Chunk 数量，比如用 Top-K=3 而不是 10，减少落在中间位置、容易被忽视的内容，这是比较通用的推荐做法。第四种是精准切分，让每个 Chunk 的语义保持纯粹、不混入多个话题，这是治本的方法，而不只是治标。</p>"},{"qnum":2,"qtext":"为什么 RAG 需要\"只根据资料回答\"约束？不加约束会出现什么问题？","answerHtml":"<p>大模型有&quot;不愿说不知道&quot;的倾向——当知识不确定时，宁愿生成&quot;听起来合理&quot;的内容，而不是承认局限。RAG 场景中如果没有约束，模型会把检索到的资料和训练数据中的&quot;已有知识&quot;混合使用，产生<strong>RAG 幻觉</strong>：</p><pre><code>场景：知识库只有产品 A 的退款政策（30天）\n\n用户问：产品 B 能退款吗？\n检索结果：[产品 A 退款条款]（最相关的内容，但与 B 无关）\n\n无约束回答：\n  &quot;根据通用退款政策，产品 B 可以在 30 天内退款。&quot;\n  → 把 A 的规则&quot;推断&quot;成了 B 的规则，看起来权威但完全是捏造的\n\n有约束回答：\n  &quot;参考资料中仅包含产品 A 的退款政策，未涉及产品 B。\n   建议直接联系客服确认产品 B 的退款条款。&quot;\n  → 诚实地反映了资料的边界，用户知道应该去哪里找答案</code></pre><p>约束的核心价值：<strong>让系统的可信度可预测</strong>——用户知道这个系统只说它&quot;知道&quot;的事，不会冒充专家随意发挥。</p>"},{"qnum":3,"qtext":"RAG 中拒答逻辑应该在检索层还是生成层实现？两者有何区别？","answerHtml":"<p>这两层拒答解决的问题不一样，应该同时实现，不能只做一层。先说触发条件，检索层拒答靠的是 <code>min_score</code> 这个阈值，向量相似度低于阈值、压根没有足够相关的 Chunk 时就触发；生成层拒答不一样，是 Chunk 已经检索到了，但模型自己判断这些内容跟问题其实不相关，这时候触发。实现方式上也不同，检索层就是一句 <code>if not results: return &quot;拒答文案&quot;</code> 这样的代码逻辑，生成层则是写在 System Prompt 里的约束指令，靠模型自己遵守。优点上，检索层确定性强，而且能省下一次 LLM 调用的成本；生成层的优势是能处理&quot;检索到了但内容其实不相关&quot;这种边界情况。缺点也很明显，检索层对阈值特别敏感，阈值设高了会误拒，设低了又会漏放垃圾内容；生成层则完全依赖模型愿不愿意遵守指令，稳定性比不上代码逻辑。所以适用场景也分得很清楚：完全不相关的问题交给检索层去拦，省 API 费用；检索到了但内容不够的边界情况，就交给生成层去处理。</p><pre><code class=\"language-python\"># 双层拒答的正确写法\nresults = store.search(q_vec, top_k=3, min_score=0.6)  # 检索层\n\nif not results:   # 检索层拒答：直接返回，不调用 LLM\n    return &quot;根据现有知识库，未找到相关信息。&quot;\n\nanswer = llm_generate(query, results)   # 生成层可能自行判断&quot;资料不够&quot;\nreturn answer</code></pre><p>两层协同：检索层是&quot;硬拒绝&quot;（快速、节省成本），生成层是&quot;软拒绝&quot;（处理检索层漏网的边界情况）。</p>"},{"qnum":4,"qtext":"RAG 的 temperature 应该设多少？和普通对话有何不同？","answerHtml":"<p>RAG 场景的核心目标是忠实地从资料中提取和整理信息，这需要的是确定性而不是创造性，因此 temperature 通常要比普通对话低得多。具体来说，RAG 问答这种需要精确的场景，推荐 temperature 设在 0.0 到 0.1 之间，原因是同一个问题多次调用结果要保持一致，方便测试和验证。普通对话场景推荐 0.7，因为需要一定的多样性和自然感。创意写作场景推荐 1.0 到 1.5，因为需要比较高的随机性。代码生成场景推荐 0.0，因为语法和逻辑不能有随机性。</p><p><strong>为什么 RAG 不用 0.0 而用 0.1</strong>：temperature=0.0 会导致完全确定性的输出，但不同版本的模型对同一个 <code>temperature=0.0</code> 的处理方式可能有细微差异；0.1 保留了极少量随机性，让回答在语言流畅性上稍微自然一些，同时对事实准确性几乎没有影响。</p><p><strong>关键判断</strong>：如果 RAG 系统用于生产，回答需要可测试（同一问题每次答案要基本一致），就使用低 temperature。如果只是演示，可以适当提高到 0.3 让语言更自然。</p>"},{"qnum":5,"qtext":"如何从零设计一个端到端的 RAG 问答系统？描述各模块的职责和接口。","answerHtml":"<p>端到端 RAG 由五个阶段组成，每个阶段有明确的输入输出契约：</p><pre><code>【离线构建阶段】\nDocumentLoader.load(path) → Document(text, source, ...)\n       ↓\nTextSplitter.split(text) → list[str]（Chunks）\n       ↓\nEmbeddingModel.embed(chunks) → list[list[float]]\n       ↓\nVectorStore.add(chunks, vecs, metadatas) → None\nVectorStore.save(path) → 持久化到磁盘\n\n【在线问答阶段】\n用户输入 query\n       ↓\nEmbeddingModel.embed([query]) → list[float]\n       ↓\nVectorStore.search(q_vec, top_k=3, min_score=0.6) → list[dict]\n       ↓\n空列表 → 直接返回拒答文案（不调用 LLM）\n       ↓\nbuild_prompt(query, results) → messages（system + user）\n       ↓\nLLM.generate(messages, temperature=0.1) → str\n       ↓\n返回最终回答</code></pre><p><strong>各模块接口设计原则</strong>：</p><pre><code class=\"language-python\"># 统一文档格式，使加载器可替换\n@dataclass\nclass Document:\n    text: str; source: str; metadata: dict\n\n# 切分器可替换（固定字符 / 递归 / 句子）\nclass BaseSplitter:\n    def split(self, text: str) -&gt; list[str]: ...\n\n# Embedding 可替换（API / 本地）\nclass EmbeddingModel:\n    def embed(self, texts: list[str]) -&gt; list[list[float]]: ...\n\n# 向量库可替换（numpy / FAISS / Chroma）\nclass VectorStore:\n    def add(self, texts, vecs, metadatas=None): ...\n    def search(self, q_vec, top_k=3, min_score=0.5) -&gt; list[dict]: ...\n    def save(self, path) / load(cls, path): ...\n\n# 上层 Pipeline：组合所有模块\nclass RAGPipeline:\n    def build(self, docs_dir: str): ...\n    def ask(self, query: str) -&gt; str: ...</code></pre><p><strong>三个工程关键点</strong>：</p><ul><li><strong>每层只暴露最小接口</strong>：<code>ask(query)</code> 返回字符串，调用方不需要感知检索/生成的内部细节</li><li><strong>拒答必须在 LLM 之前</strong>：<code>if not results: return</code> 放在生成调用之前，节省 API 费用</li><li><strong>模块替换不影响上层</strong>：换 Embedding 模型或向量库只改 <code>RAGPipeline.__init__</code>，<code>ask()</code> 的逻辑完全不动</li></ul>"}]},{"name":"RAG 引用与可解释性","questions":[{"qnum":1,"qtext":"为什么 RAG 系统需要引用机制？引用解决了什么问题？","answerHtml":"<p>引用机制让用户能追溯答案的来源，是 RAG 系统可解释性（Explainability）的核心保障。它解决了 Day 19 &quot;只根据资料回答&quot;约束遗留的一个关键问题——用户无法区分答案来自知识库还是模型&quot;脑补&quot;。</p><pre><code>没有引用的回答：\n  &quot;购买后 30 天内可申请全额退款。&quot;\n  → 用户疑问：这 30 天的规定从哪来的？是模型编的吗？\n\n有引用的回答：\n  &quot;购买后 30 天内可申请全额退款 [1]。&quot;\n  [1] 退款政策：购买后 30 天内可申请全额退款...\n  → 用户可以核实，对系统产生信任</code></pre><p>引用可以分三个层次逐步升级：L1 标记引用，只在回答中标注来源编号，做法最简单，成本最低，只是让用户知道&quot;这句话是有出处的&quot;；L2 展示来源，在回答后附上引用原文片段，用户不需要另外去查找资料，就能直接核实；L3 可验证，程序校验引用编号是否真实、内容是否匹配，价值在于防止模型&quot;虚构引用&quot;，从而保证引用真正可信。</p><p>引用与 Day 19 拒答的关系：拒答保证&quot;不知道时不说&quot;，引用保证&quot;知道时给出依据&quot;，两者共同构成 RAG 的可解释性。</p>"},{"qnum":2,"qtext":"自然语言引用和结构化 JSON 引用有什么本质区别？为什么推荐结构化输出？","answerHtml":"<p>自然语言引用就是让模型在回答里直接写&quot;根据[资料1]&quot;这种话，结构化引用则是让模型输出一个 JSON，比如 <code>{&quot;answer&quot;: &quot;...&quot;, &quot;sources&quot;: [1]}</code>。这两种方式差别主要在三点。格式稳定性上，自然语言引用很不靠谱，模型可能这次写&quot;[1]&quot;，下次写&quot;资料1&quot;，再下次写&quot;根据资料1&quot;，格式完全不统一；结构化 JSON 引用的字段是固定死的，格式很稳定。可解析性上，自然语言引用要提取编号，还得用正则表达式，或者干脆再调一次模型才能拿到，而结构化引用直接 <code>json.loads()</code> 一下就把 <code>sources</code> 取出来了。可校验性上差得更明显，自然语言引用没法可靠地把文字里的编号对应到具体哪条资料去做验证，而结构化引用里 <code>sources</code> 是个整数列表，可以直接跟检索结果的索引做匹配校验。</p><p>自然语言引用的核心问题：</p><pre><code>模型可能输出：&quot;根据[资料1]和[资料3]，退款时间为 30 天&quot;\n→ 要从自然语言中提取 &quot;1&quot; 和 &quot;3&quot; 需要额外解析，且不可靠\n\n结构化输出：\n{&quot;answer&quot;: &quot;退款时间为 30 天&quot;, &quot;sources&quot;: [1, 3]}\n→ 直接取 sources=[1,3]，可以和检索结果做索引匹配</code></pre><p>结构化输出的设计要点：<code>answer</code> 字段保持纯文本不含引用标记（展示时由程序决定标注方式），<code>sources</code> 字段用整数列表（可直接做索引匹配），<code>sources</code> 只放实际存在的编号（防止越界）。</p>"},{"qnum":3,"qtext":"什么是\"虚构引用\"？有哪些类型？如何检测？","answerHtml":"<p>虚构引用是指模型在结构化输出中声称引用了某条资料，但实际上该资料中并没有相关内容——这比不引用更危险，因为用户以为有出处，实际是幻觉。</p><p>三种虚构引用类型：编号越界，表现为 sources=[5] 但实际只有 3 条资料，检测难度最低，只需检查编号是否落在 1–N 范围内；编号有效但内容不匹配，表现为 sources=[3]，但第 3 条资料里根本没有 answer 提到的内容，检测难度最高，需要用语义匹配去检查 answer 和引用资料之间有没有共享关键词；遗漏引用，表现为 answer 非空但 sources 为空，检测难度中等，只需检查 answer 非空时 sources 是否也非空。</p><pre><code class=\"language-python\">def validate_citation(rag_answer, contexts):\n    issues = []\n    valid_sources = []\n    # 防线 1：编号有效性\n    for src in rag_answer.sources:\n        if 1 &lt;= src &lt;= len(contexts):\n            valid_sources.append(src)\n        else:\n            issues.append(f&quot;引用编号 {src} 越界&quot;)\n    # 防线 2：拒答一致性\n    is_refusal = &quot;无法回答&quot; in rag_answer.answer\n    if is_refusal and valid_sources:\n        issues.append(&quot;拒答但仍有引用，存在矛盾&quot;)\n    # 防线 3：内容匹配性（粗粒度关键词检查）\n    for src in valid_sources:\n        ctx_text = contexts[src - 1][&quot;text&quot;]\n        if not extract_shared_keywords(rag_answer.answer, ctx_text):\n            issues.append(f&quot;引用 [{src}] 与回答内容不匹配，可能为虚构引用&quot;)\n    return {&quot;is_valid&quot;: len(issues) == 0, &quot;valid_sources&quot;: valid_sources, &quot;issues&quot;: issues}</code></pre><p>类型 2（内容不匹配）最难检测——粗粒度关键词匹配可以拦截明显的不匹配，但更精确的校验需要语义相似度或额外模型调用，成本较高。生产环境中先用关键词匹配做粗筛，高价值场景再引入语义校验。</p>"},{"qnum":4,"qtext":"引用校验的\"三道防线\"分别解决什么问题？为什么缺一不可？","answerHtml":"<p>第一道是编号有效性，检查的是 <code>sources</code> 里的编号有没有落在 1 到 N 的范围内，拦截的是越界引用。它之所以少不了，是因为一旦有不存在的资料编号混进来，展示的时候索引就会越界报错。第二道是拒答一致性，检查的是当 <code>answer</code> 写着&quot;无法回答&quot;的时候，<code>sources</code> 是不是应该为空，拦截的是逻辑矛盾——少了这一道，就可能出现&quot;嘴上说不知道，却又引用了资料&quot;这种自相矛盾的输出。第三道是内容匹配性，检查引用的资料跟 <code>answer</code> 之间有没有共享关键词，拦截的是内容虚构，这也是三道防线里最关键的一道，因为它拦住的是&quot;编号本身合法，但内容其实无关&quot;这种最危险的幻觉引用。</p><p>三道防线的协同关系：</p><pre><code>防线 1（格式层）→ 过滤越界编号，保证 sources 指向真实存在的资料\n    ↓\n防线 2（逻辑层）→ 检查拒答与引用的一致性，保证输出不自相矛盾\n    ↓\n防线 3（语义层）→ 检查引用内容与回答的匹配度，拦截&quot;有编号但内容对不上&quot;的虚构\n\n只有防线 1：越界问题解决了，但&quot;编号合法、内容虚构&quot;的幻觉漏网\n只有防线 1+2：逻辑矛盾解决了，但&quot;编号和逻辑都对、内容却无关&quot;的问题漏网\n三道齐全：从格式 → 逻辑 → 语义，层层递进，覆盖最广</code></pre><p>防线 3 是粗粒度关键词匹配而非精确语义校验，原因：关键词匹配成本极低（纯 Python 字符串操作），能拦截最明显的内容不匹配；精确语义校验需要额外 Embedding 或模型调用，成本高，留到高价值场景按需引入。</p>"},{"qnum":5,"qtext":"如何从零设计一个带引用溯源和校验的 RAG 问答系统？描述核心设计决策。","answerHtml":"<p>核心设计原则：<strong>结构化输出保证可解析 + 三道防线保证可信 + 引用展示保证可追溯</strong>。</p><pre><code class=\"language-python\">from pydantic import BaseModel, Field\n\nclass RAGAnswer(BaseModel):\n    &quot;&quot;&quot;带引用的回答结构&quot;&quot;&quot;\n    answer: str = Field(description=&quot;基于参考资料生成的回答&quot;)\n    sources: list[int] = Field(description=&quot;引用的资料编号列表&quot;)\n\nclass CitedRAGPipeline:\n    def ask(self, query: str) -&gt; str:\n        # 1. 检索（Day 18）\n        results = self.store.search(embed([query])[0], top_k=3, min_score=0.55)\n        if not results:\n            return &quot;根据当前知识库，未找到相关信息。&quot;  # 检索层拒答\n\n        # 2. 生成带引用的回答（response_format 强制 JSON）\n        prompt = build_citation_prompt(query, results)\n        raw = self.llm_call(prompt, response_format={&quot;type&quot;: &quot;json_object&quot;})\n        rag_answer = RAGAnswer(**json.loads(raw))\n\n        # 3. 引用校验（三道防线）\n        validation = validate_citation(rag_answer, results)\n\n        # 4. 格式化展示（回答 + 引用区块 + 警告）\n        return format_cited_answer(rag_answer, results, validation)</code></pre><p>三个核心设计决策：</p><ul><li><strong>answer 与 sources 分离</strong>：<code>answer</code> 保持纯文本不含 <code>[1]</code> 标记，引用信息独立放在 <code>sources</code> 列表。展示时由程序决定标注方式（方括号、上标、超链接），而非让模型在自然语言中混入标记。好处是格式稳定、可程序化处理、展示灵活。</li></ul><ul><li><strong>三道防线分层校验</strong>：编号有效性（格式层）→ 拒答一致性（逻辑层）→ 内容匹配性（语义层），从简单到复杂递进。每层解决不同类型的虚构引用，防线 1 和 2 成本极低（纯逻辑判断），防线 3 用粗粒度关键词匹配保证零额外 API 成本。校验结果通过 <code>issues</code> 列表反馈给展示层，用户可以看到&quot;⚠ 引用 [3] 与回答内容不匹配&quot;的警告。</li></ul><ul><li><strong>校验结果不影响主流程</strong>：即使引用校验发现问题，系统仍然返回回答（附带警告），而不是直接拦截。原因：虚构引用的检测是&quot;概率性&quot;的（尤其防线 3 的关键词匹配可能有误报），直接拦截会导致误拒；让用户看到回答 + 警告，由用户自行判断更合理。生产环境可以根据 <code>issues</code> 数量设置分级策略（如 1 个 issue 只警告，3 个以上 issue 标记&quot;低可信度&quot;）。</li></ul>"}]},{"name":"第 3 周综合复盘","questions":[{"qnum":1,"qtext":"第 3 周（Day 15–20）六个主题之间是什么逻辑关系？RAG 各环节如何相互影响？","answerHtml":"<p>第 3 周这六个主题，其实是同一条数据流上六个连续的环节，目标是把私有文档转化成可信回答，是一条环环相扣的链条，前一环的输出就是后一环的输入。链条从 Day 16 读取文档开始，输入是磁盘上的文件，输出是干净的文本，这一步的噪音大小直接决定了后面的信噪比。接着是 Day 17 的文本切分，把干净文本切成一个个 Chunk，切分质量决定了检索的颗粒度粗还是细。然后是 Day 18，先做 Embedding，把 Chunks 转成向量索引，向量的质量决定了检索时相似度算得准不准；同样在 Day 18 里还要做向量检索，拿问题去查索引，找出相关的 Chunks，这一步的召回率直接决定了答案能达到的上限。再往下是 Day 19 的问答生成，把问题和检索到的 Chunks 一起交给模型去生成回答，这里 Prompt 的约束程度决定了回答忠不忠实。最后是 Day 20 的引用校验，对生成的回答和 Chunks 做校验，得到真正可信的回答，校验做得越严格，用户对系统的信任度就越高。</p><p><strong>串联依赖的关键结论</strong>：RAG 的质量上限由最弱的环节决定。再好的 LLM 也救不了&quot;文档噪音太多&quot;；再好的 Embedding 模型也救不了&quot;关键句子被切断到两个 Chunk 里&quot;。不能只调 Prompt，而忽略上游数据质量。</p>"},{"qnum":2,"qtext":"RAG 准确率主要受哪些环节影响？每个环节出问题时典型表现是什么？","answerHtml":"<p>RAG 准确率有两层：检索准确率（找到答案）和生成准确率（忠实表达答案），两者是串联关系——检索准确率是生成准确率的上界。</p><p>具体拆到每个环节看。文档读取环节，典型的表现是答案明明就在文档里，却硬是没被召回，根本原因往往是噪音把 Chunk 的向量稀释了，诊断的时候打印一下原始读取的文本，看看有没有页眉页脚这些乱码混进去。文本切分环节，典型表现是模型说&quot;资料不足&quot;，但其实答案内容是跨在两个相邻 Chunk 之间的，根本原因是语义边界被硬生生切断了，诊断方法是打印 Top-K 的 Chunks，看答案是不是被切成两半。Embedding 环节，典型表现是中文问题匹配不到中文文档，根本原因往往是用了纯英文的 Embedding 模型，这时候换成多语言模型，比如 paraphrase-multilingual-MiniLM，就能解决。相似度阈值这一块，典型表现是明明有答案的问题却被拒答了，根本原因通常是 <code>min_score</code> 设得太高，诊断的时候可以临时把阈值降到 0.0，看看是不是能召回，这样就能定位到底是不是阈值的问题。最后是 Prompt 约束环节，典型表现是模型混入了自己训练时学到的知识来回答，来源没法追溯，根本原因是约束指令写得不够明确，诊断方法就是在 System Prompt 里把&quot;没在资料里的内容必须拒答&quot;这句话说清楚。</p><p><strong>诊断优先级</strong>：先打印检索结果（<code>top_k=5, min_score=0.0</code>），确认答案在不在检索结果里；在的话改 Prompt，不在的话往上游（切分/读取）查。大多数&quot;答案不准&quot;问题出在检索层，不是生成层。</p>"},{"qnum":3,"qtext":"Chunk 切分策略为什么会直接影响 RAG 最终回答的质量？影响路径是什么？","answerHtml":"<p>切分影响质量有三条独立的传导路径：</p><p><strong>路径一：语义截断 → 向量失真 → 检索遗漏</strong></p><pre><code>&quot;退款需在 30 天内提交。提交后 3-5 天退回。&quot;\n     ↓  在&quot;提交&quot;后切断\nChunk A：&quot;退款需在 30 天内提交&quot;（不含处理时长）\nChunk B：&quot;提交后 3-5 天退回&quot;（不含前置条件）\n     ↓\n问&quot;退款处理多久&quot; → Chunk A、B 分别独立检索均不完整 → 回答残缺</code></pre><p><strong>路径二：Chunk 过小 → 上下文碎片化 → 生成质量差</strong></p><p>Chunk 过小时，一个完整意思散落在 5 个 Chunk 里，拼接后语义跳跃，LLM 无法整合出完整答案。</p><p><strong>路径三：Chunk 过大 → 向量被稀释 → 相似度虚低</strong></p><p>单个 Chunk 包含退款+发货+会员多话题时，与&quot;退款问题&quot;的相似度被非退款内容拉低，可能排名靠后而错过召回。</p><p><strong>实用参数选择</strong>：通用文档用 300 Token / 50 Token Overlap，先跑通再根据召回效果调整。Overlap 的作用是保证&quot;关键句子必然完整出现在至少一个 Chunk 里&quot;，不是越大越好（浪费存储和 API 成本）。</p>"},{"qnum":4,"qtext":"为什么引用来源在业务场景中比单纯的答案准确率更重要？","answerHtml":"<p>引用解决的不是&quot;答案对不对&quot;，而是&quot;用户能否验证答案&quot;——这是两个不同层次的问题。</p><p><strong>信任度不等于准确率</strong>：一个系统准确率 95% 意味着每 20 个问题有 1 个错误。如果没有引用，用户不知道哪 1 个是错的，只能选择全信或全不信。有了引用，用户可以在&quot;重要决策&quot;时验证，在&quot;日常查询&quot;时直接接受，建立有边界的信任。</p><p><strong>错误信息的传播成本</strong>：</p><pre><code>无引用系统的错误答案：\n  &quot;退款需要 3 天&quot; → 用户直接相信 → 告诉朋友 → 10 个人产生错误预期\n  → 企业直到大量投诉才发现问题\n\n有引用系统的错误答案：\n  &quot;退款需要 3 天 [1]&quot; + [1] 实际写的是&quot;5 天&quot;\n  → 用户查看原文，发现矛盾 → 反馈给企业 → 企业快速修复知识库</code></pre><p><strong>业务必要性按场景</strong>：企业客服和法律/医疗场景中，错误答案可能导致法律纠纷（如错误承诺退款时间），引用使企业能追溯答案来源，证明&quot;我们的答案来自这份政策文档&quot;；内部工作助手中，员工向上级说明依据时需要引用原始政策文件，而不是&quot;AI 说的&quot;。</p>"},{"qnum":5,"qtext":"如果让你从零搭建一个\"第 3 周成果汇总\"完整 RAG Demo，你会如何设计它的架构？","answerHtml":"<p>核心设计原则：<strong>模块接口清晰 + 组件可替换 + 每步可观测</strong>。</p><pre><code>week3_rag/\n├── document_loader.py  # Document dataclass + load_txt/load_md/load_pdf\n├── text_splitter.py    # RecursiveCharacterSplitter（可配置 size/overlap）\n├── embedding.py        # EmbeddingModel（API 版/本地版可切换）\n├── vector_store.py     # VectorStore（numpy → FAISS → Chroma 可升级）\n├── rag_generator.py    # build_prompt + 约束生成 + 双层拒答\n├── citation.py         # RAGAnswer + validate_citation（三道防线）\n└── rag_pipeline.py     # RAGPipeline.build() + RAGPipeline.ask()</code></pre><pre><code class=\"language-python\"># rag_pipeline.py — 核心组合逻辑\nclass RAGPipeline:\n    def build(self, docs: list[Document]) -&gt; None:\n        chunks = [c for doc in docs for c in self.splitter.split(doc.text)]\n        sources = [doc.source for doc in docs for _ in self.splitter.split(doc.text)]\n        vecs = self.embedder.embed(chunks)\n        self.store.add(chunks, vecs, sources)\n\n    def ask(self, query: str) -&gt; str:\n        results = self.store.search(self.embedder.embed([query])[0], top_k=3, min_score=0.55)\n        if not results:\n            return &quot;根据当前知识库，未找到相关信息。&quot;\n        raw = self.llm_call(build_citation_prompt(query, results))\n        rag_answer = RAGAnswer(**json.loads(raw))\n        validation = validate_citation(rag_answer, results)\n        return format_cited_answer(rag_answer, results, validation)</code></pre><p><strong>三个关键工程决策</strong>：</p><ul><li><strong><code>build</code> 与 <code>ask</code> 严格分离</strong>：索引只建一次，<code>ask</code> 每次只做&quot;问题向量化 + 检索 + 生成&quot;，不重复向量化文档。这是 RAG 性能的根本保证。</li></ul><ul><li><strong>每层输入输出用数据类约束</strong>：<code>Document</code>、<code>RAGAnswer</code> 用 dataclass 定义，不用裸字典。换组件时只改实现，接口不变，上层代码零修改。</li></ul><ul><li><strong>校验结果展示，不拦截</strong>：<code>validate_citation</code> 的问题通过 <code>issues</code> 列表附加到回答末尾（⚠ 警告），不直接丢弃回答。理由：关键词匹配是粗粒度的，误报率不低；让用户看到警告自行判断，比&quot;悄悄丢弃&quot;更透明。</li></ul>"}]},{"name":"Tool Calling 基础","questions":[{"qnum":1,"qtext":"\"回答问题\"和\"调用工具做事\"的本质区别是什么？","answerHtml":"<p>两者可以从四个维度对比：数据来源上，普通对话靠的是训练时冻结的知识，Tool Calling 则是运行时从外部实时获取；是否有副作用上，普通对话没有副作用，只生成文字，Tool Calling 则可能有副作用，可以写数据库、发邮件、调用 API；回答依据上，普通对话依据的是模型的&quot;记忆&quot;，Tool Calling 依据的是外部系统返回的确定性结果；数据新鲜度上，普通对话受知识截止日期的限制，Tool Calling 则每次调用都能拿到最新数据。</p><p><strong>直觉类比</strong>：普通对话的模型像一本百科全书（只能告诉你书里写的内容）；Tool Calling 的模型像一个带手机的顾问（可以实时搜索、打电话，告诉你现在的真实情况）。</p><p>问&quot;今天北京天气&quot;：普通对话只能给出泛泛的季节性描述；Tool Calling 可以调用天气 API 返回今天的实时温度。</p>"},{"qnum":2,"qtext":"Tool Calling 的完整交互流程是什么？每一步做了什么？","answerHtml":"<p>完整流程分五步，横跨两次 API 调用。第一步由你的代码来做，把工具定义，也就是 tools 参数，加上对话历史一起发给模型。第二步由模型来做，判断这次请求是否需要用到工具，如果需要，就返回 tool_calls，而不是直接给出普通的文字回答。第三步又轮到你的代码，负责解析 tool_calls，执行对应的 Python 函数，拿到执行结果。第四步还是你的代码，把工具返回的结果包装成 role 为 tool 的消息，追加进对话历史，再一次发给模型。第五步由模型完成，基于工具返回的结果，生成最终的自然语言回答。</p><pre><code class=\"language-python\"># Step 2 的关键检查\nmsg = response.choices[0].message\nif msg.tool_calls:        # 需要调用工具\n    for tc in msg.tool_calls:\n        result = dispatch(tc.function.name, json.loads(tc.function.arguments))\n        messages.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                         &quot;content&quot;: json.dumps(result)})\n    # Step 5：第二次 create()\n    final = client.chat.completions.create(model=..., messages=messages, tools=TOOLS)\nelse:                     # 直接回答，不需要工具\n    answer = msg.content</code></pre><p><code>tool_call_id</code> 的作用：当模型一次返回多个 <code>tool_calls</code> 时，每个工具结果通过 <code>id</code> 对应到具体请求，避免混淆。</p>"},{"qnum":3,"qtext":"工具定义（Function Schema）中 name、description、parameters 各有什么作用？如何写好 description？","answerHtml":"<p>三个字段各有各自的作用：<code>name</code> 是模型在 <code>tool_calls</code> 里用来标记要调用哪个函数的名字，命名不清晰的话，调试时会难以识别；<code>description</code> 是模型判断&quot;是否该调用这个工具&quot;的依据，描述模糊会导致模型调错工具或者不调工具；<code>parameters</code> 用 JSON Schema 格式告诉模型该传什么参数，约束写得不清楚，模型就容易传错类型或遗漏必填项。</p><p><strong>写好 description 的四个要素</strong>：</p><pre><code class=\"language-python\"># 好的 description\n&quot;获取指定城市的当前实时天气，返回温度（摄氏度）、天气状况和风速。&quot;\n&quot;仅适用于查询当前天气，不支持历史数据和未来预报。&quot;\n\n# 要素分解：\n# 1. 工具能做什么：&quot;获取指定城市的当前实时天气&quot;\n# 2. 返回什么格式：&quot;返回温度（摄氏度）、天气状况和风速&quot;\n# 3. 适用边界：&quot;仅适用于当前天气查询&quot;\n# 4. 不适用场景：&quot;不支持历史数据和未来预报&quot;（防止滥用）</code></pre><p><strong>参数 description 同样重要</strong>：每个参数的 <code>description</code> 字段告诉模型如何填写该参数，如 <code>&quot;城市名称，例如'北京'、'上海'&quot;</code> 比 <code>&quot;城市&quot;</code> 对模型更有指导意义。</p>"},{"qnum":4,"qtext":"如何从零实现一个最小的 Tool Calling Demo？描述关键代码的设计思路。","answerHtml":"<p>最小实现的三个核心设计：<strong>工具注册分离、统一分发器、两次 API 调用</strong>。</p><pre><code class=\"language-python\"># 1. 工具定义（JSON Schema）与实现函数分开管理\nTOOLS = [{&quot;type&quot;: &quot;function&quot;, &quot;function&quot;: {\n    &quot;name&quot;: &quot;get_weather&quot;,\n    &quot;description&quot;: &quot;获取城市实时天气&quot;,\n    &quot;parameters&quot;: {&quot;type&quot;: &quot;object&quot;,\n                   &quot;properties&quot;: {&quot;city&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;城市名&quot;}},\n                   &quot;required&quot;: [&quot;city&quot;]}\n}}]\n\ndef get_weather(city: str) -&gt; dict:\n    return {&quot;city&quot;: city, &quot;temp&quot;: 25, &quot;condition&quot;: &quot;晴&quot;}  # 真实场景调外部 API\n\n# 2. 统一分发器：将模型返回的函数名映射到实际函数\nTOOL_FUNCTIONS = {&quot;get_weather&quot;: get_weather}\ndef dispatch_tool(name, args): return TOOL_FUNCTIONS[name](**args)\n\n# 3. 两次 API 调用的核心逻辑\ndef chat_with_tools(user_input: str) -&gt; str:\n    messages = [{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input}]\n    # 第一次：模型决策\n    resp = client.chat.completions.create(model=&quot;deepseek-chat&quot;,\n                                          messages=messages, tools=TOOLS, tool_choice=&quot;auto&quot;)\n    msg = resp.choices[0].message\n    if not msg.tool_calls:\n        return msg.content   # 不需要工具，直接返回\n    # 执行工具\n    messages.append(msg)\n    for tc in msg.tool_calls:\n        result = dispatch_tool(tc.function.name, json.loads(tc.function.arguments))\n        messages.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                         &quot;content&quot;: json.dumps(result, ensure_ascii=False)})\n    # 第二次：生成最终回答\n    final = client.chat.completions.create(model=&quot;deepseek-chat&quot;, messages=messages, tools=TOOLS)\n    return final.choices[0].message.content</code></pre><p><strong>三个设计决策的理由</strong>：</p><ul><li><strong>工具注册与实现分离</strong>：<code>TOOLS</code>（Schema）和 <code>TOOL_FUNCTIONS</code>（函数）解耦，新增工具只加一行 Schema + 一个函数，主流程零改动</li><li><strong>统一分发器</strong>：把 <code>if name == &quot;get_weather&quot;: ...</code> 的条件分支改成字典映射，可扩展性强，且工具名错误时能统一报错</li><li><strong><code>tool_choice=&quot;auto&quot;</code></strong>：让模型自己判断是否调用工具；<code>&quot;none&quot;</code> 禁用工具（测试用），<code>&quot;required&quot;</code> 强制调用（特殊场景）</li></ul>"}]},{"name":"定义工具","questions":[{"qnum":1,"qtext":"工具参数设计有哪些核心原则？必填参数和可选参数如何决策？","answerHtml":"<p>工具参数不是给人用的，是给 <strong>LLM 填写</strong>的——设计目标是让模型在不需要额外解释的情况下正确填写每个参数。</p><p><strong>四个核心原则</strong>：核心原则大概有四条。第一，参数名一定要自解释，比如 <code>city</code> 就比 <code>c</code> 好，<code>user_id</code> 就比 <code>uid</code> 好，最忌讳的反例是参数名叫 <code>data</code>、描述也只写&quot;数据&quot;两个字，这种命名等于没给模型任何信息。第二，每个参数只传一类信息，比如城市和国家应该拆成两个参数，而不是像 <code>location: &quot;中国北京&quot;</code> 这样把好几种信息硬塞进一个&quot;地址&quot;参数里。第三，参数数量最好控制在 5 个以内，超过了就该考虑拆成多个工具，反面例子就是一个工具塞了 15 个参数，模型填起来根本记不住。第四，可选参数要给个合理的默认值，比如 <code>unit=&quot;celsius&quot;</code>，不能让模型每次都得手动填一个本来就可以有默认值的可选项。</p><p><strong>必填 vs 可选决策</strong>：工具在没有这个参数时能正常运行 → 可选；不能 → 必填。如果有默认行为，必须在 description 里说明缺省时的行为。</p><p><strong>enum 的作用</strong>：选项型参数用 enum 锁定所有合法值，比只写 description 的限制效果强得多：</p><pre><code class=\"language-python\"># 弱约束：模型可能填 &quot;celsius&quot;、&quot;c&quot;、&quot;摄氏度&quot; 等不一致的值\n&quot;unit&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;description&quot;: &quot;温度单位&quot;}\n\n# 强约束：模型只能填这两个值\n&quot;unit&quot;: {&quot;type&quot;: &quot;string&quot;, &quot;enum&quot;: [&quot;celsius&quot;, &quot;fahrenheit&quot;]}</code></pre>"},{"qnum":2,"qtext":"工具函数的返回值应该如何设计才对 LLM\"友好\"？","answerHtml":"<p>LLM 会把工具返回值序列化成字符串传入对话，设计原则是<strong>让模型容易理解和引用</strong>。</p><p><strong>三个设计原则</strong>：</p><ul><li><strong>平铺优于嵌套</strong>：模型处理 <code>result[&quot;rate&quot;]</code> 比 <code>result[&quot;data&quot;][&quot;exchange&quot;][&quot;rate&quot;]</code> 更可靠</li><li><strong>包含语义上下文</strong>：数值旁边附上单位和含义</li><li><strong>提供 summary 字段</strong>：预先整合的自然语言描述，模型可以直接引用</li></ul><pre><code class=\"language-python\"># 不友好（缩写字段名 + 纯数字 + 深嵌套）\n{&quot;t&quot;: 25, &quot;c&quot;: &quot;sun&quot;, &quot;data&quot;: {&quot;w&quot;: {&quot;speed&quot;: 3}}}\n\n# 友好（自解释 + 有单位 + 有 summary）\n{\n    &quot;city&quot;: &quot;北京&quot;,\n    &quot;temperature_celsius&quot;: 25,\n    &quot;condition&quot;: &quot;晴天&quot;,\n    &quot;wind_level&quot;: &quot;3 级&quot;,\n    &quot;summary&quot;: &quot;北京今天晴天，25°C，3 级风，适合户外活动&quot;\n}</code></pre><p><strong>summary 的价值</strong>：为复杂数据提供预先整合好的自然语言描述，模型无需自己拼接多个字段，减少幻觉风险。特别是在数据有多个维度时（天气 = 温度 + 天气状况 + 风速 + 湿度），summary 可以帮助模型生成更准确、更流畅的回答。</p>"},{"qnum":3,"qtext":"工具出错时应该返回错误 dict 还是抛异常？两种方式有什么区别？","answerHtml":"<p>这里推荐返回错误 dict，而不是直接抛异常，理由可以从几个方面来看。对话流程上，抛异常会把整个流程打断，还得在 dispatch 层专门去捕获它；返回错误 dict 就不会中断流程，错误信息可以直接当作正常内容传给模型。模型能不能感知到也不一样，抛异常的话模型根本看不到发生了什么错误，而返回错误 dict，模型能读到里面的 message，还能据此生成友好的提示。用户体验上差别更大，抛异常搞不好会导致程序崩溃，或者把一堆技术栈信息甩给用户看，返回错误 dict 的话，模型可以顺势解释&quot;城市名好像不对，您是不是想查……&quot;这种更人性化的话。所以适用场景也不一样：抛异常更适合程序级的、没法恢复的错误，比如配置错误；返回错误 dict 更适合业务级的、可以解释清楚的错误，比如输入无效、API 超时这些。</p><pre><code class=\"language-python\"># 标准错误返回格式\ndef get_weather(city: str) -&gt; dict:\n    if not city.strip():\n        return {&quot;error&quot;: True, &quot;message&quot;: &quot;城市名不能为空&quot;}   # 模型能读懂并向用户解释\n    result = call_api(city)\n    if result is None:\n        return {&quot;error&quot;: True, &quot;message&quot;: f&quot;未找到城市 '{city}' 的天气数据，请检查名称&quot;}\n    return result</code></pre><p>当模型接收到 <code>{&quot;error&quot;: True, &quot;message&quot;: &quot;未找到城市 'Abc' 的天气数据&quot;}</code> 时，它可以生成&quot;抱歉，我没有找到 Abc 的天气数据，请确认城市名称是否正确，或者尝试英文名称&quot;，而不是让程序崩溃。</p>"},{"qnum":4,"qtext":"如何验证工具定义（Function Schema）的质量？有哪些常见的规范问题？","answerHtml":"<p>工具 Schema 的质量直接影响模型是否能正确判断&quot;何时调用&quot;和&quot;如何填参数&quot;，上线前应该做系统性检查。</p><p><strong>常见规范问题</strong>：常见的规范问题大概有五类。第一类是 description 写得太短，表现就是不到 20 个字，也缺关键信息，修复方式是把&quot;这个工具能做什么、适用边界在哪&quot;补充完整。第二类是参数缺少 description，表现是模型只能靠猜参数名字来理解含义，修复方式是给每个参数都补上 description 和示例。第三类是选项型参数没用 enum，表现是模型可能填出各种不一致的值，修复方式就是加上 <code>&quot;enum&quot;: [...]</code> 把取值范围锁死。第四类是必填参数设得太多，表现是本来可以给默认值、设成可选的参数，也被设成了必填，修复方式是把能有默认值的参数都改成可选。第五类是工具描述之间互相重叠，表现是两个工具功能看起来差不多，模型不知道该选哪个，修复方式是在 description 里把各自的使用边界说清楚。</p><pre><code class=\"language-python\">def validate_tool_schema(schema: dict) -&gt; list[str]:\n    issues = []\n    fn = schema.get(&quot;function&quot;, {})\n    if not fn.get(&quot;description&quot;) or len(fn[&quot;description&quot;]) &lt; 20:\n        issues.append(&quot;description 过短，建议 ≥ 20 字&quot;)\n    for name, param in fn.get(&quot;parameters&quot;, {}).get(&quot;properties&quot;, {}).items():\n        if not param.get(&quot;description&quot;):\n            issues.append(f&quot;参数 '{name}' 缺少 description&quot;)\n    return issues</code></pre><p><strong>实际验证方法</strong>：schema 静态检查之外，还要<strong>实测模型行为</strong>——用 5–10 个不同措辞的问题测试工具能否被正确触发，以及参数填写是否准确。</p>"},{"qnum":5,"qtext":"如何从零设计一个可被 LLM 调用的工具库？描述模块结构和关键设计决策。","answerHtml":"<p>核心设计原则：<strong>工具实现与 Schema 定义同文件、统一分发器、工具可独立测试</strong>。</p><pre><code>tools/\n├── __init__.py          # 汇总所有工具的 SCHEMA + 分发器\n├── weather.py           # get_weather 函数 + WEATHER_TOOL_SCHEMA\n├── exchange_rate.py     # get_exchange_rate 函数 + EXCHANGE_RATE_TOOL_SCHEMA\n├── knowledge_base.py    # search_knowledge_base 函数 + KB_TOOL_SCHEMA\n└── tests/\n    └── test_tools.py    # 每个工具的独立测试（正常路径 + 错误路径）</code></pre><pre><code class=\"language-python\"># tools/__init__.py — 统一入口\nfrom .weather import get_weather, WEATHER_TOOL_SCHEMA\nfrom .exchange_rate import get_exchange_rate, EXCHANGE_RATE_TOOL_SCHEMA\nfrom .knowledge_base import search_knowledge_base, KNOWLEDGE_BASE_TOOL_SCHEMA\n\nALL_TOOLS = [WEATHER_TOOL_SCHEMA, EXCHANGE_RATE_TOOL_SCHEMA, KNOWLEDGE_BASE_TOOL_SCHEMA]\n\nTOOL_REGISTRY = {\n    &quot;get_weather&quot;: get_weather,\n    &quot;get_exchange_rate&quot;: get_exchange_rate,\n    &quot;search_knowledge_base&quot;: search_knowledge_base,\n}\n\ndef dispatch(name: str, args: dict) -&gt; dict:\n    if name not in TOOL_REGISTRY:\n        return {&quot;error&quot;: True, &quot;message&quot;: f&quot;未知工具：{name}&quot;}\n    return TOOL_REGISTRY[name](**args)</code></pre><p><strong>三个关键设计决策</strong>：</p><ul><li><strong>Schema 与实现同文件</strong>：<code>WEATHER_TOOL_SCHEMA</code> 和 <code>get_weather</code> 在同一个文件里，避免修改函数参数时忘记同步 Schema，减少&quot;Schema 和实现不一致&quot;的 bug</li></ul><ul><li><strong>统一分发器 + 注册表</strong>：<code>TOOL_REGISTRY</code> 字典替代 <code>if/elif</code> 条件分支，新增工具只加一行注册，不改主流程；工具名不存在时统一报错</li></ul><ul><li><strong>工具必须能独立运行</strong>：每个工具文件的 <code>if __name__ == &quot;__main__&quot;</code> 块可以直接运行测试，不依赖 LLM 环境——这是发现参数设计问题的最快方式，在接入模型之前就能排除大部分问题</li></ul>"}]},{"name":"多步工作流","questions":[{"qnum":1,"qtext":"单步工具调用和多步工作流在结构上有什么本质区别？","answerHtml":"<p>核心区别是<strong>工具调用次数是否在运行时确定</strong>：具体说来，核心区别在于工具调用的次数是不是在运行时才能确定下来。先看 API 调用次数，单步是固定的 2 次，一次决策一次生成；多步则是 N+1 次，这个 N 完全由模型自己决定要调几次。实现结构上也不一样，单步的写法很简单，就是&quot;如果有 tool_calls 就执行一次，然后再调一次生成最终回答&quot;；多步的写法是用一个循环，&quot;while iteration &lt; max_iter，每轮执行工具调用，如果没有 tool_calls 了就 break 跳出&quot;。调用链的长度上，单步最多只能调 1 个工具，多步可以从 0 一直调到 max_iter 那么多个。适用的问题类型也不同，单步适合查单一数据源的问题，比如&quot;北京天气怎么样&quot;；多步则适合需要综合多个数据源的问题，比如&quot;我要去上海出差，带 500 美元够不够花，那边天气怎么样&quot;这种。</p><p>单步 = 固定两次 API 调用；多步 = 循环 N+1 次，N 由模型在每一轮的 <code>tool_calls</code> 是否为空决定。</p>"},{"qnum":2,"qtext":"多步工作流中的循环应该什么时候退出？有哪些终止条件？","answerHtml":"<p>有三种退出条件，<strong>前两种是必须实现的</strong>：</p><p><strong>条件 1（正常）：模型不再请求工具</strong></p><pre><code class=\"language-python\">if not msg.tool_calls:\n    return msg.content   # 模型认为信息已够，直接回答</code></pre><p>这是最理想的退出方式，模型自主判断&quot;我已经有足够信息了&quot;。</p><p><strong>条件 2（安全）：达到最大迭代次数 <code>max_iterations</code></strong></p><pre><code class=\"language-python\">for iteration in range(max_iter):\n    ...\nelse:\n    # for 循环正常结束（未被 break 打断）= 达到上限\n    return force_generate_answer(messages)</code></pre><p>防止模型在工具返回错误或 Bug 时无限调用，产生大量 API 费用。</p><p><strong>条件 3（可选）：连续 N 次工具调用均返回错误</strong></p><pre><code class=\"language-python\">consecutive_errors += 1\nif consecutive_errors &gt;= 3:\n    return &quot;工具暂时不可用，请稍后再试。&quot;</code></pre><p>适合对可靠性要求高的生产场景。</p>"},{"qnum":3,"qtext":"为什么多步工作流必须设置 max_iterations 上限？不设置会有什么风险？","answerHtml":"<p><code>max_iterations</code> 是多步工作流的<strong>安全阀</strong>，防止两类问题：</p><p><strong>风险 1：模型 Bug 导致无限循环</strong></p><pre><code>异常场景：工具返回了空结果 {}，模型认为&quot;还需要数据&quot;继续调用 → 工具还是返回空 → ...\n无上限：无限循环直到 API 超时或账单耗尽\n有上限：第 6 次迭代强制退出，生成基于已有信息的回答</code></pre><p><strong>风险 2：Token 成本累积超预期</strong></p><pre><code>第 N 次 API 调用的输入 Token = Σ(前 N-1 次的所有工具调用结果) + 系统提示 + 用户输入\n→ 随迭代次数增加，每次调用的 Token 消耗线性增长\n→ 10 次迭代的总 Token ≈ 1 次的 4–5 倍\n\n有上限：明确限制最大成本区间，避免单次对话成本暴增</code></pre><p><strong>推荐值</strong>：通用助手 <code>max_iter=5</code>；复杂 Agent <code>max_iter=10</code>；生产环境根据 <code>预算 / 单次平均成本</code> 计算。</p>"},{"qnum":4,"qtext":"多步工作流的\"可观测性\"指什么？如何实现调用链日志？","answerHtml":"<p>可观测性指能从外部看清楚工作流内部每一步发生了什么，包含三个层次：</p><ul><li><strong>层次 1（基础）</strong>：调用了几次工具、分别是哪些</li><li><strong>层次 2（调试）</strong>：每次调用的入参、出参（能定位&quot;哪一步出了问题&quot;）</li><li><strong>层次 3（审计）</strong>：每次调用的耗时、Token 消耗、决策理由</li></ul><p><strong>实现要点</strong>：</p><pre><code class=\"language-python\">for iteration in range(max_iter):\n    # 记录决策\n    logger.info(&quot;[迭代 %d] 工具：%s&quot;, iteration, [tc.function.name for tc in msg.tool_calls])\n    \n    for tc in msg.tool_calls:\n        t = time.monotonic()\n        result = registry[tc.function.name](**args)\n        \n        # 记录工具结果（用 summary 字段，避免日志过长）\n        logger.info(&quot;  %s(%s) → %s（%.3fs）&quot;, tc.function.name, args,\n                    result.get(&quot;summary&quot;, str(result)[:60]), time.monotonic() - t)</code></pre><p>同时可以把每步记录到 <code>WorkflowResult.steps</code>（dataclass），用于：</p><ul><li>事后分析哪类问题会触发几步工具调用</li><li>将调用链展示在 UI 界面上（Day 26 的需求）</li><li>计算平均工具调用次数，优化 max_iter 设置</li></ul>"},{"qnum":5,"qtext":"如何从零实现一个支持多步推理、带调用链记录的工作流 Demo？描述关键设计决策。","answerHtml":"<p>核心设计：<strong>while 循环 + max_iter 安全上限 + for-else 强制生成 + WorkflowResult 记录</strong>。</p><pre><code class=\"language-python\">@dataclass\nclass WorkflowResult:\n    user_input: str\n    final_answer: str\n    steps: list = field(default_factory=list)  # 每步 ToolStep 记录\n    terminated_by: str = &quot;model_done&quot;          # &quot;model_done&quot; | &quot;max_iterations&quot;\n\ndef run_workflow(user_input, max_iter=6):\n    wf = WorkflowResult(user_input=user_input)\n    messages = [system_msg, {&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input}]\n    \n    for iteration in range(max_iter):\n        msg = client.chat.completions.create(\n            model=&quot;deepseek-chat&quot;, messages=messages,\n            tools=TOOLS, tool_choice=&quot;auto&quot;, temperature=0,\n        ).choices[0].message\n        \n        if not msg.tool_calls:      # ← 正常退出\n            wf.final_answer = msg.content\n            wf.terminated_by = &quot;model_done&quot;\n            break\n        \n        messages.append(msg)\n        for tc in msg.tool_calls:\n            result = TOOL_REGISTRY.get(tc.function.name, bad_tool)(**json.loads(tc.function.arguments))\n            wf.steps.append(ToolStep(tc.function.name, ...))\n            messages.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                             &quot;content&quot;: json.dumps(result, ensure_ascii=False)})\n    \n    else:   # for-else：循环未被 break 打断，说明达到 max_iter   ← 安全退出\n        wf.terminated_by = &quot;max_iterations&quot;\n        wf.final_answer = client.chat.completions.create(model=&quot;deepseek-chat&quot;,\n            messages=messages, temperature=0).choices[0].message.content\n    \n    return wf</code></pre><p><strong>五个关键设计决策</strong>：</p><ul><li><strong>for-else 语义</strong>：<code>for</code> 循环被 <code>break</code> 打断 → 正常退出（不执行 <code>else</code>）；循环跑完 → 达上限（执行 <code>else</code>），天然区分两种退出路径</li><li><strong>WorkflowResult dataclass</strong>：记录每步 ToolStep，支持事后分析和 UI 展示</li><li><strong>强制生成兜底</strong>：达到上限后不直接报错，而是基于已有历史消息调一次 API 生成尽量有用的回答</li><li><strong><code>temperature=0</code></strong>：每次决策调用都用 0，保证同一问题的调用顺序可预测、可复现</li><li><strong>工具错误 dict 而非 raise</strong>：工具返回 <code>{&quot;error&quot;: True, ...}</code> 让模型感知并处理，而不是程序崩溃</li></ul>"}]},{"name":"单工具调用 Demo","questions":[{"qnum":1,"qtext":"tool_choice 参数的 auto / none / required 三种模式有什么区别？各适用于什么场景？","answerHtml":"<p><code>tool_choice</code> 控制模型在收到工具列表后的决策行为，三种模式对应三种不同的强制程度：<code>&quot;auto&quot;</code>（默认）让模型自主判断是否调用工具，需要时返回 <code>tool_calls</code>，不需要时直接回答，适合通用对话助手这种用户可能问任何问题的场景；<code>&quot;none&quot;</code> 会禁用所有工具，即使注册了工具也不会调用，只用训练知识回答，适合做基线测试（对比有无工具时的回答质量）；<code>&quot;required&quot;</code> 则强制模型必须调用至少一个工具，不允许直接文字回答，适合信息抽取流水线这种需要保证每条输入都走工具路径的场景。</p><p>还可以指定具体工具：</p><pre><code class=\"language-python\">tool_choice={&quot;type&quot;: &quot;function&quot;, &quot;function&quot;: {&quot;name&quot;: &quot;get_weather&quot;}}\n# → 强制调用 get_weather，参数由模型填写</code></pre><p>适用于批量抽取（强制每条数据都调用 <code>extract_info</code>）或测试特定工具的参数填写是否正确。</p><p><strong>生产环境默认用 <code>&quot;auto&quot;</code></strong>，它最符合用户期望：该触发时触发，不该触发时直接回答。</p>"},{"qnum":2,"qtext":"模型决定是否调用工具的依据是什么？哪些因素会影响触发稳定性？","answerHtml":"<p>模型的触发决策基于三个维度：</p><ul><li><strong>用户意图与工具能力的匹配度</strong>：用户问&quot;今天北京天气&quot; + <code>get_weather</code> → 高匹配 → 触发；问&quot;Python 是什么&quot; + <code>get_weather</code> → 无匹配 → 不触发</li></ul><ul><li><strong>工具 description 的清晰程度</strong>：</li></ul><pre><code>   模糊：&quot;获取数据&quot;\n   → 模型不知道什么时候用，触发边界不稳定\n   \n   清晰：&quot;获取指定城市的当前实时天气，仅适用于当前天气查询，不支持历史天气&quot;\n   → 模型准确知道触发边界，&quot;北京历史最冷温度&quot;不触发，&quot;今天北京天气&quot;触发</code></pre><ul><li><strong>模型对自身知识的自信度</strong>：基础知识问题（&quot;GIL 是什么&quot;）模型直接回答；实时状态问题（&quot;今天天气&quot;）倾向调用工具</li></ul><p><strong>提高触发稳定性的方法</strong>：</p><ul><li>优化 description：在 description 中明确&quot;适用于...&quot;和&quot;不适用于...&quot;的边界</li><li>添加 System Prompt 指导：<code>&quot;当用户询问任何当前天气时，必须先调用 get_weather 工具&quot;</code></li><li>设置 <code>temperature=0</code>：降低随机性，让触发行为更一致</li></ul>"},{"qnum":3,"qtext":"工具调用的完整 Demo 应该包含哪些要素？如何添加日志和耗时统计？","answerHtml":"<p>一个生产级 Demo 需要覆盖完整的&quot;决策 → 执行 → 回答&quot;闭环，并且可观测：</p><p><strong>核心要素</strong>：</p><ul><li>工具定义（Schema）和执行函数分离，通过注册表（<code>TOOL_REGISTRY</code>）关联</li><li>两次 API 调用结构：第一次决策（是否调用工具），第二次生成（基于工具结果回答）</li><li>分发器处理工具执行，统一处理未知工具和参数错误</li><li>工具错误时返回错误 dict 而不是抛异常，让模型生成友好提示</li></ul><p><strong>日志和耗时统计</strong>：</p><pre><code class=\"language-python\">import logging, time\n\nlogger = logging.getLogger(__name__)\n\ndef chat(user_input, history):\n    # 第一次调用：决策\n    t0 = time.monotonic()\n    resp1 = client.chat.completions.create(...)\n    elapsed1 = time.monotonic() - t0\n    \n    if not msg.tool_calls:\n        logger.info(&quot;直接回答（%.2fs，无工具调用）&quot;, elapsed1)\n        return msg.content, history\n    \n    logger.info(&quot;模型决定调用 %d 个工具（%.2fs）&quot;, len(msg.tool_calls), elapsed1)\n    \n    for tc in msg.tool_calls:\n        t_tool = time.monotonic()\n        result = TOOL_REGISTRY[tc.function.name](**args)\n        logger.info(&quot;  ← 工具返回（%.3fs）：%s&quot;, time.monotonic() - t_tool, result.get(&quot;summary&quot;))\n    \n    # 第二次调用：生成\n    t2 = time.monotonic()\n    ...\n    logger.info(&quot;最终回答（%.2fs）&quot;, time.monotonic() - t2)</code></pre><p>日志的核心价值：在调试时能清楚看到&quot;模型有没有调工具、调了哪个工具、工具返回了什么、最终回答是什么&quot;，不需要逐行 print。</p>"},{"qnum":4,"qtext":"多轮对话中为什么不能把 tool_calls 消息从历史里删掉？","answerHtml":"<p>因为 <code>tool_calls</code> 消息（<code>role: assistant</code>）和 <code>tool</code> 消息（<code>role: tool</code>）是一对强绑定的记录——<code>tool</code> 消息里的 <code>tool_call_id</code> 必须和对应 <code>assistant</code> 消息里的 <code>tc.id</code> 一致，模型用这个 ID 配对&quot;哪个工具结果对应哪次调用&quot;。</p><pre><code>完整消息历史（含工具调用轮次）：\n\n[system]    &quot;你是智能助手...&quot;\n[user]      &quot;北京天气怎么样？&quot;\n[assistant] {tool_calls: [{id: &quot;call_abc&quot;, name: &quot;get_weather&quot;, args: ...}]}  ← 不能删\n[tool]      {tool_call_id: &quot;call_abc&quot;, content: &quot;北京晴，22°C&quot;}               ← 不能删\n[assistant] &quot;北京今天晴天，22°C，非常适合出行。&quot;\n[user]      &quot;上海呢？&quot;</code></pre><p><strong>删掉会怎样</strong>：</p><ul><li>如果只保留最终 <code>assistant</code> 回答（删掉 <code>tool_calls</code> 和 <code>tool</code> 消息），下一轮模型不知道第 1 轮是通过工具获取了实时天气，可能会认为&quot;北京晴，22°C&quot;是模型自己的判断，而非真实数据，导致第 2 轮误用</li><li>API 层面：如果删掉 <code>tool_calls</code> 但保留 <code>tool</code> 消息（<code>tool_call_id</code> 找不到对应的 <code>assistant</code> 消息），API 会直接报错</li></ul>"},{"qnum":5,"qtext":"如何从零实现一个支持多轮对话、带日志记录的单工具调用完整 Demo？描述关键设计决策。","answerHtml":"<p>核心设计：<strong>共享消息历史 + 日志记录每步 + 错误返回 dict + 工具注册表解耦</strong>。</p><pre><code class=\"language-python\">SYSTEM_PROMPT = &quot;你是智能助手，可查询天气和汇率，询问实时信息时优先使用工具。&quot;\nTOOL_REGISTRY = {&quot;get_weather&quot;: get_weather, &quot;get_exchange_rate&quot;: get_exchange_rate}\n\ndef chat(user_input: str, history: list = None) -&gt; tuple[str, list]:\n    if history is None:\n        history = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: SYSTEM_PROMPT}]\n    history.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_input})\n    \n    # 第一次调用：让模型决策\n    msg = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=history,\n        tools=TOOLS, tool_choice=&quot;auto&quot;, temperature=0,\n    ).choices[0].message\n    \n    if not msg.tool_calls:\n        history.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: msg.content})\n        return msg.content, history\n    \n    history.append(msg)  # 必须完整保留 tool_calls 消息\n    for tc in msg.tool_calls:\n        result = TOOL_REGISTRY.get(tc.function.name,\n                     lambda **_: {&quot;error&quot;: True, &quot;message&quot;: &quot;未知工具&quot;}\n                 )(**json.loads(tc.function.arguments))\n        history.append({&quot;role&quot;: &quot;tool&quot;, &quot;tool_call_id&quot;: tc.id,\n                        &quot;content&quot;: json.dumps(result, ensure_ascii=False)})\n    \n    # 第二次调用：生成最终回答\n    answer = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=history, tools=TOOLS, temperature=0,\n    ).choices[0].message.content\n    history.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: answer})\n    return answer, history\n\n# 使用方式（多轮）\nhistory = None\nfor q in [&quot;北京今天天气？&quot;, &quot;上海呢？两个城市哪个更热？&quot;, &quot;1000人民币换多少美元？&quot;]:\n    answer, history = chat(q, history)\n    print(f&quot;Q: {q}\\nA: {answer}\\n&quot;)</code></pre><p><strong>五个关键设计决策</strong>：</p><ul><li><strong><code>history</code> 跨轮共享</strong>：函数返回更新后的 <code>history</code>，由调用方持有并传入下一轮，实现多轮记忆</li><li><strong><code>tool_calls</code> 完整入历史</strong>：直接 <code>history.append(msg)</code>，保留 <code>tool_calls</code> 原始对象，防止 <code>tool_call_id</code> 对不上</li><li><strong><code>TOOL_REGISTRY</code> 字典分发</strong>：比 <code>if/elif</code> 可扩展，新增工具只加一行注册</li><li><strong>工具错误返回 dict</strong>：未知工具返回 <code>{&quot;error&quot;: True, ...}</code>，让模型生成用户友好的提示而不是程序崩溃</li><li><strong><code>temperature=0</code></strong>：两次调用都设 0，保证触发行为和最终回答的一致性，方便测试</li></ul>"}]},{"name":"添加简单界面","questions":[{"qnum":1,"qtext":"Streamlit 和 Gradio 分别适合什么场景？LLM Demo 应该选哪个？","answerHtml":"<p>这两个框架都是能把 Python 函数快速变成 Web 应用的工具，但侧重点不太一样。先说定位，Streamlit 更多是面向数据应用的，比如图表、报表、Dashboard 这类；Gradio 则是奔着 ML、AI 模型 Demo 去的，就是输入进去、推理一下、再把结果输出出来这种流程。聊天界面这块差别也很明显，Streamlit 得自己动手拿 <code>st.chat_message</code> 和 <code>st.chat_input</code> 一点点搭起来，而 Gradio 内置了 <code>gr.ChatInterface</code>，5 行代码就能搞定一个聊天界面。组件的丰富程度上，Streamlit 更全面一些，数据表格、图表、地图都有；Gradio 更专注在 AI 场景，比如 Image、Audio、Chatbot 这些组件。学习曲线上，Streamlit 会稍微陡一点，得理解它那套响应式重渲染的机制；Gradio 上手更容易，基本上函数签名写好了界面就自动生成了。流式输出这块，Streamlit 得用 <code>st.write_stream()</code>，Gradio 只要函数里用 <code>yield</code> 就能实现。</p><p><strong>结论</strong>：</p><ul><li>LLM 聊天/工具 Demo → <strong>Gradio</strong>（内置 ChatInterface，更少代码，更快展示）</li><li>数据分析/监控面板 → <strong>Streamlit</strong>（图表和布局更灵活）</li><li>两者差距不大，选你更熟悉的即可；Gradio 在 LLM Demo 场景的&quot;入门成本&quot;确实更低</li></ul>"},{"qnum":2,"qtext":"gr.Interface 和 gr.ChatInterface 有什么区别？各适用于什么场景？","answerHtml":"<p><code>gr.Interface</code> 和 <code>gr.ChatInterface</code> 适用的交互模式完全不一样。<code>gr.Interface</code> 面向的是一次性交互，单次输入换单次输出；<code>gr.ChatInterface</code> 面向的是多轮交互，能保持对话历史的那种聊天。历史管理上也不同，<code>gr.Interface</code> 不会自动管理历史，每次调用都是独立的，互不相关；<code>gr.ChatInterface</code> 会自动帮你维护一个 <code>history</code> 列表。函数签名写法也不一样：<code>gr.Interface</code> 是 <code>fn(input1, input2) → output</code> 这种形式，<code>gr.ChatInterface</code> 是 <code>fn(message, history) → reply</code>。内置界面上，<code>gr.Interface</code> 是把输入输出并排展示出来，<code>gr.ChatInterface</code> 则是气泡式的聊天窗口，配一个输入框。典型场景也分得很清楚，<code>gr.Interface</code> 适合文本摘要、情感分析、翻译这类一次性任务，<code>gr.ChatInterface</code> 就是给聊天机器人、对话式助手用的。</p><pre><code class=\"language-python\"># gr.Interface：一次性处理\ndef summarize(text):\n    return call_llm(f&quot;总结：{text}&quot;)\ngr.Interface(fn=summarize, inputs=&quot;textbox&quot;, outputs=&quot;textbox&quot;).launch()\n\n# gr.ChatInterface：多轮对话（Gradio 自动传入 history）\ndef chat(message, history):\n    messages = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是助手&quot;}]\n    messages += history\n    messages.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: message})\n    return call_llm(messages)\ngr.ChatInterface(fn=chat).launch()</code></pre><p>需要<strong>自定义布局</strong>（比如左侧聊天 + 右侧展示工具链）时，用 <code>gr.Blocks</code>，可以自由组合 <code>gr.Chatbot</code>、<code>gr.Textbox</code>、<code>gr.Markdown</code> 等组件。</p>"},{"qnum":3,"qtext":"如何在 Gradio 界面里实现流式输出？和非流式有什么体验差异？","answerHtml":"<p>Gradio 检测到函数是生成器（包含 <code>yield</code>）时自动开启流式模式：</p><pre><code class=\"language-python\"># 非流式：等待完整结果，文字一次性出现\ndef chat(message, history):\n    response = client.chat.completions.create(model=&quot;deepseek-chat&quot;, messages=...)\n    return response.choices[0].message.content   # return\n\n# 流式：文字逐渐出现（打字机效果）\ndef chat_stream(message, history):\n    stream = client.chat.completions.create(\n        model=&quot;deepseek-chat&quot;, messages=...,\n        stream=True,    # 关键：API 层开启流式\n    )\n    partial = &quot;&quot;\n    for chunk in stream:\n        delta = chunk.choices[0].delta.content\n        if delta:\n            partial += delta\n            yield partial   # 每个 chunk 都更新显示</code></pre><p><strong>体验差异</strong>：</p><pre><code>非流式：[等待 2 秒]……→ 完整文字突然出现\n流式：  文字逐字出现……体验更流畅，用户感知的等待时间更短</code></pre><p>流式输出的实际价值：长回答（&gt;200 字）时，用户不需要盯着空白屏幕等 2–3 秒，看到第一个字就知道在响应，心理等待感显著降低。</p>"},{"qnum":4,"qtext":"gr.State 是什么？为什么多轮对话需要它？不用会发生什么？","answerHtml":"<p><code>gr.State</code> 是 Gradio 的<strong>会话级持久化存储</strong>——每个用户 Tab 独立拥有一份，跨请求保持（HTTP 请求本身是无状态的，Gradio 在 WebSocket 层为每个 Session 维护 State）。</p><p><strong>不用 gr.State 时</strong>：每次用户发消息，函数收到的 <code>history</code> 都是空的——模型不记得之前的对话。</p><pre><code class=\"language-python\"># ❌ 不用 State：每次对话历史丢失\ndef chat(message, history):   # history 每次都是 []\n    ...\n\n# ✅ 用 gr.State：历史跨请求保持\nwith gr.Blocks() as demo:\n    messages_state = gr.State(value=None)   # 每个用户 Session 独立的 State\n    \n    def respond(user_msg, state):\n        if state is None:\n            state = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: &quot;你是助手&quot;}]\n        state.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_msg})\n        reply = call_llm(state)\n        state.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: reply})\n        return reply, state   # 必须 return 更新后的 state\n    \n    # outputs 里包含 messages_state，才能把更新后的值存回去\n    btn.click(respond, [msg_input, messages_state], [output, messages_state])</code></pre><p>关键规则：<code>gr.State</code> 的值通过函数的 <strong>return</strong> 传回，不能在函数内直接修改外部变量。</p>"},{"qnum":5,"qtext":"如何从零搭建一个展示工具调用链的 LLM Demo 界面？描述关键设计决策。","answerHtml":"<p>核心设计：<strong>gr.Blocks 自定义布局 + gr.State 保持历史 + 调用链格式化为 Markdown</strong>。</p><pre><code class=\"language-python\">with gr.Blocks() as demo:\n    messages_state = gr.State(value=None)   # 工作流消息历史\n    chain_state = gr.State(value=&quot;&quot;)        # 累积的调用链文本\n    \n    with gr.Row():\n        with gr.Column(scale=3):\n            chatbot = gr.Chatbot(type=&quot;messages&quot;)  # 左侧：对话\n            msg_input = gr.Textbox()\n        with gr.Column(scale=2):\n            chain_display = gr.Markdown()          # 右侧：工具调用链\n    \n    def respond(user_msg, chat_history, msgs, chain):\n        if not msgs:\n            msgs = [{&quot;role&quot;: &quot;system&quot;, &quot;content&quot;: SYSTEM_PROMPT}]\n        \n        # 执行多步工作流（Day 25 逻辑）\n        result, msgs = run_workflow(user_msg, msgs)\n        \n        chat_history.append({&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: user_msg})\n        chat_history.append({&quot;role&quot;: &quot;assistant&quot;, &quot;content&quot;: result.final_answer})\n        \n        # 把调用链格式化为 Markdown，追加到历史\n        chain_md = format_chain(result.steps)   # 每步 ToolStep → Markdown 文本\n        chain = (chain or &quot;&quot;) + f&quot;\\n\\n---\\n\\n{chain_md}&quot;\n        \n        return &quot;&quot;, chat_history, msgs, chain\n    \n    msg_input.submit(respond, [msg_input, chatbot, messages_state, chain_state],\n                               [msg_input, chatbot, messages_state, chain_state])\n    chain_state.change(lambda x: x, chain_state, chain_display)  # 同步显示</code></pre><p><strong>四个关键设计决策</strong>：</p><ul><li><strong>gr.Blocks 而非 ChatInterface</strong>：需要左右分栏（聊天 + 工具链）必须用 Blocks，ChatInterface 不支持自定义布局</li><li><strong>两个 State</strong>：<code>messages_state</code> 保存工作流历史（给模型用），<code>chain_state</code> 保存调用链文本（给 UI 展示用），职责分离</li><li><strong>chain_state.change 绑定</strong>：修改 State 不会自动刷新 UI，需要显式绑定 <code>chain_state → chain_display</code></li><li><strong>format_chain 函数</strong>：把 <code>WorkflowResult.steps</code> 格式化成可读 Markdown，包含工具名、参数、结果摘要，支持直接渲染</li></ul>"}]},{"name":"整合成完整作品","questions":[{"qnum":1,"qtext":"三选一项目方向（文档问答 / 客服助手 / 工具助理）各自侧重什么技术？如何选择？","answerHtml":"<p>三个方向在核心能力侧重、技术复杂度和适合人群上各不相同。本地文档问答助手侧重 RAG 全流程（Day 15–20）加界面，技术复杂度中等，适合 RAG 学得比较扎实的同学；企业知识库客服助手侧重 RAG 与 Tool Calling 的融合，技术复杂度高，适合有充裕时间、想展示更完整工程能力的同学；可调用工具的个人助理侧重 Tool Calling（Day 22–25）加界面，技术复杂度低到中，适合时间有限、或者 Day 22–26 学得更扎实的同学。</p><p><strong>选择原则</strong>：</p><ul><li>选你最近几天学得最扎实的方向，不要选&quot;看起来更酷&quot;但没认真学的方向</li><li>整合日的重点是<strong>项目结构规范化</strong>，而非技术难度，方向不是核心</li><li>如果时间不够 → 方向 C（技术栈最集中，Day 22–26 的直接成果）</li></ul>"},{"qnum":2,"qtext":"把多个 Day Demo 整合成一个项目时，目录结构应该怎么设计？各模块职责是什么？","answerHtml":"<pre><code>tool-assistant/\n├── app.py              ← 入口：只做 UI 绑定，不含业务逻辑\n├── core/\n│   ├── config.py       ← 统一配置（读 .env，暴露 CFG 对象）\n│   ├── client.py       ← LLM 客户端单例\n│   └── workflow.py     ← 多步工作流主逻辑\n├── tools/\n│   ├── __init__.py     ← ALL_TOOLS、TOOL_REGISTRY、dispatch()\n│   ├── weather.py      ← get_weather + SCHEMA\n│   └──
